# CLA check — contributor-assistant, signatures stored IN THIS REPO (no PAT needed).
# A contributor signs once, on their first PR, by replying:
#   I have read the CLA Document and I hereby sign the CLA
name: CLA
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize]
permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write
jobs:
  cla:
    runs-on: ubuntu-latest
    if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
    steps:
      - uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: '.github/cla-signatures.json'
          path-to-document: 'https://github.com/2nd1st/open-mcp-apps/blob/main/CLA.md'
          branch: 'main'
          allowlist: '2nd1st,dependabot[bot],github-actions[bot]'
