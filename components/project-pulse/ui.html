<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project Pulse</title>
<meta name="description" content="A project's heartbeat: fourteen days of shipped work traced like a pulse, with the Backlog / Doing / Done board beneath it.">
<meta name="oma-category" content="Work">
<style>
  /* Shared primitives (.k-*) — this app's own copy; nothing here comes from the engine. */
  :root{--k-accent:var(--color-text-info,var(--color-ring-primary,#3b6cf6));--k-ok:var(--color-text-success,#2e9e5b);--k-warn:var(--color-text-warning,#b98200);--k-bad:var(--color-text-danger,#e5484d);--k-ink-4:color-mix(in oklab,var(--color-text-primary) 4%,transparent);--k-accent-bg:color-mix(in oklab,var(--k-accent) 10%,transparent);--k-accent-brd:color-mix(in oklab,var(--k-accent) 28%,transparent);--k-hue-0:var(--k-accent);--k-s2:8px;--k-t-fast:120ms;--k-t:180ms;--k-t-slow:260ms;--k-ease:cubic-bezier(.2,.8,.3,1);--k-spring:cubic-bezier(.34,1.56,.64,1);--k-surface:var(--color-background-primary)}
  @media (prefers-reduced-motion:reduce){:root{--k-t-fast:0ms;--k-t:0ms;--k-t-slow:0ms}}
  .k-num{font-variant-numeric:tabular-nums}
  .k-row{display:flex;align-items:center;gap:var(--k-s2)}
  .k-grow{flex:1;min-width:0}
  .k-icon{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}
  .k-btn{display:inline-flex;align-items:center;gap:6px;border:1px solid transparent;border-radius:var(--border-radius-md,10px);padding:6px 12px;font:inherit;font-size:var(--font-text-sm-size,12.5px);font-weight:600;cursor:pointer;background:var(--color-background-inverse);color:var(--color-text-inverse);transition:transform var(--k-t-fast) var(--k-ease),opacity var(--k-t-fast),background var(--k-t-fast)}
  .k-btn:hover{opacity:.9}
  .k-btn:active{transform:scale(.96)}
  .k-btn:disabled{opacity:.45;cursor:default;transform:none}
  .k-btn.sec{background:transparent;color:var(--color-text-primary);border-color:var(--color-border-primary)}
  .k-btn.ghost{background:transparent;color:var(--color-text-secondary)}
  :is(.k-btn.sec,.k-btn.ghost):hover{background:var(--k-ink-4);color:var(--color-text-primary);opacity:1}
  .k-btn.danger{background:transparent;color:var(--k-bad);border-color:color-mix(in oklab,var(--k-bad) 30%,transparent)}
  .k-btn.danger:hover{background:color-mix(in oklab,var(--k-bad) 10%,transparent);opacity:1}
  :is(.k-btn,.k-tab,.k-chip,.k-switch,.k-field):focus-visible{outline:2px solid var(--color-ring-primary,var(--k-accent));outline-offset:1px}
  .k-dot{width:7px;height:7px;border-radius:50%;background:var(--k-hue-0);flex:none}
  .k-badge{display:inline-flex;align-items:center;gap:4px;border-radius:var(--border-radius-full,999px);padding:1px 8px;font-size:11px;font-weight:600;background:var(--k-ink-4);color:var(--color-text-secondary)}
  .k-badge.info{background:color-mix(in oklab,var(--k-accent) 10%,transparent);color:var(--k-accent)}
  .k-badge.ok{background:color-mix(in oklab,var(--k-ok) 12%,transparent);color:var(--k-ok)}
  .k-badge.warn{background:color-mix(in oklab,var(--k-warn) 14%,transparent);color:var(--k-warn)}
  .k-badge.bad{background:color-mix(in oklab,var(--k-bad) 12%,transparent);color:var(--k-bad)}
  .k-tabs{display:inline-flex;gap:2px;padding:3px;background:var(--color-background-secondary);border-radius:var(--border-radius-md,10px)}
  .k-tab{display:inline-flex;align-items:center;gap:6px;border:none;background:transparent;color:var(--color-text-secondary);cursor:pointer;font:inherit;font-size:var(--font-text-sm-size,12.5px);font-weight:550;padding:5px 12px;border-radius:var(--border-radius-sm,7px);transition:background var(--k-t) var(--k-ease),color var(--k-t)}
  .k-tab.on{background:var(--color-background-primary);color:var(--color-text-primary);box-shadow:var(--shadow-sm)}
  .k-field{padding:6px 10px;border-radius:var(--border-radius-md,10px);border:1px solid var(--color-border-primary);background:transparent;color:inherit;font:inherit;font-size:var(--font-text-sm-size,12.5px);transition:border-color var(--k-t-fast),box-shadow var(--k-t-fast)}
  .k-field::placeholder{color:var(--color-text-tertiary)}
  .k-field:focus{outline:none;border-color:var(--k-accent);box-shadow:0 0 0 3px color-mix(in oklab,var(--k-accent) 10%,transparent)}
  .k-appbar{display:flex;align-items:center;gap:11px;padding:13px 16px}
  .k-appbar .k-appmark{display:grid;width:34px;height:34px;flex:none;place-items:center;border-radius:11px}
  .k-appbar .k-appmark svg{width:18px;height:18px}
  .k-appbar .k-appcopy{min-width:0;flex:1}
  .k-appbar .k-eyebrow{display:block;margin:0;color:var(--color-text-tertiary);font-size:9.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
  .k-appbar h1{margin:1px 0 0;font-size:15px;font-weight:650;letter-spacing:-.015em}
  body:not(.standalone) .k-appbar{border-bottom:1px solid var(--color-border-secondary);background:var(--k-surface)}
  .k-stage{max-width:1120px;margin-inline:auto;overflow-x:clip}

  /* The signature is THE PULSE: fourteen days drawn as one heart-monitor trace. A tall spike is a
     day something shipped (a task landed in Done), a small ripple is a day tasks were only touched,
     and a flat line is a day nothing moved. Every number on the page comes from the same model()
     pass over the rows, so the big number can never disagree with the spikes. */
  .pp {
    --pp: light-dark(#a8306e, #f28dbd);
    --pp-on: light-dark(#ffffff, #2b0719);
    --k-accent: var(--pp);
    --k-accent-bg: color-mix(in oklab, var(--pp) 10%, transparent);
    --k-accent-brd: color-mix(in oklab, var(--pp) 30%, transparent);
  }

  button,
  input,
  textarea {
    font: inherit;
  }

  :focus-visible {
    outline: 2px solid var(--color-ring-primary, var(--pp));
    outline-offset: 2px;
  }

  /* ── app bar: mark · name · the AI hand-off ── */
  .pp-mark {
    color: var(--pp);
    border: 1px solid var(--k-accent-brd);
    background: var(--k-accent-bg);
  }

  .pp-mark svg,
  .ico {
    fill: none;
    stroke: currentColor;
    stroke-width: 1.7;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .pp-bar .k-btn {
    margin-left: auto;
    flex: none;
    white-space: nowrap;
  }

  .error-strip {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 10px 20px 0;
    padding: 8px 10px;
    border: 1px solid color-mix(in oklab, var(--color-text-danger) 32%, var(--color-border-secondary));
    border-radius: var(--border-radius-md, 10px);
    background: color-mix(in oklab, var(--color-text-danger) 8%, transparent);
    color: var(--color-text-danger);
    font-size: var(--font-text-sm-size, 12px);
  }

  .icon-only {
    width: 30px;
    height: 30px;
    padding: 0;
    justify-content: center;
    flex: none;
  }

  /* ── hero: the number, and the trace ── */
  .hero {
    display: grid;
    grid-template-columns: 176px minmax(0, 1fr);
    column-gap: 28px;
    align-items: start;
    padding: 20px 20px 18px;
  }

  .read {
    min-width: 0;
    padding-top: 2px;
  }

  .read-n {
    display: block;
    margin: 0;
    font-size: 68px;
    font-weight: 720;
    line-height: 0.92;
    letter-spacing: -0.04em;
  }

  .read-k {
    margin: 6px 0 0;
    font-size: 13px;
    font-weight: 600;
    line-height: 1.3;
  }

  .read-d {
    margin: 4px 0 0;
    color: var(--color-text-secondary);
    font-size: 12px;
    line-height: 1.4;
  }

  .read-d b {
    color: var(--pp);
    font-weight: 650;
  }

  .read-s {
    display: grid;
    gap: 5px;
    margin: 14px 0 0;
    padding: 12px 0 0;
    border-top: 1px solid var(--color-border-secondary);
    list-style: none;
    color: var(--color-text-secondary);
    font-size: 12px;
  }

  .read-s b {
    display: inline-block;
    min-width: 18px;
    color: var(--color-text-primary);
    font-weight: 650;
  }

  .read-s .quiet.on b {
    color: var(--color-text-warning, var(--k-warn));
  }

  .trace {
    min-width: 0;
    margin: 0;
  }

  .trace-box {
    position: relative;
    height: 150px;
    touch-action: pan-y;
  }

  .trace svg {
    display: block;
    width: 100%;
    height: 100%;
    overflow: visible;
  }

  .tr-base,
  .tr-week {
    stroke: var(--color-border-secondary);
    stroke-width: 1;
    vector-effect: non-scaling-stroke;
  }

  .tr-line,
  .tr-today {
    fill: none;
    stroke: var(--pp);
    stroke-width: 2.2;
    stroke-linejoin: round;
    stroke-linecap: round;
    vector-effect: non-scaling-stroke;
  }

  .tr-today {
    stroke-width: 2.4;
    transform-box: view-box;
    transform-origin: 1350px 118px;
  }

  /* The monitor's write-head: where the line is being drawn right now (today). A circle inside a
     stretched viewBox would be an ellipse, so it lives in HTML at the baseline's height. */
  .head {
    position: absolute;
    top: 79.7%;
    left: 100%;
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--pp);
    box-shadow: 0 0 0 3px color-mix(in oklab, var(--pp) 22%, transparent);
    transform: translate(-50%, -50%);
  }

  .plus {
    position: absolute;
    top: -2px;
    left: 96.4%;
    color: var(--pp);
    font-size: 13px;
    font-weight: 700;
    opacity: 0;
    transform: translateX(-50%);
    pointer-events: none;
  }

  .hover-col {
    position: absolute;
    top: 0;
    bottom: 0;
    width: calc(100% / 14);
    border-radius: 6px;
    background: color-mix(in oklab, var(--pp) 8%, transparent);
    pointer-events: none;
  }

  .days {
    display: grid;
    grid-template-columns: repeat(14, minmax(0, 1fr));
    margin-top: 6px;
    color: var(--color-text-secondary);
    font-size: 10.5px;
    text-align: center;
  }

  .days span.wk {
    color: var(--color-text-tertiary);
  }

  .days span.now {
    color: var(--pp);
    font-weight: 700;
  }

  .readout {
    min-height: 18px;
    margin-top: 8px;
    color: var(--color-text-secondary);
    font-size: 12px;
    line-height: 1.45;
  }

  .readout b {
    color: var(--color-text-primary);
    font-weight: 620;
  }

  /* ── empty state ── */
  .empty {
    margin: 0 20px 20px;
    padding: 16px;
    border: 1px dashed var(--color-border-primary);
    border-radius: var(--border-radius-lg, 12px);
  }

  .empty b {
    display: block;
    font-size: 14px;
  }

  .empty p {
    margin: 4px 0 12px;
    color: var(--color-text-secondary);
    font-size: 12.5px;
    line-height: 1.5;
  }

  .empty q {
    color: var(--color-text-primary);
  }

  .bulk {
    align-items: stretch;
  }

  .bulk .k-btn {
    justify-content: center;
  }

  .bulk textarea {
    width: 100%;
    min-height: 64px;
    resize: vertical;
    line-height: 1.4;
  }

  /* ── the board ── */
  .board-wrap {
    padding: 0 20px 20px;
  }

  .board-bar {
    display: none;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
  }

  .board-bar .k-tabs {
    flex: 1;
    min-width: 0;
  }

  .k-tab .n {
    margin-left: 5px;
    color: var(--color-text-tertiary);
    font-variant-numeric: tabular-nums;
  }

  .board {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 12px;
  }

  .lane {
    display: flex;
    flex-direction: column;
    min-width: 0;
    border: 1px solid var(--color-border-secondary);
    border-radius: var(--border-radius-lg, 12px);
    background: color-mix(in oklab, var(--color-background-secondary) 70%, transparent);
  }

  .lane.drag-over {
    border-color: var(--pp);
    background: color-mix(in oklab, var(--pp) 7%, var(--color-background-secondary));
  }

  .lane-head {
    display: flex;
    align-items: center;
    gap: 7px;
    min-height: 42px;
    padding: 6px 8px 6px 12px;
    font-size: 12.5px;
    font-weight: 650;
  }

  .lane-head .k-dot {
    background: var(--color-text-tertiary);
  }

  .lane[data-group="Doing"] .k-dot {
    background: var(--pp);
  }

  .lane[data-group="Done"] .k-dot {
    background: var(--color-text-secondary);
  }

  .lane-head .cnt {
    color: var(--color-text-tertiary);
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }

  .lane-head .k-btn {
    margin-left: auto;
  }

  .lane-body {
    display: grid;
    align-content: start;
    gap: 7px;
    max-height: 392px;
    min-height: 88px;
    overflow-y: auto;
    padding: 0 8px 8px;
  }

  .lane-empty {
    padding: 22px 8px;
    color: var(--color-text-tertiary);
    font-size: 12px;
    line-height: 1.45;
    text-align: center;
  }

  .task {
    position: relative;
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 8px;
    align-items: start;
    padding: 10px 8px 10px 12px;
    border: 1px solid var(--color-border-secondary);
    border-radius: var(--border-radius-md, 10px);
    background: var(--color-background-primary);
    cursor: pointer;
  }

  .task:hover {
    border-color: var(--color-border-primary);
  }

  .task.dragging {
    opacity: 0.5;
  }

  .task.pending {
    opacity: 0.78;
  }

  /* A task that has sat in Doing past the stale threshold goes cold: dashed edge, a "quiet" badge. */
  .task.cold {
    border-style: dashed;
    border-color: color-mix(in oklab, var(--color-text-warning, var(--k-warn)) 45%, var(--color-border-secondary));
  }

  .t-title {
    display: block;
    font-size: 13px;
    font-weight: 600;
    line-height: 1.38;
    overflow-wrap: anywhere;
  }

  .t-note {
    margin: 4px 0 0;
    color: var(--color-text-secondary);
    font-size: 12px;
    line-height: 1.45;
    overflow-wrap: anywhere;
  }

  .t-meta {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 5px 7px;
    margin-top: 7px;
    color: var(--color-text-tertiary);
    font-size: 11px;
  }

  .t-tag {
    color: var(--color-text-secondary);
    font-weight: 560;
    overflow-wrap: anywhere;
  }

  .t-when {
    margin-left: auto;
    white-space: nowrap;
  }

  .t-act {
    width: 28px;
    height: 28px;
    padding: 0;
    justify-content: center;
    border-radius: 50%;
  }

  .t-act svg {
    width: 15px;
    height: 15px;
  }

  /* The one action that matters: finishing a Doing task. */
  .t-act.finish {
    border: 1.5px solid var(--pp);
    background: transparent;
    color: var(--pp);
  }

  .t-act.finish:hover {
    background: var(--pp);
    color: var(--pp-on);
    opacity: 1;
  }

  .task[data-lane="Done"] {
    padding-block: 8px;
  }

  .task[data-lane="Done"] .t-title {
    color: var(--color-text-secondary);
    font-weight: 560;
  }

  .task[data-lane="Done"] .t-when {
    color: var(--pp);
  }

  .task[data-lane="Done"] .t-act {
    color: var(--color-text-tertiary);
  }

  .task.landed {
    border-color: var(--pp);
    box-shadow: 0 0 0 3px var(--k-accent-bg);
  }

  /* ── editor ── */
  .modal {
    position: fixed;
    inset: 0;
    z-index: 20;
    display: grid;
    place-items: center;
    padding: 18px;
    background: color-mix(in oklab, var(--color-text-primary) 20%, transparent);
  }

  .panel {
    width: min(440px, 100%);
    padding: 16px;
    border: 1px solid var(--color-border-primary);
    border-radius: var(--border-radius-lg, 12px);
    background: var(--color-background-primary);
    box-shadow: var(--shadow-md, var(--shadow-sm));
  }

  .panel h2 {
    margin: 0;
    font-size: 16px;
  }

  .fld {
    display: grid;
    gap: 5px;
    margin-top: 12px;
  }

  .fld label {
    color: var(--color-text-secondary);
    font-size: 11.5px;
    font-weight: 600;
  }

  .fld textarea {
    min-height: 84px;
    resize: vertical;
    line-height: 1.45;
  }

  .panel-foot {
    margin-top: 16px;
  }

  .pp .k-btn:not(.sec):not(.ghost):not(.danger):not(.t-act) {
    background: var(--pp);
    color: var(--pp-on);
  }

  .compact .hero {
    padding-block: 14px 12px;
  }

  .compact .task {
    padding-block: 7px;
  }

  .compact .lane-body {
    gap: 5px;
  }

  /* ── phone: number above the trace; the board becomes tabs, never a sideways scroll ── */
  @media (max-width: 560px) {
    .error-strip {
      margin-inline: 16px;
    }

    .hero {
      grid-template-columns: minmax(0, 1fr);
      row-gap: 16px;
      padding: 16px 16px 12px;
    }

    .read {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      column-gap: 16px;
      align-items: end;
    }

    .read-n {
      font-size: 56px;
    }

    .read-s {
      grid-row: 1 / span 3;
      grid-column: 2;
      align-self: end;
      margin: 0;
      padding: 0 0 0 14px;
      border-top: 0;
      border-left: 1px solid var(--color-border-secondary);
    }

    .trace-box {
      height: 112px;
    }

    .days {
      font-size: 10px;
    }

    .board-wrap {
      padding: 0 16px 16px;
    }

    .empty {
      margin: 0 16px 16px;
    }

    .board-bar {
      display: flex;
    }

    .board {
      grid-template-columns: minmax(0, 1fr);
    }

    .lane-head {
      display: none;
    }

    .lane-body {
      max-height: 470px;
      padding-top: 8px;
    }

    .board[data-view="Backlog"] .lane:not([data-group="Backlog"]),
    .board[data-view="Doing"] .lane:not([data-group="Doing"]),
    .board[data-view="Done"] .lane:not([data-group="Done"]) {
      display: none;
    }

    .bulk {
      flex-direction: column;
    }

    .modal {
      align-items: end;
      padding: 10px;
    }
  }

  @media (prefers-reduced-motion: no-preference) {
    .task {
      transition: border-color var(--k-t) var(--k-ease), box-shadow var(--k-t-slow) var(--k-ease), opacity var(--k-t) var(--k-ease);
    }

    .t-act.finish {
      transition: background var(--k-t-fast) var(--k-ease), color var(--k-t-fast) var(--k-ease), transform var(--k-t-fast) var(--k-ease);
    }

    .t-act.finish:active {
      transform: scale(0.9);
    }

    .trace.enter .tr-line,
    .trace.enter .tr-today {
      stroke-dasharray: 1;
      animation: pp-draw 900ms var(--k-ease) both;
    }

    .trace.enter .head {
      animation: pp-fade 300ms 800ms var(--k-ease) both;
    }

    .tr-today.beat {
      animation: pp-beat 720ms var(--k-spring) both;
    }

    .head.beat {
      animation: pp-ping 760ms var(--k-ease);
    }

    .plus.beat {
      animation: pp-rise 1000ms var(--k-ease);
    }

    .pop {
      display: inline-block;
      animation: pp-pop 420ms var(--k-spring);
    }

    .panel {
      animation: pp-in 180ms var(--k-spring) both;
    }

    @keyframes pp-draw {
      from { stroke-dashoffset: 1; }
      to { stroke-dashoffset: 0; }
    }

    @keyframes pp-fade {
      from { opacity: 0; }
    }

    @keyframes pp-beat {
      0% { transform: scaleY(var(--from, 0.3)); }
      45% { transform: scaleY(1.16); }
      70% { transform: scaleY(0.94); }
      100% { transform: scaleY(1); }
    }

    @keyframes pp-ping {
      0% { box-shadow: 0 0 0 0 color-mix(in oklab, var(--pp) 55%, transparent); }
      100% { box-shadow: 0 0 0 16px color-mix(in oklab, var(--pp) 0%, transparent); }
    }

    @keyframes pp-rise {
      0% { opacity: 0; transform: translate(-50%, 10px); }
      25% { opacity: 1; }
      70% { opacity: 1; }
      100% { opacity: 0; transform: translate(-50%, -14px); }
    }

    @keyframes pp-pop {
      40% { transform: scale(1.12); }
    }

    @keyframes pp-in {
      from { opacity: 0; transform: translateY(8px) scale(0.985); }
    }
  }
</style>
</head>
<body>
<main class="k-stage pp">
  <header class="k-appbar pp-bar">
    <span class="k-appmark pp-mark" aria-hidden="true">

<script type="module">
  const oma = window.oma;
  const STR = {
    en: {
      appName: "Project Pulse",

      shipped14: "shipped in the last 14 days",

      bulkPlaceholder: "Rewrite the homepage story\nAdd preview deploys\nCheck mobile performance",
      bulkAria: "Tasks, one per line",
      addBacklog: "Add to Backlog",
      modalNew: "New task",
      modalEdit: "Edit task",
      titleLabel: "Title",
      tagLabel: "Tag",
      notesLabel: "Notes",
      tagPlaceholder: "Frontend, content, launch…",
      notePlaceholder: "The next step, or what it depends on",
      cancel: "Cancel",
      delete: "Delete",
      saveNew: "Add to Backlog",
      saveEdit: "Save",
      close: "Close",
      triage: "Triage",
      moveFailed: "That move didn't save — the task is back where it was.",
      stampFailed: "The task moved, but its date didn't save. Edit it once more to fix the pulse.",
      saveFailed: "That didn't save. Try again.",
      removed: "This task was removed elsewhere, so the editor closed.",
      bulkFailed: "{n} tasks didn't save and are still in the box.",
      askFailed: "Couldn't reach the assistant — try again.",
      briefPrompt: "Write a short brief on my Project Pulse board: use data_changes to separate my updates from yours, then summarise what shipped in the last 14 days, what's in progress, anything that has gone quiet, and the next step. Don't change any data."
    },
    zh: {
      appName: "项目脉搏",
      brief: "AI 周报",
      shipped14: "近 14 天完成",
      deltaUp: "比前 14 天多 <b>{n}</b> 件",
      deltaDown: "比前 14 天少 <b>{n}</b> 件",
      deltaSame: "与前 14 天持平",
      inProgress: "进行中",
      goneQuiet: "沉寂",
      waiting: "待办",
      traceAria: "近 14 天动态：{d} 天里完成了 {n} 件任务",
      today: "今天",
      yesterday: "昨天",
      shipOne: "<b>完成 1 件</b>",
      shipN: "<b>完成 {n} 件</b>",
      touched: "动过 {n} 条",
      flat: "平线，没有动静",
      flatFor: "已经 <b>{n} 天</b>是平线，上一次跳动在 {date}",
      noBeat: "还没有心跳。任务进入「已完成」的那天，线会跳起来。",
      Backlog: "待办",
      Doing: "进行中",
      Done: "已完成",
      boardAria: "项目看板",
      newTask: "新任务",
      start: "开始：{title}",
      finish: "完成：{title}",
      reopen: "重新打开：{title}",
      quietFor: "沉寂 {n} 天",
      quietTitle: "{n} 天没有更新",
      shippedOn: "{date}完成",
      uncategorized: "未分类",
      untitled: "未命名任务",
      otherGroup: "来自「{g}」",
      backlogEmpty: "没有待办。新任务会落在这里。",
      doingEmpty: "没有进行中的任务——从待办里开始一件。",
      doneEmpty: "完成的任务落在这里，也落在脉搏上。",
      emptyTitle: "把你正在推进的项目放上来",
      emptyBody: "一行一条贴进来，或者跟 AI 说：",
      emptySay: "把我的项目拆成任务，放进项目脉搏。",
      bulkPlaceholder: "重写首页文案\n接入预览部署\n检查移动端性能",
      bulkAria: "任务，一行一条",
      addBacklog: "放进待办",
      modalNew: "新任务",
      modalEdit: "编辑任务",
      titleLabel: "标题",
      tagLabel: "标签",
      notesLabel: "备注",
      tagPlaceholder: "前端、内容、上线…",
      notePlaceholder: "下一步，或者它卡在什么上",
      cancel: "取消",
      delete: "删除",
      saveNew: "放进待办",
      saveEdit: "保存",
      close: "关闭",
      triage: "待整理",
      moveFailed: "移动没有保存，任务已回到原处。",
      stampFailed: "任务已移动，但时间没写进去；再编辑一次就能补上脉搏。",
      saveFailed: "没有保存成功，请重试。",
      removed: "这条任务已在别处删除，编辑已关闭。",
      bulkFailed: "{n} 条没有保存，仍留在输入框里。",
      askFailed: "没能联系上助手，请重试。",
      briefPrompt: "给我的「项目脉搏」看板写个简短周报：用 data_changes 区分我和你的改动，概括近 14 天完成了什么、正在做什么、哪些任务沉寂了，以及下一步。不要改任何数据。"
    }
  };

  const GROUPS = ["Backlog", "Doing", "Done"];
  const B = 118;               // the trace's baseline, in viewBox units (0 0 1400 148)
  const $ = (id) => document.getElementById(id);
  const narrow = matchMedia("(max-width: 560px)");
  const calm = matchMedia("(prefers-reduced-motion: reduce)");

  let latest = { items: [] };
  let M = null;                 // the last model, for the hover readout
  let hoverIdx = -1;
  let prevTodayShip = null;     // null until the first render: the first paint never "beats"
  let view = "Doing";
  let editingId = null;
  let dragId = null;
  let lastDay = localISO(new Date());
  let errTimer = 0;
  // Optimistic overlay: a move shows at once; the entry is dropped when the store's own state
  // arrives carrying it (or the write is refused and the task snaps back).
  const overlay = new Map();    // id → { group, fields, acked }
  const cards = new Map();      // id → element, reused across renders (update in place)
  const empties = new Map();

  // ── time: facts are stored, judgments are computed here ──
  function localISO(d) {
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  }
  const dateOnly = (iso) => { const [y, m, d] = String(iso).slice(0, 10).split("-").map(Number); return new Date(y, m - 1, d); };
  const today = () => { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); };
  const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
  const daysSince = (day) => Math.round((today() - dateOnly(day)) / 86400000);

  // The LOCAL day a timestamp fell on. Slicing "2026-08-06T00:30:00.000Z" to ten characters gives
  // the UTC day — for half the planet, yesterday's column (the old pulse did exactly that).
  function dayOf(iso) {
    if (typeof iso !== "string" || !iso) return "";
    if (/^\d{4}-\d{2}-\d{2}$/.test(iso)) return iso;
    const t = Date.parse(iso);
    if (Number.isFinite(t)) return localISO(new Date(t));
    return /^\d{4}-\d{2}-\d{2}/.test(iso) ? iso.slice(0, 10) : "";
  }

  // Written with the local offset, so the stored fact reads the same to a person and to the AI.
  function stamp() {
    const d = new Date();
    const off = -d.getTimezoneOffset();
    const p = (n) => String(Math.floor(Math.abs(n))).padStart(2, "0");
    return `${localISO(d)}T${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}${off >= 0 ? "+" : "-"}${p(off / 60)}:${p(off % 60)}`;
  }

  // ── i18n ──
  function localeCode() {
    const v = String(oma.pref("locale", "auto") || "auto");
    return v === "auto" ? String(navigator.language || "en") : v;
  }
  const lang = () => (localeCode().toLowerCase().startsWith("zh") ? "zh" : "en");
  function t(key, vals = {}) {
    const s = STR[lang()][key] ?? STR.en[key] ?? key;
    return String(s).replace(/\{(\w+)\}/g, (_, k) => (vals[k] === undefined ? "" : String(vals[k])));
  }
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  const num = (n) => new Intl.NumberFormat(localeCode()).format(n);

  function fmtDay(day) {
    const d = dateOnly(day);
    if (Number.isNaN(d.getTime())) return "";
    const pref = oma.pref("date_format", "auto");
    const y = d.getFullYear(), m = String(d.getMonth() + 1).padStart(2, "0"), dd = String(d.getDate()).padStart(2, "0");
    if (pref === "yyyy-mm-dd") return `${y}-${m}-${dd}`;
    if (pref === "dd/mm/yyyy") return `${dd}/${m}`;
    if (pref === "mm/dd/yyyy") return `${m}/${dd}`;
    return new Intl.DateTimeFormat(localeCode(), { month: "short", day: "numeric" }).format(d);
  }

  function dayName(day, idx) {
    if (idx === 13) return t("today");
    if (idx === 12) return t("yesterday");
    const wd = new Intl.DateTimeFormat(localeCode(), { weekday: "short" }).format(dateOnly(day));
    return `${wd} ${fmtDay(day)}`;
  }

  function relAge(day) {
    const n = daysSince(day);
    return new Intl.RelativeTimeFormat(localeCode(), { numeric: "auto" }).format(-n, "day");
  }

  let i18nLang = "";
  function applyI18n() {
    const l = lang();
    if (l === i18nLang) return;
    i18nLang = l;
    document.documentElement.lang = l === "zh" ? "zh-CN" : "en";
    document.title = t("appName");
    for (const n of document.querySelectorAll("[data-i18n]")) n.textContent = t(n.dataset.i18n);
    for (const n of document.querySelectorAll("[data-i18n-placeholder]")) n.placeholder = t(n.dataset.i18nPlaceholder);
    for (const n of document.querySelectorAll("[data-i18n-aria-label]")) n.setAttribute("aria-label", t(n.dataset.i18nAriaLabel));
    for (const n of document.querySelectorAll("[data-i18n-title]")) n.title = t(n.dataset.i18nTitle);
    cards.forEach((el) => { el.dataset.mode = ""; });
  }

  // ── the model: one pass, every number and every spike ──
  const text = (r, k) => (typeof r.fields?.[k] === "string" ? r.fields[k] : "");

  function model(state) {
    const rows = (Array.isArray(state.items) ? state.items : []).map((it) => {
      const o = overlay.get(it.id);
      return o ? { ...it, group: o.group, fields: { ...it.fields, ...o.fields } } : { ...it };
    });
    const t0 = today();
    const days = [];
    for (let k = 13; k >= 0; k--) days.push(localISO(addDays(t0, -k)));
    const at = new Map(days.map((d, i) => [d, i]));
    const prevFrom = localISO(addDays(t0, -27));
    const ship = new Array(14).fill(0);
    const touch = new Array(14).fill(0);
    let prevShip = 0;
    let lastBeat = "";
    const stale = Number(oma.pref("stale_days", 7)) || 7;
    const lanes = { Backlog: [], Doing: [], Done: [] };
    const other = [];
    let quiet = 0;

    for (const r of rows) {
      const upd = dayOf(r.fields?.updated_at);
      const shipDay = r.group === "Done" ? dayOf(r.fields?.done_at) || upd : "";
      if (shipDay) {
        if (at.has(shipDay)) ship[at.get(shipDay)]++;
        else if (shipDay >= prevFrom && shipDay < days[0]) prevShip++;
      }
      // A touch is a task's last update that was not its own completion.
      if (upd && upd !== shipDay && at.has(upd)) touch[at.get(upd)]++;
      for (const d of [upd, shipDay]) if (d && d > lastBeat && d <= days[13]) lastBeat = d;
      if (GROUPS.includes(r.group)) lanes[r.group].push(r);
      else other.push(r);        // an unknown group is shown in Backlog, never dropped
      if (r.group === "Doing") {
        r.quiet = upd ? daysSince(upd) : Infinity;
        if (r.quiet > stale) quiet++;
      }
    }
    const byPos = (a, b) => a.position - b.position || String(a.id).localeCompare(String(b.id));
    lanes.Backlog.sort(byPos);
    other.sort(byPos);
    lanes.Backlog.push(...other);
    lanes.Doing.sort(byPos);
    const shipT = (r) => Date.parse(text(r, "done_at") || text(r, "updated_at")) || 0;
    lanes.Done.sort((a, b) => shipT(b) - shipT(a) || byPos(a, b));
    return {
      rows, days, ship, touch, prevShip, lastBeat, stale, lanes, quiet,
      ship14: ship.reduce((a, b) => a + b, 0),
      shipMax: Math.max(2, ...ship)
    };
  }

  // ── the trace ──
  const spike = (m, i) => (m.ship[i] ? 30 + 70 * (m.ship[i] / m.shipMax) : m.touch[i] ? 13 : 0);

  function complex(m, i) {
    const x = i * 100;
    const r = spike(m, i);
    if (!r) return `L${x + 100} ${B}`;
    const s = m.ship[i] ? 14 : 3;
    const tw = m.touch[i] ? 6 + 4 * Math.min(m.touch[i], 3) : 5;
    return [
      `L${x + 24} ${B}`, `Q${x + 30} ${B - 13} ${x + 36} ${B}`,
      `L${x + 44} ${B}`, `L${x + 46.5} ${B + 5}`, `L${x + 50} ${B - r}`, `L${x + 53.5} ${B + s}`,
      `L${x + 57} ${B}`, `L${x + 63} ${B}`, `Q${x + 72} ${B - tw * 2} ${x + 81} ${B}`, `L${x + 100} ${B}`
    ].join(" ");
  }

  let daysBuilt = false;
  function renderTrace(m) {
    let d = `M0 ${B}`;
    for (let i = 0; i < 13; i++) d += " " + complex(m, i);
    $("trLine").setAttribute("d", d);
    $("trToday").setAttribute("d", `M1300 ${B} ` + complex(m, 13));
    $("weeks").innerHTML = m.days
      .map((day, i) => (i && dateOnly(day).getDay() === 1 ? `<line class="tr-week" x1="${i * 100}" y1="10" x2="${i * 100}" y2="${B}"/>` : ""))
      .join("");
    const box = $("days");
    if (!daysBuilt) {
      box.innerHTML = "<span></span>".repeat(14);
      daysBuilt = true;
    }
    m.days.forEach((day, i) => {
      const el = box.children[i];
      const wd = dateOnly(day).getDay();
      el.textContent = String(dateOnly(day).getDate());
      el.className = i === 13 ? "now" : wd === 0 || wd === 6 ? "wk" : "";
    });
    const active = m.ship.filter((n, i) => n || m.touch[i]).length;
    $("traceSvg").setAttribute("aria-label", t("traceAria", { n: num(m.ship14), d: num(active) }));
    readout(m);
  }

  function readout(m) {
    const el = $("readout");
    const col = $("hoverCol");
    if (hoverIdx >= 0) {
      col.hidden = false;
      col.style.left = `${(hoverIdx * 100) / 14}%`;
    } else {
      col.hidden = true;
    }
    if (hoverIdx < 0 && !m.lastBeat) {
      el.textContent = t("noBeat");
      return;
    }
    if (hoverIdx < 0 && daysSince(m.lastBeat) >= 3) {
      el.innerHTML = t("flatFor", { n: num(daysSince(m.lastBeat)), date: esc(fmtDay(m.lastBeat)) });
      return;
    }
    const i = hoverIdx < 0 ? 13 : hoverIdx;
    const parts = [];
    if (m.ship[i]) parts.push(t(m.ship[i] === 1 ? "shipOne" : "shipN", { n: num(m.ship[i]) }));
    if (m.touch[i]) parts.push(esc(t("touched", { n: num(m.touch[i]) })));
    if (!parts.length) parts.push(esc(t("flat")));
    el.innerHTML = `${esc(dayName(m.days[i], i))} · ${parts.join(" · ")}`;
  }

  function restart(el, cls) {
    el.classList.remove(cls);
    void el.getBoundingClientRect();
    el.classList.add(cls);
  }

  // The delight: today's spike springs up from its old height, the head pings, "+1" rises.
  function beat(fromRatio) {
    const td = $("trToday");
    td.style.setProperty("--from", String(Math.max(0.05, Math.min(1, fromRatio))));
    restart(td, "beat");
    restart($("head"), "beat");
    restart($("plus"), "beat");
    restart($("nShip"), "pop");
  }

  function renderHero(m) {
    $("nShip").textContent = num(m.ship14);
    const diff = m.ship14 - m.prevShip;
    const delta = $("delta");
    if (!m.ship14 && !m.prevShip) delta.textContent = "";
    else if (diff > 0) delta.innerHTML = t("deltaUp", { n: num(diff) });
    else if (diff < 0) delta.innerHTML = t("deltaDown", { n: num(-diff) });
    else delta.textContent = t("deltaSame");
    $("nDoing").textContent = num(m.lanes.Doing.length);
    $("nQuiet").textContent = num(m.quiet);
    $("quietLi").classList.toggle("on", m.quiet > 0);
    $("nWait").textContent = num(m.lanes.Backlog.length);
    renderTrace(m);
    const now = m.ship[13];
    if (prevTodayShip !== null && now > prevTodayShip) {
      const prevM = { ...m, ship: [...m.ship] };
      prevM.ship[13] = prevTodayShip;
      beat(spike(prevM, 13) / spike(m, 13));
    }
    prevTodayShip = now;
  }

  // ── the board: cards are kept and updated in place, never rebuilt ──
  const ICON = {
    Backlog: "M3 8h9M8.5 4.5 12 8l-3.5 3.5",
    Doing: "M3.8 8.4l2.7 2.7 5.7-6.2",
    Done: "M5.5 4 3 6.5 5.5 9M3.4 6.5h6.1a3 3 0 0 1 0 6H7"
  };

  function makeCard(id) {
    const el = document.createElement("article");
    el.className = "task";
    el.dataset.id = id;
    el.tabIndex = 0;
    el.draggable = true;
    el.innerHTML = `<div class="t-body"><span class="t-title"></span><p class="t-note"></p>
      <div class="t-meta"><span class="t-tag"></span><span class="k-badge t-from"></span><span class="k-badge warn t-quiet"></span><span class="t-when k-num"></span></div></div>
      <button class="k-btn ghost t-act" type="button"><svg class="k-icon ico" viewBox="0 0 16 16" aria-hidden="true"><path/></svg></button>`;
    el.querySelector(".t-act").onclick = (e) => {
      e.stopPropagation();
      const lane = el.dataset.lane;
      move(id, lane === "Backlog" ? "Doing" : lane === "Doing" ? "Done" : "Doing");
    };
    el.onclick = () => openEditor(id);
    el.onkeydown = (e) => {
      if (e.target === el && (e.key === "Enter" || e.key === " ")) {
        e.preventDefault();
        openEditor(id);
      }
    };
    el.ondragstart = (e) => {
      dragId = id;
      e.dataTransfer.effectAllowed = "move";
      e.dataTransfer.setData("text/plain", id);
      requestAnimationFrame(() => el.classList.add("dragging"));
    };
    el.ondragend = () => {
      dragId = null;
      el.classList.remove("dragging");
      document.querySelectorAll(".lane.drag-over").forEach((l) => l.classList.remove("drag-over"));
    };
    cards.set(id, el);
    return el;
  }

  function fillCard(el, r, lane, m) {
    const title = text(r, "title") || t("untitled");
    const q = (s) => el.querySelector(s);
    el.dataset.lane = lane;
    q(".t-title").textContent = title;
    const note = text(r, "note");
    const showNote = lane === "Doing" && note && oma.pref("show_notes", true);
    q(".t-note").textContent = showNote ? note : "";
    q(".t-note").hidden = !showNote;
    q(".t-tag").textContent = text(r, "tag") || t("uncategorized");
    const from = q(".t-from");
    from.hidden = GROUPS.includes(r.group);
    from.textContent = from.hidden ? "" : t("otherGroup", { g: r.group });
    const upd = dayOf(r.fields?.updated_at);
    const cold = lane === "Doing" && r.quiet > m.stale;
    const quiet = q(".t-quiet");
    quiet.hidden = !cold;
    if (cold) {
      const n = Number.isFinite(r.quiet) ? r.quiet : m.stale + 1;
      quiet.textContent = t("quietFor", { n: num(n) });
      quiet.title = t("quietTitle", { n: num(n) });
    }
    const when = q(".t-when");
    const shipDay = dayOf(r.fields?.done_at) || upd;
    when.textContent = lane === "Done"
      ? (shipDay ? t("shippedOn", { date: daysSince(shipDay) === 0 ? t("today").toLowerCase() : fmtDay(shipDay) }) : "")
      : cold || !upd ? "" : relAge(upd);
    el.classList.toggle("cold", cold);
    el.classList.toggle("pending", overlay.has(r.id) && !overlay.get(r.id).acked);
    const act = q(".t-act");
    act.setAttribute("aria-label", t(lane === "Backlog" ? "start" : lane === "Doing" ? "finish" : "reopen", { title }));
    act.title = act.getAttribute("aria-label");
    if (el.dataset.mode !== lane) {
      el.dataset.mode = lane;
      act.classList.toggle("finish", lane === "Doing");
      q(".t-act path").setAttribute("d", ICON[lane]);
    }
  }

  function laneEmpty(group) {
    if (!empties.has(group)) {
      const el = document.createElement("div");
      el.className = "lane-empty";
      empties.set(group, el);
    }
    const el = empties.get(group);
    el.textContent = t(group === "Backlog" ? "backlogEmpty" : group === "Doing" ? "doingEmpty" : "doneEmpty");
    return el;
  }

  function renderBoard(m) {
    const seen = new Set();
    for (const g of GROUPS) {
      const body = document.querySelector(`[data-body="${g}"]`);
      const want = m.lanes[g].map((r) => {
        seen.add(r.id);
        const el = cards.get(r.id) || makeCard(r.id);
        fillCard(el, r, g, m);
        return el;
      });
      if (!want.length) want.push(laneEmpty(g));
      want.forEach((el, i) => {
        if (body.children[i] !== el) body.insertBefore(el, body.children[i] || null);
      });
      while (body.children.length > want.length) body.lastElementChild.remove();
      const n = num(m.lanes[g].length);
      document.querySelector(`[data-cnt="${g}"]`).textContent = n;
      document.querySelector(`[data-tabn="${g}"]`).textContent = n;
    }
    for (const [id, el] of cards) {
      if (!seen.has(id)) {
        el.remove();
        cards.delete(id);
      }
    }
    const board = $("board");
    board.dataset.view = view;
    for (const tab of document.querySelectorAll("[data-tab]")) {
      const on = tab.dataset.tab === view;
      tab.classList.toggle("on", on);
      tab.setAttribute("aria-selected", String(on));
    }
  }

  function render(state) {
    latest = state || latest;
    applyI18n();
    document.body.classList.toggle("compact", oma.pref("density", "comfortable") === "compact");
    const m = model(latest);
    M = m;
    const none = m.rows.length === 0;
    $("empty").hidden = !none;
    $("boardWrap").hidden = none;
    renderHero(m);
    renderBoard(m);
    if (editingId && !m.rows.some((r) => r.id === editingId)) {
      closeEditor();
      showError(t("removed"));
    }
  }

  function reconcile(state) {
    const byId = new Map((state.items || []).map((it) => [it.id, it]));
    for (const [id, o] of overlay) {
      const real = byId.get(id);
      // Not "acked ⇒ drop": a move is TWO writes, and a snapshot can land between them (group
      // moved, stamp not yet) — dropping there would un-ship the task for a frame and beat twice.
      const matched = real && real.group === o.group && real.fields?.updated_at === o.fields.updated_at;
      if (!real || matched || (o.ackedAt && Date.now() - o.ackedAt > 4000)) overlay.delete(id);
    }
  }

  // ── writes ──
  function showError(msg) {
    clearTimeout(errTimer);
    $("errorText").textContent = msg;
    $("errorStrip").hidden = false;
    errTimer = setTimeout(() => { $("errorStrip").hidden = true; }, 7000);
  }
  function clearError() {
    clearTimeout(errTimer);
    $("errorStrip").hidden = true;
  }
  const failed = (a) => !a || a.ok === false || a.isError === true;
  const why = (a, fallback) => (a && (a.note || a.reason) ? String(a.note || a.reason) : fallback);

  async function move(id, target) {
    const row = M && M.rows.find((r) => r.id === id);
    if (!row || row.group === target || (overlay.has(id) && !overlay.get(id).acked)) return;
    clearError();
    const now = stamp();
    const fields = { updated_at: now, done_at: target === "Done" ? now : null };
    const el = cards.get(id);
    const before = el && el.offsetParent ? el.getBoundingClientRect() : null;
    overlay.set(id, { group: target, fields, acked: false });
    render(latest);
    land(el, before, target);
    let ok = false;
    try {
      const a = await oma.moveItem(id, target);
      if (failed(a)) {
        showError(why(a, t("moveFailed")));
      } else {
        ok = true;
        const b = await oma.updateItem(id, fields);
        if (failed(b)) {
          overlay.delete(id);
          showError(why(b, t("stampFailed")));
        }
      }
    } catch (e) {
      showError(e?.message || t("moveFailed"));
    }
    const o = overlay.get(id);
    if (ok && o) {
      o.acked = true;
      o.ackedAt = Date.now();
    }
    if (!ok) overlay.delete(id);
    render(latest);
  }

  // FLIP: the card flies from where it was to where it now sits, and lands.
  function land(el, before, target) {
    if (!el) return;
    if (target === "Done") restart(el, "landed");
    setTimeout(() => el.classList.remove("landed"), 1200);
    if (narrow.matches && target !== view) {
      const tab = document.querySelector(`[data-tabn="${target}"]`);
      if (!calm.matches) restart(tab, "pop");
      return;
    }
    if (!before || !el.offsetParent || calm.matches || !el.animate) return;
    const after = el.getBoundingClientRect();
    const dx = before.left - after.left;
    const dy = before.top - after.top;
    if (Math.abs(dx) + Math.abs(dy) < 2) return;
    // A lane scrolls, so it clips: the card that flies across lanes is a fixed ghost above the
    // board, and the real one appears in its slot when the ghost touches down.
    const ghost = el.cloneNode(true);
    Object.assign(ghost.style, {
      position: "fixed", left: `${after.left}px`, top: `${after.top}px`, width: `${after.width}px`,
      margin: "0", zIndex: "30", pointerEvents: "none"
    });
    ghost.classList.remove("pending");
    document.querySelector("main.k-stage").append(ghost);
    el.style.visibility = "hidden";
    const done = () => {
      ghost.remove();
      el.style.visibility = "";
    };
    const anim = ghost.animate(
      [{ transform: `translate(${dx}px, ${dy}px) scale(1.02)` }, { transform: "none" }],
      { duration: 460, easing: "cubic-bezier(.2, 1.3, .4, 1)" }
    );
    anim.onfinish = done;
    anim.oncancel = done;
  }

  // ── editor ──
  const modal = $("modal");
  function openEditor(id) {
    const r = id && M ? M.rows.find((x) => x.id === id) : null;
    editingId = r ? r.id : null;
    $("modalTitle").textContent = t(r ? "modalEdit" : "modalNew");
    $("saveBtn").textContent = t(r ? "saveEdit" : "saveNew");
    $("deleteBtn").hidden = !r;
    $("fTitle").value = r ? text(r, "title") : "";
    $("fTag").value = r ? text(r, "tag") : "";
    $("fNote").value = r ? text(r, "note") : "";
    modal.hidden = false;
    document.querySelector("main.k-stage").inert = true;
    requestAnimationFrame(() => $("fTitle").focus());
  }
  function closeEditor() {
    editingId = null;
    modal.hidden = true;
    document.querySelector("main.k-stage").inert = false;
  }

  $("editForm").onsubmit = async (e) => {
    e.preventDefault();
    const title = $("fTitle").value.trim();
    if (!title) return $("fTitle").focus();
    const save = $("saveBtn");
    save.disabled = true;
    clearError();
    const fields = { title, tag: $("fTag").value.trim(), note: $("fNote").value.trim(), updated_at: stamp() };
    try {
      const a = editingId ? await oma.updateItem(editingId, fields) : await oma.addItem({ group: "Backlog", fields });
      if (failed(a)) showError(why(a, t("saveFailed")));
      else closeEditor();
    } catch (err) {
      showError(err?.message || t("saveFailed"));
    } finally {
      save.disabled = false;
    }
  };

  // The engine asks for confirmation itself (confirm_delete); a cancel resolves ok:false.
  $("deleteBtn").onclick = async () => {
    if (!editingId) return;
    const id = editingId;
    try {
      const a = await oma.deleteItem(id);
      if (!failed(a)) closeEditor();
    } catch (err) {
      showError(err?.message || t("saveFailed"));
    }
  };

  $("bulkForm").onsubmit = async (e) => {
    e.preventDefault();
    const input = $("bulkInput");
    const lines = input.value.split(/\r?\n/).map((l) => l.trim()).filter(Boolean);
    if (!lines.length) return input.focus();
    $("bulkSubmit").disabled = true;
    clearError();
    const left = [];
    for (const title of lines) {
      try {
        const a = await oma.addItem({ group: "Backlog", fields: { title, note: "", tag: t("triage"), updated_at: stamp() } });
        if (failed(a)) left.push(title);
      } catch {
        left.push(title);
      }
    }
    $("bulkSubmit").disabled = false;
    input.value = left.join("\n");
    if (left.length) showError(t("bulkFailed", { n: num(left.length) }));
  };

  // ── wiring ──
  for (const lane of document.querySelectorAll(".lane")) {
    const g = lane.dataset.group;
    lane.ondragover = (e) => {
      if (!dragId) return;
      e.preventDefault();
      e.dataTransfer.dropEffect = "move";
      lane.classList.add("drag-over");
    };
    lane.ondragleave = (e) => {
      if (!lane.contains(e.relatedTarget)) lane.classList.remove("drag-over");
    };
    lane.ondrop = (e) => {
      e.preventDefault();
      lane.classList.remove("drag-over");
      const id = dragId || e.dataTransfer.getData("text/plain");
      if (id) move(id, g);
    };
  }

  for (const tab of document.querySelectorAll("[data-tab]")) {
    tab.onclick = () => {
      view = tab.dataset.tab;
      if (M) renderBoard(M);
    };
  }

  const box = $("traceBox");
  box.onpointermove = (e) => {
    const r = box.getBoundingClientRect();
    const i = Math.max(0, Math.min(13, Math.floor(((e.clientX - r.left) / r.width) * 14)));
    if (i !== hoverIdx && M) {
      hoverIdx = i;
      readout(M);
    }
  };
  box.onpointerleave = () => {
    hoverIdx = -1;
    if (M) readout(M);
  };

  const briefBtn = $("briefBtn");
  briefBtn.onclick = async () => {
    clearError();
    briefBtn.disabled = true;
    try {
      const a = await oma.sendMessage(t("briefPrompt"));
      if (a && a.isError === true && !a.degraded) showError(t("askFailed"));
    } catch (err) {
      showError(String(err?.message || t("askFailed")));
    } finally {
      briefBtn.disabled = false;
    }
  };

  for (const b of document.querySelectorAll(".add-btn")) b.onclick = () => openEditor(null);
  $("modalClose").onclick = closeEditor;
  $("cancelBtn").onclick = closeEditor;
  $("errorClose").onclick = clearError;
  modal.onclick = (e) => { if (e.target === modal) closeEditor(); };
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !modal.hidden) closeEditor(); });

  // The pulse is a function of the clock: at midnight the window slides by a day.
  setInterval(() => {
    const d = localISO(new Date());
    if (d !== lastDay) {
      lastDay = d;
      render(latest);
    }
  }, 60000);

  if (oma.standalone) document.body.classList.add("standalone");
  oma.ready((s) => {
    render(s);
    const tr = $("trace");
    tr.classList.add("enter");
    setTimeout(() => tr.classList.remove("enter"), 1300);
  });
  oma.onChange((s) => {
    reconcile(s);
    render(s);
  });
  oma.onPrefChange(() => {
    i18nLang = "";
    render(latest);
  });
</script>
</body>
</html>
