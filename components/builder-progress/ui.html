<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Builder Progress</title>
<meta name="oma-category" content="Tools">
<meta name="description" content="Parallel build lanes and receipts for apps created across agents and CLIs.">
<style>
  :root {
    --bp-accent: var(--color-text-info, var(--color-ring-primary));
    --bp-success: var(--color-text-success, var(--color-ring-primary));
    --bp-warning: var(--color-text-warning, var(--color-text-secondary));
    --bp-danger: var(--color-text-danger, var(--color-text-primary));
  }

  /* No body rule. The private 860px cap that lived there is a stage declaration now
     (manifest.stage.width: column); centring, padding and ground belong to the kit's stage
     contract rather than to the page the host already frames. */

  /* `.shell` is `.k-stage` now. Its overflow, border, radius, fill and shadow were only a
     self-drawn card frame, so none survive: the kit draws exactly one card in a chat and no card
     when this ledger owns the screen. This shell had no separate layout job to preserve. */

  /* `.app-bar` is `.k-appbar` now: row, gap, padding, mark box and title/eyebrow scale come from
     the kit, along with the rule drawn only when this header belongs to a chat card. */
  .app-bar { min-height: 66px; }

  /* The mark keeps its PAINT and loses its box. Identity is content; the stage contract strips
     frames, never faces. */
  .mark {
    border: 1px solid var(--color-border-primary);
    color: var(--color-text-secondary);
    background: var(--color-background-secondary);
  }

  .header-state {
    flex: none;
  }

  .overview {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    border-bottom: 1px solid var(--color-border-secondary);
    background: var(--color-background-secondary);
  }

  .metric {
    display: grid;
    grid-template-columns: auto minmax(0, 1fr);
    gap: var(--k-s2);
    align-items: baseline;
    min-width: 0;
    padding: 10px var(--k-s4);
  }

  .metric + .metric {
    border-left: 1px solid var(--color-border-secondary);
  }

  .metric-value {
    font-family: var(--font-mono);
    font-size: 17px;
    font-weight: 760;
    line-height: 1;
    color: var(--color-text-primary);
    font-variant-numeric: tabular-nums;
  }

  .metric-label {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: 11px;
    color: var(--color-text-tertiary);
  }

  .metric.building .metric-value {
    color: var(--bp-accent);
  }

  .metric.done .metric-value {
    color: var(--bp-success);
  }

  .metric.failed .metric-value {
    color: var(--bp-danger);
  }

  .workspace {
    /* The host owns vertical scrolling; never trap a long build history in a
       second scroll region inside the MCP app. */
    max-height: none;
    overflow: visible;
    scrollbar-gutter: auto;
  }

  .lane-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: var(--k-s3);
    align-items: start;
    padding: var(--k-s3);
  }

  .lane-grid.single {
    grid-template-columns: minmax(0, 1fr);
  }

  .lane-column {
    display: flex;
    min-width: 0;
    flex-direction: column;
    gap: var(--k-s3);
  }

  .lane-card,
  .receipt-card {
    min-width: 0;
    border: 1px solid var(--color-border-secondary);
    border-radius: var(--border-radius-md, 8px);
    background: var(--color-background-primary);
  }

  .lane-card {
    position: relative;
    overflow: hidden;
    box-shadow: inset 0 3px 0 var(--source-color, var(--bp-accent));
  }

  .lane-card::before {
    position: absolute;
    inset: 0 auto 0 0;
    width: 3px;
    content: "";
    background: color-mix(in oklab, var(--source-color, var(--bp-accent)) 48%, transparent);
  }

  .lane-head {
    padding: 15px var(--k-s3) 12px;
  }

  .target-label {
    margin: 0 0 4px;
    font-family: var(--font-mono);
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0;
    text-transform: uppercase;
    color: var(--color-text-tertiary);
  }

  .target-name {
    margin: 0;
    overflow-wrap: anywhere;
    font-size: 18px;
    font-weight: 690;
    line-height: 1.3;
    color: var(--color-text-primary);
  }

  .source-list {
    display: flex;
    flex: none;
    flex-wrap: wrap;
    justify-content: flex-end;
    gap: 5px;
    max-width: 48%;
  }

  .source-chip {
    display: inline-flex;
    align-items: center;
    flex: none;
    min-width: 0;
    max-width: 130px;
    height: 22px;
    padding: 0 7px;
    overflow: hidden;
    border: 1px solid color-mix(in oklab, var(--source-color) 38%, var(--color-border-primary));
    border-radius: var(--border-radius-full, 999px);
    color: var(--source-color);
    background: color-mix(in oklab, var(--source-color) 9%, var(--color-background-primary));
    font-family: var(--font-mono);
    font-size: 9.5px;
    font-weight: 720;
    line-height: 1;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .source-chip.small {
    max-width: 110px;
    height: 18px;
    padding-inline: 6px;
    font-size: 9px;
  }

  .current-step {
    position: relative;
    margin: 0 var(--k-s3) var(--k-s3);
    padding: 12px 12px 12px 18px;
    border: 1px solid color-mix(in oklab, var(--bp-accent) 24%, var(--color-border-secondary));
    border-radius: var(--border-radius-sm, 6px);
    background: color-mix(in oklab, var(--bp-accent) 6%, var(--color-background-primary));
  }

  .current-step::before {
    position: absolute;
    top: 14px;
    bottom: 14px;
    left: 8px;
    width: 2px;
    border-radius: var(--border-radius-full, 999px);
    content: "";
    background: var(--bp-accent);
  }

  .current-topline,
  .step-title-line,
  .time-line {
    display: flex;
    min-width: 0;
    align-items: center;
  }

  .current-topline {
    justify-content: space-between;
    gap: var(--k-s2);
    margin-bottom: 7px;
  }

  .current-label {
    font-family: var(--font-mono);
    font-size: 9.5px;
    font-weight: 740;
    letter-spacing: 0;
    text-transform: uppercase;
    color: var(--bp-accent);
  }

  .pulse-dot {
    width: 7px;
    height: 7px;
    flex: none;
    border-radius: var(--border-radius-full, 999px);
    background: var(--bp-accent);
  }

  .step-title-line {
    gap: var(--k-s2);
    align-items: flex-start;
  }

  .step-title {
    min-width: 0;
    flex: 1;
    overflow-wrap: anywhere;
    font-size: 13px;
    font-weight: 680;
    line-height: 1.4;
    color: var(--color-text-primary);
  }

  .latest-detail {
    margin: 5px 0 0;
    overflow-wrap: anywhere;
    font-size: 11px;
    line-height: 1.55;
    color: var(--color-text-secondary);
  }

  .time-line {
    flex-wrap: wrap;
    gap: 4px 7px;
    margin-top: 8px;
    font-family: var(--font-mono);
    font-size: 9.5px;
    color: var(--color-text-tertiary);
    font-variant-numeric: tabular-nums;
  }

  .relative-time {
    color: var(--color-text-secondary);
  }

  .time-separator {
    color: var(--color-border-primary);
  }

  details.completed {
    border-top: 1px solid var(--color-border-secondary);
  }

  details.completed summary,
  details.receipt-card summary {
    cursor: pointer;
    list-style: none;
  }

  details.completed summary::-webkit-details-marker,
  details.receipt-card summary::-webkit-details-marker {
    display: none;
  }

  details.completed summary {
    display: grid;
    grid-template-columns: 18px minmax(0, 1fr) 16px;
    gap: var(--k-s2);
    align-items: center;
    min-height: 43px;
    padding: 8px var(--k-s3);
    color: var(--color-text-secondary);
    transition: background-color var(--k-t-fast) var(--k-ease);
  }

  details.completed summary:hover,
  details.receipt-card summary:hover {
    background: color-mix(in oklab, var(--color-text-primary) 4%, transparent);
  }

  .fold-mark,
  .receipt-mark {
    display: grid;
    place-items: center;
    border-radius: var(--border-radius-full, 999px);
    font-family: var(--font-mono);
    font-weight: 800;
    line-height: 1;
  }

  .fold-mark {
    width: 17px;
    height: 17px;
    color: var(--bp-success);
    background: color-mix(in oklab, var(--bp-success) 10%, transparent);
    font-size: 10px;
  }

  .fold-copy {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: 11px;
  }

  .chevron {
    display: inline-flex;
    color: var(--color-text-tertiary);
    rotate: -90deg;
    transition: rotate var(--k-t) var(--k-spring);
  }

  details[open] > summary .chevron {
    rotate: 0deg;
  }

  .history-list {
    margin: 0;
    padding: 0 var(--k-s3) 7px;
    border-top: 1px solid var(--color-border-secondary);
    list-style: none;
    background: var(--color-background-secondary);
  }

  .history-row {
    display: grid;
    grid-template-columns: 18px minmax(0, 1fr);
    gap: var(--k-s2);
    min-width: 0;
    padding: 9px 0;
  }

  .history-row + .history-row {
    border-top: 1px solid var(--color-border-secondary);
  }

  .history-mark {
    display: grid;
    width: 17px;
    height: 17px;
    place-items: center;
    border: 1px solid var(--color-border-primary);
    border-radius: var(--border-radius-full, 999px);
    font-family: var(--font-mono);
    font-size: 10px;
    font-weight: 800;
    color: var(--color-text-tertiary);
    background: var(--color-background-primary);
  }

  .history-row.done .history-mark {
    border-color: color-mix(in oklab, var(--bp-success) 42%, var(--color-border-primary));
    color: var(--bp-success);
  }

  .history-row.doing .history-mark {
    border-color: color-mix(in oklab, var(--bp-accent) 42%, var(--color-border-primary));
    color: var(--bp-accent);
  }

  .history-row.fail .history-mark {
    border-color: color-mix(in oklab, var(--bp-danger) 42%, var(--color-border-primary));
    color: var(--bp-danger);
  }

  .history-copy {
    min-width: 0;
  }

  .history-title-line {
    display: flex;
    align-items: flex-start;
    gap: var(--k-s2);
    min-width: 0;
  }

  .history-title {
    min-width: 0;
    flex: 1;
    overflow-wrap: anywhere;
    font-size: 11.5px;
    font-weight: 650;
    line-height: 1.45;
    color: var(--color-text-primary);
  }

  .history-detail {
    margin: 3px 0 0;
    overflow-wrap: anywhere;
    font-size: 10px;
    line-height: 1.5;
    color: var(--color-text-tertiary);
  }

  .history-time {
    display: block;
    margin-top: 5px;
    font-family: var(--font-mono);
    font-size: 9px;
    color: var(--color-text-tertiary);
    font-variant-numeric: tabular-nums;
  }

  details.receipt-card {
    overflow: hidden;
    align-self: stretch;
  }

  details.receipt-card.done {
    border-color: color-mix(in oklab, var(--bp-success) 26%, var(--color-border-secondary));
  }

  details.receipt-card.fail {
    border-color: color-mix(in oklab, var(--bp-danger) 44%, var(--color-border-secondary));
    background: color-mix(in oklab, var(--bp-danger) 5%, var(--color-background-primary));
    box-shadow: inset 3px 0 0 color-mix(in oklab, var(--bp-danger) 72%, transparent);
  }

  details.receipt-card summary {
    display: grid;
    grid-template-columns: 21px minmax(0, 1fr) auto 16px;
    gap: var(--k-s2);
    align-items: center;
    min-height: 58px;
    padding: 9px var(--k-s3);
    transition: background-color var(--k-t-fast) var(--k-ease);
  }

  .receipt-mark {
    width: 20px;
    height: 20px;
    font-size: 11px;
    color: var(--bp-success);
    background: color-mix(in oklab, var(--bp-success) 11%, transparent);
  }

  .receipt-card.fail .receipt-mark {
    color: var(--bp-danger);
    background: color-mix(in oklab, var(--bp-danger) 12%, transparent);
  }

  .receipt-copy {
    min-width: 0;
  }

  .receipt-title {
    display: block;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: 12.5px;
    font-weight: 680;
    color: var(--color-text-primary);
  }

  .receipt-meta {
    display: block;
    margin-top: 3px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-family: var(--font-mono);
    font-size: 9.5px;
    color: var(--color-text-tertiary);
  }

  .receipt-side {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    min-width: 0;
  }

  .receipt-relative {
    font-family: var(--font-mono);
    font-size: 9px;
    color: var(--color-text-tertiary);
    white-space: nowrap;
  }

  .empty-wrap {
    padding: var(--k-s4);
  }

  .k-empty svg {
    width: 58px;
    height: 58px;
  }

  body[data-density="compact"] .app-bar {
    min-height: 58px;
  }

  body[data-density="compact"] .metric {
    padding-block: 8px;
  }

  body[data-density="compact"] .lane-grid {
    gap: var(--k-s2);
    padding: var(--k-s2);
  }

  body[data-density="compact"] .lane-column {
    gap: var(--k-s2);
  }

  body[data-density="compact"] .lane-head {
    padding-block: 12px 9px;
  }

  body[data-density="compact"] .current-step {
    padding-block: 9px;
  }

  @media (max-width: 600px) {
    .header-state {
      display: none;
    }

    .metric {
      display: block;
      padding: 9px var(--k-s2);
      text-align: center;
    }

    .metric-value,
    .metric-label {
      display: block;
    }

    .metric-label {
      margin-top: 3px;
      font-size: 9.5px;
    }

    .lane-grid {
      grid-template-columns: minmax(0, 1fr);
      padding: var(--k-s2);
    }

    .lane-head {
      padding-inline: var(--k-s3);
    }

    .source-list {
      max-width: 45%;
    }

    .receipt-relative {
      display: none;
    }
  }

  @media (prefers-reduced-motion: no-preference) {
    .pulse-dot,
    .current-step::before {
      animation: bp-pulse 1.8s ease-in-out infinite;
    }

    details.completed summary:active,
    details.receipt-card summary:active {
      transform: scale(.985);
    }
  }

  @keyframes bp-pulse {
    0%, 100% {
      opacity: .55;
      box-shadow: 0 0 0 0 color-mix(in oklab, var(--bp-accent) 22%, transparent);
    }
    50% {
      opacity: 1;
      box-shadow: 0 0 0 5px color-mix(in oklab, var(--bp-accent) 0%, transparent);
    }
  }
</style>

</head>
<body>
<main class="shell k-stage" aria-labelledby="app-title">
  <header class="app-bar k-appbar">
    <span class="mark k-appmark" aria-hidden="true">
      <svg class="k-icon" viewBox="0 0 20 20">
        <path d="M4 4.5h12M4 10h7M4 15.5h9"></path>
        <path d="M2.5 4.5h.1M2.5 10h.1M2.5 15.5h.1"></path>
      </svg>
    </span>
    <div class="identity k-grow k-appcopy">
      <p class="eyebrow k-eyebrow" id="eyebrow">SYSTEM BUILD LEDGER</p>
      <h1 class="k-h1" id="app-title">Builder progress</h1>
    </div>
    <span class="k-badge info header-state" id="header-state">Waiting for builds</span>
  </header>

  <section class="overview" id="overview" aria-label="Build overview">
    <div class="metric building">
      <span class="metric-value" id="building-count">0</span>
      <span class="metric-label" id="building-label">building</span>
    </div>
    <div class="metric done">
      <span class="metric-value" id="done-count">0</span>
      <span class="metric-label" id="done-label">done today</span>
    </div>
    <div class="metric failed">
      <span class="metric-value" id="failed-count">0</span>
      <span class="metric-label" id="failed-label">failed</span>
    </div>
  </section>

  <div class="workspace" id="workspace" aria-live="polite"></div>
</main>

<script type="module">
  const STR = {
    en: {
      appName: "Builder progress",
      eyebrow: "SYSTEM BUILD LEDGER",
      overview: "Build overview",
      waiting: "Waiting for builds",
      targetCount: "{count} targets",
      building: "building",
      doneToday: "done today",
      failed: "failed",
      target: "Target",
      currentStep: "Current step",
      completedStep: "{count} completed step",
      completedSteps: "{count} completed steps",
      buildCompleted: "Build completed",
      buildFailed: "Build failed",
      stepComplete: "{done}/{total} step complete",
      stepsComplete: "{done}/{total} steps complete",
      statusDoing: "Running",
      statusDone: "Done",
      statusFail: "Failed",
      emptyTitle: "Ready for the next build",
      emptyBody: "Build events from agents and CLIs will appear here as parallel lanes.",
      unknownTime: "Time unavailable",
      justNow: "just now"
    },
    zh: {
      appName: "建造进度",
      eyebrow: "系统建造账本",
      overview: "建造总览",
      waiting: "等待建造记录",
      targetCount: "{count} 个目标",
      building: "建造中",
      doneToday: "今日完成",
      failed: "失败",
      target: "目标",
      currentStep: "当前步骤",
      completedStep: "已完成 {count} 步",
      completedSteps: "已完成 {count} 步",
      buildCompleted: "建造完成",
      buildFailed: "建造失败",
      stepComplete: "完成 {done}/{total} 步",
      stepsComplete: "完成 {done}/{total} 步",
      statusDoing: "进行中",
      statusDone: "完成",
      statusFail: "失败",
      emptyTitle: "准备迎接下一次建造",
      emptyBody: "来自 agent 与 CLI 的建造事件会在这里形成并行泳道。",
      unknownTime: "时间未知",
      justNow: "刚刚"
    }
  };

  const STATUS = {
    doing: { glyph: "•", labelKey: "statusDoing" },
    done: { glyph: "✓", labelKey: "statusDone" },
    fail: { glyph: "×", labelKey: "statusFail" }
  };

  const SOURCE_PALETTE = [
    "var(--color-text-info, var(--color-text-primary))",
    "var(--color-text-success, var(--color-text-primary))",
    "var(--color-text-warning, var(--color-text-secondary))",
    "var(--color-text-danger, var(--color-text-primary))",
    "var(--color-ring-primary, var(--color-text-secondary))"
  ];

  const openPanels = new Set();
  let currentState = { items: [] };
  let activeLanguage = "en";

  const element = (tag, className, text) => {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  };

  const localeSetting = () => String(oma.pref("locale", "en") || "en");

  const localeValue = () => {
    const value = localeSetting();
    return value === "auto" ? (navigator.language || "en") : value;
  };

  const languageValue = () => localeSetting().toLowerCase().startsWith("zh") ? "zh" : "en";

  const t = (key, values = {}) => {
    const template = STR[activeLanguage][key] || STR.en[key] || key;
    return Object.entries(values).reduce(
      (text, [name, value]) => text.replaceAll(`{${name}}`, String(value)),
      template
    );
  };

  const formatNumber = (value) => new Intl.NumberFormat(localeValue()).format(value);

  const pad = (value) => String(value).padStart(2, "0");

  const dateOnly = (value) => {
    const date = value instanceof Date ? value : new Date(value);
    if (!Number.isFinite(date.getTime())) return "";
    return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}`;
  };

  function formatTimestamp(value) {
    const date = new Date(value);
    if (!Number.isFinite(date.getTime())) return t("unknownTime");

    const locale = localeValue();
    const preference = oma.pref("date_format", "auto");
    const year = date.getFullYear();
    const month = pad(date.getMonth() + 1);
    const day = pad(date.getDate());
    let datePart;

    if (preference === "yyyy-mm-dd") datePart = `${year}-${month}-${day}`;
    else if (preference === "dd/mm/yyyy") datePart = `${day}/${month}/${year}`;
    else if (preference === "mm/dd/yyyy") datePart = `${month}/${day}/${year}`;
    else {
      datePart = new Intl.DateTimeFormat(locale, {
        year: "numeric",
        month: "2-digit",
        day: "2-digit"
      }).format(date);
    }

    const timePart = new Intl.DateTimeFormat(locale, {
      hour: "2-digit",
      minute: "2-digit"
    }).format(date);

    return `${datePart} ${timePart}`;
  }

  function formatRelativeTime(value) {
    const timestamp = Date.parse(value);
    if (!Number.isFinite(timestamp)) return t("unknownTime");

    const now = Date.now();
    if (timestamp > now) return t("justNow");

    const difference = timestamp - now;
    const absolute = Math.abs(difference);
    const units = [
      ["day", 86400000],
      ["hour", 3600000],
      ["minute", 60000]
    ];

    if (absolute < 60000) return t("justNow");

    for (const [unit, milliseconds] of units) {
      if (absolute >= milliseconds || unit === "minute") {
        const amount = Math.round(difference / milliseconds);
        return new Intl.RelativeTimeFormat(localeValue(), { numeric: "auto" }).format(amount, unit);
      }
    }

    return t("justNow");
  }

  function sourceHash(source) {
    let hash = 2166136261;
    for (const character of source) {
      hash ^= character.charCodeAt(0);
      hash = Math.imul(hash, 16777619);
    }
    return hash >>> 0;
  }

  const sourceColor = (source) => SOURCE_PALETTE[sourceHash(source) % SOURCE_PALETTE.length];

  function createSourceChip(source, small = false) {
    if (typeof source !== "string" || !source.trim()) return null;
    const value = source.trim();
    const chip = element("span", `source-chip${small ? " small" : ""}`, value);
    chip.style.setProperty("--source-color", sourceColor(value));
    chip.title = value;
    return chip;
  }

  const itemTime = (item) => {
    const time = Date.parse(item.fields.at);
    return Number.isFinite(time) ? time : 0;
  };

  function groupBuilds(items) {
    const grouped = new Map();

    for (const item of items) {
      const fields = item && item.fields;
      if (!fields || typeof fields.target !== "string" || !fields.target.trim()) continue;
      if (typeof fields.step !== "string" || !STATUS[fields.status]) continue;

      const target = fields.target.trim();
      if (!grouped.has(target)) grouped.set(target, []);
      grouped.get(target).push(item);
    }

    return [...grouped.entries()].map(([target, rows]) => {
      rows.sort((a, b) => itemTime(a) - itemTime(b) || (a.position || 0) - (b.position || 0));
      const latest = rows[rows.length - 1];
      const sources = [...new Set(
        rows
          .map((item) => typeof item.fields.source === "string" ? item.fields.source.trim() : "")
          .filter(Boolean)
      )];

      return {
        target,
        rows,
        latest,
        latestAt: itemTime(latest),
        sources
      };
    });
  }

  const buildState = (build) => build.latest.fields.status;

  const completedRows = (build) => build.rows.filter((item) => item.fields.status === "done");

  function sortedBuilds(builds) {
    return builds.sort((a, b) => {
      const aActive = buildState(a) === "doing" ? 0 : 1;
      const bActive = buildState(b) === "doing" ? 0 : 1;
      return aActive - bActive || b.latestAt - a.latestAt || a.target.localeCompare(b.target);
    });
  }

  function createChevron() {
    const wrap = element("span", "chevron");
    wrap.setAttribute("aria-hidden", "true");
    const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svg.setAttribute("class", "k-icon");
    svg.setAttribute("viewBox", "0 0 16 16");
    const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
    path.setAttribute("d", "M3.5 6l4.5 4.5L12.5 6");
    svg.append(path);
    wrap.append(svg);
    return wrap;
  }

  function rememberOpen(details, key) {
    details.open = openPanels.has(key);
    details.addEventListener("toggle", () => {
      if (details.open) openPanels.add(key);
      else openPanels.delete(key);
    });
  }

  function createTimeLine(fields) {
    const line = element("div", "time-line");
    const absolute = element("time", "", formatTimestamp(fields.at));
    absolute.dateTime = fields.at;
    const relative = element("span", "relative-time", formatRelativeTime(fields.at));
    line.append(absolute, element("span", "time-separator", "·"), relative);
    return line;
  }

  function createHistoryList(rows) {
    const list = element("ol", "history-list");

    for (const item of rows) {
      const fields = item.fields;
      const row = element("li", `history-row ${fields.status}`);
      const mark = element("span", "history-mark", STATUS[fields.status].glyph);
      mark.setAttribute("aria-label", t(STATUS[fields.status].labelKey));

      const copy = element("div", "history-copy");
      const titleLine = element("div", "history-title-line");
      titleLine.append(element("span", "history-title", fields.step));
      const chip = createSourceChip(fields.source, true);
      if (chip) titleLine.append(chip);
      copy.append(titleLine);

      if (typeof fields.detail === "string" && fields.detail.trim()) {
        copy.append(element("p", "history-detail", fields.detail.trim()));
      }

      const time = element(
        "time",
        "history-time",
        `${formatTimestamp(fields.at)} · ${formatRelativeTime(fields.at)}`
      );
      time.dateTime = fields.at;
      copy.append(time);
      row.append(mark, copy);
      list.append(row);
    }

    return list;
  }

  function createSourceList(sources) {
    const list = element("div", "source-list");
    for (const source of sources) {
      const chip = createSourceChip(source);
      if (chip) list.append(chip);
    }
    return list;
  }

  function createActiveLane(build) {
    const latest = build.latest.fields;
    const completed = completedRows(build);
    const primarySource = typeof latest.source === "string" && latest.source.trim()
      ? latest.source.trim()
      : build.sources[0];
    const card = element("article", "lane-card");
    card.style.setProperty("--source-color", primarySource ? sourceColor(primarySource) : "var(--bp-accent)");

    const head = element("header", "lane-head");
    const row = element("div", "k-row");
    const copy = element("div", "k-grow");
    copy.append(
      element("p", "target-label", t("target")),
      element("h2", "target-name", build.target)
    );
    row.append(copy, createSourceList(build.sources));
    head.append(row);

    const current = element("section", "current-step");
    const topline = element("div", "current-topline");
    const currentLabel = element("span", "current-label", t("currentStep"));
    const pulse = element("span", "pulse-dot");
    pulse.setAttribute("aria-hidden", "true");
    topline.append(currentLabel, pulse);

    const titleLine = element("div", "step-title-line");
    titleLine.append(element("span", "step-title", latest.step));
    const currentSource = createSourceChip(latest.source, true);
    if (currentSource) titleLine.append(currentSource);

    current.append(topline, titleLine);
    if (typeof latest.detail === "string" && latest.detail.trim()) {
      current.append(element("p", "latest-detail", latest.detail.trim()));
    }
    current.append(createTimeLine(latest));
    card.append(head, current);

    if (completed.length) {
      const details = element("details", "completed");
      const key = `${build.target}:completed`;
      rememberOpen(details, key);
      const summary = element("summary");
      const count = formatNumber(completed.length);
      summary.append(
        element("span", "fold-mark", "✓"),
        element("span", "fold-copy", t(completed.length === 1 ? "completedStep" : "completedSteps", { count })),
        createChevron()
      );
      details.append(summary, createHistoryList(completed));
      card.append(details);
    }

    return card;
  }

  function createReceipt(build) {
    const state = buildState(build);
    const latest = build.latest.fields;
    const completed = completedRows(build).length;
    const details = element("details", `receipt-card ${state}`);
    rememberOpen(details, `${build.target}:receipt`);

    const summary = element("summary");
    const mark = element("span", "receipt-mark", STATUS[state].glyph);
    mark.setAttribute("aria-label", t(STATUS[state].labelKey));

    const copy = element("span", "receipt-copy");
    const done = formatNumber(completed);
    const total = formatNumber(build.rows.length);
    copy.append(
      element("span", "receipt-title", build.target),
      element(
        "span",
        "receipt-meta",
        `${t(state === "done" ? "buildCompleted" : "buildFailed")} · ${t(build.rows.length === 1 ? "stepComplete" : "stepsComplete", { done, total })}`
      )
    );

    const side = element("span", "receipt-side");
    const source = typeof latest.source === "string" && latest.source.trim()
      ? latest.source.trim()
      : build.sources[0];
    const chip = createSourceChip(source, true);
    if (chip) side.append(chip);
    side.append(element("span", "receipt-relative", formatRelativeTime(latest.at)));

    summary.append(mark, copy, side, createChevron());
    details.append(summary, createHistoryList(build.rows));
    return details;
  }

  function createEmpty() {
    const wrap = element("div", "empty-wrap");
    const empty = element("div", "k-empty");
    const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svg.setAttribute("viewBox", "0 0 64 64");
    svg.setAttribute("fill", "none");
    svg.setAttribute("aria-hidden", "true");

    const rails = document.createElementNS("http://www.w3.org/2000/svg", "path");
    rails.setAttribute("d", "M13 14v36M13 20h16M13 32h25M13 44h19M38 20h13M46 16v8M42 32h9M46 28v8M36 44h15M46 40v8");
    rails.setAttribute("stroke", "var(--color-text-tertiary)");
    rails.setAttribute("stroke-width", "2");
    rails.setAttribute("stroke-linecap", "round");

    const cursor = document.createElementNS("http://www.w3.org/2000/svg", "path");
    cursor.setAttribute("d", "M25 17l5 3-5 3");
    cursor.setAttribute("stroke", "var(--bp-accent)");
    cursor.setAttribute("stroke-width", "2");
    cursor.setAttribute("stroke-linecap", "round");
    cursor.setAttribute("stroke-linejoin", "round");

    svg.append(rails, cursor);
    empty.append(
      svg,
      element("b", "", t("emptyTitle")),
      element("span", "", t("emptyBody"))
    );
    wrap.append(empty);
    return wrap;
  }

  function renderOverview(builds) {
    const today = dateOnly(new Date());
    const counts = builds.reduce((result, build) => {
      const state = buildState(build);
      if (state === "doing") result.building += 1;
      if (state === "fail") result.failed += 1;
      if (state === "done" && dateOnly(build.latest.fields.at) === today) result.doneToday += 1;
      return result;
    }, { building: 0, doneToday: 0, failed: 0 });

    document.getElementById("building-count").textContent = formatNumber(counts.building);
    document.getElementById("done-count").textContent = formatNumber(counts.doneToday);
    document.getElementById("failed-count").textContent = formatNumber(counts.failed);
    document.getElementById("building-label").textContent = t("building");
    document.getElementById("done-label").textContent = t("doneToday");
    document.getElementById("failed-label").textContent = t("failed");
  }

  function render(state) {
    currentState = state;
    activeLanguage = languageValue();
    document.documentElement.lang = activeLanguage === "zh" ? "zh-CN" : "en";
    document.title = t("appName");
    document.body.dataset.density = oma.pref("density", "comfortable");

    document.getElementById("app-title").textContent = t("appName");
    document.getElementById("eyebrow").textContent = t("eyebrow");
    document.getElementById("overview").setAttribute("aria-label", t("overview"));

    const builds = sortedBuilds(groupBuilds(state.items || []));
    const workspace = document.getElementById("workspace");
    const headerState = document.getElementById("header-state");
    workspace.innerHTML = "";
    renderOverview(builds);

    if (!builds.length) {
      headerState.className = "k-badge header-state";
      headerState.textContent = t("waiting");
      workspace.append(createEmpty());
      return;
    }

    const states = builds.map(buildState);
    const badgeKind = states.includes("doing") ? "info" : states.includes("fail") ? "bad" : "ok";
    headerState.className = `k-badge header-state ${badgeKind}`;
    headerState.textContent = t("targetCount", { count: formatNumber(builds.length) });

    const activeBuilds = builds.filter((build) => buildState(build) === "doing");
    const receiptBuilds = builds.filter((build) => buildState(build) !== "doing");
    const grid = element("div", `lane-grid${activeBuilds.length && receiptBuilds.length ? "" : " single"}`);
    const primaryColumn = element("div", "lane-column");
    const secondaryColumn = element("div", "lane-column");

    if (activeBuilds.length && receiptBuilds.length) {
      for (const build of activeBuilds) primaryColumn.append(createActiveLane(build));
      for (const build of receiptBuilds) secondaryColumn.append(createReceipt(build));
      grid.append(primaryColumn, secondaryColumn);
    } else {
      for (const build of activeBuilds) primaryColumn.append(createActiveLane(build));
      for (const build of receiptBuilds) primaryColumn.append(createReceipt(build));
      grid.append(primaryColumn);
    }
    workspace.append(grid);
  }

  // WHICH CONTEXT AM I IN — the one signal the kit's stage contract reads. `standalone` = the
  // browser viewer or a panel host, both of which frame the page already, so the kit draws no
  // card; absent = a widget in someone's conversation, where the card is ours to draw.
  if (oma.standalone) document.body.classList.add("standalone");

  oma.ready(render);
  oma.onChange(render);
  oma.onPrefChange(() => render(currentState));
</script>
</body>
</html>
