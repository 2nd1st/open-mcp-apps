<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Savings Goals</title>
<meta name="description" content="Every savings goal as a stack of coins rising toward its target line: tap to add funds, watch the coins drop in and the milestones light, with the monthly pace each date needs.">
<meta name="oma-category" content="Money">
<style>
  /* Shared primitives (.k-*) — this app's own copy; nothing here comes from the engine. */
  :root{--k-accent:var(--color-text-info,var(--color-ring-primary,#3b6cf6));--k-ok:var(--color-text-success,#2e9e5b);--k-warn:var(--color-text-warning,#b98200);--k-bad:var(--color-text-danger,#e5484d);--k-ink-4:color-mix(in oklab,var(--color-text-primary) 4%,transparent);--k-accent-bg:color-mix(in oklab,var(--k-accent) 10%,transparent);--k-accent-brd:color-mix(in oklab,var(--k-accent) 28%,transparent);--k-t-fast:120ms;--k-ease:cubic-bezier(.2,.8,.3,1);--k-spring:cubic-bezier(.34,1.56,.64,1);--k-surface:var(--color-background-primary)}
  @media (prefers-reduced-motion:reduce){:root{--k-t-fast:0ms}.k-stagger>*,.k-pop,.k-skel{animation:none!important}}
  .k-btn{display:inline-flex;align-items:center;gap:6px;border:1px solid transparent;border-radius:var(--border-radius-md,10px);padding:6px 12px;font:inherit;font-size:var(--font-text-sm-size,12.5px);font-weight:600;cursor:pointer;background:var(--color-background-inverse);color:var(--color-text-inverse);transition:transform var(--k-t-fast) var(--k-ease),opacity var(--k-t-fast),background var(--k-t-fast)}
  .k-btn:hover{opacity:.9}
  .k-btn:active{transform:scale(.96)}
  .k-btn:disabled{opacity:.45;cursor:default;transform:none}
  .k-btn.sec{background:transparent;color:var(--color-text-primary);border-color:var(--color-border-primary)}
  .k-btn.ghost{background:transparent;color:var(--color-text-secondary)}
  :is(.k-btn.sec,.k-btn.ghost):hover{background:var(--k-ink-4);color:var(--color-text-primary);opacity:1}
  .k-btn.danger{background:transparent;color:var(--k-bad);border-color:color-mix(in oklab,var(--k-bad) 30%,transparent)}
  .k-btn.danger:hover{background:color-mix(in oklab,var(--k-bad) 10%,transparent);opacity:1}
  :is(.k-btn,.k-tab,.k-chip,.k-switch,.k-field):focus-visible{outline:2px solid var(--color-ring-primary,var(--k-accent));outline-offset:1px}
  .k-badge{display:inline-flex;align-items:center;gap:4px;border-radius:var(--border-radius-full,999px);padding:1px 8px;font-size:11px;font-weight:600;background:var(--k-ink-4);color:var(--color-text-secondary)}
  .k-badge.info{background:color-mix(in oklab,var(--k-accent) 10%,transparent);color:var(--k-accent)}
  .k-badge.ok{background:color-mix(in oklab,var(--k-ok) 12%,transparent);color:var(--k-ok)}
  .k-badge.warn{background:color-mix(in oklab,var(--k-warn) 14%,transparent);color:var(--k-warn)}
  .k-badge.bad{background:color-mix(in oklab,var(--k-bad) 12%,transparent);color:var(--k-bad)}
  .k-field{padding:6px 10px;border-radius:var(--border-radius-md,10px);border:1px solid var(--color-border-primary);background:transparent;color:inherit;font:inherit;font-size:var(--font-text-sm-size,12.5px);transition:border-color var(--k-t-fast),box-shadow var(--k-t-fast)}
  .k-field::placeholder{color:var(--color-text-tertiary)}
  .k-field:focus{outline:none;border-color:var(--k-accent);box-shadow:0 0 0 3px color-mix(in oklab,var(--k-accent) 10%,transparent)}
  .k-pop{animation:k-pop 320ms var(--k-spring)}
  .k-appbar{display:flex;align-items:center;gap:11px;padding:13px 16px}
  .k-appbar .k-appmark{display:grid;width:34px;height:34px;flex:none;place-items:center;border-radius:11px}
  .k-appbar .k-appmark svg{width:18px;height:18px}
  .k-appbar .k-appcopy{min-width:0;flex:1}
  .k-appbar .k-eyebrow{display:block;margin:0;color:var(--color-text-tertiary);font-size:9.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
  .k-appbar h1{margin:1px 0 0;font-size:15px;font-weight:650;letter-spacing:-.015em}
  body:not(.standalone) .k-appbar{border-bottom:1px solid var(--color-border-secondary);background:var(--k-surface)}
  @keyframes k-pop{0%{scale:.7}60%{scale:1.08}100%{scale:1}}
  .k-stage{max-width:760px;margin-inline:auto;overflow-x:clip}

  /* The signature is THE SHELF: each active goal is a stack of coins standing on it, rising toward
     a dashed target line. Sixteen coins make a goal, so the 25 / 50 / 75 % milestones sit exactly
     on coin boundaries and light up the moment a deposit crosses them. The big number, the pace
     line, every stack and the panel below all come from one model() pass over the same rows. */
  .sg {
    --sg: light-dark(#946b00, #e8c14e);
    --sg-on: light-dark(#ffffff, #1c1400);
    --k-accent: var(--sg);
    --k-accent-bg: color-mix(in oklab, var(--sg) 11%, transparent);
    --k-accent-brd: color-mix(in oklab, var(--sg) 32%, transparent);
    --sg-coin: color-mix(in oklab, var(--sg) 20%, var(--color-background-primary));
    --sg-late: var(--color-text-danger);
  }
  button { font: inherit; color: inherit; }

  /* ── app bar ── */
  .sg-mark { color: var(--sg); border: 1px solid var(--k-accent-brd); background: var(--k-accent-bg); }
  .sg-mark svg, .k-btn svg { fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .k-btn svg { width: 15px; height: 15px; flex: none; }
  .bar-actions { display: flex; gap: 6px; flex: none; }

  .error-strip {
    margin: 10px 20px 0;
    padding: 8px 10px;
    border: 1px solid color-mix(in oklab, var(--color-text-danger) 32%, var(--color-border-secondary));
    border-radius: var(--border-radius-md, 10px);
    background: color-mix(in oklab, var(--color-text-danger) 8%, transparent);
    color: var(--color-text-danger);
    font-size: var(--font-text-sm-size, 12px);
  }

  /* ── new-goal composer (folded away until asked for) ── */
  .composer {
    display: grid;
    grid-template-columns: minmax(0, 2fr) repeat(2, minmax(0, 1fr)) 72px minmax(0, 1.2fr) auto;
    gap: 8px;
    align-items: end;
    padding: 14px 20px 16px;
    border-bottom: 1px solid var(--color-border-secondary);
    background: var(--k-ink-4);
  }
  .composer[hidden] { display: none; }
  .composer label { display: grid; gap: 4px; min-width: 0; color: var(--color-text-secondary); font-size: 11.5px; font-weight: 550; }
  .composer .k-field { width: 100%; min-width: 0; height: 34px; font-variant-numeric: tabular-nums; }

  /* ── hero: the one number ── */
  .hero {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    justify-content: space-between;
    gap: 10px 28px;
    padding: 22px 24px 6px;
  }
  .kicker { margin: 0 0 6px; color: var(--color-text-secondary); font-size: var(--font-text-sm-size, 12.5px); font-weight: 550; }
  .big { margin: 0; font-size: 52px; font-weight: 720; line-height: .95; letter-spacing: -.04em; font-variant-numeric: tabular-nums; }
  .of { margin: 8px 0 0; color: var(--color-text-secondary); font-size: var(--font-text-md-size, 14px); font-variant-numeric: tabular-nums; }
  .pace { max-width: 300px; margin: 0; padding-bottom: 2px; color: var(--color-text-secondary); font-size: var(--font-text-md-size, 14px); line-height: 1.45; }
  .pace b { color: var(--sg); font-weight: 680; font-variant-numeric: tabular-nums; }
  .pace .k-badge { margin-left: 4px; vertical-align: 1px; }

  /* ── the shelf of coin stacks ── */
  .shelf {
    display: flex;
    flex-wrap: wrap;
    gap: 10px 8px;
    padding: 14px 18px 8px;
  }
  .col {
    flex: 1 1 116px;
    max-width: 172px;
    min-width: 0;
    display: grid;
    justify-items: center;
    align-content: start;
    gap: 2px;
    padding: 8px 6px 10px;
    border: 1px solid transparent;
    border-radius: var(--border-radius-lg, 14px);
    background: transparent;
    text-align: center;
    cursor: pointer;
  }
  .col:hover { background: var(--k-ink-4); }
  .col.sel { border-color: var(--k-accent-brd); background: color-mix(in oklab, var(--sg) 6%, transparent); }
  .col:focus-visible { outline: 2px solid var(--color-ring-primary, var(--sg)); outline-offset: 1px; }
  .col svg { display: block; width: 100%; max-width: 104px; height: auto; overflow: visible; }
  .s-base { stroke: var(--color-border-primary); stroke-width: 1.6; stroke-linecap: round; }
  .s-ghost { fill: none; stroke: var(--color-border-primary); stroke-width: 1.2; stroke-dasharray: 3 3; }
  .s-goal { stroke: var(--sg); stroke-width: 1.4; stroke-dasharray: 4 3; opacity: .75; }
  .coin { fill: var(--sg-coin); stroke: var(--sg); stroke-width: 1.3; visibility: hidden; }
  .coin.on { visibility: visible; }
  .s-edge { stroke: color-mix(in oklab, var(--sg) 55%, transparent); stroke-width: 1; visibility: hidden; }
  .s-edge.on { visibility: visible; }
  .mark { fill: var(--color-background-primary); stroke: var(--color-border-primary); stroke-width: 1.3; transform-box: fill-box; transform-origin: center; }
  .mark.lit { fill: var(--sg); stroke: var(--sg); }
  .flag { fill: none; stroke: var(--color-border-primary); stroke-width: 1.4; stroke-linejoin: round; transform-box: fill-box; transform-origin: 0 100%; }
  .flag.lit { fill: var(--sg); stroke: var(--sg); }
  .col.late .s-ghost { stroke: color-mix(in oklab, var(--sg-late) 60%, transparent); }

  .c-pct { margin-top: 4px; color: var(--sg); font-size: 20px; font-weight: 720; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .c-name { font-size: 13px; font-weight: 620; line-height: 1.25; overflow-wrap: anywhere; }
  .c-amt { color: var(--color-text-secondary); font-size: 12px; font-variant-numeric: tabular-nums; }
  .c-when { color: var(--color-text-tertiary); font-size: 11.5px; font-variant-numeric: tabular-nums; }
  .col.late .c-when { color: var(--sg-late); font-weight: 600; }

  .empty {
    display: grid;
    grid-template-columns: 76px minmax(0, 1fr);
    gap: 18px;
    align-items: center;
    padding: 18px 24px 24px;
    color: var(--color-text-secondary);
    font-size: var(--font-text-md-size, 14px);
    line-height: 1.5;
  }
  .empty svg { width: 76px; height: auto; }
  .empty p { margin: 0 0 10px; }
  .empty q { color: var(--color-text-primary); font-weight: 550; }

  /* ── the panel: the selected goal and the one action that matters ── */
  .panel {
    margin: 4px 20px 0;
    padding: 16px 18px 16px;
    border: 1px solid var(--color-border-secondary);
    border-radius: var(--border-radius-lg, 14px);
  }
  .p-head { display: flex; align-items: flex-start; gap: 10px; }
  .p-title { flex: 1; min-width: 0; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
  .p-title h2 { margin: 0; font-size: 17px; font-weight: 680; letter-spacing: -.015em; overflow-wrap: anywhere; }
  .p-tools { display: flex; gap: 2px; flex: none; margin: -4px -6px 0 0; }
  .p-tools .k-btn { padding: 5px 8px; }
  .p-facts { margin: 6px 0 0; color: var(--color-text-secondary); font-size: var(--font-text-sm-size, 12.5px); line-height: 1.5; font-variant-numeric: tabular-nums; }
  .p-facts b { color: var(--color-text-primary); font-weight: 650; }
  .p-facts .late { color: var(--sg-late); font-weight: 600; }
  .p-next { margin: 3px 0 0; color: var(--sg); font-size: var(--font-text-sm-size, 12.5px); font-weight: 600; font-variant-numeric: tabular-nums; }

  .fund { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 14px; }
  .fund[hidden] { display: none; }
  .quick { display: flex; flex-wrap: wrap; gap: 6px; }
  .qbtn {
    min-height: 36px;
    padding: 0 14px;
    border: 1px solid var(--k-accent-brd);
    border-radius: var(--border-radius-full, 999px);
    background: var(--k-accent-bg);
    color: var(--sg);
    font-size: 13.5px;
    font-weight: 680;
    font-variant-numeric: tabular-nums;
    cursor: pointer;
  }
  .qbtn:hover { background: color-mix(in oklab, var(--sg) 18%, transparent); }
  .qbtn:focus-visible, .addbtn:focus-visible { outline: 2px solid var(--color-ring-primary, var(--sg)); outline-offset: 2px; }
  .custom { display: flex; gap: 6px; flex: 1 1 210px; min-width: 0; }
  .custom .k-field { flex: 1; min-width: 0; height: 36px; font-variant-numeric: tabular-nums; }
  .addbtn {
    flex: none;
    min-height: 36px;
    padding: 0 16px;
    border: 0;
    border-radius: var(--border-radius-md, 10px);
    background: var(--sg);
    color: var(--sg-on);
    font-size: 13.5px;
    font-weight: 680;
    cursor: pointer;
  }
  .addbtn:hover { background: color-mix(in oklab, var(--sg) 88%, var(--color-text-primary)); }
  .toast { min-height: 0; margin: 10px 0 0; font-size: var(--font-text-sm-size, 12.5px); }
  .toast:empty { display: none; }
  .toast .k-badge { font-size: 12px; padding: 3px 10px; }

  /* ── reached ── */
  .done { padding: 18px 20px 22px; }
  .done[hidden] { display: none; }
  .done h3 { margin: 0 0 10px; display: flex; align-items: baseline; gap: 8px; font-size: var(--font-text-sm-size, 12.5px); font-weight: 650; }
  .done h3 span { color: var(--color-text-tertiary); font-weight: 500; font-variant-numeric: tabular-nums; }
  .done ul { margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 8px; }
  .trophy {
    width: 100%;
    display: grid;
    grid-template-columns: 26px minmax(0, 1fr) auto;
    align-items: center;
    gap: 10px;
    padding: 8px 12px 8px 10px;
    border: 1px solid var(--color-border-secondary);
    border-radius: var(--border-radius-md, 10px);
    background: transparent;
    text-align: left;
    cursor: pointer;
  }
  .trophy:hover { background: var(--k-ink-4); }
  .trophy.sel { border-color: var(--k-accent-brd); background: var(--k-accent-bg); }
  .trophy svg { width: 26px; height: 26px; fill: none; stroke: var(--sg); stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
  .trophy .t-name { min-width: 0; font-size: 13px; font-weight: 600; line-height: 1.3; overflow-wrap: anywhere; }
  .trophy .t-name small { display: block; color: var(--color-text-tertiary); font-size: 11.5px; font-weight: 450; }
  .trophy .t-amt { color: var(--color-text-secondary); font-size: 12.5px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }

  /* The one action that matters is a deposit: the new coins drop onto the stack one after another,
     the numbers roll up, and a milestone that was crossed pops. Nothing moves on first paint. */
  @media (prefers-reduced-motion: no-preference) {
    .coin.drop, .s-edge.drop { animation: sg-drop 560ms var(--k-spring) both; animation-delay: var(--d, 0ms); }
    .mark.pop, .flag.pop { animation: sg-pop 620ms var(--k-spring) both; animation-delay: var(--d, 0ms); }
    .toast .k-badge { animation: k-pop 360ms var(--k-spring); }
    .qbtn, .addbtn { transition: transform var(--k-t-fast) var(--k-ease), background var(--k-t-fast); }
    .qbtn:active, .addbtn:active { transform: scale(.95); }
    .col { transition: background var(--k-t-fast), border-color var(--k-t-fast); }
    @keyframes sg-drop {
      0% { transform: translateY(-64px); opacity: 0; }
      35% { opacity: 1; }
      100% { transform: none; opacity: 1; }
    }
    @keyframes sg-pop {
      0% { transform: scale(1); }
      45% { transform: scale(1.9); }
      100% { transform: scale(1); }
    }
  }

  /* One or two goals: the stacks stand beside their panel instead of leaving a half-empty shelf. */
  @media (min-width: 601px) {
    .sg.few .mid { display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: start; }
    .sg.few .shelf { flex-wrap: nowrap; padding-right: 6px; }
    .sg.few .col { flex: 0 0 150px; }
    .sg.few .panel { margin: 14px 20px 0 0; }
  }

  @media (max-width: 600px) {
    .hero { padding: 18px 16px 4px; }
    .big { font-size: 42px; }
    .pace { max-width: none; }
    .shelf { gap: 8px 4px; padding: 12px 10px 6px; }
    .col { flex-basis: 100px; padding: 6px 4px 8px; }
    .c-pct { font-size: 18px; }
    .c-name { font-size: 12.5px; }
    .panel { margin: 4px 12px 0; padding: 14px; }
    .done { padding: 16px 12px 18px; }
    .empty { padding: 16px; grid-template-columns: 56px minmax(0, 1fr); }
    .error-strip { margin: 10px 12px 0; }
    .composer { grid-template-columns: 1fr 1fr; padding: 12px 16px 14px; }
    .composer .wide { grid-column: 1 / -1; }
    .bar-actions .lbl { display: none; }
  }
</style>
</head>
<body>
<main class="sg k-stage">
  <header class="k-appbar">
    <span class="sg-mark k-appmark" aria-hidden="true">
      <svg viewBox="0 0 18 18"><rect x="3" y="12.5" width="12" height="3" rx="1.5"/><rect x="4" y="9" width="12" height="3" rx="1.5"/><rect x="2.5" y="5.5" width="12" height="3" rx="1.5"/><path d="M9 1.5v2"/></svg>
    </span>
    <div class="k-appcopy"><h1 data-t="name">Savings goals</h1></div>
    <div class="bar-actions">
      <button id="newBtn" class="k-btn ghost" type="button" aria-expanded="false" aria-controls="composer">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        <span class="lbl" data-t="newGoal">New goal</span>
      </button>
      <button id="askBtn" class="k-btn sec" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 .8 3.2A6.5 6.5 0 0 0 17.5 11l3.2.8-3.2.8a6.5 6.5 0 0 0-4.7 4.7L12 20.5l-.8-3.2a6.5 6.5 0 0 0-4.7-4.7l-3.2-.8 3.2-.8a6.5 6.5 0 0 0 4.7-4.8L12 3Z"/></svg>
        <span data-t="ask">Plan with AI</span>
      </button>
    </div>
  </header>

  <div class="error-strip" id="errorStrip" role="status" aria-live="polite" hidden></div>

  <form id="composer" class="composer" hidden>
    <label class="wide"><span data-t="fTitle">Goal</span><input id="gTitle" class="k-field" maxlength="80" autocomplete="off" required></label>
    <label><span data-t="fTarget">Target</span><input id="gTarget" class="k-field" type="number" min="0.01" step="0.01" required></label>
    <label><span data-t="fSaved">Saved so far</span><input id="gSaved" class="k-field" type="number" min="0" step="0.01" value="0"></label>
    <label><span data-t="fCur">Currency</span><input id="gCur" class="k-field" maxlength="3" required></label>
    <label><span data-t="fDate">Target date</span><input id="gDate" class="k-field" type="date" required></label>
    <button class="addbtn" type="submit" data-t="save">Save goal</button>
  </form>

  <section class="hero" id="hero">
    <div>
      <p class="kicker" id="kicker"></p>
      <p class="big" id="total">0</p>
      <p class="of" id="ofLine"></p>
    </div>
    <p class="pace" id="paceLine"></p>
  </section>

  <div class="mid">
  <section class="shelf" id="shelf" aria-label="Goals"></section>

  <section class="panel" id="panel" hidden aria-live="polite">
    <div class="p-head">
      <div class="p-title"><h2 id="pName"></h2><span id="pBadge" class="k-badge"></span></div>
      <div class="p-tools">
        <button id="upBtn" class="k-btn ghost" type="button">↑</button>
        <button id="downBtn" class="k-btn ghost" type="button">↓</button>
        <button id="delBtn" class="k-btn ghost" type="button">×</button>
      </div>
    </div>
    <p class="p-facts" id="pFacts"></p>
    <p class="p-next" id="pNext"></p>
    <form class="fund" id="fund">
      <div class="quick" id="quick"></div>
      <div class="custom">
        <input id="amt" class="k-field" type="number" min="0.01" step="0.01" inputmode="decimal">
        <button class="addbtn" type="submit" data-t="add">Add funds</button>
      </div>
    </form>
    <p class="toast" id="toast"></p>
  </section>
  </div>

  <section class="done" id="done" hidden>
    <h3><span data-t="reachedH" style="color:inherit;font-weight:inherit">Reached</span><span id="doneSum"></span></h3>
    <ul id="doneList"></ul>
  </section>
</main>

<script type="module">
  const NS = "http://www.w3.org/2000/svg";
  const COINS = 16;                    // one goal = sixteen coins; 25/50/75 % land on coin edges
  const MILESTONES = [25, 50, 75, 100];

  // ── copy ────────────────────────────────────────────────────────────────────────────────
  const COPY = {
    en: {
      name: "Savings goals",
      newGoal: "New goal",
      close: "Close",
      ask: "Plan with AI",
      fTitle: "Goal",
      fTarget: "Target",
      fSaved: "Saved so far",
      fCur: "Currency",
      fDate: "Target date",
      save: "Save goal",
      titlePh: "Emergency fund",
      add: "Add funds",
      amtPh: "Other amount",
      reachedH: "Reached",
      shelf: "Goals, in priority order",
      kicker: (n) => `Saved toward ${n} ${n === 1 ? "goal" : "goals"}`,
      kickerNone: "Saved toward your goals",
      of: (t, p) => `of ${t} · ${p}%`,

      quickLbl: (a, g) => `给「${g}」存入 ${a}`,
      stackLbl: (g, p, a, t) => `${g}：已存 ${p}%，${a} / ${t}`,
      emptyLine: "还没有目标。一个目标就是一个名字、一个金额和一个日期 —— 每个都会在这里变成一摞硬币。",
      emptySay: "可以对 AI 说：",
      emptyQuote: "我想在明年四月前存 3 万块去日本玩，现在已经存了 8000。",

      errAsk: "没能联系上助手，请重试。",
      errSave: "这笔没存上，请重试。",
      errAdd: "目标没保存上，请重试。",
      prompt: (goals) => `请按优先级帮我做一个可执行的储蓄计划：每个目标每月（和每周）该存多少、哪个目标日期不现实、能存的钱怎么在它们之间分配。我的目标：${goals || "还没有，帮我定几个"}。`,

    }
  };
  const loc = () => {
    const s = oma.pref("locale", "auto");
    return s === "auto" ? navigator.language : s;
  };
  const isZh = () => String(loc()).toLowerCase().startsWith("zh");
  const T = () => (isZh() ? COPY.zh : COPY.en);

  // ── money ───────────────────────────────────────────────────────────────────────────────
  const cleanCur = (v) => {
    const code = String(v || oma.pref("currency", "USD")).trim().toUpperCase();
    return /^[A-Z]{3}$/.test(code) ? code : "USD";
  };
  function money(value, cur, compact = false) {
    const v = Number(value) || 0;
    const whole = Math.abs(v - Math.round(v)) < 0.005;
    const short = compact && Math.abs(v) >= 10000;
    try {
      return new Intl.NumberFormat(loc(), {
        style: "currency",
        currency: cleanCur(cur),
        notation: short ? "compact" : "standard",
        minimumFractionDigits: whole || short ? 0 : 2,
        maximumFractionDigits: short ? 1 : whole ? 0 : 2
      }).format(v);
    } catch {
      return `${cleanCur(cur)} ${v.toLocaleString(loc(), { maximumFractionDigits: 2 })}`;
    }
  }
  const round2 = (v) => Math.round(v * 100) / 100;
  // A friendly deposit size near x: 1, 2 or 5 times a power of ten.
  function nice(x) {
    if (!(x > 0)) return 0;
    const p = Math.pow(10, Math.floor(Math.log10(x)));
    const m = x / p;
    const step = [1, 2, 3, 5, 10].reduce((a, b) => (Math.abs(Math.log(m / b)) < Math.abs(Math.log(m / a)) ? b : a));
    return step * p;
  }

  // ── time (facts stored, judgments derived here, every render) ──────────────────────────
  const dateOnly = (iso) => {
    const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(iso || ""));
    return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null;
  };
  const today = () => {
    const n = new Date();
    return new Date(n.getFullYear(), n.getMonth(), n.getDate());
  };
  const daysUntil = (iso) => {
    const d = dateOnly(iso);
    return d ? Math.round((d - today()) / 86400000) : null;
  };
  const monthsUntil = (iso) => {
    const d = dateOnly(iso);
    const t = today();
    if (!d) return null;
    return (d.getFullYear() - t.getFullYear()) * 12 + d.getMonth() - t.getMonth() - (d.getDate() < t.getDate() ? 1 : 0);
  };
  function fmtDate(iso) {
    const d = dateOnly(iso);
    if (!d) return T().noDate;
    const pref = oma.pref("date_format", "auto");
    const dd = String(d.getDate()).padStart(2, "0");
    const mm = String(d.getMonth() + 1).padStart(2, "0");
    if (pref === "yyyy-mm-dd") return `${d.getFullYear()}-${mm}-${dd}`;
    if (pref === "dd/mm/yyyy") return `${dd}/${mm}/${d.getFullYear()}`;
    if (pref === "mm/dd/yyyy") return `${mm}/${dd}/${d.getFullYear()}`;
    return new Intl.DateTimeFormat(loc(), { day: "numeric", month: "short", year: "numeric" }).format(d);
  }
  function whenText(days, months) {
    const L = T();
    if (days === null) return L.noDate;
    if (days < 0) return -days >= 14 ? L.wksLate(Math.floor(-days / 7)) : L.daysLate(-days);
    if (days === 0) return L.dueToday;
    if (days <= 60) return L.daysLeft(days);
    return L.mosLeft(Math.max(2, months));
  }

  // ── state ───────────────────────────────────────────────────────────────────────────────
  let latest = { items: [] };
  // Optimistic deposits: id → {value, ver, tok}. The stack shows the new amount the moment a
  // button is pressed; the entry leaves once the store carries that amount (or a newer version).
  const overlay = new Map();
  const deleting = new Set();
  let tokSeq = 0;
  let selected = null;
  let awaitSel = null;                 // a goal just added: selected before its row arrives
  let composing = false;

  function reconcile(state) {
    for (const [id, o] of overlay) {
      const it = state.items.find((x) => x.id === id);
      if (!it) { overlay.delete(id); continue; }
      if (Number(it.fields?.current_amount) === o.value) { overlay.delete(id); continue; }
      if (o.ver != null && Number(it.version) >= o.ver) overlay.delete(id);
    }
  }

  const prio = (f) => Math.max(1, Math.round(Number(f.priority) || 999));

  function model(state) {
    const goals = state.items.filter((it) => !deleting.has(it.id)).map((it) => {
      const f = it.fields || {};
      const target = Math.max(0, Number(f.target_amount) || 0);
      const saved = overlay.has(it.id) ? overlay.get(it.id).value : Math.max(0, Number(f.current_amount) || 0);
      const pct = target > 0 ? Math.min(100, (saved / target) * 100) : 0;
      const reachedGroup = it.group === "reached";
      const full = target > 0 && saved >= target;
      const days = daysUntil(f.target_date);
      const remaining = Math.max(0, target - saved);
      // What each month has to hold for the date to be met; the last month counts as one.
      const perMonth = !full && days !== null && days > 0 ? remaining / Math.max(1, days / 30.44) : 0;
      return {
        id: it.id,
        position: it.position,
        title: String(f.title || "").trim(),
        cur: cleanCur(f.currency),
        date: f.target_date,
        priority: prio(f),
        target, saved, pct, remaining, days, perMonth,
        months: monthsUntil(f.target_date),
        reached: reachedGroup,
        full,
        late: !reachedGroup && !full && days !== null && days < 0
      };
    });
    const order = (a, b) => a.priority - b.priority ||
      String(a.date || "").localeCompare(String(b.date || "")) || a.position - b.position;
    // Any group other than "reached" is on the shelf — an AI-written "saving" row is never lost.
    const active = goals.filter((g) => !g.reached).sort(order);
    const reached = goals.filter((g) => g.reached).sort(order);

    // The hero speaks one currency: the one most active goals use (ties → the top priority's).
    const counts = new Map();
    for (const g of active) counts.set(g.cur, (counts.get(g.cur) || 0) + 1);
    let heroCur = active[0]?.cur || reached[0]?.cur || cleanCur();
    for (const [c, n] of counts) if (n > (counts.get(heroCur) || 0)) heroCur = c;
    const inCur = active.filter((g) => g.cur === heroCur);
    const others = active.length - inCur.length;
    const saved = inCur.reduce((s, g) => s + g.saved, 0);
    const target = inCur.reduce((s, g) => s + g.target, 0);
    const capped = inCur.reduce((s, g) => s + Math.min(g.saved, g.target), 0);
    const monthly = inCur.reduce((s, g) => s + g.perMonth, 0);
    const late = active.filter((g) => g.late).length;
    return { active, reached, heroCur, inCur, others, saved, target, capped, monthly, late };
  }

  // ── numbers that roll ───────────────────────────────────────────────────────────────────
  const reduced = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
  const rolls = new WeakMap();
  function roll(el, to, fmt, animate) {
    const r = rolls.get(el) || { shown: null, raf: 0 };
    rolls.set(el, r);
    if (r.shown === to && el.textContent) return;
    cancelAnimationFrame(r.raf);
    const from = r.shown;
    r.shown = to;
    if (!animate || from == null || reduced()) {
      el.textContent = fmt(to);
      return;
    }
    const t0 = performance.now();
    const step = (now) => {
      const k = Math.min(1, (now - t0) / 700);
      const e = 1 - Math.pow(1 - k, 3);
      el.textContent = fmt(k < 1 ? Math.round(from + (to - from) * e) : to);
      if (k < 1) r.raf = requestAnimationFrame(step);
    };
    r.raf = requestAnimationFrame(step);
  }
  const isLive = () => root.classList.contains("live");

  // ── the stacks (built once per goal, updated in place) ─────────────────────────────────
  const root = document.querySelector(".sg");
  const shelf = document.getElementById("shelf");
  const cols = new Map();
  const BASE = 160;
  const COIN_H = 8;
  const TOP = BASE - COINS * COIN_H;          // 32: the target line sits here
  const markY = (m) => BASE - (m / 100) * COINS * COIN_H;

  function svgEl(tag, attrs) {
    const el = document.createElementNS(NS, tag);
    for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
    return el;
  }
  // A hand-stacked look: each coin sits a pixel or two off-centre, the same way every time.
  function jitter(id, i) {
    let h = 2166136261;
    const s = `${id}:${i}`;
    for (let k = 0; k < s.length; k++) h = Math.imul(h ^ s.charCodeAt(k), 16777619);
    return ((h >>> 0) % 5) - 2;
  }

  function buildCol(g) {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "col";
    btn.dataset.id = g.id;
    const svg = svgEl("svg", { viewBox: "0 0 100 170", "aria-hidden": "true" });
    svg.append(
      svgEl("rect", { class: "s-ghost", x: 18, y: TOP, width: 64, height: BASE - TOP, rx: 4 }),
      svgEl("line", { class: "s-goal", x1: 6, x2: 86, y1: TOP - 1, y2: TOP - 1 })
    );
    const coins = [];
    const edges = [];
    for (let i = 0; i < COINS; i++) {
      const y = BASE - (i + 1) * COIN_H + 0.6;
      const x = 18 + jitter(g.id, i);
      const c = svgEl("rect", { class: "coin", x, y, width: 64, height: COIN_H - 1.2, rx: 3.4 });
      // two reeding ticks on the coin's edge: the detail that makes a pill read as a coin
      const e = svgEl("path", { class: "s-edge", d: `M${x + 14} ${y + 2}v${COIN_H - 5.2}M${x + 50} ${y + 2}v${COIN_H - 5.2}` });
      svg.append(c, e);
      coins.push(c);
      edges.push(e);
    }
    const marks = [25, 50, 75].map((m) => {
      const y = markY(m);
      svg.append(svgEl("line", { class: "s-base", x1: 84, x2: 89, y1: y, y2: y }));
      const c = svgEl("circle", { class: "mark", cx: 93, cy: y, r: 3.2 });
      svg.append(c);
      return c;
    });
    const flag = svgEl("path", { class: "flag", d: `M86 ${TOP - 1}V${TOP - 17}l9 3.5-9 3.5` });
    svg.append(flag, svgEl("line", { class: "s-base", x1: 4, x2: 96, y1: BASE + 1.5, y2: BASE + 1.5 }));
    marks.push(flag);

    const pct = document.createElement("span");
    pct.className = "c-pct";
    const name = document.createElement("span");
    name.className = "c-name";
    const amt = document.createElement("span");
    amt.className = "c-amt";
    const when = document.createElement("span");
    when.className = "c-when";
    btn.append(svg, pct, name, amt, when);
    btn.onclick = () => select(g.id);
    const col = { btn, coins, edges, marks, pct, name, amt, when, shown: null, lit: null, saved: null };
    cols.set(g.id, col);
    return col;
  }

  function updateCol(col, g) {
    const L = T();
    const n = g.pct <= 0 ? 0 : Math.max(1, Math.floor(g.pct / (100 / COINS) + 1e-9));
    // Money went in: new coins drop onto the stack. A deposit too small to add a whole coin still
    // drops one — the top coin falls back into place — so every deposit is seen landing.
    const grew = isLive() && col.saved != null && g.saved > col.saved + 1e-9 && !reduced();
    const prev = col.shown == null ? n : n > col.shown ? col.shown : grew && n > 0 ? n - 1 : n;
    const animate = grew || (isLive() && col.shown != null && n > col.shown && !reduced());
    col.saved = g.saved;
    col.coins.forEach((c, i) => {
      const on = i < n;
      c.classList.toggle("on", on);
      col.edges[i].classList.toggle("on", on);
      if (animate && on && i >= prev) {
        const d = `${(i - prev) * 70}ms`;
        for (const el of [c, col.edges[i]]) {
          el.classList.remove("drop");
          el.style.setProperty("--d", d);
          void el.getBBox();
          el.classList.add("drop");
        }
      }
    });
    col.shown = n;
    const litNow = MILESTONES.map((m) => g.pct >= m - 1e-9);
    col.marks.forEach((mk, i) => {
      mk.classList.toggle("lit", litNow[i]);
      if (animate && litNow[i] && col.lit && !col.lit[i]) {
        mk.classList.remove("pop");
        // the mark pops as the coin that reaches it lands
        const landing = Math.min(n, Math.round(MILESTONES[i] / (100 / COINS))) - 1 - prev;
        mk.style.setProperty("--d", `${Math.max(0, landing) * 70 + 320}ms`);
        void mk.getBBox();
        mk.classList.add("pop");
      }
    });
    col.lit = litNow;
    roll(col.pct, g.pct, (v) => L.pct(Math.floor(v)), animate);
    col.name.textContent = g.title || L.untitled;
    roll(col.amt, g.saved, (v) => L.amtOf(money(Math.round(v * 100) / 100, g.cur, true), money(g.target, g.cur, true)), animate);
    col.when.textContent = g.full ? L.full : whenText(g.days, g.months);
    col.btn.classList.toggle("late", g.late);
    col.btn.classList.toggle("sel", g.id === selected);
    col.btn.setAttribute("aria-pressed", String(g.id === selected));
    col.btn.setAttribute("aria-label", L.stackLbl(g.title || L.untitled, Math.floor(g.pct), money(g.saved, g.cur), money(g.target, g.cur)));
  }

  function renderShelf(m) {
    const ids = new Set(m.active.map((g) => g.id));
    for (const [id, col] of cols) {
      if (!ids.has(id)) { col.btn.remove(); cols.delete(id); }
    }
    for (const g of m.active) {
      const col = cols.get(g.id) || buildCol(g);
      updateCol(col, g);
      shelf.appendChild(col.btn);        // appending an attached node moves it: priority order
    }

    renderEmpty(m);
  }

  let emptyEl = null;
  function renderEmpty(m) {
    const none = !m.active.length && !m.reached.length;
    if (!none) {
      if (emptyEl) { emptyEl.remove(); emptyEl = null; }
      return;
    }
    const L = T();
    if (!emptyEl) {
      emptyEl = document.createElement("div");
      emptyEl.className = "empty";
      shelf.after(emptyEl);
    }

      `<svg viewBox="0 0 76 90" aria-hidden="true"><rect x="10" y="10" width="56" height="72" rx="4" fill="none" stroke="var(--color-border-primary)" stroke-dasharray="3 3"/>` +
      `<rect x="10" y="74" width="56" height="7" rx="3.4" fill="var(--sg-coin)" stroke="var(--sg)" stroke-width="1.3"/>` +
      `<line x1="2" x2="74" y1="83" y2="83" stroke="var(--color-border-primary)" stroke-width="1.6" stroke-linecap="round"/>` +
      `<line x1="4" x2="66" y1="9" y2="9" stroke="var(--sg)" stroke-dasharray="4 3" stroke-width="1.4"/></svg>`;
    const body = document.createElement("div");
    const p1 = document.createElement("p");
    p1.textContent = L.emptyLine;
    const p2 = document.createElement("p");
    p2.append(`${L.emptySay} `);
    const q = document.createElement("q");
    q.textContent = L.emptyQuote;
    p2.append(q);
    const b = document.createElement("button");
    b.type = "button";
    b.className = "addbtn";
    b.textContent = L.newGoal;
    b.onclick = () => setComposer(true);
    body.append(p1, p2, b);
    emptyEl.append(body);
  }

  // ── hero ────────────────────────────────────────────────────────────────────────────────
  function renderHero(m, animate) {
    const L = T();
    const hero = document.getElementById("hero");
    hero.hidden = !m.active.length && !m.reached.length;
    document.getElementById("kicker").textContent = m.inCur.length ? L.kicker(m.inCur.length) : L.kickerNone;
    const heroSaved = m.inCur.length ? m.saved : m.reached.filter((g) => g.cur === m.heroCur).reduce((s, g) => s + g.saved, 0);
    roll(document.getElementById("total"), heroSaved, (v) => money(Math.round(v), m.heroCur), animate);
    const of = document.getElementById("ofLine");
    if (m.inCur.length) {
      const p = m.target > 0 ? Math.floor((m.capped / m.target) * 100) : 0;
      of.textContent = L.of(money(m.target, m.heroCur), p) +
        (m.others ? L.otherCur(m.others, [...new Set(m.active.filter((g) => g.cur !== m.heroCur).map((g) => g.cur))].join(", ")) : "");
    } else {
      of.textContent = m.reached.length ? L.allDone : "";
    }
    const pace = document.getElementById("paceLine");
    pace.textContent = "";
    if (!m.active.length) return;
    if (m.monthly > 0) {
      const b = document.createElement("b");
      b.textContent = money(Math.ceil(m.monthly), m.heroCur);
      const parts = m.late ? L.paceRest(b) : L.pace(b);
      pace.append(...parts);
    } else if (!m.late) {
      pace.textContent = L.paceNone;
    }
    if (m.late) {
      const badge = document.createElement("span");
      badge.className = "k-badge bad";
      badge.textContent = L.late(m.late);
      pace.append(badge);
    }
  }

  // ── panel: the selected goal ────────────────────────────────────────────────────────────
  const panel = document.getElementById("panel");
  const amtInput = document.getElementById("amt");
  let toastTimer = null;

  function quickAmounts(g) {
    const base = [nice(g.target / 100), nice(g.target / 20), nice(g.target / 10)].filter((v) => v > 0);
    return [...new Set(base)].slice(0, 3);
  }

  function renderPanel(m) {
    const L = T();
    const all = [...m.active, ...m.reached];
    let g = all.find((x) => x.id === selected);
    if (g && selected === awaitSel) awaitSel = null;
    if (!g) {
      const fallback = m.active[0] || m.reached[0] || null;
      if (selected !== awaitSel || !selected) selected = fallback?.id || null;
      g = fallback;
    }
    panel.hidden = !g;
    if (!g) return;
    document.getElementById("pName").textContent = g.title || L.untitled;
    const badge = document.getElementById("pBadge");
    badge.textContent = g.reached ? L.reached : L.prio(g.priority);
    badge.className = g.reached ? "k-badge ok" : "k-badge info";

    const facts = document.getElementById("pFacts");
    facts.textContent = "";
    const bold = (text) => {
      const b = document.createElement("b");
      b.textContent = text;
      return b;
    };
    const sep = () => facts.append(" · ");
    if (g.reached || g.full) {
      facts.append(...L.savedAll(bold(money(g.saved, g.cur))));
      sep();
      facts.append(L.targetWas(fmtDate(g.date)));
    } else if (g.late) {
      facts.append(...L.short(bold(money(g.remaining, g.cur))));
      sep();
      const s = document.createElement("span");
      s.className = "late";
      s.textContent = `${L.wasDue(fmtDate(g.date))} · ${whenText(g.days, g.months)}`;
      facts.append(s);
    } else {
      facts.append(...L.toGo(bold(money(g.remaining, g.cur))));
      sep();
      facts.append(`${L.by(fmtDate(g.date))} · ${whenText(g.days, g.months)}`);
      if (g.perMonth > 0) {
        sep();
        const each = money(Math.ceil(g.perMonth), g.cur);
        facts.append(...(g.days <= 31 ? L.lastDay(bold(money(Math.ceil(g.remaining), g.cur))) : L.monthly(bold(each))));
      }
    }
    const next = MILESTONES.find((ms) => g.pct < ms - 1e-9);
    const pNext = document.getElementById("pNext");
    pNext.textContent = !g.reached && next && g.target > 0
      ? L.next(money(Math.ceil((g.target * next) / 100 - g.saved), g.cur), next)
      : "";

    const fund = document.getElementById("fund");
    fund.hidden = g.reached;
    const quick = document.getElementById("quick");
    const amounts = quickAmounts(g);
    const key = `${g.id}|${g.cur}|${amounts.join(",")}|${isZh()}`;
    if (quick.dataset.key !== key) {
      quick.dataset.key = key;
      quick.textContent = "";
      for (const a of amounts) {
        const b = document.createElement("button");
        b.type = "button";
        b.className = "qbtn";
        b.textContent = `+${money(a, g.cur)}`;
        b.setAttribute("aria-label", L.quickLbl(money(a, g.cur), g.title || L.untitled));
        b.onclick = () => deposit(g.id, a);
        quick.appendChild(b);
      }
    }
    amtInput.placeholder = L.amtPh;
    const peers = g.reached ? m.reached : m.active;
    const i = peers.findIndex((x) => x.id === g.id);
    const up = document.getElementById("upBtn");
    const down = document.getElementById("downBtn");
    up.hidden = down.hidden = g.reached || peers.length < 2;
    up.disabled = i <= 0;
    down.disabled = i >= peers.length - 1;
    up.title = L.up;
    down.title = L.down;
    up.setAttribute("aria-label", L.up);
    down.setAttribute("aria-label", L.down);
    const del = document.getElementById("delBtn");
    del.title = L.del;
    del.setAttribute("aria-label", L.del);
  }

  function toast(text, kind = "info") {
    const el = document.getElementById("toast");
    clearTimeout(toastTimer);
    el.textContent = "";
    const b = document.createElement("span");
    b.className = `k-badge ${kind}`;
    b.textContent = text;
    el.appendChild(b);
    toastTimer = setTimeout(() => { el.textContent = ""; }, 3200);
  }

  // ── reached ─────────────────────────────────────────────────────────────────────────────
  const TROPHY = `<svg viewBox="0 0 26 26" aria-hidden="true"><rect x="4" y="18" width="15" height="4" rx="2"/><rect x="5.5" y="13.5" width="15" height="4" rx="2"/><rect x="4" y="9" width="15" height="4" rx="2"/><path d="m16.5 5 2 2 4-4.5"/></svg>`;
  function renderDone(m) {
    const L = T();
    const done = document.getElementById("done");
    done.hidden = !m.reached.length;
    if (!m.reached.length) return;
    const sums = new Map();
    for (const g of m.reached) sums.set(g.cur, (sums.get(g.cur) || 0) + g.saved);
    document.getElementById("doneSum").textContent = [...sums].map(([c, v]) => money(v, c)).join(" · ");
    const list = document.getElementById("doneList");
    list.textContent = "";
    for (const g of m.reached) {
      const li = document.createElement("li");
      const b = document.createElement("button");
      b.type = "button";
      b.className = `trophy${g.id === selected ? " sel" : ""}`;
      b.setAttribute("aria-pressed", String(g.id === selected));
      b.innerHTML = TROPHY;
      const nm = document.createElement("span");
      nm.className = "t-name";
      nm.textContent = g.title || L.untitled;
      const sm = document.createElement("small");
      sm.textContent = fmtDate(g.date);
      nm.appendChild(sm);
      const a = document.createElement("span");
      a.className = "t-amt";
      a.textContent = money(g.saved, g.cur);
      b.append(nm, a);
      b.onclick = () => select(g.id);
      li.appendChild(b);
      list.appendChild(li);
    }
  }

  // ── render ──────────────────────────────────────────────────────────────────────────────
  function render(state) {
    latest = state;
    const m = model(state);
    renderHero(m, isLive());
    renderPanel(m);
    root.classList.toggle("few", m.active.length > 0 && m.active.length <= 2);
    renderShelf(m);
    renderDone(m);
  }

  function select(id) {
    if (selected !== id) {
      selected = id;
      document.getElementById("toast").textContent = "";
      amtInput.value = "";
    }
    render(latest);
  }

  // ── actions ─────────────────────────────────────────────────────────────────────────────
  const errorStrip = document.getElementById("errorStrip");
  let errorTimer = null;
  function showError(msg) {
    clearTimeout(errorTimer);
    errorStrip.textContent = msg;
    errorStrip.hidden = false;
    errorTimer = setTimeout(() => { errorStrip.hidden = true; }, 7000);
  }

  async function deposit(id, add) {
    const g = model(latest).active.find((x) => x.id === id);
    if (!g || !(add > 0)) return;
    const next = round2(g.saved + add);
    const before = g.pct;
    const after = g.target > 0 ? Math.min(100, (next / g.target) * 100) : 0;
    const tok = ++tokSeq;
    overlay.set(id, { value: next, ver: null, tok });
    render(latest);
    const crossed = MILESTONES.filter((ms) => before < ms - 1e-9 && after >= ms - 1e-9).pop();
    if (crossed) toast(T().hit[crossed], crossed === 100 ? "ok" : "info");
    let ack = null;
    try {
      ack = await oma.updateItem(id, { current_amount: next });
    } catch (e) {
      ack = null;
    }
    const o = overlay.get(id);
    if (!ack || ack.ok === false) {
      if (o && o.tok === tok) overlay.delete(id);
      showError(T().errSave);
      render(latest);
      return;
    }
    if (o && o.tok === tok) {
      o.ver = Number(ack.item?.version) || null;
      reconcile(latest);
      render(latest);
    }
    // A full stack gets a moment on the shelf before it moves to Reached.
    if (g.target > 0 && next >= g.target) {
      setTimeout(async () => {
        const it = latest.items.find((x) => x.id === id);
        if (!it || it.group === "reached" || Number(it.fields?.current_amount) < g.target) return;
        try {
          await oma.moveItem(id, "reached");
        } catch (e) { /* stays on the shelf, drawn full; the next deposit or the AI can move it */ }
      }, 1600);
    }
  }

  document.getElementById("fund").onsubmit = (e) => {
    e.preventDefault();
    const v = Number(amtInput.value);
    if (!Number.isFinite(v) || v <= 0 || !selected) return;
    amtInput.value = "";
    deposit(selected, round2(v));
  };

  async function nudge(dir) {
    const m = model(latest);
    const i = m.active.findIndex((g) => g.id === selected);
    const j = i + dir;
    if (i < 0 || j < 0 || j >= m.active.length) return;
    const a = m.active[i];
    const b = m.active[j];
    // Equal priorities (or gaps) get the positions they are shown in, so a nudge always moves.
    const pa = a.priority === b.priority ? j + 1 : b.priority;
    const pb = a.priority === b.priority ? i + 1 : a.priority;
    try {
      await Promise.all([oma.updateItem(a.id, { priority: pa }), oma.updateItem(b.id, { priority: pb })]);
    } catch (e) {
      showError(T().errSave);
    }
  }
  document.getElementById("upBtn").onclick = () => nudge(-1);
  document.getElementById("downBtn").onclick = () => nudge(1);

  document.getElementById("delBtn").onclick = async () => {
    const id = selected;
    if (!id || deleting.has(id)) return;
    let ack = null;
    try {
      ack = await oma.deleteItem(id);   // the engine asks first when confirm_delete is on
    } catch (e) {
      ack = null;
    }
    if (ack && ack.ok !== false) {
      deleting.add(id);
      if (selected === id) selected = null;
      render(latest);
    }
  };

  // ── composer ────────────────────────────────────────────────────────────────────────────
  const composer = document.getElementById("composer");
  const newBtn = document.getElementById("newBtn");
  function setComposer(open) {
    composing = open;
    composer.hidden = !open;
    newBtn.setAttribute("aria-expanded", String(open));
    newBtn.querySelector(".lbl").textContent = open ? T().close : T().newGoal;
    newBtn.setAttribute("aria-label", open ? T().close : T().newGoal);
    if (open) {
      const cur = document.getElementById("gCur");
      if (!cur.value) cur.value = cleanCur();
      document.getElementById("gTitle").focus();
    }
  }
  newBtn.onclick = () => setComposer(!composing);

  composer.onsubmit = async (e) => {
    e.preventDefault();
    const title = document.getElementById("gTitle").value.trim();
    const target = Number(document.getElementById("gTarget").value);
    const saved = Number(document.getElementById("gSaved").value) || 0;
    const currency = cleanCur(document.getElementById("gCur").value);
    const date = document.getElementById("gDate").value;
    if (!title || !Number.isFinite(target) || target <= 0 || saved < 0 || !date) return;
    const priority = latest.items.reduce((mx, it) => Math.max(mx, prio(it.fields || {}) === 999 ? 0 : prio(it.fields || {})), 0) + 1;
    let ack = null;
    try {
      ack = await oma.addItem({
        group: saved >= target ? "reached" : "active",
        fields: { title, target_amount: round2(target), current_amount: round2(saved), currency, target_date: date, priority }
      });
    } catch (err) {
      ack = null;
    }
    if (!ack || ack.ok === false) {
      showError(T().errAdd);
      return;
    }
    composer.reset();
    document.getElementById("gSaved").value = "0";
    document.getElementById("gCur").value = currency;
    if (ack.id) selected = awaitSel = ack.id;
    setComposer(false);
    render(latest);
  };

  // AWAITED and disabled in flight: sendMessage crosses a bridge with a deadline. A degraded
  // result (no chat attached: the runtime copied the prompt and said so) is not a failure.
  const askBtn = document.getElementById("askBtn");
  askBtn.onclick = async () => {
    const L = T();
    const m = model(latest);
    const goals = [...m.active, ...m.reached].map((g) => L.goalLine(
      g.priority, g.title || L.untitled, money(g.saved, g.cur), money(g.target, g.cur),
      money(g.remaining, g.cur), g.date || "—", g.reached ? L.reached : whenText(g.days, g.months)
    )).join("; ");
    askBtn.disabled = true;
    try {
      const r = await oma.sendMessage(L.prompt(goals));
      if (r && r.isError === true && !r.degraded) showError(L.errAsk);
    } catch (e) {
      showError(L.errAsk);
    } finally {
      askBtn.disabled = false;
    }
  };

  // ── copy that doesn't change with data ─────────────────────────────────────────────────
  function applyCopy() {
    const L = T();
    document.documentElement.lang = isZh() ? "zh-CN" : "en";
    document.title = isZh() ? "储蓄目标" : "Savings Goals";
    for (const el of document.querySelectorAll("[data-t]")) el.textContent = L[el.dataset.t];
    document.getElementById("gTitle").placeholder = L.titlePh;
    newBtn.querySelector(".lbl").textContent = composing ? L.close : L.newGoal;
    newBtn.setAttribute("aria-label", composing ? L.close : L.newGoal);
    document.getElementById("quick").dataset.key = "";
  }

  // ── mount ───────────────────────────────────────────────────────────────────────────────
  if (oma.standalone) document.body.classList.add("standalone");
  oma.ready((s) => {
    document.getElementById("gCur").value = cleanCur();
    applyCopy();
    render(s);
    // Motion switches on after the first paint: opening the app shows the stacks as they are;
    // the drop is saved for a deposit.
    requestAnimationFrame(() => requestAnimationFrame(() => root.classList.add("live")));
  });
  oma.onChange((s) => {
    for (const id of deleting) if (!s.items.some((it) => it.id === id)) deleting.delete(id);
    reconcile(s);
    render(s);
  });
  oma.onPrefChange((c) => {
    if (c.key === "locale") applyCopy();
    render(latest);
  });
</script>
</body>
</html>
