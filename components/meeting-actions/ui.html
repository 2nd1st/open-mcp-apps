<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Turn meeting notes into a clear follow-up brief: what you own, what you are waiting on, and what is blocking the work.">
<meta name="oma-category" content="Work">
<title>Meeting Actions</title>
<style>
  /* Shared primitives (.k-*) — this app's own copy; nothing here comes from the engine. */
  :root{--k-accent:var(--color-text-info,var(--color-ring-primary,#3b6cf6));--k-bad:var(--color-text-danger,#e5484d);--k-ink-4:color-mix(in oklab,var(--color-text-primary) 4%,transparent);--k-accent-bg:color-mix(in oklab,var(--k-accent) 10%,transparent);--k-accent-brd:color-mix(in oklab,var(--k-accent) 28%,transparent);--k-t-fast:120ms;--k-t:180ms;--k-ease:cubic-bezier(.2,.8,.3,1);--k-spring:cubic-bezier(.34,1.56,.64,1);--k-surface:var(--color-background-primary)}
  @media (prefers-reduced-motion:reduce){:root{--k-t-fast:0ms;--k-t:0ms}}
  .k-ellip{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .k-btn{display:inline-flex;align-items:center;gap:6px;border:1px solid transparent;border-radius:var(--border-radius-md,10px);padding:6px 12px;font:inherit;font-size:var(--font-text-sm-size,12.5px);font-weight:600;cursor:pointer;background:var(--color-background-inverse);color:var(--color-text-inverse);transition:transform var(--k-t-fast) var(--k-ease),opacity var(--k-t-fast),background var(--k-t-fast)}
  .k-btn:hover{opacity:.9}
  .k-btn:active{transform:scale(.96)}
  .k-btn:disabled{opacity:.45;cursor:default;transform:none}
  .k-btn.sec{background:transparent;color:var(--color-text-primary);border-color:var(--color-border-primary)}
  .k-btn.ghost{background:transparent;color:var(--color-text-secondary)}
  :is(.k-btn.sec,.k-btn.ghost):hover{background:var(--k-ink-4);color:var(--color-text-primary);opacity:1}
  .k-btn.danger{background:transparent;color:var(--k-bad);border-color:color-mix(in oklab,var(--k-bad) 30%,transparent)}
  .k-btn.danger:hover{background:color-mix(in oklab,var(--k-bad) 10%,transparent);opacity:1}
  :is(.k-btn,.k-tab,.k-chip,.k-switch,.k-field):focus-visible{outline:2px solid var(--color-ring-primary,var(--k-accent));outline-offset:1px}
  .k-chip{display:inline-flex;align-items:center;gap:5px;border-radius:var(--border-radius-full,999px);border:1px solid var(--color-border-secondary);background:transparent;color:var(--color-text-secondary);padding:2px 10px;font:inherit;font-size:11.5px;font-weight:550;cursor:pointer;transition:background var(--k-t-fast),color var(--k-t-fast),border-color var(--k-t-fast),transform var(--k-t) var(--k-spring)}
  .k-chip:hover{background:var(--k-ink-4);color:var(--color-text-primary)}
  .k-chip:active{transform:scale(.93)}
  .k-chip.on{background:color-mix(in oklab,var(--k-accent) 10%,transparent);border-color:color-mix(in oklab,var(--k-accent) 28%,transparent);color:var(--k-accent)}
  .k-chip.static{cursor:default}
  .k-chip.static:hover{background:transparent;color:var(--color-text-secondary)}
  .k-chip.static:active{transform:none}
  .k-appbar{display:flex;align-items:center;gap:11px;padding:13px 16px}
  .k-appbar .k-appmark{display:grid;width:34px;height:34px;flex:none;place-items:center;border-radius:11px}
  .k-appbar .k-appmark svg{width:18px;height:18px}
  .k-appbar .k-appcopy{min-width:0;flex:1}
  .k-appbar .k-eyebrow{display:block;margin:0;color:var(--color-text-tertiary);font-size:9.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
  .k-appbar h1{margin:1px 0 0;font-size:15px;font-weight:650;letter-spacing:-.015em}
  body:not(.standalone) .k-appbar{border-bottom:1px solid var(--color-border-secondary);background:var(--k-surface)}
  .k-stage{max-width:760px;margin-inline:auto;overflow-x:clip}

  /* The signature is the EDITORIAL BRIEF: "The call is over. N promises are still moving." — N is
     counted from the same rows the two lanes draw, and it ticks down the moment you keep one.
     Structure is the host's; cobalt is this app's one identity colour. */
  .ma {
    --ma: light-dark(#2458c6, #8fb0ff);
    --k-accent: var(--ma);
    --k-accent-bg: color-mix(in oklab, var(--ma) 10%, transparent);
    --k-accent-brd: color-mix(in oklab, var(--ma) 30%, transparent);
    --accent: var(--ma);
    --success: var(--color-text-success, var(--accent));
    --warning: var(--color-text-warning, var(--accent));
    --danger: var(--color-text-danger, var(--warning));
    --accent-soft: color-mix(in oklab, var(--accent) 9%, var(--color-background-primary));
    --warning-soft: color-mix(in oklab, var(--warning) 10%, var(--color-background-primary));
    --danger-soft: color-mix(in oklab, var(--danger) 8%, var(--color-background-primary));
    --ink-soft: color-mix(in oklab, var(--color-text-primary) 3%, var(--color-background-primary));
  }

  button { font: inherit; color: inherit; }
  button:focus-visible { outline: 2px solid var(--color-ring-primary, var(--accent)); outline-offset: 2px; }

  /* ── app bar: mark · name · the AI hand-off ── */
  .app-mark {
    border: 1px solid var(--k-accent-brd);
    background: var(--accent-soft);
    color: var(--accent);
  }
  svg.i, .app-mark svg {
    fill: none;
    stroke: currentColor;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-width: 1.65;
  }
  .app-header .k-btn.sec { margin-left: auto; flex: none; }
  .app-header .k-btn svg { width: 15px; height: 15px; }

  /* ── the brief: dateline, headline, the two numbers ── */
  .brief {
    display: grid;
    grid-template-columns: minmax(0, 1.38fr) minmax(230px, .62fr);
    gap: 20px;
    align-items: stretch;
    padding: 24px 24px 22px;
    border-bottom: 1px solid var(--color-border-secondary);
  }
  .brief-copy { align-self: center; min-width: 0; }
  .dateline { color: var(--accent); font-size: 12px; font-weight: 650; }
  .brief h2 {
    max-width: 520px;
    margin: 8px 0 10px;
    font-size: clamp(26px, 4.7vw, 39px);
    font-weight: 740;
    line-height: 1.04;
    letter-spacing: -.05em;
    text-wrap: balance;
  }
  .brief h2 .n { display: inline-block; color: var(--accent); font-variant-numeric: tabular-nums; }
  .brief-copy p {
    max-width: 560px;
    margin: 0;
    color: var(--color-text-secondary);
    font-size: 12.5px;
    line-height: 1.55;
  }
  .ownership {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    border: 1px solid var(--color-border-secondary);
    border-radius: var(--border-radius-lg, 14px);
    background: var(--color-background-primary);
  }
  .owner-stat { display: grid; min-width: 0; align-content: center; padding: 16px 14px; }
  .owner-stat + .owner-stat { border-left: 1px solid var(--color-border-secondary); }
  .owner-label { color: var(--color-text-tertiary); font-size: 11px; font-weight: 650; }
  .owner-number { display: block; margin: 7px 0 5px; font-size: 37px; font-weight: 740; line-height: .85; letter-spacing: -.045em; font-variant-numeric: tabular-nums; }
  .owner-stat.mine .owner-number { color: var(--accent); }
  .owner-stat.theirs .owner-number { color: var(--warning); }
  .owner-note { color: var(--color-text-secondary); font-size: 11px; line-height: 1.25; }

  .error-strip {
    margin: 14px 16px 0;
    padding: 9px 11px;
    border: 1px solid color-mix(in oklab, var(--danger) 30%, var(--color-border-secondary));
    border-radius: var(--border-radius-md, 10px);
    background: var(--danger-soft);
    color: var(--danger);
    font-size: 11.5px;
  }
  .error-strip[hidden] { display: none; }

  /* ── the two lanes ── */
  .board { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; padding: 16px; }
  .lane {
    min-width: 0;
    padding: 13px;
    border: 1px solid var(--color-border-secondary);
    border-radius: var(--border-radius-lg, 14px);
    background: var(--ink-soft);
  }
  .lane.mine-lane { background: color-mix(in oklab, var(--accent) 4%, var(--color-background-primary)); }
  .lane.waiting-lane { background: color-mix(in oklab, var(--warning) 5%, var(--color-background-primary)); }
  .lane-head { display: flex; align-items: flex-start; gap: 9px; margin: 1px 2px 11px; }
  .lane-heading { min-width: 0; flex: 1; }
  .lane-head h3 { margin: 0; font-size: 15px; font-weight: 700; line-height: 1.2; letter-spacing: -.018em; }
  .lane-head p { margin: 3px 0 0; color: var(--color-text-tertiary); font-size: 11px; line-height: 1.35; }
  .lane-count {
    display: grid;
    min-width: 27px;
    height: 27px;
    place-items: center;
    border-radius: var(--border-radius-full, 999px);
    background: var(--color-background-primary);
    color: var(--color-text-secondary);
    font-size: 11px;
    font-weight: 750;
    font-variant-numeric: tabular-nums;
    box-shadow: inset 0 0 0 1px var(--color-border-secondary);
  }
  .cards { display: grid; gap: 9px; }
  .action-card {
    position: relative;
    display: grid;
    grid-template-columns: auto minmax(0, 1fr) auto;
    gap: 10px;
    min-width: 0;
    padding: 12px;
    border: 1px solid var(--color-border-secondary);
    border-radius: var(--border-radius-md, 10px);
    background: var(--color-background-primary);
    box-shadow: var(--shadow-sm);
  }
  .action-card.blocker {
    border-color: color-mix(in oklab, var(--danger) 38%, var(--color-border-primary));
    background: var(--danger-soft);
  }
  .action-card.blocker::before {
    position: absolute;
    top: 11px;
    bottom: 11px;
    left: -1px;
    width: 3px;
    border-radius: 0 var(--border-radius-full, 999px) var(--border-radius-full, 999px) 0;
    background: var(--danger);
    content: "";
  }
  .lead {
    position: relative;
    display: grid;
    width: 34px;
    height: 34px;
    flex: none;
    place-items: center;
    padding: 0;
    border-radius: 50%;
    cursor: pointer;
  }
  .lead svg { width: 16px; height: 16px; }
  .lead.check {
    border: 1px solid color-mix(in oklab, var(--accent) 34%, var(--color-border-primary));
    background: var(--accent-soft);
    color: var(--accent);
  }
  .lead.person {
    border: 1px solid transparent;
    background: var(--warning-soft);
    color: var(--warning);
    font-size: 9.5px;
    font-weight: 780;
    letter-spacing: .02em;
  }
  .lead.person svg { position: absolute; opacity: 0; }
  .lead.person:hover .ini, .lead.person:focus-visible .ini { opacity: 0; }
  .lead.person:hover svg, .lead.person:focus-visible svg { opacity: 1; }
  .action-card.blocker .lead.person { background: color-mix(in oklab, var(--danger) 11%, transparent); color: var(--danger); }
  .lead:disabled { cursor: default; }
  /* kept: the check fills with the accent, the title is struck, then the card folds away */
  .action-card.closing .lead { border-color: var(--accent); background: var(--accent); color: var(--color-background-primary); }
  .action-card.closing .lead .ini { opacity: 0; }
  .action-card.closing .lead svg { opacity: 1; }
  .action-card.closing h4 { color: var(--color-text-tertiary); text-decoration: line-through; text-decoration-color: var(--accent); }

  .action-copy { min-width: 0; }
  .client-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-bottom: 3px; }
  .client-name { color: var(--color-text-tertiary); font-size: 11px; font-weight: 650; overflow-wrap: anywhere; }
  .blocker-badge {
    display: inline-flex;
    align-items: center;
    padding: 1px 7px;
    border-radius: var(--border-radius-full, 999px);
    background: color-mix(in oklab, var(--danger) 12%, transparent);
    color: var(--danger);
    font-size: 10px;
    font-weight: 700;
  }
  .action-copy h4 { margin: 0; overflow-wrap: anywhere; font-size: 13px; font-weight: 690; line-height: 1.3; letter-spacing: -.008em; }
  .action-owner { margin-top: 3px; color: var(--color-text-secondary); font-size: 11px; }
  .action-note { margin: 7px 0 0; color: var(--color-text-tertiary); font-size: 11px; line-height: 1.4; }
  .card-meta { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 9px; }
  .status-chip {
    display: inline-flex;
    min-height: 23px;
    align-items: center;
    gap: 4px;
    padding: 3px 8px;
    border: 1px solid var(--color-border-secondary);
    border-radius: var(--border-radius-full, 999px);
    background: var(--ink-soft);
    color: var(--color-text-secondary);
    font-size: 10px;
    font-weight: 650;
    line-height: 1;
  }
  .status-chip svg { width: 12px; height: 12px; }
  .status-chip.booked { border-color: var(--k-accent-brd); background: var(--accent-soft); color: var(--accent); }
  .status-chip.wait-age { border-color: color-mix(in oklab, var(--warning) 25%, var(--color-border-secondary)); background: var(--warning-soft); color: var(--warning); }
  .status-chip.blocked { border-color: color-mix(in oklab, var(--danger) 28%, var(--color-border-secondary)); background: var(--danger-soft); color: var(--danger); }
  .due-stack {
    min-width: 62px;
    padding-left: 8px;
    border-left: 1px solid var(--color-border-secondary);
    text-align: right;
  }
  .due-stack span { display: block; color: var(--color-text-tertiary); font-size: 10px; font-weight: 650; }
  .due-stack strong { display: block; margin-top: 3px; color: var(--color-text-primary); font-size: 11px; line-height: 1.2; white-space: nowrap; }
  .due-stack strong.late, .action-card.blocker .due-stack strong { color: var(--danger); }
  .empty {
    padding: 26px 14px;
    border: 1px dashed var(--color-border-primary);
    border-radius: var(--border-radius-md, 10px);
    background: var(--color-background-primary);
    color: var(--color-text-tertiary);
    text-align: center;
    font-size: 12px;
    line-height: 1.5;
  }

  /* ── kept: what already closed; one tap reopens ── */
  .kept { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 2px 17px 16px; }
  .kept[hidden] { display: none; }
  .kept-label { margin-right: 4px; color: var(--color-text-secondary); font-size: 12px; font-weight: 650; }
  .kept-label b { color: var(--accent); font-variant-numeric: tabular-nums; }
  .kept .k-chip { max-width: 100%; text-decoration: line-through; text-decoration-color: color-mix(in oklab, var(--accent) 60%, transparent); }
  .kept .k-chip:hover { text-decoration: none; }
  .kept .more { color: var(--color-text-tertiary); font-size: 11.5px; }

  @media (prefers-reduced-motion: no-preference) {
    .lead { transition: transform var(--k-t-fast, 120ms) var(--k-ease), background var(--k-t-fast, 120ms), color var(--k-t-fast, 120ms); }
    .lead:not(:disabled):hover { transform: scale(1.06); }
    .lead:not(:disabled):active { transform: scale(.92); }
    .action-card.closing .lead { animation: ma-kept 520ms var(--k-spring) both; }
    .action-card.closing { animation: ma-fold 380ms var(--k-ease) 360ms both; }
    .brief h2 .n.tick { animation: ma-tick 560ms var(--k-spring); }
    .owner-number.tick { animation: ma-tick 560ms var(--k-spring); }
    @keyframes ma-kept { 0% { transform: scale(.8); } 55% { transform: scale(1.18); } 100% { transform: scale(1); } }
    @keyframes ma-fold { to { opacity: .35; transform: translateX(10px) scale(.98); } }
    @keyframes ma-tick { 0% { transform: translateY(-.35em); opacity: .2; } 100% { transform: none; opacity: 1; } }
  }

  @media (max-width: 700px) {
    .brief { grid-template-columns: 1fr; gap: 15px; }
    .ownership { max-width: 360px; }
    .board { grid-template-columns: 1fr; }
  }

  @media (max-width: 480px) {
    .brief { padding: 19px 14px 17px; }
    .brief h2 { margin-top: 7px; font-size: clamp(26px, 9vw, 34px); }
    .brief-copy p { font-size: 12px; }
    .ownership { max-width: none; }
    .owner-stat { padding: 13px 12px; }
    .owner-number { font-size: 32px; }
    .board { gap: 11px; padding: 11px; }
    .lane { padding: 10px; }
    .action-card { grid-template-columns: auto minmax(0, 1fr); padding: 11px; }
    .due-stack {
      grid-column: 2;
      display: flex;
      min-width: 0;
      align-items: baseline;
      gap: 5px;
      padding: 7px 0 0;
      border-top: 1px solid var(--color-border-secondary);
      border-left: 0;
      text-align: left;
    }
    .due-stack span, .due-stack strong { display: inline; margin: 0; }
    .kept { padding-inline: 13px; }
    .app-header .k-btn .lbl { display: none; }
  }
</style>
</head>
<body>
<main class="ma app k-stage">
  <header class="app-header k-appbar">
    <div class="app-mark k-appmark" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="M6 4.5h12v15H6z"></path><path d="M9 8h6M9 11.5h3"></path><path d="m13.5 15 1.6 1.6 3-3.1"></path></svg>
    </div>
    <div class="identity k-appcopy"><h1 data-i18n="appName">Meeting Actions</h1></div>
    <button id="askBtn" class="k-btn sec" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="m12 3 .8 3.2A6.5 6.5 0 0 0 17.5 11l3.2.8-3.2.8a6.5 6.5 0 0 0-4.7 4.7L12 20.5l-.8-3.2a6.5 6.5 0 0 0-4.7-4.7l-3.2-.8 3.2-.8a6.5 6.5 0 0 0 4.7-4.8L12 3Z"/></svg>
      <span class="lbl" data-i18n="ask">Draft nudges</span>
    </button>
  </header>

  <section class="brief" aria-label="Follow-up briefing" data-i18n-aria="briefAria">
    <div class="brief-copy">
      <div class="dateline" id="dateline"></div>
      <h2><span data-i18n="callOver">The call is over.</span><br><span id="moving"></span></h2>
      <p id="briefBody"></p>
    </div>
    <div class="ownership">
      <div class="owner-stat mine"><span class="owner-label" data-i18n="youOwn">You own</span><strong class="owner-number" id="nMine">0</strong><span class="owner-note" id="noteMine"></span></div>
      <div class="owner-stat theirs"><span class="owner-label" data-i18n="waitingOn">Waiting on</span><strong class="owner-number" id="nTheirs">0</strong><span class="owner-note" id="noteTheirs"></span></div>
    </div>
  </section>
  <div id="error" class="error-strip" role="status" hidden></div>
  <section class="board" aria-live="polite">
    <section class="lane mine-lane" aria-labelledby="mine-title">
      <div class="lane-head"><div class="lane-heading"><h3 id="mine-title" data-i18n="iOwn">I own</h3><p id="mineHelp"></p></div><span class="lane-count" id="countMine">0</span></div>
      <div class="cards" id="cardsMine"></div>
    </section>
    <section class="lane waiting-lane" aria-labelledby="waiting-title">
      <div class="lane-head"><div class="lane-heading"><h3 id="waiting-title" data-i18n="waitingOn">Waiting on</h3><p id="theirsHelp"></p></div><span class="lane-count" id="countTheirs">0</span></div>
      <div class="cards" id="cardsTheirs"></div>
    </section>
  </section>
  <section class="kept" id="kept" aria-label="Kept" hidden></section>
</main>

<script type="module">
  const oma = window.oma;
  const now = new Date();
  const TODAY = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const $ = (id) => document.getElementById(id);
  const STR = {
    en: {
      documentTitle: "Meeting Actions",
      appName: "Meeting Actions",
      ask: "Draft nudges",
      briefAria: "Follow-up briefing",
      noDate: "No date",
      today: "Today",
      tomorrow: "Tomorrow",
      overdueDays: "{count}d overdue",
      waitingDaysOne: "1 day waiting",
      waitingDaysMany: "{count} days waiting",
      waitingToday: "Asked today",
      inCalendar: "In calendar",
      needsDate: "Needs a date",
      waitingOnPerson: "Waiting on {person}",
      forPerson: "For {person}",
      yourFollowup: "your follow-up",
      noClient: "No client",
      blockingWork: "Blocking work",
      untitledAction: "Untitled action",
      dependency: "Dependency",
      due: "Due",
      markComplete: "Mark {title} done",
      markReceived: "Mark {title} received",
      reopen: "Reopen {title}",
      action: "action",
      iOwn: "I own",
      waitingOn: "Waiting on",
      mineHelp: "{booked} of {total} in the calendar · next {next}",
      mineHelpLate: "{booked} of {total} in the calendar · {count} overdue",
      mineHelpNone: "Nothing on your side.",
      theirsHelp: "Longest wait: {person}, {days}",
      theirsHelpNone: "Nobody owes you anything.",
      nothingMine: "Nothing is waiting on you.",
      nothingTheirs: "Nothing is waiting on someone else.",
      emptyAll: "No promises yet. Paste your meeting notes into the chat and ask: “pull out who owes what.”",
      dateline: "{weekday}, {date} · follow-up brief",
      callOver: "The call is over.",
      promisesMovingOne: "{n} promise is still moving.",
      promisesMovingMany: "{n} promises are still moving.",
      promisesNone: "Every promise is kept.",
      promisesEmpty: "Nothing captured yet.",
      briefBody: "{mine} belong to you. {waiting} belong to clients. {blockers}",
      mineOne: "1 commitment",
      mineMany: "{count} commitments",
      theirsOne: "1 handoff",
      theirsMany: "{count} handoffs",
      blockerBodyOne: "1 dependency is already blocking the work.",
      blockerBodyMany: "{count} dependencies are already blocking the work.",
      noBlockerBody: "Nothing is blocking the work right now.",
      youOwn: "You own",
      allScheduled: "All scheduled",
      scheduled: "{count} scheduled",
      overdueNote: "{count} overdue",
      blockerOne: "1 blocker",
      blockerMany: "{count} blockers",
      noBlockers: "No blockers",
      someone: "Someone",
      keptLabel: "Kept",
      more: "+{count} more",
      updateFailed: "Could not update the action. Try again.",
      askFailed: "Could not reach the chat. Try again.",
      promptNudge: "Please draft short, friendly follow-up nudges for the promises I'm still waiting on (from my Meeting Actions):\n{list}",
      promptPlan: "Look at my open Meeting Actions and suggest what I should follow up on first:\n{list}"
    },
    zh: {
      documentTitle: "会后行动",
      appName: "会后行动",
      ask: "起草催办",
      briefAria: "跟进简报",
      noDate: "无日期",
      today: "今天",
      tomorrow: "明天",
      overdueDays: "逾期 {count} 天",
      waitingDaysOne: "已等待 1 天",
      waitingDaysMany: "已等待 {count} 天",
      waitingToday: "今天刚提",
      inCalendar: "已进日历",
      needsDate: "需要日期",
      waitingOnPerson: "等待 {person}",
      forPerson: "交给 {person}",
      yourFollowup: "你的跟进事项",
      noClient: "未关联客户",
      blockingWork: "正在阻塞",
      untitledAction: "未命名行动",
      dependency: "依赖项",
      due: "到期",
      markComplete: "将“{title}”标为完成",
      markReceived: "将“{title}”标为已收到",
      reopen: "重新打开“{title}”",
      action: "行动",
      iOwn: "由我负责",
      waitingOn: "等待对方",
      mineHelp: "{total} 项里 {booked} 项已进日历 · 下一项：{next}",
      mineHelpLate: "{total} 项里 {booked} 项已进日历 · 逾期 {count} 项",
      mineHelpNone: "你这边没有待办。",
      theirsHelp: "等得最久：{person}，{days}",
      theirsHelpNone: "没有人欠你东西。",
      nothingMine: "你目前没有待办承诺。",
      nothingTheirs: "目前没有等待他人的事项。",
      emptyAll: "还没有承诺。把会议纪要贴进对话，说一句：“帮我理出谁欠谁什么。”",
      dateline: "{date} {weekday} · 跟进简报",
      callOver: "通话结束了。",
      promisesMovingOne: "还有 {n} 个承诺在推进。",
      promisesMovingMany: "还有 {n} 个承诺在推进。",
      promisesNone: "每个承诺都兑现了。",
      promisesEmpty: "还没记下任何承诺。",
      briefBody: "{mine}在你手上，{waiting}在客户那边。{blockers}",
      mineOne: "1 项承诺",
      mineMany: "{count} 项承诺",
      theirsOne: "1 项交接",
      theirsMany: "{count} 项交接",
      blockerBodyOne: "已有 1 个依赖项在阻塞工作。",
      blockerBodyMany: "已有 {count} 个依赖项在阻塞工作。",
      noBlockerBody: "当前没有阻塞项。",
      youOwn: "你负责",
      allScheduled: "全部已排期",
      scheduled: "已排期 {count} 项",
      overdueNote: "逾期 {count} 项",
      blockerOne: "1 个阻塞项",
      blockerMany: "{count} 个阻塞项",
      noBlockers: "无阻塞",
      someone: "对方",
      keptLabel: "已兑现",
      more: "还有 {count} 项",
      updateFailed: "行动未更新，请重试。",
      askFailed: "没能连到对话，请重试。",
      promptNudge: "请帮我给这些还在等对方的事项起草简短、客气的催办消息（来自我的会后行动）：\n{list}",
      promptPlan: "看看我会后行动里还开着的事项，建议我先跟进哪一个：\n{list}"
    }
  };
  const escapeHtml = (value) => String(value ?? "").replace(/[&<>"']/g, (char) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[char]);
  const initials = (value) => {
    const s = String(value || "?").trim();
    if (/[一-鿿]/.test(s)) return s.replace(/\s+/g, "").slice(0, 1);
    return s.split(/\s+/).filter(Boolean).slice(0, 2).map((part) => part[0]).join("").toUpperCase();
  };
  const dateOnly = (value) => {
    if (!value) return null;
    if (value instanceof Date) return new Date(value.getFullYear(), value.getMonth(), value.getDate());
    const match = String(value).slice(0, 10).match(/^(\d{4})-(\d{2})-(\d{2})$/);
    return match ? new Date(Number(match[1]), Number(match[2]) - 1, Number(match[3])) : null;
  };
  const dayDiff = (date, base = TODAY) => Math.round((dateOnly(date) - dateOnly(base)) / 86400000);
  const locale = () => {
    const preferred = oma.pref("locale", "auto");
    return preferred === "auto" ? navigator.language : preferred;
  };
  const language = () => locale().toLowerCase().startsWith("zh") ? "zh" : "en";
  const t = (key, vars = {}) => {
    let value = STR[language()][key] ?? STR.en[key] ?? key;
    for (const [name, replacement] of Object.entries(vars)) value = value.replaceAll(`{${name}}`, String(replacement));
    return value;
  };
  const applyI18n = () => {
    document.documentElement.lang = language() === "zh" ? "zh-CN" : "en";
    document.title = t("documentTitle");
    for (const node of document.querySelectorAll("[data-i18n]")) node.textContent = t(node.dataset.i18n);
    for (const node of document.querySelectorAll("[data-i18n-aria]")) node.setAttribute("aria-label", t(node.dataset.i18nAria));
  };
  const plural = (one, many, count) => t(count === 1 ? one : many, { count });
  const waitingLabel = (count) => count === 0 ? t("waitingToday") : plural("waitingDaysOne", "waitingDaysMany", count);
  const formatDate = (value) => {
    const date = dateOnly(value);
    if (!date) return t("noDate");
    const mode = oma.pref("date_format", "auto");
    const year = date.getFullYear();
    const month = String(date.getMonth() + 1).padStart(2, "0");
    const day = String(date.getDate()).padStart(2, "0");
    if (mode === "yyyy-mm-dd") return `${year}-${month}-${day}`;
    if (mode === "dd/mm/yyyy") return `${day}/${month}/${year}`;
    if (mode === "mm/dd/yyyy") return `${month}/${day}/${year}`;
    return new Intl.DateTimeFormat(locale(), { month: "short", day: "numeric" }).format(date);
  };
  // A DUE date read against today. A date that has passed is overdue — never "yesterday".
  const relativeDue = (value) => {
    const date = dateOnly(value);
    if (!date) return { text: t("noDate"), late: false };
    const diff = dayDiff(date);
    if (diff < 0) return { text: t("overdueDays", { count: -diff }), late: true };
    if (diff === 0) return { text: t("today"), late: false };
    if (diff === 1) return { text: t("tomorrow"), late: false };
    if (diff < 7) return { text: new Intl.DateTimeFormat(locale(), { weekday: "long" }).format(date), late: false };
    return { text: formatDate(value), late: false };
  };
  const waitingAge = (value) => {
    const created = dateOnly(value);
    return created ? Math.max(0, dayDiff(TODAY, created)) : 0;
  };
  const isBlocker = (item) => /\bblock(?:s|ed|ing)?\b|阻塞|卡住|依赖/i.test(String(item.fields.notes || ""));
  const calendarIcon = '<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5h14v15H5zM8 3v4M16 3v4M5 9h14"></path><path d="m9 14 2 2 4-4"></path></svg>';
  const clockIcon = '<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"></circle><path d="M12 7.5V12l3 2"></path></svg>';
  const checkIcon = '<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="m6.5 12.5 3.3 3.3 7.7-8"></path></svg>';

  // ── state outside render: what the ack has not confirmed yet ──
  let current = { items: [] };
  const pending = new Map();   // id → status we wrote and are waiting to see come back
  const closing = new Set();   // ids whose card is playing its fold-away (still drawn in the lane)
  const withPending = (item) => pending.has(item.id) ? { ...item, fields: { ...item.fields, status: pending.get(item.id) } } : item;
  const sortByDue = (items) => items.slice().sort((a, b) => String(a.fields.due_date || "9999").localeCompare(String(b.fields.due_date || "9999")) || a.position - b.position);

  // One model pass — every number on the page comes from here.
  function model() {
    const items = (current.items || []).map(withPending);
    const active = items.filter((item) => item.fields.status !== "done");
    const done = items.filter((item) => item.fields.status === "done");
    const mine = sortByDue(active.filter((item) => item.fields.owner !== "them"));
    const waiting = sortByDue(active.filter((item) => item.fields.owner === "them"));
    const blockers = waiting.filter(isBlocker);
    const booked = mine.filter((item) => item.fields.status === "booked");
    const overdue = mine.filter((item) => item.fields.due_date && dayDiff(item.fields.due_date) < 0);
    const shownMine = sortByDue(items.filter((item) => item.fields.owner !== "them" && (item.fields.status !== "done" || closing.has(item.id))));
    const shownWaiting = sortByDue(items.filter((item) => item.fields.owner === "them" && (item.fields.status !== "done" || closing.has(item.id))));
    const kept = done.filter((item) => !closing.has(item.id)).sort((a, b) => String(b.fields.due_date || "").localeCompare(String(a.fields.due_date || "")) || b.position - a.position);
    return { items, active, mine, waiting, blockers, booked, overdue, shownMine, shownWaiting, kept };
  }

  function cardHtml(item) {
    const f = item.fields;
    const waiting = f.owner === "them";
    const blocker = isBlocker(item);
    const note = String(f.notes || "");
    const genericCalendarNote = /calendar follow-up created|已创建日历跟进/i.test(note);
    const due = relativeDue(f.due_date);
    const ownerLine = waiting
      ? t("waitingOnPerson", { person: f.person || t("someone") })
      : t("forPerson", { person: f.person || t("yourFollowup") });
    const status = waiting
      ? `<span class="status-chip wait-age">${clockIcon}${escapeHtml(waitingLabel(waitingAge(f.created_date)))}</span>`
      : `<span class="status-chip${f.status === "booked" ? " booked" : ""}">${calendarIcon}${f.status === "booked" ? t("inCalendar") : t("needsDate")}</span>`;
    const title = f.title || t("untitledAction");
    const lead = waiting
      ? `<button class="lead person" type="button" data-keep="${escapeHtml(item.id)}" title="${escapeHtml(t("markReceived", { title }))}" aria-label="${escapeHtml(t("markReceived", { title }))}"><span class="ini">${escapeHtml(initials(f.person || f.client))}</span>${checkIcon}</button>`
      : `<button class="lead check" type="button" data-keep="${escapeHtml(item.id)}" aria-label="${escapeHtml(t("markComplete", { title }))}">${checkIcon}</button>`;
    return `<article class="action-card${blocker && waiting ? " blocker" : ""}" data-id="${escapeHtml(item.id)}">
      ${lead}
      <div class="action-copy">
        <div class="client-row"><span class="client-name">${escapeHtml(f.client || t("noClient"))}</span>${blocker && waiting ? `<span class="blocker-badge">${t("blockingWork")}</span>` : ""}</div>
        <h4>${escapeHtml(title)}</h4>
        <div class="action-owner">${escapeHtml(ownerLine)}</div>
        ${note && !genericCalendarNote ? `<p class="action-note">${escapeHtml(note)}</p>` : ""}
        <div class="card-meta">${status}${blocker && waiting ? `<span class="status-chip blocked">${t("dependency")}</span>` : ""}</div>
      </div>
      <div class="due-stack"><span>${t("due")}</span><strong${due.late ? ' class="late"' : ""}>${escapeHtml(due.text)}</strong></div>
    </article>`;
  }

  // Keyed, in place: a card whose content did not change keeps its element (and any animation on it).
  function patchLane(host, items, emptyText) {
    const byId = new Map([...host.querySelectorAll(":scope > .action-card")].map((el) => [el.dataset.id, el]));
    const next = [];
    for (const item of items) {
      const f = item.fields;
      const sig = JSON.stringify([f.title, f.owner, f.person, f.client, f.status === "done" ? "" : f.status, f.due_date, f.created_date, f.notes, language()]);
      let el = byId.get(item.id);
      // A card folding away keeps the face it had when it was tapped.
      if (!el || (el.dataset.sig !== sig && !closing.has(item.id))) {
        const tpl = document.createElement("template");
        tpl.innerHTML = cardHtml(item).trim();
        const fresh = tpl.content.firstElementChild;
        fresh.dataset.sig = sig;
        if (el) el.replaceWith(fresh);
        el = fresh;
      }
      el.classList.toggle("closing", closing.has(item.id));
      byId.delete(item.id);
      next.push(el);
    }
    for (const el of byId.values()) el.remove();
    host.querySelector(":scope > .empty")?.remove();
    next.forEach((el, index) => { if (host.children[index] !== el) host.insertBefore(el, host.children[index] || null); });
    if (!items.length) host.insertAdjacentHTML("beforeend", `<div class="empty">${escapeHtml(emptyText)}</div>`);
  }

  function setNumber(el, value) {
    const text = String(value);
    if (el.textContent === text) return;
    const had = el.textContent !== "";
    el.textContent = text;
    if (had && el.isConnected) {
      el.classList.remove("tick");
      void el.offsetWidth;
      el.classList.add("tick");
    }
  }

  function render(state) {
    if (state) current = state;
    // A write we made is confirmed once the snapshot carries it.
    for (const [id, status] of pending) {
      const item = (current.items || []).find((row) => row.id === id);
      if (!item || item.fields.status === status) pending.delete(id);
    }
    const m = model();
    const lang = language();

    const weekday = new Intl.DateTimeFormat(locale(), { weekday: lang === "zh" ? "long" : "short" }).format(TODAY);
    $("dateline").textContent = t("dateline", { weekday, date: formatDate(TODAY) });
    const moving = $("moving");
    if (m.active.length) {
      const [before, after] = t(m.active.length === 1 ? "promisesMovingOne" : "promisesMovingMany", { n: "\u0000" }).split("\u0000");
      const key = `${lang}:${m.active.length === 1 ? "one" : "many"}`;
      let n = moving.querySelector(".n");
      if (!n || moving.dataset.lang !== key) {
        moving.innerHTML = `${escapeHtml(before)}<span class="n"></span>${escapeHtml(after)}`;
        moving.dataset.lang = key;
        const old = n?.textContent || "";
        n = moving.querySelector(".n");
        n.textContent = old;
      }
      setNumber(n, m.active.length);
    } else {
      moving.textContent = t(m.items.length ? "promisesNone" : "promisesEmpty");
      moving.dataset.lang = "";
    }
    const blockerBody = m.blockers.length
      ? plural("blockerBodyOne", "blockerBodyMany", m.blockers.length)
      : t("noBlockerBody");
    $("briefBody").textContent = m.items.length
      ? t("briefBody", { mine: plural("mineOne", "mineMany", m.mine.length), waiting: plural("theirsOne", "theirsMany", m.waiting.length), blockers: blockerBody })
      : t("emptyAll");

    setNumber($("nMine"), m.mine.length);
    setNumber($("nTheirs"), m.waiting.length);
    $("noteMine").textContent = m.overdue.length
      ? t("overdueNote", { count: m.overdue.length })
      : m.booked.length === m.mine.length && m.mine.length ? t("allScheduled") : t("scheduled", { count: m.booked.length });
    $("noteTheirs").textContent = m.blockers.length ? plural("blockerOne", "blockerMany", m.blockers.length) : t("noBlockers");

    $("countMine").textContent = m.mine.length;
    $("countTheirs").textContent = m.waiting.length;
    const nextDue = m.mine.length ? relativeDue(m.mine[0].fields.due_date) : null;
    $("mineHelp").textContent = !m.mine.length
      ? t("mineHelpNone")
      : m.overdue.length
        ? t("mineHelpLate", { booked: m.booked.length, total: m.mine.length, count: m.overdue.length })
        : t("mineHelp", { booked: m.booked.length, total: m.mine.length, next: lang === "en" && /^(Today|Tomorrow)$/.test(nextDue.text) ? nextDue.text.toLowerCase() : nextDue.text });
    const longest = m.waiting.slice().sort((a, b) => waitingAge(b.fields.created_date) - waitingAge(a.fields.created_date))[0];
    $("theirsHelp").textContent = longest
      ? t("theirsHelp", { person: longest.fields.person || longest.fields.client || t("someone"), days: waitingLabel(waitingAge(longest.fields.created_date)) })
      : t("theirsHelpNone");

    patchLane($("cardsMine"), m.shownMine, t("nothingMine"));
    patchLane($("cardsTheirs"), m.shownWaiting, t("nothingTheirs"));

    const kept = $("kept");
    kept.hidden = !m.kept.length;
    const keptSig = JSON.stringify([lang, m.kept.map((item) => [item.id, item.fields.title])]);
    if (kept.dataset.sig !== keptSig) {
      kept.dataset.sig = keptSig;
      const shown = m.kept.slice(0, 6);
      kept.innerHTML = `<span class="kept-label">${t("keptLabel")} <b>${m.kept.length}</b></span>`
        + shown.map((item) => {
          const title = item.fields.title || t("untitledAction");
          return `<button class="k-chip" type="button" data-reopen="${escapeHtml(item.id)}" title="${escapeHtml(t("reopen", { title }))}" aria-label="${escapeHtml(t("reopen", { title }))}"><span class="k-ellip">${escapeHtml(title)}</span></button>`;
        }).join("")
        + (m.kept.length > shown.length ? `<span class="more">${escapeHtml(t("more", { count: m.kept.length - shown.length }))}</span>` : "");
    }
  }

  function showError(text) {
    $("error").textContent = text;
    $("error").hidden = false;
  }

  // Optimistic: the check fills and the headline ticks down NOW; the ack only corrects a refusal.
  async function write(id, status) {
    pending.set(id, status);
    $("error").hidden = true;
    let ack = null;
    try {
      ack = await oma.updateItem(id, { status });
    } catch (error) {
      ack = null;
    }
    if (!ack || ack.ok === false) {
      pending.delete(id);
      closing.delete(id);
      showError(t("updateFailed"));
      render();
    }
  }

  document.addEventListener("click", (event) => {
    const keep = event.target.closest("[data-keep]");
    if (keep) {
      const id = keep.dataset.keep;
      if (closing.has(id)) return;
      keep.disabled = true;
      closing.add(id);
      write(id, "done");
      render();
      const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
      setTimeout(() => { closing.delete(id); render(); }, reduced ? 250 : 760);
      return;
    }
    const reopen = event.target.closest("[data-reopen]");
    if (reopen) {
      const item = (current.items || []).find((row) => row.id === reopen.dataset.reopen);
      if (!item) return;
      // The contract keeps no "previous status": a dated promise of mine was booked, an undated one open.
      const status = item.fields.owner === "them" ? "waiting" : item.fields.due_date ? "booked" : "open";
      write(item.id, status);
      render();
    }
  });

  const askBtn = $("askBtn");
  askBtn.onclick = async () => {
    const m = model();
    const lines = (m.waiting.length ? m.waiting : m.active).slice(0, 12).map((item) => {
      const f = item.fields;
      const who = [f.person, f.client].filter(Boolean).join(", ");
      const age = f.owner === "them" ? waitingLabel(waitingAge(f.created_date)) : relativeDue(f.due_date).text;
      return `- ${f.title || t("untitledAction")}${who ? ` (${who})` : ""} — ${age}${f.notes ? `; ${f.notes}` : ""}`;
    }).join("\n");
    askBtn.disabled = true;
    try {
      const r = await oma.sendMessage(t(m.waiting.length ? "promptNudge" : "promptPlan", { list: lines || "-" }));
      if (r && r.isError === true && !r.degraded) showError(t("askFailed"));
    } catch (error) {
      showError(t("askFailed"));
    } finally {
      askBtn.disabled = false;
    }
  };

  if (oma.standalone) document.body.classList.add("standalone");

  oma.ready((state) => { applyI18n(); render(state); });
  oma.onChange(render);
  oma.onPrefChange(() => { applyI18n(); render(); });
</script>
</body>
</html>
