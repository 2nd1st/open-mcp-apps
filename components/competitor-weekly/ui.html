<head>

<meta name="description" content="A decision-ready weekly brief for creators: one headline on what actually worked among the accounts you watch, the split between who posted most and who earned the response, what to try, watch and ignore.">

<title>Competitor Weekly</title>
<style>
  /* Shared primitives (.k-*) — this app's own copy; nothing here comes from the engine. */
  :root{--k-accent:var(--color-text-info,var(--color-ring-primary,#3b6cf6));--k-ok:var(--color-text-success,#2e9e5b);--k-warn:var(--color-text-warning,#b98200);--k-bad:var(--color-text-danger,#e5484d);--k-ink-4:color-mix(in oklab,var(--color-text-primary) 4%,transparent);--k-accent-bg:color-mix(in oklab,var(--k-accent) 10%,transparent);--k-accent-brd:color-mix(in oklab,var(--k-accent) 28%,transparent);--k-t-fast:120ms;--k-t:180ms;--k-ease:cubic-bezier(.2,.8,.3,1);--k-spring:cubic-bezier(.34,1.56,.64,1);--k-surface:var(--color-background-primary)}
  @media (prefers-reduced-motion:reduce){:root{--k-t-fast:0ms;--k-t:0ms}}
  .k-btn{display:inline-flex;align-items:center;gap:6px;border:1px solid transparent;border-radius:var(--border-radius-md,10px);padding:6px 12px;font:inherit;font-size:var(--font-text-sm-size,12.5px);font-weight:600;cursor:pointer;background:var(--color-background-inverse);color:var(--color-text-inverse);transition:transform var(--k-t-fast) var(--k-ease),opacity var(--k-t-fast),background var(--k-t-fast)}
  .k-btn:hover{opacity:.9}
  .k-btn:active{transform:scale(.96)}
  .k-btn:disabled{opacity:.45;cursor:default;transform:none}
  .k-btn.sec{background:transparent;color:var(--color-text-primary);border-color:var(--color-border-primary)}
  .k-btn.ghost{background:transparent;color:var(--color-text-secondary)}
  :is(.k-btn.sec,.k-btn.ghost):hover{background:var(--k-ink-4);color:var(--color-text-primary);opacity:1}
  .k-btn.danger{background:transparent;color:var(--k-bad);border-color:color-mix(in oklab,var(--k-bad) 30%,transparent)}
  .k-btn.danger:hover{background:color-mix(in oklab,var(--k-bad) 10%,transparent);opacity:1}
  :is(.k-btn,.k-tab,.k-chip,.k-switch,.k-field):focus-visible{outline:2px solid var(--color-ring-primary,var(--k-accent));outline-offset:1px}
  .k-chip{display:inline-flex;align-items:center;gap:5px;border-radius:var(--border-radius-full,999px);border:1px solid var(--color-border-secondary);background:transparent;color:var(--color-text-secondary);padding:2px 10px;font:inherit;font-size:11.5px;font-weight:550;cursor:pointer;transition:background var(--k-t-fast),color var(--k-t-fast),border-color var(--k-t-fast),transform var(--k-t) var(--k-spring)}
  .k-chip:hover{background:var(--k-ink-4);color:var(--color-text-primary)}
  .k-chip:active{transform:scale(.93)}
  .k-chip.on{background:color-mix(in oklab,var(--k-accent) 10%,transparent);border-color:color-mix(in oklab,var(--k-accent) 28%,transparent);color:var(--k-accent)}
  .k-chip.static{cursor:default}
  .k-chip.static:hover{background:transparent;color:var(--color-text-secondary)}
  .k-chip.static:active{transform:none}
  .k-badge{display:inline-flex;align-items:center;gap:4px;border-radius:var(--border-radius-full,999px);padding:1px 8px;font-size:11px;font-weight:600;background:var(--k-ink-4);color:var(--color-text-secondary)}
  .k-badge.info{background:color-mix(in oklab,var(--k-accent) 10%,transparent);color:var(--k-accent)}
  .k-badge.ok{background:color-mix(in oklab,var(--k-ok) 12%,transparent);color:var(--k-ok)}
  .k-badge.warn{background:color-mix(in oklab,var(--k-warn) 14%,transparent);color:var(--k-warn)}
  .k-badge.bad{background:color-mix(in oklab,var(--k-bad) 12%,transparent);color:var(--k-bad)}
  .k-field{padding:6px 10px;border-radius:var(--border-radius-md,10px);border:1px solid var(--color-border-primary);background:transparent;color:inherit;font:inherit;font-size:var(--font-text-sm-size,12.5px);transition:border-color var(--k-t-fast),box-shadow var(--k-t-fast)}
  .k-field::placeholder{color:var(--color-text-tertiary)}
  .k-field:focus{outline:none;border-color:var(--k-accent);box-shadow:0 0 0 3px color-mix(in oklab,var(--k-accent) 10%,transparent)}
  .k-appbar{display:flex;align-items:center;gap:11px;padding:13px 16px}
  .k-appbar .k-appmark{display:grid;width:34px;height:34px;flex:none;place-items:center;border-radius:11px}
  .k-appbar .k-appmark svg{width:18px;height:18px}
  .k-appbar .k-appcopy{min-width:0;flex:1}
  .k-appbar .k-eyebrow{display:block;margin:0;color:var(--color-text-tertiary);font-size:9.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
  .k-appbar h1{margin:1px 0 0;font-size:15px;font-weight:650;letter-spacing:-.015em}
  body:not(.standalone) .k-appbar{border-bottom:1px solid var(--color-border-secondary);background:var(--k-surface)}
  .k-stage{max-width:1120px;margin-inline:auto;overflow-x:clip}

  /* Identity: ONE accent of the app's own (slate ink). Everything structural is a host token. */
  .cw {
    --ink: light-dark(#3b5068, #9fb4cc);
    --on-ink: light-dark(#ffffff, #101820);
    --ink-soft: color-mix(in oklab, var(--ink) 10%, transparent);
    --ink-line: color-mix(in oklab, var(--ink) 34%, transparent);
    --k-accent: var(--ink);
    --k-accent-bg: var(--ink-soft);
    --k-accent-brd: var(--ink-line);
    --line: var(--color-border-secondary);
    --wash: color-mix(in oklab, var(--color-text-primary) 3%, transparent);
    color-scheme: light dark;
  }
  button, input, textarea { font: inherit; }

  .cw-mark { color: var(--ink); background: var(--ink-soft); border: 1px solid var(--ink-line); }
  .cw-mark svg { fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .cw-cta { background: var(--ink); color: var(--on-ink); white-space: nowrap; }

  .err {
    margin: 10px 20px 0;
    padding: 8px 10px;
    border: 1px solid color-mix(in oklab, var(--k-bad) 34%, var(--line));
    border-radius: var(--border-radius-md, 8px);
    background: color-mix(in oklab, var(--k-bad) 8%, transparent);
    color: var(--k-bad);
    font-size: 12px;
  }

  /* ── the front page: issue line · headline · dek · the split ─────────────────────── */
  .front { padding: 22px 24px 20px; }
  .issue {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 4px 8px;
    color: var(--color-text-secondary);
    font-size: 12px;
    font-weight: 600;
  }
  .issue-nav { display: inline-flex; align-items: center; gap: 2px; }
  .issue-nav .k-btn { width: 28px; height: 28px; justify-content: center; padding: 0; font-size: 15px; }
  .issue-label { display: inline-flex; align-items: center; gap: 8px; }
  .issue-label::before { width: 18px; height: 2px; border-radius: 2px; background: var(--ink); content: ""; }
  .issue .k-badge.warn { font-weight: 600; }
  .headline {
    max-width: 700px;
    margin: 10px 0 8px;
    font-size: clamp(32px, 6.4vw, 56px);
    font-weight: 780;
    line-height: .98;
    letter-spacing: -.05em;
    text-wrap: balance;
  }
  :lang(zh) .headline { letter-spacing: -.02em; line-height: 1.08; }
  .dek {
    max-width: 640px;
    margin: 0;
    color: var(--color-text-secondary);
    font-size: 13.5px;
    line-height: 1.55;
    text-wrap: pretty;
  }

  .split { margin: 20px 0 0; }
  .split-axis {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    color: var(--color-text-tertiary);
    font-size: 11px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  .split-axis b { color: var(--color-text-primary); font-weight: 700; }
  .split-axis.top { margin-bottom: 6px; }
  .split-axis.bottom { margin-top: 6px; }
  .split-plot { position: relative; height: 100px; }
  .split-plot svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .split-plot .seg-lab {
    position: absolute;
    height: 22px;
    display: grid;
    place-items: center;
    font-size: 11px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    pointer-events: none;
    transition: opacity var(--k-t-fast);
  }
  .split-plot .seg-lab.b { top: 78px; }
  .split-plot .seg-lab.t { top: 0; }
  .split-plot .seg-lab.lead { color: var(--on-ink); }
  .split-plot .seg-lab.off { opacity: 0; }
  .split-legend {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
    gap: 6px 18px;
    margin: 12px 0 0;
    padding: 0;
    list-style: none;
  }
  .split-legend li { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; min-width: 0; font-size: 12px; }
  .split-legend .sw { width: 9px; height: 9px; flex: none; border-radius: 3px; transform: translateY(1px); }
  .split-legend .who { min-width: 0; font-weight: 650; overflow-wrap: anywhere; }
  .split-legend .how { color: var(--color-text-tertiary); font-variant-numeric: tabular-nums; }
  .split-legend li.lead .who { color: var(--ink); }
  .split-ghost { color: var(--color-text-tertiary); }
  .split-ghost svg { display: block; width: 100%; height: 100px; }
  .split-ghost p { margin: 8px 0 0; font-size: 12px; }

  /* ── sections below the fold line ─────────────────────────────────────────────────── */
  .sec { padding: 18px 24px; border-top: 1px solid var(--line); }
  .sec-head { display: flex; align-items: baseline; flex-wrap: wrap; gap: 2px 10px; margin-bottom: 12px; }
  .sec-head h3 { margin: 0; font-size: 14px; font-weight: 700; letter-spacing: -.01em; }
  .sec-head p { margin: 0; color: var(--color-text-tertiary); font-size: 11.5px; }
  .sec-head .k-btn { margin-left: auto; }

  .desk { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
  .call { min-width: 0; padding: 12px 14px 13px; border: 1px solid var(--line); border-radius: var(--border-radius-lg, 12px); }
  .call.try { border-color: var(--ink-line); background: var(--ink-soft); }
  .call-kind { display: inline-flex; align-items: center; gap: 6px; color: var(--color-text-secondary); font-size: 11.5px; font-weight: 700; }
  .call-kind::before { width: 7px; height: 7px; border-radius: 50%; background: var(--color-text-tertiary); content: ""; }
  .call.try .call-kind { color: var(--ink); }
  .call.try .call-kind::before { background: var(--ink); }
  .call.watch .call-kind::before { background: var(--k-warn); }
  .call h4 { margin: 6px 0 4px; font-size: 15px; font-weight: 700; letter-spacing: -.015em; }
  .call p { margin: 0; color: var(--color-text-secondary); font-size: 12px; line-height: 1.5; text-wrap: pretty; }

  .notes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; max-height: 640px; overflow-y: auto; overflow-x: hidden; }
  .note { min-width: 0; padding: 13px 14px; border: 1px solid var(--line); border-radius: var(--border-radius-lg, 12px); }
  .note.lead { border-color: var(--ink-line); }
  .note-head { display: flex; align-items: flex-start; gap: 8px; }
  .note-who { min-width: 0; flex: 1; }
  .note-who strong { display: block; font-size: 14px; overflow-wrap: anywhere; }
  .note-who span { color: var(--color-text-tertiary); font-size: 11.5px; }
  .note.lead .note-who strong { color: var(--ink); }
  .note-nums { margin: 8px 0 0; color: var(--color-text-secondary); font-size: 12px; font-variant-numeric: tabular-nums; }
  .note-nums b { color: var(--color-text-primary); }
  .quote { margin: 10px 0 0; font-size: 13px; font-weight: 600; line-height: 1.45; text-wrap: pretty; }
  .quote::before { color: var(--ink); content: "“"; }
  .quote::after { color: var(--ink); content: "”"; }
  .quote-stats { margin-top: 3px; color: var(--color-text-tertiary); font-size: 11px; }
  .change { margin: 10px 0 0; padding: 2px 0 2px 10px; border-left: 2px solid var(--ink); color: var(--color-text-secondary); font-size: 12px; line-height: 1.5; }
  .note-foot { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; margin-top: 10px; }
  .note-foot .fmt { color: var(--color-text-tertiary); font-size: 11px; margin-left: 2px; }
  .missing { margin: 10px 0 0; color: var(--color-text-tertiary); font-size: 12px; }

  .sources { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; margin: 0 0 10px; padding: 0; list-style: none; }
  .src { display: flex; align-items: center; gap: 9px; min-width: 0; padding: 7px 7px 7px 9px; border: 1px solid var(--line); border-radius: var(--border-radius-md, 10px); transition: opacity var(--k-t) var(--k-ease); }
  .src.paused { opacity: .6; }
  .src.busy { opacity: .4; pointer-events: none; }
  .src-dot { display: grid; width: 26px; height: 26px; flex: none; place-items: center; border-radius: 50%; background: var(--ink-soft); color: var(--ink); font-size: 11px; font-weight: 700; }
  .src-copy { min-width: 0; flex: 1; }
  .src-copy strong { display: block; font-size: 12.5px; overflow-wrap: anywhere; }
  .src-copy span { display: block; margin-top: 1px; color: var(--color-text-tertiary); font-size: 11px; line-height: 1.35; }
  .src .k-chip { flex: none; }
  .src .rm { flex: none; width: 26px; height: 26px; justify-content: center; padding: 0; }
  .add { display: grid; grid-template-columns: 150px minmax(0, 1fr) auto; gap: 6px; }
  .add .k-field, .paste textarea { width: 100%; min-width: 0; }
  .paste { margin-bottom: 8px; }
  .paste textarea { resize: vertical; }
  .paste div { display: flex; justify-content: flex-end; margin-top: 6px; }

  [data-density="compact"] .front { padding-block: 16px 14px; }
  [data-density="compact"] .sec { padding-block: 13px; }

  @media (max-width: 640px) {
    .desk { grid-template-columns: 1fr; }
    .notes { grid-template-columns: 1fr; }
    .sources { grid-template-columns: 1fr; }
  }
  @media (max-width: 560px) {
    .front { padding: 18px 16px 16px; }
    .sec { padding: 16px; }
    .err { margin-inline: 16px; }
    .headline { font-size: clamp(30px, 9.6vw, 44px); }
    .add { grid-template-columns: minmax(0, 1fr) auto; }
    .add #noteInput { grid-column: 1 / -1; grid-row: 2; }
  }

  @media (prefers-reduced-motion: no-preference) {
    .headline.swap, .dek.swap { animation: cw-swap 420ms var(--k-ease); }
    .src.fresh { animation: cw-in 360ms var(--k-spring); }
    @keyframes cw-swap { from { opacity: 0; transform: translateY(6px); } }
    @keyframes cw-in { from { opacity: 0; transform: scale(.96); } }
  }
</style>
</head>
<body>
<main class="k-stage cw">
  <header class="k-appbar">
    <div class="k-appmark cw-mark" aria-hidden="true">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.2"/><path d="M12 12 18.4 5.6"/><circle cx="12" cy="12" r=".7"/></svg>
    </div>
    <div class="k-appcopy"><h1 data-i18n="appName">Competitor Weekly</h1></div>
    <button id="compileBtn" class="k-btn cw-cta" type="button" data-i18n="build">Build this week</button>
  </header>

  <div class="err" id="err" role="status" aria-live="polite" hidden></div>

  <section class="front" aria-labelledby="headline">
    <div class="issue">
      <span class="issue-nav" id="issueNav">
        <button class="k-btn ghost" id="prevWeek" type="button" aria-label="Earlier week" data-i18n-aria="earlier">‹</button>
        <button class="k-btn ghost" id="nextWeek" type="button" aria-label="Later week" data-i18n-aria="later">›</button>
      </span>
      <span class="issue-label" id="issueLabel"></span>
      <span class="k-badge warn" id="staleBadge" hidden></span>
    </div>
    <h2 class="headline" id="headline"></h2>
    <p class="dek" id="dek"></p>
    <figure class="split" id="split"></figure>
  </section>

  <section class="sec" id="deskSec" aria-labelledby="deskTitle">
    <div class="sec-head">
      <h3 id="deskTitle" data-i18n="desk">Decision desk</h3>
      <p data-i18n="deskSub">What to do with this week's evidence.</p>
    </div>
    <div class="desk" id="desk"></div>
  </section>

  <section class="sec" id="notesSec" aria-labelledby="notesTitle">
    <div class="sec-head">
      <h3 id="notesTitle" data-i18n="notes">Field notes</h3>
      <p data-i18n="notesSub">The evidence behind the brief, strongest response first.</p>
    </div>
    <div class="notes" id="notes"></div>
    <p class="missing" id="missing" hidden></p>
  </section>

  <section class="sec" aria-labelledby="srcTitle">
    <div class="sec-head">
      <h3 id="srcTitle" data-i18n="sources">Sources</h3>
      <p id="srcCount"></p>
      <button id="pasteToggle" class="k-btn ghost" type="button" data-i18n="pasteMany">Paste many</button>
    </div>
    <div class="paste" id="pasteBox" hidden>
      <textarea id="pasteArea" class="k-field" rows="4" aria-label="Accounts to add" data-i18n-aria="accountsToAdd" data-i18n-placeholder="pastePlaceholder"></textarea>
      <div><button id="pasteAdd" class="k-btn" type="button" data-i18n="addAll">Add all</button></div>
    </div>
    <ul class="sources" id="sources"></ul>
    <form id="addForm" class="add">
      <input id="handleInput" class="k-field" aria-label="Account handle" data-i18n-aria="accountHandle" placeholder="@handle" autocomplete="off">
      <input id="noteInput" class="k-field" aria-label="Why you watch this account" data-i18n-aria="whyWatch" data-i18n-placeholder="notePlaceholder" autocomplete="off">
      <button class="k-btn sec" type="submit" data-i18n="addSource">Add source</button>
    </form>
  </section>
</main>

      sources: "观察来源",
      srcCount: "观察中 {active} · 已暂停 {paused}",
      srcCountAll: "观察中 {active}",
      pasteMany: "批量粘贴",
      accountsToAdd: "要添加的账号",
      pastePlaceholder: "每行一个账号：@账号  可选备注",
      addAll: "全部添加",
      accountHandle: "账号",
      whyWatch: "为什么观察这个账号",
      notePlaceholder: "这个来源为什么重要（可选）",
      addSource: "添加来源",
      readyHead: "观察名单已就绪，周报还没有。",
      readyDek: "让 AI 汇总本周公开动态；它们会变成决策，而不是另一张数据看板。",
      emptyHead: "先确定观察范围，再开始研究。",

      ghost: "报告到了之后，这里会对照：谁发得最多，谁拿到了反馈。",
      postsAxis: "发帖占比",
      respAxis: "已记录反馈占比",
      splitCaption: "发帖量与已记录反馈对照，{week}",
      legend: "发帖 {p}% → 反馈 {r}%",
      headlineFormat: "变化发生在形式，而不是发帖的音量。",
      headlineProof: "证据胜过发帖数量。",

      comparisonDek: "{best} 比 {busiest} 少发 {gap} 篇，却拿到了最高的已记录反馈。",
      bestDek: "{best} 带来了本周最清楚的反馈信号。",
      postOne: "篇",
      postMany: "篇",
      colon: "：",
      try: "尝试",
      watch: "观察",
      ignore: "忽略",
      showProof: "把证据演出来",
      testPattern: "测试领先的做法",
      strongestCluster: "最强反馈集中在“{theme}”。",
      formatShift: "形式正在变化",
      watchAgain: "节奏变化值得再观察一周。",
      volumeRace: "发帖数量竞赛",
      volumeCopy: "{busiest} 发了 {busyCount} 篇；{best} 只用 {bestCount} 篇就拿到更高反馈。节奏是背景，不是目标。",
      surfaceImitation: "表面模仿",
      imitationCopy: "把做法当作证据，同时保留自己的声音、受众和产品。",
      postsCount: "{n} 篇",
      postsDelta: "{delta} 篇",
      postDelta: "{delta} 篇",
      samePace: "节奏不变",
      archived: "不在观察名单里",
      missing: "本周没有报告：{list}",
      paused: "已暂停",
      active: "观察中",
      resume: "恢复",
      pause: "暂停",
      remove: "移除",
      writeFailed: "这次修改没保存上，请重试。",
      askFailed: "没能联系上助手，请重试。",
      buildPrompt: "请为 {week}（week_start {week_start}）生成竞品周报，账号：{active}。逐个收集那一周的公开动态，每个账号写入一条 competitor-reports 记录，字段为 {fields}；如果该账号这个 week_start 已有记录就更新它。跳过已暂停账号，只报告可观察的证据和相对上周的变化；不要改写、模仿或代写他们的内容。"
    }
  };

  // ── state ────────────────────────────────────────────────────────────────────────────
  let model = { accounts: [], reports: [] };
  let preview = false;
  let selectedWeek = null;
  let lastSig = "";
  const pending = new Map();      // account id → optimistic patch {status} | {busy:true}
  const pendingAdds = [];          // optimistic rows not yet acknowledged

  // randomUUID exists only in a secure context; a sandboxed preview may not be one.
  const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
  const el = (tag, cls, text) => {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined) n.textContent = text;
    return n;
  };
  const dateOnly = (iso) => { const [y, m, d] = String(iso).slice(0, 10).split("-").map(Number); return new Date(y, m - 1, d); };
  const isoOf = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  const thisMonday = () => { const n = new Date(); const d = new Date(n.getFullYear(), n.getMonth(), n.getDate()); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return isoOf(d); };
  const locale = () => { const l = oma.pref("locale", "auto"); return l === "auto" ? navigator.language : l; };
  const lang = () => (locale().toLowerCase().startsWith("zh") ? "zh" : "en");
  const t = (key, vars = {}) => {
    let v = STR[lang()][key] ?? STR.en[key] ?? key;
    for (const [k, r] of Object.entries(vars)) v = v.replaceAll(`{${k}}`, String(r));
    return v;
  };
  const posts = (r) => Number(r?.fields?.posts_count) || 0;
  const firstTheme = (r) => String(r?.fields?.themes || "").split(/[,，、]/)[0].trim();
  const reduced = () => matchMedia("(prefers-reduced-motion: reduce)").matches;

  function weekLabel(iso) {
    const s = dateOnly(iso);
    const e = new Date(s.getFullYear(), s.getMonth(), s.getDate() + 6);
    const f = new Intl.DateTimeFormat(locale(), { month: "short", day: "numeric" });
    return f.formatRange ? f.formatRange(s, e) : `${f.format(s)} – ${f.format(e)}`;
  }

  // "8.7K likes · 2.1K reposts" → 10800. The recorded response is whatever numbers the row carries.
  function metricValue(raw) {
    let total = 0;
    for (const m of String(raw || "").matchAll(/([\d.]+)\s*(k|m|b|万|亿)?/gi)) {
      total += Number(m[1]) * (({ k: 1e3, m: 1e6, b: 1e9, "万": 1e4, "亿": 1e8 })[String(m[2] || "").toLowerCase()] || 1);
    }
    return total;
  }
  const responseOf = (r) => metricValue(r?.fields?.engagement || r?.fields?.top_post_stats);
  const compact = (v) => new Intl.NumberFormat(locale(), { notation: "compact", maximumFractionDigits: 1 }).format(v);

  if (oma.standalone) document.body.classList.add("standalone");

  let errTimer = null;
  function showError(msg) {
    clearTimeout(errTimer);
    $("err").textContent = msg;
    $("err").hidden = false;
    errTimer = setTimeout(() => { $("err").hidden = true; }, 7000);
  }

  // ── data: two declared collections, fetched (fixture previews carry both in the bound set) ──
  const fixtureRows = (items) => ({
    accounts: items.filter((i) => i.collection === WATCHLIST),
    reports: items.filter((i) => i.collection === REPORTS),
  });
  let pulling = null;
  let again = false;
  async function load(state) {
    const fixed = fixtureRows((state || oma.state).items || []);
    if (fixed.accounts.length || fixed.reports.length) {
      preview = true;
      if (!lastSig) model = fixed;
      return;
    }
    preview = false;
    const [w, r] = await Promise.all([oma.readCollection(WATCHLIST), oma.readCollection(REPORTS)]);
    model = { accounts: w.items || [], reports: r.items || [] };
  }
  function pull(state) {
    if (pulling) { again = true; return pulling; }
    pulling = (async () => {
      do { again = false; await load(state); } while (again);
      render();
    })().catch(() => render()).finally(() => { pulling = null; });
    return pulling;
  }

  // Optimistic overlay: what the user just did shows at once and survives a poll that lands first.
  function accountsView() {
    const rows = model.accounts.map((a) => {
      const p = pending.get(a.id);
      return p ? { ...a, fields: { ...a.fields, ...(p.status ? { status: p.status } : {}) }, busy: !!p.busy } : a;
    });
    for (const a of pendingAdds) if (!rows.some((r) => r.fields.handle === a.fields.handle)) rows.push(a);
    return rows;
  }

  async function write(tool, args, undo) {
    let failed = false;
    try {
      const r = await oma.callTool(tool, { command_id: uid(), actor: "human", ...args });
      failed = !!(r && r.isError);
    } catch { failed = true; }
    undo(failed);
    if (failed && tool !== "data_delete_item") showError(t("writeFailed"));
    if (!preview) await pull();
    else render(true);
  }

  // ── render: one pass, in place ─────────────────────────────────────────────────────────
  function weeksAll() { return [...new Set(model.reports.map((r) => r.fields.week_start).filter(Boolean))].sort().reverse(); }
  function weeksShown() { return weeksAll().slice(0, Math.max(1, oma.pref("weeks_shown", 4))); }
  function prevWeekOf(week) { const all = weeksAll(); const i = all.indexOf(week); return i >= 0 && i + 1 < all.length ? all[i + 1] : null; }
  const rowsOf = (week) => (week ? model.reports.filter((r) => r.fields.week_start === week) : []);
  const accountFor = (h) => model.accounts.find((a) => a.fields.handle === h);

  function insightFor(rows) {
    const ranked = [...rows].sort((a, b) => responseOf(b) - responseOf(a));
    const best = ranked[0] || null;
    const busiest = [...rows].sort((a, b) => posts(b) - posts(a))[0] || null;
    const proof = (r) => /demo|video|clip|screen record|演示|视频|录屏/i.test([r?.fields?.formats, r?.fields?.change_note, r?.fields?.themes].join(" "));
    const priorWeek = prevWeekOf(selectedWeek);
    const handles = new Set(rows.map((r) => r.fields.handle));
    const prior = priorWeek ? model.reports.filter((r) => r.fields.week_start === priorWeek && handles.has(r.fields.handle)) : [];
    const total = rows.reduce((s, r) => s + posts(r), 0);
    const delta = prior.length ? total - prior.reduce((s, r) => s + posts(r), 0) : null;

    let headline = t("headlineFormat");
    if (best && proof(best)) headline = t("headlineProof");
    else if (best && busiest && best !== busiest && posts(best) < posts(busiest)) headline = t("headlineSharper");
    else if (delta !== null && delta < 0) headline = t("headlineLess");
    else if (delta !== null && delta > 0) headline = t("headlineNoise");

    let dek = t("bestDek", { best: best?.fields?.handle });
    if (best && busiest && best !== busiest) {
      const gap = Math.max(0, posts(busiest) - posts(best));
      dek = t("comparisonDek", { best: best.fields.handle, gap, posts: t(gap === 1 ? "postOne" : "postMany"), busiest: busiest.fields.handle });
    }
    if (best?.fields?.change_note) dek += (lang() === "zh" ? "" : " ") + best.fields.change_note;
    return { ranked, best, busiest, isProof: best ? proof(best) : false, total, headline, dek };
  }

  function setText(node, text) {
    if (node.textContent === text) return;
    node.textContent = text;
    node.classList.remove("swap");
    void node.offsetWidth;
    node.classList.add("swap");
  }

  function render(force) {
    const view = accountsView();
    const sig = JSON.stringify([model, view.map((a) => [a.id, a.fields, a.busy]), selectedWeek, locale(), oma.pref("density", "comfortable"), oma.pref("weeks_shown", 4)]);
    if (!force && sig === lastSig) return;
    const first = !lastSig;
    lastSig = sig;

    document.documentElement.lang = lang() === "zh" ? "zh-CN" : "en";
    document.title = t("documentTitle");
    for (const n of document.querySelectorAll("[data-i18n]")) n.textContent = t(n.dataset.i18n);
    for (const n of document.querySelectorAll("[data-i18n-placeholder]")) n.placeholder = t(n.dataset.i18nPlaceholder);
    for (const n of document.querySelectorAll("[data-i18n-aria]")) n.setAttribute("aria-label", t(n.dataset.i18nAria));
    document.body.dataset.density = oma.pref("density", "comfortable");

    const weeks = weeksShown();
    if (!selectedWeek || !weeks.includes(selectedWeek)) selectedWeek = weeks[0] || null;
    const rows = rowsOf(selectedWeek);
    const all = weeksAll();
    const active = view.filter((a) => a.fields.status !== "paused");

    // issue line
    const i = weeks.indexOf(selectedWeek);
    $("issueNav").hidden = weeks.length < 2;
    $("prevWeek").disabled = i < 0 || i >= weeks.length - 1;
    $("nextWeek").disabled = i <= 0;
    $("issueLabel").textContent = selectedWeek ? t("issue", { n: all.length - all.indexOf(selectedWeek), week: weekLabel(selectedWeek) }) : t("issueEmpty");
    const stale = active.length > 0 && (!all.length || all[0] < thisMonday());
    $("staleBadge").hidden = !stale;
    $("staleBadge").textContent = t("notCompiled");
    $("compileBtn").hidden = !active.length;

    if (!rows.length) {
      setText($("headline"), view.length ? t("readyHead") : t("emptyHead"));
      setText($("dek"), view.length ? t("readyDek") : t("emptyDek"));
      renderGhost();
      $("deskSec").hidden = true;
      $("notesSec").hidden = true;
    } else {
      const ins = insightFor(rows);
      setText($("headline"), ins.headline);
      setText($("dek"), ins.dek);
      renderSplit(ins.ranked, first);
      $("deskSec").hidden = false;
      $("notesSec").hidden = false;
      renderDesk(rows, ins);
      renderNotes(ins.ranked, view);
    }
    renderSources(view);
  }

  // ── the signature: share of posts (top) against share of response (bottom) ───────────
  // One band per account, same order on both bars, so a ribbon that widens on the way down
  // is an account that earned more attention than its volume. Updated in place and tweened.
  let geo = new Map();
  let tween = 0;
  function renderGhost() {
    const fig = $("split");
    if (fig.dataset.mode === "ghost") { fig.querySelector("p").textContent = t("ghost"); return; }
    fig.dataset.mode = "ghost";
    geo = new Map();
    fig.className = "split split-ghost";
    fig.innerHTML = `<svg viewBox="0 0 1000 100" preserveAspectRatio="none" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" vector-effect="non-scaling-stroke">
      <rect x="1" y="1" width="998" height="20" rx="5" vector-effect="non-scaling-stroke" stroke-dasharray="5 5"/>
      <rect x="1" y="79" width="998" height="20" rx="5" vector-effect="non-scaling-stroke" stroke-dasharray="5 5"/>
      <path d="M300 22 C300 50 160 50 160 78 M650 22 C650 50 720 50 720 78" vector-effect="non-scaling-stroke" stroke-dasharray="3 5"/></svg><p></p>`;
    fig.querySelector("p").textContent = t("ghost");
  }

  function renderSplit(ranked, first) {
    const fig = $("split");
    if (fig.dataset.mode !== "live") {
      fig.dataset.mode = "live";
      fig.className = "split";
      fig.innerHTML = `<figcaption class="split-axis top" id="splitCaption"><span id="axTop"></span><span id="axTopN"></span></figcaption>
        <div class="split-plot" id="plot"><svg viewBox="0 0 1000 100" preserveAspectRatio="none" aria-hidden="true"></svg></div>
        <div class="split-axis bottom"><span id="axBot"></span><span id="axBotN"></span></div>
        <ul class="split-legend" id="legend"></ul>`;
    }
    const totalP = ranked.reduce((s, r) => s + posts(r), 0) || 1;
    const totalR = ranked.reduce((s, r) => s + responseOf(r), 0);
    $("axTop").textContent = t("postsAxis");
    $("axTopN").innerHTML = "";
    $("axTopN").append(el("b", "", String(ranked.reduce((s, r) => s + posts(r), 0))), " " + t("postMany"));
    $("axBot").textContent = t("respAxis");
    $("axBotN").innerHTML = "";
    $("axBotN").append(el("b", "", compact(totalR)));
    fig.setAttribute("aria-label", t("splitCaption", { week: weekLabel(selectedWeek) }));

    // Geometry lives in SHARE space; positions are re-accumulated every frame, so bands never
    // overlap mid-tween however the set of accounts changes between weeks.
    const target = new Map();
    ranked.forEach((r, i) => {
      target.set(r.fields.handle, { ps: posts(r) / totalP, rs: totalR ? responseOf(r) / totalR : 1 / ranked.length, i, lead: i === 0, r });
    });
    const GAP = ranked.length > 1 ? 6 : 0;
    const usable = 1000 - GAP * (ranked.length - 1);

    const svg = fig.querySelector("svg");
    const plot = $("plot");
    for (const g of [...svg.children]) if (!target.has(g.dataset.h)) g.remove();
    for (const n of [...plot.querySelectorAll(".seg-lab")]) if (!target.has(n.dataset.h)) n.remove();
    const from = new Map();
    for (const [h, tg] of target) {
      let g = svg.querySelector(`g[data-h="${CSS.escape(h)}"]`);
      if (!g) {
        g = document.createElementNS(SVGNS, "g");
        g.dataset.h = h;
        for (const tag of ["path", "rect", "rect"]) g.appendChild(document.createElementNS(SVGNS, tag));
        const labT = el("span", "seg-lab t");
        const labB = el("span", "seg-lab b");
        labT.dataset.h = labB.dataset.h = h;
        plot.append(labT, labB);
      }
      svg.appendChild(g);
      const shade = tg.lead ? "var(--ink)" : `color-mix(in oklab, var(--color-text-primary) ${[0, 26, 18, 12, 9, 7][Math.min(tg.i, 5)]}%, transparent)`;
      const [ribbon, top, bot] = g.children;
      ribbon.setAttribute("fill", tg.lead ? "color-mix(in oklab, var(--ink) 30%, transparent)" : "color-mix(in oklab, var(--color-text-primary) 6%, transparent)");
      top.setAttribute("fill", shade);
      bot.setAttribute("fill", shade);
      const [labT, labB] = plot.querySelectorAll(`.seg-lab[data-h="${CSS.escape(h)}"]`);
      labT.textContent = String(posts(tg.r));
      labB.textContent = compact(responseOf(tg.r));
      labT.classList.toggle("lead", tg.lead);
      labB.classList.toggle("lead", tg.lead);
      tg.shade = shade;
      // Where it starts: its old place, or — the first time — volume and response as equals,
      // so the bottom bar visibly re-deals itself into what actually earned the attention.
      from.set(h, geo.get(h) || (first ? { ps: tg.ps, rs: tg.ps } : { ps: 0, rs: 0, enter: true }));
    }

    const draw = (k) => {
      const m = (x, y) => x + (y - x) * k;
      const now = new Map();
      for (const [h, tg] of target) { const f = from.get(h); now.set(h, { ps: m(f.ps, tg.ps), rs: m(f.rs, tg.rs) }); }
      const sp = [...now.values()].reduce((x, v) => x + v.ps, 0) || 1;
      const sr = [...now.values()].reduce((x, v) => x + v.rs, 0) || 1;
      let xt = 0, xb = 0;
      for (const [h, v] of now) {
        const t0 = xt, t1 = xt + usable * v.ps / sp, b0 = xb, b1 = xb + usable * v.rs / sr;
        xt = t1 + GAP;
        xb = b1 + GAP;
        const g = svg.querySelector(`g[data-h="${CSS.escape(h)}"]`);
        const [ribbon, top, bot] = g.children;
        top.setAttribute("x", t0); top.setAttribute("y", 0); top.setAttribute("width", t1 - t0); top.setAttribute("height", 22);
        bot.setAttribute("x", b0); bot.setAttribute("y", 78); bot.setAttribute("width", b1 - b0); bot.setAttribute("height", 22);
        ribbon.setAttribute("d", `M${t0} 22 C${t0} 50 ${b0} 50 ${b0} 78 L${b1} 78 C${b1} 50 ${t1} 50 ${t1} 22 Z`);
        const [labT, labB] = plot.querySelectorAll(`.seg-lab[data-h="${CSS.escape(h)}"]`);
        g.style.opacity = labT.style.opacity = labB.style.opacity = from.get(h).enter ? k : "";
        labT.style.left = t0 / 10 + "%"; labT.style.width = (t1 - t0) / 10 + "%";
        labB.style.left = b0 / 10 + "%"; labB.style.width = (b1 - b0) / 10 + "%";
      }
      geo = now;
    };
    cancelAnimationFrame(tween);
    if (reduced()) { draw(1); fitLabels(); }
    else {
      const t0 = performance.now();
      const D = first ? 900 : 520;
      const delay = first ? 250 : 0;
      draw(0);
      const step = (ts) => {
        const p = Math.min(1, Math.max(0, (ts - t0 - delay) / D));
        draw(1 - Math.pow(1 - p, 3));
        if (p < 1) tween = requestAnimationFrame(step); else fitLabels();
      };
      tween = requestAnimationFrame(step);
      fitLabels();
    }

    // legend: who, and the one comparison the picture makes
    const legend = $("legend");
    legend.innerHTML = "";
    for (const [h, tg] of target) {
      const li = el("li", tg.lead ? "lead" : "");
      const sw = el("span", "sw");
      sw.style.background = tg.shade;
      const pp = Math.round(100 * posts(tg.r) / totalP);
      const rp = totalR ? Math.round(100 * responseOf(tg.r) / totalR) : 0;
      li.append(sw, el("span", "who", h), el("span", "how", t("legend", { p: pp, r: rp })));
      legend.appendChild(li);
    }
  }
  // A number that would not fit its band is hidden (the legend carries it), never cut.
  function fitLabels() {
    for (const n of document.querySelectorAll(".seg-lab")) {
      n.classList.remove("off");
      const need = n.textContent.length * 7 + 8;
      n.classList.toggle("off", n.getBoundingClientRect().width < need);
    }
  }
  new ResizeObserver(() => fitLabels()).observe($("split"));

  // ── decision desk ────────────────────────────────────────────────────────────────────
  function renderDesk(rows, ins) {
    const prior = new Map(rowsOf(prevWeekOf(selectedWeek)).map((r) => [r.fields.handle, r]));
    const best = ins.best;
    const pool = rows.length > 1 ? rows.filter((r) => r !== best) : rows;
    const swing = (r) => (prior.has(r.fields.handle) ? Math.abs(posts(r) - posts(prior.get(r.fields.handle))) : 0);
    const moved = [...pool].sort((a, b) => swing(b) - swing(a))[0] || best;
    const calls = [
      ["try", t("try"), ins.isProof ? t("showProof") : t("testPattern"),
        `${best.fields.handle}${t("colon")}${best.fields.change_note || t("strongestCluster", { theme: firstTheme(best) || "—" })}`],
      ["watch", t("watch"), t("formatShift"),
        `${moved.fields.handle}${t("colon")}${moved.fields.change_note || moved.fields.formats || t("watchAgain")}`],
      ins.busiest && ins.busiest.fields.handle !== best.fields.handle
        ? ["skip", t("ignore"), t("volumeRace"), t("volumeCopy", { busiest: ins.busiest.fields.handle, busyCount: posts(ins.busiest), best: best.fields.handle, bestCount: posts(best) })]
        : ["skip", t("ignore"), t("surfaceImitation"), t("imitationCopy")],
    ];
    const desk = $("desk");
    while (desk.children.length < 3) {
      const c = el("article", "call");
      c.append(el("div", "call-kind"), el("h4"), el("p"));
      desk.appendChild(c);
    }
    calls.forEach(([cls, kind, title, copy], i) => {
      const c = desk.children[i];
      c.className = "call " + cls;
      c.children[0].textContent = kind;
      c.children[1].textContent = title;
      c.children[2].textContent = copy;
    });
  }

  // ── field notes (keyed: a card is rebuilt only when its own row changed) ─────────────
  function renderNotes(ranked, view) {
    const wrap = $("notes");
    const prior = new Map(rowsOf(prevWeekOf(selectedWeek)).map((r) => [r.fields.handle, r]));
    const known = new Set(model.accounts.map((a) => a.fields.handle));
    const keep = new Map([...wrap.children].map((n) => [n.dataset.key, n]));
    const order = [];
    ranked.forEach((rep, idx) => {
      const r = rep.fields;
      const prev = prior.get(r.handle);
      const key = JSON.stringify([rep.id, r, idx === 0, prev ? posts(prev) : null, lang(), accountFor(r.handle)?.fields?.name]);
      let card = keep.get(key);
      if (!card) {
        card = el("article", "note" + (idx === 0 ? " lead" : ""));
        card.dataset.key = key;
        const head = el("div", "note-head");
        const who = el("div", "note-who");
        who.append(el("strong", "", r.handle || "—"), el("span", "", accountFor(r.handle)?.fields?.name || (known.has(r.handle) ? "" : t("archived"))));
        head.appendChild(who);
        if (prev) {
          const d = posts(rep) - posts(prev);
          head.appendChild(el("span", "k-badge" + (d > 0 ? " ok" : d < 0 ? " bad" : ""), d ? t(Math.abs(d) === 1 ? "postDelta" : "postsDelta", { delta: `${d > 0 ? "+" : "−"}${Math.abs(d)}` }) : t("samePace")));
        }
        card.appendChild(head);
        const nums = el("p", "note-nums");
        nums.append(el("b", "", t("postsCount", { n: posts(rep) })));
        if (r.engagement) nums.append(" · " + r.engagement);
        card.appendChild(nums);
        if (r.top_post) {
          card.appendChild(el("blockquote", "quote", r.top_post));
          if (r.top_post_stats) card.appendChild(el("div", "quote-stats", r.top_post_stats));
        }
        if (r.change_note) card.appendChild(el("p", "change", r.change_note));
        const foot = el("div", "note-foot");
        for (const th of String(r.themes || "").split(/[,，、]/).map((s) => s.trim()).filter(Boolean)) foot.appendChild(el("span", "k-chip static", th));
        if (r.formats) foot.appendChild(el("span", "fmt", r.formats));
        if (foot.children.length) card.appendChild(foot);
      }
      order.push(card);
    });
    wrap.replaceChildren(...order);
    const reported = new Set(ranked.map((r) => r.fields.handle));
    const missing = view.filter((a) => a.fields.status !== "paused" && !reported.has(a.fields.handle) && !a.temp).map((a) => a.fields.handle);
    $("missing").hidden = !missing.length;
    $("missing").textContent = t("missing", { list: missing.join(lang() === "zh" ? "、" : ", ") });
  }

  // ── sources (keyed by id; the toggle and the remove answer at once) ──────────────────
  function renderSources(view) {
    const list = $("sources");
    const act = view.filter((a) => a.fields.status !== "paused").length;
    const pau = view.length - act;
    $("srcCount").textContent = view.length ? t(pau ? "srcCount" : "srcCountAll", { active: act, paused: pau }) : "";
    // Keyed by handle, so the optimistic row IS the row the store sends back (no second entrance).
    const keep = new Map([...list.children].map((n) => [n.dataset.key, n]));
    const used = new Set();
    const rows = view.map((a) => {
      const f = a.fields;
      const key = used.has(f.handle) ? a.id : f.handle;
      used.add(key);
      let li = keep.get(key);
      if (!li) {
        li = el("li", "src");
        li.dataset.key = key;
        if (lastSig && keep.size) li.classList.add("fresh");
        li.append(el("div", "src-dot"), el("div", "src-copy"), el("button", "k-chip"), el("button", "k-btn ghost rm", "×"));
        li.children[1].append(el("strong"), el("span"));
        li.children[2].type = li.children[3].type = "button";
      }
      const paused = f.status === "paused";
      li.classList.toggle("paused", paused);
      li.classList.toggle("busy", !!a.busy || !!a.temp);
      li.children[0].textContent = String(f.name || f.handle || "@").replace(/^@/, "").slice(0, 1).toUpperCase() || "@";
      li.children[1].children[0].textContent = f.handle;
      li.children[1].children[1].textContent = [f.name, f.note].filter(Boolean).join(" · ");
      li.children[1].children[1].hidden = !f.name && !f.note;
      const chip = li.children[2];
      chip.className = "k-chip" + (paused ? "" : " on");
      chip.textContent = paused ? t("paused") : t("active");
      chip.setAttribute("aria-label", `${paused ? t("resume") : t("pause")} ${f.handle}`);
      chip.setAttribute("aria-pressed", String(!paused));
      chip.onclick = () => toggle(a);
      li.children[3].setAttribute("aria-label", `${t("remove")} ${f.handle}`);
      li.children[3].onclick = () => remove(a);
      return li;
    });
    list.replaceChildren(...rows);
  }

  function toggle(a) {
    const status = a.fields.status === "paused" ? "active" : "paused";
    pending.set(a.id, { status });
    render(true);
    write("data_update_item", { collection: WATCHLIST, id: a.id, fields: { status } }, (failed) => {
      pending.delete(a.id);
      const m = model.accounts.find((x) => x.id === a.id);
      if (!failed && m) m.fields = { ...m.fields, status };
    });
  }
  // A delete may be confirmed by the engine first, so the row dims instead of vanishing;
  // the answer (removed, or kept on cancel) comes from the store.
  function remove(a) {
    pending.set(a.id, { busy: true });
    render(true);
    write("data_delete_item", { collection: WATCHLIST, id: a.id }, (failed) => {
      pending.delete(a.id);
      if (!failed && preview) model.accounts = model.accounts.filter((x) => x.id !== a.id);
    });
  }
  function addSource(handle, note) {
    const temp = { id: "tmp-" + uid(), temp: true, fields: { handle, note, status: "active" } };
    pendingAdds.push(temp);
    render(true);
    return write("data_add_item", { collection: WATCHLIST, fields: { handle, note, status: "active" } }, (failed) => {
      pendingAdds.splice(pendingAdds.indexOf(temp), 1);
      if (!failed && preview) model.accounts.push({ ...temp, id: "fx-" + temp.id, temp: false });
    });
  }

  const normalizeHandle = (raw) => { const h = String(raw || "").trim().replace(/^@+/, ""); return h ? "@" + h : ""; };
  $("addForm").onsubmit = (e) => {
    e.preventDefault();
    const handle = normalizeHandle($("handleInput").value);
    if (!handle) return;
    const note = $("noteInput").value.trim();
    $("handleInput").value = "";
    $("noteInput").value = "";
    addSource(handle, note);
  };
  $("pasteToggle").onclick = () => { $("pasteBox").hidden = !$("pasteBox").hidden; };
  $("pasteAdd").onclick = async () => {
    const lines = $("pasteArea").value.split("\n").map((l) => l.trim()).filter(Boolean);
    $("pasteArea").value = "";
    $("pasteBox").hidden = true;
    for (const line of lines) {
      const [first, ...rest] = line.split(/\s+/);
      const handle = normalizeHandle(first);
      if (handle) await addSource(handle, rest.join(" "));
    }
  };

  $("prevWeek").onclick = () => { const w = weeksShown(); const i = w.indexOf(selectedWeek); if (i < w.length - 1) { selectedWeek = w[i + 1]; render(); } };
  $("nextWeek").onclick = () => { const w = weeksShown(); const i = w.indexOf(selectedWeek); if (i > 0) { selectedWeek = w[i - 1]; render(); } };

  // sendMessage PROPOSES; clipboard degradation (standalone) is success, not failure.
  const cta = $("compileBtn");
  cta.onclick = async () => {
    const monday = thisMonday();
    const active = accountsView().filter((a) => a.fields.status !== "paused").map((a) => a.fields.handle).join(", ");
    cta.disabled = true;
    try {
      const r = await oma.sendMessage(t("buildPrompt", {
        week: weekLabel(monday),
        week_start: monday,
        active,
        fields: "{week_start, handle, posts_count, engagement, top_post (short quote only), top_post_stats, themes (comma-separated), formats, change_note (what changed vs last week)}"
      }));
      if (r && r.isError === true && !r.degraded) showError(t("askFailed"));
    } catch (e) {
      showError(String(e?.message || e || t("askFailed")));
    } finally {
      cta.disabled = false;
    }
  };

  oma.ready(pull);
  oma.onChange(pull);
  oma.onPrefChange(() => render(true));
  setInterval(() => { if (!document.hidden && !preview) pull(); }, 30_000);
</script>
</body>
</html>
