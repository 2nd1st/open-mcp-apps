<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Event Countdowns</title>
<meta name="description" content="Live countdowns to the dates that matter — birthdays, deadlines, trips, launches — with the next one up front in big numbers.">
<meta name="oma-category" content="Planning">
<style>
  /* Shared primitives (.k-*) — this app's own copy; nothing here comes from the engine. */
  :root{--k-accent:var(--color-text-info,var(--color-ring-primary,#3b6cf6));--k-bad:var(--color-text-danger,#e5484d);--k-ink-4:color-mix(in oklab,var(--color-text-primary) 4%,transparent);--k-s2:8px;--k-t-fast:120ms;--k-t:180ms;--k-ease:cubic-bezier(.2,.8,.3,1);--k-spring:cubic-bezier(.34,1.56,.64,1);--k-surface:var(--color-background-primary)}
  @media (prefers-reduced-motion:reduce){:root{--k-t-fast:0ms;--k-t:0ms}}
  .k-btn{display:inline-flex;align-items:center;gap:6px;border:1px solid transparent;border-radius:var(--border-radius-md,10px);padding:6px 12px;font:inherit;font-size:var(--font-text-sm-size,12.5px);font-weight:600;cursor:pointer;background:var(--color-background-inverse);color:var(--color-text-inverse);transition:transform var(--k-t-fast) var(--k-ease),opacity var(--k-t-fast),background var(--k-t-fast)}
  .k-btn:hover{opacity:.9}
  .k-btn:active{transform:scale(.96)}
  .k-btn:disabled{opacity:.45;cursor:default;transform:none}
  .k-btn.sec{background:transparent;color:var(--color-text-primary);border-color:var(--color-border-primary)}
  .k-btn.ghost{background:transparent;color:var(--color-text-secondary)}
  :is(.k-btn.sec,.k-btn.ghost):hover{background:var(--k-ink-4);color:var(--color-text-primary);opacity:1}
  .k-btn.danger{background:transparent;color:var(--k-bad);border-color:color-mix(in oklab,var(--k-bad) 30%,transparent)}
  .k-btn.danger:hover{background:color-mix(in oklab,var(--k-bad) 10%,transparent);opacity:1}
  :is(.k-btn,.k-tab,.k-chip,.k-switch,.k-field):focus-visible{outline:2px solid var(--color-ring-primary,var(--k-accent));outline-offset:1px}
  .k-chip{display:inline-flex;align-items:center;gap:5px;border-radius:var(--border-radius-full,999px);border:1px solid var(--color-border-secondary);background:transparent;color:var(--color-text-secondary);padding:2px 10px;font:inherit;font-size:11.5px;font-weight:550;cursor:pointer;transition:background var(--k-t-fast),color var(--k-t-fast),border-color var(--k-t-fast),transform var(--k-t) var(--k-spring)}
  .k-chip:hover{background:var(--k-ink-4);color:var(--color-text-primary)}
  .k-chip:active{transform:scale(.93)}
  .k-chip.on{background:color-mix(in oklab,var(--k-accent) 10%,transparent);border-color:color-mix(in oklab,var(--k-accent) 28%,transparent);color:var(--k-accent)}
  .k-chip.static{cursor:default}
  .k-chip.static:hover{background:transparent;color:var(--color-text-secondary)}
  .k-chip.static:active{transform:none}
  .k-field{padding:6px 10px;border-radius:var(--border-radius-md,10px);border:1px solid var(--color-border-primary);background:transparent;color:inherit;font:inherit;font-size:var(--font-text-sm-size,12.5px);transition:border-color var(--k-t-fast),box-shadow var(--k-t-fast)}
  .k-field::placeholder{color:var(--color-text-tertiary)}
  .k-field:focus{outline:none;border-color:var(--k-accent);box-shadow:0 0 0 3px color-mix(in oklab,var(--k-accent) 10%,transparent)}
  .k-empty{display:grid;place-items:center;gap:var(--k-s2);text-align:center;padding:36px 16px;color:var(--color-text-tertiary)}
  .k-empty>svg{width:64px;height:64px;stroke-width:1.5}
  .k-empty b{color:var(--color-text-secondary);font-weight:600}
  .k-appbar{display:flex;align-items:center;gap:11px;padding:13px 16px}
  .k-appbar .k-appmark{display:grid;width:34px;height:34px;flex:none;place-items:center;border-radius:11px}
  .k-appbar .k-appmark svg{width:18px;height:18px}
  .k-appbar .k-appcopy{min-width:0;flex:1}
  .k-appbar .k-eyebrow{display:block;margin:0;color:var(--color-text-tertiary);font-size:9.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
  .k-appbar h1{margin:1px 0 0;font-size:15px;font-weight:650;letter-spacing:-.015em}
  body:not(.standalone) .k-appbar{border-bottom:1px solid var(--color-border-secondary);background:var(--k-surface)}
  .k-stage{max-width:760px;margin-inline:auto;overflow-x:clip}

  /* The signature is the NEXT DATE: its name, and the number of days left at display size, with a
     strip of the days in between. One accent — orchid — marks that number, the strip, the
     "soon" badges and the primary action. Structure is host tokens; overdue keeps danger. */
  #app {
    --ec-accent: light-dark(#a13fa0, #e6a0e4);
    --ec-on-accent: light-dark(#ffffff, #2a0c29);
    --ec-tint: color-mix(in oklab, var(--ec-accent) 10%, transparent);
    --ec-late: var(--color-text-danger, #c43c3c);
    --k-accent: var(--ec-accent);
  }
  button, input { font: inherit; color: inherit; }

  /* ── app bar ── */
  .topbar { min-height: 64px; flex-wrap: wrap; }
  .brand-mark { background: var(--ec-tint); color: var(--ec-accent); }
  .brand-mark svg { fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  #summary { margin-top: 2px; color: var(--color-text-secondary); font-size: var(--font-text-sm-size, 12px); }
  .top-actions { display: flex; gap: 8px; margin-left: auto; }
  .top-actions .k-btn { min-height: 36px; padding-inline: 12px; font-size: 13px; }
  .top-actions svg { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  #app .k-btn.primary { background: var(--ec-accent); color: var(--ec-on-accent); }

  .error-strip {
    margin: 10px 16px 0;
    padding: 8px 10px;
    border: 1px solid color-mix(in oklab, var(--ec-late) 34%, var(--color-border-secondary));
    border-radius: var(--border-radius-md, 8px);
    color: var(--ec-late);
    background: color-mix(in oklab, var(--ec-late) 8%, transparent);
    font-size: 12px;
  }

  /* ── add form ── */
  #addPanel {
    padding: 12px 16px 14px;
    border-bottom: 1px solid var(--color-border-secondary);
    background: var(--color-background-secondary);
  }
  #addForm {
    display: grid;
    grid-template-columns: 1.2fr .8fr .75fr 1.25fr auto;
    gap: 8px;
    align-items: end;
  }
  #addForm label { display: grid; gap: 5px; min-width: 0; }
  #addForm label span { color: var(--color-text-secondary); font-size: 12px; font-weight: 600; }
  #addForm .k-field { width: 100%; min-width: 0; height: 36px; background: var(--color-background-primary); }
  #saveEvent { height: 36px; justify-content: center; }

  .content { padding: 14px; }

  /* ── the hero: next date + its number ── */
  #hero {
    --tone: var(--ec-accent);
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 6px 24px;
    align-items: center;
    padding: 20px 22px 18px;
    border: 1px solid color-mix(in oklab, var(--tone) 30%, var(--color-border-secondary));
    border-radius: var(--border-radius-lg, 14px);
    background: color-mix(in oklab, var(--tone) 5%, var(--color-background-primary));
  }
  #hero[data-urgency="overdue"] { --tone: var(--ec-late); }
  .hero-copy { min-width: 0; }
  .hero-label {
    display: flex;
    align-items: center;
    gap: 7px;
    margin-bottom: 8px;
    color: var(--tone);
    font-size: 12px;
    font-weight: 700;
  }
  .hero-label svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  #heroTitle {
    margin: 0;
    overflow-wrap: anywhere;
    font-size: clamp(24px, 4.2vw, 34px);
    font-weight: 750;
    line-height: 1.08;
    letter-spacing: -.02em;
  }
  .hero-meta {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px 10px;
    margin-top: 10px;
    color: var(--color-text-secondary);
    font-size: 13px;
  }
  .cat-tag {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 2px 9px;
    border: 1px solid var(--color-border-secondary);
    border-radius: var(--border-radius-full, 999px);
    color: var(--color-text-secondary);
    font-size: 12px;
    font-weight: 600;
  }
  #heroNote {
    max-width: 36em;
    margin: 10px 0 0;
    color: var(--color-text-secondary);
    line-height: 1.45;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
  .countdown { display: grid; justify-items: end; text-align: right; }
  #heroNumber {
    color: var(--tone);
    font-size: 88px;
    font-weight: 780;
    line-height: .9;
    letter-spacing: -.05em;
    font-variant-numeric: tabular-nums;
  }
  #heroUnit { margin-top: 6px; color: var(--color-text-secondary); font-size: 14px; font-weight: 650; }

  /* The days between today and the date, one pip each: today filled, the date itself ringed.
     Only drawn when the date is close enough for the pips to be countable (≤ 21 days). */
  #strip {
    grid-column: 1 / -1;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 5px;
    margin-top: 14px;
  }
  #strip i {
    width: 12px;
    height: 12px;
    border: 1.5px solid color-mix(in oklab, var(--tone) 45%, transparent);
    border-radius: 3px;
  }
  #strip i.today { background: var(--tone); border-color: var(--tone); }
  #strip i.goal { width: 16px; height: 16px; border-radius: var(--border-radius-full, 999px); border-width: 2px; border-color: var(--tone); background: var(--ec-tint); }
  #strip span { margin-left: 6px; color: var(--color-text-tertiary); font-size: 12px; }

  /* ── the list ── */
  .list-card {
    margin-top: 12px;
    border: 1px solid var(--color-border-secondary);
    border-radius: var(--border-radius-lg, 14px);
    background: var(--color-background-primary);
  }
  .list-head {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px 10px;
    padding: 10px 12px 10px 14px;
    border-bottom: 1px solid var(--color-border-secondary);
  }
  .list-title { font-size: 13px; font-weight: 700; }
  #filters { display: flex; flex-wrap: wrap; gap: 6px; margin-left: auto; }
  /* `.k-chip.on` resolves its tint from the :root accent, before this app's accent exists — pin it here. */
  #app .k-chip.on { background: var(--ec-tint); border-color: color-mix(in oklab, var(--ec-accent) 35%, transparent); color: var(--ec-accent); }
  /* Long lists scroll inside the card, so the hero and the add button stay on the first screen. */
  #eventList { max-height: 460px; overflow-y: auto; overscroll-behavior: contain; }
  .event-row {
    display: grid;
    grid-template-columns: 48px minmax(0, 1fr) auto 30px;
    align-items: center;
    gap: 12px;
    min-height: 68px;
    padding: 10px 10px 10px 14px;
    border-top: 1px solid var(--color-border-secondary);
  }
  .event-row:first-child { border-top: 0; }
  .event-row.next .date-tile { border-color: var(--ec-accent); color: var(--ec-accent); background: var(--ec-tint); }
  .event-row.pending { opacity: .7; }
  .date-tile {
    display: grid;
    place-content: center;
    width: 46px;
    height: 48px;
    border: 1px solid var(--color-border-secondary);
    border-radius: var(--border-radius-md, 10px);
    text-align: center;
  }
  .date-tile strong { font-size: 19px; font-weight: 750; line-height: 1; font-variant-numeric: tabular-nums; }
  .date-tile span { margin-top: 3px; color: var(--color-text-tertiary); font-size: 10.5px; font-weight: 650; }
  .event-row.next .date-tile span { color: inherit; }
  .event-copy { min-width: 0; }
  .event-title { display: block; font-weight: 650; line-height: 1.3; overflow-wrap: anywhere; }
  .event-meta { margin-top: 3px; color: var(--color-text-secondary); font-size: 12px; line-height: 1.4; overflow-wrap: anywhere; }
  .event-meta b { color: var(--color-text-secondary); font-weight: 650; }
  .days-badge {
    padding: 4px 10px;
    border-radius: var(--border-radius-full, 999px);
    background: var(--color-background-secondary);
    color: var(--color-text-secondary);
    font-size: 12px;
    font-weight: 700;
    text-align: center;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .days-badge.soon { background: var(--ec-tint); color: var(--ec-accent); }
  .days-badge.overdue { background: color-mix(in oklab, var(--ec-late) 10%, transparent); color: var(--ec-late); }
  .delete {
    display: grid;
    place-items: center;
    width: 30px;
    height: 30px;
    padding: 0;
    border: 0;
    border-radius: var(--border-radius-md, 8px);
    background: transparent;
    color: var(--color-text-tertiary);
    cursor: pointer;
    opacity: .55;
  }
  .delete svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; }
  .event-row:hover .delete, .delete:focus-visible { opacity: 1; }
  .delete:hover { color: var(--ec-late); background: color-mix(in oklab, var(--ec-late) 8%, transparent); }
  .empty { padding: 30px 18px; }
  .empty svg { width: 56px; height: 56px; fill: none; stroke: var(--ec-accent); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }

  @media (prefers-reduced-motion: no-preference) {
    .event-row { transition: background var(--k-t-fast), opacity var(--k-t-fast); }
    .event-row:hover { background: color-mix(in oklab, var(--color-text-primary) 3%, transparent); }
    #addPanel:not([hidden]) { animation: reveal 200ms var(--k-ease) both; transform-origin: top; }
    .event-row.just-added { animation: land 520ms var(--k-spring); }
    .event-row.just-added .date-tile { animation: tile 520ms var(--k-spring); }
    #heroNumber.swap { animation: swap 460ms var(--k-spring); }
    #strip i.goal { animation: goal 2.4s var(--k-ease) infinite; }
    @keyframes reveal { from { opacity: 0; transform: scaleY(.94); } to { opacity: 1; transform: none; } }
    @keyframes land { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }
    @keyframes tile { 0% { transform: scale(.6) rotate(-8deg); } 100% { transform: none; } }
    @keyframes swap { 0% { opacity: 0; transform: translateY(14px) scale(.85); } 100% { opacity: 1; transform: none; } }
    @keyframes goal { 50% { box-shadow: 0 0 0 4px color-mix(in oklab, var(--tone) 14%, transparent); } }
  }
  @media (max-width: 700px) {
    #addForm { grid-template-columns: 1fr 1fr; }
    #addForm label:first-child, #addForm label:nth-child(4), #saveEvent { grid-column: 1 / -1; }
  }
  @media (max-width: 640px) {
    .topbar { padding: 11px 12px; }
    #prepareButton span, #addToggle span { display: none; }
    .top-actions .k-btn { width: 36px; padding: 0; justify-content: center; }
    .content { padding: 10px; }
    #hero { padding: 16px; gap: 4px 14px; }
    #heroTitle { font-size: 24px; }
    #heroNumber { font-size: 60px; }
    #heroUnit { font-size: 12.5px; }
    #strip i { width: 10px; height: 10px; }
    #strip i.goal { width: 14px; height: 14px; }
    #filters { margin-left: 0; }
    .event-row { grid-template-columns: 42px minmax(0, 1fr) auto 26px; gap: 9px; padding-left: 10px; padding-right: 6px; }
    .date-tile { width: 42px; height: 44px; }
    .days-badge { padding-inline: 8px; }
    .delete { width: 26px; height: 26px; }
  }
</style>
</head>
<body>
<main id="app" class="k-stage">
  <header class="topbar k-appbar">
    <div class="brand-mark k-appmark" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="M6.5 3.5v3M17.5 3.5v3M4 9h16M5.5 5.5h13A1.5 1.5 0 0 1 20 7v12a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 19V7a1.5 1.5 0 0 1 1.5-1.5Z"/><path d="M12 12.5v3l2 1.2"/></svg>
    </div>
    <div class="brand-copy k-appcopy">
      <h1 id="appTitle">Event countdowns</h1>
      <div id="summary"></div>
    </div>
    <div class="top-actions">
      <button class="k-btn sec" id="prepareButton" type="button" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 1.3 4.2L17.5 8.5l-4.2 1.3L12 14l-1.3-4.2-4.2-1.3 4.2-1.3L12 3Z"/><path d="m18.5 14 .7 2.3 2.3.7-2.3.7-.7 2.3-.7-2.3-2.3-.7 2.3-.7.7-2.3Z"/></svg>
        <span id="prepareLabel">Help me prepare</span>
      </button>
      <button class="k-btn primary" id="addToggle" type="button" aria-expanded="false" aria-controls="addPanel">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        <span id="addLabel">Add date</span>
      </button>
    </div>
  </header>

  <div class="error-strip" id="errorStrip" role="status" aria-live="polite" hidden></div>

  <section id="addPanel" hidden>
    <form id="addForm">
      <label><span id="lblTitle">Event</span><input class="k-field" id="titleInput" maxlength="80" autocomplete="off" required></label>
      <label><span id="lblDate">Date</span><input class="k-field" id="dateInput" type="date" required></label>
      <label><span id="lblCategory">Category</span><input class="k-field" id="categoryInput" list="categoryOptions" maxlength="30" autocomplete="off" required></label>
      <label><span id="lblNote">Note</span><input class="k-field" id="noteInput" maxlength="140" autocomplete="off"></label>
      <button class="k-btn primary" id="saveEvent" type="submit">Save</button>
      <datalist id="categoryOptions"></datalist>
    </form>
  </section>

  <div class="content">
    <section id="hero" data-urgency="soon" aria-live="polite">
      <div class="hero-copy">
        <div class="hero-label">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h13M13 7l5 5-5 5"/></svg>
          <span id="heroLabel">Coming up next</span>
        </div>
        <h2 id="heroTitle"></h2>
        <div class="hero-meta"><span id="heroDate"></span><span class="cat-tag" id="heroCategory"></span></div>
        <p id="heroNote"></p>
      </div>
      <div class="countdown">
        <strong id="heroNumber">—</strong>
        <span id="heroUnit"></span>
      </div>
      <div id="strip" aria-hidden="true"></div>
    </section>

    <section class="list-card" id="listCard">
      <div class="list-head">
        <span class="list-title" id="listTitle">All dates</span>
        <div id="filters"></div>
      </div>
      <div id="eventList"></div>
    </section>
  </div>
</main>

<script type="module">
  const STR = {
    en: {
      title: "Event countdowns",
      summary: (up, past) => `${up} coming up` + (past ? ` · ${past} passed` : ""),
      summaryEmpty: "Your important dates, in view",
      prepare: "Help me prepare",
      add: "Add date",
      close: "Close",
      save: "Save",
      event: "Event",
      date: "Date",
      category: "Category",
      note: "Note",
      titlePh: "Quarterly launch",
      notePh: "Optional",
      catPh: "Work",
      next: "Coming up next",
      passed: "Passed — needs a decision",
      today: "It's today",
      daysLeft: (n) => (n === 1 ? "day to go" : "days to go"),
      daysOver: (n) => (n === 1 ? "day ago" : "days ago"),
      todayUnit: "today",
      badge: (n) => (n === 0 ? "Today" : n === 1 ? "Tomorrow" : `${n} days`),
      overdue: (n) => `${n}d ago`,
      noDate: "Date needed",
      weeks: (w) => `about ${w} weeks away`,
      stripHint: (n) => `${n} ${n === 1 ? "day" : "days"} between`,
      allDates: "All dates",
      all: "All",
      emptyTitle: "No dates to count down to yet.",
      emptyHint: "Or tell the AI: “count down to my sister's wedding on 12 October.”",
      filterEmpty: "Nothing in this category.",
      untitled: "Untitled event",
      heroEmptyTitle: "Your next date goes here",
      heroEmptyNote: "Add a birthday, a trip or a deadline and the days start counting.",
      remove: (t) => `Delete ${t}`,
      askFailed: "Couldn't reach the assistant — try again.",
      saveFailed: "Not saved — try again.",
      deleteFailed: "Still here — the delete didn't go through.",
      prompt: (title, date, left, note) => `Help me prepare for "${title}" on ${date} (${left}).${note ? ` My note: ${note}.` : ""} Please make a concise preparation plan with milestones and a practical checklist.`,
      promptLeft: (n) => (n < 0 ? `${-n} days ago` : n === 0 ? "today" : `${n} days from now`),
      filterAria: "Filter by category"
    },
    zh: {
      title: "日期倒数",
      summary: (up, past) => `${up} 个即将到来` + (past ? ` · ${past} 个已过` : ""),
      summaryEmpty: "把重要的日子放在眼前",
      prepare: "帮我准备",
      add: "添加日期",
      close: "收起",
      save: "保存",
      event: "事件",
      date: "日期",
      category: "分类",
      note: "备注",
      titlePh: "季度发布",
      notePh: "可选",
      catPh: "工作",
      next: "下一个",
      passed: "已经过了，要决定下一步",
      today: "就是今天",
      daysLeft: () => "天后",
      daysOver: () => "天前",
      todayUnit: "今天",
      badge: (n) => (n === 0 ? "今天" : n === 1 ? "明天" : `${n} 天`),
      overdue: (n) => `${n} 天前`,
      noDate: "缺日期",
      weeks: (w) => `大约 ${w} 周后`,
      stripHint: (n) => `中间还有 ${n} 天`,
      allDates: "全部日期",
      all: "全部",
      emptyTitle: "还没有要倒数的日期。",
      emptyHint: "也可以对 AI 说：“帮我倒数到 10 月 12 日妹妹的婚礼。”",
      filterEmpty: "这个分类里没有日期。",
      untitled: "未命名事件",
      heroEmptyTitle: "下一个重要日子会出现在这里",
      heroEmptyNote: "加一个生日、一次旅行或一个截止日期，就开始倒数。",
      remove: (t) => `删除 ${t}`,
      askFailed: "没能联系上助手，请重试。",
      saveFailed: "没有保存成功，请重试。",
      deleteFailed: "还在这里——删除没有成功。",
      prompt: (title, date, left, note) => `帮我准备「${title}」，日期是 ${date}（${left}）。${note ? `我的备注：${note}。` : ""}请给我一份简洁的准备计划，包含时间节点和实用清单。`,
      promptLeft: (n) => (n < 0 ? `已过去 ${-n} 天` : n === 0 ? "就是今天" : `还有 ${n} 天`),
      filterAria: "按分类筛选"
    }
  };

  const $ = (id) => document.getElementById(id);
  const hero = $("hero");
  const prepareButton = $("prepareButton");
  const addToggle = $("addToggle");
  const addPanel = $("addPanel");

  let latestState = { items: [] };
  let activeCategory = "All";
  let heroId = null;
  // Optimistic writes: a saved date appears at once (and leaves again if the ack refuses it); a
  // deleted one disappears at once (and comes back if the user cancels the engine's confirm).
  let pending = [];
  const removing = new Set();
  let justAdded = null;
  const rows = new Map();

  function locale() {
    const value = oma.pref("locale", "auto");
    const resolved = value === "auto" ? navigator.language : value;
    try { new Intl.DateTimeFormat(resolved); return resolved; } catch { return "en"; }
  }
  const lang = () => (String(locale()).toLowerCase().startsWith("zh") ? "zh" : "en");
  const T = () => STR[lang()];

  function localDateParts(value) {
    const match = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(value || ""));
    if (!match) return null;
    const year = Number(match[1]);
    const month = Number(match[2]);
    const day = Number(match[3]);
    const date = new Date(year, month - 1, day);
    if (date.getFullYear() !== year || date.getMonth() !== month - 1 || date.getDate() !== day) return null;
    return { year, month, day, date, stamp: Date.UTC(year, month - 1, day) };
  }
  function todayStamp() {
    const now = new Date();
    return Date.UTC(now.getFullYear(), now.getMonth(), now.getDate());
  }
  function daysUntil(value) {
    const parts = localDateParts(value);
    return parts ? Math.round((parts.stamp - todayStamp()) / 86400000) : null;
  }
  // The category IS the group (and mirrored in fields.category) — user data, never translated.
  function categoryOf(item) {
    return String(item.group || item.fields.category || "").trim() || "—";
  }

  function formatDate(value, long = false) {
    const parts = localDateParts(value);
    if (!parts) return T().noDate;
    const preference = oma.pref("date_format", "auto");
    const pad = (n) => String(n).padStart(2, "0");
    if (!long && preference === "yyyy-mm-dd") return String(value);
    if (!long && preference === "dd/mm/yyyy") return `${pad(parts.day)}/${pad(parts.month)}/${parts.year}`;
    if (!long && preference === "mm/dd/yyyy") return `${pad(parts.month)}/${pad(parts.day)}/${parts.year}`;
    const sameYear = parts.year === new Date().getFullYear();
    return new Intl.DateTimeFormat(locale(), long
      ? { weekday: "long", day: "numeric", month: "long", year: sameYear ? undefined : "numeric" }
      : { day: "numeric", month: "short", year: sameYear ? undefined : "numeric" }
    ).format(parts.date);
  }

  function sortEvents(items) {
    return [...items].sort((a, b) => {
      const aDays = daysUntil(a.fields.target_date);
      const bDays = daysUntil(b.fields.target_date);
      const aRank = aDays === null ? 2 : aDays >= 0 ? 0 : 1;
      const bRank = bDays === null ? 2 : bDays >= 0 ? 0 : 1;
      if (aRank !== bRank) return aRank - bRank;
      if (aDays !== bDays) return aRank === 1 ? bDays - aDays : (aDays ?? Infinity) - (bDays ?? Infinity);
      return (a.position || 0) - (b.position || 0);
    });
  }

  function el(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }
  function svg(markup, cls = "") {
    const holder = document.createElement("span");
    holder.innerHTML = `<svg viewBox="0 0 24 24" class="${cls}" aria-hidden="true">${markup}</svg>`;
    return holder.firstChild;
  }

  function showError(message) {
    const strip = $("errorStrip");
    clearTimeout(showError.timer);
    strip.textContent = message;
    strip.hidden = false;
    showError.timer = setTimeout(() => { strip.hidden = true; }, 7000);
  }
  function clearError() {
    clearTimeout(showError.timer);
    $("errorStrip").hidden = true;
  }

  // What the page shows = stored rows − the ones being deleted + the ones being added.
  function viewItems(state) {
    const stored = state.items || [];
    const ids = new Set(stored.map((item) => item.id));
    for (const id of [...removing]) if (!ids.has(id)) removing.delete(id);
    pending = pending.filter((p) => !(p.id && ids.has(p.id)));
    return [...stored.filter((item) => !removing.has(item.id)), ...pending.map((p) => ({ ...p, pending: true }))];
  }

  function paintHero(item) {
    const t = T();
    if (!item) {
      hero.dataset.urgency = "soon";
      $("heroLabel").textContent = t.next;
      $("heroTitle").textContent = t.heroEmptyTitle;
      $("heroDate").textContent = "";
      $("heroCategory").hidden = true;
      $("heroNote").textContent = t.heroEmptyNote + (lang() === "zh" ? "" : " ") + t.emptyHint;
      $("heroNote").hidden = false;
      $("heroNumber").textContent = "";
      $("heroUnit").textContent = "";
      $("strip").replaceChildren();
      prepareButton.hidden = true;
      heroId = null;
      return;
    }
    const fields = item.fields;
    const days = daysUntil(fields.target_date);
    hero.dataset.urgency = days !== null && days < 0 ? "overdue" : "soon";
    $("heroLabel").textContent = days === null ? t.next : days < 0 ? t.passed : days === 0 ? t.today : t.next;
    $("heroTitle").textContent = fields.title || t.untitled;
    $("heroDate").textContent = formatDate(fields.target_date, true);
    $("heroCategory").hidden = false;
    $("heroCategory").textContent = categoryOf(item);
    $("heroNote").textContent = fields.note || "";
    $("heroNote").hidden = !fields.note;
    const number = $("heroNumber");
    const text = days === null ? "—" : String(Math.abs(days));
    // The number swaps in with a spring only when the NEXT date itself changes (you added a
    // sooner one, or the old one passed) — not on every refresh.
    const key = item.id || item.tempId;
    if (heroId !== null && key !== heroId) {
      number.classList.remove("swap");
      void number.offsetWidth;
      number.classList.add("swap");
    }
    heroId = key;
    number.textContent = days === null ? "" : text;
    $("heroUnit").textContent = days === null ? "" : days === 0 ? t.todayUnit : days < 0 ? t.daysOver(-days) : t.daysLeft(days);

    const strip = $("strip");
    strip.replaceChildren();
    if (days !== null && days >= 0 && days <= 21) {
      for (let i = 0; i <= days; i++) strip.append(el("i", i === days ? "goal" : i === 0 ? "today" : ""));
      if (days > 1) strip.append(el("span", "", t.stripHint(days - 1)));
    } else if (days !== null && days > 21) {
      strip.append(el("span", "", t.weeks(Math.round(days / 7))));
    }

    prepareButton.hidden = false;
    prepareButton.onclick = async () => {
      clearError();
      prepareButton.disabled = true;
      try {
        const result = await oma.sendMessage(t.prompt(fields.title || t.untitled, formatDate(fields.target_date, true), t.promptLeft(days ?? 0), fields.note || ""));
        if (result && result.isError === true && !result.degraded) showError(t.askFailed);
      } catch (error) {
        showError(String(error?.message || error || t.askFailed));
      } finally {
        prepareButton.disabled = false;
      }
    };
  }

  function paintFilters(items) {
    const t = T();
    const filters = $("filters");
    filters.setAttribute("aria-label", t.filterAria);
    const categories = [...new Set(items.map(categoryOf))].sort((a, b) => a.localeCompare(b));
    if (activeCategory !== "All" && !categories.includes(activeCategory)) activeCategory = "All";
    filters.replaceChildren();
    if (categories.length < 2) return;
    for (const category of ["All", ...categories]) {
      const count = category === "All" ? items.length : items.filter((item) => categoryOf(item) === category).length;
      const button = el("button", `k-chip${category === activeCategory ? " on" : ""}`, `${category === "All" ? t.all : category} ${count}`);
      button.type = "button";
      button.setAttribute("aria-pressed", String(category === activeCategory));
      button.onclick = () => {
        activeCategory = category;
        render(latestState);
      };
      filters.append(button);
    }
  }

  // One row element per event, kept across refreshes and refilled in place.
  function fillRow(row, item, isNext) {
    const t = T();
    const fields = item.fields;
    const parts = localDateParts(fields.target_date);
    const days = daysUntil(fields.target_date);
    row.className = `event-row${isNext ? " next" : ""}${item.pending ? " pending" : ""}${row.classList.contains("just-added") ? " just-added" : ""}`;

    const tile = el("div", "date-tile");
    tile.append(
      el("strong", "", parts ? String(parts.day) : "—"),
      el("span", "", parts
        ? new Intl.DateTimeFormat(locale(), { month: "short" }).format(parts.date) + (parts.year !== new Date().getFullYear() ? ` ’${String(parts.year).slice(2)}` : "")
        : "?")
    );
    const copy = el("div", "event-copy");
    const meta = el("div", "event-meta");
    meta.append(el("b", "", categoryOf(item)), document.createTextNode(` · ${fields.note || formatDate(fields.target_date)}`));
    copy.append(el("span", "event-title", fields.title || t.untitled), meta);

    const badgeClass = days === null ? "" : days < 0 ? " overdue" : days <= 14 ? " soon" : "";
    const badge = el("span", `days-badge${badgeClass}`, days === null ? t.noDate : days < 0 ? t.overdue(-days) : t.badge(days));

    const remove = el("button", "delete");
    remove.type = "button";
    remove.title = t.remove(fields.title || t.untitled);
    remove.setAttribute("aria-label", remove.title);
    remove.append(svg('<path d="M6 6l12 12M18 6 6 18"/>'));
    remove.disabled = !!item.pending;
    remove.onclick = () => deleteEvent(item);
    row.replaceChildren(tile, copy, badge, remove);
  }

  function render(state) {
    latestState = state;
    const t = T();
    const items = sortEvents(viewItems(state));
    const upcoming = items.filter((item) => (daysUntil(item.fields.target_date) ?? -1) >= 0).length;
    const past = items.filter((item) => (daysUntil(item.fields.target_date) ?? 0) < 0).length;
    $("summary").textContent = items.length ? t.summary(upcoming, past) : t.summaryEmpty;

    const next = items.find((item) => (daysUntil(item.fields.target_date) ?? -1) >= 0)
      || items.find((item) => daysUntil(item.fields.target_date) !== null)
      || items[0];
    paintHero(next);
    paintFilters(items);

    const list = $("eventList");
    $("listCard").hidden = !items.length;
    const visible = activeCategory === "All" ? items : items.filter((item) => categoryOf(item) === activeCategory);
    if (!visible.length) {
      rows.clear();
      const empty = el("div", "k-empty empty");
      empty.append(
        svg('<rect x="4" y="5.5" width="16" height="14.5" rx="1.5"/><path d="M8 3.5v4M16 3.5v4M4 10h16M12 13v3.5l2 1"/>'),
        el("b", "", items.length ? t.filterEmpty : t.emptyTitle)
      );
      if (!items.length) empty.append(el("span", "", t.emptyHint));
      list.replaceChildren(empty);
      return;
    }
    const seen = new Set();
    const ordered = visible.map((item) => {
      const key = item.id || item.tempId;
      seen.add(key);
      let row = rows.get(key);
      if (!row) {
        row = el("article", "event-row");
        rows.set(key, row);
        if (key === justAdded) {
          row.classList.add("just-added");
          setTimeout(() => row.classList.remove("just-added"), 700);
        }
      }
      fillRow(row, item, item === next);
      return row;
    });
    for (const key of [...rows.keys()]) if (!seen.has(key)) rows.delete(key);
    list.replaceChildren(...ordered);
  }

  function applyStaticText() {
    const t = T();
    document.documentElement.lang = lang() === "zh" ? "zh-CN" : "en";
    document.title = lang() === "zh" ? "日期倒数" : "Event Countdowns";
    $("appTitle").textContent = t.title;
    $("prepareLabel").textContent = t.prepare;
    prepareButton.title = t.prepare;
    $("addLabel").textContent = addPanel.hidden ? t.add : t.close;
    addToggle.title = addPanel.hidden ? t.add : t.close;
    $("saveEvent").textContent = t.save;
    $("lblTitle").textContent = t.event;
    $("lblDate").textContent = t.date;
    $("lblCategory").textContent = t.category;
    $("lblNote").textContent = t.note;
    $("titleInput").placeholder = t.titlePh;
    $("noteInput").placeholder = t.notePh;
    $("categoryInput").placeholder = t.catPh;
    $("listTitle").textContent = t.allDates;
    const cats = [...new Set((latestState.items || []).map(categoryOf))].filter((c) => c !== "—");
    $("categoryOptions").replaceChildren(...cats.map((c) => Object.assign(document.createElement("option"), { value: c })));
  }

  async function deleteEvent(item) {
    removing.add(item.id);
    render(latestState);
    let ack = null;
    try {
      ack = await oma.deleteItem(item.id);
    } catch (error) {
      ack = { ok: false, note: String(error?.message || error) };
    }
    if (!ack || ack.ok === false) {
      removing.delete(item.id);
      render(latestState);
      // The user saying no to the engine's confirm is an answer, not a failure.
      if (!/cancel/i.test(String(ack?.reason || ""))) showError(T().deleteFailed);
    }
  }

  function setPanel(open) {
    addPanel.hidden = !open;
    addToggle.setAttribute("aria-expanded", String(open));
    applyStaticText();
    if (open) $("titleInput").focus();
  }

  if (oma.standalone) document.body.classList.add("standalone");

  oma.ready((state) => { latestState = state; applyStaticText(); render(state); });
  oma.onChange((state) => { latestState = state; render(state); });
  oma.onPrefChange(() => { applyStaticText(); render(latestState); });

  addToggle.onclick = () => setPanel(addPanel.hidden);

  $("addForm").onsubmit = async (event) => {
    event.preventDefault();
    const form = event.currentTarget;
    const title = $("titleInput").value.trim();
    const target_date = $("dateInput").value;
    const category = $("categoryInput").value.trim();
    const note = $("noteInput").value.trim();
    if (!title || !localDateParts(target_date) || !category) {
      form.reportValidity();
      return;
    }
    const entry = { tempId: `pending-${Date.now()}`, group: category, position: 1e9, fields: { title, target_date, category, note } };
    pending.push(entry);
    justAdded = entry.tempId;
    activeCategory = activeCategory === "All" || activeCategory === category ? activeCategory : "All";
    form.reset();
    setPanel(false);
    render(latestState);
    let ack = null;
    try {
      ack = await oma.addItem({ group: category, fields: { title, target_date, category, note } });
    } catch (error) {
      ack = { ok: false, note: String(error?.message || error) };
    }
    if (!ack || ack.ok === false) {
      pending = pending.filter((p) => p !== entry);
      render(latestState);
      showError(T().saveFailed);
      return;
    }
    // Keep the same row element when the stored copy arrives: re-key it to the real id.
    entry.id = ack.id;
    const tempKey = entry.tempId;
    const row = rows.get(tempKey);
    if (ack.id) {
      if (row) {
        rows.delete(tempKey);
        rows.set(ack.id, row);
      }
      if (heroId === tempKey) heroId = ack.id;
      entry.tempId = ack.id;
    }
    render(latestState);
  };

  setInterval(() => render(latestState), 60000);
</script>
</body>
</html>
