<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bill Calendar</title>
<meta name="description" content="What lands next: every upcoming bill on one timeline — amount, when, paid or late at a glance — with the month grid a tap away.">
<meta name="oma-category" content="Money">
<style>
  /* Shared primitives (.k-*) — this app's own copy; nothing here comes from the engine. */
  :root{--k-accent:var(--color-text-info,var(--color-ring-primary,#3b6cf6));--k-bad:var(--color-text-danger,#e5484d);--k-ink-4:color-mix(in oklab,var(--color-text-primary) 4%,transparent);--k-t-fast:120ms;--k-t:180ms;--k-t-slow:260ms;--k-ease:cubic-bezier(.2,.8,.3,1);--k-spring:cubic-bezier(.34,1.56,.64,1);--k-surface:var(--color-background-primary)}
  @media (prefers-reduced-motion:reduce){:root{--k-t-fast:0ms;--k-t:0ms;--k-t-slow:0ms}}
  .k-btn{display:inline-flex;align-items:center;gap:6px;border:1px solid transparent;border-radius:var(--border-radius-md,10px);padding:6px 12px;font:inherit;font-size:var(--font-text-sm-size,12.5px);font-weight:600;cursor:pointer;background:var(--color-background-inverse);color:var(--color-text-inverse);transition:transform var(--k-t-fast) var(--k-ease),opacity var(--k-t-fast),background var(--k-t-fast)}
  .k-btn:hover{opacity:.9}
  .k-btn:active{transform:scale(.96)}
  .k-btn:disabled{opacity:.45;cursor:default;transform:none}
  .k-btn.sec{background:transparent;color:var(--color-text-primary);border-color:var(--color-border-primary)}
  .k-btn.ghost{background:transparent;color:var(--color-text-secondary)}
  :is(.k-btn.sec,.k-btn.ghost):hover{background:var(--k-ink-4);color:var(--color-text-primary);opacity:1}
  .k-btn.danger{background:transparent;color:var(--k-bad);border-color:color-mix(in oklab,var(--k-bad) 30%,transparent)}
  .k-btn.danger:hover{background:color-mix(in oklab,var(--k-bad) 10%,transparent);opacity:1}
  :is(.k-btn,.k-tab,.k-chip,.k-switch,.k-field):focus-visible{outline:2px solid var(--color-ring-primary,var(--k-accent));outline-offset:1px}
  .k-tabs{display:inline-flex;gap:2px;padding:3px;background:var(--color-background-secondary);border-radius:var(--border-radius-md,10px)}
  .k-tab{display:inline-flex;align-items:center;gap:6px;border:none;background:transparent;color:var(--color-text-secondary);cursor:pointer;font:inherit;font-size:var(--font-text-sm-size,12.5px);font-weight:550;padding:5px 12px;border-radius:var(--border-radius-sm,7px);transition:background var(--k-t) var(--k-ease),color var(--k-t)}
  .k-tab.on{background:var(--color-background-primary);color:var(--color-text-primary);box-shadow:var(--shadow-sm)}
  .k-switch{appearance:none;width:34px;height:20px;margin:0;position:relative;border-radius:999px;background:var(--color-background-tertiary);border:1px solid var(--color-border-primary);cursor:pointer;transition:background var(--k-t) var(--k-ease),border-color var(--k-t)}
  .k-switch::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--color-background-primary);box-shadow:var(--shadow-sm);transition:translate var(--k-t) var(--k-spring)}
  .k-switch:checked{background:var(--k-accent);border-color:var(--k-accent)}
  .k-switch:checked::after{translate:14px 0}
  .k-field{padding:6px 10px;border-radius:var(--border-radius-md,10px);border:1px solid var(--color-border-primary);background:transparent;color:inherit;font:inherit;font-size:var(--font-text-sm-size,12.5px);transition:border-color var(--k-t-fast),box-shadow var(--k-t-fast)}
  .k-field::placeholder{color:var(--color-text-tertiary)}
  .k-field:focus{outline:none;border-color:var(--k-accent);box-shadow:0 0 0 3px color-mix(in oklab,var(--k-accent) 10%,transparent)}
  .k-appbar{display:flex;align-items:center;gap:11px;padding:13px 16px}
  .k-appbar .k-appmark{display:grid;width:34px;height:34px;flex:none;place-items:center;border-radius:11px}
  .k-appbar .k-appmark svg{width:18px;height:18px}
  .k-appbar .k-appcopy{min-width:0;flex:1}
  .k-appbar .k-eyebrow{display:block;margin:0;color:var(--color-text-tertiary);font-size:9.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
  .k-appbar h1{margin:1px 0 0;font-size:15px;font-weight:650;letter-spacing:-.015em}
  body:not(.standalone) .k-appbar{border-bottom:1px solid var(--color-border-secondary);background:var(--k-surface)}
  @keyframes k-in{from{opacity:0;translate:0 6px}}
  .k-stage{max-width:1120px;margin-inline:auto;overflow-x:clip}

  /* The signature is THE TIMELINE: one rail of beads, overdue above the "Today" mark, the next
     30 days below it. A bead IS the pay button — filling it is the app's one moment. The hero
     number, the horizon strip and the rail are painted from ONE model() pass, so no figure on
     this page can disagree with a row. The month grid is the secondary view. */
  .bc {
    --bc-accent: light-dark(#0a7a5f, #3fcb9f);
    --bc-on-accent: light-dark(#ffffff, #03261b);
    --bc-tint: color-mix(in oklab, var(--bc-accent) 13%, transparent);
    --bc-late: var(--color-text-danger, #d93f3f);
    --bc-late-tint: color-mix(in oklab, var(--bc-late) 11%, transparent);
    --bc-rail: var(--color-border-primary);
    --k-accent: var(--bc-accent);
    --when: 46px;
    --bead: 26px;
    position: relative;
  }
  button, input, select { font: inherit; color: inherit; }

  /* ── app bar: mark · name · the AI hand-off · the one primary action ── */
  .bc-mark { background: var(--bc-tint); color: var(--bc-accent); }
  .bc-mark svg { fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; }
  .bc-mark .f { fill: currentColor; }
  .bc-bar .k-btn svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .bc-bar .acts { display: flex; gap: 8px; flex: none; }
  .k-btn.primary { background: var(--bc-accent); color: var(--bc-on-accent); }

  .error-strip {
    margin: 10px 20px 0; padding: 8px 10px;
    border: 1px solid color-mix(in oklab, var(--bc-late) 32%, var(--color-border-secondary));
    border-radius: var(--border-radius-md, 10px);
    background: var(--bc-late-tint); color: var(--bc-late); font-size: 12px;
  }

  /* ── hero: the one number + the horizon it is made of ── */
  .hero {
    display: grid; grid-template-columns: fit-content(360px) minmax(0, 1fr);
    gap: 8px 28px; align-items: end; padding: 18px 20px 14px;
  }
  .hero-label { margin: 0; color: var(--color-text-secondary); font-size: 12.5px; font-weight: 600; }
  .hero-num {
    margin: 2px 0 4px; font-size: clamp(32px, 6vw, 42px); font-weight: 740; line-height: 1.05;
    letter-spacing: -.035em; font-variant-numeric: tabular-nums;
  }
  .hero-sub { margin: 0; color: var(--color-text-secondary); font-size: 12.5px; line-height: 1.45; }
  .hero-sub .late { color: var(--bc-late); font-weight: 650; }

  /* The horizon: 30 days as a line, each bill a bead sized by amount. A picture of WHEN money
     leaves — the bunching a list can't show. Pure content, not interactive. */
  .horizon { position: relative; height: 100px; }
  .hz-base { position: absolute; left: 0; right: 0; bottom: 30px; height: 1.5px; background: var(--bc-rail); border-radius: 1px; }
  .hz-tick { position: absolute; bottom: 25px; width: 1.5px; height: 11px; background: var(--bc-rail); }
  .hz-tick.now { background: var(--bc-accent); height: 40px; bottom: 25px; border-radius: 1px; }
  .hz-lab {
    position: absolute; bottom: 0; transform: translateX(-50%); white-space: nowrap;
    color: var(--color-text-tertiary); font-size: 10.5px; font-weight: 550; font-variant-numeric: tabular-nums;
  }
  .hz-lab.now { color: var(--bc-accent); font-weight: 700; transform: none; }
  .hz-lab.late { color: var(--bc-late); transform: none; left: 0; }
  .hz-dot {
    position: absolute; transform: translateX(-50%); border-radius: 50%;
    border: 1.5px solid var(--bc-accent); background: color-mix(in oklab, var(--bc-accent) 16%, var(--color-background-primary));
  }
  .hz-dot.projected { border-style: dashed; background: var(--color-background-primary); }
  .hz-dot.overdue { border-color: var(--bc-late); background: color-mix(in oklab, var(--bc-late) 16%, var(--color-background-primary)); }
  .hz-dot.paid { background: var(--bc-accent); border-color: var(--bc-accent); opacity: .5; }

  /* ── view switch ── */
  .views { display: flex; align-items: center; gap: 12px; padding: 4px 20px 10px; }
  .views .note { margin-left: auto; color: var(--color-text-tertiary); font-size: 12px; text-align: right; }

  /* ── the timeline ── */
  .scroll { max-height: 452px; overflow: hidden auto; overscroll-behavior: contain; border-top: 1px solid var(--color-border-secondary); }
  .tl { list-style: none; margin: 0; padding: 6px 20px 14px; }
  .tl > li {
    position: relative; display: grid; grid-template-columns: var(--when) var(--bead) minmax(0, 1fr) auto;
    column-gap: 12px; align-items: center;
  }
  /* the rail runs through the bead column of every line, separators included */
  .tl > li::before {
    content: ""; position: absolute; top: 0; bottom: 0; width: 1.5px; background: var(--bc-rail);
    left: calc(var(--when) + 12px + var(--bead) / 2 - .75px);
  }
  .tl > li:first-child::before { top: 50%; }
  .tl > li:last-child::before { bottom: 50%; }
  .tl > li:only-child::before { display: none; }

  .sep { min-height: 36px; }
  .sep .mark { grid-column: 2; justify-self: center; position: relative; width: 9px; height: 9px; border-radius: 50%; background: var(--bc-rail); }
  .sep .lab { grid-column: 3 / -1; display: flex; align-items: center; gap: 10px; color: var(--color-text-secondary); font-size: 12px; font-weight: 650; }
  .sep .lab::after { content: ""; flex: 1; height: 1px; background: var(--color-border-secondary); }
  .sep.today .mark { background: var(--bc-accent); box-shadow: 0 0 0 4px var(--bc-tint); }
  .sep.today .lab { color: var(--bc-accent); }
  .sep.quiet .lab { color: var(--color-text-tertiary); font-weight: 500; }
  .sep.quiet .lab::after { display: none; }

  .bill { padding: 7px 0; }
  .when { align-self: start; padding-top: 4px; text-align: right; line-height: 1.1; }
  .when b { display: block; font-size: 19px; font-weight: 720; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
  .when span { color: var(--color-text-tertiary); font-size: 11px; font-weight: 550; }
  .bill.overdue .when { color: var(--bc-late); }
  .bill.overdue .when span { color: inherit; opacity: .8; }

  .bead {
    position: relative; z-index: 1; display: grid; place-items: center; width: var(--bead); height: var(--bead);
    padding: 0; border-radius: 50%; cursor: pointer;
    border: 1.75px solid var(--bc-accent); background: var(--color-background-primary); color: var(--bc-accent);
    transition: background var(--k-t) var(--k-ease), border-color var(--k-t), color var(--k-t);
  }
  .bead svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .bead .tick { stroke-dasharray: 16; stroke-dashoffset: 16; opacity: 0; }
  .bead:hover .tick { opacity: .45; stroke-dashoffset: 0; }
  .bill.projected .bead { border-style: dashed; }
  .bill.overdue .bead { border-color: var(--bc-late); color: var(--bc-late); background: color-mix(in oklab, var(--bc-late) 11%, var(--color-background-primary)); }
  .bill.paid .bead { background: var(--bc-accent); border-color: var(--bc-accent); border-style: solid; color: var(--bc-on-accent); }
  .bill.paid .bead .tick { opacity: 1; stroke-dashoffset: 0; }
  .bead:focus-visible, .body:focus-visible { outline: 2px solid var(--color-ring-primary, var(--bc-accent)); outline-offset: 2px; }
  .bead:disabled { cursor: progress; }

  .body { min-width: 0; padding: 2px 0; border: 0; background: none; text-align: left; cursor: pointer; }
  .name {
    display: block; font-size: 14px; font-weight: 620; line-height: 1.3; overflow-wrap: anywhere;
    text-decoration: line-through; text-decoration-color: transparent; text-decoration-thickness: 1.5px;
    transition: text-decoration-color var(--k-t-slow) var(--k-ease), color var(--k-t-slow);
  }
  .meta { display: block; margin-top: 2px; color: var(--color-text-tertiary); font-size: 12px; line-height: 1.35; }
  .meta .rel { color: var(--color-text-secondary); font-weight: 600; }
  .bill.overdue .meta .rel { color: var(--bc-late); }
  .bill.projected .name { color: var(--color-text-secondary); font-weight: 560; }
  .amt { justify-self: end; font-size: 14px; font-weight: 650; font-variant-numeric: tabular-nums; white-space: nowrap; transition: color var(--k-t-slow); }
  .bill.projected .amt { color: var(--color-text-secondary); font-weight: 550; }
  .bill.paid .name { color: var(--color-text-tertiary); text-decoration-color: currentColor; }
  .bill.paid .amt { color: var(--color-text-tertiary); }

  .detail {
    grid-column: 3 / -1; margin: 8px 0 4px; padding: 10px 12px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 18px;
    border: 1px solid var(--color-border-secondary); border-radius: var(--border-radius-md, 10px);
    background: var(--color-background-secondary); font-size: 12px; color: var(--color-text-secondary);
  }
  .detail b { color: var(--color-text-primary); font-weight: 600; }
  .detail .k-btn { margin-left: auto; }
  .detail p { margin: 0; flex-basis: 100%; }

  /* ── paid recently: the record, quietly ── */
  .paid-sec { padding: 12px 20px 16px; border-top: 1px solid var(--color-border-secondary); }
  .paid-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; margin: 0 0 8px; }
  .paid-head h2 { margin: 0; font-size: 13px; font-weight: 650; }
  .paid-head span { color: var(--color-text-tertiary); font-size: 12px; }
  .paid-head .rate { color: var(--bc-accent); font-weight: 650; }
  .paid-list { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 6px 18px; }
  .paid-list li { display: grid; grid-template-columns: 16px minmax(0, 1fr) auto; gap: 8px; align-items: baseline; font-size: 12.5px; }
  .paid-list li i { width: 9px; height: 9px; border-radius: 50%; background: var(--bc-accent); align-self: center; }
  .paid-list li.late i { background: none; border: 1.5px solid var(--bc-late); }
  .paid-list .pn { overflow-wrap: anywhere; }
  .paid-list .pd { color: var(--color-text-tertiary); font-size: 11.5px; white-space: nowrap; }

  /* ── month view (secondary) ── */
  .mv-head { display: flex; align-items: center; gap: 6px; padding: 10px 20px; border-top: 1px solid var(--color-border-secondary); }
  .mv-head h2 { margin: 0 6px; font-size: 15px; font-weight: 680; min-width: 0; }
  .mv-head .sum { margin-left: auto; color: var(--color-text-secondary); font-size: 12px; text-align: right; }
  .nav { display: grid; place-items: center; width: 28px; height: 28px; padding: 0; border: 1px solid var(--color-border-secondary); border-radius: var(--border-radius-sm, 7px); background: none; cursor: pointer; }
  .nav svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border-top: 1px solid var(--color-border-secondary); }
  .wd { padding: 6px 8px; color: var(--color-text-tertiary); font-size: 11px; font-weight: 600; border-bottom: 1px solid var(--color-border-secondary); }
  .cell {
    min-width: 0; min-height: 74px; padding: 5px 6px 7px; display: flex; flex-direction: column; gap: 3px;
    border: 0; border-right: 1px solid var(--color-border-secondary); border-bottom: 1px solid var(--color-border-secondary);
    background: none; text-align: left; cursor: pointer;
  }
  .cell:nth-child(7n) { border-right: 0; }
  .cell.out { color: var(--color-text-tertiary); background: color-mix(in oklab, var(--color-background-secondary) 60%, transparent); }
  .cell.sel { box-shadow: inset 0 0 0 2px var(--bc-accent); }
  .cell .dn { font-size: 12px; font-weight: 650; font-variant-numeric: tabular-nums; width: 22px; height: 22px; display: grid; place-items: center; border-radius: 50%; }
  .cell.today .dn { background: var(--bc-accent); color: var(--bc-on-accent); }
  .cb { display: grid; grid-template-columns: 7px minmax(0, 1fr); gap: 2px 5px; align-items: baseline; font-size: 11px; line-height: 1.25; }
  .cb i { width: 7px; height: 7px; border-radius: 50%; border: 1.5px solid var(--bc-accent); align-self: center; }
  .cb.overdue i { border-color: var(--bc-late); background: var(--bc-late); }
  .cb.paid i { background: var(--bc-accent); }
  .cb.projected i { border-style: dashed; }
  .cb .cn { overflow-wrap: anywhere; font-weight: 560; }
  .cb .ca { grid-column: 2; color: var(--color-text-tertiary); font-size: 10.5px; font-variant-numeric: tabular-nums; }
  .cb.paid .cn { color: var(--color-text-tertiary); text-decoration: line-through; }
  .dots { display: none; flex-wrap: wrap; gap: 3px; }
  .dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--bc-accent); }
  .dots i.overdue { background: var(--bc-late); }
  .dots i.upcoming, .dots i.projected { background: none; border: 1.5px solid var(--bc-accent); }
  .mv-day { border-top: 1px solid var(--color-border-secondary); }

  /* ── add form ── */
  .composer { margin: 0 20px 12px; padding: 12px; border: 1px solid var(--color-border-secondary); border-radius: var(--border-radius-lg, 14px); background: var(--color-background-secondary); }
  .form { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr) 70px minmax(0, 1.4fr) minmax(0, 1.2fr); gap: 8px 10px; align-items: end; }
  .fl { display: grid; gap: 4px; min-width: 0; font-size: 11.5px; font-weight: 600; color: var(--color-text-secondary); }
  .fl .k-field { width: 100%; min-height: 34px; background: var(--color-background-primary); color: var(--color-text-primary); font-weight: 400; }
  .form-foot { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .form-foot label { display: inline-flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--color-text-secondary); }
  .form-foot .err { color: var(--bc-late); font-size: 12px; }
  .form-foot .sp { margin-left: auto; display: flex; gap: 8px; }

  /* ── empty ── */
  .empty { display: grid; justify-items: center; gap: 8px; padding: 28px 20px 30px; text-align: center; }
  .empty svg { width: 132px; height: 72px; fill: none; stroke: var(--bc-accent); stroke-width: 1.6; stroke-linecap: round; }
  .empty svg .soft { stroke: var(--bc-rail); }
  .empty h2 { margin: 4px 0 0; font-size: 17px; font-weight: 680; }
  .empty p { margin: 0; max-width: 380px; color: var(--color-text-secondary); font-size: 13px; line-height: 1.5; }
  .empty q { color: var(--color-text-primary); font-weight: 560; }

  .compact .bill { padding: 3px 0; }
  .compact .hero { padding-top: 12px; }

  @media (prefers-reduced-motion: no-preference) {
    .bill.pop .bead { animation: bead-pop 520ms var(--k-spring); }
    .bill.pop .bead::after {
      content: ""; position: absolute; inset: -2px; border-radius: 50%;
      border: 2px solid var(--bc-accent); animation: ring 620ms var(--k-ease) forwards;
    }
    .bill.pop .bead .tick { transition: stroke-dashoffset 280ms var(--k-ease) 90ms, opacity 0ms; }
    .bill.pop .amt { animation: amt-out 520ms var(--k-ease); }
    .bill.is-new { animation: k-in var(--k-t-slow) var(--k-ease) backwards; }
    .hz-dot { transition: background var(--k-t-slow), border-color var(--k-t-slow), opacity var(--k-t-slow); }
    .hz-dot.pop { animation: bead-pop 520ms var(--k-spring); }
    @keyframes bead-pop { 0% { scale: 1; } 35% { scale: .82; } 70% { scale: 1.16; } 100% { scale: 1; } }
    @keyframes ring { from { opacity: .7; scale: 1; } to { opacity: 0; scale: 1.9; } }
    @keyframes amt-out { 40% { translate: 0 -3px; } }
  }

  @media (max-width: 560px) {
    .bc { --when: 34px; --bead: 24px; }
    .bc-bar .ask span { display: none; }
    .hero { grid-template-columns: minmax(0, 1fr); padding: 16px 16px 6px; }
    .horizon { height: 74px; }
    .views { padding: 4px 16px 10px; }
    .tl { padding: 4px 14px 12px 8px; }
    .tl > li { column-gap: 10px; }
    .tl > li::before { left: calc(var(--when) + 10px + var(--bead) / 2 - .75px); }
    .when b { font-size: 17px; }
    .paid-sec, .mv-head { padding-left: 16px; padding-right: 16px; }
    .mv-head { flex-wrap: wrap; }
    .mv-head .sum { flex-basis: 100%; margin-left: 0; text-align: left; }
    .cell { min-height: 46px; align-items: center; padding: 4px 2px 6px; }
    .cb { display: none; }
    .dots { display: flex; justify-content: center; }
    .composer { margin: 0 12px 12px; }
    .form { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
    .form .fl.name, .form .fl.date { grid-column: 1 / -1; }
    .form .fl.cur { grid-column: 2; }
  }
</style>
</head>
<body>
<main id="app" class="bc k-stage">
  <header class="bc-bar k-appbar">
    <span class="bc-mark k-appmark" aria-hidden="true">

<script type="module">
  const $ = (id) => document.getElementById(id);
  const HORIZON = 30;

  const STR = {
    en: {
      app: "Bill calendar", ask: "Summarize", askAria: "Summarize what’s due with AI", add: "Add bill",
      heroLabel: "Due in the next 30 days", heroClear: "All clear",
      billsOne: "1 bill", billsMany: "{n} bills", lateBit: "{amount} overdue", expectedBit: "{n} expected from repeating bills",
      autopayBit: "{n} on autopay", nothingAhead: "Nothing due in the next 30 days.",
      tabNext: "Next up", tabMonth: "Month", noteNext: "Tap a circle to mark it paid",
      todaySep: "Today · {date}", noneAhead: "Nothing else lands in the next 30 days.", noDateSep: "No due date",
      lateOne: "1 day late", lateMany: "{n} days late", dueToday: "Due today", tomorrow: "Tomorrow", inDays: "In {n} days",
      expected: "expected", autopay: "Autopay", paidOn: "Paid {date}", paid: "Paid", noDate: "No date", hzLate: "Late", hzToday: "Today",
      monthly: "Monthly", weekly: "Weekly", biweekly: "Every 2 weeks", quarterly: "Quarterly", annual: "Yearly", "one-off": "One-off",
      markPaid: "Mark {name} paid", markUnpaid: "Mark {name} unpaid",
      due: "Due", repeats: "Repeats", on: "On", off: "Off", notYet: "Not yet", del: "Delete",
      projectedNote: "Expected: {name} repeats {freq}, last due {date}. Mark it paid to log this one.",
      paidTitle: "Paid recently", rate: "{a} of {b} on time", rateTail: "· last 90 days",
      monthSum: "{total} this month · {paid} paid", monthEmpty: "No bills this month", today: "Today", prev: "Previous month", next: "Next month",
      dayEmpty: "Nothing due {date}.",
      fName: "Bill", fNamePh: "Electricity", fAmount: "Amount", fCur: "Currency", fDue: "Due", fFreq: "Repeats", fAuto: "Autopay",
      cancel: "Cancel", save: "Save bill", formErr: "Add a name, an amount and a due date.",
      emptyTitle: "No bills yet",
      emptyBody: "Add one here, or tell the AI: <q>Add my rent, phone and internet bills to bill calendar.</q>",
      summarizePrompt: "Summarize what's due from my bill calendar and flag anything unusual, such as a high amount, duplicate-looking charge, missed payment, or bills bunching together. Upcoming: {upcoming}. Overdue: {overdue}.",
      none: "none", unnamed: "Unnamed bill", saveFailed: "Couldn’t save that — try again.", askFailed: "Couldn’t reach the assistant — try again.",
    },
    zh: {
      app: "账单日历", ask: "让 AI 总结", askAria: "让 AI 总结近期账单", add: "添加账单",
      heroLabel: "未来 30 天要付", heroClear: "暂无待付",
      billsOne: "1 笔账单", billsMany: "{n} 笔账单", lateBit: "{amount} 已逾期", expectedBit: "{n} 笔为预计",
      autopayBit: "{n} 笔自动扣款", nothingAhead: "未来 30 天没有要付的账单。",
      tabNext: "接下来", tabMonth: "月历", noteNext: "点圆圈即标为已付",
      todaySep: "今天 · {date}", noneAhead: "未来 30 天没有其他账单。", noDateSep: "未填到期日",
      lateOne: "逾期 1 天", lateMany: "逾期 {n} 天", dueToday: "今天到期", tomorrow: "明天", inDays: "{n} 天后",
      expected: "预计", autopay: "自动扣款", paidOn: "{date} 已付", paid: "已付", noDate: "无日期", hzLate: "逾期", hzToday: "今天",
      monthly: "每月", weekly: "每周", biweekly: "每两周", quarterly: "每季度", annual: "每年", "one-off": "一次性",
      markPaid: "把「{name}」标为已付", markUnpaid: "把「{name}」标为未付",
      due: "到期", repeats: "周期", on: "开", off: "关", notYet: "未付", del: "删除",
      projectedNote: "预计：{name}{freq}一次，上次到期 {date}。标为已付即记下这一笔。",
      paidTitle: "最近已付", rate: "{b} 笔中 {a} 笔按时", rateTail: "· 近 90 天",
      monthSum: "本月 {total} · 已付 {paid}", monthEmpty: "本月没有账单", today: "今天", prev: "上个月", next: "下个月",
      dayEmpty: "{date} 没有账单。",
      fName: "账单", fNamePh: "电费", fAmount: "金额", fCur: "币种", fDue: "到期日", fFreq: "周期", fAuto: "自动扣款",
      cancel: "取消", save: "保存账单", formErr: "请填写名称、金额和到期日。",
      emptyTitle: "还没有账单",
      emptyBody: "在这里添加，或者对 AI 说：<q>把房租、话费和宽带加到账单日历。</q>",
      summarizePrompt: "请总结我的账单日历，并标记异常情况，例如金额过高、疑似重复、漏付或多笔账单集中到期。待支付：{upcoming}。已逾期：{overdue}。",
      none: "无", unnamed: "未命名账单", saveFailed: "没能保存，请重试。", askFailed: "没能联系上助手，请重试。",
    },
  };
  const FREQS = ["monthly", "weekly", "biweekly", "quarterly", "annual", "one-off"];

  // ── locale + formatting ───────────────────────────────────────────────────────────────────
  const locale = () => { const p = oma.pref("locale", "auto"); return p === "auto" ? navigator.language : p; };
  const lang = () => (String(locale()).toLowerCase().startsWith("zh") ? "zh" : "en");
  const t = (key, vars = {}) => {
    let s = STR[lang()][key] ?? STR.en[key] ?? key;
    for (const [k, v] of Object.entries(vars)) s = s.replaceAll(`{${k}}`, String(v));
    return s;
  };
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  const fmt = (d, o) => new Intl.DateTimeFormat(locale(), o).format(d);
  const shortDate = (d) => fmt(d, { month: "short", day: "numeric" });
  const fullDate = (d) => {
    const p = oma.pref("date_format", "auto"), dd = pad(d.getDate()), mm = pad(d.getMonth() + 1), y = d.getFullYear();
    if (p === "yyyy-mm-dd") return `${y}-${mm}-${dd}`;
    if (p === "dd/mm/yyyy") return `${dd}/${mm}/${y}`;
    if (p === "mm/dd/yyyy") return `${mm}/${dd}/${y}`;
    return fmt(d, { weekday: "short", month: "short", day: "numeric", year: "numeric" });
  };
  const curOf = (v) => String(v || oma.pref("currency", "USD")).trim().toUpperCase().slice(0, 3) || "USD";
  const money = (n, cur, compact = false) => {
    try {
      const big = compact && n >= 10000;
      return new Intl.NumberFormat(locale(), { style: "currency", currency: cur, notation: big ? "compact" : "standard", maximumFractionDigits: big ? 1 : 2 }).format(n);
    } catch { return `${cur} ${n.toFixed(2)}`; }
  };
  const sums = (bills) => {
    const m = new Map();
    for (const b of bills) m.set(b.cur, (m.get(b.cur) || 0) + b.amount);
    return m;
  };
  const total = (bills) => {
    const m = sums(bills);
    if (!m.size) return money(0, curOf());
    return [...m].map(([c, n]) => money(n, c)).join(" + ");
  };

  // ── time: store the fact, derive the judgment (see the guide's Time chapter) ────────────
  const pad = (n) => String(n).padStart(2, "0");
  const dateOnly = (iso) => { const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(iso || "")); return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null; };
  const today = () => { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); };
  const keyOf = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const shift = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
  const daysBetween = (a, b) => Math.round((b - a) / 86400000);
  const addMonths = (d, n, dom) => { const last = new Date(d.getFullYear(), d.getMonth() + n + 1, 0).getDate(); return new Date(d.getFullYear(), d.getMonth() + n, Math.min(dom, last)); };
  const normFreq = (v) => {
    const s = String(v || "").trim().toLowerCase();
    if (/^(annual|annually|yearly)$/.test(s)) return "annual";
    if (/^(bi-?weekly|fortnightly)$/.test(s)) return "biweekly";
    if (!s || /^(once|one[- ]?(off|time))$/.test(s)) return "one-off";
    return s;
  };
  const freqLabel = (f) => (STR.en[f] ? t(f) : f);
  const stepOf = (freq, dom) => ({
    weekly: (d) => shift(d, 7), biweekly: (d) => shift(d, 14),
    monthly: (d) => addMonths(d, 1, dom), quarterly: (d) => addMonths(d, 3, dom), annual: (d) => addMonths(d, 12, dom),
  })[freq];

  // ── state that outlives a render ────────────────────────────────────────────────────────────
  let latest = { items: [] };
  let tab = "next";
  let viewMonth = null;              // first of the month shown in the Month view
  let selDay = "";                   // Month view: the selected day key
  let openKey = "";                  // the one row whose detail is open
  let composerOpen = false;
  // Optimistic overlay: the bead answers the finger NOW; an entry is dropped once the store's own
  // snapshot carries the write (or the write is refused). Keyed by row id (or projection id).
  const overlay = new Map();         // id → { paid, paidKey, acked }
  const busy = new Set();
  const stayed = new Set();          // rows paid this session: they stay where the finger found them
  const alias = new Map();           // real id → projection id it materialised (keeps its DOM row)
  const rk = (b) => alias.get(b.id) || b.id;

  // An acked entry waits for a snapshot at or past its ack's seq: a snapshot fetched BETWEEN the
  // two writes of a toggle can land after the ack, and must not flip the bead back.
  function reconcile(state) {
    for (const [id, o] of overlay) {
      const it = state.items.find((x) => x.id === id);
      if ((it && (it.group === "paid") === o.paid) || (o.acked && Number(state.version) >= o.seq)) overlay.delete(id);
    }
  }

  // ONE pass from the rows to everything the page shows.
  function model(state) {
    const now = today(), until = shift(now, HORIZON);
    const bills = [], undated = [];
    for (const it of state.items) {
      const f = it.fields || {};
      const o = overlay.get(it.id);
      const due = dateOnly(f.due_date);
      const paid = o ? o.paid : it.group === "paid";
      const b = {
        id: it.id, f, pos: Number(it.position) || 0, projected: false,
        name: String(f.name ?? "").trim() || t("unnamed"),
        amount: Math.max(0, Number(f.amount) || 0), cur: curOf(f.currency),
        freq: normFreq(f.frequency), autopay: f.autopay === true || f.autopay === "true",
        due, key: due ? keyOf(due) : "", paid, paidKey: o ? o.paidKey : String(f.paid_date || "").slice(0, 10),
      };
      // Stored groups upcoming/overdue go stale with the clock; only "paid" is a fact.
      b.status = paid ? "paid" : due && due < now ? "overdue" : "upcoming";
      (due ? bills : undated).push(b);
    }
    // Recurrence is DERIVED: each series' latest row + its frequency says what comes next.
    const series = new Map();
    for (const b of bills) {
      const s = b.name.toLowerCase() + "|" + b.cur;
      const l = series.get(s);
      if (!l || b.key > l.key || (b.key === l.key && b.pos > l.pos)) series.set(s, b);
    }
    const monthEnd = viewMonth ? new Date(viewMonth.getFullYear(), viewMonth.getMonth() + 1, 0) : until;
    const limit = new Date(Math.min(Math.max(until, monthEnd), shift(now, 400)));
    const projected = [];
    for (const [s, l] of series) {
      const step = stepOf(l.freq, l.due.getDate());
      if (!step) continue;
      for (let d = step(l.due), n = 0; d <= limit && n < 60; d = step(d), n++) {
        if (d < now) continue;
        const id = "p:" + s + ":" + keyOf(d), o = overlay.get(id);
        projected.push({ ...l, id, due: d, key: keyOf(d), projected: true, paid: !!o?.paid, paidKey: o?.paidKey || "", status: o?.paid ? "paid" : "upcoming", from: l });
      }
    }
    const byDue = (a, b) => a.key.localeCompare(b.key) || a.pos - b.pos || a.name.localeCompare(b.name);
    const all = [...bills, ...projected].sort(byDue);
    const late = bills.filter((b) => b.due < now && (!b.paid || stayed.has(rk(b)))).sort(byDue);
    const ahead = all.filter((b) => b.due >= now && b.due <= until);
    const owing = [...late, ...ahead].filter((b) => !b.paid);
    // the record: real bills due in the last 90 days that have a verdict
    const from = shift(now, -90);
    const judged = bills.filter((b) => b.due >= from && b.due < now && (!b.paid || b.paidKey));
    const onTime = judged.filter((b) => b.paid && b.paidKey <= b.key).length;
    const recent = bills.filter((b) => b.paid && b.due < now && !stayed.has(rk(b)))
      .sort((a, b) => (b.paidKey || b.key).localeCompare(a.paidKey || a.key)).slice(0, 6);
    return { now, until, bills, undated, all, late, ahead, owing, judged: judged.length, onTime, recent,
      lateOwing: owing.filter((b) => b.status === "overdue"), expected: owing.filter((b) => b.projected) };
  }

  // ── hero ──────────────────────────────────────────────────────────────────────────────────
  let shownTotal = null, tween = 0;
  const motion = () => matchMedia("(prefers-reduced-motion: no-preference)").matches;
  function paintHero(m) {
    $("heroLabel").textContent = t("heroLabel");
    const el = $("heroNum"), s = sums(m.owing);
    if (s.size === 1) {
      const [[cur, n]] = s;
      const from = shownTotal && shownTotal.cur === cur ? shownTotal.n : null;
      shownTotal = { cur, n };
      cancelAnimationFrame(tween);
      if (from == null || from === n || !motion()) el.textContent = money(n, cur);
      else {
        const t0 = performance.now(), dur = 520;
        const tick = (ts) => {
          const p = Math.min(1, (ts - t0) / dur), e = 1 - Math.pow(1 - p, 3);
          el.textContent = money(from + (n - from) * e, cur);
          if (p < 1) tween = requestAnimationFrame(tick);
        };
        tween = requestAnimationFrame(tick);
      }
    } else {
      shownTotal = null;
      el.textContent = s.size ? total(m.owing) : t("heroClear");
    }
    const bits = [];
    if (m.owing.length) bits.push(esc(m.owing.length === 1 ? t("billsOne") : t("billsMany", { n: m.owing.length })));
    else bits.push(esc(t("nothingAhead")));
    if (m.lateOwing.length) bits.push(`<span class="late">${esc(t("lateBit", { amount: total(m.lateOwing) }))}</span>`);
    const auto = m.owing.filter((b) => b.autopay).length;
    if (auto) bits.push(esc(t("autopayBit", { n: auto })));
    if (m.expected.length) bits.push(esc(t("expectedBit", { n: m.expected.length })));
    $("heroSub").innerHTML = bits.join(" · ");
  }

  // The horizon strip: late zone | today | 30 days. Dots keyed so a paid dot can pop in place.
  const hzDots = new Map();
  function paintHorizon(m) {
    const box = $("horizon");
    const LATE = m.late.length ? 9 : 0, X0 = LATE ? 13 : 1, X1 = 98;
    const xOf = (b) => b.due < m.now ? LATE / 2 : X0 + (daysBetween(m.now, b.due) / HORIZON) * (X1 - X0);
    const shown = [...m.late, ...m.ahead];
    const max = Math.max(1, ...shown.map((b) => b.amount));
    let frame = box.querySelector(".frame");
    const sig = `${lang()}|${keyOf(m.now)}|${LATE}`;
    if (!frame || frame.dataset.sig !== sig) {
      box.textContent = "";
      hzDots.clear();
      frame = document.createElement("div");
      frame.className = "frame";
      frame.dataset.sig = sig;
      let html = `<div class="hz-base"></div><div class="hz-tick now" style="left:${X0}%"></div><span class="hz-lab now" style="left:${X0}%">${esc(t("hzToday"))}</span>`;
      if (LATE) html += `<span class="hz-lab late">${esc(t("hzLate"))}</span>`;
      for (let d = 7; d <= HORIZON; d += 7) {
        const x = X0 + (d / HORIZON) * (X1 - X0);
        html += `<div class="hz-tick" style="left:${x}%"></div><span class="hz-lab" style="left:${x}%">${esc(shortDate(shift(m.now, d)))}</span>`;
      }
      frame.innerHTML = html;
      box.appendChild(frame);
    }
    const stack = new Map(), seen = new Set();
    for (const b of shown) {
      const k = rk(b), size = Math.round(9 + 21 * Math.sqrt(b.amount / max));
      const slot = b.due < m.now ? "late" : b.key;
      const below = stack.get(slot) || 0;
      stack.set(slot, below + size * 0.72);
      let dot = hzDots.get(k);
      if (!dot) { dot = document.createElement("i"); hzDots.set(k, dot); frame.appendChild(dot); }
      dot.className = `hz-dot ${b.status}${b.projected ? " projected" : ""}`;
      dot.style.cssText = `left:${xOf(b)}%;bottom:${30.75 - size / 2 + below}px;width:${size}px;height:${size}px;z-index:${10 - Math.round(below / 8)}`;
      seen.add(k);
    }
    for (const [k, dot] of hzDots) if (!seen.has(k)) { dot.remove(); hzDots.delete(k); }
  }

  // ── rows: built once per key, painted in place ───────────────────────────────────────────
  const TICK = '<svg viewBox="0 0 24 24" aria-hidden="true"><path class="tick" d="M6.5 12.5l3.6 3.6 7.4-8"/></svg>';
  let initialKeys = null;
  function makeRow(k) {
    const li = document.createElement("li");
    li.className = "bill";
    li.dataset.k = k;
    li.innerHTML = `<div class="when"></div><button class="bead" type="button">${TICK}</button><button class="body" type="button"><span class="name"></span><span class="meta"></span></button><span class="amt"></span>`;
    return li;
  }
  function relOf(b, now) {
    if (b.paid) return b.paidKey ? t("paidOn", { date: shortDate(dateOnly(b.paidKey)) }) : t("paid");
    if (!b.due) return t("noDate");
    const d = daysBetween(now, b.due);
    if (d < 0) return d === -1 ? t("lateOne") : t("lateMany", { n: -d });
    return d === 0 ? t("dueToday") : d === 1 ? t("tomorrow") : t("inDays", { n: d });
  }
  function paintRow(li, b, showDate, now) {
    li.classList.remove("upcoming", "overdue", "paid");
    li.classList.add(b.status);
    li.classList.toggle("projected", b.projected);
    const k = li.dataset.k;
    const when = li.querySelector(".when");
    const whenHtml = showDate && b.due ? `<b>${b.due.getDate()}</b><span>${esc(b.due < now ? fmt(b.due, { month: "short" }) : fmt(b.due, { weekday: "short" }))}</span>` : "";
    if (when.innerHTML !== whenHtml) when.innerHTML = whenHtml;
    const bead = li.querySelector(".bead");
    bead.setAttribute("aria-label", t(b.paid ? "markUnpaid" : "markPaid", { name: b.name }));
    bead.setAttribute("aria-pressed", String(b.paid));
    bead.disabled = busy.has(k);
    bead.onclick = () => togglePaid(b);
    const body = li.querySelector(".body");
    body.setAttribute("aria-expanded", String(openKey === k));
    body.onclick = () => { openKey = openKey === k ? "" : k; render(latest); };
    li.querySelector(".name").textContent = b.name;
    const rest = [];
    if (b.projected) rest.push(t("expected"));
    if (b.autopay) rest.push(t("autopay"));
    rest.push(freqLabel(b.freq));
    li.querySelector(".meta").innerHTML = `<span class="rel">${esc(relOf(b, now))}</span> · ${esc(rest.join(" · "))}`;
    li.querySelector(".amt").textContent = money(b.amount, b.cur);
    let det = li.querySelector(".detail");
    if (openKey !== k) { det?.remove(); return; }
    if (!det) { det = document.createElement("div"); det.className = "detail"; li.appendChild(det); }
    if (b.projected) {
      det.innerHTML = `<p>${esc(t("projectedNote", { name: b.name, freq: freqLabel(b.freq).toLowerCase(), date: fullDate(b.from.due) }))}</p>`;
      return;
    }
    const cell = (label, v) => `<span>${esc(label)} <b>${esc(v)}</b></span>`;
    det.innerHTML = cell(t("due"), b.due ? fullDate(b.due) : t("noDate")) + cell(t("repeats"), freqLabel(b.freq))
      + cell(t("autopay"), b.autopay ? t("on") : t("off"))
      + cell(t("paid"), b.paid ? (b.paidKey ? fullDate(dateOnly(b.paidKey)) : t("paid")) : t("notYet"))
      + `<button class="k-btn danger" type="button">${esc(t("del"))}</button>`;
    det.querySelector("button").onclick = () => removeBill(b);
  }
  function makeSep(k) {
    const li = document.createElement("li");
    li.className = "sep";
    li.dataset.k = k;
    li.innerHTML = `<span class="mark"></span><span class="lab"></span>`;
    return li;
  }
  // Sync a list to entries [{k, sep?, label?, cls?, b?, showDate?}] reusing nodes by key and
  // moving only what is out of place — so a pop in flight is never cut by a refresh.
  function syncList(ol, cache, entries, now) {
    const want = [];
    for (const e of entries) {
      let node = cache.get(e.k);
      if (!node) {
        node = e.sep ? makeSep(e.k) : makeRow(e.k);
        if (!e.sep && initialKeys && !initialKeys.has(e.k)) node.classList.add("is-new");
        cache.set(e.k, node);
      }
      if (e.sep) {
        node.className = `sep ${e.cls || ""}`;
        node.querySelector(".lab").textContent = e.label;
      } else paintRow(node, e.b, e.showDate, now);
      want.push(node);
    }
    const keep = new Set(want);
    for (const [k, node] of cache) if (!keep.has(node)) { node.remove(); cache.delete(k); }
    want.forEach((node, i) => { if (ol.children[i] !== node) ol.insertBefore(node, ol.children[i] || null); });
  }
  const withDates = (list) => list.map((b, i) => ({ k: rk(b), b, showDate: i === 0 || list[i - 1].key !== b.key }));

  const tlRows = new Map();
  function paintTimeline(m) {
    const entries = [...withDates(m.late)];
    entries.push({ k: "sep:today", sep: true, cls: "today", label: t("todaySep", { date: fmt(m.now, { weekday: "short", month: "short", day: "numeric" }) }) });
    let month = m.now.getMonth(), run = [];
    const flush = () => { entries.push(...withDates(run)); run = []; };
    for (const b of m.ahead) {
      if (b.due.getMonth() !== month) {
        flush();
        month = b.due.getMonth();
        entries.push({ k: "sep:m" + b.key.slice(0, 7), sep: true, label: fmt(b.due, { month: "long" }) });
      }
      run.push(b);
    }
    flush();
    if (!m.ahead.length) entries.push({ k: "sep:none", sep: true, cls: "quiet", label: t("noneAhead") });
    if (m.undated.length) {
      entries.push({ k: "sep:nodate", sep: true, label: t("noDateSep") });
      entries.push(...m.undated.map((b) => ({ k: rk(b), b, showDate: false })));
    }
    syncList($("timeline"), tlRows, entries, m.now);
  }

  function paintPaid(m) {
    $("paidSec").hidden = !m.recent.length && !m.judged;
    $("paidTitle").textContent = t("paidTitle");
    $("paidRate").innerHTML = m.judged ? `<span class="rate">${esc(t("rate", { a: m.onTime, b: m.judged }))}</span> ${esc(t("rateTail"))}` : "";
    $("paidList").innerHTML = m.recent.map((b) => {
      const late = b.paidKey && b.paidKey > b.key;
      const when = b.paidKey ? shortDate(dateOnly(b.paidKey)) : shortDate(b.due);
      return `<li class="${late ? "late" : ""}"><i></i><span class="pn">${esc(b.name)}</span><span class="pd">${esc(when)} · ${esc(money(b.amount, b.cur))}</span></li>`;
    }).join("");
  }

  // ── month view ────────────────────────────────────────────────────────────────────────────
  const dayRows = new Map();
  function paintMonth(m) {
    const vm = viewMonth, y = vm.getFullYear(), mo = vm.getMonth();
    $("monthTitle").textContent = fmt(vm, { month: "long", year: "numeric" });
    const inMonth = m.all.filter((b) => b.due.getFullYear() === y && b.due.getMonth() === mo);
    const paidIn = inMonth.filter((b) => b.paid);
    $("monthSum").textContent = inMonth.length ? t("monthSum", { total: total(inMonth), paid: total(paidIn) }) : t("monthEmpty");
    const ws = { sunday: 0, saturday: 6 }[oma.pref("week_start", "monday")] ?? 1;
    const first = new Date(y, mo, 1), lead = (first.getDay() - ws + 7) % 7;
    const days = new Date(y, mo + 1, 0).getDate(), weeks = Math.ceil((lead + days) / 7);
    const byKey = new Map();
    for (const b of inMonth) (byKey.get(b.key) || byKey.set(b.key, []).get(b.key)).push(b);
    // late rows the grid shows red; the timeline's session-stay does not apply here
    const nowKey = keyOf(m.now);
    if (!selDay || selDay.slice(0, 7) !== keyOf(first).slice(0, 7)) {
      selDay = nowKey.slice(0, 7) === keyOf(first).slice(0, 7) ? nowKey : (inMonth[0]?.key || keyOf(first));
    }
    let html = "";
    for (let i = 0; i < 7; i++) html += `<div class="wd">${esc(fmt(new Date(2024, 0, 7 + ((ws + i) % 7)), { weekday: "short" }))}</div>`;
    for (let i = 0; i < weeks * 7; i++) {
      const d = shift(first, i - lead), k = keyOf(d), list = byKey.get(k) || [];
      const cls = ["cell", d.getMonth() !== mo && "out", k === nowKey && "today", k === selDay && "sel"].filter(Boolean).join(" ");
      const items = list.map((b) => `<span class="cb ${b.status}${b.projected ? " projected" : ""}"><i></i><span class="cn">${esc(b.name)}</span><span class="ca">${esc(money(b.amount, b.cur, true))}</span></span>`).join("");
      const dots = list.length ? `<span class="dots">${list.map((b) => `<i class="${b.projected ? "projected" : b.status}"></i>`).join("")}</span>` : "";
      const label = `${fullDate(d)}${list.length ? " — " + list.map((b) => `${b.name} ${money(b.amount, b.cur)}`).join(", ") : ""}`;
      html += `<button type="button" class="${cls}" data-day="${k}" aria-label="${esc(label)}" aria-pressed="${k === selDay}"><span class="dn">${d.getDate()}</span>${items}${dots}</button>`;
    }
    const grid = $("grid");
    grid.innerHTML = html;
    grid.onclick = (e) => { const c = e.target.closest(".cell"); if (c) { selDay = c.dataset.day; render(latest); } };
    const sel = dateOnly(selDay);
    const picked = byKey.get(selDay) || [];
    const entries = picked.length
      ? withDates(picked)
      : [{ k: "sep:dayempty", sep: true, cls: "quiet", label: t("dayEmpty", { date: fmt(sel, { weekday: "long", month: "short", day: "numeric" }) }) }];
    syncList($("dayList"), dayRows, entries, m.now);
  }

  // ── render ────────────────────────────────────────────────────────────────────────────────
  function render(state) {
    latest = state;
    const m = model(state);
    const empty = !m.bills.length && !m.undated.length;
    $("app").classList.toggle("compact", oma.pref("density", "comfortable") === "compact");
    $("main").hidden = empty;
    $("empty").hidden = !empty;
    if (empty) return;
    paintHero(m);
    paintHorizon(m);
    $("nextView").hidden = tab !== "next";
    $("monthView").hidden = tab !== "month";
    $("viewNote").textContent = tab === "next" && m.owing.length ? t("noteNext") : "";
    if (tab === "next") { paintTimeline(m); paintPaid(m); } else paintMonth(m);
    if (!initialKeys) initialKeys = new Set();
    for (const b of [...m.all, ...m.undated]) initialKeys.add(rk(b));
  }

  // ── writes: the same shape the AI writes — group upcoming|overdue|paid, fields.paid_date ──
  let errTimer = null;
  function showError(msg) { clearTimeout(errTimer); $("errorStrip").textContent = msg; $("errorStrip").hidden = false; errTimer = setTimeout(() => { $("errorStrip").hidden = true; }, 7000); }
  function clearError() { clearTimeout(errTimer); $("errorStrip").hidden = true; }
  const acked = (a) => !!a && a.ok !== false;

  function celebrate(k) {
    if (!motion()) return;
    const nodes = [tlRows.get(k), dayRows.get(k), hzDots.get(k)].filter(Boolean);
    for (const n of nodes) {
      n.classList.remove("pop");
      void n.offsetWidth;
      n.classList.add("pop");
      setTimeout(() => n.classList.remove("pop"), 700);
    }
  }

  async function togglePaid(b) {
    const k = rk(b);
    if (busy.has(k)) return;
    const next = !b.paid;
    const paidKey = next ? keyOf(today()) : "";
    overlay.set(b.id, { paid: next, paidKey, acked: false });
    if (next) stayed.add(k);
    busy.add(k);
    render(latest);
    if (next) celebrate(k);
    let ok = false, seq = Infinity;
    try {
      if (b.projected) {
        // An expected bill becomes a real row the moment it is paid — the add form's own shape.
        const a = await oma.addItem({ group: "paid", fields: {
          name: b.f.name ?? b.name, amount: b.amount, currency: b.cur, due_date: b.key,
          frequency: b.f.frequency ?? b.freq, autopay: b.autopay, paid_date: paidKey,
        } });
        ok = acked(a);
        if (ok && a.id) alias.set(a.id, k);
        seq = Number(a?.seq) || seq;
      } else {
        ok = acked(await oma.updateItem(b.id, { paid_date: paidKey }));
        if (ok) {
          const a = await oma.moveItem(b.id, next ? "paid" : b.due && b.due < today() ? "overdue" : "upcoming");
          ok = acked(a);
          seq = Number(a?.seq) || seq;
        }
      }
    } catch { ok = false; }
    busy.delete(k);
    const o = overlay.get(b.id);
    if (ok && o) {
      Object.assign(o, { acked: true, seq });
      setTimeout(() => { if (overlay.get(b.id) === o) { overlay.delete(b.id); render(latest); } }, 5000);
    } else if (!ok) { overlay.delete(b.id); showError(t("saveFailed")); }
    render(latest);
  }

  async function removeBill(b) {
    const a = await oma.deleteItem(b.id);
    if (acked(a)) openKey = "";
  }

  // ── add form ──────────────────────────────────────────────────────────────────────────────
  function setComposer(open) {
    composerOpen = open;
    $("composer").hidden = !open;
    $("addBtn").setAttribute("aria-expanded", String(open));
    if (open) {
      $("fCur").value = curOf();
      $("fDue").value = keyOf(shift(today(), 1));
      $("formErr").textContent = "";
      $("fName").focus();
    }
  }
  $("addBtn").onclick = () => setComposer(!composerOpen);
  $("emptyAdd").onclick = () => setComposer(true);
  $("cancelBtn").onclick = () => setComposer(false);
  $("fCur").oninput = (e) => { e.target.value = e.target.value.toUpperCase().replace(/[^A-Z]/g, "").slice(0, 3); };
  $("form").onsubmit = async (e) => {
    e.preventDefault();
    const name = $("fName").value.trim(), amount = Number($("fAmount").value), due = dateOnly($("fDue").value);
    if (!name || !Number.isFinite(amount) || amount <= 0 || !due) { $("formErr").textContent = t("formErr"); return; }
    const a = await oma.addItem({
      group: due < today() ? "overdue" : "upcoming",
      fields: { name, amount: Math.round(amount * 100) / 100, currency: curOf($("fCur").value), due_date: keyOf(due),
        frequency: $("fFreq").value, autopay: $("fAuto").checked, paid_date: "" },
    });
    if (!acked(a)) { $("formErr").textContent = t("saveFailed"); return; }
    viewMonth = new Date(due.getFullYear(), due.getMonth(), 1);
    selDay = keyOf(due);
    $("form").reset();
    setComposer(false);
  };

  // ── views ─────────────────────────────────────────────────────────────────────────────────
  function setTab(next) {
    tab = next;
    $("tabNext").classList.toggle("on", tab === "next");
    $("tabMonth").classList.toggle("on", tab === "month");
    $("tabNext").setAttribute("aria-selected", String(tab === "next"));
    $("tabMonth").setAttribute("aria-selected", String(tab === "month"));
    openKey = "";
    render(latest);
  }
  $("tabNext").onclick = () => setTab("next");
  $("tabMonth").onclick = () => setTab("month");
  const moveMonth = (n) => { viewMonth = new Date(viewMonth.getFullYear(), viewMonth.getMonth() + n, 1); selDay = ""; openKey = ""; render(latest); };
  $("prevM").onclick = () => moveMonth(-1);
  $("nextM").onclick = () => moveMonth(1);
  $("todayM").onclick = () => { const n = today(); viewMonth = new Date(n.getFullYear(), n.getMonth(), 1); selDay = ""; render(latest); };

  // ── AI hand-off (a proposal; standalone degrades to the clipboard) ─────────────────────────
  $("askBtn").onclick = async () => {
    const m = model(latest);
    const line = (b) => `${b.name} (${money(b.amount, b.cur)}, ${t("due")} ${b.due ? fullDate(b.due) : t("noDate")})`;
    const up = m.ahead.filter((b) => !b.paid).slice(0, 12);
    const late = m.late.filter((b) => !b.paid);
    clearError();
    $("askBtn").disabled = true;
    try {
      const r = await oma.sendMessage(t("summarizePrompt", { upcoming: up.length ? up.map(line).join("; ") : t("none"), overdue: late.length ? late.map(line).join("; ") : t("none") }));
      if (r && r.isError === true && !r.degraded) showError(t("askFailed"));
    } catch (err) {
      showError(String(err?.message || err || t("askFailed")));
    } finally {
      $("askBtn").disabled = false;
    }
  };

  function applyCopy() {
    document.documentElement.lang = lang() === "zh" ? "zh-CN" : "en";
    document.title = t("app");
    $("appName").textContent = t("app");
    $("askLabel").textContent = t("ask");
    $("askBtn").setAttribute("aria-label", t("askAria"));
    $("addLabel").textContent = t("add");
    $("tabNext").textContent = t("tabNext");
    $("tabMonth").textContent = t("tabMonth");
    $("todayM").textContent = t("today");
    $("prevM").setAttribute("aria-label", t("prev"));
    $("nextM").setAttribute("aria-label", t("next"));
    for (const [id, key] of [["lName", "fName"], ["lAmount", "fAmount"], ["lCur", "fCur"], ["lDue", "fDue"], ["lFreq", "fFreq"], ["lAuto", "fAuto"], ["cancelBtn", "cancel"], ["saveBtn", "save"], ["emptyTitle", "emptyTitle"], ["emptyAdd", "add"]]) $(id).textContent = t(key);
    $("fName").placeholder = t("fNamePh");
    $("emptyBody").innerHTML = t("emptyBody");
    const sel = $("fFreq"), v = sel.value || "monthly";
    sel.innerHTML = FREQS.map((f) => `<option value="${f}">${esc(t(f))}</option>`).join("");
    sel.value = v;
    // text changes with the language; drop the strip's frame so it redraws its labels
    $("horizon").textContent = "";
    hzDots.clear();
  }

  if (oma.standalone) document.body.classList.add("standalone");
  oma.ready((s) => {
    const n = today();
    viewMonth = new Date(n.getFullYear(), n.getMonth(), 1);
    reconcile(s);
    applyCopy();
    render(s);
  });
  oma.onChange((s) => { reconcile(s); render(s); });
  oma.onPrefChange(() => { applyCopy(); render(latest); });
</script>
</body>
</html>
