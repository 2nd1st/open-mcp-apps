      nobody: "无人",
      none: "无",
      askFailed: "没能联系上助手，请重试。",
      unknownError: "未知错误"
    }
  };

  // ── state kept OUTSIDE render: a re-render can land at any moment ──
  let raw = { jobs: [], tools: [], actions: [], updates: [] };
  let model = raw;
  let hostState = { items: [] };
  let fixturePreview = false;
  let latestStamp = NaN;
  let refreshTask = null;
  let refreshQueued = false;
  let loaded = false;
  let selectedToolId = "";
  let selectedJobId = "";
  let toolFilter = "all";
  let toolQuery = "";
  let activeTab = "job";
  let showDone = false;
  let moveOpen = false;
  let justDone = "";
  let statusTimer = 0;
  // Optimistic writes: id → fields laid over what the store says, until the ack lands (live) or
  // for the rest of the session (a fixture preview, whose reads never reflect a write).
  const overlay = new Map();
  const pendingAdds = [];
  // The journey's "was at" stop: the place a tool left, seen in THIS session. Nothing is stored —
  // the rows only know where a tool is now, so the line only ever claims what this page watched.
  const trail = new Map();
  let lastPlaces = new Map();

  if (oma.standalone) document.body.classList.add("standalone");

  const $ = (id) => document.getElementById(id);
  const byPosition = (a, b) => (Number(a.position) || 0) - (Number(b.position) || 0);
  const clamp = (value, min, max) => Math.max(min, Math.min(max, Number(value) || 0));
  const dateOnly = (iso) => { const [y, m, d] = String(iso).slice(0, 10).split("-").map(Number); return new Date(y, m - 1, d); };
  const today = () => { const n = clockNow(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); };
  const daysUntil = (iso) => Math.round((dateOnly(iso) - today()) / 86400000);
  const validDate = (value) => /^\d{4}-\d{2}-\d{2}/.test(String(value || ""));
  const field = (item, key, fallback = "") => {
    const value = item?.fields?.[key];
    return value === undefined || value === null ? fallback : value;
  };
  const stamp = (value) => new Date(value).getTime();

  function locale() {
    const pref = String(oma.pref("locale", "auto") || "auto");
    const value = pref === "auto" ? (navigator.language || "en-US") : pref;
    try {
      new Intl.DateTimeFormat(value);
      return value;
    } catch {
      return "en-US";
    }
  }

  const language = () => (locale().toLowerCase().startsWith("zh") ? "zh" : "en");

  function t(key, vars = {}) {
    let value = STR[language()][key] ?? STR.en[key] ?? key;
    for (const [name, replacement] of Object.entries(vars)) value = value.replaceAll(`{${name}}`, String(replacement));
    return value;
  }

  const num = (value) => new Intl.NumberFormat(locale(), { maximumFractionDigits: 0 }).format(Number(value) || 0);

  // A fixture preview may or may not pin the clock; when it does not, "now" is the data's own
  // latest moment, so a preview never reads as three weeks stale.
  function clockNow() {
    const now = new Date();
    if (!fixturePreview || !Number.isFinite(latestStamp)) return now;
    if (Math.abs(now.getTime() - latestStamp) < 36 * 3600000) return new Date(Math.max(now.getTime(), latestStamp));
    return new Date(latestStamp + 20 * 60000);
  }

  function formatDate(iso, options = { month: "short", day: "numeric" }) {
    if (!validDate(iso)) return String(iso || "");
    const dateIso = String(iso).slice(0, 10);
    const [year, month, day] = dateIso.split("-");
    const mode = oma.pref("date_format", "auto");
    if (mode === "yyyy-mm-dd") return dateIso;
    if (mode === "dd/mm/yyyy") return `${day}/${month}/${year}`;
    if (mode === "mm/dd/yyyy") return `${month}/${day}/${year}`;
    return new Intl.DateTimeFormat(locale(), options).format(dateOnly(dateIso));
  }

  const isoDay = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  const clock = (d) => new Intl.DateTimeFormat(locale(), { hour: "numeric", minute: "2-digit" }).format(d);

  function ago(value) {
    const ms = stamp(value);
    if (!Number.isFinite(ms)) return "";
    const minutes = Math.round((clockNow().getTime() - ms) / 60000);
    if (minutes < 1) return t("justNow");
    const rtf = new Intl.RelativeTimeFormat(locale(), { numeric: "auto", style: "short" });
    if (minutes < 60) return rtf.format(-minutes, "minute");
    const hours = Math.round(minutes / 60);
    if (hours < 24) return rtf.format(-hours, "hour");
    const days = Math.round(hours / 24);
    if (days < 14) return rtf.format(-days, "day");
    return formatDate(isoDay(new Date(ms)));
  }

  function when(value) {
    const d = new Date(value);
    if (Number.isNaN(d.getTime())) return String(value || "");
    const diff = Math.round((today() - dateOnly(isoDay(d))) / 86400000);
    if (diff === 0) return clock(d);
    if (diff === 1) return `${t("yesterday")} ${clock(d)}`;
    if (diff > 1 && diff < 7) return `${new Intl.DateTimeFormat(locale(), { weekday: "short" }).format(d)} ${clock(d)}`;
    return formatDate(isoDay(d));
  }

  function el(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined && text !== null) node.textContent = text;
    return node;
  }

  const SVG_NS = "http://www.w3.org/2000/svg";
  const ICONS = {
    home: ["M3.5 11 12 4.5l8.5 6.5V20h-17z", "M9.5 20v-5.5h5V20"],
    person: ["M12 11.5a3.6 3.6 0 1 0 0-7.2 3.6 3.6 0 0 0 0 7.2z", "M5 20c.8-3.5 3.6-5.4 7-5.4s6.2 1.9 7 5.4"],
    pin: ["M12 21s6.5-5.8 6.5-11A6.5 6.5 0 0 0 5.5 10c0 5.2 6.5 11 6.5 11z", "M12 12.3a2.3 2.3 0 1 0 0-4.6 2.3 2.3 0 0 0 0 4.6z"],
    lost: ["M9.6 9.2a2.5 2.5 0 1 1 3.4 2.3c-.6.3-1 .8-1 1.5v.6", "M12 17.2h.01"],
    service: ["M14.6 5.4a4 4 0 0 0-5 5.3L4.5 15.8l3.7 3.7 5.1-5.1a4 4 0 0 0 5.3-5l-2.5 2.5-2.7-.8-.8-2.7z"],
    check: ["M3.5 8.5l3 3 6-6.5"]
  };

  function svgIcon(name, box = 24) {
    const svg = document.createElementNS(SVG_NS, "svg");
    svg.setAttribute("viewBox", `0 0 ${box} ${box}`);
    svg.setAttribute("class", "ico");
    svg.setAttribute("aria-hidden", "true");
    for (const d of ICONS[name]) {
      const path = document.createElementNS(SVG_NS, "path");
      path.setAttribute("d", d);
      svg.append(path);
    }
    return svg;
  }

  // Latin names give initials; a Chinese name gives the surname or, after a 老/小/阿 prefix, the name.
  function initials(name) {
    const text = String(name || "").trim();
    const chars = Array.from(text);
    if (/^\p{Script=Han}/u.test(text)) return (/^[老小阿]/.test(text) && chars[1]) ? chars[1] : chars[0];
    return text.split(/\s+/).filter(Boolean).slice(0, 2).map((part) => Array.from(part)[0]).join("").toUpperCase() || "?";
  }

  function safeArray(value) {
    if (Array.isArray(value)) return value.map(String).filter(Boolean);
    if (typeof value !== "string") return [];
    try {
      const parsed = JSON.parse(value);
      if (Array.isArray(parsed)) return parsed.map(String).filter(Boolean);
    } catch {
      return value.split(/[,，、]/).map((part) => part.trim()).filter(Boolean);
    }
    return [];
  }

  const safeError = (error) => String(error?.message || error || t("unknownError"));

  // Keyed in-place list update: a node survives a refresh (focus, scroll and any running
  // animation with it); only its contents are re-filled.
  function reconcile(root, rows, key, make, fill) {
    const old = new Map([...root.children].map((node) => [node.dataset.key, node]));
    let prev = null;
    rows.forEach((row, index) => {
      const k = key(row);
      let node = old.get(k);
      if (node) old.delete(k);
      else {
        node = make(row);
        node.dataset.key = k;
      }
      fill(node, row, index);
      const want = prev ? prev.nextSibling : root.firstChild;
      if (node !== want) root.insertBefore(node, want);
      prev = node;
    });
    for (const node of old.values()) node.remove();
  }

  // ── data ──
  function toolFailure(response, fallback) {
    const payload = response?.structuredContent || response;
    if (!response || response.isError || response.ok === false || payload?.ok === false) {
      throw new Error(payload?.note || payload?.reason || response?.note || response?.reason || response?.content?.[0]?.text || fallback);
    }
    return payload || {};
  }

  async function readCollection(collection) {
    const response = await oma.callTool("data_list", { collection, limit: 500 });
    toolFailure(response, collection);
    const items = response?.structuredContent?.items;
    if (!Array.isArray(items)) throw new Error(`${collection} returned invalid data.`);
    return items;
  }

  // randomUUID exists only in a secure context; a sandboxed frame is not always one.
  const commandId = () => (globalThis.crypto?.randomUUID ? crypto.randomUUID()
    : "10000000-1000-4000-8000-100000000000".replace(/[018]/g, (c) => (c ^ (crypto.getRandomValues(new Uint8Array(1))[0] & (15 >> (c / 4)))).toString(16)));

  async function dataWrite(tool, args) {
    const response = await oma.callTool(tool, { command_id: commandId(), actor: "human", ...args });
    return toolFailure(response, `${tool} failed.`);
  }

  // App Store previews hand the rows over in the snapshot, each tagged with its collection.
  function fixtureRows(items) {
    const rows = { jobs: [], tools: [], actions: [], updates: [] };
    for (const item of items) if (KEYS[item?.collection]) rows[KEYS[item.collection]].push(item);
    return rows;
  }

  function compose() {
    const lay = (list) => list.map((item) => {
      const patch = overlay.get(item.id);
      return patch ? { ...item, fields: { ...item.fields, ...patch } } : item;
    });
    model = {
      jobs: lay(raw.jobs),
      tools: lay(raw.tools),
      actions: lay(raw.actions),
      updates: [...raw.updates, ...pendingAdds.filter((row) => !raw.updates.some((item) => item.id === row.id))]
    };
    const stamps = [
      ...raw.tools.map((item) => stamp(field(item, "updated_at"))),
      ...raw.actions.map((item) => stamp(field(item, "updated_at"))),
      ...raw.updates.map((item) => stamp(field(item, "created_at")))
    ].filter(Number.isFinite);
    latestStamp = stamps.length ? Math.max(...stamps) : NaN;
    noteMoves();
  }

  // Remember where every tool WAS, so a move — ours, the AI's, another phone's — can draw the
  // line on from there.
  function noteMoves() {
    const next = new Map();
    for (const tool of model.tools) {
      const place = placeOf(tool);
      const key = placeKey(place);
      next.set(tool.id, place);
      const before = lastPlaces.get(tool.id);
      if (before && placeKey(before) !== key) {
        trail.set(tool.id, placeKey(trail.get(tool.id)) === key ? null : before);
      }
    }
    lastPlaces = next;
  }

  function refresh(state = hostState) {
    hostState = state || hostState;
    refreshQueued = true;
    if (refreshTask) return refreshTask;
    refreshTask = (async () => {
      while (refreshQueued) {
        refreshQueued = false;
        const preview = fixtureRows(hostState.items || []);
        if (preview.jobs.length || preview.tools.length || preview.actions.length || preview.updates.length) {
          fixturePreview = true;
          raw = preview;
        } else {
          fixturePreview = false;
          const [jobs, tools, actions, updates] = await Promise.all(COLLECTIONS.map(readCollection));
          raw = { jobs, tools, actions, updates };
        }
        loaded = true;
        compose();
        render();
      }
    })().finally(() => {
      refreshTask = null;
    });
    return refreshTask;
  }

  function requestRefresh(state) {
    void refresh(state).catch((error) => showStatus(t("readFailed", { message: safeError(error) }), "bad", true));
  }

  function showStatus(message, tone = "ok", persistent = false) {
    const strip = $("status-strip");
    strip.hidden = false;
    strip.dataset.tone = tone;
    $("status-message").textContent = message;
    clearTimeout(statusTimer);
    if (!persistent) statusTimer = setTimeout(() => { strip.hidden = true; }, 4200);
  }

  function clearStatus() {
    clearTimeout(statusTimer);
    $("status-strip").hidden = true;
  }

  // ── derived facts ──
  const jobById = (id) => model.jobs.find((item) => item.id === id) || null;
  const siteOf = (job) => String(field(job, "site") || field(job, "title") || "");

  function statusLabel(status) {
    const key = {
      available: "statusAvailable", checked_out: "statusCheckedOut", on_site: "statusOnSite",
      missing: "statusMissing", service: "statusService", active: "statusActive",
      upcoming: "statusUpcoming", paused: "statusPaused", done: "statusDone"
    }[status];
    return key ? t(key) : String(status || "—");
  }

  const splitPlace = (location) => String(location || "").split(/\s*[·•|]\s*/).map((part) => part.trim()).filter(Boolean);

  // Home base is read from the data — the place the tools sitting at home share — never a name
  // baked into the app.
  function homeBase() {
    const counts = new Map();
    for (const tool of model.tools) {
      if (!["available", "service"].includes(field(tool, "status")) || field(tool, "job_id")) continue;
      const head = splitPlace(field(tool, "location"))[0];
      if (head) counts.set(head, (counts.get(head) || 0) + 1);
    }
    let best = "";
    let bestCount = 0;
    for (const [name, count] of counts) if (count > bestCount) [best, bestCount] = [name, count];
    return best || t("homeFallback");
  }

  // Where a tool is: a headline place (the job's site, or the location's first part) and the rest.
  function placeOf(tool) {
    const location = String(field(tool, "location") || "");
    const parts = splitPlace(location);
    const job = jobById(field(tool, "job_id"));
    const site = siteOf(job);
    let head = parts[0] || site || "";
    let rest = parts.slice(1).join(" · ");
    if (OUT_STATUSES.has(field(tool, "status")) && site && head !== site && !location.toLowerCase().includes(site.toLowerCase())) {
      head = site;
      rest = location;
    }
    return { status: field(tool, "status", "available"), head, rest, location };
  }

  const placeKey = (place) => (place ? `${place.status}|${place.location}` : "");

  function journeyOf(tool) {
    const place = placeOf(tool);
    const status = place.status;
    const home = homeBase();
    const holder = String(field(tool, "holder") || "");
    const was = trail.get(tool.id);
    const stops = [];
    const atHome = status === "available";
    stops.push({ kind: "home", icon: "home", k: t("homeBase"), v: home, d: atHome && !was ? place.rest || place.location : "" });
    if (was) stops.push({ kind: "was", icon: "pin", k: t("wasAt"), v: was.head || was.location, d: "" });
    if (holder && (OUT_STATUSES.has(status) || status === "missing")) {
      stops.push({ kind: "person", icon: "person", k: status === "checked_out" ? t("checkedTo") : t("withPerson"), v: holder, d: "" });
    }
    if (atHome) {
      if (was) stops.push({ kind: "now", icon: "home", k: t("backHome"), v: place.head || home, d: place.rest });
      else stops[0].now = true;
    } else if (status === "missing") {
      stops.push({ kind: "lost", icon: "lost", k: t("lastSeen"), v: place.location || "—", d: "" });
    } else if (status === "service") {
      stops.push({ kind: "now", icon: "service", k: t("inService"), v: place.rest || place.head || "—", d: holder ? `${t("sentBy")} ${holder}` : "" });
    } else {
      stops.push({ kind: "now", icon: "pin", k: t("nowAt"), v: place.head || "—", d: place.rest });
    }
    return stops;
  }

  function sortedJobs() {
    const order = { active: 0, upcoming: 1, paused: 2, done: 3 };
    return model.jobs.filter((item) => field(item, "title") || field(item, "site")).sort((a, b) =>
      (order[field(a, "status")] ?? 4) - (order[field(b, "status")] ?? 4) || byPosition(a, b));
  }

  const liveJobs = () => sortedJobs().filter((job) => field(job, "status") !== "done");

  function sortedUpdates() {
    return model.updates.filter((item) => field(item, "message")).sort((a, b) =>
      (stamp(field(b, "created_at")) || 0) - (stamp(field(a, "created_at")) || 0) || byPosition(a, b));
  }

  function toolBucket(tool) {
    const status = field(tool, "status");
    if (ISSUE_STATUSES.has(status)) return "issues";
    if (status === "available") return "home";
    return "out";
  }

  function visibleTools() {
    const showHome = oma.pref("show_available_tools", true);
    const rank = { issues: 0, out: 1, home: 2 };
    return model.tools.filter((tool) => field(tool, "name") && (showHome || field(tool, "status") !== "available"))
      .sort((a, b) => rank[toolBucket(a)] - rank[toolBucket(b)]
        || (stamp(field(b, "updated_at")) || 0) - (stamp(field(a, "updated_at")) || 0)
        || byPosition(a, b));
  }

  function matchingTools() {
    const query = toolQuery.trim().toLowerCase();
    return visibleTools().filter((tool) => {
      if (toolFilter !== "all" && toolBucket(tool) !== toolFilter) return false;
      if (!query) return true;
      const job = jobById(field(tool, "job_id"));
      return [field(tool, "name"), field(tool, "code"), field(tool, "category"), field(tool, "location"),
        field(tool, "holder"), field(tool, "note"), field(tool, "kit"), field(job, "title"), field(job, "site")]
        .join(" ").toLowerCase().includes(query);
    });
  }

  function ensureSelections() {
    const tools = visibleTools();
    if (!tools.some((tool) => tool.id === selectedToolId)) {
      // Open on the tool that moved most recently — the one someone is most likely asking about.
      const out = tools.filter((tool) => OUT_STATUSES.has(field(tool, "status")))
        .sort((a, b) => (stamp(field(b, "updated_at")) || 0) - (stamp(field(a, "updated_at")) || 0));
      selectedToolId = (out[0] || tools[0])?.id || "";
    }
    const jobs = sortedJobs();
    if (!jobs.some((job) => job.id === selectedJobId)) {
      const tool = model.tools.find((item) => item.id === selectedToolId);
      const toolJob = jobs.find((job) => job.id === field(tool, "job_id") && field(job, "status") === "active");
      selectedJobId = (toolJob || jobs[0])?.id || "";
    }
  }

  // ── render ──
  function applyI18n() {
    const lang = language();
    document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
    document.title = t("documentTitle");
    document.body.dataset.density = oma.pref("density", "comfortable");
    for (const node of document.querySelectorAll("[data-i18n]")) node.textContent = t(node.dataset.i18n);
    for (const node of document.querySelectorAll("[data-i18n-placeholder]")) node.placeholder = t(node.dataset.i18nPlaceholder);
    for (const node of document.querySelectorAll("[data-i18n-aria]")) node.setAttribute("aria-label", t(node.dataset.i18nAria));
    $("shift-date").textContent = new Intl.DateTimeFormat(locale(), { weekday: "long", month: "short", day: "numeric" }).format(clockNow());
  }

  function renderFilters() {
    const tools = visibleTools();
    const count = (bucket) => tools.filter((tool) => toolBucket(tool) === bucket).length;
    const chips = [["all", t("filterAll"), tools.length], ["out", t("filterOut"), count("out")]];
    if (oma.pref("show_available_tools", true)) chips.push(["home", t("filterHome"), count("home")]);
    chips.push(["issues", t("filterIssues"), count("issues")]);
    if (!chips.some(([key]) => key === toolFilter)) toolFilter = "all";
    reconcile($("loc-filters"), chips, ([key]) => key, ([key]) => {
      const chip = el("button", "k-chip");
      chip.type = "button";
      chip.onclick = () => {
        toolFilter = key;
        renderLocator();
      };
      return chip;
    }, (chip, [key, label, n]) => {
      chip.classList.toggle("on", key === toolFilter);
      chip.setAttribute("aria-pressed", String(key === toolFilter));
      chip.replaceChildren(document.createTextNode(`${label} `), el("span", "n", num(n)));
    });
  }

  function renderToolList(tools) {
    const list = $("tool-list");
    if (!tools.length) {
      list.replaceChildren(el("li", "list-empty", !model.tools.length ? t("noToolsYet")
        : toolQuery.trim() ? t("noToolMatch", { q: toolQuery.trim() }) : t("noToolsInView")));
      return;
    }
    if (list.querySelector(".list-empty")) list.replaceChildren();
    reconcile(list, tools, (tool) => tool.id, (tool) => {
      const li = el("li");
      const button = el("button", "tool-row");
      button.type = "button";
      button.onclick = () => selectTool(tool.id);
      li.append(button);
      return li;
    }, (li, tool) => {
      const button = li.firstChild;
      const status = field(tool, "status");
      const place = placeOf(tool);
      const dot = el("span", `dot ${OUT_STATUSES.has(status) ? "out" : status}`);
      const where = status === "available" ? t("statusAvailable")
        : [field(tool, "holder"), place.head].filter(Boolean).join(" · ") || statusLabel(status);
      const copy = el("span");
      copy.append(el("b", "", field(tool, "name")), el("small", "", `${field(tool, "code") ? field(tool, "code") + " · " : ""}${ISSUE_STATUSES.has(status) ? statusLabel(status) + " · " : ""}${where}`));
      button.replaceChildren(dot, copy);
      button.setAttribute("aria-current", String(tool.id === selectedToolId));
    });
  }

  function badgeFor(status) {
    const cls = OUT_STATUSES.has(status) ? "jk-out" : status === "missing" ? "jk-missing" : status === "service" ? "jk-service" : "";
    return cls;
  }

  function renderJourney(tool) {
    const ol = $("journey");
    const stops = journeyOf(tool);
    const sig = stops.map((stop) => `${stop.kind}:${stop.v}:${stop.d}:${stop.now ? 1 : 0}`).join("|");
    if (ol.dataset.tool === tool.id && ol.dataset.sig === sig) return;
    // Same tool, and its last stop changed: the line runs on to the new place. A different tool
    // simply appears — only a MOVE is animated.
    const oldTail = ol.dataset.tool === tool.id ? (ol.dataset.sig || "").split("|").pop() : null;
    const moved = oldTail !== null && oldTail !== sig.split("|").pop();
    ol.dataset.tool = tool.id;
    ol.dataset.sig = sig;
    ol.replaceChildren(...stops.map((stop, index) => {
      const li = el("li", `stop ${stop.kind}${stop.now || stop.kind === "now" ? " now" : ""}`);
      const isLast = index === stops.length - 1;
      if (!isLast) {
        const next = stops[index + 1];
        const trailLine = el("span", `trail${next.kind === "lost" ? " lost" : ""}`);
        if (moved && index === stops.length - 2) trailLine.classList.add("trail-in");
        li.append(trailLine);
      }
      const node = el("span", "node");
      node.append(svgIcon(stop.icon));
      const txt = el("span", "txt");
      txt.append(el("span", "k", stop.k), el("span", "v", stop.v));
      if (stop.d) txt.append(el("span", "d", stop.d));
      li.append(node, txt);
      if (moved && isLast) li.classList.add("fresh");
      return li;
    }));
  }

  function renderFound(tools) {
    const tool = tools.find((item) => item.id === selectedToolId) || model.tools.find((item) => item.id === selectedToolId);
    const has = Boolean(tool);
    for (const id of ["journey", "facts", "found-actions", "found-name"]) $(id).hidden = !has;
    $("found").querySelector(".found-meta").hidden = !has;
    $("found-empty").hidden = has;
    if (!has) {
      $("found-empty").textContent = model.tools.length ? t("noToolsInView") : t("noToolsYet");
      $("move-form").hidden = true;
      $("journey-note").hidden = true;
      return;
    }
    const status = field(tool, "status", "available");
    $("found-code").textContent = [field(tool, "code"), field(tool, "category")].filter(Boolean).join(" · ");
    const badge = $("found-status");
    badge.className = `k-badge ${badgeFor(status)}`;
    badge.textContent = statusLabel(status);
    $("found-name").textContent = field(tool, "name");
    renderJourney(tool);

    const note = $("journey-note");
    const atHomeAlone = status === "available" && !trail.get(tool.id);
    note.hidden = !(atHomeAlone || status === "missing");
    note.textContent = status === "missing" ? t("missingNote", { time: ago(field(tool, "updated_at")) || "—" }) : t("atHomeNote");

    const facts = [
      [t("kitContents"), field(tool, "kit") || t("noDetail")],
      [t("lastUpdate"), ago(field(tool, "updated_at")) || t("noDetail")],
      [t("fieldNote"), field(tool, "note"), true]
    ].filter(([, value]) => value);
    $("facts").replaceChildren(...facts.map(([label, value, wide]) => {
      const div = el("div", wide ? "wide" : "");
      div.append(el("dt", "", label), el("dd", "", value));
      return div;
    }));
    $("found-actions").hidden = moveOpen;
    $("facts").hidden = moveOpen;
    if (moveOpen) note.hidden = true;
    $("move-form").hidden = !moveOpen;
  }

  function renderLocator() {
    renderFilters();
    const tools = matchingTools();
    if (toolQuery.trim() && tools.length && !tools.some((tool) => tool.id === selectedToolId)) selectedToolId = tools[0].id;
    renderToolList(tools);
    renderFound(tools);
  }

  function jobFacts(job) {
    const actions = model.actions.filter((item) => field(item, "job_id") === job.id);
    const open = actions.filter((item) => field(item, "status") !== "done");
    const blocked = open.filter((item) => field(item, "status") === "blocked");
    const latest = sortedUpdates().find((item) => field(item, "job_id") === job.id);
    const staleHours = clamp(oma.pref("stale_update_hours", 6), 1, 24);
    const age = latest ? (clockNow().getTime() - stamp(field(latest, "created_at"))) / 3600000 : Infinity;
    return { actions, open, blocked, latest, stale: field(job, "status") === "active" && !(age <= staleHours) };
  }

  function renderJobs() {
    const jobs = liveJobs();
    const done = model.jobs.length - jobs.length;
    $("jobs-count").textContent = [jobs.length ? t("jobsCount", { count: num(jobs.length) }) : "", done ? t("doneJobs", { count: num(done) }) : ""].filter(Boolean).join(" · ");
    const strip = $("job-strip");
    if (!jobs.length) {
      strip.replaceChildren(el("li", "list-empty", t("noJobs")));
      return;
    }
    if (strip.querySelector(".list-empty")) strip.replaceChildren();
    reconcile(strip, jobs, (job) => job.id, (job) => {
      const li = el("li");
      const button = el("button", "job-pill");
      button.type = "button";
      button.onclick = () => {
        selectedJobId = job.id;
        activeTab = "job";
        showDone = false;
        renderJobs();
        renderPanel();
      };
      li.append(button);
      return li;
    }, (li, job) => {
      const button = li.firstChild;
      const status = field(job, "status");
      const facts = jobFacts(job);
      const progress = clamp(field(job, "progress"), 0, 100);
      button.className = `job-pill ${status}`;
      button.setAttribute("aria-pressed", String(job.id === selectedJobId));
      const top = el("span", "top");
      top.append(el("b", "", siteOf(job)), el("span", "pct", status === "active" ? `${num(progress)}%` : ""));
      const bar = el("span", "bar");
      const fill = el("i");
      fill.style.setProperty("--p", `${progress}%`);
      bar.append(fill);
      const meta = el("span", "meta");
      const bits = [];
      if (status !== "active") {
        const start = field(job, "start_date");
        const days = validDate(start) ? daysUntil(start) : NaN;
        bits.push(el("span", "", status === "upcoming" && days > 0 ? t("startsIn", { count: num(days) }) : status === "upcoming" && days === 0 ? t("startsToday") : statusLabel(status)));
      }
      if (facts.blocked.length) bits.push(el("span", "bad", t("blockedCount", { count: num(facts.blocked.length) })));
      const plain = facts.open.length - facts.blocked.length;
      if (plain > 0) bits.push(el("span", "", t("openCount", { count: num(plain) })));
      if (facts.stale) bits.push(el("span", "warn", t("stale", { time: facts.latest ? ago(field(facts.latest, "created_at")) : "" }).trim()));
      bits.forEach((bit, index) => {
        if (index) meta.append(document.createTextNode(" · "));
        meta.append(bit);
      });
      button.replaceChildren(top, bar, meta);
    });
  }

  function dueBadge(iso, done) {
    if (!validDate(iso) || done) return null;
    const days = daysUntil(iso);
    if (days < 0) return el("span", "k-badge bad-t", t("overdue", { count: num(-days) }));
    return el("span", "k-badge", days === 0 ? t("dueToday") : t("dueIn", { count: num(days) }));
  }

  function renderPanel() {
    const job = jobById(selectedJobId);
    const updates = sortedUpdates();
    $("panel").hidden = !model.jobs.length && !updates.length;
    $("tab-job").hidden = !job;
    if (!job && activeTab === "job") activeTab = "wire";
    $("tab-job").textContent = job ? t("tabJob", { site: siteOf(job) }) : "";
    $("tab-wire").replaceChildren(document.createTextNode(`${t("tabWire")} `), el("span", "n", num(updates.length)));
    for (const tab of document.querySelectorAll("[data-tab]")) {
      tab.classList.toggle("on", tab.dataset.tab === activeTab);
      tab.setAttribute("aria-selected", String(tab.dataset.tab === activeTab));
    }
    $("pane-job").hidden = activeTab !== "job";
    $("pane-wire").hidden = activeTab !== "wire";
    if (job) renderJobPane(job);
    renderWire(updates);
  }

  function renderJobPane(job) {
    const status = field(job, "status");
    const facts = jobFacts(job);
    $("job-title").textContent = field(job, "title") || siteOf(job);
    $("job-address").textContent = [field(job, "address"), status === "active" ? `${num(clamp(field(job, "progress"), 0, 100))}%` : ""].filter(Boolean).join(" · ");
    const badges = [el("span", `k-badge ${status === "active" ? "jk-out" : ""}`, statusLabel(status))];
    const due = dueBadge(field(job, "due_date"), status === "done");
    if (due) badges.push(due);
    $("job-badges").replaceChildren(...badges);
    const next = $("job-next");
    next.hidden = !field(job, "next_action");
    next.replaceChildren(el("span", "", t("nextMove")), document.createTextNode(field(job, "next_action")));

    const order = { blocked: 0, open: 1, done: 2 };
    const sorted = [...facts.actions].sort((a, b) => (order[field(a, "status")] ?? 1) - (order[field(b, "status")] ?? 1) || byPosition(a, b));
    const doneCount = sorted.filter((item) => field(item, "status") === "done").length;
    const shown = showDone ? sorted : sorted.filter((item) => field(item, "status") !== "done" || item.id === justDone);
    const list = $("job-actions");
    if (!shown.length) list.replaceChildren(el("li", "list-empty", t("noActions")));
    else {
      if (list.querySelector(".list-empty")) list.replaceChildren();
      reconcile(list, shown, (item) => item.id, () => {
        const li = el("li", "action");
        const check = el("button", "check");
        check.type = "button";
        check.append(svgIcon("check", 16));
        li.append(check, el("div"));
        return li;
      }, (li, item) => {
        const itemStatus = field(item, "status", "open");
        li.className = `action ${itemStatus}${item.id === justDone ? " just" : ""}`;
        const check = li.firstChild;
        check.disabled = itemStatus === "done";
        check.setAttribute("aria-label", t("markDone", { title: field(item, "title") }));
        check.onclick = () => markDone(item);
        const copy = li.lastChild;
        const meta = el("small");
        if (itemStatus === "blocked") meta.append(el("span", "bad", t("blocked")), document.createTextNode(" · "));
        const due = itemStatus === "done" ? "" : dueText(field(item, "due_date"));
        meta.append(document.createTextNode([field(item, "owner"), field(item, "note"), due].filter(Boolean).join(" · ")));
        copy.replaceChildren(el("b", "", field(item, "title")), meta);
      });
    }
    const toggle = $("done-toggle");
    toggle.hidden = !doneCount;
    toggle.textContent = showDone ? t("hideDone") : t("showDone", { count: num(doneCount) });

    $("job-crew").replaceChildren(...safeArray(field(job, "crew")).map((person) => {
      const span = el("span");
      span.append(el("i", "", initials(person)), document.createTextNode(person));
      return span;
    }));
    const gear = model.tools.filter((tool) => field(tool, "job_id") === job.id);
    $("job-tools").replaceChildren(...(gear.length ? gear.map((tool) => {
      const chip = el("button", `k-chip${ISSUE_STATUSES.has(field(tool, "status")) ? " issue" : ""}`, field(tool, "name"));
      chip.type = "button";
      chip.onclick = () => {
        toolQuery = "";
        toolFilter = "all";
        $("tool-search-input").value = "";
        selectTool(tool.id);
        $("found").scrollIntoView({ block: "nearest", behavior: "smooth" });
      };
      return chip;
    }) : [el("span", "k-mut", t("noGear"))]));
    $("job-note").textContent = field(job, "note");
  }

  function dueText(iso) {
    if (!validDate(iso)) return "";
    const days = daysUntil(iso);
    if (days === 0) return t("dueToday");
    return days < 0 ? t("overdue", { count: num(-days) }) : t("dueIn", { count: num(days) });
  }

  function kindLabel(kind) {
    return t({ progress: "kindProgress", blocker: "kindBlocker", tool: "kindTool", delivery: "kindDelivery" }[kind] || "kindGeneral");
  }

  function renderWire(updates) {
    const select = $("update-job");
    const jobs = liveJobs();
    const current = select.value || selectedJobId;
    const options = jobs.map((job) => [job.id, `${siteOf(job)} · ${field(job, "title")}`]);
    if (select.dataset.sig !== JSON.stringify(options)) {
      select.replaceChildren(...options.map(([id, label]) => new Option(label, id)));
      select.dataset.sig = JSON.stringify(options);
    }
    select.value = options.some(([id]) => id === current) ? current : (options[0]?.[0] || "");
    $("update-form").hidden = !jobs.length;

    const list = $("wire");
    if (!updates.length) {
      list.replaceChildren(el("li", "list-empty", t("noUpdates")));
      return;
    }
    if (list.querySelector(".list-empty")) list.replaceChildren();
    reconcile(list, updates, (item) => item.id, () => el("li", "post"), (li, item) => {
      const kind = field(item, "kind", "general");
      li.className = `post ${kind}${item.pending ? " pending" : ""}`;
      const head = el("div", "hd");
      head.append(el("b", "", field(item, "author") || "—"), el("span", "", siteOf(jobById(field(item, "job_id"))) || ""),
        el("span", "", when(field(item, "created_at"))),
        el("span", "kind", [kindLabel(kind), field(item, "source") === "photo" ? t("sourcePhoto") : ""].filter(Boolean).join(" · ")));
      const copy = el("div");
      copy.append(head, el("p", "", field(item, "message")));
      li.replaceChildren(el("span", "av", initials(field(item, "author"))), copy);
    });
  }

  function render() {
    applyI18n();
    const hasData = model.jobs.length || model.tools.length || model.actions.length || model.updates.length;
    $("empty-state").hidden = !loaded || Boolean(hasData);
    $("app-content").hidden = !hasData;
    placeBulk(hasData ? "list-bulk" : "empty-bulk");
    $("handover-button").hidden = !liveJobs().length;
    if (hasData) {
      ensureSelections();
      renderLocator();
      renderJobs();
      renderPanel();
    }
    $("foot").textContent = t("refreshed", { time: clock(new Date()) });
  }

  // One paste box, moved between the empty state and the tool list.
  function placeBulk(targetId) {
    const target = $(targetId);
    const source = targetId === "list-bulk" ? $("empty-bulk") : $("list-bulk");
    if (source.children.length && !target.children.length) target.append(...source.children);
  }

  // ── actions ──
  function selectTool(id) {
    if (moveOpen && id !== selectedToolId) moveOpen = false;
    selectedToolId = id;
    renderLocator();
  }

  function openMove() {
    const tool = model.tools.find((item) => item.id === selectedToolId);
    if (!tool) return;
    moveOpen = true;
    $("move-title").textContent = t("moveTitle", { name: field(tool, "name") });
    $("move-location").value = field(tool, "location");
    $("move-holder").value = field(tool, "holder");
    $("move-note").value = field(tool, "note");
    const jobSelect = $("move-job");
    jobSelect.replaceChildren(new Option(t("noJob"), ""), ...sortedJobs().map((job) => new Option(`${siteOf(job)} · ${field(job, "title")}`, job.id)));
    jobSelect.value = field(tool, "job_id");
    setMoveStatus(field(tool, "status", "available"));

    const home = homeBase();
    const places = [[home, "home"], ...liveJobs().map((job) => [siteOf(job), job.id])];
    $("move-places").replaceChildren(...places.map(([label, key]) => {
      const chip = el("button", "k-chip", label);
      chip.type = "button";
      chip.onclick = () => {
        if (key === "home") {
          $("move-location").value = home;
          $("move-holder").value = "";
          jobSelect.value = "";
          setMoveStatus("available");
        } else {
          $("move-location").value = `${label} · `;
          jobSelect.value = key;
          if (!OUT_STATUSES.has($("move-statuses").dataset.value)) setMoveStatus("on_site");
        }
        $("move-note").value = "";
        $("move-location").focus();
      };
      return chip;
    }));
    const known = [...new Set(model.tools.map((item) => String(field(item, "location"))).filter(Boolean))];
    $("known-places").replaceChildren(...known.map((value) => new Option(value)));
    renderFound(matchingTools());
    $("move-location").focus();
  }

  function setMoveStatus(value) {
    const group = $("move-statuses");
    group.dataset.value = value;
    group.replaceChildren(...TOOL_STATUSES.map((status) => {
      const chip = el("button", `k-chip${status === value ? " on" : ""}`, statusLabel(status));
      chip.type = "button";
      chip.setAttribute("role", "radio");
      chip.setAttribute("aria-checked", String(status === value));
      chip.onclick = () => setMoveStatus(status);
      return chip;
    }));
  }

  function closeMove() {
    moveOpen = false;
    renderFound(matchingTools());
  }

  async function saveMove(event) {
    event.preventDefault();
    const tool = model.tools.find((item) => item.id === selectedToolId);
    if (!tool) return;
    const fields = {
      status: $("move-statuses").dataset.value || field(tool, "status", "available"),
      job_id: $("move-job").value,
      location: $("move-location").value.trim().replace(/\s*·\s*$/, ""),
      holder: $("move-holder").value.trim(),
      note: $("move-note").value.trim(),
      updated_at: new Date().toISOString()
    };
    // Optimistic: the line runs on to the new place now; the ack only confirms it.
    const prior = overlay.get(tool.id);
    overlay.set(tool.id, { ...(prior || {}), ...fields });
    moveOpen = false;
    compose();
    render();
    const place = placeOf(model.tools.find((item) => item.id === tool.id));
    showStatus(t(fields.status === "available" ? "movedHome" : "moved", { name: field(tool, "name"), place: place.head || fields.location }));
    try {
      await dataWrite("data_update_item", { id: tool.id, expected_version: tool.version, fields });
      if (!fixturePreview) {
        overlay.delete(tool.id);
        await refresh();
      }
    } catch (error) {
      if (prior) overlay.set(tool.id, prior);
      else overlay.delete(tool.id);
      compose();
      render();
      showStatus(t("moveFailed", { message: safeError(error) }), "bad", true);
      requestRefresh();
    }
  }

  async function markDone(action) {
    if (field(action, "status") === "done") return;
    const fields = { status: "done", updated_at: new Date().toISOString() };
    overlay.set(action.id, fields);
    justDone = action.id;
    compose();
    render();
    try {
      await dataWrite("data_update_item", { id: action.id, expected_version: action.version, fields });
      showStatus(t("actionSaved", { title: field(action, "title") }));
      if (!fixturePreview) {
        overlay.delete(action.id);
        await refresh();
      }
    } catch (error) {
      overlay.delete(action.id);
      justDone = "";
      compose();
      render();
      showStatus(t("actionFailed", { message: safeError(error) }), "bad", true);
      requestRefresh();
    }
  }

  function rememberName(name) {
    try {
      localStorage.setItem("job-kit-author", name);
    } catch {}
  }

  function recallName() {
    try {
      return localStorage.getItem("job-kit-author") || "";
    } catch {
      return "";
    }
  }

  async function saveFieldUpdate(event) {
    event.preventDefault();
    const jobId = $("update-job").value;
    const author = $("update-author").value.trim();
    const message = $("update-message").value.trim();
    if (!jobId || !author || !message) {
      (!author ? $("update-author") : $("update-message")).focus();
      return;
    }
    const fields = { job_id: jobId, author, message, created_at: new Date().toISOString(), source: "text", kind: "general" };
    const temp = { id: `pending-${Date.now()}`, group: jobId, position: 0, fields, version: 0, pending: true };
    pendingAdds.push(temp);
    rememberName(author);
    $("update-message").value = "";
    compose();
    renderPanel();
    renderJobs();
    try {
      await dataWrite("data_add_item", { collection: UPDATES, group: jobId, fields });
      temp.pending = false;
      showStatus(t("updateSaved", { site: siteOf(jobById(jobId)) }));
      if (!fixturePreview) {
        pendingAdds.splice(pendingAdds.indexOf(temp), 1);
        await refresh();
      } else {
        compose();
        renderPanel();
      }
    } catch (error) {
      pendingAdds.splice(pendingAdds.indexOf(temp), 1);
      $("update-message").value = message;
      compose();
      renderPanel();
      renderJobs();
      showStatus(t("updateFailed", { message: safeError(error) }), "bad", true);
    }
  }

  async function importTools() {
    const input = $("bulk-tool-input");
    const lines = input.value.split(/\r?\n/).map((line) => line.trim()).filter(Boolean);
    if (!lines.length) return showStatus(t("importEmpty"), "bad");
    if (lines.length > 30) return showStatus(t("importLimit"), "bad");
    const button = $("bulk-tool-button");
    button.disabled = true;
    let added = 0;
    const localized = { "可用": "available", "在库": "available", "已领用": "checked_out", "在工地": "on_site", "缺失": "missing", "维修": "service", "维修中": "service" };
    try {
      for (const line of lines) {
        const [name, code = "", location = "", rawStatus = "available"] = line.split("|").map((part) => part.trim());
        if (!name) continue;
        const normalized = localized[rawStatus] || rawStatus;
        await dataWrite("data_add_item", {
          collection: TOOLS,
          group: "Tools",
          fields: {
            name,
            code,
            category: language() === "zh" ? "工具" : "Tools",
            status: TOOL_STATUSES.includes(normalized) ? normalized : "available",
            location,
            holder: "",
            job_id: "",
            kit: "",
            updated_at: new Date().toISOString(),
            note: ""
          }
        });
        added++;
      }
      input.value = "";
      await refresh();
      showStatus(t("importDone", { count: num(added) }));
    } catch (error) {
      showStatus(t("importPartial", { count: num(added), message: safeError(error) }), "bad", true);
      requestRefresh();
    } finally {
      button.disabled = false;
    }
  }

  // Assistant hand-offs PROPOSE text; a completed clipboard fallback is not an error.
  async function propose(button, text) {
    clearStatus();
    button.disabled = true;
    try {
      const result = await oma.sendMessage(text);
      if (result && result.isError === true && !result.degraded) showStatus(t("askFailed"), "bad");
    } catch (error) {
      showStatus(String(error?.message || error || t("askFailed")), "bad");
    } finally {
      button.disabled = false;
    }
  }

  function handoverText() {
    const job = jobById(selectedJobId) || liveJobs()[0];
    if (!job) return t("setupPrompt");
    const facts = jobFacts(job);
    const actions = facts.open.map((item) => `${field(item, "title")}${field(item, "status") === "blocked" ? ` (${t("blocked")}: ${field(item, "note")})` : ""}`).join("; ") || t("none");
    const issues = model.tools.filter((tool) => field(tool, "job_id") === job.id && ISSUE_STATUSES.has(field(tool, "status")))
      .map((tool) => `${field(tool, "name")}: ${statusLabel(field(tool, "status"))} · ${field(tool, "location")}`).join("; ") || t("none");
    const updates = sortedUpdates().filter((item) => field(item, "job_id") === job.id).slice(0, 3)
      .map((item) => `${field(item, "author")}: ${field(item, "message")}`).join("; ") || t("none");
    return t("handoverPrompt", { site: siteOf(job), actions, issues, updates });
  }

  // ── wiring ──
  $("tool-search-input").oninput = (event) => {
    toolQuery = event.currentTarget.value;
    renderLocator();
  };
  $("tool-search-form").onsubmit = (event) => {
    event.preventDefault();
    renderLocator();
  };
  $("move-button").onclick = openMove;
  $("move-cancel").onclick = closeMove;
  $("move-form").onsubmit = saveMove;
  $("update-form").onsubmit = saveFieldUpdate;
  $("update-author").value = recallName();
  $("update-job").onchange = (event) => {
    selectedJobId = event.currentTarget.value;
    renderJobs();
  };
  $("done-toggle").onclick = () => {
    showDone = !showDone;
    renderPanel();
  };
  for (const tab of document.querySelectorAll("[data-tab]")) {
    tab.onclick = () => {
      activeTab = tab.dataset.tab;
      renderPanel();
    };
  }
  $("bulk-tool-button").onclick = importTools;
  $("setup-button").onclick = (event) => propose(event.currentTarget, t("setupPrompt"));
  $("handover-button").onclick = (event) => propose(event.currentTarget, handoverText());
  $("update-ai").onclick = (event) => {
    const job = jobById($("update-job").value) || jobById(selectedJobId);
    if (job) propose(event.currentTarget, t("updatePrompt", { site: siteOf(job) }));
  };
  $("ask-tool-button").onclick = (event) => {
    const tool = model.tools.find((item) => item.id === selectedToolId);
    if (!tool) return;
    propose(event.currentTarget, t("toolPrompt", {
      tool: field(tool, "name"),
      code: field(tool, "code") || "—",
      status: statusLabel(field(tool, "status")),
      location: field(tool, "location") || "—",
      holder: field(tool, "holder") || t("nobody")
    }));
  };

  oma.ready(requestRefresh);
  oma.onChange(requestRefresh);
  oma.onPrefChange(() => render());
  // Only the bound collection signals onChange; the four this app renders are fetched, so it owns
  // their staleness.
  setInterval(() => {
    if (!document.hidden) requestRefresh(hostState);
  }, 30000);
  setInterval(() => {
    if (!loaded) return;
    applyI18n();
    $("foot").textContent = t("refreshed", { time: clock(new Date()) });
  }, 60000);
</script>
</body>
</html>
