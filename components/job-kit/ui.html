<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Job Kit · Where's that tool?</title>
<meta name="description" content="A field crew's tool locator: search any tool and see its journey from the workshop to whoever has it and where it is now, with the jobs in motion, their next actions and the site wire beneath.">
<meta name="oma-category" content="Work">
<style>
  /* Shared primitives (.k-*) — this app's own copy; nothing here comes from the engine. */
  :root{--k-accent:var(--color-text-info,var(--color-ring-primary,#3b6cf6));--k-ok:var(--color-text-success,#2e9e5b);--k-warn:var(--color-text-warning,#b98200);--k-bad:var(--color-text-danger,#e5484d);--k-ink-4:color-mix(in oklab,var(--color-text-primary) 4%,transparent);--k-ink-7:color-mix(in oklab,var(--color-text-primary) 7%,transparent);--k-accent-bg:color-mix(in oklab,var(--k-accent) 10%,transparent);--k-accent-brd:color-mix(in oklab,var(--k-accent) 28%,transparent);--k-t-fast:120ms;--k-t:180ms;--k-t-slow:260ms;--k-ease:cubic-bezier(.2,.8,.3,1);--k-spring:cubic-bezier(.34,1.56,.64,1);--k-surface:var(--color-background-primary)}
  @media (prefers-reduced-motion:reduce){:root{--k-t-fast:0ms;--k-t:0ms;--k-t-slow:0ms}}
  .k-sub,.k-mut{font-size:var(--font-text-sm-size,12.5px)}

  .k-mut{color:var(--color-text-tertiary)}
  .k-btn{display:inline-flex;align-items:center;gap:6px;border:1px solid transparent;border-radius:var(--border-radius-md,10px);padding:6px 12px;font:inherit;font-size:var(--font-text-sm-size,12.5px);font-weight:600;cursor:pointer;background:var(--color-background-inverse);color:var(--color-text-inverse);transition:transform var(--k-t-fast) var(--k-ease),opacity var(--k-t-fast),background var(--k-t-fast)}

  .k-btn:disabled{opacity:.45;cursor:default;transform:none}
  .k-btn.sec{background:transparent;color:var(--color-text-primary);border-color:var(--color-border-primary)}
  .k-btn.ghost{background:transparent;color:var(--color-text-secondary)}
  :is(.k-btn.sec,.k-btn.ghost):hover{background:var(--k-ink-4);color:var(--color-text-primary);opacity:1}
  .k-btn.danger{background:transparent;color:var(--k-bad);border-color:color-mix(in oklab,var(--k-bad) 30%,transparent)}
  .k-btn.danger:hover{background:color-mix(in oklab,var(--k-bad) 10%,transparent);opacity:1}
  :is(.k-btn,.k-tab,.k-chip,.k-switch,.k-field):focus-visible{outline:2px solid var(--color-ring-primary,var(--k-accent));outline-offset:1px}
  .k-chip{display:inline-flex;align-items:center;gap:5px;border-radius:var(--border-radius-full,999px);border:1px solid var(--color-border-secondary);background:transparent;color:var(--color-text-secondary);padding:2px 10px;font:inherit;font-size:11.5px;font-weight:550;cursor:pointer;transition:background var(--k-t-fast),color var(--k-t-fast),border-color var(--k-t-fast),transform var(--k-t) var(--k-spring)}
  .k-chip:hover{background:var(--k-ink-4);color:var(--color-text-primary)}
  .k-chip:active{transform:scale(.93)}
  .k-chip.on{background:color-mix(in oklab,var(--k-accent) 10%,transparent);border-color:color-mix(in oklab,var(--k-accent) 28%,transparent);color:var(--k-accent)}
  .k-chip.static{cursor:default}
  .k-chip.static:hover{background:transparent;color:var(--color-text-secondary)}
  .k-chip.static:active{transform:none}
  .k-badge{display:inline-flex;align-items:center;gap:4px;border-radius:var(--border-radius-full,999px);padding:1px 8px;font-size:11px;font-weight:600;background:var(--k-ink-4);color:var(--color-text-secondary)}
  .k-badge.info{background:color-mix(in oklab,var(--k-accent) 10%,transparent);color:var(--k-accent)}
  .k-badge.ok{background:color-mix(in oklab,var(--k-ok) 12%,transparent);color:var(--k-ok)}
  .k-badge.warn{background:color-mix(in oklab,var(--k-warn) 14%,transparent);color:var(--k-warn)}
  .k-badge.bad{background:color-mix(in oklab,var(--k-bad) 12%,transparent);color:var(--k-bad)}
  .k-tabs{display:inline-flex;gap:2px;padding:3px;background:var(--color-background-secondary);border-radius:var(--border-radius-md,10px)}
  .k-tab{display:inline-flex;align-items:center;gap:6px;border:none;background:transparent;color:var(--color-text-secondary);cursor:pointer;font:inherit;font-size:var(--font-text-sm-size,12.5px);font-weight:550;padding:5px 12px;border-radius:var(--border-radius-sm,7px);transition:background var(--k-t) var(--k-ease),color var(--k-t)}
  .k-tab.on{background:var(--color-background-primary);color:var(--color-text-primary);box-shadow:var(--shadow-sm)}
  .k-field{padding:6px 10px;border-radius:var(--border-radius-md,10px);border:1px solid var(--color-border-primary);background:transparent;color:inherit;font:inherit;font-size:var(--font-text-sm-size,12.5px);transition:border-color var(--k-t-fast),box-shadow var(--k-t-fast)}
  .k-field::placeholder{color:var(--color-text-tertiary)}
  .k-field:focus{outline:none;border-color:var(--k-accent);box-shadow:0 0 0 3px color-mix(in oklab,var(--k-accent) 10%,transparent)}
  .k-appbar{display:flex;align-items:center;gap:11px;padding:13px 16px}
  .k-appbar .k-appmark{display:grid;width:34px;height:34px;flex:none;place-items:center;border-radius:11px}
  .k-appbar .k-appmark svg{width:18px;height:18px}
  .k-appbar .k-appcopy{min-width:0;flex:1}
  .k-appbar .k-eyebrow{display:block;margin:0;color:var(--color-text-tertiary);font-size:9.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
  .k-appbar h1{margin:1px 0 0;font-size:15px;font-weight:650;letter-spacing:-.015em}
  body:not(.standalone) .k-appbar{border-bottom:1px solid var(--color-border-secondary);background:var(--k-surface)}
  .k-stage{max-width:1120px;margin-inline:auto;overflow-x:clip}

  /* The signature is THE LOCATOR: type a tool, and its journey draws itself — home base, who has
     it, where it is now. Moving a tool extends that line to the new place. Every count on the page
     (filter chips, job pills, tab badges) is derived from the same four collections in one pass. */
  .jk {
    --jk: light-dark(#5f7000, #c4d64a);
    --jk-on: light-dark(#ffffff, #1b2000);
    --k-accent: var(--jk);
    --k-accent-bg: color-mix(in oklab, var(--jk) 12%, transparent);
    --k-accent-brd: color-mix(in oklab, var(--jk) 38%, transparent);
    --jk-line: color-mix(in oklab, var(--color-text-primary) 10%, transparent);
    --node: 30px;
  }

  button,
  input,
  select,
  textarea {
    font: inherit;
  }

  :focus-visible {
    outline: 2px solid var(--color-ring-primary, var(--jk));
    outline-offset: 2px;
  }

  .ico {
    fill: none;
    stroke: currentColor;
    stroke-width: 1.7;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  /* ── app bar ── */
  .jk-mark {
    color: var(--jk);
    border: 1px solid var(--k-accent-brd);
    background: var(--k-accent-bg);
  }

  .jk-bar h1 {
    margin: 0;
    font-size: 15px;
    font-weight: 700;
  }

  .jk-bar .k-sub {
    margin: 1px 0 0;
    font-size: 12px;
  }

  .jk-bar .k-btn {
    flex: none;
    white-space: nowrap;
  }

  .k-btn.accent {
    background: var(--jk);
    color: var(--jk-on);
  }

  .status-strip {
    margin: 0 16px 10px;
    padding: 8px 10px;
    border-radius: var(--border-radius-md, 10px);
    font-size: 12.5px;
    border: 1px solid var(--k-accent-brd);
    background: var(--k-accent-bg);
  }

  .status-strip[data-tone="bad"] {
    color: var(--color-text-danger);
    border-color: color-mix(in oklab, var(--color-text-danger) 32%, transparent);
    background: color-mix(in oklab, var(--color-text-danger) 8%, transparent);
  }

  /* ── the locator ── */
  .locator {
    display: grid;
    grid-template-columns: minmax(220px, 268px) minmax(0, 1fr);
    grid-template-areas:
      "search found"
      "filters found"
      "list found";
    grid-template-rows: auto auto 1fr;
    column-gap: 16px;
    row-gap: 8px;
    padding: 2px 16px 16px;
  }

  .loc-search {
    grid-area: search;
    position: relative;
  }

  .loc-search .ico {
    position: absolute;
    left: 11px;
    top: 50%;
    width: 16px;
    height: 16px;
    transform: translateY(-50%);
    color: var(--color-text-tertiary);
    pointer-events: none;
  }

  .loc-search input {
    width: 100%;
    padding: 9px 12px 9px 34px;
    font-size: 14px;
  }

  .loc-filters {
    grid-area: filters;
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
  }

  .loc-filters .k-chip {
    padding-inline: 9px;
  }

  .loc-filters .n {
    font-variant-numeric: tabular-nums;
    opacity: .75;
  }

  .loc-listwrap {
    grid-area: list;
    min-height: 0;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .tool-list {
    list-style: none;
    margin: 0;
    padding: 0;
    max-height: 262px;
    overflow-y: auto;
    border: 1px solid var(--color-border-secondary);
    border-radius: var(--border-radius-md, 10px);
  }

  .tool-row {
    display: grid;
    grid-template-columns: 10px minmax(0, 1fr);
    gap: 9px;
    align-items: start;
    width: 100%;
    padding: 8px 10px;
    border: 0;
    border-bottom: 1px solid var(--color-border-secondary);
    background: transparent;
    color: inherit;
    text-align: left;
    cursor: pointer;
  }

  .tool-list li:last-child .tool-row {
    border-bottom: 0;
  }

  .tool-row:hover {
    background: var(--k-ink-4);
  }

  .tool-row[aria-current="true"] {
    background: var(--k-accent-bg);
    box-shadow: inset 3px 0 0 var(--jk);
  }

  .tool-row .dot {
    width: 8px;
    height: 8px;
    margin-top: 5px;
    border-radius: 50%;
    border: 1.5px solid var(--color-text-tertiary);
  }

  .tool-row .dot.out {
    border-color: var(--jk);
    background: var(--jk);
  }

  .tool-row .dot.missing {
    border-color: var(--color-text-danger);
    background: var(--color-text-danger);
  }

  .tool-row .dot.service {
    border-color: var(--color-text-warning);
  }

  .tool-row b {
    display: block;
    font-size: 13px;
    font-weight: 600;
    line-height: 1.3;
  }

  .tool-row small {
    display: block;
    margin-top: 1px;
    color: var(--color-text-secondary);
    font-size: 11.5px;
    line-height: 1.35;
  }

  .list-empty {
    padding: 14px 12px;
    color: var(--color-text-tertiary);
    font-size: 12.5px;
  }

  details.bulk summary {
    cursor: pointer;
    color: var(--color-text-secondary);
    font-size: 12px;
    font-weight: 550;
    padding: 2px 0;
  }

  details.bulk[open] {
    display: grid;
    gap: 6px;
  }

  details.bulk textarea {
    width: 100%;
    min-height: 76px;
    resize: vertical;
  }

  .bulk-help {
    margin: 0;
    color: var(--color-text-tertiary);
    font-size: 11.5px;
  }

  /* the found card */
  .found {
    grid-area: found;
    container: found / inline-size;
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding: 14px 16px 16px;
    border: 1px solid var(--color-border-secondary);
    border-radius: var(--border-radius-lg, 14px);
    min-width: 0;
  }

  .found-meta {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    color: var(--color-text-secondary);
    font-size: 12px;
  }

  .found-meta .code {
    font-family: var(--font-sans);
    font-variant-numeric: tabular-nums;
    font-weight: 600;
    letter-spacing: .02em;
  }

  .found-meta .k-badge {
    margin-left: auto;
  }

  .found h2 {
    margin: -4px 0 0;
    font-size: 26px;
    line-height: 1.12;
    font-weight: 750;
    letter-spacing: -.015em;
    overflow-wrap: anywhere;
  }

  .k-badge.jk-out {
    background: var(--k-accent-bg);
    color: var(--jk);
  }

  .k-badge.jk-missing {
    background: color-mix(in oklab, var(--color-text-danger) 12%, transparent);
    color: var(--color-text-danger);
  }

  .k-badge.jk-service {
    background: color-mix(in oklab, var(--color-text-warning) 14%, transparent);
    color: var(--color-text-warning);
  }

  /* the journey: vertical on a narrow card, a line across on a wide one */
  .journey {
    list-style: none;
    margin: 2px 0 0;
    padding: 0;
    display: grid;
    gap: 14px;
  }

  .stop {
    position: relative;
    display: grid;
    grid-template-columns: var(--node) minmax(0, 1fr);
    column-gap: 10px;
    align-items: start;
    align-content: start;
    min-width: 0;
  }

  .stop .node {
    display: grid;
    place-items: center;
    width: var(--node);
    height: var(--node);
    border-radius: 50%;
    border: 1.5px solid var(--jk);
    color: var(--jk);
    background: var(--color-background-primary, Canvas);
    position: relative;
    z-index: 1;
    transition: background var(--k-t) var(--k-ease), color var(--k-t) var(--k-ease), border-color var(--k-t);
  }

  .stop .node svg {
    width: 16px;
    height: 16px;
  }

  .stop.now .node {
    background: var(--jk);
    color: var(--jk-on);
    box-shadow: 0 0 0 4px var(--k-accent-bg);
  }

  .stop.was .node {
    border-color: var(--color-border-primary);
    color: var(--color-text-tertiary);
  }

  .stop.lost .node {
    border-style: dashed;
    border-color: var(--color-text-danger);
    color: var(--color-text-danger);
    background: var(--color-background-primary, Canvas);
    box-shadow: none;
  }

  .stop .txt {
    display: grid;
    gap: 1px;
    padding-top: 1px;
    min-width: 0;
  }

  .stop .k {
    color: var(--color-text-tertiary);
    font-size: 11.5px;
    font-weight: 550;
  }

  .stop .v {
    font-size: 14px;
    font-weight: 650;
    line-height: 1.25;
    overflow-wrap: anywhere;
  }

  .stop .d {
    color: var(--color-text-secondary);
    font-size: 12px;
    line-height: 1.35;
    overflow-wrap: anywhere;
  }

  .stop.was .v {
    color: var(--color-text-secondary);
    font-weight: 550;
    text-decoration: line-through;
    text-decoration-color: var(--color-text-tertiary);
  }

  /* the trail belongs to the stop BEFORE it and runs to the next node */
  .stop .trail {
    position: absolute;
    left: calc(var(--node) / 2 - 1px);
    top: calc(var(--node) + 3px);
    bottom: -11px;
    border-left: 2px solid var(--jk);
    transform-origin: top;
  }

  .stop .trail.lost {
    border-left-style: dashed;
    border-left-color: var(--color-text-danger);
  }

  .journey-note {
    margin: 0;
    color: var(--color-text-secondary);
    font-size: 12.5px;
  }

  @container found (min-width: 400px) {
    .journey {
      grid-auto-flow: column;
      grid-auto-columns: minmax(0, 1fr);
      column-gap: 12px;
    }

    .stop {
      grid-template-columns: minmax(0, 1fr);
      row-gap: 7px;
    }

    .stop .trail {
      left: calc(var(--node) + 4px);
      top: calc(var(--node) / 2 - 1px);
      bottom: auto;
      width: calc(100% + 12px - var(--node) - 8px);
      border-left: 0;
      border-top: 2px solid var(--jk);
      transform-origin: left;
    }

    .stop .trail.lost {
      border-top-style: dashed;
      border-top-color: var(--color-text-danger);
    }

  }

  .facts {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 8px 14px;
    margin: 0;
    padding-top: 12px;
    border-top: 1px solid var(--color-border-secondary);
  }

  .facts div {
    min-width: 0;
  }

  .facts dt {
    color: var(--color-text-tertiary);
    font-size: 11.5px;
    font-weight: 550;
  }

  .facts dd {
    margin: 1px 0 0;
    font-size: 13px;
    line-height: 1.35;
    overflow-wrap: anywhere;
  }

  .facts .wide {
    grid-column: 1 / -1;
  }

  .found-actions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .found-actions .k-btn {
    padding: 8px 14px;
    font-size: 13px;
  }

  .ico-sm {
    width: 15px;
    height: 15px;
  }

  /* the move form */
  .move {
    display: grid;
    gap: 10px;
    padding: 12px;
    border-radius: var(--border-radius-md, 10px);
    background: var(--k-accent-bg);
  }

  .move-title {
    margin: 0;
    font-size: 13px;
    font-weight: 650;
  }

  .places,
  .statuses {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
  }

  .move .k-chip:not(.on) {
    background: var(--color-background-primary, Canvas);
  }

  .move label {
    display: grid;
    gap: 3px;
    font-size: 11.5px;
    font-weight: 550;
    color: var(--color-text-secondary);
    min-width: 0;
  }

  .move .k-field {
    width: 100%;
    font-size: 13px;
    background: var(--color-background-primary, Canvas);
  }

  .move-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 8px;
  }

  .move-grid .wide {
    grid-column: 1 / -1;
  }

  @container found (max-width: 330px) {
    .move-grid,
    .facts {
      grid-template-columns: minmax(0, 1fr);
    }
  }

  /* ── jobs in motion ── */
  .jobs {
    padding: 0 16px 14px;
  }

  .sec-head {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin: 0 0 8px;
  }

  .sec-head h2 {
    margin: 0;
    font-size: 14px;
    font-weight: 700;
  }

  .sec-head .k-mut {
    font-size: 12px;
  }

  .job-strip {
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(132px, 1fr));
    gap: 8px;
  }

  .job-pill {
    display: grid;
    gap: 5px;
    width: 100%;
    height: 100%;
    padding: 9px 10px 10px;
    border: 1px solid var(--color-border-secondary);
    border-radius: var(--border-radius-md, 10px);
    background: transparent;
    color: inherit;
    text-align: left;
    cursor: pointer;
    transition: border-color var(--k-t-fast), background var(--k-t-fast);
  }

  .job-pill:hover {
    background: var(--k-ink-4);
  }

  .job-pill[aria-pressed="true"] {
    border-color: var(--jk);
    box-shadow: inset 0 0 0 1px var(--jk);
  }

  .job-pill .top {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 6px;
  }

  .job-pill b {
    font-size: 14px;
    font-weight: 700;
    line-height: 1.2;
    overflow-wrap: anywhere;
  }

  .job-pill .pct {
    font-size: 12px;
    font-weight: 650;
    color: var(--jk);
    font-variant-numeric: tabular-nums;
  }

  .bar {
    height: 4px;
    border-radius: 99px;
    background: var(--jk-line);
    overflow: hidden;
  }

  .bar i {
    display: block;
    height: 100%;
    width: var(--p, 0%);
    border-radius: inherit;
    background: var(--jk);
    transition: width var(--k-t-slow) var(--k-ease);
  }

  .job-pill .meta {
    font-size: 11.5px;
    line-height: 1.35;
    color: var(--color-text-secondary);
  }

  .job-pill .meta .warn {
    color: var(--color-text-warning);
  }

  .job-pill .meta .bad {
    color: var(--color-text-danger);
  }

  .job-pill.paused b,
  .job-pill.upcoming b {
    color: var(--color-text-secondary);
  }

  /* ── the lower panel ── */
  .panel {
    margin: 0 16px 14px;
    border-top: 1px solid var(--color-border-secondary);
    padding-top: 12px;
  }

  .panel-tabs {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 12px;
  }

  .panel-tabs .k-tab .n {
    font-variant-numeric: tabular-nums;
    opacity: .7;
  }

  .job-head {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    flex-wrap: wrap;
  }

  .job-head .ttl {
    flex: 1 1 220px;
    min-width: 0;
  }

  .job-head h3 {
    margin: 0;
    font-size: 18px;
    font-weight: 700;
    line-height: 1.2;
  }

  .job-head p {
    margin: 2px 0 0;
    color: var(--color-text-secondary);
    font-size: 12.5px;
  }

  .job-head .badges {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }

  .k-badge.bad-t {
    background: color-mix(in oklab, var(--color-text-danger) 12%, transparent);
    color: var(--color-text-danger);
  }

  .next-move {
    margin: 12px 0 0;
    padding: 9px 12px;
    border-left: 3px solid var(--jk);
    border-radius: 0 var(--border-radius-md, 10px) var(--border-radius-md, 10px) 0;
    background: var(--k-accent-bg);
    font-size: 13.5px;
    line-height: 1.4;
  }

  .next-move span {
    display: block;
    color: var(--color-text-secondary);
    font-size: 11.5px;
    font-weight: 550;
  }

  .job-cols {
    display: grid;
    grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr);
    gap: 18px;
    margin-top: 14px;
  }

  .col-h {
    margin: 0 0 6px;
    color: var(--color-text-secondary);
    font-size: 12px;
    font-weight: 650;
  }

  .actions {
    list-style: none;
    margin: 0;
    padding: 0;
  }

  .action {
    display: grid;
    grid-template-columns: 24px minmax(0, 1fr);
    gap: 9px;
    padding: 7px 0;
    border-bottom: 1px solid var(--color-border-secondary);
  }

  .action:last-child {
    border-bottom: 0;
  }

  .check {
    display: grid;
    place-items: center;
    width: 22px;
    height: 22px;
    margin-top: 1px;
    padding: 0;
    border-radius: 50%;
    border: 1.5px solid var(--color-border-primary);
    background: transparent;
    color: var(--jk-on);
    cursor: pointer;
    transition: background var(--k-t-fast), border-color var(--k-t-fast);
  }

  .check:hover {
    border-color: var(--jk);
  }

  .check svg {
    width: 13px;
    height: 13px;
    opacity: 0;
  }

  .action.done .check {
    background: var(--jk);
    border-color: var(--jk);
    cursor: default;
  }

  .action.done .check svg {
    opacity: 1;
  }

  .action.blocked .check {
    border-color: var(--color-text-danger);
    border-style: dashed;
  }

  .action b {
    display: block;
    font-size: 13px;
    font-weight: 600;
    line-height: 1.35;
  }

  .action.done b {
    color: var(--color-text-tertiary);
    text-decoration: line-through;
    font-weight: 500;
  }

  .action small {
    display: block;
    color: var(--color-text-secondary);
    font-size: 11.5px;
    line-height: 1.4;
  }

  .action small .bad {
    color: var(--color-text-danger);
    font-weight: 600;
  }

  .done-toggle {
    margin-top: 4px;
    padding: 4px 0;
    border: 0;
    background: none;
    color: var(--color-text-secondary);
    font-size: 12px;
    cursor: pointer;
  }

  .crew {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 14px;
  }

  .crew span {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12.5px;
  }

  .crew i {
    display: grid;
    place-items: center;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: var(--k-ink-7, var(--k-ink-4));
    font-size: 10.5px;
    font-style: normal;
    font-weight: 700;
  }

  .job-tools {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    margin-bottom: 14px;
  }

  .job-tools .k-chip.issue {
    border-color: color-mix(in oklab, var(--color-text-danger) 40%, transparent);
    color: var(--color-text-danger);
  }

  .job-note {
    margin: 0;
    color: var(--color-text-secondary);
    font-size: 12.5px;
    line-height: 1.45;
  }

  /* site wire */
  .composer {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 150px);
    gap: 8px;
    margin-bottom: 12px;
  }

  .composer .k-field {
    width: 100%;
    font-size: 13px;
  }

  .composer textarea {
    grid-column: 1 / -1;
    min-height: 58px;
    resize: vertical;
  }

  .composer .row {
    grid-column: 1 / -1;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .wire {
    list-style: none;
    margin: 0;
    padding: 0 4px 0 0;
    max-height: 380px;
    overflow-y: auto;
  }

  .post {
    display: grid;
    grid-template-columns: 28px minmax(0, 1fr);
    gap: 10px;
    padding: 9px 0;
    border-bottom: 1px solid var(--color-border-secondary);
  }

  .post:last-child {
    border-bottom: 0;
  }

  .post .av {
    display: grid;
    place-items: center;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: var(--k-ink-7, var(--k-ink-4));
    font-size: 11px;
    font-weight: 700;
  }

  .post .hd {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 4px 8px;
    font-size: 12px;
    color: var(--color-text-secondary);
  }

  .post .hd b {
    color: var(--color-text-primary);
    font-size: 13px;
  }

  .post p {
    margin: 2px 0 0;
    font-size: 13px;
    line-height: 1.45;
  }

  .post.blocker .kind {
    color: var(--color-text-danger);
    font-weight: 600;
  }

  .post.pending {
    opacity: .6;
  }

  .foot {
    padding: 0 16px 14px;
    color: var(--color-text-tertiary);
    font-size: 11.5px;
  }

  /* empty state */
  .empty {
    display: grid;
    gap: 12px;
    justify-items: start;
    padding: 12px 16px 20px;
  }

  .empty svg.art {
    width: 150px;
    height: 70px;
    color: var(--jk);
  }

  .empty h2 {
    margin: 0;
    font-size: 20px;
    font-weight: 700;
  }

  .empty p {
    margin: 0;
    max-width: 52ch;
    color: var(--color-text-secondary);
    font-size: 13.5px;
    line-height: 1.5;
  }

  .empty details.bulk {
    width: 100%;
    max-width: 520px;
  }

  body[data-density="compact"] .tool-row {
    padding-block: 6px;
  }

  body[data-density="compact"] .found {
    gap: 9px;
  }

  @media (max-width: 600px) {
    .locator {
      grid-template-columns: minmax(0, 1fr);
      grid-template-areas:
        "search"
        "found"
        "filters"
        "list";
      grid-template-rows: none;
      row-gap: 10px;
    }

    .tool-list {
      max-height: 232px;
    }

    .job-strip {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .job-cols {
      grid-template-columns: minmax(0, 1fr);
      gap: 12px;
    }

    .composer {
      grid-template-columns: minmax(0, 1fr);
    }

    .found h2 {
      font-size: 23px;
    }
  }

  /* ── motion: the line runs on to the new place ── */
  @media (prefers-reduced-motion: no-preference) {
    .stop .trail-in {
      animation: jk-grow-y 460ms var(--k-spring, cubic-bezier(.34, 1.4, .64, 1)) both;
    }

    .stop.fresh .node {
      animation: jk-drop 420ms var(--k-spring, cubic-bezier(.34, 1.4, .64, 1)) 300ms both;
    }

    .stop.fresh .txt {
      animation: jk-fade 260ms var(--k-ease) 380ms both;
    }

    @container found (min-width: 400px) {
      .stop .trail-in {
        animation-name: jk-grow-x;
      }
    }

    .action.just .check {
      animation: jk-pop 360ms var(--k-spring, cubic-bezier(.34, 1.4, .64, 1));
    }
  }

  @keyframes jk-grow-x {
    from { transform: scaleX(0); }
    to { transform: scaleX(1); }
  }

  @keyframes jk-grow-y {
    from { transform: scaleY(0); }
    to { transform: scaleY(1); }
  }

  @keyframes jk-drop {
    0% { transform: translateY(-10px) scale(.5); opacity: 0; }
    100% { transform: none; opacity: 1; }
  }

  @keyframes jk-fade {
    from { opacity: 0; transform: translateY(3px); }
    to { opacity: 1; transform: none; }
  }

  @keyframes jk-pop {
    0% { transform: scale(.6); }
    100% { transform: scale(1); }
  }
</style>
</head>
<body>
<main class="k-stage jk">
  <header class="k-appbar jk-bar">
    <span class="k-appmark jk-mark" aria-hidden="true">
      <svg class="ico" viewBox="0 0 24 24"><path d="M12 21s6.5-5.8 6.5-11A6.5 6.5 0 0 0 5.5 10c0 5.2 6.5 11 6.5 11z"/><path d="M9.6 10.8l3.6-3.6M12.2 7.2a1.6 1.6 0 1 0 1.6 1.6"/></svg>
    </span>
    <div class="k-appcopy">
      <h1 data-i18n="appName">Job Kit</h1>
      <p class="k-sub" id="shift-date"></p>
    </div>
    <button class="k-btn sec" id="handover-button" type="button">
      <svg class="ico ico-sm" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.8l1.3 3.4 3.4 1.3-3.4 1.3L8 11.2 6.7 7.8 3.3 6.5l3.4-1.3zM12.6 10.6l.6 1.5 1.5.6-1.5.6-.6 1.5-.6-1.5-1.5-.6 1.5-.6z"/></svg>
      <span data-i18n="askHandover">Ask for handover</span>
    </button>
  </header>

  <div class="status-strip" id="status-strip" role="status" hidden><span id="status-message"></span></div>

  <section class="empty" id="empty-state" hidden>
    <svg class="art ico" viewBox="0 0 150 70" aria-hidden="true">
      <path d="M8 52 L30 38 L52 52 V66 H8 Z M24 66 V56 H36 V66"/>
      <path d="M58 58 H96" stroke-dasharray="3 5"/>
      <path d="M114 64 s14-12.5 14-24 a14 14 0 0 0-28 0 c0 11.5 14 24 14 24z"/>
      <circle cx="114" cy="40" r="5"/>
    </svg>
    <h2 data-i18n="emptyTitle">Make every tool findable</h2>
    <p data-i18n="emptyBody">Tell the AI your jobs, crew and tools — or paste the tool list below. Nothing is invented; the locator lights up as soon as the first rows are saved.</p>
    <button class="k-btn accent" id="setup-button" type="button" data-i18n="askSetup">Ask AI to set it up</button>
    <details class="bulk" id="empty-bulk" open></details>
  </section>

  <div id="app-content" hidden>
    <section class="locator" aria-label="Tool locator" data-i18n-aria="toolLocator">
      <form class="loc-search" id="tool-search-form" role="search">
        <svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5 14 14"/></svg>
        <input class="k-field" id="tool-search-input" type="search" autocomplete="off" data-i18n-placeholder="searchPlaceholder" data-i18n-aria="searchLabel">
      </form>
      <div class="loc-filters" id="loc-filters"></div>
      <div class="loc-listwrap">
        <ul class="tool-list" id="tool-list"></ul>
        <details class="bulk" id="list-bulk">
          <summary data-i18n="pasteTools">Add tools in bulk</summary>
          <textarea class="k-field" id="bulk-tool-input" data-i18n-placeholder="bulkPlaceholder"></textarea>
          <p class="bulk-help" data-i18n="bulkHelp"></p>
          <div><button class="k-btn accent" id="bulk-tool-button" type="button" data-i18n="addTools">Add these tools</button></div>
        </details>
      </div>

      <article class="found" id="found">
        <div class="found-meta">
          <span class="code" id="found-code"></span>
          <span class="k-badge" id="found-status"></span>
        </div>
        <h2 id="found-name"></h2>
        <ol class="journey" id="journey"></ol>
        <p class="journey-note" id="journey-note" hidden></p>
        <dl class="facts" id="facts"></dl>
        <div class="found-actions" id="found-actions">
          <button class="k-btn accent" id="move-button" type="button">
            <svg class="ico ico-sm" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 14s4.5-4 4.5-7.5a4.5 4.5 0 0 0-9 0C3.5 10 8 14 8 14z"/><circle cx="8" cy="6.5" r="1.4"/></svg>
            <span data-i18n="updateLocation">Update location</span>
          </button>
          <button class="k-btn ghost" id="ask-tool-button" type="button">
            <svg class="ico ico-sm" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.8l1.3 3.4 3.4 1.3-3.4 1.3L8 11.2 6.7 7.8 3.3 6.5l3.4-1.3z"/></svg>
            <span data-i18n="askHolder">Ask about this tool</span>
          </button>
        </div>
        <form class="move" id="move-form" hidden>
          <p class="move-title" id="move-title"></p>
          <div class="places" id="move-places"></div>
          <div class="move-grid">
            <label class="wide"><span data-i18n="nowAtField">Where exactly</span>
              <input class="k-field" id="move-location" list="known-places" autocomplete="off">
            </label>
            <label><span data-i18n="holder">With</span>
              <input class="k-field" id="move-holder" autocomplete="off">
            </label>
            <label><span data-i18n="job">Job</span>
              <select class="k-field" id="move-job"></select>
            </label>
            <div class="wide statuses" id="move-statuses" role="radiogroup"></div>
            <label class="wide"><span data-i18n="note">Note</span>
              <input class="k-field" id="move-note" autocomplete="off">
            </label>
          </div>
          <div class="found-actions">
            <button class="k-btn accent" id="move-save" type="submit" data-i18n="saveMove">Move it here</button>
            <button class="k-btn ghost" id="move-cancel" type="button" data-i18n="cancel">Cancel</button>
          </div>
          <datalist id="known-places"></datalist>
        </form>
        <p class="list-empty" id="found-empty" hidden></p>
      </article>
    </section>

    <section class="jobs" id="jobs">
      <div class="sec-head">
        <h2 data-i18n="jobsTitle">Jobs in motion</h2>
        <span class="k-mut" id="jobs-count"></span>
      </div>
      <ul class="job-strip" id="job-strip"></ul>
    </section>

    <section class="panel" id="panel">
      <div class="panel-tabs">
        <div class="k-tabs" role="tablist">
          <button class="k-tab on" type="button" role="tab" data-tab="job" id="tab-job"></button>
          <button class="k-tab" type="button" role="tab" data-tab="wire" id="tab-wire"></button>
        </div>
      </div>

      <div id="pane-job" role="tabpanel">
        <div class="job-head">
          <div class="ttl">
            <h3 id="job-title"></h3>
            <p id="job-address"></p>
          </div>
          <div class="badges" id="job-badges"></div>
        </div>
        <p class="next-move" id="job-next"></p>
        <div class="job-cols">
          <div>
            <p class="col-h" data-i18n="stillOpen">To do</p>
            <ul class="actions" id="job-actions"></ul>
            <button class="done-toggle" id="done-toggle" type="button" hidden></button>
          </div>
          <div>
            <p class="col-h" data-i18n="crew">Crew</p>
            <div class="crew" id="job-crew"></div>
            <p class="col-h" data-i18n="gearOnJob">Gear on this job</p>
            <div class="job-tools" id="job-tools"></div>
            <p class="job-note" id="job-note"></p>
          </div>
        </div>
      </div>

      <div id="pane-wire" role="tabpanel" hidden>
        <form class="composer" id="update-form">
          <select class="k-field" id="update-job" data-i18n-aria="job"></select>
          <input class="k-field" id="update-author" autocomplete="name" data-i18n-placeholder="yourName" data-i18n-aria="yourName">
          <textarea class="k-field" id="update-message" data-i18n-placeholder="updatePlaceholder" data-i18n-aria="whatChanged"></textarea>
          <div class="row">
            <button class="k-btn accent" id="update-save" type="submit" data-i18n="saveUpdate">Post update</button>
            <button class="k-btn ghost" id="update-ai" type="button" data-i18n="talkItThrough">Ask me step by step</button>
          </div>
        </form>
        <ul class="wire" id="wire"></ul>
      </div>
    </section>

    <p class="foot" id="foot"></p>
  </div>
</main>
