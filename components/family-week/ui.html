<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Family Week</title>
<meta name="description" content="The family's week on the fridge door: who is cooking each dinner, the shopping bag filling as things get bought, this weekend's plan, plus notes, chores and birthdays — shared by the whole house and the AI.">
<meta name="oma-category" content="Family">
<style>
  /* Shared primitives (.k-*) — this app's own copy; nothing here comes from the engine. */
  :root{--k-accent:var(--color-text-info,var(--color-ring-primary,#3b6cf6));--k-bad:var(--color-text-danger,#e5484d);--k-ink-4:color-mix(in oklab,var(--color-text-primary) 4%,transparent);--k-t-fast:120ms;--k-t:180ms;--k-ease:cubic-bezier(.2,.8,.3,1);--k-spring:cubic-bezier(.34,1.56,.64,1);--k-surface:var(--color-background-primary)}
  @media (prefers-reduced-motion:reduce){:root{--k-t-fast:0ms;--k-t:0ms}}
  .k-sub,.k-mut{font-size:var(--font-text-sm-size,12.5px)}
  .k-sub{color:var(--color-text-secondary)}
  .k-mut{color:var(--color-text-tertiary)}
  .k-num{font-variant-numeric:tabular-nums}
  .k-grow{flex:1;min-width:0}
  .k-btn{display:inline-flex;align-items:center;gap:6px;border:1px solid transparent;border-radius:var(--border-radius-md,10px);padding:6px 12px;font:inherit;font-size:var(--font-text-sm-size,12.5px);font-weight:600;cursor:pointer;background:var(--color-background-inverse);color:var(--color-text-inverse);transition:transform var(--k-t-fast) var(--k-ease),opacity var(--k-t-fast),background var(--k-t-fast)}
  .k-btn:hover{opacity:.9}
  .k-btn:active{transform:scale(.96)}
  .k-btn:disabled{opacity:.45;cursor:default;transform:none}
  .k-btn.sec{background:transparent;color:var(--color-text-primary);border-color:var(--color-border-primary)}
  .k-btn.ghost{background:transparent;color:var(--color-text-secondary)}
  :is(.k-btn.sec,.k-btn.ghost):hover{background:var(--k-ink-4);color:var(--color-text-primary);opacity:1}
  .k-btn.danger{background:transparent;color:var(--k-bad);border-color:color-mix(in oklab,var(--k-bad) 30%,transparent)}
  .k-btn.danger:hover{background:color-mix(in oklab,var(--k-bad) 10%,transparent);opacity:1}
  :is(.k-btn,.k-tab,.k-chip,.k-switch,.k-field):focus-visible{outline:2px solid var(--color-ring-primary,var(--k-accent));outline-offset:1px}
  .k-chip{display:inline-flex;align-items:center;gap:5px;border-radius:var(--border-radius-full,999px);border:1px solid var(--color-border-secondary);background:transparent;color:var(--color-text-secondary);padding:2px 10px;font:inherit;font-size:11.5px;font-weight:550;cursor:pointer;transition:background var(--k-t-fast),color var(--k-t-fast),border-color var(--k-t-fast),transform var(--k-t) var(--k-spring)}
  .k-chip:hover{background:var(--k-ink-4);color:var(--color-text-primary)}
  .k-chip:active{transform:scale(.93)}
  .k-chip.on{background:color-mix(in oklab,var(--k-accent) 10%,transparent);border-color:color-mix(in oklab,var(--k-accent) 28%,transparent);color:var(--k-accent)}
  .k-chip.static{cursor:default}
  .k-chip.static:hover{background:transparent;color:var(--color-text-secondary)}
  .k-chip.static:active{transform:none}
  .k-tabs{display:inline-flex;gap:2px;padding:3px;background:var(--color-background-secondary);border-radius:var(--border-radius-md,10px)}
  .k-tab{display:inline-flex;align-items:center;gap:6px;border:none;background:transparent;color:var(--color-text-secondary);cursor:pointer;font:inherit;font-size:var(--font-text-sm-size,12.5px);font-weight:550;padding:5px 12px;border-radius:var(--border-radius-sm,7px);transition:background var(--k-t) var(--k-ease),color var(--k-t)}
  .k-tab.on{background:var(--color-background-primary);color:var(--color-text-primary);box-shadow:var(--shadow-sm)}
  .k-field{padding:6px 10px;border-radius:var(--border-radius-md,10px);border:1px solid var(--color-border-primary);background:transparent;color:inherit;font:inherit;font-size:var(--font-text-sm-size,12.5px);transition:border-color var(--k-t-fast),box-shadow var(--k-t-fast)}
  .k-field::placeholder{color:var(--color-text-tertiary)}
  .k-field:focus{outline:none;border-color:var(--k-accent);box-shadow:0 0 0 3px color-mix(in oklab,var(--k-accent) 10%,transparent)}
  .k-appbar{display:flex;align-items:center;gap:11px;padding:13px 16px}
  .k-appbar .k-appmark{display:grid;width:34px;height:34px;flex:none;place-items:center;border-radius:11px}
  .k-appbar .k-appmark svg{width:18px;height:18px}
  .k-appbar .k-appcopy{min-width:0;flex:1}
  .k-appbar .k-eyebrow{display:block;margin:0;color:var(--color-text-tertiary);font-size:9.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
  .k-appbar h1{margin:1px 0 0;font-size:15px;font-weight:650;letter-spacing:-.015em}
  body:not(.standalone) .k-appbar{border-bottom:1px solid var(--color-border-secondary);background:var(--k-surface)}
  .k-stage{max-width:760px;margin-inline:auto;overflow-x:clip}

  /* Identity: ONE accent of the app's own (teal). Everything structural is a host token. */
  .fw {
    --fw: light-dark(#00807a, #48d1c5);
    --fw-on: var(--color-background-primary);
    --fw-soft: color-mix(in oklab, var(--fw) 10%, transparent);
    --fw-line: color-mix(in oklab, var(--fw) 32%, transparent);
    --k-accent: var(--fw);
    --line: var(--color-border-secondary);
  }
  .fw-mark {
    color: var(--fw);
    background: var(--fw-soft);
    border: 1px solid var(--fw-line);
  }
  .fw-ai {
    background: var(--fw);
    color: var(--fw-on);
    white-space: nowrap;
  }
  .fw-ai svg { width: 15px; height: 15px; }
  .fw-err {
    margin: 10px 16px 0;
    padding: 8px 10px;
    border-radius: var(--border-radius-md, 10px);
    color: var(--color-text-danger);
    background: color-mix(in oklab, var(--color-text-danger) 9%, transparent);
    font-size: 12.5px;
  }
  .fw-welcome {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px 12px;
    margin: 12px 16px 0;
    color: var(--color-text-secondary);
    font-size: 13px;
  }
  .fw-welcome span { flex: 1 1 260px; }

  /* ── the fridge: two doors, a handle each. Top door = who cooks; bottom door = what's pinned ── */
  .fw-fridge {
    display: grid;
    gap: 5px;
    margin: 14px 16px 0;
  }
  .fw-door {
    position: relative;
    padding: 12px 24px 14px 14px;
    border: 1px solid var(--color-border-primary);
    background: var(--color-background-primary);
  }
  .fw-top { border-radius: 18px 18px 6px 6px; }
  .fw-bottom { border-radius: 6px 6px 18px 18px; }
  .fw-handle {
    position: absolute;
    right: 9px;
    width: 5px;
    border-radius: 999px;
    background: var(--color-border-primary);
  }
  .fw-top .fw-handle { bottom: 16px; height: 46px; }
  .fw-bottom .fw-handle { top: 16px; height: 72px; }
  .fw-cap {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 8px;
    margin: 0 0 8px 2px;
    color: var(--color-text-tertiary);
    font-size: 11.5px;
    font-weight: 600;
  }
  .fw-cap b { color: var(--fw); font-weight: 650; }

  /* ── the week: seven magnets, a face per day ── */
  .fw-week {
    display: grid;
    grid-template-columns: repeat(7, minmax(0, 1fr));
    gap: 4px;
  }
  .fw-mag {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    min-width: 0;
    padding: 7px 3px 8px;
    border: 0;
    border-radius: 12px;
    background: transparent;
    color: var(--color-text-primary);
    font: inherit;
    cursor: pointer;
    transition: background var(--k-t-fast) var(--k-ease);
  }
  .fw-mag:hover { background: var(--k-ink-4, color-mix(in oklab, var(--color-text-primary) 5%, transparent)); }
  .fw-mag.is-sel { background: var(--fw-soft); }
  .fw-mag:focus-visible { outline: 2px solid var(--color-ring-primary, var(--fw)); outline-offset: 1px; }
  .fw-mag-d {
    display: flex;
    align-items: center;
    gap: 4px;
    color: var(--color-text-secondary);
    font-size: 11.5px;
    font-weight: 600;
    white-space: nowrap;
  }
  .fw-mag-d .dn { color: var(--color-text-tertiary); font-variant-numeric: tabular-nums; }
  .fw-mag.is-today .fw-mag-d, .fw-mag.is-today .fw-mag-d .dn { color: var(--fw); }
  .fw-face {
    display: grid;
    place-items: center;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 1.5px dashed var(--color-border-primary);
    color: var(--color-text-tertiary);
    font-size: 14px;
    font-weight: 700;
    letter-spacing: -.01em;
    box-shadow: 0 1px 0 color-mix(in oklab, var(--color-text-primary) 8%, transparent);
  }
  .fw-face { position: relative; }
  .fw-face > svg { width: 14px; height: 14px; }
  .fw-flag {
    position: absolute;
    top: -5px;
    right: -7px;
    display: grid;
    place-items: center;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    border: 1px solid var(--fw-line);
    background: var(--color-background-primary);
    color: var(--fw);
  }
  .fw-flag svg { width: 11px; height: 11px; }
  .fw-mag.has-cook .fw-face {
    border: 0;
    background: var(--fw);
    color: var(--fw-on);
    box-shadow: 0 2px 5px color-mix(in oklab, var(--fw) 30%, transparent);
  }
  .fw-mag.no-cook .fw-face { border-style: solid; border-color: var(--fw-line); color: var(--fw); background: var(--fw-soft); }
  .fw-mag.is-today .fw-face { outline: 2px solid var(--fw); outline-offset: 3px; }
  .fw-mag.is-past .fw-face { opacity: .55; }
  .fw-mag.is-past .fw-mag-dish { color: var(--color-text-tertiary); }
  .fw-mag-dish {
    max-width: 100%;
    color: var(--color-text-secondary);
    font-size: 11.5px;
    line-height: 1.3;
    text-align: center;
    overflow-wrap: anywhere;
  }

  /* ── the bottom door: tonight · the shopping bag · this weekend ── */
  .fw-pins {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr);
    grid-template-areas: "day shop" "wknd shop";
    grid-template-rows: auto 1fr;
    gap: 12px;
  }
  .fw-note {
    position: relative;
    min-width: 0;
    padding: 14px 14px 12px;
    border-radius: 12px;
    background: var(--color-background-secondary);
  }
  .fw-note::before {                                   /* the magnet holding the note up */
    content: "";
    position: absolute;
    top: -4px;
    left: 50%;
    width: 18px;
    height: 8px;
    margin-left: -9px;
    border-radius: 999px;
    background: var(--fw);
    opacity: .85;
  }
  .fw-day { grid-area: day; }
  .fw-shop { grid-area: shop; display: flex; flex-direction: column; }
  .fw-wknd { grid-area: wknd; }
  .fw-kick {
    margin: 0 0 4px;
    color: var(--fw);
    font-size: 11.5px;
    font-weight: 650;
  }
  .fw-dish {
    margin: 0;
    font-size: 21px;
    font-weight: 700;
    line-height: 1.15;
    letter-spacing: -.02em;
    overflow-wrap: anywhere;
  }
  .fw-dish.is-empty { color: var(--color-text-tertiary); font-weight: 600; }
  .fw-cook {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px;
    margin-top: 8px;
    font-size: 13px;
  }
  .fw-mini {
    display: inline-grid;
    place-items: center;
    width: 22px;
    height: 22px;
    flex: none;
    border-radius: 50%;
    background: var(--fw);
    color: var(--fw-on);
    font-size: 10.5px;
    font-weight: 700;
  }
  .fw-mini.ghost { background: transparent; color: var(--color-text-secondary); border: 1px solid var(--color-border-primary); }
  .fw-memo {
    margin: 8px 0 0;
    color: var(--color-text-secondary);
    font-size: 12.5px;
    line-height: 1.45;
  }
  .fw-acts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .fw-acts .k-btn { padding: 5px 10px; }
  .fw-save { background: var(--fw); color: var(--fw-on); }
  .fw-form { display: grid; gap: 8px; }
  .fw-form label { display: grid; gap: 3px; color: var(--color-text-secondary); font-size: 11.5px; font-weight: 600; }
  .fw-form .k-field { width: 100%; }
  .fw-form .fw-acts { margin-top: 2px; }
  .fw-form .k-grow { flex: 1; }

  .fw-wrow {
    display: grid;
    grid-template-columns: 34px minmax(0, 1fr) auto;
    gap: 2px 8px;
    align-items: start;
    padding: 7px 0;
  }
  .fw-wrow + .fw-wrow { border-top: 1px solid var(--line); }
  .fw-wday { padding-top: 1px; color: var(--color-text-secondary); font-size: 11.5px; font-weight: 650; line-height: 1.25; }
  .fw-wday span { display: block; color: var(--color-text-tertiary); font-weight: 500; font-variant-numeric: tabular-nums; }
  .fw-wplan { font-size: 13.5px; font-weight: 650; line-height: 1.3; overflow-wrap: anywhere; }
  .fw-wplan.is-empty { color: var(--color-text-tertiary); font-weight: 500; }
  .fw-wmeta { display: flex; flex-wrap: wrap; align-items: center; gap: 3px; margin-top: 4px; color: var(--color-text-secondary); font-size: 12px; }
  .fw-wmeta .fw-mini { width: 20px; height: 20px; font-size: 10px; }
  .fw-wmeta p { flex-basis: 100%; margin: 3px 0 0; }
  .fw-wbtns { display: flex; align-items: center; gap: 2px; }
  .fw-wbtns .k-btn { padding: 3px 8px; font-size: 12px; }
  .fw-icon { width: 14px; height: 14px; }
  .fw-last { margin: 6px 0 0; color: var(--color-text-tertiary); font-size: 11.5px; }

  /* the bag */
  .fw-bag-head { display: flex; align-items: center; gap: 12px; }
  .fw-bag { width: 82px; height: 90px; flex: none; color: var(--fw); overflow: visible; }
  .fw-bag .body { fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linejoin: round; }
  .fw-bag .line { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .fw-bag .fill { fill: color-mix(in oklab, var(--fw) 24%, transparent); transform: translateY(calc((1 - var(--lvl, 0)) * 68px)); }
  .fw-bag .crest { fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; opacity: .55; transform: translateY(calc((1 - var(--lvl, 0)) * 68px)); }
  .fw-bag .peek { opacity: 0; transform: translateY(8px); }
  .fw-bag.is-full .peek { opacity: 1; transform: none; }
  .fw-bag .drop { opacity: 0; fill: currentColor; }
  .fw-bag-num { display: flex; align-items: baseline; gap: 3px; }
  .fw-bag-num b {
    color: var(--fw);
    font-size: 40px;
    font-weight: 750;
    line-height: .95;
    letter-spacing: -.035em;
    font-variant-numeric: tabular-nums;
  }
  .fw-bag-num span { color: var(--color-text-tertiary); font-size: 17px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .fw-bag-cap { margin-top: 3px; color: var(--color-text-secondary); font-size: 12.5px; line-height: 1.35; }
  .fw-list {                                          /* fills whatever height the left column gives it */
    flex: 1 1 0;
    min-height: 170px;
    margin: 10px -6px 0;
    padding: 0 6px;
    overflow: auto;
    overscroll-behavior: contain;
  }
  .fw-aisle {
    display: flex;
    justify-content: space-between;
    padding: 8px 2px 2px;
    color: var(--color-text-tertiary);
    font-size: 11px;
    font-weight: 650;
  }
  .fw-item {
    display: flex;
    align-items: center;
    gap: 9px;
    width: 100%;
    min-height: 34px;
    padding: 5px 4px;
    border: 0;
    border-radius: 8px;
    background: transparent;
    color: var(--color-text-primary);
    font: inherit;
    font-size: 13.5px;
    text-align: left;
    cursor: pointer;
  }
  .fw-item:hover { background: color-mix(in oklab, var(--color-text-primary) 5%, transparent); }
  .fw-item:focus-visible { outline: 2px solid var(--color-ring-primary, var(--fw)); outline-offset: -2px; }
  .fw-tick {
    display: grid;
    place-items: center;
    width: 20px;
    height: 20px;
    flex: none;
    border: 1.6px solid var(--color-border-primary);
    border-radius: 50%;
    color: var(--fw-on);
    transition: background var(--k-t-fast) var(--k-ease), border-color var(--k-t-fast);
  }
  .fw-tick svg { width: 12px; height: 12px; opacity: 0; }
  .fw-item.is-done .fw-tick { background: var(--fw); border-color: var(--fw); }
  .fw-item.is-done .fw-tick svg { opacity: 1; }
  .fw-item-t { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .fw-item-t small { margin-left: 6px; color: var(--color-text-tertiary); font-size: 12px; }
  .fw-item.is-done .fw-item-t { color: var(--color-text-tertiary); text-decoration: line-through; text-decoration-color: color-mix(in oklab, var(--color-text-tertiary) 60%, transparent); }
  .fw-again { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; padding: 10px 2px 2px; color: var(--color-text-tertiary); font-size: 11.5px; }
  .fw-again .k-chip { font-size: 11.5px; }
  .fw-shop-empty { margin: 12px 2px 4px; color: var(--color-text-secondary); font-size: 12.5px; line-height: 1.45; }
  .fw-add { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .fw-add #shopItem { flex: 1 1 140px; min-width: 0; }
  .fw-add .fw-more { display: none; flex: 1 1 100%; gap: 6px; }
  .fw-add.is-typing .fw-more { display: flex; }
  .fw-add #shopQty { width: 84px; flex: none; }
  .fw-add #shopAisle { flex: 1; min-width: 0; }
  .fw-go { background: var(--fw); color: var(--fw-on); padding: 6px 11px; }
  .fw-go svg { width: 14px; height: 14px; }

  /* ── the rest of the fridge: notes · chores · dates ── */
  .fw-more-sec { margin: 16px 16px 16px; }
  .fw-tabs-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; }
  .fw-tabs-row .k-tab .k-num { color: var(--color-text-tertiary); font-size: 11px; }
  .fw-tabs-row .k-tab.on .k-num { color: var(--fw); }
  .fw-panel { max-height: 272px; margin-top: 10px; overflow: auto; overscroll-behavior: contain; }
  .fw-notes { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px 10px; padding-top: 6px; }
  .fw-bnote { padding: 13px 12px 10px; }
  .fw-bnote p { margin: 0; font-size: 13px; line-height: 1.45; overflow-wrap: anywhere; }
  .fw-bmeta { display: flex; align-items: center; gap: 6px; margin-top: 8px; color: var(--color-text-tertiary); font-size: 11.5px; }
  .fw-bmeta b { color: var(--color-text-secondary); font-weight: 600; }
  .fw-bmeta .fw-mini { width: 20px; height: 20px; font-size: 10px; }
  .fw-compose { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .fw-compose #boardNote { flex: 1 1 120px; min-width: 0; }
  .fw-compose #boardAuthor { width: 96px; flex: none; }
  .fw-rows { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 0 18px; }
  .fw-row { display: flex; align-items: center; gap: 10px; min-width: 0; padding: 9px 2px; border-bottom: 1px solid var(--line); }
  .fw-row .fw-mini { width: 30px; height: 30px; font-size: 12px; }
  .fw-row-t { flex: 1; min-width: 0; }
  .fw-row-t b { display: block; font-size: 13.5px; font-weight: 600; overflow-wrap: anywhere; }
  .fw-row-t span { display: block; color: var(--color-text-secondary); font-size: 12px; overflow-wrap: anywhere; }
  .fw-count { flex: none; min-width: 44px; text-align: center; }
  .fw-count b { display: block; color: var(--color-text-primary); font-size: 20px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
  .fw-count span { color: var(--color-text-tertiary); font-size: 10.5px; }
  .fw-count.is-soon b { color: var(--fw); }
  .fw-foot { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 10px; color: var(--color-text-secondary); font-size: 12.5px; }
  .fw-foot span { flex: 1 1 220px; }

  body[data-density="compact"] .fw-item { min-height: 28px; padding: 3px 4px; }
  body[data-density="compact"] .fw-note { padding: 11px 12px 10px; }

  @media (max-width: 560px) {
    .fw-fridge { margin-inline: 12px; }
    .fw-door { padding: 10px 18px 12px 8px; }
    .fw-handle { right: 6px; width: 4px; }
    .fw-week { gap: 1px; }
    .fw-mag { padding: 6px 0 7px; gap: 5px; }
    .fw-mag-d { flex-direction: column; gap: 0; font-size: 11px; }
    .fw-face { width: 34px; height: 34px; font-size: 13px; }
    .fw-mag-dish { display: none; }
    .fw-pins { grid-template-columns: minmax(0, 1fr); grid-template-areas: "day" "shop" "wknd"; grid-template-rows: none; }
    .fw-more-sec { margin-inline: 12px; }

</main>

  const weekdayLong = (iso) => fmt(iso, { weekday: "long" });
  const dayMonth = (iso) => fmt(iso, { month: "short", day: "numeric" });
  const longDate = (iso) => fmt(iso, { weekday: "long", month: "long", day: "numeric" });

  function weekDays(base = today()) {
    const start = WEEK_START[oma.pref("week_start", "monday")] ?? 1;
    const first = addDays(base, -((base.getDay() - start + 7) % 7));
    return Array.from({ length: 7 }, (_, i) => toISO(addDays(first, i)));
  }

  function parseWho(v) {
    if (Array.isArray(v)) return v.map(str).filter(Boolean);
    if (typeof v !== "string") return [];
    try {
      const p = JSON.parse(v);
      if (Array.isArray(p)) return p.map(str).filter(Boolean);
    } catch {}
    return v.split(/[,，、\n]/).map(str).filter(Boolean);
  }

  // Faces: one letter per person, two only where two people share a first letter.
  // Chinese names read by their last character (静, 雨, 妈).
  let faceMap = new Map();
  function faceOf(name) {
    const n = str(name);
    if (!n) return "?";
    if (faceMap.has(n)) return faceMap.get(n);
    return baseFace(n, 1);
  }
  function baseFace(n, len) {
    if (/[㐀-鿿]/.test(n)) return [...n.replace(/\s+/g, "")].at(-1);
    const parts = n.split(/[\s+&]+/).filter(Boolean);
    if (parts.length > 1 && len === 1) return (parts[0][0] + parts.at(-1)[0]).toUpperCase();
    return [...n].slice(0, len).join("").toUpperCase().replace(/^./, (c) => c.toUpperCase());
  }
  function mini(name, cls = "fw-mini") {
    const m = el("span", cls, faceOf(name));
    m.title = name;
    return m;
  }

  function aisleKey(a) {
    const s = str(a);
    return AISLE_ALIAS[s.toLowerCase()] || AISLE_ALIAS[s] || (s ? s : "other");
  }
  function aisleLabel(key) { return AISLES.includes(key) ? t(key) : key; }

  // ── reading: six collections, fetched and owned by the app ──────────────────────────────────
  function failure(r) {
    const s = r?.structuredContent;
    if (!r || r.isError || r.ok === false || s?.ok === false) {
      return r?.note || s?.note || r?.reason || s?.reason || r?.content?.[0]?.text || "error";
    }
    return null;
  }
  async function readCollection(name) {
    const r = await oma.callTool("data_list", { collection: name, limit: 500 });
    const bad = failure(r);
    if (bad) throw new Error(bad);
    const items = r?.structuredContent?.items;
    if (!Array.isArray(items)) throw new Error(name);
    return items;
  }
  // A preview document may carry all six collections in the bound snapshot (each row tagged
  // with its collection) — use them directly; otherwise read each collection.
  function embedded(items) {
    if (!Array.isArray(items) || !items.some((it) => it && KEYS.some((k) => it.collection === C[k]))) return null;
    const rows = {};
    for (const k of KEYS) rows[k] = items.filter((it) => it.collection === C[k]);
    return rows;
  }

  let pulling = null;
  let pullAgain = false;
  function pull() {
    pullAgain = true;
    if (pulling) return pulling;
    pulling = (async () => {
      while (pullAgain) {
        pullAgain = false;
        const start = ++pullSeq;
        let rows = embedded(oma.state?.items);
        // A preview's snapshot never changes, so there an acked op stays laid over it for good
        // (a visitor's tick keeps showing); a real store drops it once a later read carries it.
        const live = !rows;
        if (!rows) {
          const lists = await Promise.all(KEYS.map((k) => readCollection(C[k])));
          rows = Object.fromEntries(KEYS.map((k, i) => [k, lists[i]]));
        }
        for (let i = ops.length - 1; i >= 0; i--) {
          if (live && ops[i].ackSeq !== null && ops[i].ackSeq < start) ops.splice(i, 1);
        }
        model = rows;
        loaded = true;
        render();
      }
    })().catch((e) => {
      showErr(t("readFailed", { error: String(e?.message || e) }));
    }).finally(() => {
      pulling = null;
    });
    return pulling;
  }

  function rowsOf(key) {
    let rows = (model[key] || []).map((it) => ({ ...it, fields: { ...(it.fields || {}) } }));
    for (const op of ops) {
      if (op.key !== key) continue;
      if (op.kind === "add") {
        rows.push(op.item);
        continue;
      }
      const r = rows.find((x) => x.id === op.id);
      if (!r) continue;
      if (op.kind === "del") rows = rows.filter((x) => x !== r);
      else Object.assign(r.fields, op.fields);
    }
    return rows.sort((a, b) => (a.position ?? 0) - (b.position ?? 0));
  }

  // ── writing: optimistic, then the store's answer ─────────────────────────────────────────────
  async function write(op) {
    op.ackSeq = null;
    if (op.kind === "add") {
      op.item = { id: `tmp-${++tmpN}`, group: op.group, position: 1e9 + tmpN, fields: op.fields, version: 0 };
    }
    ops.push(op);
    render();
    let bad = null;
    try {
      const tool = op.kind === "add" ? "data_add_item" : op.kind === "patch" ? "data_update_item" : "data_delete_item";
      const args = op.kind === "add"
        ? { collection: C[op.key], group: op.group, fields: op.fields }
        : op.kind === "patch" ? { id: op.id, fields: op.fields } : { id: op.id };
      const r = await oma.callTool(tool, { command_id: uuid(), ...args, actor: "human" });
      bad = failure(r);
    } catch (e) {
      bad = String(e?.message || e);
    }
    if (bad) {
      ops.splice(ops.indexOf(op), 1);
      showErr(t("saveFailed", { error: bad }));
    } else {
      op.ackSeq = pullSeq;
      clearErr();
    }
    render();
    pull();
    return !bad;
  }

  let errTimer = 0;
  function showErr(msg) {
    clearTimeout(errTimer);
    $("err").textContent = msg;
    $("err").hidden = false;
    errTimer = setTimeout(() => { $("err").hidden = true; }, 7000);
  }
  function clearErr() {
    clearTimeout(errTimer);
    $("err").hidden = true;
  }

  async function ask(button, message) {
    button.disabled = true;
    try {
      const r = await oma.sendMessage(message);
      if (r && r.isError === true && !r.degraded) showErr(t("saveFailed", { error: "sendMessage" }));
    } catch (e) {
      showErr(String(e?.message || e));
    } finally {
      button.disabled = false;
    }
  }

  // ── derived views (everything computed from rows + today, nothing stored) ───────────────────
  function dinnerByDate() {
    const m = new Map();
    for (const it of rowsOf("dinners")) {
      const f = it.fields;
      if (validDate(f.date) && str(f.dish)) m.set(f.date, it);   // later position wins
    }
    return m;
  }
  function weekendByDate() {
    const m = new Map();
    for (const it of rowsOf("weekend")) {
      if (validDate(it.fields.date) && str(it.fields.plan)) m.set(it.fields.date, it);
    }
    return m;
  }
  function members() {
    const count = new Map();
    const bump = (n, w = 1) => { n = str(n); if (n && !/[+&]/.test(n)) count.set(n, (count.get(n) || 0) + w); };
    for (const it of rowsOf("chores")) parseWho(it.fields.members).forEach((n) => bump(n, 3));
    for (const it of rowsOf("dinners")) bump(it.fields.cook);
    for (const it of rowsOf("weekend")) parseWho(it.fields.who).forEach((n) => bump(n));
    for (const it of rowsOf("board")) bump(it.fields.author);
    return [...count].sort((a, b) => b[1] - a[1]).map(([n]) => n);
  }
  function buildFaces(people) {
    faceMap = new Map();
    const firsts = new Map();
    for (const p of people) {
      const f = baseFace(p, 1);
      firsts.set(f, (firsts.get(f) || 0) + 1);
    }
    for (const p of people) {
      const f = baseFace(p, 1);
      faceMap.set(p, firsts.get(f) > 1 && !/[㐀-鿿]/.test(p) ? baseFace(p, 2) : f);
    }
  }

  function shopModel() {
    const weekStart = dateOnly(weekDays()[0]);
    const active = [];
    const bag = [];
    const earlier = [];
    for (const it of rowsOf("shopping")) {
      if (!str(it.fields.item)) continue;
      const doneAt = it.fields.done_at ? new Date(it.fields.done_at) : null;
      if (!doneAt || settling.has(it.id)) active.push(it);
      else if (isNaN(doneAt) || doneAt >= weekStart) bag.push(it);
      else earlier.push(it);
    }
    // this week's trip = everything still to buy + what went into the bag since the week began
    const done = bag.length + active.filter((it) => it.fields.done_at).length;
    return { active, bag, earlier, done, total: active.length + bag.length };
  }

  // ── render ───────────────────────────────────────────────────────────────────────────────────
  function render() {
    document.documentElement.lang = lang() === "zh" ? "zh-CN" : "en";
    document.body.dataset.density = oma.pref("density", "comfortable");
    const people = members();
    buildFaces(people);
    $("people").replaceChildren(...people.map((p) => Object.assign(el("option"), { value: p })));
    renderChrome();
    renderWeek();
    renderDay();
    renderWeekend();
    renderShop();
    renderTabs();
    const empty = loaded && KEYS.every((k) => rowsOf(k).length === 0);
    $("welcome").hidden = !empty;
  }

  function renderChrome() {
    const days = weekDays();
    $("appName").textContent = t("appName");
    $("planNextLabel").textContent = t("planNext");
    $("weekLabel").textContent = `${dayMonth(days[0])} – ${dayMonth(days[6])}`;
    $("weekCap").textContent = t("weekCap");
    $("welcomeText").textContent = t("welcome");
    $("memoryBtn").textContent = t("memory");
    $("lDish").textContent = t("dish");
    $("lCook").textContent = t("cook");
    $("lNote").textContent = t("note");
    $("lPlan").textContent = t("plan");
    $("lWho").textContent = t("who");
    $("lWNote").textContent = t("note");
    for (const id of ["dinnerSave", "wkndSave"]) $(id).textContent = t("save");
    for (const id of ["dinnerCancel", "wkndCancel"]) $(id).textContent = t("cancel");
    $("dinnerClear").textContent = t("clear");
    $("wkndRemove").textContent = t("remove");
    $("shopItem").placeholder = t("addItem");
    $("shopQty").placeholder = t("qty");
    $("shopAdd").setAttribute("aria-label", t("addLabel"));
    $("boardNote").placeholder = t("writeNote");
    $("boardAuthor").placeholder = t("author");
    $("boardPost").textContent = t("post");
    $("tNotes").textContent = t("notes");
    $("tChores").textContent = t("chores");
    $("tDates").textContent = t("dates");
    const aisleSel = $("shopAisle");
    if (!aisleSel.options.length || aisleSel.dataset.lang !== lang()) {
      const keep = aisleSel.value;
      aisleSel.replaceChildren(...AISLES.map((k) => Object.assign(el("option", "", t(k)), { value: CANON[k] })));
      aisleSel.dataset.lang = lang();
      aisleSel.value = keep || CANON[aisleKey(oma.pref("default_aisle", "Produce"))] || "Produce";
    }
  }

  function selectedIso() {
    const days = weekDays();
    return sel && days.includes(sel) ? sel : toISO(today());
  }

  function renderWeek() {
    const days = weekDays();
    const dinners = dinnerByDate();
    const weekend = weekendByDate();
    const nowIso = toISO(today());
    const selIso = selectedIso();
    let planned = 0;
    const mags = days.map((iso) => {
      const it = dinners.get(iso);
      const f = it?.fields || {};
      const cook = str(f.cook);
      if (it) planned++;
      const b = el("button", "fw-mag");
      b.type = "button";
      b.classList.toggle("is-today", iso === nowIso);
      b.classList.toggle("is-sel", iso === selIso);
      b.classList.toggle("is-past", iso < nowIso);
      b.classList.add(it ? (cook ? "has-cook" : "no-cook") : "is-open");
      b.setAttribute("aria-pressed", String(iso === selIso));
      b.setAttribute("aria-label", [longDate(iso), it ? str(f.dish) : t("noDinner"), cook].filter(Boolean).join(" · "));
      const d = el("span", "fw-mag-d");
      d.append(el("span", "wd", weekdayShort(iso)), el("span", "dn", num(dateOnly(iso).getDate())));
      const face = el("span", "fw-face");
      if (cook) face.textContent = faceOf(cook);
      else if (it) face.textContent = "?";
      else face.append(svg("M8 4v8M4 8h8"));
      if (weekend.has(iso)) {
        const flag = el("span", "fw-flag");
        flag.title = str(weekend.get(iso).fields.plan);
        flag.append(svg("M4.5 14V2.5M4.5 3h7.5l-2 2.5 2 2.5H4.5"));
        face.append(flag);
      }
      if (popFace === iso) {
        face.classList.add("fw-pop");
        popFace = null;
      }
      b.append(d, face, el("span", "fw-mag-dish", it ? str(f.dish) : ""));
      b.onclick = () => {
        sel = iso;
        closeDinnerForm();
        renderWeek();
        renderDay();
      };
      return b;
    });
    $("week").replaceChildren(...mags);
    $("weekCount").textContent = t("claimed", { n: num(planned) });
  }

  function kicker(iso) {
    const n = daysUntil(iso);
    const rel = n === 0 ? t("tonight") : n === 1 ? t("tomorrow") : n === -1 ? t("yesterday") : weekdayLong(iso);
    return `${rel} · ${n === 0 || Math.abs(n) === 1 ? weekdayShort(iso) + " " : ""}${dayMonth(iso)}`;
  }

  function renderDay() {
    const view = $("dayView");
    if (editingDinner) return;
    view.hidden = false;
    const iso = selectedIso();
    const it = dinnerByDate().get(iso);
    const nodes = [el("div", "fw-kick", kicker(iso))];
    if (it) {
      const f = it.fields;
      const cook = str(f.cook);
      nodes.push(el("h2", "fw-dish", str(f.dish)));
      const row = el("div", "fw-cook");
      if (cook) {
        row.append(mini(cook), el("span", "", t(iso < toISO(today()) ? "cooked" : "cooks", { name: cook })));
      } else {
        row.append(el("span", "k-mut", t("whoCooks")));
        for (const p of members().slice(0, 5)) {
          const chip = btn("k-chip", "", () => {
            popFace = iso;
            write({ key: "dinners", kind: "patch", id: it.id, fields: { cook: p } });
          });
          chip.append(mini(p, "fw-mini ghost"), el("span", "", p));
          chip.style.paddingLeft = "3px";
          row.append(chip);
        }
      }
      nodes.push(row);
      if (str(f.note)) nodes.push(el("p", "fw-memo", str(f.note)));
      const acts = el("div", "fw-acts");
      const e = btn("k-btn ghost", t("edit"), () => openDinnerForm(iso, it));
      e.prepend(svg("M3 11.5V14h2.5L13 6.5 9.5 3 2 10.5zM8.5 4l3.5 3.5"));
      acts.append(e);
      nodes.push(acts);
    } else {
      nodes.push(el("h2", "fw-dish is-empty", t("noDinner")));
      const last = dinnerByDate().get(toISO(addDays(dateOnly(iso), -7)));
      const acts = el("div", "fw-acts");
      if (last) {
        const lf = last.fields;
        const p = el("p", "fw-memo", t("lastSame", { day: weekdayShort(iso), dish: str(lf.dish) }) + (str(lf.cook) ? ` · ${str(lf.cook)}` : ""));
        nodes.push(p);
        acts.append(btn("k-btn fw-save", t("repeat"), () => {
          popFace = iso;
          write({ key: "dinners", kind: "add", group: "week", fields: { date: iso, dish: str(lf.dish), cook: str(lf.cook), note: "" } });
        }));
      }
      acts.append(btn(last ? "k-btn ghost" : "k-btn sec", t("addDinner"), () => openDinnerForm(iso, null)));
      nodes.push(acts);
    }
    view.replaceChildren(...nodes);
  }

  function openDinnerForm(iso, item) {
    editingDinner = { iso, item };
    $("dayView").hidden = true;
    $("dinnerForm").hidden = false;
    $("dinnerFormDate").textContent = longDate(iso);
    $("dinnerDish").value = item?.fields.dish || "";
    $("dinnerCook").value = item?.fields.cook || "";
    $("dinnerNote").value = item?.fields.note || "";
    $("dinnerClear").hidden = !item;
    $("dinnerDish").focus({ preventScroll: true });
  }
  function closeDinnerForm() {
    editingDinner = null;
    $("dinnerForm").hidden = true;
    $("dayView").hidden = false;
  }

  function renderWeekend() {
    $("wkndKick").textContent = t("thisWeekend");
    if (editingWknd) return;
    const byDate = weekendByDate();
    const days = weekDays().filter((iso) => [6, 0].includes(dateOnly(iso).getDay()));
    const rows = days.map((iso) => {
      const it = byDate.get(iso);
      const r = el("div", "fw-wrow");
      const d = el("div", "fw-wday", weekdayShort(iso));
      d.append(el("span", "", num(dateOnly(iso).getDate())));
      const body = el("div");
      const btns = el("div", "fw-wbtns");
      if (it) {
        body.append(el("div", "fw-wplan", str(it.fields.plan)));
        const meta = el("div", "fw-wmeta");
        for (const p of parseWho(it.fields.who)) meta.append(mini(p));
        if (str(it.fields.note)) meta.append(el("p", "", str(it.fields.note)));
        if (meta.childNodes.length) body.append(meta);
        const e = btn("k-btn ghost", "", () => openWkndForm(iso, it));
        e.setAttribute("aria-label", t("edit"));
        e.append(svg("M3 11.5V14h2.5L13 6.5 9.5 3 2 10.5zM8.5 4l3.5 3.5"));
        btns.append(e);
      } else {
        body.append(el("div", "fw-wplan is-empty", t("nothingYet")));
        btns.append(
          btn("k-btn sec", t("ideas"), (ev) => ask(ev.currentTarget, t("weatherMessage", { date: longDate(iso) }))),
          btn("k-btn ghost", t("add"), () => openWkndForm(iso, null))
        );
      }
      r.append(d, body, btns);
      return r;
    });
    $("wkndRows").replaceChildren(...rows);
    $("wkndRows").hidden = false;
    const first = days[0] || toISO(today());
    const past = [...byDate.keys()].filter((iso) => iso < first).sort().at(-1);
    $("wkndLast").hidden = !past;
    if (past) $("wkndLast").textContent = t("lastWeekend", { plan: str(byDate.get(past).fields.plan) });
  }

  function openWkndForm(iso, item) {
    editingWknd = { iso, item };
    $("wkndRows").hidden = true;
    $("wkndForm").hidden = false;
    $("wkndFormDate").textContent = longDate(iso);
    $("wkndLast").hidden = true;
    $("wkndPlan").value = item?.fields.plan || "";
    $("wkndWho").value = parseWho(item?.fields.who).join(", ");
    $("wkndNote").value = item?.fields.note || "";
    $("wkndRemove").hidden = !item;
    $("wkndPlan").focus({ preventScroll: true });
  }
  function closeWkndForm() {
    editingWknd = null;
    $("wkndForm").hidden = true;
    renderWeekend();
  }

  // Shopping rows are keyed and REUSED across renders, so a tick's transition plays out and a
  // background refresh never replays anything.
  function renderShop() {
    const s = shopModel();
    const list = $("shopList");
    const old = new Map([...list.querySelectorAll(".fw-item")].map((n) => [n.dataset.id, n]));
    const seq = [];
    const groups = new Map();
    for (const it of s.active) {
      const k = aisleKey(it.fields.aisle);
      if (!groups.has(k)) groups.set(k, []);
      groups.get(k).push(it);
    }
    const order = [...groups.keys()].sort((a, b) => {
      const ia = AISLES.indexOf(a);
      const ib = AISLES.indexOf(b);
      return (ia < 0 ? 50 : ia) - (ib < 0 ? 50 : ib) || a.localeCompare(b);
    });
    const heading = (label, n) => {
      const h = el("div", "fw-aisle");
      h.append(el("span", "", label), el("span", "k-num", num(n)));
      return h;
    };
    for (const k of order) {
      const items = groups.get(k);
      seq.push(heading(aisleLabel(k), items.filter((it) => !it.fields.done_at).length || items.length));
      for (const it of items) seq.push(itemRow(old.get(it.id), it));
    }
    if (s.bag.length && oma.pref("show_completed", true)) {
      seq.push(heading(t("bagIn"), s.bag.length));
      for (const it of s.bag) seq.push(itemRow(old.get(it.id), it));
    }
    if (s.earlier.length && oma.pref("show_completed", true)) {
      const again = el("div", "fw-again");
      again.append(el("span", "", t("buyAgain")));
      const seen = new Set();
      for (const it of s.earlier.slice().reverse()) {
        const name = str(it.fields.item);
        if (seen.has(name.toLowerCase())) continue;
        seen.add(name.toLowerCase());
        const c = btn("k-chip", "", () => write({ key: "shopping", kind: "patch", id: it.id, fields: { done_at: null } }));
        c.append(svg("M8 4v8M4 8h8"), el("span", "", name));
        again.append(c);
      }
      seq.push(again);
    }
    if (!s.total && !s.earlier.length) seq.push(el("p", "fw-shop-empty", t("shopEmpty")));
    list.replaceChildren(...seq);

    const lvl = s.total ? s.done / s.total : 0;
    const bag = $("bag");
    bag.style.setProperty("--lvl", String(lvl));
    bag.classList.toggle("is-full", s.total > 0 && lvl >= .75);
    $("bagNum").textContent = num(s.done);
    $("bagOf").textContent = s.total ? `/${num(s.total)}` : "";
    $("bagCap").textContent = !s.total ? t("bagEmpty")
      : s.done === s.total ? t("allIn")
      : `${t("inBag")} · ${t("toBuy", { n: num(s.total - s.done) })}`;
  }

  function itemRow(node, it) {
    const done = Boolean(it.fields.done_at);
    if (!node) {
      node = el("button", "fw-item");
      node.type = "button";
      node.setAttribute("role", "checkbox");
      const tick = el("span", "fw-tick");
      tick.append(svg("M3.5 8.5l3 3 6-7"));
      tick.firstChild.setAttribute("stroke-width", "2.2");
      node.append(tick, el("span", "fw-item-t"));
    }
    node.dataset.id = it.id;
    node.classList.toggle("is-done", done);
    node.setAttribute("aria-checked", String(done));
    const text = node.querySelector(".fw-item-t");
    const qty = str(it.fields.qty);
    if (text.dataset.sig !== `${it.fields.item}|${qty}`) {
      text.dataset.sig = `${it.fields.item}|${qty}`;
      text.replaceChildren(document.createTextNode(str(it.fields.item)));
      if (qty) text.append(el("small", "", qty));
    }
    node.onclick = () => tickItem(it.id);
    return node;
  }

  function tickItem(id) {
    if (String(id).startsWith("tmp-")) return;
    const it = rowsOf("shopping").find((x) => x.id === id);
    if (!it) return;
    const on = !it.fields.done_at;
    if (on) {
      settling.add(id);
      setTimeout(() => {
        settling.delete(id);
        renderShop();
      }, 650);
    }
    write({ key: "shopping", kind: "patch", id, fields: { done_at: on ? new Date().toISOString() : null } });
    if (on) dropIntoBag();
  }

  function dropIntoBag() {
    const bag = $("bag");
    const drop = $("bagDrop");
    const n = $("bagNum");
    for (const [node, cls] of [[drop, "go"], [bag, "squash"], [n, "fw-pop"]]) {
      node.classList.remove(cls);
      void node.getBoundingClientRect();
    }
    drop.classList.add("go");
    setTimeout(() => bag.classList.add("squash"), 380);
    n.classList.add("fw-pop");
  }

  // ── the rest: notes · chores · dates ─────────────────────────────────────────────────────────
  function renderTabs() {
    for (const b of document.querySelectorAll("[data-tab]")) {
      const on = b.dataset.tab === tab;
      b.classList.toggle("on", on);
      b.setAttribute("aria-selected", String(on));
    }
    $("pNotes").hidden = tab !== "notes";
    $("pChores").hidden = tab !== "chores";
    $("pDates").hidden = tab !== "dates";
    $("boardForm").hidden = tab !== "notes";
    renderNotes();
    renderChores();
    renderDates();
  }

  function renderNotes() {
    const rows = rowsOf("board")
      .filter((it) => str(it.fields.note))
      .sort((a, b) => str(b.fields.date).localeCompare(str(a.fields.date)) || b.position - a.position);
    $("nNotes").textContent = rows.length ? num(rows.length) : "";
    const cards = rows.map((it) => {
      const card = el("article", "fw-note fw-bnote");
      card.append(el("p", "", str(it.fields.note)));
      const meta = el("div", "fw-bmeta");
      const who = str(it.fields.author) || t("anyone");
      meta.append(mini(who), el("b", "", who));
      if (validDate(it.fields.date)) {
        const n = daysUntil(it.fields.date);
        meta.append(el("span", "", n === 0 ? t("todayWord") : n === -1 ? t("yesterday") : dayMonth(it.fields.date)));
      }
      card.append(meta);
      return card;
    });
    $("notes").replaceChildren(...(cards.length ? cards : [el("p", "fw-shop-empty", t("notesEmpty"))]));
    const foot = $("foot");
    if (tab === "notes") {
      foot.replaceChildren(el("span", "", t("changes")), btn("k-btn ghost", t("askChanges"), (e) => ask(e.currentTarget, t("changesMessage"))));
    }
  }

  function isoWeekSerial(d) {
    const m = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
    m.setUTCDate(m.getUTCDate() - ((m.getUTCDay() + 6) % 7));
    return Math.floor(m.getTime() / (7 * 86400000));
  }
  const mod = (a, b) => ((a % b) + b) % b;

  function renderChores() {
    const rows = rowsOf("chores").filter((it) => str(it.fields.task) && validDate(it.fields.anchor_date) && parseWho(it.fields.members).length);
    const out = rows.map((it) => {
      const ms = parseWho(it.fields.members);
      const weeks = isoWeekSerial(today()) - isoWeekSerial(dateOnly(it.fields.anchor_date));
      const slot = Math.max(0, Number(it.position || 1) - 1);
      const now = ms[mod(weeks + slot, ms.length)];
      const next = ms[mod(weeks + slot + 1, ms.length)];
      const r = el("div", "fw-row");
      const txt = el("div", "fw-row-t");
      txt.append(el("b", "", str(it.fields.task)), el("span", "", `${t("turn", { name: now })} · ${t("nextTurn", { name: next })}`));
      r.append(mini(now), txt);
      return r;
    });
    $("chores").replaceChildren(...out);
    if (tab === "chores") {
      const foot = $("foot");
      if (!out.length) foot.replaceChildren(el("span", "", t("choresEmpty")), btn("k-btn sec", t("setupChores"), (e) => ask(e.currentTarget, t("choresMessage"))));
      else foot.replaceChildren();
    }
  }

  function nextAnnual(iso) {
    const a = dateOnly(iso);
    const now = today();
    const make = (y) => new Date(y, a.getMonth(), Math.min(a.getDate(), new Date(y, a.getMonth() + 1, 0).getDate()));
    const d = make(now.getFullYear());
    return d < now ? make(now.getFullYear() + 1) : d;
  }

  function renderDates() {
    const rows = rowsOf("dates")
      .filter((it) => str(it.fields.label) && validDate(it.fields.date))
      .map((it) => {
        const next = nextAnnual(it.fields.date);
        return { it, next, days: Math.round((next - today()) / 86400000) };
      })
      .sort((a, b) => a.days - b.days || a.it.position - b.it.position);
    $("nDates").textContent = rows.length ? (rows[0].days === 0 ? t("todayWord") : `${num(rows[0].days)}${lang() === "zh" ? "天" : "d"}`) : "";
    const out = rows.map(({ it, next, days }) => {
      const r = el("div", "fw-row");
      const c = el("div", `fw-count${days <= 14 ? " is-soon" : ""}`);
      c.append(el("b", "", num(days)), el("span", "", days === 0 ? t("todayWord") : t(days === 1 ? "day" : "days")));
      const kindKey = str(it.fields.kind).toLowerCase();
      const kind = ["birthday", "anniversary", "school"].includes(kindKey) ? t(kindKey) : str(it.fields.kind);
      const txt = el("div", "fw-row-t");
      txt.append(el("b", "", str(it.fields.label)), el("span", "", [kind, fmt(toISO(next), { weekday: "short", month: "short", day: "numeric" })].filter(Boolean).join(" · ")));
      r.append(c, txt);
      return r;
    });
    $("dates").replaceChildren(...out);
    if (tab === "dates") {
      const foot = $("foot");
      if (!out.length) foot.replaceChildren(el("span", "", t("datesEmpty")), btn("k-btn sec", t("addDates"), (e) => ask(e.currentTarget, t("datesMessage"))));
      else foot.replaceChildren();
    }
  }

  // ── wiring ───────────────────────────────────────────────────────────────────────────────────
  $("dinnerForm").onsubmit = (e) => {
    e.preventDefault();
    if (!editingDinner) return;
    const { iso, item } = editingDinner;
    const fields = { date: iso, dish: str($("dinnerDish").value), cook: str($("dinnerCook").value), note: str($("dinnerNote").value) };
    if (!fields.dish) return;
    if (fields.cook !== str(item?.fields.cook)) popFace = iso;
    closeDinnerForm();
    if (item) write({ key: "dinners", kind: "patch", id: item.id, fields });
    else write({ key: "dinners", kind: "add", group: "week", fields });
  };
  $("dinnerCancel").onclick = () => { closeDinnerForm(); renderDay(); };
  $("dinnerClear").onclick = () => {
    const item = editingDinner?.item;
    closeDinnerForm();
    if (item) write({ key: "dinners", kind: "del", id: item.id });
  };

  $("wkndForm").onsubmit = (e) => {
    e.preventDefault();
    if (!editingWknd) return;
    const { iso, item } = editingWknd;
    const fields = { date: iso, plan: str($("wkndPlan").value), who: parseWho($("wkndWho").value), note: str($("wkndNote").value) };
    if (!fields.plan) return;
    editingWknd = null;
    $("wkndForm").hidden = true;
    if (item) write({ key: "weekend", kind: "patch", id: item.id, fields });
    else write({ key: "weekend", kind: "add", group: "weekend", fields });
  };
  $("wkndCancel").onclick = closeWkndForm;
  $("wkndRemove").onclick = () => {
    const item = editingWknd?.item;
    editingWknd = null;
    $("wkndForm").hidden = true;
    if (item) write({ key: "weekend", kind: "del", id: item.id });
    else renderWeekend();
  };

  $("shopItem").oninput = () => $("shopForm").classList.toggle("is-typing", Boolean($("shopItem").value.trim()));
  $("shopForm").onsubmit = (e) => {
    e.preventDefault();
    const item = str($("shopItem").value);
    if (!item) return;
    const aisle = $("shopAisle").value || "Other";
    const fields = { item, aisle, qty: str($("shopQty").value) };
    if (!fields.qty) delete fields.qty;
    $("shopItem").value = "";
    $("shopQty").value = "";
    $("shopForm").classList.remove("is-typing");
    write({ key: "shopping", kind: "add", group: aisle, fields });
    requestAnimationFrame(() => { $("shopList").scrollTop = 0; });
  };

  $("boardForm").onsubmit = (e) => {
    e.preventDefault();
    const note = str($("boardNote").value);
    if (!note) return;
    const fields = { note, author: str($("boardAuthor").value), date: toISO(today()) };
    if (!fields.author) delete fields.author;
    $("boardNote").value = "";
    write({ key: "board", kind: "add", group: "board", fields });
  };

  for (const b of document.querySelectorAll("[data-tab]")) {
    b.onclick = () => {
      tab = b.dataset.tab;
      renderTabs();
    };
  }

  $("planNext").onclick = (e) => {
    const next = addDays(dateOnly(weekDays()[0]), 7);
    ask(e.currentTarget, t("planNextMessage", { start: toISO(next), end: toISO(addDays(next, 6)) }));
  };
  $("memoryBtn").onclick = (e) => {
    const days = weekDays();
    ask(e.currentTarget, t("memoryMessage", { start: days[0], end: days[6] }));
  };

  oma.ready(pull);
  oma.onChange(pull);
  oma.onPrefChange(render);
  // Six collections, one bound: onChange only speaks for the bound one, so the rest are ours
  // to keep fresh — gently, and only while someone can see the widget.
  setInterval(() => { if (!document.hidden) pull(); }, 30000);
</script>
</body>
</html>
