<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Family Week · This Week, Together</title>
<meta name="description" content="A shared family week for dinners, shopping, chores, notes, important dates, and weekend plans.">
<meta name="oma-category" content="Family">

<style>
  body {
    max-width: 760px;
    margin-inline: auto;
    background: transparent;
    color: var(--color-text-primary);
  }

  [hidden] {
    display: none !important;
  }

  button,
  input,
  textarea,
  select {
    letter-spacing: 0;
  }

  .app {
    overflow: hidden;
    border: 1px solid var(--color-border-secondary);
    border-radius: var(--border-radius-sm, 6px);
    background: var(--color-background-primary);
    box-shadow: var(--shadow-sm);
  }

  .app-bar {
    min-height: 66px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--color-border-secondary);
  }

  .app-mark {
    display: grid;
    width: 42px;
    height: 42px;
    flex: none;
    place-items: center;
    border: 1px solid color-mix(in oklab, var(--color-text-info, var(--color-ring-primary)) 36%, var(--color-border-primary));
    border-radius: var(--border-radius-sm, 6px);
    background: color-mix(in oklab, var(--color-text-info, var(--color-ring-primary)) 9%, var(--color-background-primary));
    color: var(--color-text-info, var(--color-ring-primary));
  }

  .app-mark svg {
    width: 26px;
    height: 26px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.45;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .identity {
    min-width: 0;
  }

  .eyebrow {
    margin-bottom: 2px;
    color: var(--color-text-tertiary);
    font-family: var(--font-mono);
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0;
    text-transform: uppercase;
  }

  .app-name {
    margin: 0;
    font-size: 19px;
    font-weight: 680;
    letter-spacing: 0;
    line-height: 1.2;
  }

  .app-actions {
    margin-left: auto;
  }

  .app-actions .k-btn {
    white-space: nowrap;
  }

  .overview {
    display: grid;
    grid-template-columns: minmax(145px, .72fr) minmax(0, 1.28fr);
    gap: 16px;
    align-items: center;
    padding: 13px 16px;
    border-bottom: 1px solid var(--color-border-secondary);
    background: color-mix(in oklab, var(--color-text-info, var(--color-ring-primary)) 7%, var(--color-background-primary));
  }

  .overview-main {
    display: flex;
    align-items: baseline;
    gap: 8px;
    min-width: 0;
  }

  .overview-number {
    font-size: 34px;
    font-weight: 730;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }

  .overview-label {
    color: var(--color-text-secondary);
    font-size: 12px;
    line-height: 1.35;
  }

  .overview-stats {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 12px;
  }

  .overview-stat {
    min-width: 0;
  }

  .overview-stat strong,
  .overview-stat span {
    display: block;
  }

  .overview-stat strong {
    color: var(--color-text-primary);
    font-size: 14px;
    font-weight: 680;
    font-variant-numeric: tabular-nums;
  }

  .overview-stat span {
    margin-top: 2px;
    color: var(--color-text-tertiary);
    font-size: 10.5px;
    line-height: 1.35;
  }

  .dinner-band {
    padding: 12px 16px 14px;
    border-bottom: 1px solid var(--color-border-secondary);
  }

  .section-kicker {
    margin-bottom: 8px;
  }

  .section-kicker h2 {
    margin: 0;
    font-size: 13px;
    font-weight: 690;
    letter-spacing: 0;
  }

  .section-kicker .k-sub {
    margin-top: 2px;
  }

  .dinner-grid {
    display: grid;
    grid-template-columns: repeat(7, minmax(0, 1fr));
    gap: 6px;
  }

  .dinner-slot {
    display: grid;
    min-width: 0;
    min-height: 112px;
    padding: 8px 7px;
    align-content: space-between;
    border: 1px solid var(--color-border-secondary);
    border-radius: var(--border-radius-sm, 6px);
    background: var(--color-background-primary);
    color: var(--color-text-primary);
    cursor: pointer;
    text-align: left;
  }

  .dinner-slot.filled {
    border-color: color-mix(in oklab, var(--color-text-info, var(--color-ring-primary)) 28%, var(--color-border-secondary));
    background: color-mix(in oklab, var(--color-text-info, var(--color-ring-primary)) 6%, var(--color-background-primary));
  }

  .dinner-slot.today {
    box-shadow: inset 0 0 0 2px var(--color-ring-primary);
  }

  .dinner-date-row,
  .cook-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 4px;
    min-width: 0;
  }

  .dinner-day {
    overflow: hidden;
    color: var(--color-text-tertiary);
    font-size: 10px;
    font-weight: 700;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .dinner-date {
    color: var(--color-text-secondary);
    font-size: 11px;
    font-variant-numeric: tabular-nums;
  }

  .dish-name {
    display: -webkit-box;
    overflow: hidden;
    margin: 8px 0;
    font-size: 12px;
    font-weight: 660;
    line-height: 1.25;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 3;
  }

  .dish-name.empty {
    color: var(--color-text-info, var(--color-ring-primary));
    font-weight: 620;
  }

  .cook-chip {
    display: inline-flex;
    min-width: 0;
    align-items: center;
    gap: 5px;
    color: var(--color-text-secondary);
    font-size: 9.5px;
  }

  .avatar {
    display: grid;
    width: 21px;
    height: 21px;
    flex: none;
    place-items: center;
    border-radius: var(--border-radius-full, 999px);
    background: color-mix(in oklab, var(--color-text-success, var(--color-ring-primary)) 14%, var(--color-background-secondary));
    color: var(--color-text-success, var(--color-ring-primary));
    font-family: var(--font-mono);
    font-size: 9px;
    font-weight: 750;
  }

  .cook-name {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .today-pip {
    width: 6px;
    height: 6px;
    flex: none;
    border-radius: var(--border-radius-full, 999px);
    background: var(--color-ring-primary);
  }

  .editor-band {
    padding: 12px 16px;
    border-bottom: 1px solid var(--color-border-secondary);
    background: var(--color-background-secondary);
  }

  .editor-grid {
    display: grid;
    grid-template-columns: minmax(0, 1.35fr) minmax(120px, .65fr);
    gap: 10px;
    margin-top: 10px;
  }

  .field-block {
    min-width: 0;
  }

  .field-block.wide {
    grid-column: 1 / -1;
  }

  .field-block label {
    display: block;
    margin-bottom: 5px;
    color: var(--color-text-secondary);
    font-size: 10.5px;
    font-weight: 650;
  }

  .field-block .k-field {
    width: 100%;
  }

  textarea.k-field {
    min-height: 64px;
    resize: vertical;
    line-height: 1.45;
  }

  .editor-actions {
    margin-top: 10px;
    justify-content: flex-end;
    flex-wrap: wrap;
  }

  .status-strip {
    margin: 10px 16px 0;
  }

  .status-strip .k-badge {
    width: 100%;
    justify-content: flex-start;
    padding: 7px 9px;
    white-space: normal;
  }

  .content-flow {
    min-width: 0;
  }

  .welcome-band {
    display: grid;
    grid-template-columns: 82px minmax(0, 1fr) auto;
    gap: 14px;
    align-items: center;
    padding: 16px;
    border-bottom: 1px solid var(--color-border-secondary);
    background: color-mix(in oklab, var(--color-text-warning, var(--color-text-secondary)) 7%, var(--color-background-primary));
  }

  .welcome-visual {
    display: grid;
    width: 82px;
    height: 62px;
    place-items: center;
    border-radius: var(--border-radius-sm, 6px);
    background: var(--color-background-secondary);
    color: var(--color-text-warning, var(--color-text-secondary));
  }

  .welcome-visual svg {
    width: 58px;
    height: 42px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.4;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .welcome-copy h2 {
    margin: 0 0 3px;
    font-size: 15px;
    font-weight: 690;
    letter-spacing: 0;
  }

  .section-block {
    padding: 15px 16px 17px;
    border-bottom: 1px solid var(--color-border-secondary);
  }

  .section-block:last-child {
    border-bottom: 0;
  }

  .section-head {
    align-items: flex-start;
    margin-bottom: 12px;
  }

  .section-head h2 {
    margin: 0;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0;
  }

  .section-actions {
    margin-left: auto;
  }

  .section-head .k-badge {
    flex: none;
  }

  .shopping-layout {
    display: grid;
    grid-template-columns: 150px minmax(0, 1fr);
    gap: 18px;
    align-items: stretch;
  }

  .bag-panel {
    display: grid;
    justify-items: center;
    min-height: 0;
    align-content: center;
    padding: 13px 10px;
    border: 1px solid var(--color-border-secondary);
    border-radius: var(--border-radius-sm, 6px);
    background: color-mix(in oklab, var(--color-text-success, var(--color-ring-primary)) 7%, var(--color-background-primary));
  }

  .bag-visual {
    display: block;
    width: 112px;
    height: 112px;
    border: 1px solid color-mix(in oklab, var(--color-text-warning, var(--color-text-secondary)) 22%, var(--color-border-secondary));
    border-radius: var(--border-radius-sm, 6px);
    background: color-mix(in oklab, var(--color-text-warning, var(--color-text-secondary)) 8%, var(--color-background-primary));
    object-fit: cover;
  }

  .bag-score {
    margin-top: 4px;
    font-size: 23px;
    font-weight: 730;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }

  .bag-caption {
    margin-top: 4px;
    color: var(--color-text-tertiary);
    font-size: 10.5px;
    text-align: center;
  }

  .shopping-list {
    min-width: 0;
    overflow-x: hidden;
  }

  .aisle-group + .aisle-group {
    margin-top: 12px;
  }

  .aisle-heading {
    display: flex;
    align-items: center;
    gap: 7px;
    margin-bottom: 4px;
    color: var(--color-text-tertiary);
    font-family: var(--font-mono);
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
  }

  .aisle-heading .k-dot {
    background: var(--color-text-info, var(--color-ring-primary));
  }

  .shopping-row {
    display: grid;
    grid-template-columns: 32px minmax(0, 1fr) auto;
    gap: 9px;
    align-items: center;
    min-height: 45px;
    padding: 4px 0;
    border-bottom: 1px solid var(--color-border-secondary);
  }

  .shopping-row:last-child {
    border-bottom: 0;
  }

  .shopping-check {
    width: 24px;
    height: 24px;
    margin: 0;
    accent-color: var(--color-text-success, var(--color-ring-primary));
    cursor: pointer;
  }

  .shopping-item {
    min-width: 0;
  }

  .shopping-item strong,
  .shopping-item span {
    display: block;
  }

  .shopping-item strong {
    overflow: hidden;
    font-size: 13px;
    font-weight: 640;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .shopping-item span {
    margin-top: 1px;
    color: var(--color-text-tertiary);
    font-size: 10px;
  }

  .shopping-row.done .shopping-item strong {
    color: var(--color-text-tertiary);
    text-decoration: line-through;
  }

  .shopping-row.done {
    opacity: .72;
  }

  .done-aisle {
    margin-top: 14px;
    padding-top: 10px;
    border-top: 1px dashed var(--color-border-primary);
  }

  .shopping-empty {
    min-height: 190px;
  }

  .shopping-empty svg {
    width: 68px;
    height: 54px;
    fill: none;
    stroke: var(--color-text-info, var(--color-ring-primary));
    stroke-width: 1.45;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .example-chips {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 6px;
    margin-top: 3px;
  }

  .shopping-form {
    margin-bottom: 13px;
    padding: 12px;
    border: 1px solid var(--color-border-secondary);
    border-radius: var(--border-radius-sm, 6px);
    background: var(--color-background-secondary);
  }

  .shopping-form-grid {
    display: grid;
    grid-template-columns: minmax(0, 1.2fr) minmax(100px, .55fr) minmax(100px, .55fr);
    gap: 9px;
  }

  .shopping-form .k-field {
    width: 100%;
  }

  .shopping-form-actions {
    margin-top: 9px;
    justify-content: flex-end;
  }

  .rotation-headline {
    display: flex;
    align-items: center;
    gap: 7px;
    color: var(--color-text-secondary);
    font-size: 10.5px;
  }

  .rotation-headline .k-dot {
    background: var(--color-text-success, var(--color-ring-primary));
  }

  .chore-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    border-top: 1px solid var(--color-border-secondary);
  }

  .chore-row {
    display: grid;
    grid-template-columns: 34px minmax(0, 1fr) auto;
    gap: 9px;
    min-width: 0;
    min-height: 58px;
    align-items: center;
    padding: 7px 10px;
    border-bottom: 1px solid var(--color-border-secondary);
  }

  .chore-row:nth-child(odd) {
    border-right: 1px solid var(--color-border-secondary);
  }

  .chore-avatar {
    width: 30px;
    height: 30px;
    background: color-mix(in oklab, var(--color-text-info, var(--color-ring-primary)) 14%, var(--color-background-secondary));
    color: var(--color-text-info, var(--color-ring-primary));
    font-size: 10px;
  }

  .chore-copy {
    min-width: 0;
  }

  .chore-copy strong,
  .chore-copy span {
    display: block;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .chore-copy strong {
    font-size: 12.5px;
    font-weight: 680;
  }

  .chore-copy span {
    margin-top: 2px;
    color: var(--color-text-tertiary);
    font-size: 9.5px;
  }

  .rotation-step {
    min-width: 36px;
    justify-content: center;
    padding: 3px 6px;
    color: var(--color-text-tertiary);
    font-family: var(--font-mono);
    font-size: 10px;
  }

  .board-form {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(110px, .34fr) auto;
    gap: 8px;
    margin-bottom: 12px;
    padding: 10px;
    border: 1px solid var(--color-border-secondary);
    border-radius: var(--border-radius-sm, 6px);
    background: var(--color-background-secondary);
  }

  .board-form .k-field {
    width: 100%;
  }

  .board-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 8px;
    overflow-x: hidden;
    padding: 3px;
  }

  .board-note {
    --note-tilt: -0.45deg;
    position: relative;
    display: grid;
    min-width: 0;
    height: 126px;
    padding: 11px;
    align-content: space-between;
    border: 1px solid color-mix(in oklab, var(--color-text-warning, var(--color-text-secondary)) 28%, var(--color-border-secondary));
    border-radius: var(--border-radius-sm, 6px);
    background: color-mix(in oklab, var(--color-text-warning, var(--color-text-secondary)) 9%, var(--color-background-primary));
    box-shadow: 0 2px 0 color-mix(in oklab, var(--color-text-warning, var(--color-text-secondary)) 15%, transparent);
    transform: rotate(var(--note-tilt));
  }

  .board-note::before {
    position: absolute;
    top: 4px;
    left: 50%;
    width: 34px;
    height: 4px;
    border-radius: var(--border-radius-full, 999px);
    background: color-mix(in oklab, var(--color-text-warning, var(--color-text-secondary)) 24%, transparent);
    content: "";
    transform: translateX(-50%);
  }

  .board-note:nth-child(3n + 2) {
    --note-tilt: 0.35deg;
    border-color: color-mix(in oklab, var(--color-text-info, var(--color-ring-primary)) 25%, var(--color-border-secondary));
    background: color-mix(in oklab, var(--color-text-info, var(--color-ring-primary)) 7%, var(--color-background-primary));
  }

  .board-note:nth-child(3n + 3) {
    --note-tilt: -0.2deg;
    border-color: color-mix(in oklab, var(--color-text-success, var(--color-ring-primary)) 25%, var(--color-border-secondary));
    background: color-mix(in oklab, var(--color-text-success, var(--color-ring-primary)) 7%, var(--color-background-primary));
  }

  .board-copy {
    display: -webkit-box;
    overflow: hidden;
    margin: 0;
    color: var(--color-text-primary);
    font-family: "Bradley Hand", "Segoe Print", "Comic Sans MS", cursive;
    font-size: 13px;
    font-weight: 600;
    line-height: 1.42;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 4;
  }

  .board-meta {
    display: flex;
    min-width: 0;
    align-items: center;
    gap: 6px;
    margin-top: 10px;
  }

  .board-meta time {
    overflow: hidden;
    color: var(--color-text-tertiary);
    font-size: 9px;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .date-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 8px;
  }

  .date-card {
    display: grid;
    grid-template-columns: 60px minmax(0, 1fr);
    gap: 10px;
    min-width: 0;
    min-height: 90px;
    align-items: center;
    padding: 10px;
    border: 1px solid var(--color-border-secondary);
    border-radius: var(--border-radius-sm, 6px);
    background: var(--color-background-primary);
  }

  .date-card.nearest {
    border-color: color-mix(in oklab, var(--color-text-warning, var(--color-text-secondary)) 42%, var(--color-border-secondary));
    background: color-mix(in oklab, var(--color-text-warning, var(--color-text-secondary)) 7%, var(--color-background-primary));
    box-shadow: inset 3px 0 0 var(--color-text-warning, var(--color-text-secondary));
  }

  .date-card.nearest .countdown {
    border-color: color-mix(in oklab, var(--color-text-warning, var(--color-text-secondary)) 46%, var(--color-border-secondary));
    background: color-mix(in oklab, var(--color-text-warning, var(--color-text-secondary)) 12%, var(--color-background-primary));
  }

  .date-card.nearest .countdown strong {
    color: var(--color-text-warning, var(--color-text-secondary));
  }

  .countdown {
    display: grid;
    width: 60px;
    height: 60px;
    place-items: center;
    align-content: center;
    border: 1px solid var(--color-border-secondary);
    border-radius: var(--border-radius-sm, 6px);
    background: var(--color-background-secondary);
  }

  .countdown strong,
  .countdown span {
    display: block;
  }

  .countdown strong {
    font-size: 21px;
    font-weight: 740;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }

  .countdown span {
    margin-top: 3px;
    color: var(--color-text-tertiary);
    font-family: var(--font-mono);
    font-size: 8.5px;
    text-transform: uppercase;
  }

  .date-copy {
    min-width: 0;
  }

  .date-copy strong,
  .date-copy span {
    display: block;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .date-copy strong {
    font-size: 12.5px;
    font-weight: 690;
    line-height: 1.3;
  }

  .date-copy span {
    margin-top: 4px;
    color: var(--color-text-tertiary);
    font-size: 9.5px;
    white-space: nowrap;
  }

  .invite-panel {
    display: grid;
    grid-template-columns: 46px minmax(0, 1fr) auto;
    gap: 11px;
    min-height: 92px;
    align-items: center;
    padding: 11px;
    border: 1px dashed var(--color-border-primary);
    border-radius: var(--border-radius-sm, 6px);
    background: var(--color-background-secondary);
  }

  .invite-icon {
    display: grid;
    width: 46px;
    height: 46px;
    place-items: center;
    border-radius: var(--border-radius-sm, 6px);
    background: color-mix(in oklab, var(--color-text-info, var(--color-ring-primary)) 10%, var(--color-background-primary));
    color: var(--color-text-info, var(--color-ring-primary));
  }

  .invite-icon svg {
    width: 25px;
    height: 25px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.4;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .invite-copy b,
  .invite-copy span {
    display: block;
  }

  .invite-copy b {
    font-size: 12.5px;
  }

  .invite-copy span {
    margin-top: 3px;
    color: var(--color-text-tertiary);
    font-size: 10.5px;
    line-height: 1.4;
  }

  .weekend-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
  }

  .weekend-card {
    position: relative;
    min-width: 0;
    min-height: 190px;
    overflow: hidden;
    padding: 14px;
  }

  .weekend-card.saturday {
    border-top: 3px solid var(--color-text-warning, var(--color-text-secondary));
  }

  .weekend-card.sunday {
    border-top: 3px solid var(--color-text-success, var(--color-ring-primary));
  }

  .weekend-card.has-plan {
    padding-bottom: 48px;
  }

  .weekend-top {
    margin-bottom: 10px;
  }

  .weekend-date {
    color: var(--color-text-tertiary);
    font-size: 10.5px;
    font-variant-numeric: tabular-nums;
  }

  .weekend-card h3 {
    margin: 0 0 7px;
    font-size: 17px;
    font-weight: 700;
    letter-spacing: 0;
    line-height: 1.25;
  }

  .weekend-note {
    margin: 8px 0 0;
    color: var(--color-text-secondary);
    font-size: 11px;
    line-height: 1.45;
  }

  .people-row {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    margin-top: 10px;
  }

  .person-chip {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 2px 7px 2px 3px;
  }

  .person-chip .avatar {
    width: 18px;
    height: 18px;
    font-size: 8px;
  }

  .weekend-edit {
    position: absolute;
    right: 10px;
    bottom: 10px;
    padding: 5px 7px;
  }

  .weekend-empty {
    display: grid;
    min-height: 160px;
    align-content: center;
    justify-items: start;
  }

  .weekend-empty svg {
    width: 54px;
    height: 40px;
    margin-bottom: 8px;
    fill: none;
    stroke: var(--color-text-info, var(--color-ring-primary));
    stroke-width: 1.45;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .weekend-empty .k-row {
    margin-top: 10px;
    flex-wrap: wrap;
  }

  .weekend-editor {
    margin-top: 12px;
    padding: 13px;
  }

  body[data-density="compact"] .dinner-slot {
    min-height: 100px;
  }

  body[data-density="compact"] .section-block {
    padding-block: 12px;
  }

  @media (prefers-reduced-motion: no-preference) {
    .k-btn,
    .dinner-slot,
    .weekend-card,
    .shopping-row,
    .chore-row,
    .board-note,
    .date-card,
    .bag-visual {
      transition: transform 180ms cubic-bezier(.2, .8, .3, 1), border-color 180ms cubic-bezier(.2, .8, .3, 1), background 180ms cubic-bezier(.2, .8, .3, 1), opacity 180ms cubic-bezier(.2, .8, .3, 1);
    }

    .k-btn:hover,
    .dinner-slot:hover,
    .weekend-card:hover,
    .board-note:hover,
    .date-card:hover {
      transform: translateY(-1px);
    }

    .board-note:hover {
      transform: translateY(-1px) rotate(0deg);
    }

    .k-btn:active,
    .dinner-slot:active {
      transform: scale(.98);
    }

    .shopping-row.done {
      animation: item-settle 240ms cubic-bezier(.34, 1.56, .64, 1);
    }

    @keyframes item-settle {
      0% { transform: scale(.97); }
      100% { transform: scale(1); }
    }
  }

  @media (max-width: 660px) {
    .app-bar {
      flex-wrap: wrap;
    }

    .app-actions {
      display: flex;
      width: 100%;
      margin-left: 54px;
    }

    .overview {
      grid-template-columns: 1fr;
      gap: 10px;
    }

    .overview-main {
      justify-content: space-between;
    }

    .shopping-layout {
      grid-template-columns: 1fr;
    }

    .bag-panel {
      display: grid;
      grid-template-columns: 112px auto;
      width: min(100%, 310px);
      min-height: 138px;
      justify-self: center;
      justify-content: center;
      justify-items: start;
      column-gap: 14px;
      align-items: center;
      padding-inline: 16px;
    }

    .bag-visual {
      grid-row: 1 / span 2;
    }

    .bag-score,
    .bag-caption {
      text-align: left;
    }

    .board-grid,
    .date-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .k-btn {
      min-height: 40px;
    }

    .shopping-check {
      width: 32px;
      height: 32px;
    }

    .shopping-row {
      grid-template-columns: 40px minmax(0, 1fr) auto;
      min-height: 52px;
    }

  }

  @media (max-width: 560px) {
    .app-bar,
    .overview,
    .dinner-band,
    .editor-band,
    .section-block {
      padding-inline: 12px;
    }

    .status-strip {
      margin-inline: 12px;
    }

    .dinner-grid {
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 6px;
    }

    .dinner-slot {
      min-height: 108px;
      padding-inline: 7px;
    }

    .dinner-date {
      display: none;
    }

    .dish-name {
      font-size: 11.5px;
      -webkit-line-clamp: 3;
    }

    .cook-name {
      display: none;
    }

    .editor-grid,
    .shopping-form-grid,
    .board-form {
      grid-template-columns: 1fr;
    }

    .field-block.wide {
      grid-column: auto;
    }

    .welcome-band {
      grid-template-columns: 64px minmax(0, 1fr);
    }

    .welcome-visual {
      width: 64px;
    }

    .welcome-band > .k-btn {
      grid-column: 1 / -1;
      justify-self: stretch;
    }

    .weekend-grid {
      grid-template-columns: 1fr;
    }

    .chore-grid,
    .board-grid,
    .date-grid {
      grid-template-columns: 1fr;
    }

    .chore-row:nth-child(odd) {
      border-right: 0;
    }

    .invite-panel {
      grid-template-columns: 46px minmax(0, 1fr);
    }

    .invite-panel .k-btn {
      grid-column: 1 / -1;
      justify-self: stretch;
    }

    .weekend-card {
      min-height: 170px;
    }

    .k-btn {
      min-height: 44px;
    }

    .shopping-check {
      width: 40px;
      height: 40px;
    }

    .weekend-edit {
      width: 44px;
      min-width: 44px;
    }
  }

  @media (max-width: 410px) {
    .app-actions {
      margin-left: 0;
    }

    .app-actions .k-btn {
      flex: 1;
      padding-inline: 8px;
    }

    .overview-stats {
      gap: 7px;
    }

    .overview-stat strong {
      font-size: 12px;
    }

    .dinner-slot { min-height: 106px; }
  }
</style>
</head>

  let fixturePreview = false;
  let previewClockDate = null;
  const clockNow = () => previewClockDate ? new Date(previewClockDate) : new Date();
  const actualToday = () => { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); };
  const dateOnly = (iso) => { const [y, m, d] = String(iso).slice(0, 10).split("-").map(Number); return new Date(y, m - 1, d); };
  const today    = () => { const n = clockNow(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); };
  const daysUntil = (iso) => Math.round((dateOnly(iso) - today()) / 86400000);
  const nextOccurrence = (anchorIso, everyDays) => {
    const a = dateOnly(anchorIso);
    const k = Math.max(0, Math.ceil((today() - a) / (everyDays * 86400000)));
    return new Date(a.getFullYear(), a.getMonth(), a.getDate() + k * everyDays);
  };

  let model = { dinners: [], shopping: [], weekend: [], chores: [], board: [], dates: [] };
  let hostState = { items: [] };
  let refreshTask = null;
  let refreshQueued = false;
  let statusTimer = 0;
  let dinnerSelection = null;
  let weekendSelection = null;
  let shoppingFormOpen = false;
  let boardFormOpen = false;

  function language() {
    return localeCode().toLowerCase().startsWith("zh") ? "zh" : "en";
  }

  function t(key, values = {}) {
    const template = STR[language()][key] ?? STR.en[key] ?? key;
    return String(template).replace(/\{(\w+)\}/g, (_, name) => values[name] ?? "");
  }

  function localeCode() {
    const value = oma.pref("locale", "auto");
    return value === "auto" ? (navigator.language || "en") : value;
  }

  function el(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function svgNode(tag, attributes = {}) {
    const node = document.createElementNS(SVG_NS, tag);
    for (const [key, value] of Object.entries(attributes)) node.setAttribute(key, String(value));
    return node;
  }

  function icon(path) {
    const svg = svgNode("svg", { class: "k-icon", viewBox: "0 0 16 16", "aria-hidden": "true" });
    svg.append(svgNode("path", { d: path }));
    return svg;
  }

  function toISO(date) {
    const year = date.getFullYear();
    const month = String(date.getMonth() + 1).padStart(2, "0");
    const day = String(date.getDate()).padStart(2, "0");
    return `${year}-${month}-${day}`;
  }

  function formatNumber(value, digits = 0) {
    return new Intl.NumberFormat(localeCode(), { maximumFractionDigits: digits }).format(value);
  }

  function formatDate(iso, options = { month: "short", day: "numeric" }) {
    if (!/^\d{4}-\d{2}-\d{2}$/.test(String(iso))) return String(iso || "");
    const mode = oma.pref("date_format", "auto");
    if (mode === "yyyy-mm-dd") return String(iso);
    const [year, month, day] = String(iso).split("-");
    if (mode === "dd/mm/yyyy") return `${day}/${month}/${year}`;
    if (mode === "mm/dd/yyyy") return `${month}/${day}/${year}`;
    return new Intl.DateTimeFormat(localeCode(), options).format(dateOnly(iso));
  }

  function formatLongDate(iso) {
    return formatDate(iso, { weekday: "long", month: "long", day: "numeric" });
  }

  function startOfWeek(base) {
    const startKey = oma.pref("week_start", "monday");
    const startIndex = WEEK_START_INDEX[startKey] ?? 1;
    const delta = (base.getDay() - startIndex + 7) % 7;
    return new Date(base.getFullYear(), base.getMonth(), base.getDate() - delta);
  }

  function datesOfWeek(base = today()) {
    const start = startOfWeek(base);
    return Array.from({ length: 7 }, (_, index) => new Date(start.getFullYear(), start.getMonth(), start.getDate() + index));
  }

  function weekendDates(base = today()) {
    const week = datesOfWeek(base);
    return [week.find((date) => date.getDay() === 6), week.find((date) => date.getDay() === 0)].filter(Boolean);
  }

  function nextWeekDates() {
    const currentStart = startOfWeek(today());
    const anchor = new Date(currentStart.getFullYear(), currentStart.getMonth(), currentStart.getDate() + 7);
    const nextStart = nextOccurrence(toISO(anchor), 7);
    return Array.from({ length: 7 }, (_, index) => new Date(nextStart.getFullYear(), nextStart.getMonth(), nextStart.getDate() + index));
  }

  function relativeDate(iso) {
    const days = daysUntil(iso);
    if (days === 0) return t("todayRelative");
    if (days === 1) return t("tomorrowRelative");
    if (days > 1) return t("inDays", { count: formatNumber(days) });
    return t("daysAgo", { count: formatNumber(Math.abs(days)) });
  }

  function mod(value, divisor) {
    return ((value % divisor) + divisor) % divisor;
  }

  function isoWeekInfo(date = today()) {
    const utc = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
    const weekday = utc.getUTCDay() || 7;
    utc.setUTCDate(utc.getUTCDate() + 4 - weekday);
    const isoYear = utc.getUTCFullYear();
    const yearStart = new Date(Date.UTC(isoYear, 0, 1));
    const week = Math.ceil((((utc - yearStart) / 86400000) + 1) / 7);
    return { year: isoYear, week };
  }

  function isoWeekSerial(date) {
    const monday = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
    const offset = (monday.getUTCDay() + 6) % 7;
    monday.setUTCDate(monday.getUTCDate() - offset);
    return Math.floor(monday.getTime() / (7 * 86400000));
  }

  function nextAnnualOccurrence(anchorIso) {
    const anchor = dateOnly(anchorIso);
    const now = today();
    const make = (year) => {
      const lastDay = new Date(year, anchor.getMonth() + 1, 0).getDate();
      return new Date(year, anchor.getMonth(), Math.min(anchor.getDate(), lastDay));
    };
    const thisYear = make(now.getFullYear());
    return thisYear < now ? make(now.getFullYear() + 1) : thisYear;
  }

  function initials(name) {
    const clean = String(name || "").trim();
    if (!clean) return "?";
    const parts = clean.split(/\s+/).filter(Boolean);
    return parts.length > 1 ? `${parts[0][0]}${parts.at(-1)[0]}`.toUpperCase() : clean.slice(0, 2).toUpperCase();
  }

  function parseWho(value) {
    if (Array.isArray(value)) return value.map(String).map((name) => name.trim()).filter(Boolean);
    if (typeof value !== "string") return [];
    try {
      const parsed = JSON.parse(value);
      if (Array.isArray(parsed)) return parsed.map(String).map((name) => name.trim()).filter(Boolean);
    } catch {
      return value.split(/[,，、\n]/).map((name) => name.trim()).filter(Boolean);
    }
    return [];
  }

  function applyI18n() {
    document.documentElement.lang = language() === "zh" ? "zh-CN" : "en";
    document.title = t("appName");
    for (const node of document.querySelectorAll("[data-i18n]")) node.textContent = t(node.dataset.i18n);
    for (const node of document.querySelectorAll("[data-i18n-placeholder]")) node.placeholder = t(node.dataset.i18nPlaceholder);
    for (const node of document.querySelectorAll("[data-i18n-aria-label]")) node.setAttribute("aria-label", t(node.dataset.i18nAriaLabel));
  }

  function showStatus(message, tone = "ok", persistent = false) {
    const strip = document.getElementById("statusStrip");
    const badge = document.getElementById("statusMessage");
    badge.className = `k-badge ${tone}`;
    badge.textContent = message;
    strip.hidden = false;
    clearTimeout(statusTimer);
    if (!persistent) {
      statusTimer = setTimeout(() => {
        strip.hidden = true;
      }, 3400);
    }
  }

  function toolFailure(response, fallback) {
    const structured = response?.structuredContent;
    if (!response || response.isError || response.ok === false || structured?.ok === false) {
      const message = response?.note || structured?.note || response?.reason || structured?.reason || response?.content?.[0]?.text || fallback;
      throw new Error(message);
    }
  }

  function validDate(value) {
    return /^\d{4}-\d{2}-\d{2}$/.test(String(value || ""));
  }

  function fixtureRows(items) {
    return {
      dinners: items.filter((item) => item.collection === DINNER_COLLECTION),
      shopping: items.filter((item) => item.collection === SHOPPING_COLLECTION),
      weekend: items.filter((item) => item.collection === WEEKEND_COLLECTION),
      chores: items.filter((item) => item.collection === CHORES_COLLECTION),
      board: items.filter((item) => item.collection === BOARD_COLLECTION),
      dates: items.filter((item) => item.collection === DATES_COLLECTION)
    };
  }

  function hasFixtureRows(rows) {
    return rows.dinners.length || rows.shopping.length || rows.weekend.length || rows.chores.length || rows.board.length || rows.dates.length;
  }

  function previewDateOf(rows) {
    const dates = rows.board
      .map((item) => String(item.fields?.date || ""))
      .filter(validDate)
      .sort();
    if (!dates.length) return null;
    const date = dateOnly(dates.at(-1));
    date.setHours(12, 0, 0, 0);
    return date;
  }

  async function readCollection(collection) {
    const response = await oma.callTool("data_list", { collection, limit: 500 });
    toolFailure(response, collection);
    const items = response?.structuredContent?.items;
    if (!Array.isArray(items)) throw new Error(t("invalidData", { collection }));
    return items;
  }

  function refreshCollections(state = hostState) {
    hostState = state || hostState;
    refreshQueued = true;
    if (refreshTask) return refreshTask;

    refreshTask = (async () => {
      while (refreshQueued) {
        refreshQueued = false;
        const previewRows = fixtureRows(hostState.items || []);
        if (hasFixtureRows(previewRows)) {
          fixturePreview = true;
          previewClockDate = previewDateOf(previewRows);
          model = previewRows;
          render();
          continue;
        }

        fixturePreview = false;
        previewClockDate = null;
        const [dinners, shopping, weekend, chores, board, dates] = await Promise.all(COLLECTIONS.map(readCollection));
        model = { dinners, shopping, weekend, chores, board, dates };
        render();
      }
    })().finally(() => {
      refreshTask = null;
    });
    return refreshTask;
  }

  function requestRefresh(state) {
    void refreshCollections(state).catch((error) => {
      showStatus(t("readFailed", { error: String(error?.message || error) }), "bad", true);
    });
  }

  async function dataWrite(tool, args) {
    const response = await oma.callTool(tool, {
      command_id: crypto.randomUUID(),
      ...args,
      actor: "human"
    });
    toolFailure(response, t("saveFailed", { error: tool }));
    return response;
  }

  async function runWrite(button, action, successMessage) {
    if (button) button.disabled = true;
    try {
      await action();
      await refreshCollections();
      showStatus(successMessage, "ok");
      return true;
    } catch (error) {
      showStatus(t("saveFailed", { error: String(error?.message || error) }), "bad", true);
      requestRefresh();
      return false;
    } finally {
      if (button) button.disabled = false;
    }
  }

  function dinnersForWeek() {
    const week = datesOfWeek();
    const start = toISO(week[0]);
    const end = toISO(week[6]);
    const byDate = new Map();
    for (const item of [...model.dinners].sort((a, b) => a.position - b.position)) {
      const date = String(item.fields?.date || "");
      if (date >= start && date <= end && String(item.fields?.dish || "").trim()) byDate.set(date, item);
    }
    return { week, byDate };
  }

  function shoppingRows() {
    return model.shopping.filter((item) => String(item.fields?.item || "").trim())
      .sort((a, b) => Number(Boolean(a.fields.done_at)) - Number(Boolean(b.fields.done_at)) || a.position - b.position);
  }

  function weekendRows() {
    const byDate = new Map();
    for (const item of [...model.weekend].sort((a, b) => a.position - b.position)) {
      if (validDate(item.fields?.date) && String(item.fields?.plan || "").trim()) byDate.set(String(item.fields.date), item);
    }
    return byDate;
  }

  function choreRows() {
    return [...model.chores]
      .filter((item) => String(item.fields?.task || "").trim() && validDate(item.fields?.anchor_date) && parseWho(item.fields?.members).length)
      .sort((a, b) => a.position - b.position);
  }

  function boardRows() {
    return [...model.board]
      .filter((item) => String(item.fields?.note || "").trim() && validDate(item.fields?.date))
      .sort((a, b) => String(b.fields.date).localeCompare(String(a.fields.date)) || b.position - a.position);
  }

  function importantDateRows() {
    return model.dates
      .filter((item) => String(item.fields?.label || "").trim() && validDate(item.fields?.date))
      .map((item) => {
        const next = nextAnnualOccurrence(item.fields.date);
        return { item, next, days: Math.round((next - today()) / 86400000) };
      })
      .sort((a, b) => a.days - b.days || a.item.position - b.item.position)
      .slice(0, 3);
  }

  function renderShopping() {
    const rows = shoppingRows();
    const active = rows.filter((item) => !item.fields.done_at);
    const done = rows.filter((item) => item.fields.done_at);
    const total = rows.length;
    const progress = total ? done.length / total : 0;
    const percent = Math.round(progress * 100);
    const bagState = progress === 0 ? "empty" : progress < .75 ? "half" : "full";
    const bag = document.getElementById("bagVisual");
    document.getElementById("shoppingSubtitle").textContent = t("shoppingCount", { count: formatNumber(active.length) });
    document.getElementById("bagScore").textContent = `${formatNumber(percent)}%`;
    document.getElementById("bagCaption").textContent = t("bagProgress", { done: formatNumber(done.length), total: formatNumber(total) });
    bag.src = BAG_IMAGES[bagState];
    bag.alt = t(`bag${bagState[0].toUpperCase()}${bagState.slice(1)}Alt`);
    document.getElementById("shoppingEmpty").hidden = total > 0;

    const root = document.getElementById("shoppingList");
    root.replaceChildren();
    root.hidden = total === 0;

    const groups = new Map();
    for (const item of active) {
      const aisle = String(item.fields.aisle || "Other").trim() || "Other";
      if (!groups.has(aisle)) groups.set(aisle, []);
      groups.get(aisle).push(item);
    }

    const orderedAisles = [...groups.keys()].sort((a, b) => {
      const ai = AISLE_ORDER.indexOf(a);
      const bi = AISLE_ORDER.indexOf(b);
      return (ai < 0 ? 99 : ai) - (bi < 0 ? 99 : bi) || a.localeCompare(b);
    });

    for (const aisle of orderedAisles) root.append(renderAisle(aisle, groups.get(aisle), false));
    if (done.length && oma.pref("show_completed", true)) root.append(renderAisle(t("completed"), done, true));
  }

  function aisleLabel(aisle) {
    const key = AISLE_KEYS[String(aisle || "").trim().toLowerCase()];
    return key ? t(key) : String(aisle || t("other"));
  }

  function renderAisle(aisle, items, doneGroup) {
    const group = el("section", `aisle-group${doneGroup ? " done-aisle" : ""}`);
    const heading = el("div", "aisle-heading");
    heading.append(el("span", "k-dot"));
    heading.append(el("span", "", doneGroup ? aisle : aisleLabel(aisle)));
    heading.append(el("span", "k-num", formatNumber(items.length)));
    group.append(heading);

    for (const item of items) {
      const row = el("div", `shopping-row${item.fields.done_at ? " done" : ""}`);
      const checkbox = el("input", "shopping-check");
      checkbox.type = "checkbox";
      checkbox.checked = Boolean(item.fields.done_at);
      checkbox.setAttribute("aria-label", String(item.fields.item));
      checkbox.onchange = () => toggleShopping(item, checkbox.checked, checkbox);

      const copy = el("div", "shopping-item");
      copy.append(el("strong", "", String(item.fields.item)));
      const meta = [String(item.fields.qty || "").trim(), doneGroup ? aisleLabel(item.fields.aisle || "Other") : ""].filter(Boolean).join(" · ");
      if (meta) copy.append(el("span", "", meta));
      row.append(checkbox, copy);
      row.append(el("span", "k-mut k-num", item.fields.done_at ? "✓" : ""));
      group.append(row);
    }
    return group;
  }

  function renderChores() {
    const rows = choreRows();
    const root = document.getElementById("choreGrid");

    empty.replaceChildren();
    root.hidden = rows.length === 0;
    empty.hidden = rows.length > 0;

    if (!rows.length) {
      empty.append(invitePanel(
        "M5 7h18M7 4v6M21 4v6M6 13h6v5H6zM16 13h6v5h-6zM6 21h6M16 21h6",

    for (const item of rows) {
      const fields = item.fields;

      const assignee = members[mod(weeksPassed + slot, members.length)];

  function renderWeekendCard(date, item, index) {
    const iso = toISO(date);
    const dayKey = date.getDay() === 6 ? "saturday" : "sunday";
    const card = el("article", `k-card weekend-card ${dayKey} k-stagger`);
    card.style.setProperty("--i", index);

    const top = el("div", "weekend-top k-row");
    top.append(el("span", "k-badge info", t(dayKey)));
    top.append(el("span", "k-grow"));
    top.append(el("span", "weekend-date", `${formatDate(iso)} · ${relativeDate(iso)}`));
    card.append(top);

    if (!item) {
      const empty = el("div", "weekend-empty");
      const visual = svgNode("svg", { viewBox: "0 0 56 42", "aria-hidden": "true" });
      visual.append(svgNode("path", { d: "M5 33c8-8 15-12 23-12s15 4 23 12M17 18l6-7 6 7M36 17h10M41 12v10" }));
      visual.append(svgNode("path", { d: "M9 35h38", opacity: ".5" }));
      empty.append(visual);
      empty.append(el("h3", "", t("noPlan")));
      empty.append(el("div", "k-sub", t("weekendSubtitle")));
      const actions = el("div", "k-row");
      const ask = el("button", "k-btn sec", t("askWeather"));
      ask.type = "button";
      ask.onclick = () => askWeatherIdeas(iso);
      const add = el("button", "k-btn ghost", t("addPlan"));
      add.type = "button";
      add.onclick = () => openWeekendEditor(iso, null);
      actions.append(ask, add);
      empty.append(actions);
      card.append(empty);
      return card;
    }

    card.classList.add("has-plan");
    card.append(el("h3", "", String(item.fields.plan)));
    const who = parseWho(item.fields.who);
    if (who.length) {
      const people = el("div", "people-row");
      for (const name of who) {
        const chip = el("span", "k-chip static person-chip");
        chip.append(el("span", "avatar", initials(name)));
        chip.append(el("span", "", name));
        people.append(chip);
      }
      card.append(people);
    }
    if (item.fields.note) card.append(el("p", "weekend-note", String(item.fields.note)));
    const edit = el("button", "k-btn ghost weekend-edit");
    edit.type = "button";
    edit.title = t("editPlan");
    edit.setAttribute("aria-label", t("editPlan"));
    edit.append(icon("M3 11.5V14h2.5L13 6.5 9.5 3 2 10.5zM8.5 4l3.5 3.5"));
    edit.onclick = () => openWeekendEditor(iso, item);
    card.append(edit);
    return card;
  }

  function askPlanNextWeek() {
    const dates = nextWeekDates();
    oma.sendMessage(t("planNextMessage", { start: toISO(dates[0]), end: toISO(dates[6]) }));
  }

  function askChanges() {
    oma.sendMessage(t("changesMessage"));
  }

  function askMemorySeed() {
    const week = datesOfWeek();
    oma.sendMessage(t("memoryMessage", { start: toISO(week[0]), end: toISO(week[6]) }));
  }

  document.getElementById("planNextButton").onclick = askPlanNextWeek;
  document.getElementById("changesButton").onclick = askChanges;
  document.getElementById("memoryButton").onclick = askMemorySeed;
  document.getElementById("closeDinnerEditor").onclick = closeDinnerEditor;
  document.getElementById("cancelDinnerButton").onclick = closeDinnerEditor;
  document.getElementById("clearDinnerButton").onclick = clearDinner;
  document.getElementById("dinnerForm").onsubmit = saveDinner;
  document.getElementById("toggleShoppingForm").onclick = () => setShoppingForm(!shoppingFormOpen);
  document.getElementById("cancelShoppingButton").onclick = () => setShoppingForm(false);
  document.getElementById("shoppingForm").onsubmit = addShopping;
  document.getElementById("toggleBoardForm").onclick = () => setBoardForm(!boardFormOpen);
  document.getElementById("boardForm").onsubmit = addBoardNote;
  document.getElementById("closeWeekendEditor").onclick = closeWeekendEditor;
  document.getElementById("cancelWeekendButton").onclick = closeWeekendEditor;
  document.getElementById("removeWeekendButton").onclick = removeWeekend;
  document.getElementById("weekendForm").onsubmit = saveWeekend;

  oma.ready(requestRefresh);
  oma.onChange(requestRefresh);
  oma.onPrefChange(render);
  setInterval(requestRefresh, 30000);
</script>
</body>
</html>
