<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meal Planner</title>
<meta name="description" content="The week's food laid out like a table — breakfast, lunch and dinner for all seven days at a glance. Place a meal yourself or have the AI plan the open slots.">
<meta name="oma-category" content="Planning">
<style>
  /* Shared primitives (.k-*) — this app's own copy; nothing here comes from the engine. */
  :root{--k-accent:var(--color-text-info,var(--color-ring-primary,#3b6cf6));--k-ok:var(--color-text-success,#2e9e5b);--k-warn:var(--color-text-warning,#b98200);--k-bad:var(--color-text-danger,#e5484d);--k-ink-4:color-mix(in oklab,var(--color-text-primary) 4%,transparent);--k-s2:8px;--k-s4:16px;--k-t-fast:120ms;--k-t:180ms;--k-ease:cubic-bezier(.2,.8,.3,1);--k-spring:cubic-bezier(.34,1.56,.64,1);--k-surface:var(--color-background-primary)}
  @media (prefers-reduced-motion:reduce){:root{--k-t-fast:0ms;--k-t:0ms}}
  .k-sub,.k-mut{font-size:var(--font-text-sm-size,12.5px)}
  .k-sub{color:var(--color-text-secondary)}
  .k-mut{color:var(--color-text-tertiary)}
  .k-btn{display:inline-flex;align-items:center;gap:6px;border:1px solid transparent;border-radius:var(--border-radius-md,10px);padding:6px 12px;font:inherit;font-size:var(--font-text-sm-size,12.5px);font-weight:600;cursor:pointer;background:var(--color-background-inverse);color:var(--color-text-inverse);transition:transform var(--k-t-fast) var(--k-ease),opacity var(--k-t-fast),background var(--k-t-fast)}
  .k-btn:hover{opacity:.9}
  .k-btn:active{transform:scale(.96)}
  .k-btn:disabled{opacity:.45;cursor:default;transform:none}
  .k-btn.sec{background:transparent;color:var(--color-text-primary);border-color:var(--color-border-primary)}
  .k-btn.ghost{background:transparent;color:var(--color-text-secondary)}
  :is(.k-btn.sec,.k-btn.ghost):hover{background:var(--k-ink-4);color:var(--color-text-primary);opacity:1}
  .k-btn.danger{background:transparent;color:var(--k-bad);border-color:color-mix(in oklab,var(--k-bad) 30%,transparent)}
  .k-btn.danger:hover{background:color-mix(in oklab,var(--k-bad) 10%,transparent);opacity:1}
  :is(.k-btn,.k-tab,.k-chip,.k-switch,.k-field):focus-visible{outline:2px solid var(--color-ring-primary,var(--k-accent));outline-offset:1px}
  .k-chip{display:inline-flex;align-items:center;gap:5px;border-radius:var(--border-radius-full,999px);border:1px solid var(--color-border-secondary);background:transparent;color:var(--color-text-secondary);padding:2px 10px;font:inherit;font-size:11.5px;font-weight:550;cursor:pointer;transition:background var(--k-t-fast),color var(--k-t-fast),border-color var(--k-t-fast),transform var(--k-t) var(--k-spring)}
  .k-chip:hover{background:var(--k-ink-4);color:var(--color-text-primary)}
  .k-chip:active{transform:scale(.93)}
  .k-chip.on{background:color-mix(in oklab,var(--k-accent) 10%,transparent);border-color:color-mix(in oklab,var(--k-accent) 28%,transparent);color:var(--k-accent)}
  .k-chip.static{cursor:default}
  .k-chip.static:hover{background:transparent;color:var(--color-text-secondary)}
  .k-chip.static:active{transform:none}
  .k-badge{display:inline-flex;align-items:center;gap:4px;border-radius:var(--border-radius-full,999px);padding:1px 8px;font-size:11px;font-weight:600;background:var(--k-ink-4);color:var(--color-text-secondary)}
  .k-badge.info{background:color-mix(in oklab,var(--k-accent) 10%,transparent);color:var(--k-accent)}
  .k-badge.ok{background:color-mix(in oklab,var(--k-ok) 12%,transparent);color:var(--k-ok)}
  .k-badge.warn{background:color-mix(in oklab,var(--k-warn) 14%,transparent);color:var(--k-warn)}
  .k-badge.bad{background:color-mix(in oklab,var(--k-bad) 12%,transparent);color:var(--k-bad)}
  .k-field{padding:6px 10px;border-radius:var(--border-radius-md,10px);border:1px solid var(--color-border-primary);background:transparent;color:inherit;font:inherit;font-size:var(--font-text-sm-size,12.5px);transition:border-color var(--k-t-fast),box-shadow var(--k-t-fast)}
  .k-field::placeholder{color:var(--color-text-tertiary)}
  .k-field:focus{outline:none;border-color:var(--k-accent);box-shadow:0 0 0 3px color-mix(in oklab,var(--k-accent) 10%,transparent)}
  .k-appbar{display:flex;align-items:center;gap:11px;padding:13px 16px}
  .k-appbar .k-appmark{display:grid;width:34px;height:34px;flex:none;place-items:center;border-radius:11px}
  .k-appbar .k-appmark svg{width:18px;height:18px}
  .k-appbar .k-appcopy{min-width:0;flex:1}
  .k-appbar .k-eyebrow{display:block;margin:0;color:var(--color-text-tertiary);font-size:9.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
  .k-appbar h1{margin:1px 0 0;font-size:15px;font-weight:650;letter-spacing:-.015em}
  body:not(.standalone) .k-appbar{border-bottom:1px solid var(--color-border-secondary);background:var(--k-surface)}
  .k-stage{max-width:1120px;margin-inline:auto;overflow-x:clip}

  /* Identity: ONE accent of the app's own (paprika). Everything structural is a host token. */
  .mp {
    --mp: light-dark(#4d7a1c, #a5d46a);
    --mp-soft: color-mix(in oklab, var(--mp) 9%, transparent);
    --mp-line: color-mix(in oklab, var(--mp) 30%, transparent);
    --k-accent: var(--mp);                 /* .k-* focus rings and .on chips speak the app's accent */
    --line: var(--color-border-secondary);
    position: relative;
  }
  .mp-mark {
    color: var(--mp);
    background: var(--mp-soft);
    border: 1px solid var(--mp-line);
  }
  .mp-bar .k-sub { margin-top: 1px; }
  .mp-ai {
    background: var(--mp);
    color: var(--color-background-primary);
    white-space: nowrap;
  }
  .mp-ai svg { width: 15px; height: 15px; }

  /* ── headline: the one number, the next meal, the week controls ── */
  .mp-head {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    justify-content: space-between;
    gap: var(--k-s2) var(--k-s4);
    padding: 14px 16px 12px;
  }
  .mp-count { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
  .mp-count b {
    color: var(--mp);
    font-size: 40px;
    font-weight: 700;
    line-height: .9;
    letter-spacing: -.03em;
    font-variant-numeric: tabular-nums;
  }
  .mp-count-copy { display: grid; gap: 2px; font-size: 13px; }
  .mp-count-copy strong { font-weight: 600; }
  .mp-count-copy span { color: var(--color-text-secondary); font-size: 12px; }
  .mp-nav { display: flex; align-items: center; gap: 4px; }
  .mp-nav .k-btn { padding: 5px 9px; }
  .mp-nav svg { width: 15px; height: 15px; }
  .mp-next {
    flex-basis: 100%;
    margin: 0;
    color: var(--color-text-secondary);
    font-size: 12.5px;
  }
  .mp-next b { color: var(--color-text-primary); font-weight: 600; }
  .mp-next .dot {
    display: inline-block;
    width: 7px;
    height: 7px;
    margin-right: 6px;
    border-radius: 50%;
    background: var(--mp);
    vertical-align: 1px;
  }
  .mp-err {
    margin: 0 16px 10px;
    padding: 8px 10px;
    border-radius: var(--border-radius-md, 10px);
    color: var(--color-text-danger);
    background: color-mix(in oklab, var(--color-text-danger) 9%, transparent);
    font-size: 12.5px;
  }
  .mp-hint { margin: 0 16px 10px; color: var(--color-text-secondary); font-size: 12.5px; }

  /* ── the table: days are rows, meals are places at it ── */
  .mp-table { margin: 0 16px 16px; border-top: 1px solid var(--line); }
  .mp-row {
    display: grid;
    grid-template-columns: 58px repeat(3, minmax(0, 1fr));
    border-bottom: 1px solid var(--line);
  }
  .mp-cols { border-bottom-color: var(--color-border-primary); }
  .mp-col {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 9px 10px 8px;
    color: var(--color-text-secondary);
    font-size: 12px;
    font-weight: 600;
  }
  .mp-col svg { width: 16px; height: 16px; color: var(--color-text-tertiary); }
  .mp-date {
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 1px;
    padding: 9px 0;
  }
  .mp-date .wd { color: var(--color-text-tertiary); font-size: 11.5px; font-weight: 600; }
  .mp-date .dn {
    font-size: 20px;
    font-weight: 650;
    line-height: 1;
    letter-spacing: -.02em;
    font-variant-numeric: tabular-nums;
  }
  .mp-date .k-badge { align-self: flex-start; margin-top: 3px; padding: 0 6px; font-size: 10.5px; }
  .mp-date .k-badge.info { background: var(--mp-soft); color: var(--mp); }
  .mp-day.is-today { background: color-mix(in oklab, var(--mp) 5%, transparent); }
  .mp-day.is-today .dn { color: var(--mp); }
  .mp-cell {
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 2px;
    min-width: 0;
    padding: 6px 6px;
    border-left: 1px solid var(--line);
  }
  .mp-cell.is-next { box-shadow: inset 3px 0 0 var(--mp); }
  .mp-ml { display: none; }
  .mp-dish, .mp-add {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    width: 100%;
    min-height: 34px;
    padding: 6px;
    border: 0;
    border-radius: var(--border-radius-sm, 7px);
    background: transparent;
    color: inherit;
    font: inherit;
    text-align: left;
    cursor: pointer;
  }
  .mp-dish:hover, .mp-add:hover { background: var(--k-ink-4); }
  .mp-dish:focus-visible, .mp-add:focus-visible { outline: 2px solid var(--color-ring-primary); outline-offset: -2px; }
  .mp-plate { width: 18px; height: 18px; flex: none; margin-top: 0; color: var(--mp); }
  .mp-nm { min-width: 0; font-size: 13px; font-weight: 560; line-height: 1.3; overflow-wrap: anywhere; }
  .mp-sv {
    display: inline-flex;
    align-items: center;
    gap: 2px;
    margin-left: 5px;
    color: var(--color-text-tertiary);
    font-size: 11.5px;
    font-weight: 500;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
  .mp-sv svg { width: 12px; height: 12px; }
  .mp-add { align-items: center; color: var(--color-text-tertiary); font-size: 12px; }
  .mp-add .mp-plate { color: var(--color-text-tertiary); opacity: .7; }
  .mp-add:hover { color: var(--mp); }
  .mp-add:hover .mp-plate { color: var(--mp); opacity: 1; }
  .mp-day.is-past .mp-nm { color: var(--color-text-secondary); font-weight: 500; }
  .mp-day.is-past .mp-dish .mp-plate { opacity: .5; }
  .mp-day.is-past .mp-add .mp-plate { opacity: .35; }
  .mp-day.is-past .mp-add span { visibility: hidden; }
  .mp[data-density="compact"] .mp-date { padding: 5px 0; }
  .mp[data-density="compact"] .mp-cell { padding: 2px 6px; }
  .mp[data-density="compact"] .mp-dish,
  .mp[data-density="compact"] .mp-add { min-height: 28px; padding: 4px 6px; }

  .mp-stray { margin: -4px 16px 16px; font-size: 12.5px; color: var(--color-text-secondary); }
  .mp-stray b { font-weight: 600; color: var(--color-text-primary); }
  .mp-stray ul { margin: 4px 0 0; padding-left: 18px; }

  /* ── placing a meal ── */
  .mp-layer {
    position: absolute;
    inset: 0;
    z-index: 10;
    display: grid;
    place-items: start center;
    padding: 16px;
    background: color-mix(in oklab, var(--color-background-primary) 70%, transparent);
    backdrop-filter: blur(3px);
  }
  .mp-sheet {
    width: min(100%, 420px);
    padding: 16px;
    border: 1px solid var(--color-border-primary);
    border-radius: var(--border-radius-lg, 14px);
    background: var(--color-background-primary);
    box-shadow: var(--shadow-lg, var(--shadow-md));
  }
  .mp-kick { margin: 0; color: var(--mp); font-size: 12px; font-weight: 600; }
  .mp-sheet h2 { margin: 2px 0 12px; font-size: 18px; font-weight: 650; letter-spacing: -.01em; }
  .mp-sheet .k-field { width: 100%; font-size: 14px; }
  .mp-sheet textarea.k-field { min-height: 62px; resize: vertical; line-height: 1.4; }
  .mp-lbl { display: block; margin: 12px 0 5px; color: var(--color-text-secondary); font-size: 12px; font-weight: 600; }
  .mp-lbl span { color: var(--color-text-tertiary); font-weight: 400; }
  .mp-recent { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .mp-recent .k-chip { padding: 3px 10px; }
  .mp-step { display: inline-flex; align-items: center; gap: 4px; }
  .mp-step .k-btn { width: 32px; justify-content: center; padding: 5px 0; }
  .mp-step output { min-width: 28px; text-align: center; font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .mp-acts { display: flex; align-items: center; gap: 8px; margin-top: 16px; }
  .mp-acts .sp { flex: 1; }
  .mp-save { background: var(--mp); color: var(--color-background-primary); }

  @media (max-width: 560px) {
    .mp-head { padding: 12px 14px 10px; }
    .mp-count b { font-size: 34px; }
    .mp-table { margin: 0 0 12px; }
    .mp-cols { display: none; }
    .mp-row { grid-template-columns: 62px minmax(0, 1fr); padding: 5px 0; }
    .mp-date { grid-row: 1 / span 3; justify-content: flex-start; padding: 6px 0 0 14px; }
    .mp-date .k-badge { padding: 0 5px; font-size: 10px; }
    .mp-cell { grid-column: 2; flex-direction: row; align-items: flex-start; gap: 2px; padding: 0 8px 0 0; border-left: 0; }
    .mp-cell.is-next { box-shadow: none; }
    .mp-cell.is-next .mp-ml { color: var(--mp); }
    .mp-ml {
      display: block;
      flex: none;
      width: 60px;
      padding: 8px 0 0 8px;
      color: var(--color-text-tertiary);
      font-size: 11.5px;
      font-weight: 600;
    }
    .mp-stack { flex: 1; min-width: 0; }
    .mp-stray { margin: 0 14px 14px; }
  }
  .mp-stack { display: grid; gap: 2px; min-width: 0; }

  @media (prefers-reduced-motion: no-preference) {
    .mp-dish, .mp-add { transition: background-color var(--k-t-fast) var(--k-ease), color var(--k-t-fast); }
    .mp-sheet { animation: mp-sheet 220ms var(--k-ease) both; }
    /* the one moment: a plate is set down on the table */
    .mp-dish.landed .mp-plate { animation: mp-set 560ms var(--k-spring) both; }
    .mp-dish.landed .mp-nm { animation: mp-rise 360ms var(--k-ease) 90ms both; }
    .mp-cell.landed { animation: mp-warm 1100ms var(--k-ease) both; }
    .mp-count b.bump { display: inline-block; animation: mp-bump 420ms var(--k-spring); }
    @keyframes mp-set {
      0% { transform: translateY(-14px) scale(.4) rotate(-120deg); opacity: 0; }
      60% { transform: translateY(1px) scale(1.18) rotate(8deg); opacity: 1; }
      100% { transform: none; }
    }
    @keyframes mp-rise { from { transform: translateY(5px); opacity: 0; } to { transform: none; opacity: 1; } }
    @keyframes mp-warm { 0% { background: color-mix(in oklab, var(--mp) 18%, transparent); } 100% { background: transparent; } }
    @keyframes mp-bump { 0% { transform: scale(1); } 45% { transform: scale(1.18); } 100% { transform: scale(1); } }
    @keyframes mp-sheet { from { opacity: 0; transform: translateY(8px) scale(.985); } to { opacity: 1; transform: none; } }
  }
</style>
</head>
<body>
<main class="k-stage mp" id="app">
  <header class="k-appbar mp-bar">
    <div class="k-appmark mp-mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="5.5"></circle>
        <path d="M3.5 4v5.5M6 4v5.5M3.5 7h2.5M4.75 9.5V20M20 4v16M20 4c-2 1.8-2 5.2 0 7"></path>
      </svg>
    </div>
    <div class="k-appcopy">
      <h1 id="appName">Meal planner</h1>
      <div class="k-sub" id="weekLabel"></div>
    </div>
    <button class="k-btn mp-ai" id="aiPlan" type="button">
      <svg aria-hidden="true" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m9.5 2 1.1 3.4L14 6.5l-3.4 1.1L9.5 11 8.4 7.6 5 6.5l3.4-1.1L9.5 2ZM15.5 11l.7 2.3 2.3.7-2.3.7-.7 2.3-.7-2.3-2.3-.7 2.3-.7.7-2.3Z"></path></svg>
      <span id="aiLabel">Plan with AI</span>
    </button>
  </header>

  <section class="mp-head">
    <div class="mp-count">
      <b id="planned">0</b>
      <div class="mp-count-copy">
        <strong id="plannedOf"></strong>
        <span id="servings"></span>
      </div>
    </div>
    <nav class="mp-nav">
      <button class="k-btn ghost" id="prevWeek" type="button"><svg aria-hidden="true" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m12.5 5-5 5 5 5"></path></svg></button>
      <button class="k-btn sec" id="thisWeek" type="button"></button>
      <button class="k-btn ghost" id="nextWeek" type="button"><svg aria-hidden="true" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m7.5 5 5 5-5 5"></path></svg></button>
    </nav>
    <p class="mp-next" id="nextLine" hidden></p>
  </section>

  <p class="mp-err" id="err" role="status" aria-live="polite" hidden></p>
  <p class="mp-hint" id="hint" hidden></p>

  <section class="mp-table" id="table" role="table"></section>
  <section class="mp-stray" id="stray" hidden></section>

  <div class="mp-layer" id="layer" hidden>
    <form class="mp-sheet" id="sheet" autocomplete="off">
      <p class="mp-kick" id="edKick"></p>
      <h2 id="edTitle"></h2>
      <label class="mp-lbl" for="dishIn" id="lDish"></label>
      <input class="k-field" id="dishIn" maxlength="120" required>
      <div class="mp-recent" id="recent"></div>
      <span class="mp-lbl" id="lServ"></span>
      <div class="mp-step">
        <button class="k-btn sec" type="button" id="servDown" aria-label="−">−</button>
        <output id="servOut">2</output>
        <button class="k-btn sec" type="button" id="servUp" aria-label="+">+</button>
      </div>
      <label class="mp-lbl" for="noteIn" id="lNote"></label>
      <textarea class="k-field" id="noteIn" maxlength="280"></textarea>
      <div class="mp-acts">
        <button class="k-btn danger" type="button" id="edDelete" hidden></button>
        <span class="sp"></span>
        <button class="k-btn ghost" type="button" id="edCancel"></button>
        <button class="k-btn mp-save" type="submit" id="edSave"></button>
      </div>
    </form>
  </div>
</main>

<script type="module">
  // DATA CONTRACT (unchanged): collection "meal-planner"; one item per meal;
  // group = meal type; fields {date: "YYYY-MM-DD", meal_type: breakfast|lunch|dinner, dish, servings, ingredients_note}.
  const TYPES = ["breakfast", "lunch", "dinner"];
  const ENDS = { breakfast: 10, lunch: 14.5, dinner: 21 };      // after this hour the meal is behind us

  const COPY = {
    en: {
      app: "Meal planner", ai: "Plan with AI", thisWeek: "This week", nextWeek: "Next week", lastWeek: "Last week",
      prev: "Previous week", next: "Next week", today: "Today",
      meals: { breakfast: "Breakfast", lunch: "Lunch", dinner: "Dinner" },
      of: (n) => `of 21 meals planned`,
      servings: (s, open) => `${s} ${s === 1 ? "serving" : "servings"} · ${open} ${open === 1 ? "slot" : "slots"} open`,
      nextUp: (meal, when, dish) => dish ? `Next up · ${meal} ${when}: <b>${dish}</b>` : `Next up · ${meal} ${when} is still open`,
      todayWord: "today", tomorrowWord: "tomorrow",
      add: "Add", place: "Place a meal", edit: "Edit meal", dish: "Dish", dishPh: "e.g. Lemon herb chicken",
      recent: "From recent weeks", serv: "Servings", note: "Note", optional: "optional",
      notePh: "Key ingredients, prep, what to use up…",
      save: "Place it", saveEdit: "Save", cancel: "Cancel", del: "Remove",
      nServ: (n) => `${n} ${n === 1 ? "serving" : "servings"}`,
      empty: "An empty table. Tap any slot to place a meal — or ask the AI: “Plan our dinners this week.”",
      stray: (n) => `${n} not on the table`, noDate: "no date", err: "That didn't save — try again.",
      errAi: "Couldn't reach the assistant — try again.",
      ask: (from, to, open, kept) => `Please plan my meal-planner week ${from} to ${to}: fill the ${open} open breakfast, lunch and dinner slots with practical, varied dishes.${kept.length ? ` Keep these ${kept.length} meals as they are: ${kept.join("; ")}.` : ""} Each new item: group = meal type, fields {date, meal_type, dish, servings, ingredients_note}.`,
    },
    zh: {
      app: "膳食计划", ai: "让 AI 来排", thisWeek: "本周", nextWeek: "下周", lastWeek: "上周",
      prev: "上一周", next: "下一周", today: "今天",
      meals: { breakfast: "早餐", lunch: "午餐", dinner: "晚餐" },
      of: () => `/ 21 餐已安排`,
      servings: (s, open) => `共 ${s} 份 · 还空 ${open} 餐`,
      nextUp: (meal, when, dish) => dish ? `下一顿 · ${when}${meal}：<b>${dish}</b>` : `下一顿 · ${when}${meal}还空着`,
      todayWord: "今天", tomorrowWord: "明天",
      add: "添加", place: "安排一餐", edit: "修改这一餐", dish: "菜名", dishPh: "比如：番茄炒蛋",
      recent: "最近常吃", serv: "份数", note: "备注", optional: "可选",
      notePh: "主要食材、提前准备、要用掉的东西…",
      save: "放上桌", saveEdit: "保存", cancel: "取消", del: "移除",
      nServ: (n) => `${n} 份`,
      empty: "这一周还空着。点任意格子放一餐，或者对 AI 说「帮我排这周的晚饭」。",
      stray: (n) => `${n} 餐不在表里`, noDate: "无日期", err: "没保存上，再试一次。",
      errAi: "没能联系上助手，请重试。",
      ask: (from, to, open, kept) => `请帮我安排 meal-planner 里 ${from} 到 ${to} 这一周：把空着的 ${open} 个早/午/晚餐位填上实际、有变化的菜。${kept.length ? `保留这 ${kept.length} 餐不动：${kept.join("；")}。` : ""}每个新条目：group = 餐别，fields {date, meal_type, dish, servings, ingredients_note}。`,
    },
  };

  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const locale = () => { const v = oma.pref("locale", "auto"); return v === "auto" ? navigator.language : v; };
  const T = () => (String(locale()).toLowerCase().startsWith("zh") ? COPY.zh : COPY.en);
  const fmt = (d, o) => new Intl.DateTimeFormat(locale(), o).format(d);

  // ── time: facts are stored, judgments are computed here, every render ──
  const dateOnly = (s) => {
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(s || "").slice(0, 10));
    return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null;
  };
  const today = () => { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); };
  const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
  const keyOf = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  const startOfWeek = (d) => {
    const mode = oma.pref("week_start", "monday");
    const first = mode === "sunday" ? 0 : mode === "saturday" ? 6 : 1;
    return addDays(d, -((d.getDay() - first + 7) % 7));
  };
  const typeOf = (it) => {
    const t = String(it.fields?.meal_type || it.group || "").trim().toLowerCase();
    return TYPES.includes(t) ? t : null;
  };
  const servOf = (f) => Math.max(1, parseInt(f?.servings, 10) || 1);

  // ── optimistic overlay: a placed plate shows NOW; the store's state (or a refusal) settles it ──
  const overlay = new Map();                                 // tok → {kind, id, key, fields, before, acked}
  let tokN = 0;
  function reconcile(state) {
    const byId = new Map(state.items.map((it) => [it.id, it]));
    for (const [tok, o] of overlay) {
      if (o.acked) { overlay.delete(tok); continue; }
      if (o.kind === "delete" && !byId.has(o.id)) overlay.delete(tok);
      if (o.kind === "update" && byId.has(o.id) && same(byId.get(o.id).fields, o.fields)) overlay.delete(tok);
      if (o.kind === "add" && state.items.some((it) => !o.before.has(it.id) && it.fields?.date === o.fields.date && typeOf(it) === o.fields.meal_type && it.fields?.dish === o.fields.dish)) overlay.delete(tok);
    }
  }
  const same = (a, b) => ["date", "meal_type", "dish", "servings", "ingredients_note"].every((k) => String(a?.[k] ?? "") === String(b?.[k] ?? ""));

  function mergedItems(state) {
    const del = new Set(), upd = new Map(), adds = [];
    for (const [tok, o] of overlay) {
      if (o.kind === "delete") del.add(o.id);
      if (o.kind === "update") upd.set(o.id, o.fields);
      if (o.kind === "add") adds.push({ id: o.id || tok, group: o.fields.meal_type, position: 1e9, fields: o.fields });
    }
    const real = state.items.filter((it) => !del.has(it.id)).map((it) => (upd.has(it.id) ? { ...it, fields: { ...it.fields, ...upd.get(it.id) } } : it));
    return real.concat(adds.filter((a) => !real.some((it) => it.id === a.id)));
  }

  // ── the week model: header numbers and the table read THIS object, nothing else ──
  let weekStart = null;
  function model(state) {
    const now = new Date(), t0 = today();
    const days = Array.from({ length: 7 }, (_, i) => addDays(weekStart, i));
    const inWeek = new Set(days.map(keyOf));
    const slots = new Map();
    const stray = [];
    for (const it of mergedItems(state).sort((a, b) => (a.position ?? 0) - (b.position ?? 0))) {
      const d = dateOnly(it.fields?.date), type = typeOf(it);
      if (!d) { stray.push(it); continue; }
      if (!inWeek.has(keyOf(d))) continue;
      if (!type) { stray.push(it); continue; }
      const k = `${keyOf(d)}|${type}`;
      if (!slots.has(k)) slots.set(k, []);
      slots.get(k).push(it);
    }
    let planned = 0, servings = 0;
    for (const list of slots.values()) { planned += 1; servings += Math.max(...list.map((it) => servOf(it.fields))); }
    // the next meal still ahead of us — only meaningful while looking at the current week
    let next = null;
    const hour = now.getHours() + now.getMinutes() / 60;
    for (const d of days) {
      if (d < t0) continue;
      for (const type of TYPES) {
        if (+d === +t0 && hour >= ENDS[type]) continue;
        next = { key: `${keyOf(d)}|${type}`, day: d, type };
        break;
      }
      if (next) break;
    }
    if (next && !inWeek.has(keyOf(t0)) && +next.day !== +addDays(t0, 1)) next = null;
    return { days, slots, stray, planned, servings, next, t0, anyItems: state.items.length > 0 };
  }

  // ── icons ──
  const SVG = (d, vb = 24) => `<svg viewBox="0 0 ${vb} ${vb}" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
  const ICON = {
    breakfast: SVG('<path d="M4.5 9.5h11v4.5a5 5 0 0 1-5 5h-1a5 5 0 0 1-5-5V9.5Z"/><path d="M15.5 10.5h1.2a2.4 2.4 0 0 1 0 4.8h-1.4"/><path d="M8 3.5c-.8.9.8 1.6 0 2.8M11.5 3.5c-.8.9.8 1.6 0 2.8"/>'),
    lunch: SVG('<path d="M3.5 11.5h17a8.5 7.5 0 0 1-17 0Z"/><path d="M9 20.5h6"/><path d="m13 3.5-2.5 7.5M18 4.5l-4.5 6.5"/>'),
    dinner: SVG('<path d="M5 16.5a7 7 0 0 1 14 0"/><path d="M3 16.5h18M4.5 19.5h15"/><path d="M12 9.5V8M10.5 7.5h3"/>'),
    plate: SVG('<circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="5"/>'),
    empty: SVG('<circle cx="12" cy="12" r="8.5" stroke-dasharray="2.6 2.6"/><path d="M12 8.5v7M8.5 12h7"/>'),
    person: SVG('<circle cx="10" cy="6.5" r="2.8"/><path d="M4.5 17c.6-3.4 2.6-5.2 5.5-5.2s4.9 1.8 5.5 5.2"/>', 20),
  };

  // ── build once per week shape; update cells in place afterwards ──
  let built = null;                     // {shape, cells: Map key → {el, stack, sig}, rows: Map iso → row}
  const landed = new Set();             // slot keys that just received a plate (animate once)

  function build(m) {
    const t = T(), table = $("table");
    table.replaceChildren();
    const head = document.createElement("div");
    head.className = "mp-row mp-cols";
    head.setAttribute("role", "row");
    head.innerHTML = `<span role="columnheader"></span>` + TYPES.map((ty) => `<span class="mp-col" role="columnheader">${ICON[ty]}${esc(t.meals[ty])}</span>`).join("");
    table.append(head);
    const cells = new Map(), rows = new Map();
    for (const d of m.days) {
      const row = document.createElement("div");
      row.className = "mp-row mp-day";
      row.setAttribute("role", "row");
      const date = document.createElement("div");
      date.className = "mp-date";
      date.setAttribute("role", "rowheader");
      date.innerHTML = `<span class="wd">${esc(fmt(d, { weekday: "short" }))}</span><b class="dn">${d.getDate()}</b>`;
      row.append(date);
      for (const type of TYPES) {
        const key = `${keyOf(d)}|${type}`;
        const cell = document.createElement("div");
        cell.className = "mp-cell";
        cell.setAttribute("role", "cell");
        cell.innerHTML = `<span class="mp-ml">${esc(t.meals[type])}</span>`;
        const stack = document.createElement("div");
        stack.className = "mp-stack";
        cell.append(stack);
        row.append(cell);
        cells.set(key, { el: cell, stack, sig: null, day: d, type });
      }
      rows.set(keyOf(d), { el: row, date });
      table.append(row);
    }
    return { cells, rows };
  }

  function fillCell(c, list, past) {
    const t = T();
    c.stack.replaceChildren();
    if (!list.length) {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "mp-add";
      b.innerHTML = `<span class="mp-plate">${ICON.empty}</span><span>${esc(t.add)}</span>`;
      b.setAttribute("aria-label", `${t.add} · ${t.meals[c.type]} · ${fmt(c.day, { weekday: "long", day: "numeric", month: "long" })}`);
      b.onclick = () => openEditor(c.day, c.type, null);
      c.stack.append(b);
      return;
    }
    list.forEach((it, i) => {
      const f = it.fields || {};
      const n = servOf(f);
      const b = document.createElement("button");
      b.type = "button";
      b.className = "mp-dish";
      b.dataset.i = String(i);
      const dish = String(f.dish || "").trim() || "—";
      b.innerHTML = `<span class="mp-plate">${ICON.plate}</span><span class="mp-nm">${esc(dish)}<span class="mp-sv" aria-label="${esc(t.nServ(n))}">${ICON.person}${n}</span></span>`;
      if (f.ingredients_note) b.title = String(f.ingredients_note);
      b.onclick = () => {
        const cur = (model(latest).slots.get(`${keyOf(c.day)}|${c.type}`) || [])[i];
        if (cur && !overlay.has(cur.id)) openEditor(c.day, c.type, cur);     // a plate still landing is not editable yet
      };
      c.stack.append(b);
    });
  }

  let latest = { items: [] };
  let shownPlanned = null;
  function render(state) {
    latest = state;
    const t = T();
    const app = $("app");
    app.dataset.density = oma.pref("density", "comfortable");
    if (!weekStart) weekStart = startOfWeek(today());
    weekStart = startOfWeek(weekStart);                     // re-snaps when week_start changes
    const m = model(state);
    const shape = [keyOf(weekStart), locale()].join("|");
    if (!built || built.shape !== shape) built = { shape, ...build(m) };

    const thisStart = startOfWeek(today());
    const isThis = +weekStart === +thisStart;
    for (const [iso, r] of built.rows) {
      const d = dateOnly(iso);
      r.el.classList.toggle("is-today", +d === +m.t0);
      r.el.classList.toggle("is-past", d < m.t0);
      let badge = r.date.querySelector(".k-badge");
      if (+d === +m.t0 && !badge) {
        badge = document.createElement("span");
        badge.className = "k-badge info";
        badge.textContent = t.today;
        r.date.append(badge);
      } else if (+d !== +m.t0 && badge) badge.remove();
    }
    for (const [key, c] of built.cells) {
      const list = m.slots.get(key) || [];
      const past = c.day < m.t0;
      const sig = JSON.stringify([past, list.map((it) => [it.fields?.dish, servOf(it.fields), it.fields?.ingredients_note || ""])]);
      if (sig !== c.sig) { fillCell(c, list, past); c.sig = sig; }
      c.el.classList.toggle("is-next", !!(isThis && m.next && m.next.key === key));
      if (landed.has(key)) {
        landed.delete(key);
        const target = c.stack.querySelector(".mp-dish:last-child");
        for (const el of [c.el, target]) {
          if (!el) continue;
          el.classList.remove("landed");
          void el.offsetWidth;
          el.classList.add("landed");
          el.addEventListener("animationend", () => el.classList.remove("landed"), { once: true });
        }
      }
    }

    // headline — the same model the table just drew
    const num = $("planned");
    num.textContent = String(m.planned);
    if (shownPlanned !== null && m.planned > shownPlanned) {
      num.classList.remove("bump");
      void num.offsetWidth;
      num.classList.add("bump");
    }
    shownPlanned = m.planned;
    $("plannedOf").textContent = t.of(m.planned);
    $("servings").textContent = t.servings(m.servings, 21 - m.planned);

    const offset = Math.round((weekStart - thisStart) / (7 * 86400000));
    const rel = offset === 0 ? t.thisWeek : offset === 1 ? t.nextWeek : offset === -1 ? t.lastWeek : "";
    const last = addDays(weekStart, 6);
    const rf = new Intl.DateTimeFormat(locale(), { month: "short", day: "numeric" });
    const range = typeof rf.formatRange === "function" ? rf.formatRange(weekStart, last) : `${rf.format(weekStart)} – ${rf.format(last)}`;
    $("weekLabel").textContent = rel ? `${range} · ${rel}` : range;
    $("thisWeek").disabled = isThis;

    const nl = $("nextLine");
    if (isThis && m.next) {
      const list = m.slots.get(m.next.key) || [];
      const when = +m.next.day === +m.t0 ? t.todayWord : t.tomorrowWord;
      const meal = t === COPY.zh ? t.meals[m.next.type] : t.meals[m.next.type].toLowerCase();
      const dish = list.map((it) => esc(String(it.fields?.dish || "").trim())).filter(Boolean).join(" + ");
      nl.innerHTML = `<span class="dot"></span>${t.nextUp(meal, when, dish)}`;
      nl.hidden = false;
    } else nl.hidden = true;

    $("hint").textContent = t.empty;
    $("hint").hidden = m.anyItems;

    const st = $("stray");
    if (m.stray.length) {
      st.hidden = false;
      st.innerHTML = `<b>${esc(t.stray(m.stray.length))}</b><ul>${m.stray.map((it) => {
        const f = it.fields || {};
        const bits = [f.meal_type || it.group || "", dateOnly(f.date) ? f.date : t.noDate].filter(Boolean).join(" · ");
        return `<li>${esc(String(f.dish || "—"))} <span class="k-mut">(${esc(bits)})</span></li>`;
      }).join("")}</ul>`;
    } else st.hidden = true;

    if (editing && editing.id && !mergedItems(state).some((it) => it.id === editing.id)) closeEditor();
  }

  function applyCopy() {
    const t = T();
    document.documentElement.lang = t === COPY.zh ? "zh-CN" : "en";
    document.title = t.app;
    $("appName").textContent = t.app;
    $("aiLabel").textContent = t.ai;
    $("thisWeek").textContent = t.today;
    $("prevWeek").setAttribute("aria-label", t.prev);
    $("nextWeek").setAttribute("aria-label", t.next);
    $("lDish").textContent = t.dish;
    $("dishIn").placeholder = t.dishPh;
    $("lServ").textContent = t.serv;
    $("lNote").innerHTML = `${esc(t.note)} <span>${esc(t.optional)}</span>`;
    $("noteIn").placeholder = t.notePh;
    $("edCancel").textContent = t.cancel;
    $("edDelete").textContent = t.del;
  }

  // ── errors ──
  let errTimer = null;
  function showError(msg) {
    clearTimeout(errTimer);
    $("err").textContent = msg;
    $("err").hidden = false;
    errTimer = setTimeout(() => { $("err").hidden = true; }, 7000);
  }

  // ── the editor: place or change one meal ──
  let editing = null;                    // {day, type, id, servings}
  function recentFor(type, m) {
    const thisWeek = new Set();
    for (const list of m.slots.values()) for (const it of list) thisWeek.add(String(it.fields?.dish || "").trim().toLowerCase());
    const tally = new Map();
    for (const it of latest.items) {
      if (typeOf(it) !== type) continue;
      const dish = String(it.fields?.dish || "").trim();
      const k = dish.toLowerCase();
      if (!dish || thisWeek.has(k)) continue;
      const prev = tally.get(k);
      const date = String(it.fields?.date || "");
      if (!prev) tally.set(k, { dish, n: 1, date, fields: it.fields });
      else { prev.n += 1; if (date > prev.date) { prev.date = date; prev.fields = it.fields; } }
    }
    return [...tally.values()].sort((a, b) => b.n - a.n || b.date.localeCompare(a.date)).slice(0, 5);
  }
  function usualServings(type) {
    const n = new Map();
    for (const it of latest.items) if (typeOf(it) === type) { const s = servOf(it.fields); n.set(s, (n.get(s) || 0) + 1); }
    return [...n.entries()].sort((a, b) => b[1] - a[1])[0]?.[0] || 2;
  }
  function setServ(v) {
    editing.servings = Math.min(99, Math.max(1, v));
    $("servOut").textContent = String(editing.servings);
  }
  function openEditor(day, type, item) {
    const t = T();
    const f = item?.fields || {};
    editing = { day, type, id: item?.id || null, servings: 2 };
    const preference = oma.pref("date_format", "auto");
    const dateText = preference === "auto" ? fmt(day, { weekday: "long", month: "long", day: "numeric" }) : ({
      "yyyy-mm-dd": keyOf(day),
      "dd/mm/yyyy": keyOf(day).split("-").reverse().join("/"),
      "mm/dd/yyyy": `${keyOf(day).slice(5, 7)}/${keyOf(day).slice(8)}/${keyOf(day).slice(0, 4)}`,
    }[preference] || keyOf(day));
    $("edKick").textContent = `${t.meals[type]} · ${dateText}`;
    $("edTitle").textContent = item ? t.edit : t.place;
    $("edSave").textContent = item ? t.saveEdit : t.save;
    $("dishIn").value = f.dish || "";
    $("noteIn").value = f.ingredients_note || "";
    setServ(item ? servOf(f) : usualServings(type));
    $("edDelete").hidden = !item;
    const rec = $("recent");
    rec.replaceChildren();
    if (!item) {
      for (const r of recentFor(type, model(latest))) {
        const chip = document.createElement("button");
        chip.type = "button";
        chip.className = "k-chip";
        chip.textContent = r.dish;
        chip.onclick = () => {
          $("dishIn").value = r.dish;
          setServ(servOf(r.fields));
          if (!$("noteIn").value.trim()) $("noteIn").value = r.fields?.ingredients_note || "";
          for (const c of rec.children) c.classList.toggle("on", c === chip);
        };
        rec.append(chip);
      }
    }
    rec.hidden = !rec.children.length;
    $("layer").hidden = false;
    // the widget is as tall as its content, so a sheet pinned to the top can sit off-screen from a
    // slot tapped near the bottom: open it beside the slot, kept inside the page
    const layer = $("layer"), sheet = $("sheet");
    const cell = built?.cells.get(`${keyOf(day)}|${type}`)?.el;
    const top = cell ? cell.getBoundingClientRect().top - layer.getBoundingClientRect().top - 90 : 16;
    layer.style.paddingTop = `${Math.max(16, Math.min(top, layer.clientHeight - sheet.offsetHeight - 16))}px`;
    $("dishIn").focus({ preventScroll: true });
  }
  function closeEditor() {
    editing = null;
    $("layer").hidden = true;
  }

  async function write(entry, call) {
    const tok = `t${++tokN}`;
    overlay.set(tok, { ...entry, acked: false });
    render(latest);
    let ok = false;
    try {
      const ack = await call();
      ok = !!ack && ack.ok !== false;
      const o = overlay.get(tok);
      if (o && ok && ack.id && entry.kind === "add") o.id = ack.id;
    } catch { ok = false; }
    const o = overlay.get(tok);
    if (ok) { if (o) o.acked = true; }
    else { overlay.delete(tok); showError(T().err); }
    if (!ok) render(latest);
  }

  $("sheet").addEventListener("submit", (e) => {
    e.preventDefault();
    if (!editing) return;
    const dish = $("dishIn").value.trim();
    if (!dish) return;
    const { day, type, id } = editing;
    const fields = { date: keyOf(day), meal_type: type, dish, servings: editing.servings, ingredients_note: $("noteIn").value.trim() };
    const key = `${keyOf(day)}|${type}`;
    closeEditor();
    if (id) {
      write({ kind: "update", id, fields }, () => oma.updateItem(id, fields));
    } else {
      landed.add(key);
      const before = new Set(latest.items.map((it) => it.id));
      write({ kind: "add", fields, before }, () => oma.addItem({ group: type, fields }));
    }
  });
  $("edDelete").onclick = () => {
    if (!editing?.id) { closeEditor(); return; }
    const id = editing.id;
    closeEditor();
    // confirm_delete is the engine's: the shell asks, and a cancel comes back as ok:false
    (async () => {
      const ack = await oma.deleteItem(id).catch(() => null);
      if (ack && ack.ok === false && ack.reason !== "cancelled" && !/cancel/i.test(String(ack.reason || ""))) showError(T().err);
    })();
  };
  $("servDown").onclick = () => setServ(editing.servings - 1);
  $("servUp").onclick = () => setServ(editing.servings + 1);
  $("edCancel").onclick = closeEditor;
  $("layer").addEventListener("click", (e) => { if (e.target === $("layer")) closeEditor(); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && editing) closeEditor(); });

  const go = (n) => { weekStart = n === 0 ? startOfWeek(today()) : addDays(weekStart, n * 7); render(latest); };
  $("prevWeek").onclick = () => go(-1);
  $("nextWeek").onclick = () => go(1);
  $("thisWeek").onclick = () => go(0);

  // the AI hand-off: a proposal into the chat, carrying the week's open slots
  $("aiPlan").onclick = async () => {
    const t = T(), m = model(latest), b = $("aiPlan");
    const kept = [];
    for (const d of m.days) for (const type of TYPES) for (const it of m.slots.get(`${keyOf(d)}|${type}`) || []) kept.push(`${keyOf(d)} ${type}: ${it.fields?.dish} (${servOf(it.fields)})`);
    b.disabled = true;
    try {
      const r = await oma.sendMessage(t.ask(keyOf(m.days[0]), keyOf(m.days[6]), 21 - m.planned, kept));
      if (r && r.isError === true && !r.degraded) showError(t.errAi);
    } catch { showError(t.errAi); }
    finally { b.disabled = false; }
  };

  if (oma.standalone) document.body.classList.add("standalone");
  oma.ready((s) => { reconcile(s); applyCopy(); render(s); });
  oma.onChange((s) => { reconcile(s); render(s); });
  oma.onPrefChange(() => { built = null; applyCopy(); render(latest); });
</script>
</body>
