<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hydration Tally</title>
<meta name="description" content="A glass that fills as you drink: one tap logs a pour against your daily goal, with the past week and today's pours beside it.">
<meta name="oma-category" content="Health & Habits">
<style>
  /* Shared primitives (.k-*) — this app's own copy; nothing here comes from the engine. */
  :root{--k-accent:var(--color-text-info,var(--color-ring-primary,#3b6cf6));--k-ok:var(--color-text-success,#2e9e5b);--k-warn:var(--color-text-warning,#b98200);--k-bad:var(--color-text-danger,#e5484d);--k-ink-4:color-mix(in oklab,var(--color-text-primary) 4%,transparent);--k-accent-bg:color-mix(in oklab,var(--k-accent) 10%,transparent);--k-accent-brd:color-mix(in oklab,var(--k-accent) 28%,transparent);--k-t-fast:120ms;--k-t:180ms;--k-ease:cubic-bezier(.2,.8,.3,1);--k-spring:cubic-bezier(.34,1.56,.64,1);--k-surface:var(--color-background-primary)}
  @media (prefers-reduced-motion:reduce){:root{--k-t-fast:0ms;--k-t:0ms}}
  .k-btn{display:inline-flex;align-items:center;gap:6px;border:1px solid transparent;border-radius:var(--border-radius-md,10px);padding:6px 12px;font:inherit;font-size:var(--font-text-sm-size,12.5px);font-weight:600;cursor:pointer;background:var(--color-background-inverse);color:var(--color-text-inverse);transition:transform var(--k-t-fast) var(--k-ease),opacity var(--k-t-fast),background var(--k-t-fast)}
  .k-btn:hover{opacity:.9}
  .k-btn:active{transform:scale(.96)}
  .k-btn:disabled{opacity:.45;cursor:default;transform:none}
  .k-btn.sec{background:transparent;color:var(--color-text-primary);border-color:var(--color-border-primary)}
  .k-btn.ghost{background:transparent;color:var(--color-text-secondary)}
  :is(.k-btn.sec,.k-btn.ghost):hover{background:var(--k-ink-4);color:var(--color-text-primary);opacity:1}
  .k-btn.danger{background:transparent;color:var(--k-bad);border-color:color-mix(in oklab,var(--k-bad) 30%,transparent)}
  .k-btn.danger:hover{background:color-mix(in oklab,var(--k-bad) 10%,transparent);opacity:1}
  :is(.k-btn,.k-tab,.k-chip,.k-switch,.k-field):focus-visible{outline:2px solid var(--color-ring-primary,var(--k-accent));outline-offset:1px}
  .k-chip{display:inline-flex;align-items:center;gap:5px;border-radius:var(--border-radius-full,999px);border:1px solid var(--color-border-secondary);background:transparent;color:var(--color-text-secondary);padding:2px 10px;font:inherit;font-size:11.5px;font-weight:550;cursor:pointer;transition:background var(--k-t-fast),color var(--k-t-fast),border-color var(--k-t-fast),transform var(--k-t) var(--k-spring)}
  .k-chip:hover{background:var(--k-ink-4);color:var(--color-text-primary)}
  .k-chip:active{transform:scale(.93)}
  .k-chip.on{background:color-mix(in oklab,var(--k-accent) 10%,transparent);border-color:color-mix(in oklab,var(--k-accent) 28%,transparent);color:var(--k-accent)}
  .k-chip.static{cursor:default}
  .k-chip.static:hover{background:transparent;color:var(--color-text-secondary)}
  .k-chip.static:active{transform:none}
  .k-badge{display:inline-flex;align-items:center;gap:4px;border-radius:var(--border-radius-full,999px);padding:1px 8px;font-size:11px;font-weight:600;background:var(--k-ink-4);color:var(--color-text-secondary)}
  .k-badge.info{background:color-mix(in oklab,var(--k-accent) 10%,transparent);color:var(--k-accent)}
  .k-badge.ok{background:color-mix(in oklab,var(--k-ok) 12%,transparent);color:var(--k-ok)}
  .k-badge.warn{background:color-mix(in oklab,var(--k-warn) 14%,transparent);color:var(--k-warn)}
  .k-badge.bad{background:color-mix(in oklab,var(--k-bad) 12%,transparent);color:var(--k-bad)}
  .k-appbar{display:flex;align-items:center;gap:11px;padding:13px 16px}
  .k-appbar .k-appmark{display:grid;width:34px;height:34px;flex:none;place-items:center;border-radius:11px}
  .k-appbar .k-appmark svg{width:18px;height:18px}
  .k-appbar .k-appcopy{min-width:0;flex:1}
  .k-appbar .k-eyebrow{display:block;margin:0;color:var(--color-text-tertiary);font-size:9.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
  .k-appbar h1{margin:1px 0 0;font-size:15px;font-weight:650;letter-spacing:-.015em}
  body:not(.standalone) .k-appbar{border-bottom:1px solid var(--color-border-secondary);background:var(--k-surface)}
  .k-stage{max-width:760px;margin-inline:auto;overflow-x:clip}

  /* The signature is THE GLASS: today's intake is its water level, the goal is a mark on its side,
     and every pour is a faint layer inside the water. Everything on the page — the big number, the
     week of small glasses, the streak, the pour list — comes from one model() pass over the same
     rows, so no number here can disagree with the water. */
  .ht {
    --ht: light-dark(#0a74a6, #5cc6ee);
    --k-accent: var(--ht);
    --k-accent-bg: color-mix(in oklab, var(--ht) 10%, transparent);
    --k-accent-brd: color-mix(in oklab, var(--ht) 30%, transparent);
    --ht-water: color-mix(in oklab, var(--ht) 17%, transparent);
    --ht-line: var(--color-text-tertiary);
  }
  button { font: inherit; color: inherit; }

  /* ── app bar: mark · name · the AI hand-off ── */
  .ht-mark { color: var(--ht); border: 1px solid var(--k-accent-brd); background: var(--k-accent-bg); }
  .ht-mark svg { fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linejoin: round; stroke-linecap: round; }
  .ht-bar .k-btn.sec { margin-left: auto; flex: none; }
  .ht-bar .k-btn svg { width: 15px; height: 15px; }

  .error-strip {
    margin: 10px 20px 0;
    padding: 8px 10px;
    border: 1px solid color-mix(in oklab, var(--color-text-danger) 32%, var(--color-border-secondary));
    border-radius: var(--border-radius-md, 10px);
    background: color-mix(in oklab, var(--color-text-danger) 8%, transparent);
    color: var(--color-text-danger);
    font-size: var(--font-text-sm-size, 12px);
  }

  /* ── hero: the glass, the number, the pour ── */
  .hero {
    display: grid;
    grid-template-columns: 206px minmax(0, 1fr);
    grid-template-areas: "glass read" "glass pour";
    column-gap: 32px;
    row-gap: 18px;
    align-items: center;
    padding: 22px 28px 24px 24px;
  }
  .glass { grid-area: glass; margin: 0; }
  .glass svg { display: block; width: 100%; height: auto; overflow: visible; }
  .read { grid-area: read; align-self: end; min-width: 0; }
  .pour { grid-area: pour; align-self: start; min-width: 0; }

  .g-out { fill: none; stroke: var(--color-text-secondary); stroke-width: 2.2; stroke-linejoin: round; stroke-linecap: round; }
  .g-base { fill: none; stroke: var(--color-border-primary); stroke-width: 1.6; stroke-linecap: round; }
  .g-tick { stroke: var(--color-border-primary); stroke-width: 1.4; stroke-linecap: round; }
  .g-goal { stroke: var(--ht); stroke-width: 1.8; stroke-linecap: round; }
  .g-lbl { fill: var(--color-text-tertiary); font: 500 9px var(--font-sans); font-variant-numeric: tabular-nums; }
  .g-lbl.goal { fill: var(--ht); font-weight: 650; }
  .w-body { fill: var(--ht-water); }
  .w-surf { fill: none; stroke: var(--ht); stroke-width: 2.2; stroke-linecap: round; }
  .w-layer { stroke: color-mix(in oklab, var(--ht) 30%, transparent); stroke-width: 1; stroke-dasharray: 2 3; }
  .stream { fill: none; stroke: var(--ht); stroke-width: 3.5; stroke-linecap: round; opacity: 0; }
  #level, #surf { transform-box: view-box; }

  .kicker { margin: 0 0 6px; color: var(--color-text-secondary); font-size: var(--font-text-sm-size, 12px); font-weight: 550; }
  .big { margin: 0; display: flex; align-items: baseline; gap: 6px; line-height: .95; }
  .big b { font-size: 60px; font-weight: 720; letter-spacing: -.045em; font-variant-numeric: tabular-nums; }
  .big span { color: var(--color-text-secondary); font-size: 17px; font-weight: 600; }
  .of { margin: 8px 0 0; color: var(--color-text-secondary); font-size: var(--font-text-md-size, 14px); font-variant-numeric: tabular-nums; }
  .status { margin: 10px 0 0; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; color: var(--ht); font-size: var(--font-text-md-size, 14px); font-weight: 650; }
  .status .k-badge { font-variant-numeric: tabular-nums; }

  .drinks { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  .drinks .k-chip { padding: 4px 12px; font-size: var(--font-text-sm-size, 12px); }
  .pours { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .pbtn {
    min-height: 52px;
    display: flex;
    align-items: baseline;
    justify-content: center;
    gap: 4px;
    border: 0;
    border-radius: var(--border-radius-md, 10px);
    background: var(--ht);
    color: var(--color-background-primary);
    cursor: pointer;
  }
  .pbtn { align-items: center; }
  .pbtn b { font-size: 21px; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .pbtn small { font-size: var(--font-text-sm-size, 12px); font-weight: 600; opacity: .85; }
  .pbtn:hover { background: color-mix(in oklab, var(--ht) 88%, var(--color-text-primary)); }
  .pbtn:focus-visible { outline: 2px solid var(--color-ring-primary, var(--ht)); outline-offset: 2px; }

  /* ── below: the past week and today's pours, quieter ── */
  .below {
    display: grid;
    grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr);
    gap: 28px;
    padding: 18px 24px 22px;
    border-top: 1px solid var(--color-border-secondary);
  }
  .sec-h { margin: 0 0 12px; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .sec-h h2 { margin: 0; font-size: var(--font-text-sm-size, 12px); font-weight: 650; color: var(--color-text-primary); }
  .sec-h p { margin: 0; color: var(--color-text-tertiary); font-size: var(--font-text-sm-size, 12px); font-variant-numeric: tabular-nums; }

  .week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
  .day { display: grid; justify-items: center; gap: 4px; min-width: 0; }
  .day svg { width: 100%; max-width: 30px; height: auto; display: block; overflow: visible; }
  .day .o { fill: none; stroke: var(--color-border-primary); stroke-width: 1.4; stroke-linejoin: round; }
  .day .f { fill: var(--ht-water); }
  .day.hit .f { fill: color-mix(in oklab, var(--ht) 45%, transparent); }
  .day.hit .o { stroke: color-mix(in oklab, var(--ht) 60%, var(--color-border-primary)); }
  .day .gl { stroke: color-mix(in oklab, var(--ht) 55%, transparent); stroke-width: 1; stroke-dasharray: 2 2; }
  .day em { font-style: normal; font-size: 11px; font-weight: 600; color: var(--color-text-secondary); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .day i { font-style: normal; font-size: 10.5px; color: var(--color-text-tertiary); }
  .day.none em { color: var(--color-text-tertiary); font-weight: 500; }
  .streak { margin-top: 12px; }

  .list { margin: 0; padding: 0; list-style: none; max-height: 232px; overflow-y: auto; }
  .row {
    display: grid;
    grid-template-columns: 18px minmax(0, 1fr) auto auto;
    align-items: center;
    gap: 10px;
    min-height: 38px;
    padding: 4px 2px 4px 4px;
    border-top: 1px solid var(--color-border-secondary);
    border-radius: 2px;
  }
  .row:first-child { border-top: 0; }
  .row svg { width: 16px; height: 16px; fill: none; stroke: var(--color-text-tertiary); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  .row .nm { min-width: 0; font-size: var(--font-text-sm-size, 12.5px); font-weight: 550; overflow-wrap: anywhere; }
  .row .tm { margin-left: 6px; color: var(--color-text-tertiary); font-weight: 450; font-variant-numeric: tabular-nums; }
  .row .amt { font-size: var(--font-text-sm-size, 12.5px); font-weight: 650; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .row .del {
    width: 26px;
    height: 26px;
    display: grid;
    place-items: center;
    border: 0;
    border-radius: var(--border-radius-sm, 6px);
    background: transparent;
    color: var(--color-text-tertiary);
    cursor: pointer;
  }
  .row .del:hover { background: var(--k-ink-4); color: var(--color-text-primary); }
  .row.fresh { background: var(--k-accent-bg); }
  .row.going { opacity: .45; pointer-events: none; }
  .empty { margin: 0; padding: 8px 0; color: var(--color-text-tertiary); font-size: var(--font-text-sm-size, 12.5px); line-height: 1.5; }

  @media (hover: hover) {
    .row .del { opacity: 0; }
    .row:hover .del, .row .del:focus-visible { opacity: 1; }
  }

  /* The one action that matters is a pour: the stream drops in, the water springs up to its new
     level and its surface sloshes once. Nothing moves on load, and nothing moves at all under
     reduced motion — the level simply is where it is. */
  @media (prefers-reduced-motion: no-preference) {
    .live #level { transition: transform 900ms var(--k-spring); }
    .live #surf.slosh { animation: ht-slosh 1100ms var(--k-ease); }
    .stream.go { animation: ht-stream 700ms var(--k-ease); }
    .pbtn { transition: transform var(--k-t-fast) var(--k-ease), background var(--k-t-fast); }
    .pbtn:active { transform: scale(.96); }
    .row.fresh { transition: background 1200ms var(--k-ease); }
    @keyframes ht-slosh {
      0% { transform: translateX(-22px) scaleY(2.2); }
      45% { transform: translateX(8px) scaleY(1.3); }
      100% { transform: none; }
    }
    @keyframes ht-stream {
      0% { opacity: 1; stroke-dasharray: 0 400; }
      45% { opacity: 1; stroke-dasharray: 400 0; }
      100% { opacity: 0; stroke-dasharray: 400 0; }
    }
  }

  @media (max-width: 600px) {
    .hero {
      grid-template-columns: 138px minmax(0, 1fr);
      grid-template-areas: "glass read" "pour pour";
      column-gap: 20px;
      padding: 18px 16px 20px;
    }
    .read { align-self: center; }
    /* A phone-sized glass keeps its tick marks but drops the quarter labels — at this scale they
       would be unreadable — and the goal label grows so it still reads. JS narrows the viewBox. */
    .g-lbl.q { display: none; }
    .g-lbl { font-size: 14px; }
    .big b { font-size: 46px; }
    .big span { font-size: 15px; }
    .below { grid-template-columns: minmax(0, 1fr); gap: 22px; padding: 16px 16px 20px; }
    .error-strip { margin: 10px 16px 0; }
  }
</style>
</head>
<body>
<main class="ht k-stage">
  <header class="ht-bar k-appbar">
    <span class="ht-mark k-appmark" aria-hidden="true">
      <svg viewBox="0 0 18 18"><path d="M3.5 2.5h11l-1.4 13h-8.2z"/><path d="M4.6 8.2c1.5-.8 2.9-.8 4.4 0s2.9.8 4.4 0"/></svg>
    </span>
    <div class="k-appcopy"><h1 data-t="name">Hydration tally</h1></div>
    <button id="askBtn" class="k-btn sec" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="m12 3 .8 3.2A6.5 6.5 0 0 0 17.5 11l3.2.8-3.2.8a6.5 6.5 0 0 0-4.7 4.7L12 20.5l-.8-3.2a6.5 6.5 0 0 0-4.7-4.7l-3.2-.8 3.2-.8a6.5 6.5 0 0 0 4.7-4.8L12 3Z"/></svg>
      <span data-t="ask">Set my target</span>
    </button>
  </header>

  <div class="error-strip" id="errorStrip" role="status" aria-live="polite" hidden></div>

  <section class="hero">
    <figure class="glass">
      <svg id="glassSvg" viewBox="-34 -30 228 252" role="img" aria-label="">
        <defs>
          <clipPath id="ht-in"><path d="M25.5 20h109l-13.9 170h-81.2z"/></clipPath>
        </defs>
        <g id="ticks"></g>
        <path class="stream" id="stream" d="M80 -26V100"/>
        <g clip-path="url(#ht-in)">
          <g id="level">
            <g id="surf">
              <path class="w-body" id="wBody" d=""/>
              <path class="w-surf" id="wSurf" d=""/>
            </g>
          </g>
          <g id="layers"></g>
        </g>
        <path class="g-out" d="M20 14h120l-15.5 190a6 6 0 0 1-6 5.5h-77a6 6 0 0 1-6-5.5z"/>
        <path class="g-base" d="M38.5 194h83"/>
      </svg>
    </figure>

    <div class="read">
      <p class="kicker" id="dateLine"></p>
      <p class="big"><b id="total">0</b><span>mL</span></p>
      <p class="of" id="ofLine"></p>
      <p class="status" id="status" aria-live="polite"></p>
    </div>

    <div class="pour">
      <div class="drinks" role="group" id="drinks">
        <button class="k-chip on" type="button" data-drink="water" data-t="water" aria-pressed="true">Water</button>
        <button class="k-chip" type="button" data-drink="tea" data-t="tea" aria-pressed="false">Tea</button>
        <button class="k-chip" type="button" data-drink="coffee" data-t="coffee" aria-pressed="false">Coffee</button>
      </div>
      <div class="pours">
        <button class="pbtn" type="button" data-amount="250"><b>+250</b><small>mL</small></button>
        <button class="pbtn" type="button" data-amount="500"><b>+500</b><small>mL</small></button>
      </div>
    </div>
  </section>

  <section class="below">
    <div>
      <div class="sec-h"><h2 data-t="week">Past 7 days</h2><p id="weekLine"></p></div>
      <div class="week" id="week"></div>
      <div class="streak" id="streak"></div>
    </div>
    <div>
      <div class="sec-h"><h2 data-t="today">Today’s pours</h2><p id="pourCount"></p></div>
      <ul class="list" id="list"></ul>
    </div>
  </section>
</main>

<script type="module">
  const NS = "http://www.w3.org/2000/svg";

  // ── copy ────────────────────────────────────────────────────────────────────────────────
  const COPY = {
    en: {
      name: "Hydration tally",
      ask: "Set my target",
      water: "Water",
      tea: "Tea",
      coffee: "Coffee",
      week: "Past 7 days",
      today: "Today’s pours",
      of: (g, p) => `of ${g} mL goal · ${p}%`,
      toGo: (n) => `${n} mL to go`,
      reached: "Goal reached",
      over: (n) => `+${n} mL`,
      fresh: "Nothing poured yet today",
      weekLine: (avg, hits) => `avg ${avg} mL · goal hit ${hits} of 7`,
      streak: (n) => `${n}-day streak`,
      noStreak: "Reach the goal to start a streak",
      count: (n) => `${n} ${n === 1 ? "pour" : "pours"}`,
      empty: "Nothing logged today. Tap +250 or +500 — or tell the AI “log a 500 mL bottle of water”.",
      goal: "goal",
      pourLabel: (n, d) => `Log ${n} mL of ${d}`,
      del: (a, d) => `Delete ${a} ${d}`,
      glass: (t, g, p) => `${t} of ${g} mL today, ${p}%`,
      dayTitle: (d, t) => `${d}: ${t} mL`,
      drinkGroup: "Drink",
      errAsk: "Couldn't reach the assistant — try again.",
      errSave: "Couldn't save that pour — try again.",
      prompt: (goal, today, avg) => `Help me set a sensible daily hydration target. My current target is ${goal} mL, today I have logged ${today} mL, and my 7-day average is ${avg} mL/day. Please ask about the factors that matter (such as body size, activity, climate, diet, pregnancy, and relevant health conditions or medications), then suggest a practical target in mL and explain the reasoning briefly.`
    },
    zh: {
      name: "饮水记录",
      ask: "设定目标",
      water: "水",
      tea: "茶",
      coffee: "咖啡",
      week: "过去 7 天",
      today: "今天喝的",
      of: (g, p) => `目标 ${g} mL · ${p}%`,
      toGo: (n) => `还差 ${n} mL`,
      reached: "今日达标",
      over: (n) => `超出 ${n} mL`,
      fresh: "今天还没喝水",
      weekLine: (avg, hits) => `日均 ${avg} mL · 7 天中 ${hits} 天达标`,
      streak: (n) => `连续达标 ${n} 天`,
      noStreak: "达标一天就开始连续记录",
      count: (n) => `${n} 次`,
      empty: "今天还没有记录。点 +250 或 +500，或者对 AI 说「记一瓶 500 mL 的水」。",
      goal: "目标",
      pourLabel: (n, d) => `记录 ${n} mL ${d}`,
      del: (a, d) => `删除 ${a} ${d}`,
      glass: (t, g, p) => `今天 ${t} / ${g} mL，${p}%`,
      dayTitle: (d, t) => `${d}：${t} mL`,
      drinkGroup: "饮品",
      errAsk: "没能联系上助手，请重试。",
      errSave: "这一杯没存上，请重试。",
      prompt: (goal, today, avg) => `帮我定一个合理的每日饮水目标。我现在的目标是 ${goal} mL，今天已经喝了 ${today} mL，过去 7 天日均 ${avg} mL。请先问我那些真正相关的因素（体型、运动量、气候、饮食、是否怀孕、相关的健康状况或用药），再给出一个具体的 mL 目标，并简单说明理由。`
    }
  };
  const loc = () => {
    const s = oma.pref("locale", "auto");
    return s === "auto" ? navigator.language : s;
  };
  const isZh = () => String(loc()).toLowerCase().startsWith("zh");
  const T = () => (isZh() ? COPY.zh : COPY.en);
  const num = (v) => new Intl.NumberFormat(loc(), { maximumFractionDigits: 0 }).format(v);

  // ── time ────────────────────────────────────────────────────────────────────────────────
  const pad = (v) => String(v).padStart(2, "0");
  const keyOf = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const today = () => {
    const n = new Date();
    return new Date(n.getFullYear(), n.getMonth(), n.getDate());
  };
  const addDays = (d, k) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + k);
  const dateOf = (it) => String(it.fields?.date || it.group || "").slice(0, 10);

  // ── data ────────────────────────────────────────────────────────────────────────────────
  const goalMl = () => Math.min(6000, Math.max(500, Number(oma.pref("daily_target_ml", 2000)) || 2000));

  // Rows written by people and AIs carry whatever unit they said; the glass only speaks mL.
  function toMl(f) {
    const amount = Math.max(0, Number(f.amount) || 0);
    const unit = String(f.unit || "mL").trim().toLowerCase().replace(/\s/g, "");
    if (["l", "liter", "litre", "liters", "litres"].includes(unit)) return amount * 1000;
    if (["oz", "floz", "ounce", "ounces"].includes(unit)) return amount * 29.5735;
    if (unit === "cup" || unit === "cups") return amount * 240;
    return amount;
  }

  const KNOWN = { water: "water", tea: "tea", coffee: "coffee" };
  // The picker writes a lowercase key; a person or an AI may write anything. Known keys get the
  // UI's word for them, everything else is the user's own text and is shown as written.
  const drinkName = (raw) => {
    const s = String(raw || "").trim();
    const k = KNOWN[s.toLowerCase()];
    return k ? T()[k] : s || T().water;
  };
  const drinkKind = (raw) => {
    const s = String(raw || "").toLowerCase();
    if (/coffee|latte|espresso|americano|咖啡|拿铁|美式/.test(s)) return "coffee";
    if (/tea|matcha|茶/.test(s)) return "tea";
    return "water";
  };

  let latest = { items: [] };
  // Optimistic overlay: a pour shows in the glass the moment it is tapped. Each entry leaves once
  // the store's own snapshot carries it (matched by the ack's id, or — if the snapshot beat the
  // ack — by its fields on a row that did not exist when the pour began).
  const pending = [];
  const hidden = new Set();
  // A delete waits on the engine's own confirmation (confirm_delete), so the row dims while the
  // person decides and only leaves the glass once the ack says it is gone.
  const deleting = new Set();
  let tokSeq = 0;

  function reconcile(state) {
    const ids = new Set(state.items.map((it) => it.id));
    const claimed = new Set();
    for (let i = pending.length - 1; i >= 0; i--) {
      const p = pending[i];
      if (p.id && ids.has(p.id)) { pending.splice(i, 1); continue; }
      if (!p.id) {
        const hit = state.items.find((it) => !p.seen.has(it.id) && !claimed.has(it.id) &&
          dateOf(it) === p.fields.date && String(it.fields.time) === p.fields.time &&
          Number(it.fields.amount) === p.fields.amount && it.fields.drink_type === p.fields.drink_type);
        if (hit) { claimed.add(hit.id); pending.splice(i, 1); }
      }
    }
    for (const id of hidden) if (!ids.has(id)) hidden.delete(id);
  }

  function model(state) {
    const goal = goalMl();
    const t0 = today();
    const tKey = keyOf(t0);
    // A row's day is fields.date, else its group (the app files each pour under its date).
    const rows = state.items.filter((it) => !hidden.has(it.id))
      .map((it) => ({ id: it.id, day: dateOf(it), fields: it.fields || {}, position: it.position }));
    for (const p of pending) {
      if (p.id && hidden.has(p.id)) continue;
      rows.push({ id: p.id, fresh: p.at, day: p.fields.date, fields: p.fields, position: 1e9 + p.tok });
    }
    const byDate = new Map();
    for (const r of rows) byDate.set(r.day, (byDate.get(r.day) || 0) + toMl(r.fields));
    const todayRows = rows.filter((r) => r.day === tKey);
    const total = Math.round(todayRows.reduce((s, r) => s + toMl(r.fields), 0));
    const past = Array.from({ length: 7 }, (_, i) => {
      const d = addDays(t0, i - 7);
      const k = keyOf(d);
      return { d, k, total: Math.round(byDate.get(k) || 0) };
    });
    const avg = Math.round(past.reduce((s, x) => s + x.total, 0) / 7);
    const hits = past.filter((x) => x.total >= goal).length;
    let streak = 0;
    let c = total >= goal ? t0 : addDays(t0, -1);
    while (streak < 3660 && (byDate.get(keyOf(c)) || 0) >= goal) {
      streak += 1;
      c = addDays(c, -1);
    }
    todayRows.sort((a, b) =>
      String(b.fields.time || "").localeCompare(String(a.fields.time || "")) || (b.position - a.position));
    return { goal, t0, total, past, avg, hits, streak, todayRows };
  }

  // ── the glass ───────────────────────────────────────────────────────────────────────────
  // Interior runs from y=190 (empty) to y=20 (brim). The goal sits at y=46, so a good day has
  // headroom and an over-goal day visibly rises past the mark toward the rim.
  const EMPTY_Y = 190;
  const GOAL_Y = 46;
  const BRIM_Y = 22;
  // Nothing poured = the surface sits below the clip, so an empty glass shows no water at all.
  const levelY = (ml, goal) => (ml <= 0 ? EMPTY_Y + 8 : Math.max(BRIM_Y, EMPTY_Y - (ml / goal) * (EMPTY_Y - GOAL_Y)));

  const wave = (() => {
    let d = "M-40 0";
    for (let x = -40; x < 220; x += 40) d += ` q10 -4.5 20 0 t20 0`;
    return d;
  })();
  document.getElementById("wSurf").setAttribute("d", wave);
  document.getElementById("wBody").setAttribute("d", `${wave} V260 H-40 Z`);

  const narrow = matchMedia("(max-width: 600px)");
  const fitGlass = () => document.getElementById("glassSvg").setAttribute("viewBox", narrow.matches ? "6 -30 190 252" : "-34 -30 228 252");
  narrow.addEventListener("change", () => { fitGlass(); drawTicks(goalMl()); });
  fitGlass();

  function drawTicks(goal) {
    const g = document.getElementById("ticks");
    g.textContent = "";
    const add = (tag, attrs, text) => {
      const el = document.createElementNS(NS, tag);
      for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
      if (text != null) el.textContent = text;
      g.appendChild(el);
      return el;
    };
    // Left side: quarter marks of the goal, labelled in mL. Right side: the goal itself.
    for (const q of [0.25, 0.5, 0.75]) {
      const y = levelY(goal * q, goal);
      const xEdge = 20 + ((y - 14) / 190) * 15.5;
      add("line", { class: "g-tick", x1: xEdge - 9, x2: xEdge - 3, y1: y, y2: y });
      add("text", { class: "g-lbl q", x: xEdge - 12, y: y + 3, "text-anchor": "end" }, num(goal * q));
    }
    const xg = 140 - ((GOAL_Y - 14) / 190) * 15.5;
    add("line", { class: "g-goal", x1: xg + 3, x2: xg + 12, y1: GOAL_Y, y2: GOAL_Y });
    add("text", { class: "g-lbl goal", x: xg + 15, y: GOAL_Y - 3 }, T().goal);
    add("text", { class: "g-lbl goal", x: xg + 15, y: GOAL_Y + (narrow.matches ? 14 : 9) }, num(goal));
  }

  function drawLayers(rowsOldestFirst, goal) {
    const g = document.getElementById("layers");
    g.textContent = "";
    let acc = 0;
    for (let i = 0; i < rowsOldestFirst.length - 1; i++) {
      acc += toMl(rowsOldestFirst[i].fields);
      const y = levelY(acc, goal);
      if (y <= BRIM_Y + 2) break;
      const line = document.createElementNS(NS, "line");
      line.setAttribute("class", "w-layer");
      line.setAttribute("x1", "0");
      line.setAttribute("x2", "160");
      line.setAttribute("y1", y.toFixed(1));
      line.setAttribute("y2", y.toFixed(1));
      g.appendChild(line);
    }
  }

  let shownTotal = null;
  let countRaf = 0;
  const reduced = () => matchMedia("(prefers-reduced-motion: reduce)").matches;

  function setTotal(to, animate) {
    const el = document.getElementById("total");
    if (to === shownTotal) return;          // a same-total re-render must not cut a count-up short
    cancelAnimationFrame(countRaf);
    if (!animate || reduced() || shownTotal == null) {
      el.textContent = num(to);
      shownTotal = to;
      return;
    }
    const from = shownTotal;
    shownTotal = to;
    const t0 = performance.now();
    const step = (now) => {
      const k = Math.min(1, (now - t0) / 650);
      const e = 1 - Math.pow(1 - k, 3);
      el.textContent = num(Math.round(from + (to - from) * e));
      if (k < 1) countRaf = requestAnimationFrame(step);
    };
    countRaf = requestAnimationFrame(step);
  }

  // ── week of small glasses (built once, updated in place) ────────────────────────────────
  const weekEl = document.getElementById("week");
  const dayCells = Array.from({ length: 7 }, () => {
    const cell = document.createElement("div");
    cell.className = "day";
    cell.innerHTML =
      `<svg viewBox="0 0 30 38" aria-hidden="true"><defs><clipPath><path d="M4 3h22l-2.6 32h-16.8z"/></clipPath></defs>` +
      `<rect class="f" x="0" width="30" y="35" height="0"/><line class="gl" x1="4" x2="26"/>` +
      `<path class="o" d="M3.2 2.2h23.6l-2.7 33.3a1.6 1.6 0 0 1-1.6 1.4H7.5a1.6 1.6 0 0 1-1.6-1.4z"/></svg>` +
      `<em></em><i></i>`;
    weekEl.appendChild(cell);
    return cell;
  });
  dayCells.forEach((cell, i) => {
    const cp = cell.querySelector("clipPath");
    cp.id = `ht-d${i}`;
    cell.querySelector(".f").setAttribute("clip-path", `url(#ht-d${i})`);
  });

  function renderWeek(m) {
    const wd = new Intl.DateTimeFormat(loc(), { weekday: "short" });
    const full = new Intl.DateTimeFormat(loc(), { weekday: "long", month: "short", day: "numeric" });
    // Mini glass: empty at y=35, goal at y=9 (same proportions as the big one).
    m.past.forEach((x, i) => {
      const cell = dayCells[i];
      const y = Math.max(3, 35 - (x.total / m.goal) * 26);
      const f = cell.querySelector(".f");
      f.setAttribute("y", y.toFixed(1));
      f.setAttribute("height", (35 - y).toFixed(1));
      const gl = cell.querySelector(".gl");
      gl.setAttribute("y1", "9");
      gl.setAttribute("y2", "9");
      cell.classList.toggle("hit", x.total >= m.goal);
      cell.classList.toggle("none", x.total === 0);
      cell.querySelector("em").textContent = x.total ? `${(x.total / 1000).toFixed(1)} L` : "—";
      cell.querySelector("i").textContent = wd.format(x.d);
      cell.title = T().dayTitle(full.format(x.d), num(x.total));
    });
    document.getElementById("weekLine").textContent = m.avg ? T().weekLine(num(m.avg), m.hits) : "";
    const st = document.getElementById("streak");
    st.textContent = "";
    const b = document.createElement("span");
    b.className = m.streak ? "k-badge info" : "k-badge";
    b.textContent = m.streak ? T().streak(m.streak) : T().noStreak;
    st.appendChild(b);
  }

  // ── today's pours ───────────────────────────────────────────────────────────────────────
  const ICON = {
    water: `<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.8c2.6 3.3 4.2 5.5 4.2 7.7a4.2 4.2 0 1 1-8.4 0c0-2.2 1.6-4.4 4.2-7.7Z"/></svg>`,
    tea: `<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 6h9v3.5a4 4 0 0 1-4 4h-1a4 4 0 0 1-4-4z"/><path d="M11.5 7.2h.8a1.7 1.7 0 0 1 0 3.4h-1.1"/><path d="M6 2.2c.6.7-.6 1.3 0 2"/></svg>`,
    coffee: `<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 5h8.5l-.9 8.2a1 1 0 0 1-1 .8H4.9a1 1 0 0 1-1-.8z"/><path d="M2.4 3h9.7"/><path d="M4 8.3h6.5"/></svg>`
  };

  function renderList(m) {
    const list = document.getElementById("list");
    list.textContent = "";
    document.getElementById("pourCount").textContent = m.todayRows.length ? T().count(m.todayRows.length) : "";
    if (!m.todayRows.length) {
      const p = document.createElement("li");
      p.className = "empty";
      p.textContent = T().empty;
      list.appendChild(p);
      return;
    }
    for (const r of m.todayRows) {
      const li = document.createElement("li");
      li.className = "row";
      // A new pour's row glows for a moment, then fades (the tint's transition does the fade).
      if (r.id && deleting.has(r.id)) li.classList.add("going");
      if (r.fresh && performance.now() - r.fresh < 900) {
        li.classList.add("fresh");
        setTimeout(() => li.classList.remove("fresh"), 900 - (performance.now() - r.fresh));
      }
      li.innerHTML = ICON[drinkKind(r.fields.drink_type)];
      const nm = document.createElement("span");
      nm.className = "nm";
      nm.textContent = drinkName(r.fields.drink_type);
      if (r.fields.time) {
        const tm = document.createElement("span");
        tm.className = "tm";
        tm.textContent = r.fields.time;
        nm.appendChild(tm);
      }
      const amt = document.createElement("span");
      amt.className = "amt";
      const unit = String(r.fields.unit || "mL");
      amt.textContent = `${num(Number(r.fields.amount) || 0)} ${unit}`;
      const del = document.createElement("button");
      del.type = "button";
      del.className = "del";
      del.textContent = "×";
      del.setAttribute("aria-label", T().del(amt.textContent, nm.firstChild.textContent));
      del.title = del.getAttribute("aria-label");
      if (!r.id) del.disabled = true;
      del.onclick = () => removePour(r.id);
      li.append(nm, amt, del);
      list.appendChild(li);
    }
  }

  // ── render ──────────────────────────────────────────────────────────────────────────────
  let lastLevel = null;

  function render(state, opts = {}) {
    latest = state;
    const m = model(state);
    const L = T();
    const pct = Math.round((m.total / m.goal) * 100);

    document.getElementById("dateLine").textContent =
      new Intl.DateTimeFormat(loc(), { weekday: "long", month: "long", day: "numeric" }).format(m.t0);
    setTotal(m.total, opts.pour);
    document.getElementById("ofLine").textContent = L.of(num(m.goal), pct);

    const status = document.getElementById("status");
    status.textContent = "";
    if (m.total >= m.goal) {
      const b = document.createElement("span");
      b.className = "k-badge info";
      b.textContent = L.reached;
      status.appendChild(b);
      if (m.total > m.goal) status.append(L.over(num(m.total - m.goal)));
    } else if (m.total > 0) {
      status.textContent = L.toGo(num(m.goal - m.total));
    } else {
      status.textContent = L.fresh;
    }

    const y = levelY(m.total, m.goal);
    if (y !== lastLevel) {
      document.getElementById("level").style.transform = `translateY(${y.toFixed(2)}px)`;
      if (opts.pour && lastLevel != null && !reduced()) {
        const surf = document.getElementById("surf");
        surf.classList.remove("slosh");
        void surf.getBBox();
        surf.classList.add("slosh");
        const stream = document.getElementById("stream");
        stream.setAttribute("d", `M80 -26V${y.toFixed(1)}`);
        stream.classList.remove("go");
        void stream.getBBox();
        stream.classList.add("go");
      }
      lastLevel = y;
    }
    const oldestFirst = [...m.todayRows].reverse();
    drawLayers(oldestFirst, m.goal);
    drawTicks(m.goal);
    document.getElementById("glassSvg").setAttribute("aria-label", L.glass(num(m.total), num(m.goal), pct));

    renderWeek(m);
    renderList(m);
  }

  // ── copy that doesn't change with data ─────────────────────────────────────────────────
  function applyCopy() {
    const L = T();
    document.documentElement.lang = isZh() ? "zh-CN" : "en";
    document.title = isZh() ? "饮水记录" : "Hydration Tally";
    for (const el of document.querySelectorAll("[data-t]")) el.textContent = L[el.dataset.t];
    document.getElementById("drinks").setAttribute("aria-label", L.drinkGroup);
    syncPourLabels();
  }
  let selectedDrink = "water";
  function syncPourLabels() {
    for (const b of document.querySelectorAll(".pbtn")) {
      b.setAttribute("aria-label", T().pourLabel(b.dataset.amount, T()[selectedDrink]));
    }
  }

  // ── actions ─────────────────────────────────────────────────────────────────────────────
  const errorStrip = document.getElementById("errorStrip");
  let errorTimer = null;
  function showError(msg) {
    clearTimeout(errorTimer);
    errorStrip.textContent = msg;
    errorStrip.hidden = false;
    errorTimer = setTimeout(() => { errorStrip.hidden = true; }, 7000);
  }

  for (const chip of document.querySelectorAll("#drinks .k-chip")) {
    chip.onclick = () => {
      selectedDrink = chip.dataset.drink;
      for (const c of document.querySelectorAll("#drinks .k-chip")) {
        c.classList.toggle("on", c === chip);
        c.setAttribute("aria-pressed", String(c === chip));
      }
      syncPourLabels();
    };
  }

  for (const btn of document.querySelectorAll(".pbtn")) {
    btn.onclick = async () => {
      const now = new Date();
      const date = keyOf(now);
      const fields = {
        date,
        time: `${pad(now.getHours())}:${pad(now.getMinutes())}`,
        amount: Number(btn.dataset.amount),
        unit: "mL",
        drink_type: selectedDrink
      };
      const p = { tok: ++tokSeq, at: performance.now(), id: null, fields, seen: new Set(latest.items.map((it) => it.id)) };
      pending.push(p);
      render(latest, { pour: true });
      let ack = null;
      try {
        ack = await oma.addItem({ group: date, fields });
      } catch (e) {
        ack = null;
      }
      const at = pending.indexOf(p);
      if (ack && ack.ok !== false && ack.id) {
        p.id = ack.id;
        if (latest.items.some((it) => it.id === ack.id) && at >= 0) pending.splice(at, 1);
        render(latest);                       // the row now has an id, so it can be deleted
      } else {
        if (at >= 0) pending.splice(at, 1);
        showError(T().errSave);
        render(latest);
      }
    };
  }

  async function removePour(id) {
    if (!id || deleting.has(id)) return;
    deleting.add(id);
    render(latest);
    let ack = null;
    try {
      ack = await oma.deleteItem(id);
    } catch (e) {
      ack = null;
    }
    deleting.delete(id);
    if (ack && ack.ok !== false) hidden.add(id);
    render(latest);
  }

  // AWAITED and disabled in flight: sendMessage crosses a bridge with a deadline, and extra clicks
  // meanwhile would queue duplicate requests into the chat. A degraded result (no chat attached:
  // the runtime copied the prompt to the clipboard and said so) is not a failure.
  const askBtn = document.getElementById("askBtn");
  askBtn.onclick = async () => {
    const m = model(latest);
    askBtn.disabled = true;
    try {
      const r = await oma.sendMessage(T().prompt(m.goal, m.total, m.avg));
      if (r && r.isError === true && !r.degraded) showError(T().errAsk);
    } catch (e) {
      showError(T().errAsk);
    } finally {
      askBtn.disabled = false;
    }
  };

  // ── mount ───────────────────────────────────────────────────────────────────────────────
  if (oma.standalone) document.body.classList.add("standalone");
  oma.ready((s) => {
    applyCopy();
    render(s);
    // Transitions switch on only after the first paint: opening the app shows the level where it
    // is, the spring is saved for the pour.
    requestAnimationFrame(() => requestAnimationFrame(() => document.querySelector(".ht").classList.add("live")));
  });
  oma.onChange((s) => {
    reconcile(s);
    render(s);
  });
  oma.onPrefChange((c) => {
    if (c.key === "locale") applyCopy();
    if (c.key === "locale" || c.key === "daily_target_ml") render(latest);
  });
</script>
</body>
</html>
