<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Habit Streaks</title>
  <meta name="description" content="Daily habit tracker with per-habit heatmaps, streaks, and progress rings.">
  <meta name="oma-category" content="Health & Habits">
  <style>
  * { box-sizing: border-box; }
  :root {
    --accent: var(--color-text-info, var(--color-ring-primary));
    --positive: var(--color-text-success, var(--accent));
    --cell: 15px;
    --cell-gap: 4px;
  }
  html, body { margin: 0; overflow: hidden; }
  body {
    padding: 14px;
    background: transparent;
    color: var(--color-text-primary);
    font-family: var(--font-sans);
    font-size: var(--font-text-md-size, 14px);
  }
  button, input { font: inherit; }
  button { color: inherit; }
  button:focus-visible, input:focus-visible {
    outline: 2px solid var(--color-ring-primary);
    outline-offset: 2px;
  }
  .shell {
    position: relative;
    max-width: 980px;
    margin: 0 auto;
    overflow: hidden;
    border: 1px solid var(--color-border-primary);
    border-radius: var(--border-radius-lg);
    background: var(--color-background-primary);
    box-shadow: var(--shadow-md, var(--shadow-sm));
  }
  .topbar {
    display: flex;
    align-items: center;
    gap: 16px;
    min-height: 68px;
    padding: 13px 16px;
    border-bottom: 1px solid var(--color-border-secondary);
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 11px;
    min-width: 0;
  }
  .brand-mark {
    display: grid;
    place-items: center;
    width: 37px;
    height: 37px;
    flex: 0 0 auto;
    border: 1px solid color-mix(in oklab, var(--accent) 26%, var(--color-border-primary));
    border-radius: var(--border-radius-md);
    background: linear-gradient(145deg, color-mix(in oklab, var(--accent) 17%, transparent), color-mix(in oklab, var(--positive) 7%, transparent));
    color: var(--accent);
  }
  .brand-mark svg {
    width: 20px;
    height: 20px;
    fill: none;
    stroke: currentColor;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-width: 1.8;
  }
  .brand-copy { min-width: 0; }
  .kicker {
    margin-bottom: 2px;
    color: var(--color-text-tertiary);
    font-family: var(--font-mono);
    font-size: 10px;
    font-weight: 700;
    letter-spacing: .11em;
    text-transform: uppercase;
  }
  .brand h1 {
    margin: 0;
    font-size: 16px;
    line-height: 1.2;
    letter-spacing: -.01em;
  }
  .brand-summary {
    margin-top: 3px;
    color: var(--color-text-secondary);
    font-size: var(--font-text-sm-size, 12px);
  }
  .top-actions {
    display: flex;
    gap: 8px;
    margin-left: auto;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    min-height: 36px;
    padding: 8px 12px;
    border: 1px solid var(--color-border-primary);
    border-radius: var(--border-radius-md);
    background: var(--color-background-primary);
    color: var(--color-text-primary);
    font-weight: 650;
    line-height: 1;
    cursor: pointer;
  }
  .btn svg { width: 16px; height: 16px; flex: 0 0 auto; fill: none; stroke: currentColor; stroke-width: 1.8; }
  .btn.ghost { background: var(--color-background-primary); }
  .overview-band {
    display: grid;
    grid-template-columns: minmax(140px, .55fr) minmax(0, 1.45fr);
    gap: 16px;
    align-items: center;
    padding: 12px 16px;
    border-bottom: 1px solid var(--color-border-secondary);
    background: color-mix(in oklab, var(--accent) 5%, var(--color-background-secondary));
    font-variant-numeric: tabular-nums;
  }
  .overview-main {
    display: flex;
    align-items: baseline;
    gap: 9px;
    min-width: 0;
  }
  #weekScore {
    color: var(--accent);
    font: 760 34px/1 var(--font-mono);
    letter-spacing: -.05em;
  }
  .overview-main span, .overview-stat span {
    color: var(--color-text-tertiary);
    font-size: 10px;
    font-weight: 700;
    letter-spacing: .06em;
    text-transform: uppercase;
  }
  .overview-stats {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 12px;
  }
  .overview-stat {
    min-width: 0;
    padding-left: 12px;
    border-left: 1px solid var(--color-border-secondary);
  }
  .overview-stat strong {
    display: block;
    margin-bottom: 3px;
    overflow: hidden;
    font-size: 15px;
    line-height: 1.1;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .today-panel { padding: 15px 18px 13px; border-bottom: 1px solid var(--color-border-secondary); }
  .section-title {
    display: flex;
    align-items: baseline;
    gap: 9px;
    margin-bottom: 10px;
  }
  .section-title h2 { margin: 0; font-size: 14px; letter-spacing: -.01em; }
  .section-title time {
    color: var(--color-text-secondary);
    font-size: var(--font-text-sm-size, 12px);
  }
  .today-grid {
    display: grid;
    grid-auto-flow: column;
    grid-auto-columns: minmax(220px, 1fr);
    grid-template-columns: repeat(3, minmax(220px, 1fr));
    gap: 9px;
    overflow-x: auto;
    padding: 1px 1px 3px;
  }
  .today-card {
    --habit-accent: var(--accent);
    display: grid;
    grid-template-columns: minmax(0, 1fr) 30px;
    min-width: 0;
    overflow: hidden;
    border: 1px solid var(--color-border-secondary);
    border-radius: var(--border-radius-md);
    background: var(--color-background-secondary);
  }
  .today-card.is-done {
    border-color: color-mix(in oklab, var(--habit-accent) 35%, var(--color-border-secondary));
    background: linear-gradient(135deg, color-mix(in oklab, var(--habit-accent) 13%, var(--color-background-primary)), color-mix(in oklab, var(--habit-accent) 5%, var(--color-background-secondary)));
    box-shadow: inset 3px 0 0 var(--habit-accent), 0 6px 18px color-mix(in oklab, var(--habit-accent) 8%, transparent);
  }
  .today-card.is-partial { box-shadow: inset 3px 0 0 color-mix(in oklab, var(--habit-accent) 55%, transparent); }
  .today-toggle {
    display: grid;
    grid-template-columns: 29px minmax(0, 1fr);
    align-items: center;
    gap: 9px;
    min-width: 0;
    padding: 10px 8px 10px 11px;
    border: 0;
    background: transparent;
    text-align: left;
    cursor: pointer;
  }
  .check {
    display: grid;
    place-items: center;
    width: 27px;
    height: 27px;
    border: 1px solid color-mix(in oklab, var(--habit-accent) 30%, var(--color-border-primary));
    border-radius: var(--border-radius-full, 999px);
    background: var(--color-background-primary);
    color: transparent;
  }
  .check svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .is-done .check { border-color: var(--habit-accent); background: var(--habit-accent); color: var(--color-text-inverse); }
  .today-copy { min-width: 0; }
  .today-name { display: block; overflow: hidden; font-weight: 750; text-overflow: ellipsis; white-space: nowrap; }
  .today-meta { display: block; margin-top: 2px; color: var(--color-text-secondary); font-size: var(--font-text-sm-size, 12px); font-variant-numeric: tabular-nums; }
  .adjust {
    align-self: stretch;
    margin: 6px 5px 6px 0;
    padding: 0;
    border: 0;
    border-radius: var(--border-radius-sm);
    background: transparent;
    color: var(--color-text-tertiary);
    cursor: pointer;
  }
  .toolbar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 11px 18px;
    border-bottom: 1px solid var(--color-border-secondary);
    background: color-mix(in oklab, var(--color-background-secondary) 76%, transparent);
  }
  .add-form { display: flex; min-width: 0; flex: 1; gap: 7px; }
  .add-form input {
    width: min(220px, 100%);
    min-width: 0;
    padding: 8px 10px;
    border: 1px solid var(--color-border-primary);
    border-radius: var(--border-radius-md);
    background: var(--color-background-primary);
    color: var(--color-text-primary);
  }
  .add-form button {
    padding: 8px 11px;
    border: 0;
    border-radius: var(--border-radius-md);
    background: var(--color-background-inverse);
    color: var(--color-text-inverse);
    font-weight: 750;
    cursor: pointer;
  }
  .legend { display: flex; align-items: center; gap: 5px; color: var(--color-text-tertiary); font-size: 11px; white-space: nowrap; }
  .legend-cells { display: flex; gap: 3px; margin: 0 2px; }
  .legend-cell, .heat-cell {
    border: 0;
    border-radius: 4px;
    background: color-mix(in oklab, var(--habit-accent, var(--accent)) 7%, var(--color-background-tertiary));
  }
  .legend-cell { width: 11px; height: 11px; }
  .level-1 { background: color-mix(in oklab, var(--habit-accent, var(--accent)) 24%, var(--color-background-tertiary)); }
  .level-2 { background: color-mix(in oklab, var(--habit-accent, var(--accent)) 43%, var(--color-background-tertiary)); }
  .level-3 { background: color-mix(in oklab, var(--habit-accent, var(--accent)) 65%, var(--color-background-tertiary)); }
  .level-4 { background: color-mix(in oklab, var(--habit-accent, var(--accent)) 88%, var(--color-background-primary)); }
  .habit-scroll {
    /* MCP hosts can grow the app to its natural height. Keep heatmaps in the
       document flow so the host owns the only vertical scroll position. */
    max-height: none;
    overflow: visible;
    overscroll-behavior: auto;
    scrollbar-color: auto;
  }
  .habit-section {
    --habit-accent: var(--accent);
    display: grid;
    grid-template-columns: minmax(230px, .8fr) minmax(320px, 1.35fr);
    gap: 22px;
    align-items: center;
    padding: 16px 18px;
    border-bottom: 1px solid var(--color-border-secondary);
  }
  .habit-section:last-child { border-bottom: 0; }
  .palette-0 { --habit-accent: var(--color-text-info, var(--color-ring-primary)); }
  .palette-1 { --habit-accent: var(--color-text-success, var(--color-ring-primary)); }
  .palette-2 { --habit-accent: var(--color-text-warning, var(--color-ring-primary)); }
  .palette-3 { --habit-accent: var(--color-text-danger, var(--color-ring-primary)); }
  .habit-overview { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 12px; min-width: 0; }
  .habit-name-row { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .habit-dot {
    width: 8px;
    height: 8px;
    flex: 0 0 auto;
    border-radius: var(--border-radius-full, 999px);
    background: var(--habit-accent);
    box-shadow: 0 0 0 4px color-mix(in oklab, var(--habit-accent) 11%, transparent);
  }
  .habit-name {
    overflow: hidden;
    font-size: 14px;
    font-weight: 800;
    letter-spacing: -.01em;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .streaks { display: flex; gap: 14px; margin-top: 9px; }
  .streak strong { display: block; font-size: 18px; line-height: 1; font-variant-numeric: tabular-nums; }
  .streak span { display: block; margin-top: 3px; color: var(--color-text-tertiary); font-size: 10px; text-transform: uppercase; letter-spacing: .06em; }
  .ring-stat { display: grid; grid-template-columns: 47px; justify-items: center; gap: 2px; color: var(--habit-accent); }
  .ring-stat svg { display: block; width: 47px; height: 47px; overflow: visible; }
  .ring-track, .ring-progress { fill: none; stroke-width: 4; }
  .ring-track { stroke: color-mix(in oklab, var(--habit-accent) 10%, var(--color-background-tertiary)); }
  .ring-progress {
    stroke: var(--habit-accent);
    stroke-linecap: round;
    stroke-dasharray: 100;
    stroke-dashoffset: var(--offset);
    transform: rotate(-90deg);
    transform-origin: center;
  }
  .ring-number { fill: var(--color-text-primary); font: 750 8px var(--font-mono); text-anchor: middle; dominant-baseline: central; }
  .ring-caption { color: var(--color-text-tertiary); font-size: 9px; text-transform: uppercase; letter-spacing: .05em; }
  .heat-wrap { min-width: 0; overflow-x: auto; padding: 3px 2px 4px; scrollbar-width: thin; }
  .heat-layout { display: grid; grid-template-columns: 18px max-content; gap: 4px 6px; width: max-content; min-width: 100%; justify-content: end; }
  .month-labels {
    grid-column: 2;
    display: grid;
    grid-template-columns: repeat(12, var(--cell));
    gap: var(--cell-gap);
    height: 13px;
    color: var(--color-text-tertiary);
    font-size: 9px;
    line-height: 1;
  }
  .month-label { overflow: visible; white-space: nowrap; }
  .day-labels {
    display: grid;
    grid-template-rows: repeat(7, var(--cell));
    gap: var(--cell-gap);
    color: var(--color-text-tertiary);
    font-size: 9px;
    line-height: var(--cell);
    text-align: right;
  }
  .heat-grid {
    display: grid;
    grid-auto-flow: column;
    grid-template-rows: repeat(7, var(--cell));
    grid-auto-columns: var(--cell);
    gap: var(--cell-gap);
  }
  .heat-cell {
    position: relative;
    width: var(--cell);
    height: var(--cell);
    padding: 0;
    cursor: pointer;
  }
  .heat-cell.today::after {
    content: "";
    position: absolute;
    inset: -3px;
    border: 1.5px solid var(--habit-accent);
    border-radius: 6px;
    pointer-events: none;
  }
  .heat-cell.future { cursor: default; opacity: .28; background: color-mix(in oklab, var(--color-text-tertiary) 5%, transparent); }
  .heat-cell.pending { opacity: .5; }
  .empty-state {
    padding: 42px 24px;
    text-align: center;
    color: var(--color-text-secondary);
  }
  .empty-state strong { display: block; margin-bottom: 5px; color: var(--color-text-primary); font-size: 15px; }
  .editor {
    position: absolute;
    z-index: 10;
    inset: 0;
    display: grid;
    place-items: center;
    padding: 18px;
    background: color-mix(in oklab, var(--color-background-primary) 78%, transparent);
    backdrop-filter: blur(5px);
  }
  .editor[hidden] { display: none; }
  .editor-card {
    width: min(410px, 100%);
    overflow: hidden;
    border: 1px solid var(--color-border-primary);
    border-radius: var(--border-radius-lg);
    background: var(--color-background-primary);
    box-shadow: var(--shadow-md, var(--shadow-sm));
  }
  .editor-head { display: flex; align-items: center; gap: 10px; padding: 15px 16px; border-bottom: 1px solid var(--color-border-secondary); }
  .editor-head strong { display: block; }
  .editor-date { display: block; margin-top: 2px; color: var(--color-text-secondary); font-size: var(--font-text-sm-size, 12px); }
  .editor-close {
    width: 31px;
    height: 31px;
    margin-left: auto;
    padding: 0;
    border: 0;
    border-radius: var(--border-radius-full, 999px);
    background: var(--color-background-secondary);
    color: var(--color-text-secondary);
    cursor: pointer;
  }
  .editor-body { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 16px; }
  .field { display: grid; gap: 5px; color: var(--color-text-secondary); font-size: 11px; font-weight: 700; letter-spacing: .03em; text-transform: uppercase; }
  .field.note { grid-column: 1 / -1; }
  .field input {
    width: 100%;
    min-width: 0;
    padding: 9px 10px;
    border: 1px solid var(--color-border-primary);
    border-radius: var(--border-radius-md);
    background: var(--color-background-secondary);
    color: var(--color-text-primary);
    font-size: var(--font-text-md-size, 14px);
    font-weight: 500;
    letter-spacing: 0;
    text-transform: none;
  }
  .done-check {
    grid-column: 1 / -1;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px;
    border-radius: var(--border-radius-md);
    background: color-mix(in oklab, var(--positive) 8%, var(--color-background-secondary));
    color: var(--color-text-primary);
    font-weight: 650;
    cursor: pointer;
  }
  .done-check input { accent-color: var(--positive); }
  .editor-actions { display: flex; justify-content: flex-end; gap: 8px; padding: 0 16px 16px; }
  .editor-actions button { padding: 9px 13px; border-radius: var(--border-radius-md); font-weight: 750; cursor: pointer; }
  .cancel { border: 1px solid var(--color-border-primary); background: var(--color-background-primary); }
  .save { border: 0; background: var(--color-background-inverse); color: var(--color-text-inverse); }
  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }
  @media (prefers-reduced-motion: no-preference) {
    .btn, .today-card, .today-toggle, .adjust, .add-form button, .heat-cell, .editor-close, .editor-actions button {
      transition: transform 180ms cubic-bezier(.2,.8,.3,1), border-color 180ms ease, background-color 180ms ease, box-shadow 220ms ease, opacity 180ms ease;
    }
    .btn:hover, .today-card:hover, .add-form button:hover, .editor-actions button:hover { transform: translateY(-1px); }
    .btn:hover { background: color-mix(in oklab, var(--color-text-primary) 4%, var(--color-background-primary)); }
    .btn:active, .today-toggle:active, .adjust:active, .add-form button:active, .heat-cell:active, .editor-actions button:active { transform: scale(.975); }
    .adjust:hover, .editor-close:hover { background: color-mix(in oklab, var(--color-text-primary) 5%, transparent); color: var(--color-text-primary); }
    .heat-cell:not(.future):hover { transform: translateY(-2px) scale(1.08); box-shadow: 0 4px 10px color-mix(in oklab, var(--habit-accent) 18%, transparent); }
    .level-1, .level-2, .level-3, .level-4 { animation: heat-in 420ms cubic-bezier(.2,.8,.3,1) both; animation-delay: calc(var(--delay, 0) * 8ms); }
    .ring-progress { animation: ring-in 700ms cubic-bezier(.2,.8,.3,1) both; }
    .is-done .check { animation: check-pop 300ms cubic-bezier(.34,1.56,.64,1); }
    .editor-card { animation: editor-in 220ms cubic-bezier(.2,.8,.3,1) both; }
    @keyframes heat-in { from { opacity: .2; transform: scale(.66); } to { opacity: 1; transform: scale(1); } }
    @keyframes ring-in { from { stroke-dashoffset: 100; } to { stroke-dashoffset: var(--offset); } }
    @keyframes check-pop { 50% { transform: scale(1.18); } }
    @keyframes editor-in { from { opacity: 0; transform: translateY(8px) scale(.985); } }
  }
  @media (max-width: 640px) {
    body { padding: 8px; }
    .shell { border-radius: var(--border-radius-md); }
    .topbar { gap: 10px; padding: 12px; }
    .brand { gap: 9px; }
    .brand-summary { display: none; }
    .btn { min-height: 34px; padding: 8px 10px; }
    .overview-band { grid-template-columns: 1fr; gap: 10px; padding: 12px; }
    .overview-stat { padding-left: 8px; }
    .today-panel { padding: 13px 12px 11px; }
    .today-grid { display: flex; overflow-x: auto; padding: 1px 1px 5px; scroll-snap-type: x mandatory; }
    .today-card { min-width: min(78vw, 245px); scroll-snap-align: start; }
    .toolbar { align-items: stretch; flex-direction: column; gap: 9px; padding: 10px 12px; }
    .add-form input { width: 100%; }
    .legend { align-self: flex-end; }
    .habit-scroll { max-height: none; }
    .habit-section { grid-template-columns: 1fr; gap: 13px; padding: 14px 12px; }
    .heat-layout { justify-content: start; min-width: 0; }
    .editor { padding: 10px; }
  }
</style>

</head>
<body>
<main class="shell">
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M7.3 6.4A7 7 0 1 1 5 11.8"></path>
          <path d="M4 6v4h4"></path>
          <path d="m8.2 12 2.3 2.3 5.2-5.2"></path>
        </svg>
      </div>
      <div class="brand-copy">
        <div class="kicker">DAILY RHYTHM</div>
        <h1>Habit streaks</h1>
        <div class="brand-summary">Keep daily promises visible and moving.</div>
      </div>
    </div>
    <div class="top-actions">
      <button id="suggestButton" class="btn ghost" type="button" aria-label="Ask AI to suggest habits">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 .8 3.2A6.5 6.5 0 0 0 17.5 11l3.2.8-3.2.8a6.5 6.5 0 0 0-4.7 4.7L12 20.5l-.8-3.2a6.5 6.5 0 0 0-4.7-4.7l-3.2-.8 3.2-.8a6.5 6.5 0 0 0 4.7-4.8L12 3Z"/><path d="m19 3 .25 1a2 2 0 0 0 1.5 1.5l1 .25-1 .25a2 2 0 0 0-1.5 1.5L19 8.5l-.25-1A2 2 0 0 0 17.25 6l-1-.25 1-.25A2 2 0 0 0 18.75 4L19 3Z"/></svg>
        Ask AI
      </button>
    </div>
  </header>

  <section class="overview-band" aria-label="Habit overview">
    <div class="overview-main">
      <strong id="weekScore">0%</strong>
      <span>Complete this week</span>
    </div>
    <div class="overview-stats">
      <div class="overview-stat">
        <strong id="todayScore">0 / 0</strong>
        <span>Today complete</span>
      </div>
      <div class="overview-stat">
        <strong id="habitCount">0</strong>
        <span>Habits</span>
      </div>
      <div class="overview-stat">
        <strong id="bestStreak">0 days</strong>
        <span>Best active streak</span>
      </div>
    </div>
  </section>

  <section class="today-panel" aria-labelledby="todayHeading">
    <div class="section-title">
      <h2 id="todayHeading">Today</h2>
      <time id="todayDate"></time>
    </div>
    <div id="todayGrid" class="today-grid"></div>
  </section>

  <div class="toolbar">
    <form id="addForm" class="add-form">
      <label class="sr-only" for="habitInput">New habit</label>
      <input id="habitInput" maxlength="48" autocomplete="off" placeholder="Add a daily habit…">
      <button type="submit">Add habit</button>
    </form>
    <div class="legend" aria-label="Heatmap intensity from less to more">
      <span>Less</span>
      <span class="legend-cells" aria-hidden="true">
        <i class="legend-cell"></i><i class="legend-cell level-1"></i><i class="legend-cell level-2"></i><i class="legend-cell level-3"></i><i class="legend-cell level-4"></i>
      </span>
      <span>More</span>
    </div>
  </div>

  <section id="habitScroll" class="habit-scroll" aria-label="Twelve-week habit heatmaps"></section>

  <div id="editor" class="editor" role="dialog" aria-modal="true" aria-labelledby="editorHabit" hidden>
    <form id="editorForm" class="editor-card">
      <div class="editor-head">
        <div>
          <strong id="editorHabit"></strong>
          <span id="editorDate" class="editor-date"></span>
        </div>
        <button id="editorClose" class="editor-close" type="button" aria-label="Close">×</button>
      </div>
      <div class="editor-body">
        <label class="field">Quantity<input id="quantityInput" type="number" min="0" step="0.1" inputmode="decimal"></label>
        <label class="field">Daily target<input id="targetInput" type="number" min="0.1" step="0.1" inputmode="decimal"></label>
        <label class="field note">Note<input id="noteInput" maxlength="120" autocomplete="off" placeholder="Optional context…"></label>
        <label class="done-check"><input id="doneInput" type="checkbox"> Mark this day complete</label>
      </div>
      <div class="editor-actions">
        <button id="editorCancel" class="cancel" type="button">Cancel</button>
        <button id="saveButton" class="save" type="submit">Save day</button>
      </div>
    </form>
  </div>
</main>

<script type="module">
  const MS_DAY = 86400000;
  const WEEKS = 12;
  const SVG_NS = "http://www.w3.org/2000/svg";
  let latestState = { items: [] };
  let seedStarted = false;
  let editorState = null;
  const pending = new Set();

  const today = () => {
    const d = new Date();
    return new Date(d.getFullYear(), d.getMonth(), d.getDate(), 12);
  };
  const shiftDay = (date, amount) => new Date(date.getFullYear(), date.getMonth(), date.getDate() + amount, 12);
  const dateKey = (date) => `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}-${String(date.getDate()).padStart(2, "0")}`;
  const fromKey = (value) => {
    const match = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(value || ""));
    if (!match) return null;
    const d = new Date(Number(match[1]), Number(match[2]) - 1, Number(match[3]), 12);
    return Number.isNaN(d.getTime()) ? null : d;
  };
  const locale = () => {
    const value = oma.pref("locale", "auto");
    return value === "auto" ? navigator.language : value;
  };
  const formatDate = (date, style = "short") => {
    if (style === "key") {
      const pref = oma.pref("date_format", "auto");
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, "0");
      const d = String(date.getDate()).padStart(2, "0");
      if (pref === "yyyy-mm-dd") return `${y}-${m}-${d}`;
      if (pref === "dd/mm/yyyy") return `${d}/${m}/${y}`;
      if (pref === "mm/dd/yyyy") return `${m}/${d}/${y}`;
    }
    const options = style === "long"
      ? { weekday: "long", month: "long", day: "numeric" }
      : { weekday: "short", month: "short", day: "numeric" };
    return new Intl.DateTimeFormat(locale(), options).format(date);
  };
  const weekStartIndex = () => ({ sunday: 0, monday: 1, saturday: 6 })[oma.pref("week_start", "monday")] ?? 1;
  const startOfWeek = (date) => shiftDay(date, -((date.getDay() - weekStartIndex() + 7) % 7));
  const differenceInDays = (a, b) => Math.round((Date.UTC(a.getFullYear(), a.getMonth(), a.getDate()) - Date.UTC(b.getFullYear(), b.getMonth(), b.getDate())) / MS_DAY);
  const cleanNumber = (value, fallback = 0) => Number.isFinite(Number(value)) ? Math.max(0, Number(value)) : fallback;
  const formatNumber = (value) => new Intl.NumberFormat(locale(), { maximumFractionDigits: 1 }).format(cleanNumber(value));

  function itemComplete(item) {
    if (!item) return false;
    const quantity = cleanNumber(item.fields.quantity);
    const target = cleanNumber(item.fields.target, 1);
    return !!item.fields.done || (target > 0 && quantity >= target);
  }

  function itemLevel(item) {
    if (!item) return 0;
    if (itemComplete(item)) return 4;
    const quantity = cleanNumber(item.fields.quantity);
    const target = cleanNumber(item.fields.target, 1);
    if (quantity <= 0 || target <= 0) return 0;
    const ratio = quantity / target;
    if (ratio >= .66) return 3;
    if (ratio >= .34) return 2;
    return 1;
  }

  function habitGroups(state) {
    const groups = new Map();
    const ordered = [...state.items].sort((a, b) => a.position - b.position);
    for (const item of ordered) {
      const name = String(item.group || item.fields.habit || "").trim();
      if (!name) continue;
      if (!groups.has(name)) groups.set(name, []);
      groups.get(name).push(item);
    }
    return [...groups].map(([habit, items]) => {
      const byDate = new Map();
      for (const item of items) {
        const key = String(item.fields.date || "");
        const current = byDate.get(key);
        if (!current || item.position >= current.position) byDate.set(key, item);
      }
      const recent = [...items].sort((a, b) => String(b.fields.date || "").localeCompare(String(a.fields.date || "")))[0];
      return {
        habit,
        items,
        byDate,
        target: Math.max(.1, cleanNumber(recent?.fields.target, 1) || 1)
      };
    });
  }

  function streakStats(group, anchor) {
    const completed = new Set([...group.byDate].filter(([, item]) => itemComplete(item)).map(([key]) => key));
    let cursor = anchor;
    if (!completed.has(dateKey(cursor))) cursor = shiftDay(cursor, -1);
    let current = 0;
    while (completed.has(dateKey(cursor)) && current < 10000) {
      current++;
      cursor = shiftDay(cursor, -1);
    }

    const dates = [...completed].map(fromKey).filter(Boolean).sort((a, b) => a - b);
    let longest = 0;
    let run = 0;
    let previous = null;
    for (const date of dates) {
      run = previous && differenceInDays(date, previous) === 1 ? run + 1 : 1;
      longest = Math.max(longest, run);
      previous = date;
    }

    const first = [...group.byDate.keys()].map(fromKey).filter(Boolean).sort((a, b) => a - b)[0];
    const windowStart = first && differenceInDays(anchor, first) < 27 ? first : shiftDay(anchor, -27);
    const denominator = Math.max(1, differenceInDays(anchor, windowStart) + 1);
    let hits = 0;
    for (let i = 0; i < denominator; i++) if (completed.has(dateKey(shiftDay(windowStart, i)))) hits++;
    return { current, longest, rate: Math.round((hits / denominator) * 100) };
  }

  function paletteIndex(name) {
    let hash = 0;
    for (const char of name) hash = (hash * 31 + char.codePointAt(0)) >>> 0;
    return hash % 4;
  }

  function makeRing(rate, habit) {
    const wrap = document.createElement("div");
    wrap.className = "ring-stat";
    wrap.setAttribute("aria-label", `${rate}% consistency for ${habit}`);
    const svg = document.createElementNS(SVG_NS, "svg");
    svg.setAttribute("viewBox", "0 0 42 42");
    svg.setAttribute("aria-hidden", "true");
    const track = document.createElementNS(SVG_NS, "circle");
    track.setAttribute("class", "ring-track");
    track.setAttribute("cx", "21");
    track.setAttribute("cy", "21");
    track.setAttribute("r", "15.9155");
    const progress = document.createElementNS(SVG_NS, "circle");
    progress.setAttribute("class", "ring-progress");
    progress.setAttribute("cx", "21");
    progress.setAttribute("cy", "21");
    progress.setAttribute("r", "15.9155");
    progress.setAttribute("pathLength", "100");
    progress.style.setProperty("--offset", String(100 - rate));
    const number = document.createElementNS(SVG_NS, "text");
    number.setAttribute("class", "ring-number");
    number.setAttribute("x", "21");
    number.setAttribute("y", "21.5");
    number.textContent = `${rate}%`;
    svg.append(track, progress, number);
    const caption = document.createElement("span");
    caption.className = "ring-caption";
    caption.textContent = "28-day";
    wrap.append(svg, caption);
    return wrap;
  }

  function makeTodayCard(group, index, anchor) {
    const key = dateKey(anchor);
    const item = group.byDate.get(key);
    const level = itemLevel(item);
    const complete = itemComplete(item);
    const quantity = cleanNumber(item?.fields.quantity);
    const target = cleanNumber(item?.fields.target, group.target) || group.target;

    const card = document.createElement("article");
    card.className = `today-card palette-${index % 4}${complete ? " is-done" : level ? " is-partial" : ""}`;

    const toggle = document.createElement("button");
    toggle.type = "button";
    toggle.className = "today-toggle";
    toggle.setAttribute("aria-pressed", String(complete));
    toggle.setAttribute("aria-label", `${complete ? "Unmark" : "Complete"} ${group.habit} for today`);
    toggle.onclick = () => toggleDay(group.habit, key);

    const check = document.createElement("span");
    check.className = "check";
    check.innerHTML = '<svg viewBox="0 0 20 20" aria-hidden="true"><path d="m4 10 4 4 8-9"/></svg>';

    const copy = document.createElement("span");
    copy.className = "today-copy";
    const name = document.createElement("span");
    name.className = "today-name";
    name.textContent = group.habit;
    const meta = document.createElement("span");
    meta.className = "today-meta";
    meta.textContent = `${formatNumber(quantity)} / ${formatNumber(target)}${complete ? " · done" : level ? " · in progress" : ""}`;
    copy.append(name, meta);
    toggle.append(check, copy);

    const adjust = document.createElement("button");
    adjust.type = "button";
    adjust.className = "adjust";
    adjust.textContent = "•••";
    adjust.setAttribute("aria-label", `Adjust today's quantity, target, or note for ${group.habit}`);
    adjust.onclick = () => openEditor(group.habit, key);

    card.append(toggle, adjust);
    return card;
  }

  function renderToday(groups, anchor) {
    document.getElementById("todayDate").textContent = formatDate(anchor, "long");
    const grid = document.getElementById("todayGrid");
    grid.innerHTML = "";
    const complete = groups.filter((group) => itemComplete(group.byDate.get(dateKey(anchor)))).length;
    document.getElementById("todayScore").textContent = `${complete} / ${groups.length}`;
    grid.style.gridTemplateColumns = `repeat(${Math.min(3, Math.max(1, groups.length))}, minmax(220px, 1fr))`;
    for (const group of groups) grid.appendChild(makeTodayCard(group, paletteIndex(group.habit), anchor));
  }

  function renderHeader(groups, anchor) {
    const start = startOfWeek(anchor);
    let hits = 0;
    let possible = 0;

    for (let day = 0; day < 7; day++) {
      const date = shiftDay(start, day);
      const future = differenceInDays(date, anchor) > 0;
      const dayHits = future ? 0 : groups.filter((group) => itemComplete(group.byDate.get(dateKey(date)))).length;
      if (!future) {
        hits += dayHits;
        possible += groups.length;
      }
    }

    const rate = possible ? Math.round(hits / possible * 100) : 0;
    const bestActive = groups.reduce((best, group) => Math.max(best, streakStats(group, anchor).current), 0);
    document.getElementById("weekScore").textContent = `${rate}%`;
    document.getElementById("habitCount").textContent = String(groups.length);
    document.getElementById("bestStreak").textContent = `${bestActive} day${bestActive === 1 ? "" : "s"}`;
  }

  function renderHeatmap(group, index, anchor) {
    const stats = streakStats(group, anchor);
    const section = document.createElement("article");
    section.className = `habit-section palette-${index % 4}`;

    const overview = document.createElement("div");
    overview.className = "habit-overview";
    const info = document.createElement("div");
    const nameRow = document.createElement("div");
    nameRow.className = "habit-name-row";
    const dot = document.createElement("span");
    dot.className = "habit-dot";
    const name = document.createElement("span");
    name.className = "habit-name";
    name.textContent = group.habit;
    nameRow.append(dot, name);

    const streaks = document.createElement("div");
    streaks.className = "streaks";
    for (const [value, label] of [[stats.current, "current"], [stats.longest, "longest"]]) {
      const stat = document.createElement("div");
      stat.className = "streak";
      const strong = document.createElement("strong");
      strong.textContent = String(value);
      const caption = document.createElement("span");
      caption.textContent = `${label} streak`;
      stat.append(strong, caption);
      streaks.appendChild(stat);
    }

    info.append(nameRow, streaks);
    overview.append(info, makeRing(stats.rate, group.habit));

    const wrap = document.createElement("div");
    wrap.className = "heat-wrap";
    const layout = document.createElement("div");
    layout.className = "heat-layout";
    const monthLabels = document.createElement("div");
    monthLabels.className = "month-labels";
    const days = document.createElement("div");
    days.className = "day-labels";
    const grid = document.createElement("div");
    grid.className = "heat-grid";

    const chartStart = shiftDay(startOfWeek(anchor), -(WEEKS - 1) * 7);
    let previousMonth = -1;
    for (let week = 0; week < WEEKS; week++) {
      const weekDate = shiftDay(chartStart, week * 7);
      const label = document.createElement("span");
      label.className = "month-label";
      if (week === 0 || weekDate.getMonth() !== previousMonth) {
        label.textContent = new Intl.DateTimeFormat(locale(), { month: "short" }).format(weekDate);
      }
      previousMonth = weekDate.getMonth();
      monthLabels.appendChild(label);
    }

    for (let row = 0; row < 7; row++) {
      const date = shiftDay(chartStart, row);
      const label = document.createElement("span");
      label.textContent = row % 2 === 0 ? new Intl.DateTimeFormat(locale(), { weekday: "narrow" }).format(date) : "";
      days.appendChild(label);
    }

    for (let offset = 0; offset < WEEKS * 7; offset++) {
      const date = shiftDay(chartStart, offset);
      const key = dateKey(date);
      const item = group.byDate.get(key);
      const level = itemLevel(item);
      const future = differenceInDays(date, anchor) > 0;
      const token = `${group.habit}|${key}`;

      const cell = document.createElement("button");
      cell.type = "button";
      cell.className = `heat-cell level-${level}${key === dateKey(anchor) ? " today" : ""}${future ? " future" : ""}${pending.has(token) ? " pending" : ""}`;
      cell.style.setProperty("--delay", String(offset % 18));

      const quantity = cleanNumber(item?.fields.quantity);
      const target = cleanNumber(item?.fields.target, group.target) || group.target;
      const status = itemComplete(item) ? "complete" : level ? `${formatNumber(quantity)} of ${formatNumber(target)}` : "not marked";
      cell.title = `${formatDate(date, "key")} · ${status}${item?.fields.note ? ` · ${item.fields.note}` : ""}`;
      cell.setAttribute("aria-label", `${group.habit}, ${formatDate(date, "long")}, ${status}`);
      cell.setAttribute("aria-pressed", String(itemComplete(item)));
      cell.disabled = future || pending.has(token);
      if (!future) cell.onclick = () => toggleDay(group.habit, key);
      grid.appendChild(cell);
    }

    layout.append(monthLabels, days, grid);
    wrap.appendChild(layout);
    section.append(overview, wrap);
    return section;
  }

  function render(state) {
    latestState = state;
    const anchor = today();
    const groups = habitGroups(state);
    renderHeader(groups, anchor);
    renderToday(groups, anchor);

    const scroll = document.getElementById("habitScroll");
    scroll.innerHTML = "";

    if (!groups.length) {
      const empty = document.createElement("div");
      empty.className = "empty-state";
      const title = document.createElement("strong");
      title.textContent = seedStarted ? "Building your first heatmap…" : "Your rhythm starts with one small mark.";
      const copy = document.createElement("span");
      copy.textContent = 'Add a habit above, or ask the AI to “suggest three tiny daily habits for me.”';
      empty.append(title, copy);
      scroll.appendChild(empty);
    }

    for (const group of groups) {
      scroll.appendChild(renderHeatmap(group, paletteIndex(group.habit), anchor));
    }
  }

  async function toggleDay(habit, key) {
    const token = `${habit}|${key}`;
    if (pending.has(token)) return;

    pending.add(token);
    render(latestState);

    const group = habitGroups(latestState).find((candidate) => candidate.habit === habit);
    const item = group?.byDate.get(key);
    const target = Math.max(.1, cleanNumber(item?.fields.target, group?.target || 1) || 1);
    const nextDone = !itemComplete(item);

    if (item) {
      await oma.updateItem(item.id, {
        habit,
        date: key,
        done: nextDone,
        quantity: nextDone ? Math.max(target, cleanNumber(item.fields.quantity)) : 0,
        target,
        note: String(item.fields.note || "")
      });
    } else {
      await oma.addItem({
        group: habit,
        fields: { habit, date: key, done: true, quantity: target, target, note: "" }
      });
    }

    pending.delete(token);
    render(latestState);
  }

  function openEditor(habit, key) {
    const group = habitGroups(latestState).find((candidate) => candidate.habit === habit);
    const item = group?.byDate.get(key);
    const target = Math.max(.1, cleanNumber(item?.fields.target, group?.target || 1) || 1);

    editorState = { habit, key, itemId: item?.id || null };
    document.getElementById("editorHabit").textContent = habit;
    document.getElementById("editorDate").textContent = formatDate(fromKey(key) || today(), "long");
    document.getElementById("quantityInput").value = String(cleanNumber(item?.fields.quantity));
    document.getElementById("targetInput").value = String(target);
    document.getElementById("noteInput").value = String(item?.fields.note || "");
    document.getElementById("doneInput").checked = itemComplete(item);
    document.getElementById("saveButton").textContent = "Save day";
    document.getElementById("editor").hidden = false;
    document.getElementById("quantityInput").focus();
  }

  function closeEditor() {
    editorState = null;
    document.getElementById("editor").hidden = true;
  }

  async function seed() {
    if (seedStarted) return;
    seedStarted = true;

    const anchor = today();
    const recipes = [
      {
        habit: "Morning walk",
        target: 30,
        include: (ago) => ago % 6 !== 5,
        quantity: (ago) => ago % 7 === 3 ? 18 : 32 + (ago * 3) % 9,
        note: (ago) => ago === 0 ? "Sunny loop through the park." : ""
      },
      {
        habit: "Read 20 pages",
        target: 20,
        include: (ago) => ago % 5 !== 4,
        quantity: (ago) => ago === 0 ? 12 : 16 + (ago * 5) % 13,
        note: (ago) => ago === 0 ? "Halfway through chapter six." : ""
      },
      {
        habit: "Drink 8 glasses",
        target: 8,
        include: (ago) => ago % 4 !== 3,
        quantity: (ago) => 7 + ago % 3,
        note: () => ""
      }
    ];

    const rows = [];
    for (let ago = 23; ago >= 0; ago--) {
      for (const recipe of recipes) {
        if (!recipe.include(ago)) continue;
        const quantity = recipe.quantity(ago);
        rows.push({
          group: recipe.habit,
          fields: {
            habit: recipe.habit,
            date: dateKey(shiftDay(anchor, -ago)),
            done: quantity >= recipe.target,
            quantity,
            target: recipe.target,
            note: recipe.note(ago)
          }
        });
      }
    }

    await Promise.all(rows.map((row) => oma.addItem(row)));
  }

  const UI_COPY = {
    "DAILY RHYTHM": "每日节奏",
    "Habit streaks": "习惯连续",
    "Keep daily promises visible and moving.": "让每日承诺清晰可见，持续向前。",
    "Ask AI": "问问 AI",
    "Ask AI to suggest habits": "让 AI 推荐习惯",
    "Complete this week": "本周完成",
    "Today complete": "今日完成",
    "Habits": "习惯数",
    "Best active streak": "最长连续",
    "Today": "今天",
    "New habit": "新习惯",
    "Add a daily habit…": "添加每日习惯…",
    "Add habit": "添加习惯",
    "Less": "少",
    "More": "多",
    "Twelve-week habit heatmaps": "十二周习惯热力图",
    "Current streak": "当前连续",
    "Longest streak": "最长连续",
    "current streak": "当前连续",
    "longest streak": "最长连续",
    "28-day": "28 天",
    "Quantity": "数量",
    "Daily target": "每日目标",
    "Note": "备注",
    "Optional context…": "可选背景…",
    "Mark this day complete": "标记当天完成",
    "Close": "关闭",
    "Cancel": "取消",
    "Save day": "保存当天",
    "Complete": "完成",
    "Unmark": "取消标记",
    "done": "已完成",
    "in progress": "进行中",
    "complete": "已完成",
    "not marked": "未标记",
    "Morning walk": "晨间散步",
    "Read 20 pages": "阅读 20 页",
    "Drink 8 glasses": "喝 8 杯水",
    "Sunny loop through the park.": "在公园里晒着太阳走了一圈。",
    "Halfway through chapter six.": "读到第六章的一半。",
    "Building your first heatmap…": "正在生成你的第一张热力图…",
    "Your rhythm starts with one small mark.": "从今天的一次小小记录开始。",
    "Add a habit above, or ask the AI to “suggest three tiny daily habits for me.”": "在上方添加一个习惯，或让 AI 为你推荐三个轻量的每日习惯。",
    "days": "天",
    "day": "天"
  };
  const UI_COPY_ZH = Object.fromEntries(Object.entries(UI_COPY).map(([en, zh]) => [zh, en]));
  const isZhUi = () => locale().toLowerCase().startsWith("zh");
  const localizeText = (value) => {
    const zh = isZhUi();
    let next = (zh ? UI_COPY : UI_COPY_ZH)[value] || value;
    if (zh) {
      next = next.replace(/^(\d+) days?$/i, "$1 天");
      next = next.replace(/^(\d+(?:\.\d+)?) of (\d+(?:\.\d+)?)$/i, "$1 / $2");
      next = next.replace(/^(.+?), (.+?), not marked$/i, (_, habit, date) => `${UI_COPY[habit] || habit}，${date}，未标记`);
      next = next.replace(/^(.+?), (.+?), complete$/i, (_, habit, date) => `${UI_COPY[habit] || habit}，${date}，已完成`);
      next = next.replace(/^(.+?), (.+?), (\d+(?:\.\d+)?) of (\d+(?:\.\d+)?)$/i, (_, habit, date, quantity, target) => `${UI_COPY[habit] || habit}，${date}，${quantity} / ${target}`);
      next = next.replace(/^Complete (.+) for today$/i, (_, habit) => `完成今天的 ${UI_COPY[habit] || habit}`);
      next = next.replace(/^Adjust today's quantity, target, or note for (.+)$/i, (_, habit) => `调整今天 ${UI_COPY[habit] || habit} 的数量、目标或备注`);
      next = next.replace(/^(\d+)% consistency for (.+)$/i, (_, rate, habit) => `${UI_COPY[habit] || habit} 的连续率 ${rate}%`);
    }
    return next;
  };
  function applyUiLocale() {
    const zh = isZhUi();
    document.documentElement.lang = zh ? "zh-CN" : "en";
    document.title = zh ? "习惯连续" : "Habit Streaks";
    document.querySelectorAll("body *:not(script):not(style)").forEach((element) => {
      for (const node of element.childNodes) {
        if (node.nodeType !== Node.TEXT_NODE) continue;
        const raw = node.nodeValue || "";
        const trimmed = raw.trim();
        if (!trimmed) continue;
        const translated = localizeText(trimmed);
        if (translated !== trimmed) node.nodeValue = raw.replace(trimmed, translated);
      }
      for (const attribute of ["aria-label", "title", "placeholder"]) {
        const value = element.getAttribute(attribute);
        if (!value) continue;
        const translated = localizeText(value);
        if (translated !== value) element.setAttribute(attribute, translated);
      }
    });
  }

  oma.ready((state) => {
    render(state);
    applyUiLocale();
    // App Store apps install EMPTY — sample data lives only in the oma-fixtures block (store preview).
  });
  oma.onChange((state) => { render(state); applyUiLocale(); });
  oma.onPrefChange(() => { render(latestState); applyUiLocale(); });

  document.getElementById("addForm").onsubmit = async (event) => {
    event.preventDefault();
    const input = document.getElementById("habitInput");
    const value = input.value.trim();
    if (!value) return;

    const existing = habitGroups(latestState).find(
      (group) => group.habit.toLocaleLowerCase() === value.toLocaleLowerCase()
    );
    const habit = existing?.habit || value;
    const key = dateKey(today());

    if (!existing?.byDate.has(key)) {
      const target = existing?.target || 1;
      await oma.addItem({
        group: habit,
        fields: { habit, date: key, done: false, quantity: 0, target, note: "" }
      });
    }

    input.value = "";
    input.focus();
  };

  // oma.sendMessage falls back to the clipboard in standalone, so this hand-off stays visible.
  document.getElementById("suggestButton").onclick = () => {
    const habits = habitGroups(latestState).map((group) => group.habit);
    const context = habits.length ? ` I currently track ${habits.join(", ")}.` : "";
    oma.sendMessage(`Based on what you know about me, suggest three small, sustainable daily habits worth tracking.${context} Give each a realistic numeric daily target, avoid duplicating what I already track, and briefly explain why each fits me.`);
  };

  document.getElementById("editorClose").onclick = closeEditor;
  document.getElementById("editorCancel").onclick = closeEditor;
  document.getElementById("editor").onclick = (event) => {
    if (event.target.id === "editor") closeEditor();
  };
  document.addEventListener("keydown", (event) => {
    if (event.key === "Escape" && editorState) closeEditor();
  });

  document.getElementById("quantityInput").oninput = () => {
    const quantity = cleanNumber(document.getElementById("quantityInput").value);
    const target = Math.max(.1, cleanNumber(document.getElementById("targetInput").value, 1) || 1);
    if (quantity >= target) document.getElementById("doneInput").checked = true;
  };

  document.getElementById("editorForm").onsubmit = async (event) => {
    event.preventDefault();
    if (!editorState) return;

    const quantity = cleanNumber(document.getElementById("quantityInput").value);
    const target = Math.max(.1, cleanNumber(document.getElementById("targetInput").value, 1) || 1);
    const fields = {
      habit: editorState.habit,
      date: editorState.key,
      done: document.getElementById("doneInput").checked,
      quantity,
      target,
      note: document.getElementById("noteInput").value.trim()
    };

    const save = document.getElementById("saveButton");
    save.disabled = true;
    save.textContent = "Saving…";

    if (editorState.itemId) await oma.updateItem(editorState.itemId, fields);
    else await oma.addItem({ group: editorState.habit, fields });

    save.textContent = "Saved ✓";
    save.disabled = false;
    setTimeout(closeEditor, 220);
  };
</script>
</body>
</html>
