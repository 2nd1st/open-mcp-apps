<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Habit Streaks</title>
<meta name="description" content="Every habit on one eight-week wall: check off today, watch the square fill, keep the streak honest.">
<meta name="oma-category" content="Health & Habits">
<style>
  /* Shared primitives (.k-*) — this app's own copy; nothing here comes from the engine. */
  :root{--k-accent:var(--color-text-info,var(--color-ring-primary,#3b6cf6));--k-ok:var(--color-text-success,#2e9e5b);--k-warn:var(--color-text-warning,#b98200);--k-bad:var(--color-text-danger,#e5484d);--k-ink-4:color-mix(in oklab,var(--color-text-primary) 4%,transparent);--k-ink-7:color-mix(in oklab,var(--color-text-primary) 7%,transparent);--k-accent-bg:color-mix(in oklab,var(--k-accent) 10%,transparent);--k-accent-brd:color-mix(in oklab,var(--k-accent) 28%,transparent);--k-hue-0:var(--k-accent);--k-hue-1:var(--k-ok);--k-hue-2:var(--k-warn);--k-hue-3:var(--k-bad);--k-hue-4:color-mix(in oklab,var(--k-accent) 55%,var(--k-bad));--k-hue-5:color-mix(in oklab,var(--k-ok) 55%,var(--k-accent));--k-t-fast:120ms;--k-t:180ms;--k-ease:cubic-bezier(.2,.8,.3,1);--k-spring:cubic-bezier(.34,1.56,.64,1);--k-surface:var(--color-background-primary)}
  @media (prefers-reduced-motion:reduce){:root{--k-t-fast:0ms;--k-t:0ms}}
  .k-sub,.k-mut{font-size:var(--font-text-sm-size,12.5px)}
  .k-sub{color:var(--color-text-secondary)}
  .k-num{font-variant-numeric:tabular-nums}
  .k-grow{flex:1;min-width:0}
  .k-btn{display:inline-flex;align-items:center;gap:6px;border:1px solid transparent;border-radius:var(--border-radius-md,10px);padding:6px 12px;font:inherit;font-size:var(--font-text-sm-size,12.5px);font-weight:600;cursor:pointer;background:var(--color-background-inverse);color:var(--color-text-inverse);transition:transform var(--k-t-fast) var(--k-ease),opacity var(--k-t-fast),background var(--k-t-fast)}
  .k-btn:hover{opacity:.9}
  .k-btn:active{transform:scale(.96)}
  .k-btn:disabled{opacity:.45;cursor:default;transform:none}
  .k-btn.sec{background:transparent;color:var(--color-text-primary);border-color:var(--color-border-primary)}
  .k-btn.ghost{background:transparent;color:var(--color-text-secondary)}
  :is(.k-btn.sec,.k-btn.ghost):hover{background:var(--k-ink-4);color:var(--color-text-primary);opacity:1}
  .k-btn.danger{background:transparent;color:var(--k-bad);border-color:color-mix(in oklab,var(--k-bad) 30%,transparent)}
  .k-btn.danger:hover{background:color-mix(in oklab,var(--k-bad) 10%,transparent);opacity:1}
  :is(.k-btn,.k-tab,.k-chip,.k-switch,.k-field):focus-visible{outline:2px solid var(--color-ring-primary,var(--k-accent));outline-offset:1px}
  .k-switch{appearance:none;width:34px;height:20px;margin:0;position:relative;border-radius:999px;background:var(--color-background-tertiary);border:1px solid var(--color-border-primary);cursor:pointer;transition:background var(--k-t) var(--k-ease),border-color var(--k-t)}
  .k-switch::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--color-background-primary);box-shadow:var(--shadow-sm);transition:translate var(--k-t) var(--k-spring)}
  .k-switch:checked{background:var(--k-accent);border-color:var(--k-accent)}
  .k-switch:checked::after{translate:14px 0}
  .k-field{padding:6px 10px;border-radius:var(--border-radius-md,10px);border:1px solid var(--color-border-primary);background:transparent;color:inherit;font:inherit;font-size:var(--font-text-sm-size,12.5px);transition:border-color var(--k-t-fast),box-shadow var(--k-t-fast)}
  .k-field::placeholder{color:var(--color-text-tertiary)}
  .k-field:focus{outline:none;border-color:var(--k-accent);box-shadow:0 0 0 3px color-mix(in oklab,var(--k-accent) 10%,transparent)}
  .k-appbar{display:flex;align-items:center;gap:11px;padding:13px 16px}
  .k-appbar .k-appmark{display:grid;width:34px;height:34px;flex:none;place-items:center;border-radius:11px}
  .k-appbar .k-appmark svg{width:18px;height:18px}
  .k-appbar .k-appcopy{min-width:0;flex:1}
  .k-appbar .k-eyebrow{display:block;margin:0;color:var(--color-text-tertiary);font-size:9.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
  .k-appbar h1{margin:1px 0 0;font-size:15px;font-weight:650;letter-spacing:-.015em}
  body:not(.standalone) .k-appbar{border-bottom:1px solid var(--color-border-secondary);background:var(--k-surface)}
  .k-stage{max-width:760px;margin-inline:auto;overflow-x:clip}

  /* The signature is THE WALL: every habit a lane of 7 weekday columns × up to 8 week rows, this
     week at the bottom, today's weekday lit as a column band across all lanes. Everything else —
     the headline, the streaks, the week fractions — is derived from the same rows the wall draws,
     in one pass (see model()), so no number on this page can disagree with a square. */
  :root { --hs-gap: 3px; }
  button, input { font: inherit; color: inherit; }
  /* The editor overlay positions against the stage. */
  .hs { position: relative; }

  /* ── app bar: mark · name · the AI hand-off. Nothing live up here. ── */
  .hs-mark { border: 1px solid var(--k-accent-brd); background: var(--k-accent-bg); color: var(--k-accent); }
  .hs-mark rect { fill: currentColor; }
  .hs-mark .o { opacity: .28; }
  .hs-bar .k-btn.sec { margin-left: auto; flex: none; }
  .hs-bar .k-btn svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linejoin: round; }

  .error-strip {
    margin: 10px 20px 0; padding: 8px 10px;
    border: 1px solid color-mix(in oklab, var(--k-bad) 32%, var(--color-border-secondary));
    border-radius: var(--border-radius-md, 10px);
    background: color-mix(in oklab, var(--k-bad) 8%, transparent);
    color: var(--k-bad); font-size: 12px;
  }

  /* ── the headline: one sentence about today, one line about the week ── */
  .hero { padding: 18px 20px 4px; }
  .kicker { margin: 0; color: var(--color-text-tertiary); font-size: 12px; font-weight: 600; }
  .headline {
    margin: 3px 0 5px; font-size: clamp(24px, 4.3vw, 31px); font-weight: 720;
    line-height: 1.08; letter-spacing: -.035em; text-wrap: balance;
  }
  .headline .n { color: var(--k-accent); font-variant-numeric: tabular-nums; display: inline-block; }
  .sub { margin: 0; color: var(--color-text-secondary); font-size: 13px; line-height: 1.45; font-variant-numeric: tabular-nums; }
  .sub b { color: var(--color-text-primary); font-weight: 650; }

  /* ── the wall ── */
  .wall {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(148px, 1fr));
    gap: 10px 20px; padding: 14px 20px 18px;
  }
  .wall.few { grid-template-columns: repeat(auto-fit, minmax(148px, 230px)); }
  /* subgrid: a two-line name in one lane still lines every grid up with its neighbours */
  .lane { display: grid; grid-row: span 4; grid-template-rows: subgrid; row-gap: 9px; min-width: 0; }
  .lane-name {
    display: flex; align-items: flex-start; gap: 7px; margin: 0; align-self: end;
    font-size: 13.5px; font-weight: 680; line-height: 1.25; letter-spacing: -.01em; overflow-wrap: anywhere;
  }
  .swatch { width: 9px; height: 9px; margin-top: 3.5px; flex: none; border-radius: 3px; background: var(--h); }
  .lane-stats { display: flex; align-items: flex-end; justify-content: space-between; gap: 8px; font-variant-numeric: tabular-nums; }
  .st { display: flex; align-items: flex-end; gap: 6px; min-width: 0; }
  .st b { font-size: 24px; font-weight: 720; line-height: .9; letter-spacing: -.04em; display: inline-block; }
  .st.on b { color: var(--h); }
  .st .lbl { display: grid; color: var(--color-text-tertiary); font-size: 10.5px; line-height: 1.2; }
  .st .lbl span:first-child { color: var(--color-text-secondary); font-weight: 600; }
  .st.wk { flex-direction: column; align-items: flex-end; gap: 3px; text-align: right; }
  .st.wk b { font-size: 14px; letter-spacing: -.01em; line-height: 1; }

  .cal { position: relative; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: var(--hs-gap); align-content: start; }
  .dow { position: relative; z-index: 1; color: var(--color-text-tertiary); font-size: 9.5px; font-weight: 600; line-height: 15px; text-align: center; }
  .dow.is-today { color: var(--h); font-weight: 800; }
  /* today's weekday, lit down the whole lane — across four lanes it reads as one column of light */
  .band { z-index: 0; margin: -3px -2px; border-radius: 7px; background: color-mix(in oklab, var(--h) 15%, transparent); pointer-events: none; }
  .c {
    position: relative; z-index: 1; width: 100%; aspect-ratio: 1; margin: 0; padding: 0; border: 0;
    border-radius: 28%; background: var(--k-ink-7); cursor: pointer;
  }
  .c.pre { background: transparent; box-shadow: inset 0 0 0 1px var(--k-ink-7); }
  .c.fut { background: transparent; box-shadow: inset 0 0 0 1px var(--k-ink-4); cursor: default; }
  .c.p1 { background: color-mix(in oklab, var(--h) 24%, var(--k-ink-4)); }
  .c.p2 { background: color-mix(in oklab, var(--h) 40%, var(--k-ink-4)); }
  .c.p3 { background: color-mix(in oklab, var(--h) 58%, var(--k-ink-4)); }
  .c.done { background: linear-gradient(160deg, color-mix(in oklab, var(--h) 76%, var(--color-background-primary)), var(--h)); }
  .c.today { box-shadow: 0 0 0 2px var(--k-surface), 0 0 0 3.5px var(--h); z-index: 2; }
  .c.today.open { background: color-mix(in oklab, var(--h) 7%, var(--k-surface)); }   /* not missed — still open */
  .c:disabled { cursor: default; }
  .c:focus-visible { outline: 2px solid var(--color-ring-primary, var(--k-accent)); outline-offset: 2px; z-index: 3; }

  .today-row { display: flex; gap: 5px; align-self: start; }
  .today-btn.k-btn {
    flex: 1; min-width: 0; justify-content: flex-start; gap: 7px; padding: 6px 9px 6px 7px;
    background: linear-gradient(90deg, color-mix(in oklab, var(--h) 16%, transparent) var(--p, 0%), transparent var(--p, 0%));
  }
  .tick {
    display: grid; place-items: center; width: 18px; height: 18px; flex: none; border-radius: 50%;
    border: 1.5px solid color-mix(in oklab, var(--h) 60%, var(--color-border-primary)); color: transparent;
  }
  .tick svg { width: 11px; height: 11px; fill: none; stroke: currentColor; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  .tick path { stroke-dasharray: 16; stroke-dashoffset: 0; }
  .today-btn .meta { margin-left: auto; color: var(--color-text-secondary); font-size: 11px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .today-btn.is-done { background: color-mix(in oklab, var(--h) 15%, transparent); border-color: color-mix(in oklab, var(--h) 42%, transparent); }
  .today-btn.is-done .tick { border-color: var(--h); background: var(--h); color: var(--k-surface); }
  .adjust.k-btn { flex: none; padding: 0 7px; }
  .adjust svg { width: 15px; height: 15px; fill: currentColor; }

  /* empty wall: one ghost lane that says what goes here */
  .ghost-lane { grid-column: 1 / -1; display: grid; grid-template-columns: minmax(120px, 170px) 1fr; gap: 20px; align-items: center; }
  .ghost-lane .cal { opacity: .7; }
  .ghost-lane b { display: block; margin-bottom: 4px; font-size: 15px; }
  .ghost-lane p { margin: 0; color: var(--color-text-secondary); font-size: 13px; line-height: 1.5; }

  /* ── foot: add a habit · how to read the wall ── */
  .foot {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 18px;
    padding: 12px 20px 16px; border-top: 1px solid var(--color-border-secondary);
  }
  .add { display: flex; gap: 6px; flex: 1 1 250px; max-width: 360px; }
  .add .k-field { flex: 1; min-width: 0; }
  .legend { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; color: var(--color-text-tertiary); font-size: 11px; }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .legend i { width: 10px; height: 10px; border-radius: 3px; background: var(--k-ink-7); }
  .legend i.p { background: color-mix(in oklab, var(--k-accent) 40%, var(--k-ink-4)); }
  .legend i.d { background: var(--k-accent); }

  /* ── day editor ── */
  .editor { position: absolute; inset: 0; z-index: 10; display: grid; place-items: center; padding: 16px;
    background: color-mix(in oklab, var(--k-surface) 72%, transparent); backdrop-filter: blur(4px); }
  .editor-card { width: min(380px, 100%); border: 1px solid var(--color-border-primary); border-radius: var(--border-radius-lg, 14px);
    background: var(--k-surface); box-shadow: var(--shadow-lg, var(--shadow-md)); }
  .editor-head { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--color-border-secondary); }
  .editor-head strong { display: block; font-size: 14px; }
  .editor-body { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 14px 16px; }
  .fld { display: grid; gap: 5px; color: var(--color-text-secondary); font-size: 11.5px; font-weight: 600; }
  .fld.wide, .done-row { grid-column: 1 / -1; }
  .done-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 13px; font-weight: 600; }
  .editor-actions { display: flex; justify-content: flex-end; gap: 8px; padding: 0 16px 16px; }


  /* ── motion: the wall fills in once; a check-off springs. Nothing moves for reduced motion. ── */
  @media (prefers-reduced-motion: no-preference) {
    .c { transition: background-color var(--k-t) var(--k-ease), box-shadow var(--k-t) var(--k-ease), transform var(--k-t-fast) var(--k-ease); }
    .c:not(:disabled):hover { transform: scale(1.14); }
    .c:not(:disabled):active { transform: scale(.9); }
    .today-btn.k-btn { transition: background var(--k-t) var(--k-ease), border-color var(--k-t), transform var(--k-t-fast) var(--k-ease); }
    .wall.enter .c { animation: hs-in 380ms var(--k-ease) backwards; animation-delay: calc(var(--i, 0) * 7ms); }
    @keyframes hs-in { from { opacity: 0; transform: scale(.5); } }

    /* THE moment: the square overshoots, a ring leaves it, six sparks fly, it settles. */
    .c.pop { z-index: 4; animation: hs-fill 560ms var(--k-spring) both; }
    .c.pop::before, .c.pop::after { content: ""; position: absolute; pointer-events: none; }
    .c.pop::after { inset: 0; border-radius: inherit; border: 2px solid var(--h); animation: hs-ring 640ms var(--k-ease) forwards; }
    .c.pop::before {
      left: 50%; top: 50%; width: 4px; height: 4px; margin: -2px; border-radius: 50%;
      box-shadow: 0 -19px var(--h), 16.5px -9.5px var(--h), 16.5px 9.5px var(--h), 0 19px var(--h), -16.5px 9.5px var(--h), -16.5px -9.5px var(--h);
      animation: hs-spark 620ms var(--k-ease) forwards;
    }
    @keyframes hs-fill { 0% { transform: scale(.3); } 45% { transform: scale(1.32); } 72% { transform: scale(.93); } 100% { transform: scale(1); } }
    @keyframes hs-ring { 0% { opacity: .8; transform: scale(1); } 100% { opacity: 0; transform: scale(2.1); } }
    @keyframes hs-spark { 0% { opacity: 0; transform: scale(.35); } 20% { opacity: 1; } 100% { opacity: 0; transform: scale(1.3); } }

    .today-btn.pop .tick { animation: hs-tick 420ms var(--k-spring); }
    .today-btn.pop .tick path { animation: hs-draw 360ms 80ms var(--k-ease) backwards; }
    @keyframes hs-tick { 0% { transform: scale(.6); } 60% { transform: scale(1.22); } 100% { transform: scale(1); } }
    @keyframes hs-draw { from { stroke-dashoffset: 16; } }
    .bump { animation: hs-bump 440ms var(--k-spring); }
    @keyframes hs-bump { 0% { transform: translateY(3px) scale(.8); } 55% { transform: translateY(-2px) scale(1.14); } 100% { transform: none; } }
    .editor-card { animation: hs-rise var(--k-t) var(--k-ease); }
    @keyframes hs-rise { from { opacity: 0; transform: translateY(6px) scale(.985); } }
  }

  @media (max-width: 560px) {
    .hero { padding: 14px 16px 2px; }
    .wall { gap: 10px 14px; padding: 12px 16px 16px; }
    .foot { padding: 12px 16px 14px; }
    .add { max-width: none; }
    .ghost-lane { grid-template-columns: 1fr; }
    .ghost-lane .cal { max-width: 170px; }
  }
</style>
</head>
<body>
<main class="hs k-stage">
  <header class="hs-bar k-appbar">
    <span class="hs-mark k-appmark" aria-hidden="true">
      <svg viewBox="0 0 18 18"><rect x="1" y="1" width="4.4" height="4.4" rx="1.3"/><rect x="6.8" y="1" width="4.4" height="4.4" rx="1.3" class="o"/><rect x="12.6" y="1" width="4.4" height="4.4" rx="1.3"/><rect x="1" y="6.8" width="4.4" height="4.4" rx="1.3"/><rect x="6.8" y="6.8" width="4.4" height="4.4" rx="1.3"/><rect x="12.6" y="6.8" width="4.4" height="4.4" rx="1.3" class="o"/><rect x="1" y="12.6" width="4.4" height="4.4" rx="1.3" class="o"/><rect x="6.8" y="12.6" width="4.4" height="4.4" rx="1.3"/><rect x="12.6" y="12.6" width="4.4" height="4.4" rx="1.3"/></svg>
    </span>
    <div class="k-appcopy"><h1 id="appName">Habit streaks</h1></div>
    <button id="askBtn" class="k-btn sec" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 .8 3.2A6.5 6.5 0 0 0 17.5 11l3.2.8-3.2.8a6.5 6.5 0 0 0-4.7 4.7L12 20.5l-.8-3.2a6.5 6.5 0 0 0-4.7-4.7l-3.2-.8 3.2-.8a6.5 6.5 0 0 0 4.7-4.8L12 3Z"/></svg>
      <span id="askLabel">Review with AI</span>
    </button>
  </header>

  <div class="error-strip" id="errorStrip" role="status" aria-live="polite" hidden></div>

  <section class="hero">
    <p class="kicker" id="dateLine"></p>
    <h2 class="headline" id="headline" aria-live="polite"></h2>
    <p class="sub" id="weekLine"></p>
  </section>

  <section id="wall" class="wall enter"></section>

  <footer class="foot">
    <form id="addForm" class="add">
      <input id="habitInput" class="k-field" maxlength="48" autocomplete="off" aria-label="New habit">
      <button id="addBtn" class="k-btn" type="submit">Add habit</button>
    </form>
    <div class="legend" id="legend"></div>
  </footer>

  <div id="editor" class="editor" role="dialog" aria-modal="true" aria-labelledby="edHabit" hidden>
    <form id="editorForm" class="editor-card">
      <div class="editor-head">
        <div class="k-grow"><strong id="edHabit"></strong><span id="edDate" class="k-sub"></span></div>
        <button id="edClose" class="k-btn ghost" type="button">×</button>
      </div>
      <div class="editor-body">
        <label class="fld"><span id="lQty">Quantity</span><input id="qtyInput" class="k-field" type="number" min="0" step="0.1" inputmode="decimal"></label>
        <label class="fld"><span id="lTarget">Daily target</span><input id="targetInput" class="k-field" type="number" min="0.1" step="0.1" inputmode="decimal"></label>
        <label class="fld wide"><span id="lNote">Note</span><input id="noteInput" class="k-field" maxlength="120" autocomplete="off"></label>
        <label class="done-row"><span id="lDone">Done for this day</span><input id="doneInput" class="k-switch" type="checkbox"></label>
      </div>
      <div class="editor-actions">
        <button id="edCancel" class="k-btn sec" type="button">Cancel</button>
        <button id="edSave" class="k-btn" type="submit">Save</button>
      </div>
    </form>
  </div>
</main>

<script type="module">
  const $ = (id) => document.getElementById(id);
  const WEEKS_MAX = 8, WEEKS_MIN = 4;
  const HUES = [0, 1, 2, 4, 5, 3];           // --k-hue-* slots; red last — a habit is not an error
  const SEP = "\u0001";                       // habit names are free text; this can't be in one

  // ── words ──────────────────────────────────────────────────────────────────────────────────
  const COPY = {
    en: {
      app: "Habit streaks", ask: "Review with AI", askEmpty: "Suggest habits", wall: "Eight-week habit wall",
      streak: "day streak", best: (n) => `best ${n}`, noStreak: "no streak", week: "this week",
      done: "Done", today: "Today",
      adjust: (h) => `Adjust today for ${h}`, toggle: (h, on) => `${on ? "Unmark" : "Check off"} ${h} for today`,
      head: (d, t) => t === 0 ? "Nothing to check off yet." : d === t ? `All <span class="n">${t}</span> done today.` : `<span class="n">${d}</span> of ${t} done today.`,
      weekLine: (d, p, pct) => `This week so far: <b>${d} of ${p}</b> check-ins · ${pct}%`,
      emptyWeek: "Add a habit and today becomes the first square.",
      st: { done: "done", miss: "missed", open: "still open", pre: "not tracked yet", fut: "upcoming", part: (q, t) => `${q} of ${t}` },
      legend: ["missed", "partial", "done", "Each row is a week — this one at the bottom."],
      input: "New habit", ph: "Add a daily habit…", add: "Add habit",
      emptyT: "Your wall starts with one habit.",
      emptyP: "Add one below — or ask the AI to “suggest three tiny daily habits for me.”",
      qty: "Quantity", target: "Daily target", note: "Note", notePh: "Optional context…", doneDay: "Done for this day",
      cancel: "Cancel", save: "Save", saving: "Saving…", close: "Close",
      errAsk: "Couldn't reach the assistant — try again.", errSave: "Couldn't save that — try again.",
    },
    zh: {
      app: "习惯连续", ask: "让 AI 复盘", askEmpty: "让 AI 推荐习惯", wall: "八周习惯墙",
      streak: "连续天数", best: (n) => `最长 ${n} 天`, noStreak: "暂无连续", week: "本周",
      done: "已完成", today: "今天",
      adjust: (h) => `调整今天的「${h}」`, toggle: (h, on) => `${on ? "取消" : "完成"}今天的「${h}」`,
      head: (d, t) => t === 0 ? "还没有要打卡的习惯。" : d === t ? `今天 <span class="n">${t}</span> 项全部完成。` : `今天完成 <span class="n">${d}</span> / ${t} 项。`,
      weekLine: (d, p, pct) => `本周至今：打卡 <b>${d} / ${p}</b> 次 · ${pct}%`,
      emptyWeek: "添加一个习惯，今天就是第一格。",
      st: { done: "已完成", miss: "未完成", open: "还没打卡", pre: "尚未开始记录", fut: "未到", part: (q, t) => `${q} / ${t}` },
      legend: ["未完成", "部分", "完成", "每行一周，本周在最下面。"],
      input: "新习惯", ph: "添加每日习惯…", add: "添加",
      emptyT: "从一个习惯开始你的墙。",
      emptyP: "在下方添加一个，或者对 AI 说「给我推荐三个轻量的每日习惯」。",
      qty: "数量", target: "每日目标", note: "备注", notePh: "可选备注…", doneDay: "这一天已完成",
      cancel: "取消", save: "保存", saving: "保存中…", close: "关闭",
      errAsk: "没能联系上助手，请重试。", errSave: "没能保存，请重试。",
    },
  };
  const locale = () => { const v = oma.pref("locale", "auto"); return v === "auto" ? navigator.language : v; };
  const T = () => (String(locale()).toLowerCase().startsWith("zh") ? COPY.zh : COPY.en);
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

  // ── time: facts are stored, judgments are computed here, every render ──────────────────────
  const at = (y, m, d) => new Date(y, m, d, 12);
  const today = () => { const n = new Date(); return at(n.getFullYear(), n.getMonth(), n.getDate()); };
  const shift = (d, n) => at(d.getFullYear(), d.getMonth(), d.getDate() + n);
  const keyOf = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  const fromKey = (v) => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(v || "")); return m ? at(+m[1], +m[2] - 1, +m[3]) : null; };
  const daysBetween = (a, b) => Math.round((Date.UTC(b.getFullYear(), b.getMonth(), b.getDate()) - Date.UTC(a.getFullYear(), a.getMonth(), a.getDate())) / 86400000);
  const weekStartIdx = () => ({ sunday: 0, monday: 1, saturday: 6 })[oma.pref("week_start", "monday")] ?? 1;
  const startOfWeek = (d) => shift(d, -((d.getDay() - weekStartIdx() + 7) % 7));
  const fmt = (d, o) => new Intl.DateTimeFormat(locale(), o).format(d);
  const fmtDay = (d) => {
    const p = oma.pref("date_format", "auto"), y = d.getFullYear(), m = String(d.getMonth() + 1).padStart(2, "0"), dd = String(d.getDate()).padStart(2, "0");
    if (p === "yyyy-mm-dd") return `${y}-${m}-${dd}`;
    if (p === "dd/mm/yyyy") return `${dd}/${m}/${y}`;
    if (p === "mm/dd/yyyy") return `${m}/${dd}/${y}`;
    return fmt(d, { weekday: "short", month: "short", day: "numeric" });
  };
  const num = (v, f = 0) => (Number.isFinite(Number(v)) ? Math.max(0, Number(v)) : f);
  const nf = (v) => new Intl.NumberFormat(locale(), { maximumFractionDigits: 1 }).format(num(v));

  // ── the one reading of the rows ────────────────────────────────────────────────────────────
  const complete = (f) => !!f && (!!f.done || (num(f.target, 1) > 0 && num(f.quantity) >= num(f.target, 1)));
  const level = (f) => {
    if (!f) return "";
    if (complete(f)) return "done";
    const r = num(f.quantity) / Math.max(.1, num(f.target, 1));
    return r <= 0 ? "" : r >= .66 ? "p3" : r >= .34 ? "p2" : "p1";
  };

  let latest = { items: [] };
  // Optimistic overlay: the square must answer the finger NOW, not after a round trip. An entry is
  // dropped the moment the store's own state arrives carrying the write (or the write is refused).
  const overlay = new Map();                  // token → { fields, acked }
  const pending = new Set();

  function realGroups(items) {
    const groups = new Map();
    for (const it of [...items].sort((a, b) => a.position - b.position)) {
      const habit = String(it.group || it.fields?.habit || "").trim();
      const key = String(it.fields?.date || "");
      if (!habit || !fromKey(key)) continue;
      if (!groups.has(habit)) groups.set(habit, { habit, byDate: new Map() });
      groups.get(habit).byDate.set(key, { id: it.id, fields: it.fields });   // later position wins
    }
    return groups;
  }
  function reconcile(state) {
    const real = realGroups(state.items);
    for (const [tok, o] of overlay) {
      if (o.acked) { overlay.delete(tok); continue; }
      const [h, k] = tok.split(SEP);
      const f = real.get(h)?.byDate.get(k)?.fields;
      if (f && ["done", "quantity", "target", "note"].every((x) => String(f[x] ?? "") === String(o.fields[x] ?? ""))) overlay.delete(tok);
    }
  }

  function model(state) {
    const anchor = today(), todayKey = keyOf(anchor), wk0 = startOfWeek(anchor);
    const groups = realGroups(state.items);
    for (const [tok, o] of overlay) {
      const [h, k] = tok.split(SEP);
      if (!groups.has(h)) groups.set(h, { habit: h, byDate: new Map() });
      const g = groups.get(h), cur = g.byDate.get(k);
      g.byDate.set(k, { id: cur?.id ?? null, fields: { ...(cur?.fields || {}), ...o.fields } });
    }
    let earliest = anchor;
    const lanes = [...groups.values()].map((g, i) => {
      const keys = [...g.byDate.keys()].sort();
      const start = fromKey(keys.find((k) => k <= todayKey) || todayKey);
      if (start < earliest) earliest = start;
      const doneSet = new Set(keys.filter((k) => complete(g.byDate.get(k).fields)));
      // current streak: through today if today is done, else through yesterday (still alive today)
      let c = doneSet.has(todayKey) ? anchor : shift(anchor, -1), cur = 0;
      while (doneSet.has(keyOf(c))) { cur++; c = shift(c, -1); }
      let best = 0, run = 0, prev = null;
      for (const k of [...doneSet].sort()) { const d = fromKey(k); run = prev && daysBetween(prev, d) === 1 ? run + 1 : 1; best = Math.max(best, run); prev = d; }
      // this week: the same squares the bottom row shows — days elapsed since the habit began
      let wkDone = 0, wkPossible = 0;
      for (let d = wk0; d <= anchor; d = shift(d, 1)) if (d >= start) { wkPossible++; if (doneSet.has(keyOf(d))) wkDone++; }
      const recent = keys.filter((k) => k <= todayKey).pop() || keys[0];
      const target = num(g.byDate.get(recent)?.fields.target, 1) || 1;
      const t = g.byDate.get(todayKey);
      return { habit: g.habit, hue: HUES[i % HUES.length], byDate: g.byDate, startKey: keyOf(start), cur, best,
        wkDone, wkPossible, target, todayItem: t || null, todayDone: complete(t?.fields) };
    });
    const span = Math.floor(daysBetween(startOfWeek(earliest), wk0) / 7) + 1;
    const rows = Math.min(WEEKS_MAX, Math.max(WEEKS_MIN, span));
    return { anchor, todayKey, wk0, rows, first: shift(wk0, -(rows - 1) * 7), lanes,
      todayDone: lanes.filter((l) => l.todayDone).length,
      wkDone: lanes.reduce((s, l) => s + l.wkDone, 0), wkPossible: lanes.reduce((s, l) => s + l.wkPossible, 0) };
  }

  // ── DOM: built once per shape, then updated in place so a refresh never replays the wall ───
  let built = null;                            // { shape, lanes: Map(habit → refs) }
  const popping = new Set();                   // cell/button tokens mid-celebration
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  const TICK = '<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2.4 6.3 4.9 8.7 9.6 3.5"/></svg>';

  function celebrate(node, tok) {
    popping.add(tok);
    node.classList.add("pop");
    const done = (e) => { if (e.target !== node && !node.contains(e.target)) return; popping.delete(tok); node.classList.remove("pop"); node.removeEventListener("animationend", done); };
    setTimeout(() => { if (popping.has(tok)) { popping.delete(tok); node.classList.remove("pop"); } }, 900);
    node.addEventListener("animationend", done);
  }

  function build(m) {
    const t = T(), wall = $("wall");
    wall.innerHTML = "";
    wall.classList.toggle("few", m.lanes.length > 0 && m.lanes.length < 3);
    const lanes = new Map();
    if (!m.lanes.length) {
      const ghost = el("div", "ghost-lane");
      const cal = el("div", "cal");
      cal.style.setProperty("--h", "var(--k-accent)");
      const col = daysBetween(m.wk0, m.anchor);
      for (let i = 0; i < 7 * 5; i++) cal.append(el("span", `c ${i === 7 * 4 + col ? "today open" : "pre"}`));
      const copy = el("div");
      copy.append(el("b", "", t.emptyT), el("p", "", t.emptyP));
      ghost.append(cal, copy);
      wall.append(ghost);
      return { lanes };
    }
    const todayCol = daysBetween(m.wk0, m.anchor) + 1;
    m.lanes.forEach((L, li) => {
      const lane = el("article", "lane");
      lane.style.setProperty("--h", `var(--k-hue-${L.hue})`);
      const name = el("h3", "lane-name");
      name.append(el("span", "swatch"), el("span", "", L.habit));
      const stats = el("div", "lane-stats");
      const st = el("div", "st"), stN = el("b", "k-num"), stL = el("span", "lbl");
      st.append(stN, stL);
      const wk = el("div", "st wk"), wkN = el("b", "k-num"), wkL = el("span", "lbl");
      wk.append(wkN, wkL);
      stats.append(st, wk);

      const cal = el("div", "cal");
      const band = el("span", "band");
      band.style.gridArea = `1 / ${todayCol} / ${m.rows + 2} / ${todayCol + 1}`;
      cal.append(band);
      for (let c = 0; c < 7; c++) {
        const d = shift(m.first, c);
        const h = el("span", `dow${c + 1 === todayCol ? " is-today" : ""}`, fmt(d, { weekday: "narrow" }));
        h.style.gridArea = `1 / ${c + 1}`;
        h.setAttribute("aria-hidden", "true");
        cal.append(h);
      }
      const cells = new Map();
      for (let r = 0; r < m.rows; r++) for (let c = 0; c < 7; c++) {
        const d = shift(m.first, r * 7 + c), k = keyOf(d);
        const b = el("button", "c");
        b.type = "button";
        b.style.gridArea = `${r + 2} / ${c + 1}`;
        b.style.setProperty("--i", String(r * 7 + c + li * 6));
        b.onclick = () => toggleDay(L.habit, k);
        b.oncontextmenu = (e) => { if (k <= m.todayKey) { e.preventDefault(); openEditor(L.habit, k); } };
        cal.append(b);
        cells.set(k, { b, d, prev: null });
      }

      const row = el("div", "today-row");
      const tb = el("button", "today-btn k-btn sec");
      tb.type = "button";
      tb.innerHTML = `<span class="tick">${TICK}</span><span class="lb"></span><span class="meta"></span>`;
      tb.onclick = () => toggleDay(L.habit, m.todayKey);
      const adj = el("button", "adjust k-btn ghost");
      adj.type = "button";
      adj.innerHTML = '<svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="3.5" cy="8" r="1.4"/><circle cx="8" cy="8" r="1.4"/><circle cx="12.5" cy="8" r="1.4"/></svg>';
      adj.onclick = () => openEditor(L.habit, m.todayKey);
      row.append(tb, adj);

      lane.append(name, stats, cal, row);
      wall.append(lane);
      lanes.set(L.habit, { cells, stN, stL, st, wkN, wkL, tb, adj, prevCur: null, prevDone: null });
    });
    return { lanes };
  }

  function update(m, fresh) {
    const t = T();
    for (const L of m.lanes) {
      const R = built.lanes.get(L.habit);
      for (const [k, cell] of R.cells) {
        const f = L.byDate.get(k)?.fields;
        const fut = k > m.todayKey, pre = !fut && k < L.startKey;
        const lv = level(f), tok = L.habit + SEP + k;
        cell.b.className = `c ${fut ? "fut" : pre && !lv ? "pre" : lv}${k === m.todayKey ? (lv ? " today" : " today open") : ""}${popping.has(tok) ? " pop" : ""}`;
        cell.b.disabled = fut;
        const status = fut ? t.st.fut : lv === "done" ? t.st.done : lv ? t.st.part(nf(f.quantity), nf(f.target)) : pre ? t.st.pre : k === m.todayKey ? t.st.open : t.st.miss;
        const note = f?.note ? ` · ${f.note}` : "";
        cell.b.title = `${fmtDay(cell.d)} · ${status}${note}`;
        cell.b.setAttribute("aria-label", `${L.habit}, ${fmt(cell.d, { weekday: "long", month: "long", day: "numeric" })}, ${status}${note}`);
        cell.b.setAttribute("aria-pressed", String(lv === "done"));
        const isDone = lv === "done";
        if (!fresh && cell.prev === false && isDone && !popping.has(tok)) celebrate(cell.b, tok);
        cell.prev = isDone;
      }
      // streak + week
      R.stN.textContent = L.cur ? String(L.cur) : "0";
      R.st.classList.toggle("on", L.todayDone && L.cur > 0);
      R.stL.innerHTML = `<span>${esc(t.streak)}</span><span>${esc(t.best(L.best))}</span>`;
      R.wkN.textContent = `${L.wkDone}/${L.wkPossible}`;
      R.wkL.textContent = t.week;
      if (!fresh && R.prevCur != null && L.cur > R.prevCur) { R.stN.classList.remove("bump"); void R.stN.offsetWidth; R.stN.classList.add("bump"); }
      R.prevCur = L.cur;
      // today button
      const f = L.todayItem?.fields, tq = num(f?.quantity), tt = num(f?.target, L.target) || L.target;
      const tok = L.habit + SEP + m.todayKey + SEP + "btn";
      R.tb.className = `today-btn k-btn sec${L.todayDone ? " is-done" : ""}${popping.has(tok) ? " pop" : ""}`;
      R.tb.style.setProperty("--p", L.todayDone ? "0%" : `${Math.min(100, Math.round(tq / tt * 100))}%`);
      R.tb.querySelector(".lb").textContent = L.todayDone ? t.done : t.today;
      R.tb.querySelector(".meta").textContent = tq > 0 && (tt > 1 || !L.todayDone) ? `${nf(tq)}/${nf(tt)}` : "";
      R.tb.setAttribute("aria-pressed", String(L.todayDone));
      R.tb.setAttribute("aria-label", t.toggle(L.habit, L.todayDone));
      R.tb.disabled = pending.has(L.habit + SEP + m.todayKey);
      R.adj.setAttribute("aria-label", t.adjust(L.habit));
      if (!fresh && R.prevDone === false && L.todayDone) celebrate(R.tb, tok);
      R.prevDone = L.todayDone;
    }
  }

  let shownHeadline = null;
  function render(state) {
    latest = state;
    const m = model(state), t = T();
    const shape = [m.first.getTime(), m.rows, weekStartIdx(), locale(), ...m.lanes.map((l) => l.habit)].join(SEP);
    const fresh = !built || built.shape !== shape;
    if (fresh) { built = { shape, ...build(m) }; }
    update(m, fresh);
    if (!fresh) $("wall").classList.remove("enter");

    $("dateLine").textContent = fmt(m.anchor, { weekday: "long", month: "long", day: "numeric" });
    const head = t.head(m.todayDone, m.lanes.length);
    if (head !== shownHeadline) {
      const grew = shownHeadline != null && m.todayDone > (render.lastDone ?? 0);
      $("headline").innerHTML = head;
      if (grew) $("headline").querySelector(".n")?.classList.add("bump");
      shownHeadline = head;
    }
    render.lastDone = m.todayDone;
    const pct = m.wkPossible ? Math.round(m.wkDone / m.wkPossible * 100) : 0;
    $("weekLine").innerHTML = m.lanes.length ? t.weekLine(m.wkDone, m.wkPossible, pct) : esc(t.emptyWeek);
    $("wall").setAttribute("aria-label", t.wall);
    $("askLabel").textContent = m.lanes.length ? t.ask : t.askEmpty;
  }

  function applyCopy() {
    const t = T();
    document.documentElement.lang = t === COPY.zh ? "zh-CN" : "en";
    document.title = t.app;
    $("appName").textContent = t.app;
    $("habitInput").setAttribute("aria-label", t.input);
    $("habitInput").placeholder = t.ph;
    $("addBtn").textContent = t.add;
    $("legend").innerHTML = `<span><i></i>${esc(t.legend[0])}</span><span><i class="p"></i>${esc(t.legend[1])}</span><span><i class="d"></i>${esc(t.legend[2])}</span><span>${esc(t.legend[3])}</span>`;
    $("lQty").textContent = t.qty; $("lTarget").textContent = t.target; $("lNote").textContent = t.note;
    $("noteInput").placeholder = t.notePh; $("lDone").textContent = t.doneDay;
    $("edCancel").textContent = t.cancel; $("edSave").textContent = t.save; $("edClose").setAttribute("aria-label", t.close);
  }

  // ── writes: same shape the AI writes — group = habit, fields {habit,date,done,quantity,target,note}
  const errorStrip = $("errorStrip");
  let errTimer = null;
  function showError(msg) { clearTimeout(errTimer); errorStrip.textContent = msg; errorStrip.hidden = false; errTimer = setTimeout(() => { errorStrip.hidden = true; }, 7000); }
  function clearError() { clearTimeout(errTimer); errorStrip.hidden = true; }

  async function write(habit, key, fields) {
    const tok = habit + SEP + key;
    const real = realGroups(latest.items).get(habit)?.byDate.get(key);
    overlay.set(tok, { fields, acked: false });
    pending.add(tok);
    render(latest);
    let ok = false;
    try {
      const ack = real?.id ? await oma.updateItem(real.id, fields) : await oma.addItem({ group: habit, fields });
      ok = !!ack && ack.ok !== false;
    } catch { ok = false; }
    pending.delete(tok);
    const o = overlay.get(tok);
    if (ok) { if (o) o.acked = true; } else { overlay.delete(tok); showError(T().errSave); }
    render(latest);
    return ok;
  }

  function toggleDay(habit, key) {
    const tok = habit + SEP + key;
    if (pending.has(tok) || key > keyOf(today())) return;
    const L = model(latest).lanes.find((l) => l.habit === habit);
    const f = L?.byDate.get(key)?.fields;
    const target = Math.max(.1, num(f?.target, L?.target || 1) || 1);
    const next = !complete(f);
    return write(habit, key, {
      habit, date: key, done: next,
      quantity: next ? Math.max(target, num(f?.quantity)) : 0,
      target, note: String(f?.note || ""),
    });
  }

  // ── the day editor (quantity · target · note) ─────────────────────────────────────────────
  let editing = null;
  function openEditor(habit, key) {
    const L = model(latest).lanes.find((l) => l.habit === habit);
    const f = L?.byDate.get(key)?.fields;
    editing = { habit, key };
    $("edHabit").textContent = habit;
    $("edDate").textContent = fmt(fromKey(key), { weekday: "long", month: "long", day: "numeric" });
    $("qtyInput").value = String(num(f?.quantity));
    $("targetInput").value = String(Math.max(.1, num(f?.target, L?.target || 1) || 1));
    $("noteInput").value = String(f?.note || "");
    $("doneInput").checked = complete(f);
    $("edSave").textContent = T().save;
    $("editor").hidden = false;
    $("qtyInput").focus();
  }
  function closeEditor() { editing = null; $("editor").hidden = true; }
  $("edClose").onclick = closeEditor;
  $("edCancel").onclick = closeEditor;
  $("editor").onclick = (e) => { if (e.target.id === "editor") closeEditor(); };
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && editing) closeEditor(); });
  $("qtyInput").oninput = () => {
    if (num($("qtyInput").value) >= Math.max(.1, num($("targetInput").value, 1) || 1)) $("doneInput").checked = true;
  };
  $("editorForm").onsubmit = async (e) => {
    e.preventDefault();
    if (!editing) return;
    const { habit, key } = editing;
    const fields = { habit, date: key, done: $("doneInput").checked, quantity: num($("qtyInput").value),
      target: Math.max(.1, num($("targetInput").value, 1) || 1), note: $("noteInput").value.trim() };
    $("edSave").disabled = true; $("edSave").textContent = T().saving;
    closeEditor();
    await write(habit, key, fields);
    $("edSave").disabled = false;
  };

  $("addForm").onsubmit = async (e) => {
    e.preventDefault();
    const input = $("habitInput"), value = input.value.trim();
    if (!value) return;
    const groups = realGroups(latest.items);
    const existing = [...groups.values()].find((g) => g.habit.toLocaleLowerCase() === value.toLocaleLowerCase());
    const habit = existing?.habit || value, key = keyOf(today());
    input.value = "";
    if (!existing?.byDate.has(key)) await write(habit, key, { habit, date: key, done: false, quantity: 0, target: 1, note: "" });
    input.focus();
  };

  // ── the AI hand-off: hand over the week as numbers, ask for a read and one small change ───
  // A degraded result (no chat attached → the runtime copied the text to the clipboard and said
  // so) is NOT a failure; only a rejection or an unsoftened error is.
  const askBtn = $("askBtn");
  askBtn.onclick = async () => {
    const m = model(latest), zh = T() === COPY.zh;
    const lines = m.lanes.map((l) => zh
      ? `- ${l.habit}：本周 ${l.wkDone}/${l.wkPossible}，连续 ${l.cur} 天（最长 ${l.best}），今天${l.todayDone ? "已完成" : "未完成"}`
      : `- ${l.habit}: ${l.wkDone}/${l.wkPossible} this week, ${l.cur}-day streak (best ${l.best}), today ${l.todayDone ? "done" : "not yet"}`).join("\n");
    const text = !m.lanes.length
      ? (zh ? "根据你对我的了解，推荐三个轻量、可持续的每日习惯，每个给一个现实的每日数量目标，并简短说明为什么适合我。"
            : "Based on what you know about me, suggest three small, sustainable daily habits worth tracking. Give each a realistic numeric daily target and say briefly why it fits me.")
      : (zh ? `这是我这周的习惯情况（本周至今 ${m.wkDone}/${m.wkPossible}）：\n${lines}\n请帮我复盘：什么在起作用、什么在滑坡，并提一个下周可以做的小调整。如果某个目标不现实，建议一个新目标。`
            : `Here's my habit week so far (${m.wkDone} of ${m.wkPossible} check-ins):\n${lines}\nWhat's working, what's slipping, and one small change for next week? If a target looks unrealistic, propose a better one.`);
    clearError();
    askBtn.disabled = true;
    try {
      const r = await oma.sendMessage(text);
      if (r && r.isError === true && !r.degraded) showError(T().errAsk);
    } catch (err) {
      showError(String(err?.message || err || T().errAsk));
    } finally {
      askBtn.disabled = false;
    }
  };

  if (oma.standalone) document.body.classList.add("standalone");
  oma.ready((s) => { reconcile(s); applyCopy(); render(s); });
  oma.onChange((s) => { reconcile(s); render(s); });
  oma.onPrefChange(() => { applyCopy(); built = null; render(latest); });
</script>
</body>
</html>
