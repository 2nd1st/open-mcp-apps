<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Keep in touch</title>
<meta name="description" content="A gentle rotation of the people you mean to reach — who is most overdue, when you last spoke, and what to pick up on.">
<meta name="oma-category" content="People">
<style>
  /* Shared primitives (.k-*) — this app's own copy; nothing here comes from the engine. */
  :root{--k-accent:var(--color-text-info,var(--color-ring-primary,#3b6cf6));--k-ok:var(--color-text-success,#2e9e5b);--k-warn:var(--color-text-warning,#b98200);--k-bad:var(--color-text-danger,#e5484d);--k-ink-4:color-mix(in oklab,var(--color-text-primary) 4%,transparent);--k-s2:8px;--k-t-fast:120ms;--k-t:180ms;--k-ease:cubic-bezier(.2,.8,.3,1);--k-spring:cubic-bezier(.34,1.56,.64,1);--k-surface:var(--color-background-primary)}
  @media (prefers-reduced-motion:reduce){:root{--k-t-fast:0ms;--k-t:0ms}}
  .k-btn{display:inline-flex;align-items:center;gap:6px;border:1px solid transparent;border-radius:var(--border-radius-md,10px);padding:6px 12px;font:inherit;font-size:var(--font-text-sm-size,12.5px);font-weight:600;cursor:pointer;background:var(--color-background-inverse);color:var(--color-text-inverse);transition:transform var(--k-t-fast) var(--k-ease),opacity var(--k-t-fast),background var(--k-t-fast)}
  .k-btn:hover{opacity:.9}
  .k-btn:active{transform:scale(.96)}
  .k-btn:disabled{opacity:.45;cursor:default;transform:none}
  .k-btn.sec{background:transparent;color:var(--color-text-primary);border-color:var(--color-border-primary)}
  .k-btn.ghost{background:transparent;color:var(--color-text-secondary)}
  :is(.k-btn.sec,.k-btn.ghost):hover{background:var(--k-ink-4);color:var(--color-text-primary);opacity:1}
  .k-btn.danger{background:transparent;color:var(--k-bad);border-color:color-mix(in oklab,var(--k-bad) 30%,transparent)}
  .k-btn.danger:hover{background:color-mix(in oklab,var(--k-bad) 10%,transparent);opacity:1}
  :is(.k-btn,.k-tab,.k-chip,.k-switch,.k-field):focus-visible{outline:2px solid var(--color-ring-primary,var(--k-accent));outline-offset:1px}
  .k-chip{display:inline-flex;align-items:center;gap:5px;border-radius:var(--border-radius-full,999px);border:1px solid var(--color-border-secondary);background:transparent;color:var(--color-text-secondary);padding:2px 10px;font:inherit;font-size:11.5px;font-weight:550;cursor:pointer;transition:background var(--k-t-fast),color var(--k-t-fast),border-color var(--k-t-fast),transform var(--k-t) var(--k-spring)}
  .k-chip:hover{background:var(--k-ink-4);color:var(--color-text-primary)}
  .k-chip:active{transform:scale(.93)}
  .k-chip.on{background:color-mix(in oklab,var(--k-accent) 10%,transparent);border-color:color-mix(in oklab,var(--k-accent) 28%,transparent);color:var(--k-accent)}
  .k-chip.static{cursor:default}
  .k-chip.static:hover{background:transparent;color:var(--color-text-secondary)}
  .k-chip.static:active{transform:none}
  .k-badge{display:inline-flex;align-items:center;gap:4px;border-radius:var(--border-radius-full,999px);padding:1px 8px;font-size:11px;font-weight:600;background:var(--k-ink-4);color:var(--color-text-secondary)}
  .k-badge.info{background:color-mix(in oklab,var(--k-accent) 10%,transparent);color:var(--k-accent)}
  .k-badge.ok{background:color-mix(in oklab,var(--k-ok) 12%,transparent);color:var(--k-ok)}
  .k-badge.warn{background:color-mix(in oklab,var(--k-warn) 14%,transparent);color:var(--k-warn)}
  .k-badge.bad{background:color-mix(in oklab,var(--k-bad) 12%,transparent);color:var(--k-bad)}
  .k-field{padding:6px 10px;border-radius:var(--border-radius-md,10px);border:1px solid var(--color-border-primary);background:transparent;color:inherit;font:inherit;font-size:var(--font-text-sm-size,12.5px);transition:border-color var(--k-t-fast),box-shadow var(--k-t-fast)}
  .k-field::placeholder{color:var(--color-text-tertiary)}
  .k-field:focus{outline:none;border-color:var(--k-accent);box-shadow:0 0 0 3px color-mix(in oklab,var(--k-accent) 10%,transparent)}
  .k-empty{display:grid;place-items:center;gap:var(--k-s2);text-align:center;padding:36px 16px;color:var(--color-text-tertiary)}
  .k-empty>svg{width:64px;height:64px;stroke-width:1.5}
  .k-empty b{color:var(--color-text-secondary);font-weight:600}
  .k-appbar{display:flex;align-items:center;gap:11px;padding:13px 16px}
  .k-appbar .k-appmark{display:grid;width:34px;height:34px;flex:none;place-items:center;border-radius:11px}
  .k-appbar .k-appmark svg{width:18px;height:18px}
  .k-appbar .k-appcopy{min-width:0;flex:1}
  .k-appbar .k-eyebrow{display:block;margin:0;color:var(--color-text-tertiary);font-size:9.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
  .k-appbar h1{margin:1px 0 0;font-size:15px;font-weight:650;letter-spacing:-.015em}
  body:not(.standalone) .k-appbar{border-bottom:1px solid var(--color-border-secondary);background:var(--k-surface)}
  .k-stage{max-width:1120px;margin-inline:auto;overflow-x:clip}

  /* The signature is ONE PERSON: whoever has gone longest past their rhythm, with a ring that
     fills as the gap since you last spoke grows toward (and past) the rhythm you set. Coral — the
     app's one accent — marks that ring, the overdue people and the one action that resets them.
     Everything else is host tokens. */
  .app {
    --kt-accent: light-dark(#c2454d, #ff9aa0);
    --kt-on-accent: light-dark(#ffffff, #2e0a0d);
    --kt-tint: color-mix(in oklab, var(--kt-accent) 10%, transparent);
    --k-accent: var(--kt-accent);
    position: relative;
  }
  button, input, select { font: inherit; color: inherit; }

  /* ── app bar ── */
  .topbar { min-height: 64px; }
  .brand-mark { background: var(--kt-tint); color: var(--kt-accent); }
  .brand-mark svg, .top-actions svg, .spot-actions svg, .icon-btn svg {
    fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;
  }
  #summary { margin-top: 2px; color: var(--color-text-secondary); font-size: var(--font-text-sm-size, 12px); font-variant-numeric: tabular-nums; }
  #summary b { color: var(--kt-accent); font-weight: 700; }
  .top-actions { display: flex; align-items: center; gap: 8px; margin-left: auto; }
  .top-actions .k-btn { min-height: 36px; padding-inline: 12px; font-size: 13px; }
  .top-actions svg { width: 16px; height: 16px; flex: none; }
  .app .k-btn.primary { background: var(--kt-accent); color: var(--kt-on-accent); }

  /* ── add form ── */
  .add-panel {
    margin: 12px 16px 0;
    padding: 13px;
    border: 1px solid var(--color-border-secondary);
    border-radius: var(--border-radius-lg, 14px);
    background: var(--color-background-secondary);
  }
  .add-form { display: grid; grid-template-columns: 1.15fr .9fr .8fr .8fr; gap: 9px; }
  .field { display: grid; gap: 5px; min-width: 0; }
  .field label { color: var(--color-text-secondary); font-size: 12px; font-weight: 600; }
  .field .k-field { width: 100%; min-width: 0; height: 36px; background: var(--color-background-primary); }
  .field-context { grid-column: span 2; }
  .form-actions { display: flex; align-items: end; justify-content: flex-end; gap: 7px; grid-column: span 2; }
  .form-actions .k-btn { height: 36px; }

  /* ── spotlight: the person to reach ── */
  .spotlight {
    display: grid;
    grid-template-columns: auto minmax(0, 1fr) auto;
    align-items: center;
    gap: 20px;
    margin: 14px 16px;
    padding: 18px;
    border: 1px solid color-mix(in oklab, var(--tone) 32%, var(--color-border-secondary));
    border-radius: var(--border-radius-lg, 14px);
    background: color-mix(in oklab, var(--tone) 5%, var(--color-background-primary));
    --tone: var(--kt-accent);
  }
  .spotlight.calm { --tone: var(--color-text-secondary); }
  .orbit { position: relative; width: 112px; height: 112px; flex: none; }
  .orbit svg { display: block; width: 100%; height: 100%; transform: rotate(-90deg); }
  .orbit circle { fill: none; stroke-width: 7; }
  .orbit .track { stroke: var(--color-border-secondary); }
  .orbit .fill { stroke: var(--tone); stroke-linecap: round; stroke-dasharray: 251.33; }
  .orbit .over { stroke: color-mix(in oklab, var(--tone) 35%, transparent); stroke-width: 3; stroke-linecap: round; stroke-dasharray: 238.76; }
  .orbit-center { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
  .orbit-num { color: var(--tone); font-size: 34px; font-weight: 780; line-height: 1; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
  .orbit-label { margin-top: 3px; color: var(--color-text-tertiary); font-size: 11px; line-height: 1.2; }
  .spot-copy { min-width: 0; }
  .spot-label { color: var(--tone); font-size: 12px; font-weight: 700; }
  .spot-name { margin: 4px 0 4px; font-size: 26px; font-weight: 750; line-height: 1.1; letter-spacing: -.02em; overflow-wrap: anywhere; }
  .spot-status { color: var(--color-text-secondary); font-size: 13px; font-variant-numeric: tabular-nums; }
  .spot-context { max-width: 36em; margin: 10px 0 0; line-height: 1.45; overflow-wrap: anywhere; }
  .spot-context::before { content: "“"; color: var(--tone); font-weight: 700; }
  .spot-context::after { content: "”"; color: var(--tone); font-weight: 700; }
  .spot-actions { display: grid; gap: 8px; width: 164px; }
  .spot-actions .k-btn { justify-content: center; min-height: 40px; font-size: 13px; }
  .spot-actions svg { width: 15px; height: 15px; }

  /* ── queue ── */
  .queue-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; padding: 4px 16px 10px; }
  .queue-title { font-size: 13px; font-weight: 700; }
  .queue-note { color: var(--color-text-tertiary); font-size: 12px; }
  .filters { display: flex; flex-wrap: wrap; gap: 6px; margin-left: auto; }
  .app .k-chip.on { background: var(--kt-tint); border-color: color-mix(in oklab, var(--kt-accent) 35%, transparent); color: var(--kt-accent); }
  /* Everyone else scrolls inside the card, so the person to reach stays on the first screen. */
  .queue { display: grid; gap: 8px; max-height: 560px; overflow-y: auto; overscroll-behavior: contain; padding: 0 16px 16px; }
  .person-card {
    display: grid;
    grid-template-columns: 42px minmax(0, 1fr) auto auto;
    align-items: center;
    gap: 12px;
    padding: 11px 12px;
    border: 1px solid var(--color-border-secondary);
    border-radius: var(--border-radius-lg, 14px);
    background: var(--color-background-primary);
  }
  .person-card.overdue { border-left: 3px solid var(--kt-accent); padding-left: 10px; }
  .person-card.pending { opacity: .7; }
  .avatar {
    display: grid;
    width: 40px;
    height: 40px;
    place-content: center;
    border-radius: var(--border-radius-full, 999px);
    background: var(--color-background-secondary);
    color: var(--color-text-secondary);
    font-size: 13px;
    font-weight: 750;
  }
  .person-card.overdue .avatar { background: var(--kt-tint); color: var(--kt-accent); }
  .person-copy { min-width: 0; }
  .person-line { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; }
  .person-name { font-weight: 700; overflow-wrap: anywhere; }
  .meta { margin-top: 2px; color: var(--color-text-tertiary); font-size: 12px; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
  .context { margin-top: 4px; color: var(--color-text-secondary); font-size: 12.5px; line-height: 1.4; overflow-wrap: anywhere; }
  .when { text-align: right; font-variant-numeric: tabular-nums; }
  .when-main { color: var(--color-text-secondary); font-size: 13px; font-weight: 700; white-space: nowrap; }
  .person-card.overdue .when-main { color: var(--kt-accent); }
  .person-card.soon .when-main { color: var(--color-text-primary); }
  .when-sub { margin-top: 2px; color: var(--color-text-tertiary); font-size: 11.5px; white-space: nowrap; }
  .card-actions { display: flex; align-items: center; gap: 2px; }
  .mark-contacted { min-height: 32px; font-size: 12px; }
  .mark-contacted svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .icon-btn {
    display: grid;
    place-items: center;
    width: 30px;
    height: 30px;
    padding: 0;
    border: 0;
    border-radius: var(--border-radius-md, 8px);
    background: transparent;
    color: var(--color-text-tertiary);
    cursor: pointer;
    opacity: .6;
  }
  .icon-btn svg { width: 15px; height: 15px; }
  .person-card:hover .icon-btn, .icon-btn:focus-visible { opacity: 1; }
  .empty { padding: 30px 16px; }
  .empty svg { width: 60px; height: 60px; fill: none; stroke: var(--kt-accent); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  .empty span { max-width: 32em; }

  .toast {
    position: absolute;
    left: 50%;
    bottom: 14px;
    z-index: 5;
    padding: 8px 12px;
    border: 1px solid var(--color-border-primary);
    border-radius: var(--border-radius-full, 999px);
    background: var(--color-background-primary);
    box-shadow: var(--shadow-md, var(--shadow-sm));
    font-size: 12.5px;
    font-weight: 650;
    pointer-events: none;
    transform: translateX(-50%);
    white-space: nowrap;
  }
  .toast.error { border-color: color-mix(in oklab, var(--color-text-danger) 40%, transparent); color: var(--color-text-danger); }

  @media (prefers-reduced-motion: no-preference) {
    .orbit .fill, .orbit .over { transition: stroke-dashoffset 700ms var(--k-ease); }
    .person-card { transition: opacity var(--k-t-fast), border-color var(--k-t); }
    .person-card.just-contacted { animation: reset-glow 900ms var(--k-ease); }
    .person-card.just-contacted .avatar { animation: avatar-pop 520ms var(--k-spring); }
    .toast { animation: toast-in 260ms var(--k-spring); }
    .add-panel:not([hidden]) { animation: reveal 200ms var(--k-ease) both; transform-origin: top; }
    @keyframes reset-glow { 0% { box-shadow: 0 0 0 3px color-mix(in oklab, var(--kt-accent) 30%, transparent); } 100% { box-shadow: 0 0 0 0 transparent; } }
    @keyframes avatar-pop { 0% { transform: scale(.7); } 100% { transform: none; } }
    @keyframes toast-in { from { opacity: 0; transform: translate(-50%, 8px) scale(.96); } }
    @keyframes reveal { from { opacity: 0; transform: scaleY(.94); } to { opacity: 1; transform: none; } }
  }
  @media (max-width: 640px) {
    .topbar { padding: 11px 12px; }
    .top-actions .k-btn span { display: none; }
    .top-actions .k-btn { width: 36px; padding: 0; justify-content: center; }
    .add-panel { margin-inline: 10px; }
    .add-form { grid-template-columns: 1fr 1fr; }
    .field-context, .form-actions { grid-column: 1 / -1; }
    .spotlight { grid-template-columns: 84px minmax(0, 1fr); gap: 14px; margin: 10px; padding: 14px; }
    .orbit { width: 84px; height: 84px; }
    .orbit-num { font-size: 25px; }
    .orbit-label { max-width: 4.2em; margin-inline: auto; font-size: 10px; }
    .spot-name { font-size: 21px; }
    .spot-actions { grid-column: 1 / -1; grid-template-columns: 1fr 1fr; width: auto; }
    .queue-head { padding-inline: 12px; }
    .filters { margin-left: 0; width: 100%; }
    .queue { padding: 0 10px 12px; }
    .person-card { grid-template-columns: 36px minmax(0, 1fr) auto; gap: 9px; padding: 10px; }
    .person-card.overdue { padding-left: 8px; }
    .avatar { width: 36px; height: 36px; font-size: 12px; }
    .when { grid-column: 2; grid-row: 2; text-align: left; }
    .when-main, .when-sub { display: inline; }
    .when-sub::before { content: " · "; }
    .card-actions { grid-column: 3; grid-row: 1 / span 2; flex-direction: column; }
    .mark-contacted { width: 34px; height: 34px; padding: 0; justify-content: center; }
    .mark-contacted span { display: none; }
  }
</style>
</head>
<body>
<div class="app k-stage">
  <header class="topbar k-appbar">
    <div class="brand-mark k-appmark" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="M4 6.5A2.5 2.5 0 0 1 6.5 4h6A2.5 2.5 0 0 1 15 6.5v2A2.5 2.5 0 0 1 12.5 11H9l-3.5 2.5V11A2.5 2.5 0 0 1 4 8.5Z"/><path d="M11 14h3.5l3.5 2.5V14a2.5 2.5 0 0 0 2-2.5v-2A2.5 2.5 0 0 0 17.5 7"/></svg>
    </div>
    <div class="k-appcopy">
      <h1 id="appTitle">Keep in touch</h1>
      <div id="summary"></div>
    </div>
    <div class="top-actions">
      <button class="k-btn sec" id="rhythmButton" type="button">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3.5 4.5h9a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2H8L4.5 15v-2.8a2 2 0 0 1-1-1.7Z"/><path d="m15.5 2 .5 1.5 1.5.5-1.5.5-.5 1.5-.5-1.5-1.5-.5 1.5-.5Z"/></svg>
        <span id="rhythmLabel">Plan outreach</span>
      </button>
      <button class="k-btn primary" id="addToggle" type="button" aria-expanded="false" aria-controls="addPanel">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 4v12M4 10h12"/></svg>
        <span id="addLabel">Add person</span>
      </button>
    </div>
  </header>

  <section class="add-panel" id="addPanel" hidden>
    <form class="add-form" id="addForm">
      <div class="field"><label for="person" id="lPerson">Person</label><input class="k-field" id="person" autocomplete="off" required></div>
      <div class="field"><label for="relationship" id="lRelationship">Relationship</label><input class="k-field" id="relationship" list="relationshipList" autocomplete="off" required></div>
      <div class="field"><label for="channel" id="lChannel">Best channel</label><input class="k-field" id="channel" list="channelList" autocomplete="off" required></div>
      <div class="field"><label for="priority" id="lPriority">Priority</label><select class="k-field" id="priority"><option value="high">High</option><option value="medium" selected>Medium</option><option value="low">Low</option></select></div>
      <div class="field"><label for="lastContact" id="lLast">Last contact</label><input class="k-field" id="lastContact" type="date" required></div>
      <div class="field"><label for="nextContact" id="lNext">Next contact</label><input class="k-field" id="nextContact" type="date" required></div>
      <div class="field field-context"><label for="context" id="lContext">What to pick up on</label><input class="k-field" id="context" autocomplete="off" required></div>
      <div class="form-actions"><button class="k-btn ghost" id="cancelAdd" type="button">Cancel</button><button class="k-btn primary" id="saveAdd" type="submit">Add to queue</button></div>
    </form>
    <datalist id="channelList"></datalist>
    <datalist id="relationshipList"></datalist>
  </section>

  <section class="spotlight" id="spotlight" aria-live="polite">
    <div class="orbit" id="orbit">
      <svg viewBox="0 0 100 100" aria-hidden="true">
        <circle class="track" cx="50" cy="50" r="40"/>
        <circle class="fill" id="orbitFill" cx="50" cy="50" r="40" style="stroke-dashoffset:251.33"/>
        <circle class="over" id="orbitOver" cx="50" cy="50" r="38" style="stroke-dashoffset:238.76"/>
      </svg>
      <div class="orbit-center"><span class="orbit-num" id="orbitNum"></span><span class="orbit-label" id="orbitLabel"></span></div>
    </div>
    <div class="spot-copy">
      <div class="spot-label" id="spotLabel"></div>
      <h2 class="spot-name" id="spotName"></h2>
      <div class="spot-status" id="spotStatus"></div>
      <p class="spot-context" id="spotContext"></p>
    </div>
    <div class="spot-actions" id="spotActions">
      <button class="k-btn sec" id="draftButton" type="button">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 15.5V17l1.5-1.5H14a2 2 0 0 0 2-2v-7a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v9ZM7 8h6M7 11h4"/></svg>
        <span id="draftLabel">Draft a hello</span>
      </button>
      <button class="k-btn primary" id="spotContacted" type="button">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="m5 10 3 3 7-7"/></svg>
        <span id="spotContactedLabel">Contacted today</span>
      </button>
    </div>
  </section>

  <section class="queue-section" id="queueSection">
    <div class="queue-head">
      <span class="queue-title" id="queueTitle">Everyone</span>
      <span class="queue-note" id="queueNote"></span>
      <nav class="filters" id="filters"></nav>
    </div>
    <div class="queue" id="queue"></div>
  </section>
  <div class="toast" id="toast" role="status" hidden></div>
</div>

<script type="module">
  const DAY = 86400000;
  const priorityWeight = { high: 1.15, medium: 1, low: .88 };
  const priorityRank = { high: 3, medium: 2, low: 1 };

  const STR = {
    en: {
      title: "Keep in touch",
      summary: (o, s, n) => (n ? `<b>${o} overdue</b> · ${s} due this week · ${n} people` : "A gentle queue for the people who matter"),
      plan: "Plan outreach",
      add: "Add person",
      close: "Close",
      person: "Person", relationship: "Relationship", channel: "Best channel", priority: "Priority",
      last: "Last contact", next: "Next contact", context: "What to pick up on",
      cancel: "Cancel", save: "Add to queue",
      prio: { high: "High", medium: "Medium", low: "Low" },
      ph: { person: "Sam Rivera", relationship: "Friend", channel: "Text", context: "Ask how the new role is going" },
      mostOverdue: "Longest past their rhythm",
      nextUp: "Next on your rhythm",
      daysSince: (n) => (n === 1 ? "day since" : "days since"),
      statusLine: (s, c, ch) => `${s} · every ${c} days · ${ch}`,
      overdue: (n) => (n === 1 ? "1 day overdue" : `${n} days overdue`),
      today: "Due today",
      tomorrow: "Due tomorrow",

      planPrompt: (list) => `Help me plan a thoughtful, low-pressure outreach session from my keep-in-touch queue: ${list}. Prioritise two or three people, suggest a natural order, and give me a brief opening idea for each.`,
      setupPrompt: "Help me set up a sustainable keep-in-touch rhythm. Suggest a few relationship groups, realistic cadences, and who to add first."
    },
    zh: {
      title: "保持联系",
      summary: (o, s, n) => (n ? `<b>${o} 人超期</b> · 本周到期 ${s} 人 · 共 ${n} 人` : "把重要的人放在心上"),
      plan: "规划联系",
      add: "添加联系人",
      close: "收起",
      person: "联系人", relationship: "关系", channel: "常用方式", priority: "优先级",
      last: "上次联系", next: "下次联系", context: "下次聊什么",
      cancel: "取消", save: "加入队列",
      prio: { high: "高", medium: "中", low: "低" },
      ph: { person: "李想", relationship: "朋友", channel: "微信", context: "问问新工作怎么样" },
      mostOverdue: "最久没联系的人",
      nextUp: "下一位该联系的人",
      daysSince: () => "天没联系",
      statusLine: (s, c, ch) => `${s} · 每 ${c} 天一次 · ${ch}`,
      overdue: (n) => `超期 ${n} 天`,
      today: "今天该联系",
      tomorrow: "明天该联系",
      dueIn: (n) => `${n} 天后`,
      nextOn: (d) => `下次 ${d}`,
      lastOn: (n) => (n === 0 ? "今天聊过" : `${n} 天前聊过`),
      every: (n) => `每 ${n} 天`,
      draft: "起草问候",
      contactedToday: "今天联系了",
      contacted: "联系了",
      markAria: (p) => `标记今天联系了 ${p}`,
      removeAria: (p) => `移除 ${p}`,
      everyone: "所有人",
      byRhythm: "超期最久的在前",
      all: "全部",
      emptyTitle: "你想更常联系谁？",
      emptyHint: "添加一个人和想多久联系一次——或者对 AI 说：“提醒我每周给外婆打个电话。”",
      emptyFilter: "这一组还没有人。",
      quietLabel: "联系圈很安静",
      quietName: "添加一个重要的人",
      quietContext: "设好联系节奏，这里会提醒你谁需要一点关心。",
      anyChannel: "任意方式",
      unnamed: "未命名",
      toastBack: (p) => `和 ${p} 的节奏接上了`,
      toastAdded: (p) => `${p} 加进来了`,
      failed: "没有保存成功，请重试。",
      deleteFailed: "还在这里——移除没有成功。",
      askFailed: "没能联系上助手，请重试。",
      nextAfterLast: "下次联系要晚于上次联系。",
      draftPrompt: (p, rel, ch, last, status, ctx) => `帮我给 ${p}（${rel}）写一条走心的问候，准备用${ch}发。我们上次联系是 ${last}，现在${status}。自然地接上这件事：「${ctx}」。真诚、不要为间隔太久而道歉，让对方容易回复。`,
      planPrompt: (list) => `帮我根据保持联系的队列安排一次轻松的联系：${list}。挑两三个人，排个自然的顺序，每人给一句开场白。`,
      setupPrompt: "帮我建立一个可持续的保持联系节奏：建议几个关系分组、合理的联系频率，以及先加哪些人。"
    }
  };

  const $ = (id) => document.getElementById(id);
  let latestState = { items: [] };
  let activeGroup = "All";
  let panelOpen = false;
  let toastTimer = 0;
  let justContacted = "";
  let spotId = null;
  // Optimistic state: local field overrides (a contact just marked), rows being removed, rows
  // being added. Each is dropped once the stored data catches up, or reverted if the ack refuses.
  const overrides = new Map();
  const removing = new Set();
  let pending = [];
  const cards = new Map();

  function locale() {
    const selected = oma.pref("locale", "auto");
    const resolved = selected === "auto" ? navigator.language : selected;
    try { new Intl.DateTimeFormat(resolved); return resolved; } catch { return "en"; }
  }
  const lang = () => (String(locale()).toLowerCase().startsWith("zh") ? "zh" : "en");
  const T = () => STR[lang()];

  const todaySerial = () => {
    const now = new Date();
    return Date.UTC(now.getFullYear(), now.getMonth(), now.getDate());
  };
  const isoFromSerial = (serial) => new Date(serial).toISOString().slice(0, 10);
  const shiftToday = (days) => isoFromSerial(todaySerial() + days * DAY);
  const serialFromISO = (value) => {
    const parts = String(value || "").split("-").map(Number);
    return parts.length === 3 && parts.every(Number.isFinite) ? Date.UTC(parts[0], parts[1] - 1, parts[2]) : todaySerial();
  };
  const daysBetween = (from, to) => Math.round((to - from) / DAY);
  const initials = (name) => {
    const text = String(name || "?").trim();
    if (/[㐀-鿿]/.test(text)) return text.replace(/\s+/g, "").slice(-2);
    return text.split(/\s+/).slice(0, 2).map((part) => part[0] || "").join("").toUpperCase();
  };
  // Relationship IS the group (mirrored in fields.relationship) — user data, never translated.
  const relationshipOf = (item) => String(item.group || item.fields.relationship || "").trim() || "—";
  const priorityOf = (item) => (["high", "medium", "low"].includes(String(item.fields.priority).toLowerCase()) ? String(item.fields.priority).toLowerCase() : "medium");
  const nameOf = (item) => String(item.fields.person || T().unnamed);

  function formatDate(value) {
    const mode = oma.pref("date_format", "auto");
    if (mode === "yyyy-mm-dd") return String(value || "");
    const parts = String(value || "").split("-").map(Number);
    if (parts.length !== 3 || !parts.every(Number.isFinite)) return "—";
    const pad = (n) => String(n).padStart(2, "0");
    if (mode === "dd/mm/yyyy") return `${pad(parts[2])}/${pad(parts[1])}/${parts[0]}`;
    if (mode === "mm/dd/yyyy") return `${pad(parts[1])}/${pad(parts[2])}/${parts[0]}`;
    return new Intl.DateTimeFormat(locale(), { month: "short", day: "numeric", year: parts[0] === new Date().getFullYear() ? undefined : "numeric" })
      .format(new Date(parts[0], parts[1] - 1, parts[2]));
  }

  // Everything below is computed from last_contact + next_contact and today's clock — nothing
  // judged is stored. The cadence is the gap between the two dates the person set.
  function measure(item) {
    const last = serialFromISO(item.fields.last_contact);
    const next = serialFromISO(item.fields.next_contact);
    const now = todaySerial();
    const cadenceDays = Math.max(1, Math.abs(daysBetween(last, next)));
    const daysSince = Math.max(0, daysBetween(last, now));
    const daysOverdue = daysBetween(next, now);
    const cadenceRatio = daysSince / cadenceDays;
    const priority = priorityOf(item);
    const overdueScore = Math.round(Math.max(0, cadenceRatio * 100 - 100) * priorityWeight[priority]);
    return { last, next, cadenceDays, daysSince, daysOverdue, cadenceRatio, priority, overdueScore };
  }
  const stateOf = (m) => (m.daysOverdue > 0 ? "overdue" : m.daysOverdue >= -7 ? "soon" : "steady");

  function statusText(m) {
    const t = T();
    if (m.daysOverdue > 0) return t.overdue(m.daysOverdue);
    if (m.daysOverdue === 0) return t.today;
    if (m.daysOverdue === -1) return t.tomorrow;
    return t.dueIn(-m.daysOverdue);
  }

  function viewItems(state) {
    const stored = state.items || [];
    const ids = new Set(stored.map((item) => item.id));
    for (const id of [...removing]) if (!ids.has(id)) removing.delete(id);
    pending = pending.filter((p) => !(p.id && ids.has(p.id)));
    const out = [];
    for (const item of stored) {
      if (removing.has(item.id)) continue;
      const o = overrides.get(item.id);
      if (o && item.fields.last_contact === o.last_contact && item.fields.next_contact === o.next_contact) overrides.delete(item.id);
      out.push(o && overrides.has(item.id) ? { ...item, fields: { ...item.fields, ...o } } : item);
    }
    return [...out, ...pending.map((p) => ({ ...p, pending: true }))];
  }

  function sortedItems(items) {
    return items.map((item) => ({ item, metric: measure(item) })).sort((a, b) =>
      b.metric.overdueScore - a.metric.overdueScore ||
      b.metric.daysOverdue - a.metric.daysOverdue ||
      priorityRank[b.metric.priority] - priorityRank[a.metric.priority] ||
      a.metric.next - b.metric.next ||
      nameOf(a.item).localeCompare(nameOf(b.item))
    );
  }

  const keyOf = (item) => item.id || item.tempId;

  function el(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }
  function svg(markup, box = "0 0 20 20") {
    const holder = document.createElement("span");
    holder.innerHTML = `<svg viewBox="${box}" aria-hidden="true">${markup}</svg>`;
    return holder.firstChild;
  }

  function toast(text, error = false) {
    const node = $("toast");
    clearTimeout(toastTimer);
    node.textContent = text;
    node.classList.toggle("error", error);
    node.hidden = false;
    toastTimer = setTimeout(() => { node.hidden = true; }, error ? 6000 : 2600);
  }

  async function propose(button, text) {
    button.disabled = true;
    try {
      const result = await oma.sendMessage(text);
      if (result && result.isError === true && !result.degraded) toast(T().askFailed, true);
    } catch (error) {
      toast(String(error?.message || error || T().askFailed), true);
    } finally {
      button.disabled = false;
    }
  }

  async function markContacted(item) {
    if (item.pending) return;
    const metric = measure(item);
    const fields = { last_contact: shiftToday(0), next_contact: shiftToday(metric.cadenceDays) };
    overrides.set(item.id, fields);
    justContacted = item.id;
    toast(T().toastBack(nameOf(item)));
    render(latestState);
    let ack = null;
    try {
      ack = await oma.updateItem(item.id, fields);
    } catch (error) {
      ack = { ok: false };
    }
    if (!ack || ack.ok === false) {
      overrides.delete(item.id);
      render(latestState);
      toast(T().failed, true);
    }
  }

  async function removePerson(item) {
    removing.add(item.id);
    render(latestState);
    let ack = null;
    try {
      ack = await oma.deleteItem(item.id);
    } catch (error) {
      ack = { ok: false };
    }
    if (!ack || ack.ok === false) {
      removing.delete(item.id);
      render(latestState);
      if (!/cancel/i.test(String(ack?.reason || ""))) toast(T().deleteFailed, true);
    }
  }

  function renderSpotlight(entry) {
    const t = T();
    const spot = $("spotlight");
    const fill = $("orbitFill");
    const over = $("orbitOver");
    if (!entry) {
      spot.classList.add("calm");
      fill.style.strokeDashoffset = "251.33";
      over.style.strokeDashoffset = "238.76";
      $("orbitNum").textContent = "";
      $("orbitLabel").textContent = "";
      $("spotLabel").textContent = t.quietLabel;
      $("spotName").textContent = t.quietName;
      $("spotStatus").textContent = "";
      $("spotContext").hidden = true;
      $("draftButton").hidden = true;
      $("spotContacted").hidden = true;
      spotId = null;
      return;
    }
    const { item, metric } = entry;
    spot.classList.toggle("calm", metric.daysOverdue <= 0);
    // First lap = the rhythm the person set; the thin inner lap = how far past it you are.
    fill.style.strokeDashoffset = String(251.33 * (1 - Math.min(1, metric.cadenceRatio)));
    over.style.strokeDashoffset = String(238.76 * (1 - Math.min(1, Math.max(0, metric.cadenceRatio - 1))));
    $("orbitNum").textContent = String(metric.daysSince);
    $("orbitLabel").textContent = t.daysSince(metric.daysSince);
    $("spotLabel").textContent = metric.daysOverdue > 0 ? `${t.mostOverdue} · ${relationshipOf(item)}` : `${t.nextUp} · ${relationshipOf(item)}`;
    $("spotName").textContent = nameOf(item);
    $("spotStatus").textContent = t.statusLine(statusText(metric), metric.cadenceDays, String(item.fields.channel || t.anyChannel));
    $("spotContext").hidden = !item.fields.context;
    $("spotContext").textContent = String(item.fields.context || "");
    const draft = $("draftButton");
    draft.hidden = false;
    draft.onclick = () => propose(draft, t.draftPrompt(nameOf(item), relationshipOf(item), String(item.fields.channel || t.anyChannel), formatDate(item.fields.last_contact), statusText(metric), String(item.fields.context || "")));
    const contacted = $("spotContacted");
    contacted.hidden = false;
    contacted.setAttribute("aria-label", t.markAria(nameOf(item)));
    contacted.onclick = () => markContacted(item);
    spotId = item.id;
  }

  function renderFilters(items) {
    const t = T();
    const groups = [...new Set(items.map(relationshipOf))].sort((a, b) => a.localeCompare(b));
    if (activeGroup !== "All" && !groups.includes(activeGroup)) activeGroup = "All";
    const host = $("filters");
    host.replaceChildren();
    if (groups.length < 2) return;
    for (const group of ["All", ...groups]) {
      const button = el("button", `k-chip${activeGroup === group ? " on" : ""}`, group === "All" ? t.all : group);
      button.type = "button";
      button.setAttribute("aria-pressed", String(activeGroup === group));
      button.onclick = () => { activeGroup = group; render(latestState); };
      host.append(button);
    }
  }

  function fillCard(card, entry) {
    const t = T();
    const { item, metric } = entry;
    const state = stateOf(metric);
    card.className = `person-card ${state}${item.pending ? " pending" : ""}${keyOf(item) === justContacted ? " just-contacted" : ""}`;
    const copy = el("div", "person-copy");
    const line = el("div", "person-line");
    line.append(el("span", "person-name", nameOf(item)));
    if (metric.priority === "high") line.append(el("span", "k-badge", t.prio.high));
    const meta = el("div", "meta", `${relationshipOf(item)} · ${String(item.fields.channel || t.anyChannel)} · ${t.every(metric.cadenceDays)}`);
    copy.append(line, meta);
    if (item.fields.context) copy.append(el("div", "context", String(item.fields.context)));

    const when = el("div", "when");
    when.append(el("div", "when-main", statusText(metric)), el("div", "when-sub", t.lastOn(metric.daysSince)));

    const actions = el("div", "card-actions");
    const contacted = el("button", "k-btn sec mark-contacted");
    contacted.type = "button";
    contacted.append(svg('<path d="m5 10 3 3 7-7"/>'), el("span", "", t.contacted));
    contacted.setAttribute("aria-label", t.markAria(nameOf(item)));
    contacted.title = contacted.getAttribute("aria-label");
    contacted.disabled = !!item.pending;
    contacted.onclick = () => markContacted(item);
    const remove = el("button", "icon-btn");
    remove.type = "button";
    remove.append(svg('<path d="M6 6h8M8 6V4h4v2m-5 2 .5 7h5l.5-7"/>'));
    remove.setAttribute("aria-label", t.removeAria(nameOf(item)));
    remove.title = remove.getAttribute("aria-label");
    remove.disabled = !!item.pending;
    remove.onclick = () => removePerson(item);
    actions.append(contacted, remove);
    card.replaceChildren(el("div", "avatar", initials(item.fields.person)), copy, when, actions);
  }

  function renderQueue(entries) {
    const t = T();
    const filtered = activeGroup === "All" ? entries : entries.filter(({ item }) => relationshipOf(item) === activeGroup);
    const queue = $("queue");
    $("queueTitle").textContent = activeGroup === "All" ? t.everyone : activeGroup;
    $("queueNote").textContent = t.byRhythm;
    if (!filtered.length) {
      cards.clear();
      const empty = el("div", "k-empty empty");
      if (!entries.length) {
        empty.append(svg('<circle cx="9" cy="8" r="3.2"/><path d="M3.5 19c.6-3.2 2.8-5 5.5-5s4.9 1.8 5.5 5"/><circle cx="17" cy="9" r="2.4"/><path d="M15.5 14.2c2.4-.3 4.4 1.1 5 4.3"/>', "0 0 24 24"));
        empty.append(el("b", "", t.emptyTitle), el("span", "", t.emptyHint));
      } else {
        empty.append(el("b", "", t.emptyFilter));
      }
      queue.replaceChildren(empty);
      return;
    }
    // FLIP: remember where every card was, re-order, then let each one travel from there. When
    // you mark someone contacted, their card visibly sinks back to its place in the rhythm.
    const before = new Map();
    for (const [key, card] of cards) if (card.isConnected) before.set(key, card.getBoundingClientRect().top);
    const seen = new Set();
    const ordered = filtered.map((entry) => {
      const key = keyOf(entry.item);
      seen.add(key);
      let card = cards.get(key);
      if (!card) { card = el("article", "person-card"); cards.set(key, card); }
      fillCard(card, entry);
      return card;
    });
    for (const key of [...cards.keys()]) if (!seen.has(key)) cards.delete(key);
    queue.replaceChildren(...ordered);
    if (!matchMedia("(prefers-reduced-motion: no-preference)").matches) return;
    for (const [key, card] of cards) {
      if (!before.has(key)) continue;
      const delta = before.get(key) - card.getBoundingClientRect().top;
      if (Math.abs(delta) < 2) continue;
      card.animate([{ transform: `translateY(${delta}px)` }, { transform: "none" }], { duration: key === justContacted ? 650 : 420, easing: "cubic-bezier(.2,.8,.3,1)" });
    }
  }

  function applyStaticText() {
    const t = T();
    document.documentElement.lang = lang() === "zh" ? "zh-CN" : "en";
    document.title = t.title;
    $("appTitle").textContent = t.title;
    $("rhythmLabel").textContent = t.plan;
    $("rhythmButton").title = t.plan;
    $("addLabel").textContent = panelOpen ? t.close : t.add;
    $("addToggle").title = panelOpen ? t.close : t.add;
    $("lPerson").textContent = t.person;
    $("lRelationship").textContent = t.relationship;
    $("lChannel").textContent = t.channel;
    $("lPriority").textContent = t.priority;
    $("lLast").textContent = t.last;
    $("lNext").textContent = t.next;
    $("lContext").textContent = t.context;
    $("cancelAdd").textContent = t.cancel;
    $("saveAdd").textContent = t.save;
    for (const option of $("priority").options) option.textContent = t.prio[option.value];
    for (const [id, key] of [["person", "person"], ["relationship", "relationship"], ["channel", "channel"], ["context", "context"]]) $(id).placeholder = t.ph[key];
    $("draftLabel").textContent = t.draft;
    $("spotContactedLabel").textContent = t.contactedToday;
    const items = latestState.items || [];
    const uniq = (list) => [...new Set(list.filter(Boolean))];
    $("channelList").replaceChildren(...uniq(items.map((i) => String(i.fields.channel || ""))).map((v) => Object.assign(document.createElement("option"), { value: v })));
    $("relationshipList").replaceChildren(...uniq(items.map(relationshipOf)).filter((v) => v !== "—").map((v) => Object.assign(document.createElement("option"), { value: v })));
  }

  function render(state) {
    latestState = state;
    const t = T();
    const entries = sortedItems(viewItems(state));
    const overdue = entries.filter(({ metric }) => metric.daysOverdue > 0).length;
    const dueSoon = entries.filter(({ metric }) => metric.daysOverdue <= 0 && metric.daysOverdue >= -7).length;
    $("summary").innerHTML = t.summary(overdue, dueSoon, entries.length);
    renderSpotlight(entries.find(({ item }) => !item.pending));
    renderFilters(entries.map(({ item }) => item));
    $("queueSection").querySelector(".queue-head").hidden = !entries.length;
    renderQueue(entries);
    justContacted = "";
  }

  function setPanel(open) {
    panelOpen = open;
    $("addPanel").hidden = !open;
    $("addToggle").setAttribute("aria-expanded", String(open));
    applyStaticText();
    if (open) {
      $("lastContact").value ||= shiftToday(0);
      $("nextContact").value ||= shiftToday(30);
      $("person").focus();
    }
  }

  if (oma.standalone) document.body.classList.add("standalone");

  $("addToggle").onclick = () => setPanel(!panelOpen);
  $("cancelAdd").onclick = () => setPanel(false);
  const rhythmButton = $("rhythmButton");
  rhythmButton.onclick = () => {
    const t = T();
    const entries = sortedItems(viewItems(latestState));
    if (!entries.length) return propose(rhythmButton, t.setupPrompt);
    const list = entries.slice(0, 5).map(({ item, metric }) => `${nameOf(item)} (${relationshipOf(item)}): ${statusText(metric)}, ${item.fields.channel || t.anyChannel}`).join("; ");
    return propose(rhythmButton, t.planPrompt(list));
  };
  $("nextContact").oninput = (event) => event.currentTarget.setCustomValidity("");
  $("addForm").onsubmit = async (event) => {
    event.preventDefault();
    const form = event.currentTarget;
    const value = (id) => $(id).value.trim();
    const fields = {
      person: value("person"),
      relationship: value("relationship"),
      last_contact: $("lastContact").value,
      next_contact: $("nextContact").value,
      channel: value("channel"),
      context: value("context"),
      priority: $("priority").value
    };
    if (!fields.person || !fields.relationship || !fields.last_contact || !fields.next_contact || !fields.channel || !fields.context) {
      form.reportValidity();
      return;
    }
    if (serialFromISO(fields.next_contact) <= serialFromISO(fields.last_contact)) {
      $("nextContact").setCustomValidity(T().nextAfterLast);
      form.reportValidity();
      return;
    }
    const entry = { tempId: `pending-${Date.now()}`, group: fields.relationship, position: 1e9, fields };
    pending.push(entry);
    justContacted = entry.tempId;
    form.reset();
    $("priority").value = "medium";
    setPanel(false);
    toast(T().toastAdded(fields.person));
    render(latestState);
    let ack = null;
    try {
      ack = await oma.addItem({ group: fields.relationship, fields });
    } catch (error) {
      ack = { ok: false };
    }
    if (!ack || ack.ok === false) {
      pending = pending.filter((p) => p !== entry);
      render(latestState);
      toast(T().failed, true);
      return;
    }
    if (ack.id) {
      const card = cards.get(entry.tempId);
      if (card) { cards.delete(entry.tempId); cards.set(ack.id, card); }
      entry.id = ack.id;
      entry.tempId = ack.id;
    }
    render(latestState);
  };

  oma.ready((state) => { latestState = state; applyStaticText(); render(state); });
  oma.onChange((state) => { latestState = state; render(state); });
  oma.onPrefChange(() => { applyStaticText(); render(latestState); });
  setInterval(() => render(latestState), 60000);
</script>
</body>
</html>
