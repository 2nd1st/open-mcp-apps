<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="A gentle rotation of people to reach out to — last contact, cadence, who is due.">
  <meta name="oma-category" content="People">
  <title>Keep in touch</title>
<style>
  * { box-sizing: border-box; }
  :root {
    color-scheme: light dark;
    --accent: var(--color-text-info, var(--color-ring-primary));
    --positive: var(--color-text-success, var(--color-ring-primary));
    --attention: var(--color-text-warning, var(--color-text-danger, var(--color-ring-primary)));
  }
  /* No body rule. Padding, ground and the frame are the kit's stage contract now; colour, font
     and margin the kit already sets for every app. The old root `overflow: hidden` also killed
     the scroll wheel in fixed-height hosts, leaving everything below the fold unreachable. */
  button, input, select { font: inherit; }
  button { color: inherit; }
  /* `.k-stage` owns the outer card and width track. Positioning stays here because the toast is
     absolute and belongs to this app rather than the viewport. */
  .app { position: relative; }
  /* `.topbar` is `.k-appbar` now: row, gap, padding, mark box, type scale and the chat-only rule
     all come from the kit. The app keeps only its deliberate bar height. */
  .topbar { min-height: 68px; }
  /* The mark keeps its PAINT and loses its box: identity is content, and the contract strips
     frames, never faces. */
  .brand-mark {
    border: 1px solid color-mix(in oklab, var(--accent) 26%, var(--color-border-secondary));
    background: linear-gradient(145deg, color-mix(in oklab, var(--accent) 15%, transparent), color-mix(in oklab, var(--positive) 7%, transparent));
    color: var(--accent);
  }
  .subtitle {
    display: -webkit-box;
    margin-top: 3px;
    overflow: hidden;
    color: var(--color-text-secondary);
    font-size: var(--font-text-sm-size, 12px);
    line-height: 1.3;
    white-space: normal;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 2;
  }
  .top-actions { display: flex; align-items: center; gap: 8px; margin-left: auto; }
  button {
    min-width: 0;
    border: 1px solid var(--color-border-primary);
    border-radius: var(--border-radius-md);
    background: var(--color-background-primary);
    cursor: pointer;
  }
  button:focus-visible, input:focus-visible, select:focus-visible {
    outline: 2px solid var(--color-ring-primary);
    outline-offset: 2px;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    min-height: 36px;
    padding: 8px 12px;
    font-weight: 700;
    line-height: 1;
    white-space: nowrap;
  }
  .btn svg { width: 16px; height: 16px; flex: 0 0 auto; }
  .btn.primary {
    border-color: color-mix(in oklab, var(--accent) 35%, transparent);
    background: var(--accent);
    color: var(--color-text-inverse);
    box-shadow: var(--shadow-sm);
  }
  .btn.ghost { background: color-mix(in oklab, var(--color-background-primary) 88%, transparent); }
  .overview-band {
    display: flex;
    align-items: center;
    gap: 16px;
    min-height: 72px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--color-border-secondary);
    background: color-mix(in oklab, var(--attention) 5%, var(--color-background-secondary));
    font-variant-numeric: tabular-nums;
  }
  .overview-main {
    display: flex;
    align-items: baseline;
    gap: 8px;
    min-width: 142px;
    padding-right: 16px;
    border-right: 1px solid var(--color-border-secondary);
  }
  .overview-number {
    color: var(--attention);
    font: 800 32px/1 var(--font-mono);
    letter-spacing: -.04em;
  }
  .overview-label { color: var(--color-text-secondary); font-size: 12px; font-weight: 700; }
  .overview-stats { display: grid; flex: 1; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; min-width: 0; }
  .add-panel {
    margin: 16px 20px 0;
    padding: 13px;
    border: 1px solid color-mix(in oklab, var(--color-text-info) 22%, var(--color-border-secondary));
    border-radius: var(--border-radius-lg);
    background: color-mix(in oklab, var(--color-text-info) 5%, var(--color-background-secondary));
  }
  .add-panel[hidden] { display: none; }
  .add-form {
    display: grid;
    grid-template-columns: 1.15fr .9fr .8fr .8fr;
    gap: 9px;
  }
  .field { display: grid; gap: 5px; min-width: 0; }
  .field label {
    color: var(--color-text-secondary);
    font-size: 10px;
    font-weight: 750;
    letter-spacing: .075em;
    text-transform: uppercase;
  }
  .field input, .field select {
    width: 100%;
    min-width: 0;
    height: 36px;
    padding: 7px 9px;
    border: 1px solid var(--color-border-primary);
    border-radius: var(--border-radius-md);
    background: var(--color-background-primary);
    color: var(--color-text-primary);
  }
  .field-context { grid-column: span 2; }
  .form-actions { display: flex; align-items: end; gap: 7px; }
  .form-actions button { height: 36px; padding: 7px 12px; font-weight: 700; white-space: nowrap; }
  .form-actions .save {
    border-color: var(--color-text-info);
    background: var(--color-text-info);
    color: var(--color-text-inverse);
  }
  .form-actions .cancel { color: var(--color-text-secondary); }
  .spotlight {
    position: relative;
    display: grid;
    grid-template-columns: auto minmax(0, 1fr) auto;
    align-items: center;
    gap: 18px;
    min-height: 154px;
    margin: 16px 20px;
    padding: 17px 18px;
    overflow: hidden;
    border: 1px solid color-mix(in oklab, var(--urgency, var(--color-text-warning)) 26%, var(--color-border-primary));
    border-radius: var(--border-radius-lg);
    background:
      linear-gradient(115deg,
        color-mix(in oklab, var(--urgency, var(--color-text-warning)) 10%, var(--color-background-primary)),
        var(--color-background-primary) 58%);
    box-shadow: var(--shadow-sm);
  }
  .spotlight::after {
    content: "";
    position: absolute;
    width: 170px;
    height: 170px;
    right: -86px;
    top: -95px;
    border: 1px solid color-mix(in oklab, var(--urgency, var(--color-text-warning)) 16%, transparent);
    border-radius: var(--border-radius-full, 999px);
    box-shadow:
      0 0 0 19px color-mix(in oklab, var(--urgency, var(--color-text-warning)) 4%, transparent),
      0 0 0 38px color-mix(in oklab, var(--urgency, var(--color-text-warning)) 3%, transparent);
    pointer-events: none;
  }
  .cadence-orbit {
    position: relative;
    width: 102px;
    height: 102px;
    flex: 0 0 auto;
  }
  .cadence-orbit svg { display: block; width: 100%; height: 100%; transform: rotate(-90deg); }
  .orbit-track, .orbit-progress { fill: none; stroke-width: 6; }
  .orbit-track { stroke: color-mix(in oklab, var(--color-border-primary) 74%, transparent); }
  .orbit-progress {
    stroke: var(--urgency, var(--color-text-warning));
    stroke-linecap: round;
    stroke-dasharray: 251.33;
    stroke-dashoffset: var(--dash, 251.33);
  }
  .orbit-center {
    position: absolute;
    inset: 14px;
    display: grid;
    place-content: center;
    text-align: center;
    border: 1px solid color-mix(in oklab, var(--urgency, var(--color-text-warning)) 18%, transparent);
    border-radius: var(--border-radius-full, 999px);
    background: color-mix(in oklab, var(--color-background-primary) 90%, transparent);
  }
  .score {
    color: var(--urgency, var(--color-text-warning));
    font-family: var(--font-mono);
    font-size: 19px;
    font-weight: 800;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .score-label { margin-top: 4px; color: var(--color-text-tertiary); font-size: 9px; line-height: 1.1; text-transform: uppercase; letter-spacing: .07em; }
  .spot-copy { min-width: 0; position: relative; z-index: 1; }
  .eyebrow { color: var(--urgency, var(--color-text-warning)); font-size: 10px; font-weight: 800; letter-spacing: .085em; text-transform: uppercase; }
  .spot-name { margin: 5px 0 4px; font-size: 23px; line-height: 1.15; letter-spacing: -.025em; }
  .spot-status { color: var(--color-text-secondary); font-size: var(--font-text-sm-size, 12px); font-variant-numeric: tabular-nums; }
  .spot-context {
    display: -webkit-box;
    max-width: 560px;
    margin: 9px 0 0;
    overflow: hidden;
    color: var(--color-text-secondary);
    line-height: 1.45;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 2;
  }
  .spot-actions {
    position: relative;
    z-index: 1;
    display: grid;
    gap: 8px;
    width: 154px;
  }
  .spot-actions button { display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 9px 11px; font-weight: 750; }
  .spot-actions svg { width: 15px; height: 15px; }
  .draft {
    border-color: color-mix(in oklab, var(--color-text-info) 35%, transparent);
    background: color-mix(in oklab, var(--color-text-info) 10%, transparent);
    color: var(--color-text-info);
  }
  .contact-primary {
    border-color: var(--color-text-primary);
    background: var(--color-text-primary);
    color: var(--color-background-primary);
  }
  .stat { display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; gap: 2px 8px; min-width: 0; }
  .stat-dot { width: 8px; height: 8px; flex: 0 0 auto; border-radius: var(--border-radius-full, 999px); background: var(--dot); box-shadow: 0 0 0 4px color-mix(in oklab, var(--dot) 11%, transparent); }
  .stat-number { font-family: var(--font-mono); font-size: 14px; font-weight: 800; }
  .stat-label {
    grid-column: 1 / -1;
    min-width: 0;
    color: var(--color-text-secondary);
    font-size: var(--font-text-sm-size, 12px);
    line-height: 1.25;
    white-space: normal;
  }
  .queue-section { border-top: 1px solid var(--color-border-secondary); background: color-mix(in oklab, var(--color-background-secondary) 52%, transparent); }
  .queue-head {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 20px 10px;
  }
  .queue-title { font-size: 13px; font-weight: 800; white-space: nowrap; }
  .queue-note { color: var(--color-text-tertiary); font-size: var(--font-text-sm-size, 12px); white-space: nowrap; }
  .filters {
    display: flex;
    gap: 5px;
    min-width: 0;
    margin-left: auto;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .filters::-webkit-scrollbar { display: none; }
  .filter {
    padding: 5px 9px;
    border-color: transparent;
    border-radius: var(--border-radius-full, 999px);
    background: transparent;
    color: var(--color-text-secondary);
    font-size: var(--font-text-sm-size, 12px);
    white-space: nowrap;
  }
  .filter.active {
    border-color: var(--color-border-primary);
    background: var(--color-background-primary);
    color: var(--color-text-primary);
    box-shadow: var(--shadow-sm);
  }
  .queue {
    display: grid;
    gap: 8px;
    max-height: none;
    padding: 2px 12px 14px;
    overflow: visible;
    overscroll-behavior: auto;
  }
  .person-card {
    --urgency: var(--color-text-success);
    position: relative;
    display: grid;
    grid-template-columns: 32px 44px minmax(0, 1fr) minmax(105px, auto) auto;
    align-items: center;
    gap: 11px;
    min-height: 84px;
    padding: 11px 12px;
    overflow: hidden;
    border: 1px solid var(--color-border-secondary);
    border-radius: var(--border-radius-lg);
    background: var(--color-background-primary);
    box-shadow: var(--shadow-sm);
  }
  .person-card::before {
    content: "";
    position: absolute;
    inset: 0 auto 0 0;
    width: 3px;
    background: var(--urgency);
  }
  .rank {
    color: var(--color-text-tertiary);
    font-family: var(--font-mono);
    font-size: 11px;
    font-variant-numeric: tabular-nums;
    text-align: center;
  }
  .avatar {
    display: grid;
    width: 42px;
    height: 42px;
    place-content: center;
    border: 1px solid color-mix(in oklab, var(--urgency) 20%, transparent);
    border-radius: var(--border-radius-full, 999px);
    background: color-mix(in oklab, var(--urgency) 10%, transparent);
    color: var(--urgency);
    font-size: 12px;
    font-weight: 850;
    letter-spacing: .02em;
  }
  .person-copy { min-width: 0; }
  .person-line { display: flex; align-items: center; gap: 7px; min-width: 0; }
  .person-name { overflow: hidden; font-weight: 800; text-overflow: ellipsis; white-space: nowrap; }
  .priority {
    flex: 0 0 auto;
    padding: 2px 6px;
    border-radius: var(--border-radius-full, 999px);
    background: color-mix(in oklab, var(--priority-color) 9%, transparent);
    color: var(--priority-color);
    font-size: 9px;
    font-weight: 800;
    letter-spacing: .055em;
    text-transform: uppercase;
  }
  .meta {
    display: flex;
    gap: 6px;
    min-width: 0;
    margin-top: 4px;
    color: var(--color-text-tertiary);
    font-size: 11px;
    font-variant-numeric: tabular-nums;
  }
  .meta span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .meta span + span::before { content: "·"; margin-right: 6px; color: var(--color-border-primary); }
  .context {
    display: -webkit-box;
    overflow: hidden;
    margin-top: 5px;
    color: var(--color-text-secondary);
    font-size: 12px;
    line-height: 1.4;
    white-space: normal;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 2;
  }
  .urgency-copy { min-width: 105px; text-align: right; font-variant-numeric: tabular-nums; }
  .urgency-main { color: var(--urgency); font-weight: 850; white-space: nowrap; }
  .urgency-sub { margin-top: 3px; color: var(--color-text-tertiary); font-size: 10px; white-space: nowrap; }
  .card-actions { display: flex; align-items: center; gap: 5px; }
  .mark-contacted {
    padding: 7px 9px;
    border-color: color-mix(in oklab, var(--color-text-success) 22%, var(--color-border-primary));
    color: var(--color-text-success);
    font-size: 11px;
    font-weight: 750;
    white-space: nowrap;
  }
  .remove {
    display: grid;
    width: 31px;
    height: 31px;
    padding: 0;
    place-content: center;
    border-color: transparent;
    background: transparent;
    color: var(--color-text-tertiary);
    font-size: 10px;
  }
  .remove svg { width: 14px; height: 14px; }
  .empty {
    display: grid;
    min-height: 180px;
    place-content: center;
    padding: 26px;
    border: 1px dashed var(--color-border-primary);
    border-radius: var(--border-radius-lg);
    color: var(--color-text-secondary);
    text-align: center;
  }
  .empty strong { color: var(--color-text-primary); font-size: 15px; }
  .empty span { max-width: 390px; margin-top: 6px; line-height: 1.45; }
  .empty button { justify-self: center; margin-top: 13px; padding: 7px 11px; color: var(--color-text-info); font-weight: 750; }
  .toast {
    position: absolute;
    left: 50%;
    bottom: 14px;
    z-index: 5;
    padding: 8px 12px;
    border: 1px solid color-mix(in oklab, var(--color-text-success) 28%, transparent);
    border-radius: var(--border-radius-full, 999px);
    background: color-mix(in oklab, var(--color-text-success) 14%, var(--color-background-primary));
    box-shadow: var(--shadow-md, var(--shadow-sm));
    color: var(--color-text-success);
    font-size: 12px;
    font-weight: 750;
    pointer-events: none;
    transform: translateX(-50%);
  }
  .toast[hidden] { display: none; }
  /* The existing toast is also the one error surface; a second strip would make two competing
     places to read the result of the same action. */
  .toast.error {
    border-color: color-mix(in oklab, var(--color-text-danger) 34%, var(--color-border-secondary));
    background: color-mix(in oklab, var(--color-text-danger) 8%, var(--color-background-primary));
    color: var(--color-text-danger);
  }
  @media (prefers-reduced-motion: no-preference) {
    button, .person-card, .add-panel, .orbit-progress {
      transition: transform 180ms cubic-bezier(.2,.8,.3,1), border-color 180ms ease, background 180ms ease, box-shadow 180ms ease, stroke-dashoffset 650ms cubic-bezier(.2,.8,.3,1);
    }
    button:hover:not(:disabled) { transform: translateY(-1px); }
    button:active:not(:disabled) { transform: scale(.975); }
    .person-card:hover { transform: translateY(-1px); border-color: color-mix(in oklab, var(--urgency) 26%, var(--color-border-primary)); box-shadow: var(--shadow-md, var(--shadow-sm)); }
    .contacted-pop { animation: contacted 520ms cubic-bezier(.34,1.56,.64,1); }
    .toast { animation: toast-in 260ms cubic-bezier(.34,1.56,.64,1); }
    @keyframes contacted { 45% { transform: scale(1.012); box-shadow: 0 0 0 4px color-mix(in oklab, var(--color-text-success) 16%, transparent), var(--shadow-sm); } }
    @keyframes toast-in { from { opacity: 0; transform: translate(-50%, 8px) scale(.96); } }
  }
  /* Narrow outer padding and card geometry are not retuned here: the kit drops the chat frame
     below 560px because the host's widget frame is already the card. */
  @media (max-width: 640px) {
    .topbar { gap: 10px; min-height: 60px; padding: 11px 12px; }
    .top-actions { gap: 6px; }
    .rhythm-button span, .add-toggle span { display: none; }
    .rhythm-button, .add-toggle { width: 36px; padding: 0; }
    .overview-band { gap: 12px; min-height: 66px; padding: 10px 12px; }
    .overview-main { min-width: 92px; padding-right: 12px; }
    .overview-number { font-size: 27px; }
    .overview-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .stat:nth-child(3) { display: none; }
    .add-toggle span { display: none; }
    .add-panel, .spotlight { margin-left: 12px; margin-right: 12px; }
    .add-form { grid-template-columns: 1fr 1fr; }
    .field-context { grid-column: 1 / -1; }
    .form-actions { grid-column: 1 / -1; justify-content: flex-end; }
    .spotlight {
      grid-template-columns: 76px minmax(0, 1fr);
      gap: 12px;
      min-height: 0;
      padding: 14px;
    }
    .cadence-orbit { width: 76px; height: 76px; }
    .orbit-center { inset: 11px; }
    .score { font-size: 15px; }
    .score-label { font-size: 8px; }
    .spot-name { font-size: 19px; }
    .spot-context { -webkit-line-clamp: 2; }
    .spot-actions { grid-column: 1 / -1; grid-template-columns: 1fr 1fr; width: auto; }
    .queue-head { align-items: flex-start; flex-wrap: wrap; padding: 11px 12px 8px; }
    .filters { order: 3; width: 100%; margin-left: 0; }
    .queue-note { margin-left: auto; }
    .queue { max-height: none; padding: 2px 8px 10px; }
    .person-card {
      grid-template-columns: 36px minmax(0, 1fr) auto;
      gap: 9px;
      padding: 10px;
    }
    .rank { display: none; }
    .avatar { width: 36px; height: 36px; }
    .urgency-copy { grid-column: 2; min-width: 0; text-align: left; }
    .urgency-main, .urgency-sub { display: inline; }
    .urgency-sub::before { content: " · "; }
    .card-actions { grid-column: 3; grid-row: 1 / span 2; }
    .mark-contacted { width: 33px; height: 33px; overflow: hidden; padding: 0; font-size: 0; }
    .mark-contacted::after { content: "✓"; font-size: 14px; }
    .remove { display: none; }
  }
  @media (max-width: 380px) {
    .overview-band {
      display: grid;
      gap: 9px;
      min-height: 0;
      padding: 11px 12px 12px;
    }
    .overview-main {
      min-width: 0;
      padding: 0 0 9px;
      border-right: 0;
      border-bottom: 1px solid var(--color-border-secondary);
    }
    .overview-number { font-size: 26px; }
    .overview-stats {
      width: 100%;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }
    .stat {
      grid-template-columns: auto minmax(0, 1fr);
      align-content: start;
      padding: 2px 0;
    }
    .stat-label { font-size: 11px; }
  }
</style>
</head>
<body>
<div class="app k-stage">
  <header class="topbar k-appbar">
    <div class="brand-mark k-appmark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 6.5A2.5 2.5 0 0 1 6.5 4h6A2.5 2.5 0 0 1 15 6.5v2A2.5 2.5 0 0 1 12.5 11H9l-3.5 2.5V11A2.5 2.5 0 0 1 4 8.5Z"/>
        <path d="M11 14h3.5l3.5 2.5V14a2.5 2.5 0 0 0 2-2.5v-2A2.5 2.5 0 0 0 17.5 7"/>
      </svg>
    </div>
    <div class="title-wrap k-appcopy">
      <div class="kicker k-eyebrow">CONTACT RHYTHM</div>
      <h1>Keep in touch</h1>
      <div class="subtitle">A gentle queue for the people who matter.</div>
    </div>
    <div class="top-actions">
      <button class="btn ghost rhythm-button" id="rhythmButton" type="button" aria-label="Plan outreach with AI">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 4.5h9a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2H8L4.5 15v-2.8a2 2 0 0 1-1-1.7Z"/><path d="m15.5 2 .5 1.5 1.5.5-1.5.5-.5 1.5-.5-1.5-1.5-.5 1.5-.5Z"/></svg>
        <span>Plan outreach</span>
      </button>
      <button class="btn primary add-toggle" id="addToggle" type="button" aria-label="Add person" aria-expanded="false" aria-controls="addPanel">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M10 4v12M4 10h12"/></svg>
        <span>Add person</span>
      </button>
    </div>
  </header>

  <section class="overview-band" id="stats" aria-label="Contact rhythm overview"></section>

  <section class="add-panel" id="addPanel" hidden>
    <form class="add-form" id="addForm">
      <div class="field"><label for="person">Person</label><input id="person" autocomplete="off" placeholder="Sam Rivera" required></div>
      <div class="field"><label for="relationship">Relationship</label><input id="relationship" autocomplete="off" placeholder="Friend" required></div>
      <div class="field"><label for="channel">Best channel</label><input id="channel" list="channelList" autocomplete="off" placeholder="Text" required></div>
      <div class="field"><label for="priority">Priority</label><select id="priority"><option value="high">High</option><option value="medium" selected>Medium</option><option value="low">Low</option></select></div>
      <div class="field"><label for="lastContact">Last contact</label><input id="lastContact" type="date" required></div>
      <div class="field"><label for="nextContact">Next contact</label><input id="nextContact" type="date" required></div>
      <div class="field field-context"><label for="context">What to pick up on</label><input id="context" autocomplete="off" placeholder="Ask how the new role is going" required></div>
      <div class="form-actions"><button class="cancel" id="cancelAdd" type="button">Cancel</button><button class="save" type="submit">Add to queue</button></div>
    </form>
    <datalist id="channelList"><option value="Text"><option value="Phone"><option value="Email"><option value="Signal"><option value="WhatsApp"><option value="Coffee"></datalist>
  </section>

  <section class="spotlight" id="spotlight" aria-live="polite"></section>

  <section class="queue-section">
    <div class="queue-head">
      <span class="queue-title">Connection queue</span>
      <span class="queue-note" id="queueNote">Most overdue first</span>
      <nav class="filters" id="filters" aria-label="Filter by relationship"></nav>
    </div>
    <main class="queue" id="queue"></main>
  </section>
  <div class="toast" id="toast" role="status" hidden></div>
</div>

<script type="module">
  const DAY = 86400000;
  const priorityWeight = { high: 1.15, medium: 1, low: .88 };
  const priorityRank = { high: 3, medium: 2, low: 1 };
  let latestState = { items: [] };
  let activeGroup = "All";
  let panelOpen = false;
  let seeding = false;
  let celebrateId = "";
  let toastTimer = 0;

  const todaySerial = () => {
    const now = new Date();
    return Date.UTC(now.getFullYear(), now.getMonth(), now.getDate());
  };
  const isoFromSerial = (serial) => new Date(serial).toISOString().slice(0, 10);
  const shiftToday = (days) => isoFromSerial(todaySerial() + days * DAY);
  const serialFromISO = (value) => {
    const parts = String(value || "").split("-").map(Number);
    return parts.length === 3 && parts.every(Number.isFinite)
      ? Date.UTC(parts[0], parts[1] - 1, parts[2])
      : todaySerial();
  };
  const daysBetween = (from, to) => Math.round((to - from) / DAY);
  const titleCase = (value) => {
    const text = String(value || "medium").toLowerCase();
    return text.charAt(0).toUpperCase() + text.slice(1);
  };
  const initials = (name) => String(name || "?").trim().split(/\s+/).slice(0, 2).map((part) => part[0] || "").join("").toUpperCase();
  const relationshipOf = (item) => String(item.group || item.fields.relationship || "Other").trim() || "Other";
  const priorityOf = (item) => ["high", "medium", "low"].includes(String(item.fields.priority).toLowerCase())
    ? String(item.fields.priority).toLowerCase()
    : "medium";

  function locale() {
    const selected = oma.pref("locale", "auto");
    return selected === "auto" ? navigator.language : selected;
  }

  function formatDate(value) {
    if (oma.pref("date_format", "auto") === "yyyy-mm-dd") return String(value || "");
    const parts = String(value || "").split("-").map(Number);
    if (parts.length !== 3 || !parts.every(Number.isFinite)) return "No date";
    const mode = oma.pref("date_format", "auto");
    if (mode === "dd/mm/yyyy") return `${String(parts[2]).padStart(2, "0")}/${String(parts[1]).padStart(2, "0")}/${parts[0]}`;
    if (mode === "mm/dd/yyyy") return `${String(parts[1]).padStart(2, "0")}/${String(parts[2]).padStart(2, "0")}/${parts[0]}`;
    return new Intl.DateTimeFormat(locale(), { month: "short", day: "numeric", year: parts[0] === new Date().getFullYear() ? undefined : "numeric" })
      .format(new Date(parts[0], parts[1] - 1, parts[2]));
  }

  function measure(item) {
    const last = serialFromISO(item.fields.last_contact);
    const next = serialFromISO(item.fields.next_contact);
    const now = todaySerial();
    const cadenceDays = Math.max(1, Math.abs(daysBetween(last, next)));
    const daysSince = Math.max(0, daysBetween(last, now));
    const daysOverdue = daysBetween(next, now);
    const cadenceRatio = daysSince / cadenceDays;
    const priority = priorityOf(item);
    const overdueScore = Math.round(Math.max(0, cadenceRatio * 100 - 100) * priorityWeight[priority]);
    return { last, next, cadenceDays, daysSince, daysOverdue, cadenceRatio, priority, overdueScore };
  }

  function urgencyFor(metric) {
    if (metric.daysOverdue >= 14 || metric.overdueScore >= 75) return { key: "critical", color: "var(--color-text-danger)" };
    if (metric.daysOverdue > 0) return { key: "overdue", color: "var(--color-text-warning)" };
    if (metric.daysOverdue >= -7) return { key: "soon", color: "var(--color-text-info)" };
    return { key: "steady", color: "var(--color-text-success)" };
  }

  function sortedItems(items) {
    return items.map((item) => ({ item, metric: measure(item) })).sort((a, b) =>
      b.metric.overdueScore - a.metric.overdueScore ||
      b.metric.daysOverdue - a.metric.daysOverdue ||
      priorityRank[b.metric.priority] - priorityRank[a.metric.priority] ||
      a.metric.next - b.metric.next ||
      String(a.item.fields.person || "").localeCompare(String(b.item.fields.person || ""))
    );
  }

  function statusText(metric) {
    if (metric.daysOverdue > 1) return `${metric.daysOverdue} days overdue`;
    if (metric.daysOverdue === 1) return "1 day overdue";
    if (metric.daysOverdue === 0) return "Due today";
    if (metric.daysOverdue === -1) return "Due tomorrow";
    return `Due in ${Math.abs(metric.daysOverdue)} days`;
  }

  function el(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function iconButton(label, path) {
    const button = el("button");
    button.type = "button";
    button.setAttribute("aria-label", label);
    button.innerHTML = `<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${path}"/></svg>`;
    return button;
  }

  function setPanel(open) {
    panelOpen = open;
    const panel = document.getElementById("addPanel");
    const toggle = document.getElementById("addToggle");
    panel.hidden = !open;
    toggle.setAttribute("aria-expanded", String(open));
    if (open) {
      document.getElementById("lastContact").value ||= shiftToday(0);
      document.getElementById("nextContact").value ||= shiftToday(30);
      document.getElementById("person").focus();
    }
  }

  function markContacted(item) {
    const metric = measure(item);
    const person = String(item.fields.person || "This person");
    celebrateId = item.id;
    showToast(`${person} is back on your rhythm`);
    oma.updateItem(item.id, {
      last_contact: shiftToday(0),
      next_contact: shiftToday(metric.cadenceDays)
    });
  }

  function showToast(text) {
    const toast = document.getElementById("toast");
    clearTimeout(toastTimer);
    toast.textContent = text;
    toast.classList.remove("error");
    toast.hidden = false;
    toastTimer = setTimeout(() => { toast.hidden = true; }, 2600);
  }

  function showError(message) {
    const toast = document.getElementById("toast");
    clearTimeout(toastTimer);
    toast.textContent = message;
    toast.classList.add("error");
    toast.hidden = false;
    toastTimer = setTimeout(() => {
      toast.hidden = true;
      toast.classList.remove("error");
    }, 7000);
  }

  function clearError() {
    const toast = document.getElementById("toast");
    if (!toast.classList.contains("error")) return;
    clearTimeout(toastTimer);
    toast.hidden = true;
    toast.classList.remove("error");
  }

  async function draftHello(button, item, metric) {
    const person = String(item.fields.person || "this person");
    const relationship = relationshipOf(item);
    const channel = String(item.fields.channel || "message");
    const context = String(item.fields.context || "Reconnect warmly");
    clearError();
    button.disabled = true;
    try {
      const result = await oma.sendMessage(`Draft a warm, specific check-in for ${person}, my ${relationship.toLowerCase()}, to send via ${channel}. We last connected on ${formatDate(item.fields.last_contact)} and they are ${statusText(metric).toLowerCase()} in my keep-in-touch queue. Pick up naturally on this context: "${context}". Keep it genuine, avoid guilt about the gap, and make it easy to reply.`);
      if (result && result.isError === true && !result.degraded) showError(localizeText("Couldn't reach the assistant — try again."));
    } catch (error) {
      showError(String(error?.message || error || localizeText("Couldn't reach the assistant — try again.")));
    } finally {
      button.disabled = false;
    }
  }

  async function planOutreach(button) {
    const entries = sortedItems(latestState.items);
    clearError();
    button.disabled = true;
    try {
      if (!entries.length) {
        const result = await oma.sendMessage("Help me set up a sustainable keep-in-touch rhythm. Suggest a small set of relationship groups, realistic contact cadences, and a simple way to decide who to add first.");
        if (result && result.isError === true && !result.degraded) showError(localizeText("Couldn't reach the assistant — try again."));
        return;
      }
      const snapshot = entries.slice(0, 5).map(({ item, metric }) =>
        `${item.fields.person || "Unnamed person"} (${relationshipOf(item)}): ${statusText(metric).toLowerCase()}, usually via ${item.fields.channel || "any channel"}`
      ).join("; ");
      const result = await oma.sendMessage(`Help me plan a thoughtful, low-pressure outreach session from this keep-in-touch queue: ${snapshot}. Prioritise two or three people, suggest a natural order, and give me a brief opening idea for each based on their timing.`);
      if (result && result.isError === true && !result.degraded) showError(localizeText("Couldn't reach the assistant — try again."));
    } catch (error) {
      showError(String(error?.message || error || localizeText("Couldn't reach the assistant — try again.")));
    } finally {
      button.disabled = false;
    }
  }


  function renderSpotlight(entry) {
    const host = document.getElementById("spotlight");
    host.innerHTML = "";
    if (!entry) {
      host.style.setProperty("--urgency", "var(--color-text-info)");
      const orbit = el("div", "cadence-orbit");
      orbit.innerHTML = `<svg viewBox="0 0 100 100" aria-hidden="true"><circle class="orbit-track" cx="50" cy="50" r="40"/></svg><div class="orbit-center"><span class="score">—</span><span class="score-label">all clear</span></div>`;
      const copy = el("div", "spot-copy");
      copy.append(el("div", "eyebrow", "Your circle is quiet"), el("h2", "spot-name", "Add someone you value"), el("p", "spot-context", "Set a simple contact rhythm and this space will surface who needs a little attention."));
      const actions = el("div", "spot-actions");
      const add = el("button", "draft", "Add your first person");
      add.type = "button";
      add.onclick = () => setPanel(true);
      actions.append(add);
      host.append(orbit, copy, actions);
      return;
    }
    const { item, metric } = entry;
    const urgency = urgencyFor(metric);
    host.style.setProperty("--urgency", urgency.color);
    const circumference = 251.33;
    const progress = Math.min(1, metric.cadenceRatio / 2);
    host.style.setProperty("--dash", String(circumference * (1 - progress)));

    const orbit = el("div", "cadence-orbit");
    orbit.innerHTML = `<svg viewBox="0 0 100 100" role="img" aria-label="${Math.round(metric.cadenceRatio * 100)} percent of intended cadence elapsed"><circle class="orbit-track" cx="50" cy="50" r="40"/><circle class="orbit-progress" cx="50" cy="50" r="40"/></svg>`;
    const orbitCenter = el("div", "orbit-center");
    orbitCenter.append(el("span", "score", String(metric.overdueScore)), el("span", "score-label", "overdue score"));
    orbit.append(orbitCenter);

    const copy = el("div", "spot-copy");
    copy.append(el("div", "eyebrow", `${metric.daysOverdue > 0 ? "Most overdue" : "Next on your rhythm"} · ${relationshipOf(item)}`));
    copy.append(el("h2", "spot-name", String(item.fields.person || "Unnamed person")));
    copy.append(el("div", "spot-status", `${statusText(metric)} · last spoke ${metric.daysSince} days ago · ${item.fields.channel || "Any channel"}`));
    copy.append(el("p", "spot-context", String(item.fields.context || "Reconnect and see how they are doing.")));

    const actions = el("div", "spot-actions");
    const draft = iconButton("Draft a hello with AI", "M4 15.5V17l1.5-1.5H14a2 2 0 0 0 2-2v-7a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v9Z M7 8h6M7 11h4");
    draft.className = "draft";
    draft.append(document.createTextNode("Draft a hello"));
    draft.onclick = async () => { await draftHello(draft, item, metric); };
    const contacted = iconButton(`Mark ${item.fields.person || "person"} contacted today`, "m5 10 3 3 7-7");
    contacted.className = "contact-primary";
    contacted.append(document.createTextNode("Contacted today"));
    contacted.onclick = () => markContacted(item);
    actions.append(draft, contacted);
    host.append(orbit, copy, actions);
  }

  function renderStats(entries) {
    const overdue = entries.filter(({ metric }) => metric.daysOverdue > 0).length;
    const dueSoon = entries.filter(({ metric }) => metric.daysOverdue <= 0 && metric.daysOverdue >= -7).length;
    const onRhythm = entries.filter(({ metric }) => metric.daysOverdue < -7).length;
    const stats = document.getElementById("stats");
    stats.innerHTML = "";
    const main = el("div", "overview-main");
    main.append(el("strong", "overview-number", String(overdue)), el("span", "overview-label", overdue === 1 ? "person overdue" : "people overdue"));
    const details = el("div", "overview-stats");
    [
      { number: dueSoon, label: "due this week", color: "var(--color-text-info)" },
      { number: onRhythm, label: "comfortably on rhythm", color: "var(--color-text-success)" },
      { number: entries.length, label: "people tracked", color: "var(--color-text-secondary)" }
    ].forEach((data) => {
      const stat = el("div", "stat");
      const dot = el("span", "stat-dot");
      dot.style.setProperty("--dot", data.color);
      stat.append(dot, el("span", "stat-number", String(data.number)), el("span", "stat-label", data.label));
      details.append(stat);
    });
    stats.append(main, details);
  }

  function renderFilters(items) {
    const groups = [...new Set(items.map(relationshipOf))].sort((a, b) => a.localeCompare(b));
    if (activeGroup !== "All" && !groups.includes(activeGroup)) activeGroup = "All";
    const host = document.getElementById("filters");
    host.innerHTML = "";
    ["All", ...groups].forEach((group) => {
      const button = el("button", `filter${activeGroup === group ? " active" : ""}`, group);
      button.type = "button";
      button.setAttribute("aria-pressed", String(activeGroup === group));
      button.onclick = () => { activeGroup = group; render(latestState); };
      host.append(button);
    });
  }

  function renderCard(entry, index) {
    const { item, metric } = entry;
    const urgency = urgencyFor(metric);
    const priority = metric.priority;
    const card = el("article", `person-card${celebrateId === item.id ? " contacted-pop" : ""}`);
    card.style.setProperty("--urgency", urgency.color);
    card.style.setProperty("--priority-color", priority === "high" ? "var(--color-text-danger)" : priority === "low" ? "var(--color-text-tertiary)" : "var(--color-text-info)");

    card.append(el("div", "rank", String(index + 1).padStart(2, "0")));
    card.append(el("div", "avatar", initials(item.fields.person)));

    const copy = el("div", "person-copy");
    const line = el("div", "person-line");
    line.append(el("span", "person-name", String(item.fields.person || "Unnamed person")), el("span", "priority", titleCase(priority)));
    const meta = el("div", "meta");
    meta.append(el("span", "", relationshipOf(item)), el("span", "", String(item.fields.channel || "Any channel")), el("span", "", `every ${metric.cadenceDays}d`));
    copy.append(line, meta, el("div", "context", String(item.fields.context || "No context yet")));

    const urgencyCopy = el("div", "urgency-copy");
    urgencyCopy.append(el("div", "urgency-main", statusText(metric)), el("div", "urgency-sub", `Next ${formatDate(item.fields.next_contact)}`));

    const actions = el("div", "card-actions");
    const contacted = el("button", "mark-contacted", "Contacted");
    contacted.type = "button";
    contacted.setAttribute("aria-label", `Mark ${item.fields.person || "person"} contacted today`);
    contacted.onclick = () => markContacted(item);
    const remove = iconButton(`Remove ${item.fields.person || "person"}`, "M6 6h8M8 6V4h4v2m-5 2 .5 7h5l.5-7");
    remove.className = "remove";
    remove.type = "button";
    remove.onclick = () => oma.deleteItem(item.id);
    actions.append(contacted, remove);
    card.append(copy, urgencyCopy, actions);
    return card;
  }

  function renderQueue(entries) {
    const filtered = activeGroup === "All" ? entries : entries.filter(({ item }) => relationshipOf(item) === activeGroup);
    const queue = document.getElementById("queue");
    queue.innerHTML = "";
    document.getElementById("queueNote").textContent = activeGroup === "All"
      ? "Most overdue first"
      : `${filtered.length} ${activeGroup.toLowerCase()} contact${filtered.length === 1 ? "" : "s"}`;
    if (!filtered.length) {
      const empty = el("div", "empty");
      empty.append(el("strong", "", activeGroup === "All" ? "Your queue is ready for someone" : `No ${activeGroup.toLowerCase()} contacts yet`));
      empty.append(el("span", "", activeGroup === "All"
        ? "Add a person and an intended next-contact date. The queue will do the remembering."
        : "Choose All or add someone in this relationship."));
      const add = el("button", "", "Add person");
      add.type = "button";
      add.onclick = () => setPanel(true);
      empty.append(add);
      queue.append(empty);
      return;
    }
    filtered.forEach((entry, index) => queue.append(renderCard(entry, index)));
  }

  function render(state) {
    latestState = state;
    const entries = sortedItems(state.items);
    renderSpotlight(entries[0]);
    renderStats(entries);
    renderFilters(state.items);
    renderQueue(entries);
    if (celebrateId) setTimeout(() => { celebrateId = ""; }, 800);
  }

  async function seed(state) {
    if (state.items.length || seeding) return;
    seeding = true;
    const samples = [
      { group: "Friend", fields: { person: "Maya Chen", relationship: "Friend", last_contact: shiftToday(-32), next_contact: shiftToday(-14), channel: "Signal", context: "Ask how the first month in her new product role has felt.", priority: "high" } },
      { group: "Family", fields: { person: "Aunt Rosa", relationship: "Family", last_contact: shiftToday(-19), next_contact: shiftToday(-2), channel: "Phone", context: "She was planning the garden beds—ask what ended up thriving.", priority: "high" } },
      { group: "Work", fields: { person: "Noah Williams", relationship: "Work", last_contact: shiftToday(-8), next_contact: shiftToday(6), channel: "Coffee", context: "Congratulate him on the launch and hear what the team learned.", priority: "medium" } },
      { group: "Mentor", fields: { person: "Lena Ortiz", relationship: "Mentor", last_contact: shiftToday(-42), next_contact: shiftToday(3), channel: "Email", context: "Share the decision on the new project direction and thank her for the nudge.", priority: "medium" } }
    ];
    await Promise.all(samples.map((sample) => oma.addItem(sample)));
  }

  document.getElementById("addToggle").onclick = () => setPanel(!panelOpen);
  // Visible outside a chat host too: oma.sendMessage degrades to the clipboard in standalone mode.
  // All three calls are awaited and their initiating button is dead in flight, so a slow bridge
  // cannot queue duplicate messages. Clipboard degradation is a completed hand-off, not failure.
  const rhythmButton = document.getElementById("rhythmButton");
  rhythmButton.onclick = async () => { await planOutreach(rhythmButton); };
  document.getElementById("cancelAdd").onclick = () => setPanel(false);
  document.getElementById("addForm").onsubmit = (event) => {
    event.preventDefault();
    const person = document.getElementById("person").value.trim();
    const relationship = document.getElementById("relationship").value.trim();
    const last_contact = document.getElementById("lastContact").value;
    const next_contact = document.getElementById("nextContact").value;
    const channel = document.getElementById("channel").value.trim();
    const context = document.getElementById("context").value.trim();
    const priority = document.getElementById("priority").value;
    if (!person || !relationship || !last_contact || !next_contact || !channel || !context) {
      event.currentTarget.reportValidity();
      return;
    }
    if (serialFromISO(next_contact) <= serialFromISO(last_contact)) {
      const nextInput = document.getElementById("nextContact");
      nextInput.setCustomValidity("Next contact must be after the last contact.");
      event.currentTarget.reportValidity();
      return;
    }
    oma.addItem({
      group: relationship,
      fields: { person, relationship, last_contact, next_contact, channel, context, priority }
    });
    event.currentTarget.reset();
    document.getElementById("priority").value = "medium";
    document.getElementById("lastContact").value = shiftToday(0);
    document.getElementById("nextContact").value = shiftToday(30);
    setPanel(false);
    showToast(`${person} joined your circle`);
  };
  document.getElementById("nextContact").oninput = (event) => event.currentTarget.setCustomValidity("");

  const UI_COPY = {
    "CONTACT RHYTHM": "联系节奏",
    "Keep in touch": "保持联系",

    "WhatsApp": "WhatsApp",
    "Coffee": "咖啡",
    "Ask how the first month in her new product role has felt.": "问问她新产品岗位的第一个月感觉怎么样。",
    "She was planning the garden beds—ask what ended up thriving.": "她之前在规划花坛，问问后来哪些植物长得最好。",
    "Congratulate him on the launch and hear what the team learned.": "祝贺他完成发布，并问问团队有哪些收获。",
    "Share the decision on the new project direction and thank her for the nudge.": "分享新项目方向的决定，并感谢她此前的推动。",
    "Couldn't reach the assistant — try again.": "没能联系上助手，请重试。"
  };
  const UI_COPY_ZH = Object.fromEntries(Object.entries(UI_COPY).map(([en, zh]) => [zh, en]));
  const isZhUi = () => locale().toLowerCase().startsWith("zh");
  const localizeText = (value) => {
    const zh = isZhUi();
    let next = (zh ? UI_COPY : UI_COPY_ZH)[value] || value;
    if (zh) {
      next = next.replace(/^(\d+) days? overdue$/i, "逾期 $1 天");
      next = next.replace(/^Due today$/i, "今天到期");
      next = next.replace(/^Due tomorrow$/i, "明天到期");
      next = next.replace(/^Due in (\d+) days?$/i, "$1 天后到期");
      next = next.replace(/^every (\d+)d$/i, "每 $1 天");
      next = next.replace(/^Next (.+)$/i, "下次 $1");
      next = next.replace(/^(Most overdue|Next on your rhythm) · (.+)$/i, (_, label, relationship) => `${UI_COPY[label] || label} · ${UI_COPY[relationship] || relationship}`);
      next = next.replace(/^(\d+) days overdue · last spoke (\d+) days ago · (.+)$/i, (_, overdue, since, channel) => `逾期 ${overdue} 天 · 上次联系 ${since} 天前 · ${channel}`);
      next = next.replace(/^Mark (.+) contacted today$/i, (_, person) => `标记 ${person} 今天已联系`);
      next = next.replace(/^Remove (.+)$/i, (_, person) => `移除 ${person}`);
      next = next.replace(/^(\d+) percent of intended cadence elapsed$/i, "已经过计划联系节奏的 $1%");
    }
    return next;
  };
  function applyUiLocale() {
    const zh = isZhUi();
    document.documentElement.lang = zh ? "zh-CN" : "en";
    document.title = zh ? "保持联系" : "Keep in touch";
    document.querySelectorAll("body *:not(script):not(style)").forEach((element) => {
      for (const node of element.childNodes) {
        if (node.nodeType !== Node.TEXT_NODE) continue;
        const raw = node.nodeValue || "";
        const trimmed = raw.trim();
        if (!trimmed) continue;
        const translated = localizeText(trimmed);
        if (translated !== trimmed) node.nodeValue = raw.replace(trimmed, translated);
      }
      for (const attribute of ["aria-label", "title", "placeholder"]) {
        const value = element.getAttribute(attribute);
        if (!value) continue;
        const translated = localizeText(value);
        if (translated !== value) element.setAttribute(attribute, translated);
      }
    });
  }

  // WHICH CONTEXT AM I IN — the one signal the kit's stage contract reads. `standalone` means
  // the viewer or panel host already framed the page, so the kit must not draw another card.
  if (oma.standalone) document.body.classList.add("standalone");

  oma.ready((state) => { render(state); applyUiLocale(); });  // App Store apps install EMPTY — samples live in oma-fixtures (preview only)
  oma.onChange((state) => { render(state); applyUiLocale(); });
  oma.onPrefChange(() => { render(latestState); applyUiLocale(); });
</script>
</body>
</html>
