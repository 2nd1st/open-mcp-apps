<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Settings</title>
<meta name="description" content="Preferences, installed apps, data collections and per-app permissions for your open-mcp-apps workbench.">
<style>
  /* app-specific styles; the shared system kit (.k-*) is injected by the engine into every document */
  :root {
    --ground: var(--color-background-secondary);
    --surface: var(--color-background-primary);
    --soft: var(--color-background-secondary);
    --softer: var(--color-background-tertiary);
    --ink: var(--color-text-primary);
    --ink-2: var(--color-text-secondary);
    --ink-3: var(--color-text-tertiary);
    --line: var(--color-border-primary);
    --line-2: var(--color-border-secondary);
    --accent: var(--k-accent);
    --accent-deep: color-mix(in oklab, var(--k-accent) 76%, var(--color-text-primary));
    --accent-soft: color-mix(in oklab, var(--k-accent) 11%, var(--color-background-primary));
    --on-solid: var(--color-text-inverse);
    --mint: var(--k-ok);
    --wine: var(--k-hue-4);
    --warn: var(--k-warn);
    --bad: var(--k-bad);
  }
  body { padding: 0; background: var(--ground); color: var(--ink); }
  /* In the browser viewer the runtime's stage already frames the page — no second ground there. */
  .standalone body, body.standalone { background: transparent; }

  /* overflow-x: clip is the belt under every width rule below — a widget that is one pixel wider
     than its frame gets a horizontal scrollbar across the whole card, and `clip` costs nothing
     (unlike `hidden` it does not turn this into a scroll container, so nothing inside it that
     relies on the page's own scrollport changes behaviour). */
  .shell { display: grid; grid-template-columns: minmax(0, 1fr); overflow-x: clip; }
  .rail { display: none; }

  .main { min-width: 0; padding: 16px 14px 34px; }

  /* ---- the chat-host capsule ----
     Inside a chat the widget is a card floating in the conversation, and every one of the 20+
     library apps draws that card itself: an app-bar (mark · eyebrow · name · status) over a
     bordered, rounded surface. This app is the one that stopped doing it, and the first repair
     hung the capsule on `(max-width:560px)` — which is a WIDTH, and the thing it was meant to
     answer is a CONTEXT. Measured on Leo's desktop claude.ai: the widget is ~736px wide, the
     media query never matched, and the app was still bare in the transcript. So the split is the
     context alone: `:not(.standalone)` = a card in someone's conversation, draw the frame at any
     width; `.standalone` = the browser viewer, whose runtime stage already frames the page (one
     frame, never two). The wide form keeps its rail-and-main layout INSIDE the capsule. */
  body:not(.standalone) { padding: 12px; background: transparent; }
  body:not(.standalone) .shell {
    overflow: clip;   /* clip, not hidden: it rounds the corners without becoming a scrollport */
    border: 1px solid var(--line-2);
    border-radius: var(--border-radius-lg, 16px);
    background: var(--surface);
    box-shadow: var(--shadow-md, var(--shadow-sm));
  }
  body:not(.standalone) .main { background: var(--ground); }
  .appbar { display: none; }   /* the capsule's own chrome — drawn only where the capsule is */
  body:not(.standalone) .appbar {
    display: flex; align-items: center; gap: 11px;
    grid-column: 1 / -1;   /* spans rail AND main: it is the capsule's bar, not the column's */
    padding: 11px 14px; border-bottom: 1px solid var(--line-2); background: var(--surface);
  }
  .appbar .app-mark {
    display: grid; width: 34px; height: 34px; flex: none; place-items: center;
    border-radius: 11px; color: var(--on-solid);
    background: linear-gradient(145deg, color-mix(in oklab, var(--accent) 62%, var(--ink-3)), var(--accent-deep));
  }
  .appbar .app-mark svg { width: 17px; height: 17px; }
  .appbar .barCopy { min-width: 0; flex: 1; }
  .appbar .eyebrow { display: block; color: var(--ink-3); font-size: 9.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
  .appbar h1 { margin: 1px 0 0; font-size: 15px; font-weight: 680; letter-spacing: -.015em; }

  /* Mobile tab strip: the ≤560px form of the sidebar nav (Codex mobileTabs). */
  /* Six sections never fit 420px, so the strip scrolls — and a scroller with no visible bar reads
     as a truncated list. The right-edge fade is the affordance (alpha only; the colour is a token). */
  .tabstrip { display: flex; gap: 8px; margin: 0 -14px 16px; padding: 2px 14px 6px; overflow-x: auto; scrollbar-width: none;
    mask-image: linear-gradient(to right, var(--ink) calc(100% - 26px), transparent); }
  .tabstrip::-webkit-scrollbar { display: none; }
  .tabstrip button {
    display: inline-flex; flex: none; align-items: center; gap: 6px; min-height: 34px; padding: 0 14px;
    border: 1px solid var(--line-2); border-radius: var(--border-radius-full, 999px);
    background: var(--surface); color: var(--ink-2); font: inherit; font-size: 12.5px; font-weight: 620;
    cursor: pointer; transition: background var(--k-t-fast), color var(--k-t-fast), border-color var(--k-t-fast);
  }
  .tabstrip button[data-active="true"] { border-color: transparent; background: var(--accent-deep); color: var(--on-solid); }
  .tabstrip svg { width: 14px; height: 14px; }

  /* Page title block — desktop only, the mobile strip already names the section. */
  .pageTitle { display: none; margin: 0 0 22px; }
  .pageIcon {
    display: grid; width: 54px; height: 54px; place-items: center; margin-bottom: 12px;
    border-radius: var(--border-radius-lg, 16px);
    background: linear-gradient(145deg, color-mix(in oklab, var(--accent) 62%, var(--ink-3)), var(--accent-deep));
    color: var(--on-solid); box-shadow: var(--shadow-md);
  }
  .pageIcon svg { width: 27px; height: 27px; }
  .pageTitle h1 { margin: 0; font-size: 27px; font-weight: 700; letter-spacing: -.03em; }
  .pageTitle p { max-width: 58ch; margin: 7px 0 0; color: var(--ink-3); font-size: 13px; line-height: 1.5; }

  .status { display: flex; align-items: center; gap: 8px; min-height: 22px; margin: 0 2px 10px; }
  #saved[hidden] { display: none; }
  #saved .k-icon { width: 12px; height: 12px; vertical-align: -2px; }

  .pane { display: none; }
  .pane.on { display: block; }

  /* Group + row anatomy — the whole design lives here (Codex .group/.row/.rowIcon/.rowCopy). */
  h2.sectionTitle { margin: 22px 3px 8px; color: var(--ink-3); font-size: 12px; font-weight: 680; letter-spacing: .01em; }
  .pane > h2.sectionTitle:first-child, .pane > .group:first-child { margin-top: 0; }
  .group {
    overflow: hidden; border: 1px solid var(--line-2); border-radius: 15px;
    background: var(--surface); box-shadow: var(--shadow-xs);
  }
  .group + .group { margin-top: 10px; }
  .row {
    position: relative; display: flex; min-width: 0; min-height: 52px; align-items: center;
    gap: 11px; padding: 10px 14px;
  }
  .row + .row::before { position: absolute; top: 0; right: 14px; left: 50px; height: 1px; content: ""; background: var(--line-2); }
  .rowlist:empty { display: none; }
  .rowIcon {
    display: grid; width: 25px; height: 25px; flex: none; place-items: center;
    border-radius: 7px; background: var(--ink-3); color: var(--on-solid);
  }
  .rowIcon[data-tone="blue"] { background: var(--accent); }
  .rowIcon[data-tone="mint"] { background: var(--mint); }
  .rowIcon[data-tone="wine"] { background: var(--wine); }
  .rowIcon[data-tone="warn"] { background: var(--warn); }
  .rowIcon[data-tone="bad"] { background: var(--bad); }
  .rowIcon svg { width: 14px; height: 14px; }
  .rowCopy { min-width: 0; flex: 1; }
  .rowCopy b { display: block; font-size: 13px; font-weight: 610; overflow-wrap: anywhere; }
  /* A description is prose, so it gets a MEASURE. Without the cap it ran the full width of the
     content column in the browser viewer (~600px at 1280) — one long line the eye has to track
     back across — while the line-height stayed at the 1.4 that suits a one-line hint. */
  .rowCopy small { display: block; margin-top: 3px; max-width: 64ch; color: var(--ink-3); font-size: 11px; line-height: 1.5; overflow-wrap: anywhere; }
  .rowValue { max-width: 46%; overflow: hidden; color: var(--ink-3); font-size: 12px; text-overflow: ellipsis; white-space: nowrap; }
  .rowAction {
    display: inline-flex; align-items: center; gap: 5px; flex: none; padding: 6px 11px; border: 0;
    border-radius: var(--border-radius-full, 999px); background: var(--accent-soft); color: var(--accent-deep);
    font: inherit; font-size: 11.5px; font-weight: 670; text-decoration: none; cursor: pointer;
  }
  .rowAction svg { width: 13px; height: 13px; }
  .rowAction.quiet { background: var(--soft); color: var(--ink-2); }
  .rowAction.bad { background: color-mix(in oklab, var(--bad) 11%, var(--surface)); color: var(--bad); }
  .iconBtn {
    display: grid; width: 28px; height: 28px; flex: none; place-items: center; padding: 0; border: 0;
    border-radius: 8px; background: transparent; color: var(--ink-3); cursor: pointer;
    transition: background var(--k-t-fast), color var(--k-t-fast);
  }
  .iconBtn:hover { background: var(--soft); color: var(--ink); }
  .iconBtn svg { width: 14px; height: 14px; }
  .spc { width: 28px; flex: none; }

  /* Controls inside a row */
  .row input.k-field[type=number] { width: 88px; }
  .row input.k-field[type=text] { width: 176px; }
  /* A select has to hold whole option sentences ("On request — only when asked"), so it gets a
     real budget rather than the 176px the text inputs live on. */
  .row select.k-field { min-width: 150px; max-width: 262px; text-overflow: ellipsis; }
  .row .k-switch { flex: none; }

  /* ---- the row's second shape: label, then prose, then control ----
     A long label beside a wide control squeezes the copy into a sliver and leaves the control
     floating in the gap. The first repair stacked them under `(max-width: 560px)` — a VIEWPORT
     query, and the thing that decides is the width the ROW gets. Measured: a 736px widget puts a
     200px rail beside the content, so the row is 451px wide and the query never matched; the
     proactivity description wrapped at ~215px into eight lines, two or three words each, with the
     select hanging beside the middle of it. `@container` asks the question that was always meant:
     how much room does this row have? (Every .row lives in a .group, so the group is the container;
     `details.group` — More options, and every per-app section — is one too, so their rows inherit
     the same treatment for free.)

     The stacked shape, in reading order: the tile and the bold label own line one (with whatever
     tail the row carries — switch, value, reset); the description drops to its own full-width
     paragraph under them, at a size meant to be read rather than squinted at; the control takes
     the last line, indented to the copy's own left edge so the three lines share one margin.
     `display: contents` on .rowCopy is what lets the label and its description sit on different
     flex lines while staying one element in the DOM (and one node for every caller that builds a
     row). A row with no label — a note, the shared-override footer — keeps its single line: the
     `:has()` guard and the `small:first-child` rule are those two cases. */
  .group { container-type: inline-size; container-name: settingsRow; }

  @container settingsRow (max-width: 620px) {
    .row { flex-wrap: wrap; row-gap: 7px; padding: 12px 14px; }
    .row > * { order: 2; }                                     /* tail items (switch, value, chips, buttons) stay on line one */
    .row > .rowIcon, .row > .spc:first-child { order: 0; }
    .row > .rowCopy { display: contents; }
    .row > .rowCopy > b { order: 1; flex: 1 1 auto; min-width: 0; }
    .row > .rowCopy > small {
      order: 4; flex: 1 1 100%; max-width: none; margin-top: 0; margin-left: 36px;
      color: var(--ink-2); font-size: 13px; line-height: 1.5;
    }
    .row > .rowCopy > small:first-child { order: 1; flex: 1 1 auto; margin-left: 0; color: var(--ink-3); font-size: 11px; }
    /* Beats `.row select.k-field` / `.row input.k-field[type=…]` on specificity — those set the
       widths this shape has to undo. */
    .row:has(> .rowCopy > b) > .k-field {
      order: 5; flex: 1 1 100%; width: auto; min-width: 0; max-width: none; margin-left: 36px;
    }
  }
  .roval { max-width: 240px; }
  .sk1 { height: 13px; flex: 1; max-width: 190px; }
  .sk2 { height: 13px; width: 84px; margin-left: auto; }

  /* Disclosure group: a .row that opens. Same anatomy, chevron at the tail. */
  details.group > summary { display: flex; align-items: center; gap: 11px; min-height: 52px; padding: 10px 14px; cursor: pointer; list-style: none; }
  details.group > summary::-webkit-details-marker { display: none; }
  details.group > summary:hover { background: var(--soft); }
  details.group > summary .chev { display: inline-flex; flex: none; color: var(--ink-3); rotate: -90deg; transition: rotate var(--k-t) var(--k-spring); }
  details.group[open] > summary .chev { rotate: 0deg; }
  details.group[open] > summary { border-bottom: 1px solid var(--line-2); }
  details.group .row:first-of-type::before { display: none; }
  details.group .k-dot { width: 6px; height: 6px; flex: none; }

  /* Installed pane */
  .toolbar { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  .searchBox { position: relative; display: flex; flex: 1; min-width: 0; align-items: center; }
  .searchBox svg { position: absolute; left: 10px; width: 15px; height: 15px; color: var(--ink-3); pointer-events: none; }
  .searchBox input { width: 100%; height: 36px; padding: 0 12px 0 33px; border-radius: 10px; background: var(--surface); }
  .cats { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .appsGrid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }
  .appCard {
    display: grid; min-width: 0; grid-template-columns: minmax(0, 1fr); overflow: hidden;
    border: 1px solid var(--line-2); border-radius: 13px; background: var(--surface); color: var(--ink);
    box-shadow: var(--shadow-xs);
    transition: transform var(--k-t) var(--k-ease), box-shadow var(--k-t) var(--k-ease), border-color var(--k-t) var(--k-ease);
  }
  .appCard:hover { transform: translateY(-2px); border-color: color-mix(in oklab, var(--accent) 30%, var(--line)); box-shadow: var(--shadow-md); }
  .appCard .cardBody:focus-visible { outline: 2px solid var(--color-ring-primary); outline-offset: -2px; }
  .cardPreview { position: relative; overflow: hidden; background: var(--soft); border-bottom: 1px solid var(--line-2); }
  .cardPreview iframe { position: absolute; top: 0; left: 0; border: 0; pointer-events: none; }
  .cardPreview > .k-skel { position: absolute; inset: 0; border-radius: 0; }
  .cardPreview::after { position: absolute; right: 0; bottom: 0; left: 0; height: 26px; content: ""; pointer-events: none; background: linear-gradient(to bottom, transparent, var(--soft)); }
  .cardBody { display: flex; width: 100%; min-width: 0; align-items: center; gap: 11px; padding: 12px 14px; border: 0; background: none; color: inherit; font: inherit; text-align: left; cursor: pointer; }
  .cardText { min-width: 0; flex: 1; }
  .cardText small { display: block; color: var(--accent); font-size: 9px; font-weight: 700; letter-spacing: .055em; text-transform: uppercase; }
  .cardText .t { display: block; margin: 5px 0 4px; overflow: hidden; font-size: 14px; font-weight: 670; letter-spacing: -.015em; text-overflow: ellipsis; white-space: nowrap; }
  .cardText .d { display: block; color: var(--ink-3); font-size: 11px; line-height: 1.4; }
  .cardFoot { display: flex; align-items: center; gap: 6px; margin-top: 7px; color: var(--ink-3); font-size: 10px; }
  .viewPill { margin-left: auto; flex: none; padding: 4px 10px; border-radius: var(--border-radius-full, 999px); background: var(--accent-soft); color: var(--accent-deep); font-size: 10px; font-weight: 680; }

  /* Detail view — replaces the grid in place (no overlay, no scrollport of its own). */
  .backLink {
    display: inline-flex; align-items: center; gap: 7px; margin-bottom: 14px; padding: 6px 12px 6px 9px;
    border: 1px solid var(--line-2); border-radius: var(--border-radius-full, 999px); background: var(--surface);
    color: var(--accent-deep); font: inherit; font-size: 12px; font-weight: 620; cursor: pointer;
  }
  .backLink svg { width: 14px; height: 14px; }
  .detailHead { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; align-items: start; margin-bottom: 16px; }
  .detailTitle { margin: 0 0 6px; font-size: clamp(21px, 6vw, 28px); font-weight: 720; letter-spacing: -.035em; line-height: 1.05; overflow-wrap: anywhere; }
  .detailMeta { display: flex; flex-wrap: wrap; align-items: center; gap: 7px; margin: 0 0 8px; color: var(--ink-3); font-size: 11px; }
  #d-desc { margin: 0; max-width: 52ch; color: var(--ink-2); font-size: 13px; line-height: 1.5; }
  .detailActions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .metaStrip { display: flex; gap: 0; margin: 16px -14px; padding: 14px; overflow-x: auto; border-top: 1px solid var(--line-2); border-bottom: 1px solid var(--line-2); scrollbar-width: none; }
  .metaStrip::-webkit-scrollbar { display: none; }
  .metaStrip div { width: 138px; min-width: 138px; padding: 0 14px; }
  .metaStrip div + div { border-left: 1px solid var(--line-2); }
  .metaStrip small { display: block; margin-bottom: 5px; color: var(--ink-3); font-size: 9px; font-weight: 720; letter-spacing: .065em; text-transform: uppercase; }
  .metaStrip b { display: block; overflow: hidden; font-size: 12px; font-weight: 650; text-overflow: ellipsis; white-space: nowrap; }
  .previewCard { overflow: hidden; border: 1px solid var(--line-2); border-radius: 14px; background: var(--surface); box-shadow: var(--shadow-sm); }
  #pv-wrap iframe { display: block; border: 0; background: transparent; }
  .previewCaption { display: flex; align-items: center; gap: 8px; margin: 0; padding: 11px 14px; border-top: 1px solid var(--line-2); color: var(--ink-3); font-size: 11px; line-height: 1.45; }
  .previewCaption i { width: 6px; height: 6px; flex: none; border-radius: 50%; background: var(--mint); box-shadow: 0 0 0 3px color-mix(in oklab, var(--mint) 16%, transparent); }
  #d-hist { margin: 0; padding-left: 20px; font-size: 11.5px; }
  #d-hist li { margin: 3px 0; color: var(--ink-2); }
  #d-hist .k-btn { padding: 0 8px; margin-left: 6px; font-size: 11px; }
  #d-err { margin-top: 10px; padding: 9px 12px; border: 1px dashed color-mix(in oklab, var(--bad) 34%, var(--line-2)); border-radius: 10px; background: color-mix(in oklab, var(--bad) 6%, var(--surface)); color: var(--bad); font-size: 12px; }
  #d-plan-list li { color: var(--ink-2); line-height: 1.5; }
  #d-plan-list li.kept { color: var(--ink-3); }
  .planCard { margin-top: 12px; padding: 13px 14px; border: 1px solid color-mix(in oklab, var(--bad) 26%, var(--line-2)); border-radius: 13px; background: color-mix(in oklab, var(--bad) 5%, var(--surface)); }

  /* Data pane */
  .own { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; }
  .devt { display: flex; align-items: baseline; gap: 8px; padding: 7px 14px; border-top: 1px solid var(--line-2); font-size: 11.5px; }
  .devt:first-child { border-top: 0; }
  .devt .k-num { color: var(--ink-3); flex: none; }
  .devt .what { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .devt .k-btn { padding: 0 8px; font-size: 11px; flex: none; }

  .note { margin: 0 3px 10px; color: var(--ink-3); font-size: 12px; line-height: 1.5; }
  .note a { color: var(--accent-deep); }
  code { background: var(--soft); border-radius: var(--border-radius-sm, 6px); padding: 1px 5px; font-family: var(--font-mono); font-size: 12px; }

  /* kit classes set their own display, which beats the UA [hidden] rule — restate it */
  #lib-cats[hidden], #d-cat[hidden], #d-open[hidden], #lib-none[hidden], #lib-empty[hidden], #d-delete[hidden],
  #d-cascade-row[hidden], #d-plan[hidden], #d-live[hidden], #saved[hidden] { display: none !important; }

  /* ---- wide state (>560px): the Codex desktop form — fixed left rail, row lists, dense grid ---- */
  @media (min-width: 561px) {
    .shell { grid-template-columns: 200px minmax(0, 1fr); }
    /* The capsule bar stays, flatter: one line, eyebrow beside the name instead of over it —
       the wide form has the rail and .pageTitle doing the introducing, so the bar is a title
       strip, not a header. */
    body:not(.standalone) .appbar { gap: 9px; padding: 7px 13px; }
    body:not(.standalone) .appbar .app-mark { width: 26px; height: 26px; border-radius: 8px; }
    body:not(.standalone) .appbar .app-mark svg { width: 14px; height: 14px; }
    body:not(.standalone) .appbar .barCopy { display: flex; align-items: baseline; gap: 8px; }
    body:not(.standalone) .appbar h1 { margin: 0; font-size: 13.5px; }
    .rail {
      display: block; padding: 20px 12px 24px; border-right: 1px solid var(--line-2);
      background: color-mix(in oklab, var(--surface) 62%, var(--ground));
    }
    .railSearch { position: relative; display: flex; align-items: center; margin-bottom: 14px; }
    .railSearch svg { position: absolute; left: 10px; width: 14px; height: 14px; color: var(--ink-3); pointer-events: none; }
    .railSearch input { width: 100%; height: 33px; padding: 0 10px 0 31px; border-radius: 9px; background: var(--surface); font-size: 12.5px; }
    .identity { display: flex; width: 100%; align-items: center; gap: 10px; margin: 0 0 16px; padding: 8px; border: 0; border-radius: 11px; background: transparent; color: var(--ink); font: inherit; text-align: left; }
    .avatar { display: grid; width: 36px; height: 36px; flex: none; place-items: center; border-radius: 11px; background: linear-gradient(145deg, color-mix(in oklab, var(--accent) 62%, var(--ink-3)), var(--accent-deep)); color: var(--on-solid); }
    .avatar svg { width: 18px; height: 18px; }
    .identity b { display: block; overflow: hidden; font-size: 12.5px; text-overflow: ellipsis; white-space: nowrap; }
    .identity span > span { display: block; overflow: hidden; color: var(--ink-3); font-size: 10.5px; text-overflow: ellipsis; white-space: nowrap; }
    .railNav { display: grid; gap: 3px; }
    .railNav button {
      display: flex; width: 100%; align-items: center; gap: 10px; min-height: 33px; padding: 6px 10px;
      border: 0; border-radius: 9px; background: transparent; color: var(--ink-2);
      font: inherit; font-size: 12.5px; font-weight: 550; text-align: left; cursor: pointer;
      transition: background var(--k-t-fast), color var(--k-t-fast);
    }
    .railNav button:hover { background: var(--soft); color: var(--ink); }
    .railNav button[data-active="true"] { background: var(--accent-deep); color: var(--on-solid); font-weight: 640; }
    .railNav svg { width: 16px; height: 16px; flex: none; }
    .tabstrip { display: none; }
    .pageTitle { display: block; }
    .main { padding: 26px clamp(20px, 4vw, 44px) 46px; }
    .metaStrip { margin-inline: 0; padding-inline: 0; }
    .metaStrip div:first-child { padding-left: 0; }
    .appsGrid { grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); gap: 12px; }
    .appCard { grid-template-columns: minmax(120px, .8fr) minmax(0, 1fr); }
    .cardPreview { border-right: 1px solid var(--line-2); border-bottom: 0; min-height: 138px; }
    .cardBody { flex-direction: column; align-items: stretch; gap: 0; padding: 14px; }
    .detailHead { grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: clamp(20px, 4vw, 40px); align-items: center; }
  }
  @media (min-width: 921px) {
    .shell { grid-template-columns: 236px minmax(0, 1fr); }
  }

<body>
  <main class="shell">
    <!-- The capsule's app bar (CSS decides when it exists — chat contexts only). Same anatomy the
         library apps use: mark · eyebrow · name · status. It is a child of .shell, not of .main,
         because it belongs to the CARD: it spans the rail as well, the way a window's title bar
         does, and in the narrow form (no rail) that is the same single column it always was. -->
    <header class="appbar">
      <span class="app-mark" aria-hidden="true"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 2.5h4.2v4.2H2.5zM9.3 2.5h4.2v4.2H9.3zM2.5 9.3h4.2v4.2H2.5zM9.3 9.3h4.2v4.2H9.3z"/></svg></span>
      <div class="barCopy">
        <span class="eyebrow">open-mcp-apps</span>
        <h1 data-i18n="settings">Settings</h1><!-- literal default: applyI18n only runs once the bridge answers, and a nameless bar in the meantime reads as a broken app -->
      </div>
      <span class="k-badge" id="a-host-bar" hidden></span>
    </header>

    <aside class="rail">
      <label class="railSearch">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="M10.4 10.4 14 14"/></svg>
        <input class="k-field" id="nav-q" type="search" data-i18n-placeholder="searchSettings" data-i18n-aria="searchSettings" autocomplete="off" spellcheck="false">
      </label>
      <div class="identity">
        <span class="avatar" aria-hidden="true"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 2.5h4.2v4.2H2.5zM9.3 2.5h4.2v4.2H9.3zM2.5 9.3h4.2v4.2H2.5zM9.3 9.3h4.2v4.2H9.3z"/></svg></span>
        <span><b>open-mcp-apps</b><span id="a-host-rail" hidden></span></span><!-- starts hidden: no host name is the normal case, and a dash is a placeholder for a value that is usually never coming -->
      </div>
      <nav class="railNav" id="railNav" data-i18n-aria="settings"></nav>
    </aside>

    <section class="main">
      <nav class="tabstrip" id="tabstrip" data-i18n-aria="settings"></nav>

      <header class="pageTitle">
        <span class="pageIcon" aria-hidden="true"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 4.5h6M11.5 4.5h2M8.5 2.5v4M2.5 11.5h2M7.5 11.5h6M4.5 9.5v4"/></svg></span>
        <h1 id="page-h"></h1>
        <p id="page-p"></p>
      </header>

      <div class="status"><span id="saved" class="k-badge ok" hidden></span><!-- transient "Saved" / "Not saved" — content set by flash() --></div>

      <div class="pane on" id="prefs">
        <h2 class="sectionTitle" data-i18n="secGeneral"></h2>
        <div class="group rowlist" id="shared-rows"></div><!-- TOP_KEYS rows, unfolded and header-free -->
        <details class="group" id="more" hidden>
          <summary><span class="rowIcon" data-tone="blue" aria-hidden="true"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M3 8h10M8 3v10"/></svg></span><span class="rowCopy"><b data-i18n="moreOptions"></b><small data-i18n="moreOptionsDetail"></small></span><span class="chev"><svg class="k-icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 6l4.5 4.5L12.5 6"/></svg></span></summary>
          <div id="more-rows"></div>
        </details>
        <div id="comps-wrap" hidden>
          <h2 class="sectionTitle" data-i18n="secApps"></h2>
          <div id="comp-secs"></div>
        </div>
        <p class="note" id="comp-teach" hidden data-i18n="noAppOptions"></p>
        <details class="group" id="advanced" hidden>
          <summary><span class="rowIcon" aria-hidden="true"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M2.5 4h11M2.5 8h11M2.5 12h11"/></svg></span><span class="rowCopy"><b data-i18n="advanced"></b><small data-i18n="advancedDetail"></small></span><span class="chev"><svg class="k-icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 6l4.5 4.5L12.5 6"/></svg></span></summary>
          <div id="adv-rows"></div>
        </details>
        <p class="note" id="ask-ai" style="margin-top:14px" hidden data-i18n="askAi"></p>
      </div>

      <div class="pane" id="guide">
        <h2 class="sectionTitle" data-i18n="guideUse"></h2>
        <div class="group rowlist" id="guide-use"></div>
        <h2 class="sectionTitle" data-i18n="guideModel"></h2>
        <div class="group rowlist" id="guide-model"></div>
      </div>

      <div class="pane" id="about">
        <div class="metaStrip">
          <div><small data-i18n="statApps"></small><b id="a-comps" class="k-num">–</b></div>
          <div><small data-i18n="statSets"></small><b id="a-colls" class="k-num">–</b></div>
          <div><small data-i18n="statItems"></small><b id="a-items" class="k-num">–</b></div>
        </div>
        <h2 class="sectionTitle" data-i18n="secEngine"></h2>
        <div class="group rowlist" id="about-rows"></div>
      </div>

      <div class="pane" id="library">
        <div id="lib-browse">
          <div class="toolbar">
            <label class="searchBox">
              <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="M10.4 10.4 14 14"/></svg>
              <input class="k-field" id="lib-q" type="search" data-i18n-placeholder="searchApps" data-i18n-aria="searchApps" autocomplete="off" spellcheck="false">
            </label>
          </div>
          <div class="cats" id="lib-cats" hidden></div>
          <div class="appsGrid" id="lib-grid"></div>
          <div class="k-empty" id="lib-empty" hidden><!-- first run, empty registry -->
            <svg viewBox="0 0 64 64" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path stroke="var(--ink-3)" stroke-width="2" d="M32 20 52 30.75v13L32 54.5 12 43.75v-13zM12 30.75l20 10.75 20-10.75M32 41.5v13"/>
              <path stroke="var(--accent)" stroke-width="2" d="M24 4l1.7 5.8 5.8 1.7-5.8 1.7L24 19l-1.7-5.8-5.8-1.7 5.8-1.7zM45 10l1 3.4 3.4 1-3.4 1-1 3.4-1-3.4-3.4-1 3.4-1z"/>
            </svg>
            <b data-i18n="emptyTitle"></b>
            <span data-i18n="emptyBody"></span>
          </div>
          <div class="k-empty" id="lib-none" hidden>
            <svg viewBox="0 0 64 64" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path stroke="var(--ink-3)" stroke-width="2" d="M28 8a19 19 0 1 1 0 38 19 19 0 0 1 0-38zM42 41l13 13"/>
              <path stroke="var(--accent)" stroke-width="2" d="M53 8l1.4 4.6 4.6 1.4-4.6 1.4L53 20l-1.4-4.6-4.6-1.4 4.6-1.4z"/>
            </svg>
            <b data-i18n="noMatchTitle"></b>
            <span data-i18n="noMatchBody"></span>
          </div>
        </div>

        <section id="lib-detail" hidden aria-labelledby="d-name">
          <button class="backLink" id="d-close"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.5 3.5 5 8l4.5 4.5"/></svg><span data-i18n="backToInstalled"></span></button>
          <div class="detailHead">
            <div>
              <h1 class="detailTitle" id="d-name"></h1>
              <p class="detailMeta"><span class="k-chip static on" id="d-cat" hidden></span><span class="k-badge info" id="d-ver"></span><span class="k-num" id="d-meta"></span></p>
              <p id="d-desc"></p>
              <div class="detailActions">
                <button class="k-btn" id="d-open"><svg class="k-icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 12 12 4M5.5 4H12v6.5"/></svg><span data-i18n="openInChat"></span></button>
                <button class="k-btn sec" id="d-preview"><svg class="k-icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M5.5 3.5v9l7.5-4.5z"/></svg><span id="d-pv-lbl"></span></button>
                <span class="k-mut" id="d-locked" hidden data-i18n="builtInLocked"></span>
                <button class="k-btn danger" id="d-delete"><svg class="k-icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 4h11M5.5 4V2.5h5V4M4.5 4l.5 9.5h6l.5-9.5M6.7 7v4M9.3 7v4"/></svg><span id="d-del-lbl"></span></button>
              </div>
            </div>
            <div id="d-live" hidden>
              <div class="previewCard">
                <div id="pv-wrap"></div>
                <p class="previewCaption"><i aria-hidden="true"></i><span data-i18n="livePreviewCaption"></span></p>
              </div>
            </div>
          </div>

          <div class="metaStrip">
            <div><small data-i18n="metaStorage"></small><b id="d-store">–</b></div>
            <div><small data-i18n="metaSize"></small><b id="d-size">–</b></div>
            <div><small data-i18n="metaUpdated"></small><b id="d-when">–</b></div>
            <div><small data-i18n="metaAuthor"></small><b id="d-author">–</b></div>
          </div>

          <!-- Cascade opt-in (D-13 ③). Unchecked = the default tombstone: the app goes, its data
               stays and restore_app can bring it back. Checked = delete_app data:"cascade", which
               the engine answers with a PLAN before it removes anything. -->
          <div class="group" id="d-cascade-row" hidden>
            <label class="row">
              <span class="rowIcon" data-tone="bad" aria-hidden="true"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 4h11M5.5 4V2.5h5V4M4.5 4l.5 9.5h6l.5-9.5"/></svg></span>
              <span class="rowCopy"><b data-i18n="cascadeLabel"></b><small data-i18n="cascadeDetail"></small></span>
              <input class="k-switch" type="checkbox" id="d-cascade" data-i18n-aria="cascadeLabel">
            </label>
          </div>
          <div class="planCard" id="d-plan" hidden>
            <p class="k-sub" id="d-plan-what" style="margin:0 0 6px"></p>
            <ul id="d-plan-list" style="margin:0 0 10px;padding-left:18px;font-size:11.5px"></ul>
            <div class="k-row">
              <button class="k-btn ghost" id="d-plan-no"></button>
              <span class="k-grow"></span>
              <button class="k-btn danger" id="d-plan-yes"></button>
            </div>
          </div>
          <p id="d-err" hidden></p>

          <h2 class="sectionTitle" data-i18n="history"></h2>
          <div class="group" style="padding:12px 14px"><ol id="d-hist" class="k-mut"></ol></div>
        </section>
      </div>

      <div class="pane" id="data">
        <h2 class="sectionTitle" data-i18n="secCollections"></h2>
        <p class="note" data-i18n="collectionsNote"></p>
        <div class="group rowlist" id="data-rows"></div>
        <h2 class="sectionTitle" data-i18n="secActivity"></h2>
        <p class="note" id="data-ledger-note" hidden><span data-i18n="ledgerElsewhere"></span> <a id="data-ledger-link" href="#" target="_blank" rel="noopener" data-i18n="ledgerLink"></a></p>
        <div id="data-ledger" hidden>
          <div class="toolbar">
            <select class="k-field k-grow" id="data-coll" data-i18n-aria="collectionFilter"></select>
            <button class="rowAction quiet" id="data-reload" data-i18n="reload"></button>
          </div>
          <div class="group" id="data-events"></div>
        </div>
      </div>

      <div class="pane" id="perms">
        <h2 class="sectionTitle" data-i18n="secPermissions"></h2>
        <p class="note" data-i18n="permsNote"></p>
        <div id="perm-rows"></div>
        <p class="note" id="perm-empty" hidden data-i18n="permsEmpty"></p>
      </div>
    </section>
  </main>

function coercePref(v, fallback) {
  const t = typeof fallback;

    if (v === true  || v === "true"  || v === 1) return true;
    if (v === false || v === "false" || v === 0) return false;
    return fallback;                                   // "25", "yes", {…} → fallback
  }
  if (t === "number") {
    if (typeof v === "number" && Number.isFinite(v)) return v;
    if (typeof v === "string" && v.trim() !== "" && Number.isFinite(Number(v))) return Number(v);
    if (typeof v === "boolean") return v ? 1 : 0;
    return fallback;                                   // "abc", "", {…} → fallback

    if (typeof v === "number" || typeof v === "boolean") return String(v);

    // observer is the trigger. It decides nothing; it only asks for a pass.
    const thumbIO = new IntersectionObserver(queueThumbSync, { rootMargin: MOUNT_MARGIN + "px" });

    // ONE snapshot for ALL thumbnails, fetched by the parent, shared by every child.
    //
    // The thumbnails used to mount with the "readonly" preset — a real child that really calls the
    // host. That looked cheap until a meta app was in the grid: dashboard renders a card per
    // collection, so it fans out one data_list per collection ON MOUNT and runs out of its own
    // per-mount refresh budget at six (measured 2026-07-28 — 10 collections, 4 cards drawn, and a
    // toast that named the APP rather than the preview). A thumbnail has no business doing a full
    // app's data fetching, and that stays true however generous the budget is.
    //
    // So the parent pays once. Rows carry their `collection`, which is exactly the shape the inert
    // machine filters on, so ONE snapshot serves a multi-collection app and a single-collection one
    // alike. Deliberately the same shape composePreviewDoc() takes server-side: the public store
    // page, the share page and this grid are then three consumers of one preview machine rather
    // than three lookalikes that drift (the last drift cost us "Refresh failed" on the public page
    // while the in-app preview was fine).
    const PREVIEW_ROWS_PER_COLLECTION = 24;   // a thumbnail is ~130px: past this nothing is visible
    const PREVIEW_COLLECTION_CAP = 24;        // …and no thumbnail has any business pulling the whole store
    // THE INPUTS GATE — wait for the data, do not answer without it.
    //
    // A thumb mounts from an IntersectionObserver the moment its card nears the viewport. The grid
    // is rendered by loadApps(), and boot only asks data_collections AFTERWARDS — a whole
    // host round trip later. So on first paint the observer normally fires FIRST, and answering it
    // with an empty snapshot is not a rare race, it is the ordinary path.
    //
    // It was permanent, too. An earlier fix stopped MEMOISING the empty answer, which was the right
    // diagnosis of the wrong half: the empty answer was still SERVED, the thumb mounted with zero
    // rows, went into `thumbs`, lost its skeleton, and nothing ever mounted it again. Not caching a
    // wrong answer does not help if you hand it out.
    //
    // Waiting is the whole fix: a thumb that paints 200 ms later is invisible to a person; a thumb
    // that paints empty is wrong for the life of the pane. boot() releases this unconditionally
    // (including on failure), so an empty store answers [] rather than never.
    let previewInputsReady;
    const previewInputsP = new Promise((r) => { previewInputsReady = r; });
    // SINGLE-FLIGHT, and the cached thing is the PROMISE, not its result. Thumbs mount from an
    // IntersectionObserver, so the first screenful starts together: caching the result let five
    // mounts each find `null` and each fetch the whole store — measured 55 data_list calls where
    // 11 were needed. "Fetch once" is a property of the in-flight call, not of the finished one.
    let previewRowsP = null;
    async function previewSnapshot() {
      await previewInputsP;
      if (previewRowsP) return previewRowsP;
      previewRowsP = (async () => {
        const rows = [];
        const eligible = collsCache.filter((c) => c.collection && c.collection !== "settings");
        const colls = eligible.slice(0, PREVIEW_COLLECTION_CAP);
        // SAY WHEN YOU TRUNCATE. A thumbnail has no business pulling the whole store, so the cap
        // stays — but silence about it is the third version of tonight's recurring mistake (the
        // control-plane refusal left no trace; the App Store preview swallowed its own error). An app
        // whose collection falls past the cap renders an empty preview while its data sits right
        // there, and nobody could tell that from a genuinely empty app.
        if (eligible.length > colls.length) {
          console.warn(`[oma] preview snapshot covers ${colls.length} of ${eligible.length} collections; ` +
            `apps bound to the rest will preview empty (thumbnail cap, not missing data)`);
        }
        for (const c of colls) {
          try {
            const r = await oma.callTool("data_list", { collection: c.collection, limit: PREVIEW_ROWS_PER_COLLECTION });
            for (const it of r?.structuredContent?.items || []) rows.push({ collection: c.collection, group: it.group || "", fields: it.fields || {} });
          } catch { /* one unreadable collection must not cost the whole grid its data */ }
        }
        return rows;
      })();
      return previewRowsP;
    }

    // Mount = oma.embed with the INERT preset: zero host IO from the child, reads answered from the
    // shared snapshot, writes pretend to succeed so demo interactions animate. heights:false leaves
    // sizing to .cardPreview's scaled-picture CSS.
    async function mountThumb(th) {
      if (th.dataset.live) return;    // one mount per element (renderLibrary creates fresh elements)
      th.dataset.live = "1";
      const name = th.dataset.name;
      try {
        const all = await previewSnapshot();
        if (!th.isConnected) return;                    // grid re-rendered while the snapshot loaded
        // 🔴 THE FETCH IS SHARED; THE DATA IS NOT. Handing the whole snapshot to every child put one
        // app's rows inside another app's sandboxed document. The cut itself lives in the runtime
        // (childPreviewSnapshot) rather than here: it is both a security boundary AND the answer to
        // "what does this app open on", and the second question already has an owner on the server.
        // An earlier version of this line cut on `row.collection === name`, which is not what an app
        // is bound to — builder-progress lives in build-progress — so 6 of 17 shipped apps previewed
        // empty. We hand over the declaration and let one rule decide.
        //
        // The roster travels too: a meta app asks list_apps, and inert has no host to
        // ask. Names only — the same registry listing this pane already holds.
        const roster = compsCache.map((c) => ({ name: c.name, description: c.description || "" }));
        const h = await oma.embed(name, { into: th, preset: "inert", fit: { width: VIRTUAL_W },
          declaration: declsRaw.get(name),
          snapshot: { items: all, version: 1, apps: roster } });
        if (!th.isConnected) { h.unmount(); return; }   // grid re-rendered while mounting
        th.querySelector(".k-skel")?.remove();
        thumbs.set(th, h);
        queueThumbSync();   // a mount that landed after the pass that wanted it gets reconciled here
      } catch { delete th.dataset.live; /* source fetch failed — skeleton stays, honestly unfinished */ }
    }

    // ---- grid rendering: search field + category chips + app cards ----
    function renderCats() {
      const row = document.getElementById("lib-cats");
      row.innerHTML = "";
      const cats = [...new Set(compsCache.map((c) => c.category_id).filter(Boolean))].sort();
      row.hidden = !cats.length;   // no categories anywhere → the whole chip row disappears
      if (!cats.length) { libCat = ""; return; }
      if (libCat && !cats.includes(libCat)) libCat = "";
      const mk = (label, val) => {
        const b = el("button", "k-chip" + (libCat === val ? " on" : ""), label);
        b.onclick = () => { libCat = val; renderCats(); applyLibFilter(); };
        return b;
      };
      row.append(mk(t("allCategories"), ""));
      for (const c of cats) row.append(mk(c, c));
    }
    function applyLibFilter() {
      const q = document.getElementById("lib-q").value.trim().toLowerCase();
      let visible = 0;
      for (const card of libGrid.querySelectorAll(".appCard")) {
        const c = card._comp;
        const ok = (!q || (c.name + " " + (c.description || "")).toLowerCase().includes(q))
          && (!libCat || c.category_id === libCat);
        card.hidden = !ok;
        if (ok) visible++;
      }
      document.getElementById("lib-empty").hidden = compsCache.length > 0;   // first run: a real invitation, not a blank pane
      document.getElementById("lib-none").hidden = visible > 0 || !compsCache.length;
      queueThumbSync();   // filtering changes which thumbs are on screen, and so which deserve a frame
    }
    function libCard(c, idx) {
      const card = el("div", "appCard");
      card.dataset.name = c.name;
      card.style.setProperty("--i", idx);
      card._comp = c;
      if (WIDE.matches) {
        const th = el("div", "cardPreview");
        th.dataset.name = c.name;
        th.append(el("div", "k-skel"));
        card.append(th);
        thumbIO.observe(th);
      }
      // The card's hit area is a BUTTON and its content is phrasing-only: a heading or a
      // paragraph inside a button is not valid content, and this card is entirely clickable.
      const body = el("button", "cardBody");
      body.type = "button";
      if (!WIDE.matches) body.append(tile("box", ["blue", "mint", "wine", "warn", null, "bad"][hueOf(c.name)]));
      const text = el("span", "cardText");
      if (c.category_id) text.append(el("small", null, c.category_id));
      text.append(el("span", "t", c.name));
      // No version badge: `version` IS the global ledger seq, so a card that says "v43" for an
      // app edited twice invites "what happened to the other 41?". The card already carries the
      // honest pair — size and when it last changed. The count lives in the detail view.
      text.append(el("span", "d k-ellip2", c.description || ""));
      const foot = el("span", "cardFoot");
      foot.append(el("span", "k-num", [kb(c.ui_size), ago(c.updated_at)].filter(Boolean).join(" · ")));
      foot.append(el("span", "viewPill", t("view")));
      text.append(foot);
      body.append(text);
      card.append(body);
      body.onclick = () => openDrawer(c);
      return card;
    }
    // Every app in the registry gets a card — settings/dashboard included.
    //
    // ⚠️ This comment has now been wrong TWICE, in opposite directions, within one day. Both the
    // error and the correction are kept, because the pattern is the lesson (2026-07-29):
    //   · It first said "thumbs are inert" while they were mounted READONLY. Corrected.
    //   · The correction then said "a thumb is an oma.embed with the READONLY preset" — and was
    //     falsified 80 minutes later by the change directly below, which moved thumbs to INERT.
    //     A comment that describes the line under it is not safe from the commit that edits
    //     that line; only a test is.
    //
    // What is true NOW (read mountThumb above, not this paragraph, if they ever disagree again):
    // a thumb is an `oma.embed(..., { preset: "inert" })` — zero host IO from the child, every
    // read answered from the snapshot the pane hands it. Recursion is bounded by inertness
    // itself: a nested Installed tab has no host to mount anything against.
    //
    // Still true, and deliberate: app_html is NOT reachable from a preview (an inert child
    // calls no host tools at all), so a nested Preferences pane renders WITHOUT declared
    // entries. Widening a preview's reach to "read any app's source" is the wrong trade for a
    // 130px thumbnail.
    //
    // Why inert at all: under the old readonly preset each thumb was a real child that really
    // called the host, so a meta app (dashboard fans out one data_list per collection)
    // exhausted its own per-mount refresh budget on mount — measured 2026-07-28.
    function renderLibrary() {
      for (const h of thumbs.values()) h.unmount();   // embed handles hold listeners — release them
      thumbs.clear();
      previewRowsP = null;                            // a re-render means the data may have moved

      renderCats();
      libGrid.innerHTML = "";
      compsCache.forEach((c, i) => libGrid.append(libCard(c, i)));
      applyLibFilter();
      queueThumbSync();
      if (section === "library") libEntrance();
    }
    // First-mount-only entrance (§8.0): the stagger class is added when the Installed pane
    // first shows with cards, then removed after the animation window — filters and
    // re-renders never replay it.
    function libEntrance() {
      if (libEntered || !libGrid.children.length) return;
      libEntered = true;
      libGrid.classList.add("k-stagger");
      setTimeout(() => libGrid.classList.remove("k-stagger"), 700);
    }
    document.getElementById("lib-q").oninput = applyLibFilter;
    // Crossing the breakpoint changes whether the grid mounts thumbs at all — rebuild the cards.
    WIDE.addEventListener("change", () => { if (compsCache.length) renderLibrary(); });

    // ---- detail view (§7.4): info + storage + live RW preview + history + actions ----
    // Not an overlay: the browse grid hides and this section takes its place, so the pane keeps
    // its natural height and nothing needs a scrollport of its own.
    let drawerTrigger = null;
    function showDetail(on) {
      document.getElementById("lib-browse").hidden = on;
      document.getElementById("lib-detail").hidden = !on;
      queueThumbSync();   // the covered grid measures zero, so the pass releases its frames
    }
    function openDrawer(c) {
      stopPreview();
      const ae = document.activeElement;   // reopen-in-place (restore) keeps the original trigger
      if (ae && ae !== document.body && !document.getElementById("lib-detail").contains(ae)) drawerTrigger = ae;
      drawerComp = c;
      disarmDelete();
      document.getElementById("d-err").hidden = true;
      document.getElementById("d-name").textContent = c.name;
      document.getElementById("d-ver").textContent = "";   // filled by loadHistory: a checkpoint count, not the ledger seq
      document.getElementById("d-desc").textContent = c.description || "";
      const cat = document.getElementById("d-cat");
      cat.hidden = !c.category_id;
      cat.textContent = c.category_id || "";
      document.getElementById("d-meta").textContent = "";
      document.getElementById("d-size").textContent = kb(c.ui_size);
      document.getElementById("d-when").textContent = ago(c.updated_at) || "–";
      document.getElementById("d-author").textContent = c.author ? originLabel(c.author) : "–";
      document.getElementById("d-open").hidden = !!oma.standalone;   // no chat to speak to when standalone
      // Danger area honesty: locked system apps get a plain sentence, and until the
      // permissions truth has loaded there is NO delete button — never a dead one.
      const perm = permsCache && permsCache.find((p) => p.name === c.name);
      const deletable = !(!perm || perm.locked);
      document.getElementById("d-delete").hidden = !deletable;
      document.getElementById("d-locked").hidden = !(perm && perm.locked);
      // The cascade opt-in belongs to the delete button: no button, no tick — and it never
      // survives an entry switch, so one app's answer can never travel to another.
      document.getElementById("d-cascade-row").hidden = !deletable;
      document.getElementById("d-cascade").checked = false;
      hidePlan();
      showDetail(true);
      document.getElementById("d-close").focus();
      loadStorage(c);
      loadHistory(c);
    }
    // Storage line: item count from the data_collections cache + lazy file_usage — pure
    // counts, never a quota framing. System collections are plumbing, not user data; an
    // unloaded cache is UNKNOWN, not zero, so the line stays a dash until the count is real.
    function loadStorage(c) {
      const st = document.getElementById("d-store");
      if (SYSTEM_COLLECTIONS.has(c.name) || !collsLoaded) { st.textContent = "–"; return; }
      const coll = collsCache.find((x) => x.collection === c.name);
      const n = coll ? coll.items : 0;
      st.textContent = n === 1 ? t("item1") : t("items", { n });
      oma.callTool("file_list", { app: c.name, limit: 1 }).then((r) => {
        const u = r?.structuredContent?.usage;   // usage rides every file_list page (file_usage retired)
        if (drawerComp !== c || !u || !u.count) return;   // entry switched, or no files → nothing to add
        const kbs = (u.bytes / 1024).toFixed(1);
        st.textContent += " · " + (u.count === 1 ? t("file1", { kb: kbs }) : t("files", { n: u.count, kb: kbs }));
      }).catch(() => {});
    }
    function closeDrawer() {
      stopPreview();
      const name = drawerComp && drawerComp.name;
      drawerComp = null;
      disarmDelete();
      hidePlan();   // an unanswered plan dies with the view — its request_state buys nothing later
      showDetail(false);
      // focus returns to the trigger — or to its rebuilt card when a re-render replaced it
      const tr = drawerTrigger && drawerTrigger.isConnected ? drawerTrigger
        : name && libGrid.querySelector(`.appCard[data-name="${CSS.escape(name)}"] .cardBody`);
      drawerTrigger = null;
      if (tr) tr.focus();
    }
    document.getElementById("d-close").onclick = closeDrawer;
    document.addEventListener("keydown", (e) => { if (e.key === "Escape" && drawerComp) closeDrawer(); });
    document.getElementById("d-open").onclick = () =>
      drawerComp && oma.sendMessage(t("openMsg", { name: drawerComp.name }));

    async function loadHistory(c) {
      const ol = document.getElementById("d-hist");
      ol.innerHTML = "";
      let hist = null;
      try {
        const r = await oma.callTool("app_history", { name: c.name });
        hist = r?.structuredContent?.history || null;
      } catch { hist = null; }
      if (drawerComp !== c) return;   // entry switched while the history was in flight
      if (!hist || !hist.length) hist = [{ checkpoint: 1, ts: c.updated_at, ui_size: c.ui_size }];   // degrade: the current one only
      // Restore = version rollback of a REGISTERED app only (restore_app); locked
      // apps never show it (the engine refuses), and no permissions truth means no button.
      const perm = permsCache && permsCache.find((p) => p.name === c.name);
      const restorable = perm && !perm.locked;
      // "Checkpoint 3 · 2m ago" reads as a history of THIS app. "v43 · 2m ago" reads as a mystery,
      // because 43 counts every write in the store. The engine derives the checkpoint; the version
      // survives as what Restore actually targets.
      document.getElementById("d-ver").textContent = hist.length === 1 ? t("checkpoint1") : t("checkpoints", { n: hist.length });
      for (const h of hist.slice(0, 12)) {
        const label = h.checkpoint ? t("checkpointN", { n: h.checkpoint }) : t("checkpoint");
        const li = el("li", "k-num", [label, ago(h.ts), kb(h.ui_size)].filter(Boolean).join(" · "));
        if (restorable && h.checkpoint !== hist[0].checkpoint) li.append(restoreBtn(c, h.checkpoint));   // hist is newest-first
        ol.append(li);
      }
      if (hist.length > 12) ol.append(el("li", null, t("earlier", { n: hist.length - 12 })));
    }
    // Arm-to-confirm Restore (button → "Really?" → act, ~4s disarm — same pattern as Delete;
    // window.confirm is unreliable in sandboxed iframes). Nothing is lost: the engine re-saves
    // the old html as a NEW version, so you can roll forward again.
    function restoreBtn(c, checkpoint) {
      const b = el("button", "k-btn ghost", t("restore"));
      b.onclick = async () => {
        if (b.dataset.armed !== "1") {
          b.dataset.armed = "1"; b.textContent = t("really");
          setTimeout(() => { b.dataset.armed = ""; b.textContent = t("restore"); }, 4000);
          return;
        }
        b.disabled = true;
        const errEl = document.getElementById("d-err");
        errEl.hidden = true;
        try {
          const r = await oma.callTool("restore_app", { command_id: crypto.randomUUID(), name: c.name, checkpoint });
          if (r && r.isError) throw new Error((r.content && r.content[0] && r.content[0].text) || t("restoreFailed"));
          await loadManifest(c.name);   // the restored html may declare different settings
          await loadApps();       // grid, prefs and version badges refresh
          const cur = compsCache.find((x) => x.name === c.name);
          if (drawerComp === c && cur) openDrawer(cur);   // fresh header + history for the new version
        } catch (e) {
          errEl.textContent = String(e && e.message || e); errEl.hidden = false;
          b.disabled = false; b.dataset.armed = ""; b.textContent = t("restore");
        }
      };
      return b;
    }

    // Preview toggle — the detail preview is a LIVE embed: caps-enforced read-write through
    // the runner machine (local tier keeps wildcard-with-denylist semantics; non-local runs
    // under its engine-computed caps) — the same chokepoint the universal loader uses.
    function pvLabel(on) { document.getElementById("d-pv-lbl").textContent = on ? t("stopPreview") : t("preview"); }
    // A mount takes two awaits, and `pvHandle` is null for both of them — so nothing downstream
    // could tell "no preview" from "a preview on the way". A second click, or switching the entry
    // mid-mount, started a SECOND embed; the winner overwrote pvHandle and the loser's iframe was
    // dropped by innerHTML with its listeners, parent callbacks and liveEmbeds entry still live
    // (reproduced: one leaked message listener per occurrence). `pvGen` is what tells them apart:
    // every start claims a number, and a result whose number is stale unmounts itself and returns.
    let pvGen = 0;
    async function startPreview(c) {
      stopPreview();                       // also bumps pvGen, retiring anything in flight
      const gen = pvGen;
      pvStarting = true;
      document.getElementById("d-live").hidden = false;
      pvLabel(true);
      try {
        const h = await oma.embed(c.name, { into: document.getElementById("pv-wrap"), preset: "live", heights: { min: 140, max: 560 } });
        if (gen !== pvGen) { h.unmount(); return; }   // superseded while mounting
        pvHandle = h;
      } catch (e) {
        if (gen !== pvGen) return;         // a stale failure must not tear down the CURRENT preview
        const errEl = document.getElementById("d-err");
        errEl.textContent = String(e && e.message || e); errEl.hidden = false;
        stopPreview();
      } finally {
        if (gen === pvGen) pvStarting = false;
      }
    }
    function stopPreview() {
      pvGen++;                             // retire any mount still in flight
      pvStarting = false;
      if (pvHandle) { pvHandle.unmount(); pvHandle = null; }
      document.getElementById("pv-wrap").innerHTML = "";
      document.getElementById("d-live").hidden = true;
      pvLabel(false);
    }
    document.getElementById("d-preview").onclick = () => {
      if (!drawerComp) return;
      // "mounting" counts as ON, or the toggle starts a second one instead of cancelling the first.
      if (pvHandle || pvStarting) stopPreview(); else startPreview(drawerComp);
    };

    // Delete — honors the confirm_delete shared pref with an in-widget two-click confirm
    // (window.confirm is unreliable in sandboxed widget iframes), then delete_app.
    //
    // WITH "Delete its data too" ticked it is delete_app data:"cascade", whose confirmation is
    // the ENGINE's, not ours (W1): the first call never deletes — it answers with the disposition
    // plan it recomputed in its own transaction, plus a request_state bound to the world that
    // plan describes. We render the plan (taken, and kept, with the engine's own reason) and
    // re-send the identical call with the state attached. Any write in between invalidates the
    // state, and the engine's answer to that says so in as many words: ask again without it.
    // The two-click arm above stays what it is — a slip guard on OUR button. It is not the
    // confirmation, and cascade demands one even when the pref turns the arming off.
    //
    // 🔴 THIS CARD IS EXTRACTED AND RUN STANDALONE by test/bridge-resilience.mjs §13, with only a
    // handful of stubs in scope. It therefore carries its OWN copy rather than reaching for the
    // app dictionary: `t()` is not in that scope and referencing it would take the section down.
    let delArmed = false, delArmT = 0;
    let delPlan = null;   // {name, state} — a plan the user has been shown, awaiting its second leg
    const DEL_EN = { del: "Delete", really: "Really delete?", reallyData: "Really delete + data?",
      what: 'Deleting "{name}" and its data — permanent, with no undo:',
      items: "{n} items", item1: "1 item", keys: "its settings · {n} keys", key1: "its settings · 1 key",
      none: "no data of its own — only the app itself", kept: "Kept: ",
      cancel: "Cancel", forever: "Delete permanently",
      failed: "Delete failed.", again: " Press Delete again to see the current plan." };
    const DEL_ZH = { del: "删除", really: "确定删除？", reallyData: "确定删除并清数据？",
      what: "正在删除「{name}」及其数据——永久生效，无法撤销：",
      items: "{n} 条", item1: "1 条", keys: "它的设置 · {n} 个键", key1: "它的设置 · 1 个键",
      none: "没有自己的数据——只删应用本身", kept: "保留：",
      cancel: "取消", forever: "永久删除",
      failed: "删除失败。", again: " 再按一次删除可以看到当前的处置计划。" };
    const dt = (k, vars) => {
      const zh = typeof language === "function" && language() === "zh";
      let s = (zh ? DEL_ZH : DEL_EN)[k] ?? DEL_EN[k] ?? k;
      for (const n in (vars || {})) s = s.split("{" + n + "}").join(String(vars[n]));
      return s;
    };
    function confirmDeleteOn() {
      const it = curStored("settings", "confirm_delete") || curStored("", "confirm_delete");
      return coercePref(it ? it.fields.value : undefined, true);
    }
    function disarmDelete() {
      delArmed = false; clearTimeout(delArmT);
      document.getElementById("d-del-lbl").textContent = dt("del");
    }
    function hidePlan() {
      delPlan = null;
      document.getElementById("d-plan").hidden = true;
    }
    function cascadeWanted() { return document.getElementById("d-cascade").checked; }
    /** Render the engine's plan: what goes, and — just as loudly — what stays and why. */
    function showPlan(c, sc) {
      const list = document.getElementById("d-plan-list");
      list.innerHTML = "";
      const rows = Array.isArray(sc.plan) ? sc.plan : [];
      const taken = rows.filter((p) => p.verdict === "exclusive");
      const kept = rows.filter((p) => p.verdict !== "exclusive");
      document.getElementById("d-plan-what").textContent = dt("what", { name: c.name });
      document.getElementById("d-plan-no").textContent = dt("cancel");
      document.getElementById("d-plan-yes").textContent = dt("forever");
      for (const p of taken) list.append(el("li", null, p.collection + " · " + (p.rows === 1 ? dt("item1") : dt("items", { n: p.rows }))));
      if (sc.settings_keys) list.append(el("li", null, sc.settings_keys === 1 ? dt("key1") : dt("keys", { n: sc.settings_keys })));
      if (!taken.length && !sc.settings_keys) list.append(el("li", null, dt("none")));
      for (const p of kept) list.append(el("li", "kept", dt("kept") + p.collection + (p.why ? " (" + p.why + ")" : "")));
      delPlan = { name: c.name, state: sc.request_state };
      document.getElementById("d-plan").hidden = false;
      document.getElementById("d-plan-no").focus();
    }
    /** Everything that follows a delete that actually happened. */
    async function afterDelete(c, cascaded) {
      manifests.delete(c.name);
      declsRaw.delete(c.name);
      hidePlan();
      closeDrawer();
      await loadApps();   // keep-mode history is retained server-side (tombstone); the grid refreshes
      // A cascade emptied collections, so the Data pane's cache is stale in a way loadApps
      // cannot fix. Best-effort: a failed refresh must not read as a failed delete.
      if (cascaded) { try { await loadData(); } catch {} }
    }
    document.getElementById("d-delete").onclick = async () => {
      const c = drawerComp; if (!c) return;
      const errEl = document.getElementById("d-err");
      errEl.hidden = true;
      hidePlan();
      if (confirmDeleteOn() && !delArmed) {
        delArmed = true;
        document.getElementById("d-del-lbl").textContent = cascadeWanted() ? dt("reallyData") : dt("really");
        delArmT = setTimeout(disarmDelete, 4000);
        return;
      }
      disarmDelete();
      try {
        const r = await oma.callTool("delete_app", { command_id: crypto.randomUUID(), name: c.name, actor: "human",
          ...(cascadeWanted() ? { data: "cascade" } : {}) });
        const sc = (r && r.structuredContent) || {};
        // The demand is NOT an error (the engine says so on purpose) — it is the plan.
        if (sc.reason === "confirmation_required") { showPlan(c, sc); return; }
        if (r && r.isError) { errEl.textContent = (r.content && r.content[0] && r.content[0].text) || dt("failed"); errEl.hidden = false; return; }
        await afterDelete(c, !!sc.cascaded);
      } catch (e) {
        errEl.textContent = String(e && e.message || e); errEl.hidden = false;
      }
    };
    document.getElementById("d-plan-no").onclick = () => { hidePlan(); document.getElementById("d-delete").focus(); };
    document.getElementById("d-plan-yes").onclick = async () => {
      const c = drawerComp;
      if (!c || !delPlan || delPlan.name !== c.name) { hidePlan(); return; }   // the view moved on
      const errEl = document.getElementById("d-err");
      errEl.hidden = true;
      const btn = document.getElementById("d-plan-yes");
      btn.disabled = true;
      try {
        // The identical call, plus the state. `data:"cascade"` is restated rather than re-read
        // from the checkbox: the state is bound to the plan the user was shown, and a tick that
        // changed between the two legs must not be able to send a different call with it.
        const r = await oma.callTool("delete_app", { name: c.name, data: "cascade", request_state: delPlan.state,
          command_id: crypto.randomUUID(), actor: "human" });
        const sc = (r && r.structuredContent) || {};
        // The engine reissues rather than guessing when the world moved under the plan; so do we.
        if (sc.reason === "confirmation_required") { showPlan(c, sc); return; }
        if (r && r.isError) {
          // Stale or expired state (something wrote in between). The plan on screen describes a
          // world that no longer exists, so it goes; pressing Delete again asks for a fresh one.
          errEl.textContent = ((r.content && r.content[0] && r.content[0].text) || dt("failed")) + dt("again");
          errEl.hidden = false;
          hidePlan();
          return;
        }
        await afterDelete(c, !!sc.cascaded);
      } catch (e) {
        errEl.textContent = String(e && e.message || e); errEl.hidden = false;
      } finally {
        btn.disabled = false;
      }
    };

    // ---- Data pane (write-set D): collections × ownership × the ledger ----
    // Ownership is DECLARED (an app's manifest collections list), by-name (the
    // default binding convention), or absent — an orphan, which is LEGAL (seeding may precede
    // the app). Adoption is an authoring act, so the button asks the AI rather than editing
    // manifests from here. The ledger view needs `via` and undo, which live on the /rpc
    // internal path only (no AI face carries them) — so it renders in the browser view alone.
    const declsRaw = new Map();   // name -> raw declaration (loadManifest fills it)
    const appMeta = new Map();    // name -> {tier, caps} from the same app_html read (perms pane truth)
    // The grammar keys collections by NAME — {"collections":{"trips":{…}}} — and the store
    // REJECTS the array form outright ("manifest.collections must be an object"). This once
    // tested Array.isArray, so the ownership column was empty for every conforming manifest
    // (2026-07-27 audit, two panels independently).
    const dataComps = new Map();  // name -> row from the FULL registry (archived included)
    const collOwners = (coll) => {
      const names = [];
      for (const name of dataComps.keys()) {
        const d = declsRaw.get(name);
        const decl = d && d.collections && typeof d.collections === "object" && !Array.isArray(d.collections) ? d.collections : null;
        if (decl && Object.prototype.hasOwnProperty.call(decl, coll)) names.push(name);
      }
      return names;
    };
    async function loadData() {
      const box = document.getElementById("data-rows");
      try {
        const r = await oma.callTool("data_collections", {});
        collsCache = r?.structuredContent?.collections || [];
        collsLoaded = true;
      } catch { box.textContent = t("collFailed"); return; }
      // Ownership must see the WHOLE registry: an archived app still stewards its data, and the
      // default list (featured+listed) would silently strip its chip from the Data pane.
      try {
        const full = await oma.callTool("list_apps", { kind: "any", visibility: "any" });
        dataComps.clear();
        for (const c of full?.structuredContent?.apps || []) dataComps.set(c.name, c);
        await Promise.all([...dataComps.keys()].filter((n) => !declsRaw.has(n)).map((n) => loadManifest(n)));
      } catch { for (const c of compsCache) if (!dataComps.has(c.name)) dataComps.set(c.name, c); }
      const compNames = new Set([...dataComps.keys(), ...compsCache.map((c) => c.name)]);
      box.innerHTML = "";
      if (!collsCache.length) box.append(noteRow(t("noData")));
      for (const c of [...collsCache].sort((a, b) => a.collection.localeCompare(b.collection))) {
        const row = el("div", "row");
        row.append(tile("database", SYSTEM_COLLECTIONS.has(c.collection) ? null : "blue"));
        row.append(lbl(c.collection, (c.items === 1 ? t("item1") : t("items", { n: c.items })) + (c.last_activity ? " · " + ago(c.last_activity) : "")));
        const own = el("span", "own");
        const declared = collOwners(c.collection);
        if (declared.length) for (const n of declared) own.append(el("span", "k-chip static on", n));
        else if (SYSTEM_COLLECTIONS.has(c.collection)) own.append(el("span", "k-chip static", t("system")));
        else if (compNames.has(c.collection)) own.append(el("span", "k-chip static", t("byName", { name: c.collection })));
        else {
          own.append(el("span", "k-badge warn", t("orphan")));
          const adopt = el("button", "rowAction", t("adopt"));
          adopt.title = t("adoptTitle");
          adopt.onclick = () => oma.sendMessage(t("adoptMsg", { coll: c.collection }));
          own.append(adopt);
        }
        row.append(own);
        box.append(row);
      }
      const sa = !!oma.standalone;
      document.getElementById("data-ledger").hidden = !sa;
      document.getElementById("data-ledger-note").hidden = sa;
      if (!sa) { document.getElementById("data-ledger-link").href = oma.viewBase + "settings"; return; }
      const sel = document.getElementById("data-coll");
      const cur = sel.value;
      sel.innerHTML = "";
      const all = el("option", null, t("allCollections")); all.value = ""; sel.append(all);
      for (const c of collsCache) { const o = el("option", null, c.collection); o.value = c.collection; sel.append(o); }
      if ([...sel.options].some((o) => o.value === cur)) sel.value = cur;
      loadLedger();
    }
    async function loadLedger() {
      const box = document.getElementById("data-events");
      const coll = document.getElementById("data-coll").value;
      let events = [];
      try {
        const r = await oma.callTool("_ledger_recent", { ...(coll ? { collection: coll } : {}), limit: 50 });
        events = r?.structuredContent?.events || [];
      } catch { box.textContent = t("ledgerFailed"); return; }
      box.innerHTML = "";
      if (!events.length) { const r0 = el("div", "devt"); r0.append(el("span", "what k-mut", t("noActivity"))); box.append(r0); }
      const VERB = { item_added: "added", item_updated: "updated", item_moved: "moved", item_deleted: "deleted",
        component_saved: "saved app", component_deleted: "deleted app", component_archived: "archived",
        component_renamed: "renamed app",
        file_written: "wrote file", file_deleted: "deleted file" };
      for (const ev of events) {
        const row = el("div", "devt");
        row.append(el("span", "k-num", "#" + ev.seq));
        const who = ev.actor + (ev.via && ev.via.app ? " · via " + ev.via.app : "");
        const what = (VERB[ev.type] || ev.type) + " " + (ev.type.startsWith("app_") || ev.type.startsWith("file_") ? ev.id : String(ev.id).slice(0, 8))
          + (ev.fields ? " " + jstr(ev.fields).slice(0, 80) : "") + (ev.to != null ? " → " + (ev.to || "(ungrouped)") : "");
        row.append(el("span", "what k-num", who + " · " + what));
        row.append(el("span", "k-num k-mut", ago(ev.ts)));
        if (ev.undoable) {
          const b = el("button", "k-btn ghost", t("undo"));
          b.onclick = async () => {
            b.disabled = true;
            // Pin the seq we SHOWED: if a concurrent write advanced this target since the pane
            // rendered, the store refuses (stale_undo) rather than reverting the newer write.
            const r = await oma.callTool("_undo_last", { target: ev.id, expected_seq: ev.seq }).catch(() => null);
            if (r && !r.isError) { flashSaved(); loadData(); }
            else { flash(false); if (r && r.structuredContent && r.structuredContent.error === "stale_undo") loadData(); else b.disabled = false; }
          };
          row.append(b);
        }
        box.append(row);
      }
    }
    document.getElementById("data-reload").onclick = loadLedger;
    document.getElementById("data-coll").onchange = loadLedger;

    // ---- boot: About stats, app grid, manifests (settings-design §4.3 data flow) ----
    async function loadApps() {
      const comps = await oma.callTool("list_apps", {});
      compsCache = comps?.structuredContent?.apps || [];
      // COUNT RULE: "N apps" = what the user made or installed — system collections AND locked
      // built-ins are excluded, so a fresh install honestly reads 0. The Installed grid below
      // is the management view and still lists everything, locked included.
      // `locked` rides each list_apps row now; the detail view's permsCache warms right after render.
      const locked = new Set(compsCache.filter((c) => c.locked).map((c) => c.name));
      fetchPerms();
      countUp(document.getElementById("a-comps"), compsCache.filter((c) => !SYSTEM_COLLECTIONS.has(c.name) && !locked.has(c.name)).length);
      renderLibrary();
      renderPrefs();
    }
    async function loadManifest(name) {
      try {
        const sc = (await oma.callTool("app_html", { name }))?.structuredContent || {};
        const d = sc.declaration;
        declsRaw.set(name, d || null);          // the Data pane's ownership source (collections key)
        manifests.set(name, useDeclaration(d)); // the prefs panes' filtered view (settings/uses_shared)
        if (sc.tier) appMeta.set(name, { tier: sc.tier, caps: sc.caps });   // perms pane rides the same read
      }
      catch { declsRaw.set(name, null); manifests.set(name, null); }
    }
    // Everything the dictionary touches that is not rebuilt by a render pass.
    function applyI18n() {
      document.documentElement.lang = language() === "zh" ? "zh-CN" : "en";
      document.title = t("documentTitle");
      for (const node of document.querySelectorAll("[data-i18n]")) node.textContent = t(node.dataset.i18n);
      for (const node of document.querySelectorAll("[data-i18n-placeholder]")) node.placeholder = t(node.dataset.i18nPlaceholder);
      for (const node of document.querySelectorAll("[data-i18n-aria]")) node.setAttribute("aria-label", t(node.dataset.i18nAria));
      pvLabel(!!pvHandle || pvStarting);
      disarmDelete();
      renderNav();
      renderStatic();
    }
    (async () => {
      try {
        // The shared-pref catalog comes from the ENGINE (ui_prefs_schema) — skeleton rows
        // until it lands; an older engine without the tool just leaves the catalog empty
        // (stored rows still render as raw values, with a note).
        try {
          const ps = await oma.callTool("ui_prefs_schema", {});
          const shared = ps?.structuredContent?.shared;
          if (Array.isArray(shared) && shared.length) {
            SHARED_PREFS = shared;
            SHARED_KEYS = new Set(shared.map((s) => s.key));
          }
        } catch {}
        prefsLoading = false;
        renderPrefs();
        document.getElementById("ask-ai").hidden = !!oma.standalone;   // no chat to tell when standalone
        await loadApps();   // grid + stored-key sections appear before manifests finish loading
        const colls = await oma.callTool("data_collections", {});
        collsCache = colls?.structuredContent?.collections || [];
        collsLoaded = true;
        if (drawerComp) loadStorage(drawerComp);   // a detail view opened before the cache landed gets its count now
        const user = collsCache.filter((c) => !SYSTEM_COLLECTIONS.has(c.collection));   // pins/settings rows never count
        countUp(document.getElementById("a-colls"), user.length);
        countUp(document.getElementById("a-items"), user.reduce((n, c) => n + c.items, 0));
        await Promise.all(compsCache.map((c) => loadManifest(c.name).then(() => renderPrefs())));   // sections appear as each manifest lands
      } catch {}
      // Release the thumbnails, whatever happened above. They have been waiting since the grid was
      // rendered — collsCache says WHICH collections to fetch and declsRaw says which of them each
      // app may see, and neither existed when the first cards scrolled into view. Unconditional on
      // purpose: a failed load must let the grid render honestly empty, never leave it waiting.
      previewInputsReady();
      bootingManifests = false;
      renderPrefs();
    })();

    if (oma.standalone) document.body.classList.add("standalone");
    oma.onChange(render);
    // onPrefChange fires on EVERY settings write, and this app writes constantly. Re-running the
    // dictionary pass on each of them would also disarm a two-click Delete mid-arm — so only an
    // actual language change costs anything.
    let langKey = "";
    oma.onPrefChange(() => {
      if (language() === langKey) return;
      langKey = language();
      applyI18n();
    });
    oma.ready((s) => { langKey = language(); applyI18n(); render(s); migrate(); });
  </script>
</body>
