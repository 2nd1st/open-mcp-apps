<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Where your money went this month: a category ring, a pace check against last month, and the day-by-day ledger of purchases. Your AI logs them; you can add one by hand in a line.">
<meta name="oma-category" content="Money">
<title>Spending journal</title>
<style>
  /* Shared primitives (.k-*) — this app's own copy; nothing here comes from the engine. */
  :root{--k-accent:var(--color-text-info,var(--color-ring-primary,#3b6cf6));--k-bad:var(--color-text-danger,#e5484d);--k-ink-4:color-mix(in oklab,var(--color-text-primary) 4%,transparent);--k-ink-7:color-mix(in oklab,var(--color-text-primary) 7%,transparent);--k-t-fast:120ms;--k-t:180ms;--k-ease:cubic-bezier(.2,.8,.3,1);--k-spring:cubic-bezier(.34,1.56,.64,1);--k-surface:var(--color-background-primary)}
  @media (prefers-reduced-motion:reduce){:root{--k-t-fast:0ms;--k-t:0ms}}
  .k-sub,.k-mut{font-size:var(--font-text-sm-size,12.5px)}
  .k-mut{color:var(--color-text-tertiary)}
  .k-btn{display:inline-flex;align-items:center;gap:6px;border:1px solid transparent;border-radius:var(--border-radius-md,10px);padding:6px 12px;font:inherit;font-size:var(--font-text-sm-size,12.5px);font-weight:600;cursor:pointer;background:var(--color-background-inverse);color:var(--color-text-inverse);transition:transform var(--k-t-fast) var(--k-ease),opacity var(--k-t-fast),background var(--k-t-fast)}
  .k-btn:hover{opacity:.9}
  .k-btn:active{transform:scale(.96)}
  .k-btn:disabled{opacity:.45;cursor:default;transform:none}
  .k-btn.sec{background:transparent;color:var(--color-text-primary);border-color:var(--color-border-primary)}
  .k-btn.ghost{background:transparent;color:var(--color-text-secondary)}
  :is(.k-btn.sec,.k-btn.ghost):hover{background:var(--k-ink-4);color:var(--color-text-primary);opacity:1}
  .k-btn.danger{background:transparent;color:var(--k-bad);border-color:color-mix(in oklab,var(--k-bad) 30%,transparent)}
  .k-btn.danger:hover{background:color-mix(in oklab,var(--k-bad) 10%,transparent);opacity:1}
  :is(.k-btn,.k-tab,.k-chip,.k-switch,.k-field):focus-visible{outline:2px solid var(--color-ring-primary,var(--k-accent));outline-offset:1px}
  .k-chip{display:inline-flex;align-items:center;gap:5px;border-radius:var(--border-radius-full,999px);border:1px solid var(--color-border-secondary);background:transparent;color:var(--color-text-secondary);padding:2px 10px;font:inherit;font-size:11.5px;font-weight:550;cursor:pointer;transition:background var(--k-t-fast),color var(--k-t-fast),border-color var(--k-t-fast),transform var(--k-t) var(--k-spring)}
  .k-chip:hover{background:var(--k-ink-4);color:var(--color-text-primary)}
  .k-chip:active{transform:scale(.93)}
  .k-chip.on{background:color-mix(in oklab,var(--k-accent) 10%,transparent);border-color:color-mix(in oklab,var(--k-accent) 28%,transparent);color:var(--k-accent)}
  .k-chip.static{cursor:default}
  .k-chip.static:hover{background:transparent;color:var(--color-text-secondary)}
  .k-chip.static:active{transform:none}
  .k-field{padding:6px 10px;border-radius:var(--border-radius-md,10px);border:1px solid var(--color-border-primary);background:transparent;color:inherit;font:inherit;font-size:var(--font-text-sm-size,12.5px);transition:border-color var(--k-t-fast),box-shadow var(--k-t-fast)}
  .k-field::placeholder{color:var(--color-text-tertiary)}
  .k-field:focus{outline:none;border-color:var(--k-accent);box-shadow:0 0 0 3px color-mix(in oklab,var(--k-accent) 10%,transparent)}
  .k-appbar{display:flex;align-items:center;gap:11px;padding:13px 16px}
  .k-appbar .k-appmark{display:grid;width:34px;height:34px;flex:none;place-items:center;border-radius:11px}
  .k-appbar .k-appmark svg{width:18px;height:18px}
  .k-appbar .k-appcopy{min-width:0;flex:1}
  .k-appbar .k-eyebrow{display:block;margin:0;color:var(--color-text-tertiary);font-size:9.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
  .k-appbar h1{margin:1px 0 0;font-size:15px;font-weight:650;letter-spacing:-.015em}
  body:not(.standalone) .k-appbar{border-bottom:1px solid var(--color-border-secondary);background:var(--k-surface)}
  .k-stage{max-width:760px;margin-inline:auto;overflow-x:clip}

  :root {
    color-scheme: light dark;
    /* The app's one colour of its own: a warm copper, the colour of coins and receipts. */
    --sj: light-dark(#7d3c98, #d3a4ee);
    --sj-soft: color-mix(in oklab, var(--sj) 10%, transparent);
    --sj-line: color-mix(in oklab, var(--sj) 30%, transparent);
  }

  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }

  /* ── app bar ─────────────────────────────────────────────────────────── */
  .sj-mark {
    color: var(--sj);
    background: var(--sj-soft);
    border: 1px solid var(--sj-line);
  }
  .sj-mark svg,
  .ico {
    fill: none;
    stroke: currentColor;
    stroke-width: 1.7;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .ico { width: 16px; height: 16px; flex: none; }
  .ask { flex: none; }
  .ask .ico { color: var(--sj); }

  .err {
    margin: 10px 16px 0;
    padding: 8px 10px;
    border-radius: var(--border-radius-md, 8px);
    color: var(--color-text-danger);
    background: color-mix(in oklab, var(--color-text-danger) 9%, transparent);
    font-size: var(--font-text-sm-size, 12.5px);
  }

  /* ── signature: where the money went ─────────────────────────────────── */
  .where {
    padding: 14px 16px 18px;
  }
  .period {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 10px;
  }
  .period h2 {
    margin: 0;
    font-size: 15px;
    font-weight: 650;
    letter-spacing: -.01em;
  }
  .step {
    display: grid;
    width: 28px;
    height: 28px;
    place-items: center;
    padding: 0;
    border: 1px solid var(--color-border-secondary);
    border-radius: var(--border-radius-full, 999px);
    background: transparent;
    color: var(--color-text-secondary);
  }
  .step:hover:not(:disabled) { color: var(--color-text-primary); background: var(--k-ink-4); }
  .step:disabled { opacity: .35; cursor: default; }
  .period .fx {
    margin-left: auto;
    color: var(--color-text-tertiary);
    font-size: 12px;
    text-align: right;
  }

  .split {
    display: grid;
    grid-template-columns: 212px minmax(0, 1fr);
    align-items: center;
    gap: 28px;
  }

  .ring {
    position: relative;
    width: 212px;
    aspect-ratio: 1;
  }
  .ring svg {
    display: block;
    width: 100%;
    height: 100%;
    transform: rotate(-90deg);
    overflow: visible;
  }
  .ring circle {
    fill: none;
    stroke-width: 18;
  }
  .ring .track { stroke: var(--k-ink-7); }
  .ring .seg { cursor: pointer; }
  .ring .seg.dim { opacity: .28; }
  .ring-mid {
    position: absolute;
    inset: 0;
    display: grid;
    place-content: center;
    gap: 2px;
    text-align: center;
    pointer-events: none;
  }
  .total {
    font-size: 30px;
    font-weight: 700;
    letter-spacing: -.035em;
    line-height: 1.05;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .total small {
    font-size: .56em;
    font-weight: 600;
    letter-spacing: 0;
    color: var(--color-text-secondary);
  }
  .total-sub {
    color: var(--color-text-tertiary);
    font-size: 12px;
  }

  .pace {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    margin: 0 0 12px;
    color: var(--color-text-secondary);
    font-size: 13px;
    line-height: 1.4;
  }
  .pace b { color: var(--color-text-primary); font-weight: 650; }
  .pace .ico { margin-top: 1px; color: var(--sj); }
  .pace:empty { display: none; }

  .legend {
    display: grid;
    margin: 0;
    padding: 0;
    list-style: none;
  }
  .cat {
    position: relative;
    display: grid;
    grid-template-columns: 10px minmax(0, 1fr) auto 38px;
    align-items: center;
    gap: 10px;
    padding: 6px 8px;
    margin: 0 -8px;
    width: calc(100% + 16px);
    border: 0;
    border-radius: var(--border-radius-sm, 6px);
    background: transparent;
    text-align: left;
  }
  .cat:hover { background: var(--k-ink-4); }
  .cat[aria-pressed="true"] { background: var(--sj-soft); }
  .cat .sw {
    width: 10px;
    height: 10px;
    border-radius: 3px;
    background: var(--c);
  }
  .cat .nm {
    min-width: 0;
    font-size: 13.5px;
    font-weight: 550;
    overflow-wrap: anywhere;
  }
  .cat .nm b { font-weight: inherit; }
  .cat .nm span {
    margin-left: 6px;
    color: var(--color-text-tertiary);
    font-size: 11.5px;
    font-weight: 450;
  }
  .cat .amt {
    font-size: 13.5px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .cat .pct {
    color: var(--color-text-tertiary);
    font-size: 12px;
    font-variant-numeric: tabular-nums;
    text-align: right;
  }
  .pip {
    position: absolute;
    right: 50px;
    top: -8px;
    color: var(--sj);
    font-size: 12px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    pointer-events: none;
    opacity: 0;
  }
  .none {
    margin: 0;
    color: var(--color-text-secondary);
    font-size: 13px;
    line-height: 1.5;
  }
  .none .k-btn { margin-top: 8px; }

  /* ── quick add: one line, the rest on request ────────────────────────── */
  .log {
    border-top: 1px solid var(--color-border-secondary);
    padding: 14px 16px 16px;
  }
  .qa {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 104px 150px 36px auto;
    grid-template-areas: "m a c more add";
    gap: 8px;
    align-items: center;
  }
  .qa .merchant { grid-area: m; }
  .qa .amount { grid-area: a; }
  .qa .catin { grid-area: c; }
  .qa .more { grid-area: more; }
  .qa .add { grid-area: add; }
  .qa .k-field { width: 100%; min-width: 0; height: 36px; }
  .qa .add {
    height: 36px;
    background: var(--sj);
    color: light-dark(#fff, #1e0f26);
    font-weight: 650;
  }
  .qa .more {
    width: 36px;
    height: 36px;
    padding: 0;
    justify-content: center;
  }
  .qa .more[aria-expanded="true"] { color: var(--sj); border-color: var(--sj-line); }
  .qa-more {
    display: grid;
    grid-template-columns: 150px 150px 96px minmax(0, 1fr);
    gap: 8px;
    margin-top: 8px;
  }
  .qa-more .k-field { width: 100%; min-width: 0; height: 36px; }
  .qa-more label {
    display: grid;
    gap: 3px;
    min-width: 0;
    color: var(--color-text-tertiary);
    font-size: 11.5px;
  }

  /* ── the ledger ──────────────────────────────────────────────────────── */
  .led-head {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin: 18px 0 4px;
  }
  .led-head h3 {
    margin: 0;
    font-size: 13.5px;
    font-weight: 650;
  }
  .led-head .k-mut { font-variant-numeric: tabular-nums; }
  .led-head .k-chip { margin-left: auto; }
  .ledger {
    max-height: 430px;
    overflow-y: auto;
    overscroll-behavior: contain;
    scrollbar-width: thin;
  }
  .day {
    position: sticky;
    top: 0;
    z-index: 1;
    display: flex;
    justify-content: space-between;
    gap: 8px;
    padding: 10px 0 5px;
    border-bottom: 1px solid var(--color-border-secondary);
    background: var(--k-surface, var(--color-background-primary));
    color: var(--color-text-secondary);
    font-size: 12px;
    font-weight: 600;
  }
  .day span:last-child { font-variant-numeric: tabular-nums; font-weight: 500; }
  .row {
    position: relative;
    display: grid;
    grid-template-columns: 8px minmax(0, 1fr) auto 28px;
    align-items: center;
    gap: 10px;
    min-height: 50px;
    padding: 6px 0;
    border-bottom: 1px solid var(--color-border-secondary);
  }
  .row .sw {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--c, var(--color-text-tertiary));
  }
  .row .who {
    min-width: 0;
    font-size: 14px;
    font-weight: 550;
    overflow-wrap: anywhere;
  }
  .row .meta {
    margin-top: 2px;
    color: var(--color-text-tertiary);
    font-size: 12px;
    line-height: 1.35;
    overflow-wrap: anywhere;
  }
  .row .amt {
    font-size: 14px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .row .amt em {
    margin-left: 4px;
    color: var(--color-text-tertiary);
    font-size: 11px;
    font-style: normal;
    font-weight: 500;
  }
  .row .x {
    display: grid;
    width: 28px;
    height: 28px;
    place-items: center;
    padding: 0;
    border: 0;
    border-radius: var(--border-radius-sm, 6px);
    background: transparent;
    color: var(--color-text-tertiary);
    opacity: 0;
  }
  .row:hover .x,
  .row .x:focus-visible { opacity: 1; }
  .row .x:hover { color: var(--color-text-danger); background: color-mix(in oklab, var(--color-text-danger) 9%, transparent); }
  @media (hover: none) { .row .x { opacity: .7; } }
  .row.pending .amt { color: var(--color-text-secondary); }
  .row.gone { opacity: .35; pointer-events: none; }
  .empty-led {
    padding: 22px 0 8px;
    color: var(--color-text-tertiary);
    font-size: 13px;
    text-align: center;
  }

  /* ── motion: a purchase lands in its category ────────────────────────── */
  @media (prefers-reduced-motion: no-preference) {
    .ring .seg {
      transition:
        stroke-dasharray 650ms var(--k-ease),
        stroke-dashoffset 650ms var(--k-ease),
        stroke 400ms var(--k-ease),
        opacity 200ms;
    }
    .ring .seg.land { animation: seg-land 700ms var(--k-spring); }
    .cat.land { animation: cat-land 1400ms var(--k-ease); }
    .cat.land .sw { animation: sw-pop 520ms var(--k-spring); }
    .cat.land .pip { animation: pip-up 1300ms var(--k-ease); }
    .row.new { animation: row-in 520ms var(--k-spring) both; }
    .row.new .sw { animation: sw-pop 520ms var(--k-spring) 120ms both; }
    .qa .add:active { transform: scale(.95); }

    @keyframes seg-land {
      0% { stroke-width: 18; }
      40% { stroke-width: 28; }
      100% { stroke-width: 18; }
    }
    @keyframes cat-land {
      0%, 35% { background: color-mix(in oklab, var(--sj) 16%, transparent); }
      100% { background: transparent; }
    }
    @keyframes sw-pop {
      0% { transform: scale(.3); }
      60% { transform: scale(1.5); }
      100% { transform: scale(1); }
    }
    @keyframes pip-up {
      0% { opacity: 0; transform: translateY(10px); }
      20% { opacity: 1; transform: translateY(0); }
      75% { opacity: 1; }
      100% { opacity: 0; transform: translateY(-8px); }
    }
    @keyframes row-in {
      from { opacity: 0; transform: translateY(-6px); background: var(--sj-soft); }
    }
  }

  /* ── narrow ──────────────────────────────────────────────────────────── */
  @media (max-width: 600px) {
    .ask span { display: none; }
    .ask { padding: 7px 9px; }
    .split {
      grid-template-columns: 1fr;
      gap: 16px;
    }
    .ring {
      width: 200px;
      margin: 0 auto;
    }
    .qa {
      grid-template-columns: 92px minmax(0, 1fr) 36px auto;
      grid-template-areas: "m m m m" "a c more add";
    }
    .qa-more { grid-template-columns: 1fr 1fr; }
  }
</style>
</head>
<body>
<main class="k-stage" id="app" aria-label="Spending journal">
  <header class="k-appbar">
    <span class="k-appmark sj-mark" aria-hidden="true">
      <svg viewBox="0 0 24 24">
        <path d="M6.5 3.5h11v17l-2.2-1.4-2.1 1.4-2.2-1.4-2.2 1.4-2.3-1.4z"></path>
        <path d="M9.5 8.5h5M9.5 12h5M9.5 15.5h2.5"></path>
      </svg>
    </span>
    <div class="k-appcopy"><h1 data-t="appName">Spending journal</h1></div>
    <button class="k-btn sec ask" id="ask" type="button">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 3.5l1.3 4 4 1.3-4 1.3-1.3 4-1.3-4-4-1.3 4-1.3z"></path>
        <path d="M18 14.5l.6 1.9 1.9.6-1.9.6-.6 1.9-.6-1.9-1.9-.6 1.9-.6z"></path>
      </svg>
      <span data-t="ask">Where did it go?</span>
    </button>
  </header>

  <div class="err" id="err" role="status" aria-live="polite" hidden></div>

  <section class="where" aria-labelledby="periodLabel">
    <div class="period">
      <button class="step" id="prev" type="button" aria-label="Previous month">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 6l-6 6 6 6"></path></svg>
      </button>
      <h2 id="periodLabel">—</h2>
      <button class="step" id="next" type="button" aria-label="Next month">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 6l6 6-6 6"></path></svg>
      </button>
      <span class="fx" id="fx"></span>
    </div>
    <div class="split">
      <div class="ring">
        <svg viewBox="0 0 200 200" id="ringSvg" role="img" aria-label="">
          <circle class="track" cx="100" cy="100" r="82" pathLength="100"></circle>
          <g id="segs"></g>
        </svg>
        <div class="ring-mid">
          <div class="total" id="total" aria-live="polite">—</div>
          <div class="total-sub" id="totalSub"></div>
        </div>
      </div>
      <div class="side">
        <p class="pace" id="pace"></p>
        <ul class="legend" id="legend"></ul>
      </div>
    </div>
  </section>

  <section class="log" aria-labelledby="ledTitle">
    <form class="qa" id="qa" autocomplete="off">
      <input class="k-field merchant" id="fMerchant" required aria-label="Merchant" placeholder="Where — e.g. Corner Market">
      <input class="k-field amount" id="fAmount" type="number" min="0.01" step="0.01" inputmode="decimal" required aria-label="Amount" placeholder="0.00">
      <input class="k-field catin" id="fCat" list="catList" required aria-label="Category" placeholder="Category">
      <datalist id="catList"></datalist>
      <button class="k-btn sec more" id="moreBtn" type="button" aria-expanded="false" aria-controls="qaMore" aria-label="More details">
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h10M18 8h2M4 16h3M11 16h9"></path><circle cx="16" cy="8" r="2"></circle><circle cx="9" cy="16" r="2"></circle></svg>
        </button>
        <button class="k-btn add" id="addBtn" type="submit">
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
          <span data-t="add">Add</span>
        </button>
    </form>
    <div class="qa-more" id="qaMore" hidden>
      <label><span data-t="date">Date</span><input class="k-field" id="fDate" type="date" form="qa" required></label>
      <label><span data-t="payment">Paid with</span><select class="k-field" id="fPay" form="qa"></select></label>
      <label><span data-t="currency">Currency</span><select class="k-field" id="fCur" form="qa"></select></label>
      <label><span data-t="note">Note</span><input class="k-field" id="fNote" form="qa" placeholder=""></label>
    </div>

    <div class="led-head">
      <h3 id="ledTitle" data-t="purchases">Purchases</h3>
      <span class="k-mut" id="ledCount"></span>
      <button class="k-chip on" id="clearCat" type="button" hidden></button>
    </div>
    <div class="ledger" id="ledger" aria-live="polite"></div>
  </section>
</main>

<script type="module">
  const $ = (id) => document.getElementById(id);
  const SVG = "http://www.w3.org/2000/svg";
  const motionOK = () => matchMedia("(prefers-reduced-motion: no-preference)").matches;

  const STR = {
    en: {
      appName: "Spending journal",
      ask: "Where did it go?",
      askAria: "Ask the AI where my money went",
      add: "Add",
      date: "Date",
      payment: "Paid with",
      currency: "Currency",
      note: "Note",
      notePh: "Optional",
      merchantPh: "Where — e.g. Corner Market",
      catPh: "Category",
      merchantAria: "Merchant",
      amountAria: "Amount",
      catAria: "Category",
      more: "More details",
      prev: "Previous month",
      next: "Next month",
      purchases: "Purchases",
      soFar: "so far",
      spentIn: (m) => `spent in ${m}`,
      count: (n) => `${n} ${n === 1 ? "purchase" : "purchases"}`,
      share: (c, p) => `${c}, ${p} percent`,
      paceLess: (d, m, day) => `<b>${d} less</b> than ${m} by day ${day}.`,
      paceMore: (d, m, day) => `<b>${d} more</b> than ${m} by day ${day}.`,
      paceSame: (m, day) => `Right on ${m}'s pace by day ${day}.`,
      vsLess: (d, m) => `<b>${d} less</b> than ${m}.`,
      vsMore: (d, m) => `<b>${d} more</b> than ${m}.`,
      nothingMonth: (m) => `Nothing logged in ${m} yet.`,
      seeMonth: (m) => `See ${m}`,
      firstTime: "Nothing logged yet. Tell the AI “I spent $12 on lunch at Yuzu Corner”, or add one below.",
      otherCur: (n) => `+ ${n} in ${n === 1 ? "another currency" : "other currencies"}`,
      today: "Today",
      yesterday: "Yesterday",
      noDate: "No date",
      emptyCat: "Nothing in this category this month.",
      clearCat: (c) => `${c} ×`,
      del: (m) => `Delete ${m}`,
      saveFailed: "That purchase didn't save — try again.",
      delFailed: "Couldn't delete that one.",
      askFailed: "Couldn't reach the assistant — try again.",
      pays: ["Card", "Apple Pay", "Cash", "Bank transfer"],
      cats: ["Groceries", "Dining", "Transport", "Household", "Health", "Shopping", "Bills", "Entertainment", "Travel"],
    },
    zh: {
      appName: "消费手账",
      ask: "钱去哪了？",
      askAria: "让 AI 分析我的钱都花去哪了",
      add: "记一笔",
      date: "日期",
      payment: "支付方式",
      currency: "货币",
      note: "备注",
      notePh: "可不填",
      merchantPh: "在哪花的 · 例如：楼下便利店",
      catPh: "分类",
      merchantAria: "商家",
      amountAria: "金额",
      catAria: "分类",
      more: "更多信息",
      prev: "上个月",
      next: "下个月",
      purchases: "流水",
      soFar: "本月至今",
      spentIn: (m) => `${m}共花费`,
      count: (n) => `${n} 笔`,
      share: (c, p) => `${c}，占 ${p}%`,
      paceLess: (d, m, day) => `到 ${day} 号，比${m}同期<b>少花 ${d}</b>。`,
      paceMore: (d, m, day) => `到 ${day} 号，比${m}同期<b>多花 ${d}</b>。`,
      paceSame: (m, day) => `到 ${day} 号，和${m}同期持平。`,
      vsLess: (d, m) => `比${m}<b>少花 ${d}</b>。`,
      vsMore: (d, m) => `比${m}<b>多花 ${d}</b>。`,
      nothingMonth: (m) => `${m}还没有记账。`,
      seeMonth: (m) => `看看${m}`,
      firstTime: "还没有记账。跟 AI 说一句「午饭在小满面馆花了 28 块」，或在下面手动记一笔。",
      otherCur: (n) => `另有 ${n} 笔其他货币`,
      today: "今天",
      yesterday: "昨天",
      noDate: "没有日期",
      emptyCat: "这个月这一类还没有消费。",
      clearCat: (c) => `${c} ×`,
      del: (m) => `删除 ${m}`,
      saveFailed: "这笔没存上，请再试一次。",
      delFailed: "没能删除这一笔。",
      askFailed: "没能联系上助手，请重试。",
      pays: ["微信支付", "支付宝", "银行卡", "现金"],
      cats: ["餐饮", "买菜", "交通", "居家", "购物", "娱乐", "健康", "通讯", "旅行"],
    },
  };

  // ── time: facts are stored, judgments are computed here from the clock ──
  const pad = (n) => String(n).padStart(2, "0");
  const isoOf = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const today = () => { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); };
  const dateOnly = (iso) => { const [y, m, d] = String(iso).slice(0, 10).split("-").map(Number); return new Date(y, m - 1, d); };
  const validDate = (s) => /^\d{4}-\d{2}-\d{2}/.test(String(s || "")) && !isNaN(dateOnly(s));
  const monthKeyOf = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}`;
  const shiftMonth = (key, by) => { const [y, m] = key.split("-").map(Number); return monthKeyOf(new Date(y, m - 1 + by, 1)); };
  const daysIn = (key) => { const [y, m] = key.split("-").map(Number); return new Date(y, m, 0).getDate(); };

  const loc = () => { const v = oma.pref("locale", "auto"); return v === "auto" ? navigator.language : v; };
  const lang = () => String(loc()).toLowerCase().startsWith("zh") ? "zh" : "en";
  const T = () => STR[lang()];
  const cur3 = (v, fb) => { const c = String(v || "").trim().toUpperCase(); return /^[A-Z]{3}$/.test(c) ? c : fb; };
  const prefCur = () => cur3(oma.pref("currency", ""), lang() === "zh" ? "CNY" : "USD");

  const money = (n, c, whole) => {
    try {
      return new Intl.NumberFormat(loc(), {
        style: "currency", currency: c, currencyDisplay: "narrowSymbol",
        minimumFractionDigits: whole ? 0 : undefined,
        maximumFractionDigits: whole ? 0 : undefined,
      }).format(Number(n) || 0);
    } catch { return `${c} ${(Number(n) || 0).toFixed(2)}`; }
  };
  const monthName = (key, withYear) => {
    const [y, m] = key.split("-").map(Number);
    const sameYear = y === today().getFullYear();
    return new Intl.DateTimeFormat(loc(), withYear || !sameYear ? { month: "long", year: "numeric" } : { month: "long" }).format(new Date(y, m - 1, 1));
  };
  const dayLabel = (iso) => {
    if (!validDate(iso)) return T().noDate;
    const d = dateOnly(iso);
    const diff = Math.round((today() - d) / 86400000);
    if (diff === 0) return T().today;
    if (diff === 1) return T().yesterday;
    const f = oma.pref("date_format", "auto");
    const [y, m, dd] = String(iso).slice(0, 10).split("-");
    if (f === "yyyy-mm-dd") return `${y}-${m}-${dd}`;
    if (f === "dd/mm/yyyy") return `${dd}/${m}/${y}`;
    if (f === "mm/dd/yyyy") return `${m}/${dd}/${y}`;
    return new Intl.DateTimeFormat(loc(), { weekday: "short", month: "short", day: "numeric" }).format(d);
  };

  // ── state kept outside render(): a re-render can arrive at any moment ──
  let latest = { items: [] };
  let known = null;              // ids already on screen — anything else arriving is "new"
  let viewMonth = null;          // null = follow the current month
  let catFilter = null;
  let pending = [];              // optimistic purchases: { tmp, fields }
  const deleting = new Set();
  const segNodes = new Map();
  const catNodes = new Map();
  const rowNodes = new Map();
  let shownTotal = null;
  let drawn = false;

  // ── one model, one source: every number on screen is derived from it ──
  const entryOf = (it, isPending) => {
    const f = it.fields || {};
    const cat = String(f.category || it.group || "").trim() || (lang() === "zh" ? "未分类" : "Uncategorized");
    return {
      id: it.id,
      pending: !!isPending,
      merchant: String(f.merchant || "").trim() || "—",
      amount: Math.max(0, Number(f.amount) || 0),
      currency: cur3(f.currency, prefCur()),
      date: validDate(f.date) ? String(f.date).slice(0, 10) : "",
      cat,
      pay: String(f.payment_method || "").trim(),
      note: String(f.note || "").trim(),
    };
  };

  function model() {
    const all = [
      ...latest.items.map((it) => entryOf(it, false)),
      ...pending.map((p) => entryOf({ id: p.tmp, fields: p.fields }, true)),
    ];
    const nowKey = monthKeyOf(today());
    const month = viewMonth || nowKey;
    const dated = all.filter((e) => e.date);
    const monthsWithData = [...new Set(dated.map((e) => e.date.slice(0, 7)))].sort();
    const inMonth = (key) => dated.filter((e) => e.date.startsWith(key) && e.amount > 0);
    const rows = inMonth(month);

    // The ring adds up ONE currency; others are listed, never converted.
    const byCur = new Map();
    for (const e of rows) byCur.set(e.currency, (byCur.get(e.currency) || 0) + 1);
    const pc = prefCur();
    const ranked = [...byCur.keys()].sort((a, b) => byCur.get(b) - byCur.get(a));
    const currency = byCur.has(pc) || !ranked.length ? (ranked.length ? pc : dominantCurrency(dated, pc)) : ranked[0];
    const counted = rows.filter((e) => e.currency === currency);
    const total = counted.reduce((s, e) => s + e.amount, 0);

    const cats = new Map();
    for (const e of counted) {
      const c = cats.get(e.cat) || { name: e.cat, total: 0, count: 0 };
      c.total += e.amount;
      c.count += 1;
      cats.set(e.cat, c);
    }
    const categories = [...cats.values()].sort((a, b) => b.total - a.total || a.name.localeCompare(b.name));
    categories.forEach((c, i) => { c.rank = i; c.color = shade(i, categories.length); });

    // Pace: the current month against the previous one up to the same day; a past month against its predecessor whole.
    const prevKey = shiftMonth(month, -1);
    const isNow = month === nowKey;
    const day = today().getDate();
    const prevRows = inMonth(prevKey).filter((e) => e.currency === currency);
    const prevTotal = prevRows
      .filter((e) => !isNow || Number(e.date.slice(8, 10)) <= Math.min(day, daysIn(prevKey)))
      .reduce((s, e) => s + e.amount, 0);
    // A comparison is only honest if the journal already existed at the start of that month:
    // a first month that begins on the 22nd is not "a cheap month".
    const firstDate = dated.map((e) => e.date).sort()[0] || "";
    const prevCovered = !!firstDate && firstDate <= `${prevKey}-07`;

    const earliest = monthsWithData[0] || nowKey;
    const latestKey = [nowKey, monthsWithData[monthsWithData.length - 1] || nowKey].sort().pop();
    const lastDataMonth = [...monthsWithData].reverse().find((k) => k < month) || null;
    const undated = isNow ? all.filter((e) => !e.date) : [];

    return {
      all, month, isNow, day, rows, undated, currency, counted, total, categories,
      prevKey, prevHas: prevCovered && prevRows.length > 0, prevTotal,
      canPrev: month > earliest, canNext: month < latestKey, lastDataMonth,
      otherCount: rows.length - counted.length,
    };
  }

  function dominantCurrency(entries, fb) {
    const n = new Map();
    for (const e of entries) n.set(e.currency, (n.get(e.currency) || 0) + 1);
    return [...n.entries()].sort((a, b) => b[1] - a[1])[0]?.[0] || fb;
  }

  // One accent, stepped by rank: the biggest slice is the full colour, the tail fades toward the page.
  function shade(i, n) {
    const pct = n <= 1 ? 100 : Math.round(100 - (i / Math.max(n - 1, 1)) * 78);
    return `color-mix(in oklab, var(--sj) ${pct}%, var(--color-background-primary))`;
  }

  // ── the ring ────────────────────────────────────────────────────────────
  function renderRing(m, landed) {
    const g = $("segs");
    const gap = m.categories.length > 1 ? 0.7 : 0;
    let start = 0;
    const live = new Set();
    for (const c of m.categories) {
      live.add(c.name);
      const share = m.total ? (c.total / m.total) * 100 : 0;
      const len = Math.max(0.35, share - gap);
      let seg = segNodes.get(c.name);
      if (!seg) {
        seg = document.createElementNS(SVG, "circle");
        seg.setAttribute("class", "seg");
        seg.setAttribute("cx", "100");
        seg.setAttribute("cy", "100");
        seg.setAttribute("r", "82");
        seg.setAttribute("pathLength", "100");
        seg.style.strokeDasharray = `0 100`;
        seg.style.strokeDashoffset = `${-start}`;
        seg.addEventListener("click", () => toggleCat(seg.dataset.cat));
        seg.addEventListener("animationend", () => seg.classList.remove("land"));
        segNodes.set(c.name, seg);
      }
      seg.dataset.cat = c.name;
      g.appendChild(seg);
      seg.style.stroke = c.color;
      seg.classList.toggle("dim", !!catFilter && catFilter !== c.name);
      const dash = `${len} ${100 - len}`;
      const off = `${-start}`;
      if (!drawn && motionOK()) {
        requestAnimationFrame(() => requestAnimationFrame(() => {
          seg.style.strokeDasharray = dash;
          seg.style.strokeDashoffset = off;
        }));
      } else {
        seg.style.strokeDasharray = dash;
        seg.style.strokeDashoffset = off;
      }
      if (landed.has(c.name)) {
        seg.classList.remove("land");
        void seg.getBBox();
        seg.classList.add("land");
      }
      start += share;
    }
    for (const [name, seg] of segNodes) {
      if (!live.has(name)) { seg.remove(); segNodes.delete(name); }
    }
    $("ringSvg").setAttribute("aria-label", m.categories.map((c) => T().share(c.name, Math.round((c.total / m.total) * 100))).join("; ") || "—");
  }

  function setTotal(m) {
    const el = $("total");
    const target = m.total;
    const paint = (v) => {
      const parts = new Intl.NumberFormat(loc(), { style: "currency", currency: m.currency, currencyDisplay: "narrowSymbol" }).formatToParts(v);
      el.replaceChildren();
      let tail = "";
      let head = "";
      let inFrac = false;
      for (const p of parts) {
        if (p.type === "decimal" || p.type === "fraction") inFrac = true;
        if (inFrac && (p.type === "decimal" || p.type === "fraction")) tail += p.value;
        else head += p.value;
      }
      el.append(head);
      if (tail && target >= 0) el.append(Object.assign(document.createElement("small"), { textContent: tail }));
    };
    const from = shownTotal;
    shownTotal = target;
    if (from === null || from === target || !motionOK() || !drawn) { paint(target); return; }
    const t0 = performance.now();
    const step = (t) => {
      const k = Math.min(1, (t - t0) / 600);
      const e = 1 - Math.pow(1 - k, 3);
      paint(from + (target - from) * e);
      if (k < 1 && shownTotal === target) requestAnimationFrame(step);
      else if (shownTotal === target) paint(target);
    };
    requestAnimationFrame(step);
  }

  // ── the legend (and the pace sentence above it) ─────────────────────────
  function renderLegend(m, landed, landedAmt) {
    const ul = $("legend");
    const live = new Set();
    for (const c of m.categories) {
      live.add(c.name);
      let li = catNodes.get(c.name);
      if (!li) {
        li = document.createElement("li");
        const b = document.createElement("button");
        b.type = "button";
        b.className = "cat";
        b.innerHTML = `<span class="sw"></span><span class="nm"><b></b><span></span></span><span class="amt"></span><span class="pct"></span><span class="pip"></span>`;
        b.onclick = () => toggleCat(c.name);
        b.addEventListener("animationend", (ev) => { if (ev.target === b) b.classList.remove("land"); });
        li.append(b);
        catNodes.set(c.name, li);
      }
      const b = li.firstChild;
      b.style.setProperty("--c", c.color);
      b.setAttribute("aria-pressed", String(catFilter === c.name));
      b.querySelector(".nm b").textContent = c.name;
      b.querySelector(".nm span").textContent = T().count(c.count);
      b.querySelector(".amt").textContent = money(c.total, m.currency);
      const pct = (c.total / m.total) * 100;
      b.querySelector(".pct").textContent = pct > 0 && pct < 1 ? "<1%" : `${Math.round(pct)}%`;
      ul.appendChild(li);
      if (landed.has(c.name)) {
        b.querySelector(".pip").textContent = "+" + money(landedAmt.get(c.name) || 0, m.currency);
        b.classList.remove("land");
        void b.offsetWidth;
        b.classList.add("land");
      }
    }
    for (const [name, li] of catNodes) {
      if (!live.has(name)) { li.remove(); catNodes.delete(name); }
    }

    // Nothing to split: say so, and offer the way to where the data is.
    let none = ul.parentNode.querySelector(".none");
    if (!m.categories.length) {
      if (!none) {
        none = document.createElement("div");
        none.className = "none";
        ul.after(none);
      }
      const anyData = m.all.length > 0;
      none.replaceChildren(anyData ? T().nothingMonth(monthName(m.month)) : T().firstTime);
      if (anyData && m.lastDataMonth) {
        const btn = Object.assign(document.createElement("button"), { type: "button", className: "k-btn sec", textContent: T().seeMonth(monthName(m.lastDataMonth)) });
        btn.onclick = () => { viewMonth = m.lastDataMonth; render(); };
        none.append(document.createElement("br"), btn);
      }
    } else if (none) {
      none.remove();
    }

    const pace = $("pace");
    if (!m.categories.length || !m.prevHas) {
      pace.replaceChildren();
    } else {
      const prevName = monthName(m.prevKey);
      const diff = m.total - m.prevTotal;
      const d = money(Math.abs(diff), m.currency, true);
      let text;
      if (Math.abs(diff) < Math.max(1, m.prevTotal * 0.02)) text = m.isNow ? T().paceSame(prevName, m.day) : "";
      else if (m.isNow) text = diff < 0 ? T().paceLess(d, prevName, m.day) : T().paceMore(d, prevName, m.day);
      else text = diff < 0 ? T().vsLess(d, prevName) : T().vsMore(d, prevName);
      const icon = diff > 0
        ? `<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 17l6-6 4 4 6-7"></path><path d="M15 8h5v5"></path></svg>`
        : `<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7l6 6 4-4 6 7"></path><path d="M15 16h5v-5"></path></svg>`;
      pace.innerHTML = text ? `${icon}<span>${text}</span>` : "";
    }
  }

  // ── the ledger: rows are kept by id so nothing re-enters on a refresh ────
  function fillRow(row, e, m) {
    const c = m.categories.find((x) => x.name === e.cat);
    row.style.setProperty("--c", e.currency === m.currency && c ? c.color : "var(--color-text-tertiary)");
    row.classList.toggle("pending", e.pending);
    row.classList.toggle("gone", deleting.has(e.id));
    row.querySelector(".who").textContent = e.merchant;
    row.querySelector(".meta").textContent = [e.cat, e.pay, e.note].filter(Boolean).join(" · ");
    const amt = row.querySelector(".amt");
    amt.textContent = money(e.amount, e.currency);
    if (e.currency !== m.currency) amt.append(Object.assign(document.createElement("em"), { textContent: e.currency }));
    const x = row.querySelector(".x");
    x.setAttribute("aria-label", T().del(e.merchant));
    x.hidden = e.pending;
  }

  function makeRow(e) {
    const row = document.createElement("div");
    row.className = "row";
    row.innerHTML = `<span class="sw" aria-hidden="true"></span><div><div class="who"></div><div class="meta"></div></div><span class="amt"></span>` +
      `<button class="x" type="button"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7L7 17"></path></svg></button>`;
    row.querySelector(".x").onclick = () => removeEntry(row.dataset.id);
    row.addEventListener("animationend", (ev) => { if (ev.target === row) row.classList.remove("new"); });
    return row;
  }

  function renderLedger(m, fresh) {
    const box = $("ledger");
    const list = [...m.rows, ...m.undated]
      .filter((e) => !catFilter || e.cat === catFilter)
      .sort((a, b) => (b.date || "").localeCompare(a.date || "") || (b.pending - a.pending));
    const parts = [];
    let day = null;
    let dayHead = null;
    let dayTotal = 0;
    const closeDay = () => {
      if (dayHead) dayHead.lastChild.textContent = dayTotal ? money(dayTotal, m.currency) : "";
    };
    const used = new Set();
    for (const e of list) {
      if (e.date !== day) {
        closeDay();
        day = e.date;
        dayTotal = 0;
        dayHead = document.createElement("div");
        dayHead.className = "day";
        dayHead.append(Object.assign(document.createElement("span"), { textContent: dayLabel(e.date) }), document.createElement("span"));
        parts.push(dayHead);
      }
      if (e.currency === m.currency) dayTotal += e.amount;
      let row = rowNodes.get(e.id);
      if (!row) {
        row = makeRow(e);
        rowNodes.set(e.id, row);
        if (fresh.has(e.id)) row.classList.add("new");
      }
      row.dataset.id = e.id;
      fillRow(row, e, m);
      used.add(e.id);
      parts.push(row);
    }
    closeDay();
    for (const id of [...rowNodes.keys()]) if (!used.has(id) && !m.all.some((e) => e.id === id)) rowNodes.delete(id);
    if (!list.length && (m.rows.length || catFilter)) {
      parts.push(Object.assign(document.createElement("div"), { className: "empty-led", textContent: T().emptyCat }));
    }
    const top = box.scrollTop;
    box.replaceChildren(...parts);
    box.scrollTop = top;

    $("ledCount").textContent = list.length ? T().count(list.length) : "";
    document.querySelector(".led-head").hidden = !list.length && !catFilter;
    const chip = $("clearCat");
    chip.hidden = !catFilter;
    chip.textContent = catFilter ? T().clearCat(catFilter) : "";
  }

  // ── render: everything from one model, updated in place ─────────────────
  function render(state) {
    if (state) latest = state;
    reconcile();
    const m = model();

    // What is new since the last paint — the purchase that "lands".
    const fresh = new Set();
    const landed = new Set();
    const landedAmt = new Map();
    if (known) {
      for (const e of m.all) {
        if (known.has(e.id)) continue;
        fresh.add(e.id);
        if (e.date.startsWith(m.month) && e.currency === m.currency && e.amount > 0) {
          landed.add(e.cat);
          landedAmt.set(e.cat, (landedAmt.get(e.cat) || 0) + e.amount);
        }
      }
    }
    known = new Set(m.all.map((e) => e.id));

    if (catFilter && !m.categories.some((c) => c.name === catFilter) && !m.rows.some((e) => e.cat === catFilter)) catFilter = null;

    $("periodLabel").textContent = monthName(m.month, true);
    $("prev").disabled = !m.canPrev;
    $("next").disabled = !m.canNext;
    $("fx").textContent = m.otherCount ? T().otherCur(m.otherCount) : "";
    $("totalSub").textContent = m.isNow ? `${T().soFar} · ${T().count(m.counted.length)}` : T().count(m.counted.length);
    setTotal(m);
    renderRing(m, landed);
    renderLegend(m, landed, landedAmt);
    renderLedger(m, fresh);
    fillPickers(m);
    drawn = true;
  }

  // A store snapshot that already carries an optimistic purchase retires it (the node moves with it).
  function reconcile() {
    if (!pending.length) return;
    const ids = new Set(latest.items.map((it) => it.id));
    pending = pending.filter((p) => {
      if (p.id && ids.has(p.id)) {
        adopt(p);
        return false;
      }
      return true;
    });
  }
  function adopt(p) {
    const node = rowNodes.get(p.tmp);
    if (node && !rowNodes.has(p.id)) rowNodes.set(p.id, node);
    rowNodes.delete(p.tmp);
    if (known) { known.delete(p.tmp); known.add(p.id); }
  }

  function toggleCat(name) {
    catFilter = catFilter === name ? null : name;
    render();
  }

  // ── pickers for the quick add, fed by what this journal already uses ────
  function fillPickers(m) {
    const byFreq = (key) => {
      const n = new Map();
      for (const e of m.all) if (e[key]) n.set(e[key], (n.get(e[key]) || 0) + 1);
      return [...n.entries()].sort((a, b) => b[1] - a[1]).map(([k]) => k);
    };
    const cats = [...new Set([...byFreq("cat"), ...T().cats])];
    const dl = $("catList");
    if (dl.dataset.sig !== cats.join("|")) {
      dl.replaceChildren(...cats.map((c) => new Option(c)));
      dl.dataset.sig = cats.join("|");
    }
    const pays = [...new Set([...byFreq("pay"), ...T().pays])];
    const sel = $("fPay");
    if (sel.dataset.sig !== pays.join("|")) {
      const keep = sel.value;
      sel.replaceChildren(...pays.map((p) => new Option(p, p)));
      sel.value = pays.includes(keep) && sel.dataset.touched ? keep : pays[0];
      sel.dataset.sig = pays.join("|");
    }
    const curs = [...new Set([m.currency, prefCur(), ...byFreq("currency"), "USD", "EUR", "GBP", "CNY", "JPY", "AUD", "CAD"])];
    const cs = $("fCur");
    if (cs.dataset.sig !== curs.join("|")) {
      const keep = cs.value;
      cs.replaceChildren(...curs.map((c) => new Option(c, c)));
      cs.value = cs.dataset.touched && curs.includes(keep) ? keep : m.currency;
      cs.dataset.sig = curs.join("|");
    }
  }

  // ── writes: the same shape the AI writes — group = category ──────────────
  $("qa").onsubmit = async (ev) => {
    ev.preventDefault();
    const form = $("qa");
    if (!form.reportValidity()) return;
    const merchant = $("fMerchant").value.trim().replace(/\s+/g, " ");
    const amount = Math.round(Number($("fAmount").value) * 100) / 100;
    const raw = $("fCat").value.trim().replace(/\s+/g, " ");
    const category = raw ? raw.charAt(0).toUpperCase() + raw.slice(1) : "";
    // Details closed = today, computed now (a field filled at mount goes stale past midnight).
    const date = ($("qaMore").hidden ? "" : $("fDate").value) || isoOf(today());
    if (!merchant || !category || !(amount > 0)) return;
    const fields = {
      merchant,
      amount,
      currency: cur3($("fCur").value, prefCur()),
      date,
      category,
      payment_method: $("fPay").value,
      note: $("fNote").value.trim(),
    };

    // Show it landing now; the store's answer confirms or takes it back.
    const p = { tmp: "tmp-" + Math.random().toString(36).slice(2), fields, id: null };
    pending.push(p);
    const month = date.slice(0, 7);
    if (month !== (viewMonth || monthKeyOf(today()))) viewMonth = month === monthKeyOf(today()) ? null : month;
    render();
    $("fMerchant").value = "";
    $("fAmount").value = "";
    $("fNote").value = "";
    $("fMerchant").focus();

    let ack = null;
    try { ack = await oma.addItem({ group: category, fields }); } catch { ack = null; }
    if (ack && ack.ok !== false && ack.id) {
      p.id = ack.id;
      if (latest.items.some((it) => it.id === ack.id)) { pending = pending.filter((x) => x !== p); adopt(p); }
      render();
    } else {
      pending = pending.filter((x) => x !== p);
      rowNodes.delete(p.tmp);
      showError(T().saveFailed);
      render();
    }
  };

  async function removeEntry(id) {
    if (!id || deleting.has(id)) return;
    deleting.add(id);
    render();
    let ack = null;
    try { ack = await oma.deleteItem(id); } catch { ack = null; }
    deleting.delete(id);
    if (!ack || ack.ok === false) {
      if (ack && ack.reason && !/cancel/i.test(String(ack.reason))) showError(T().delFailed);
    }
    render();
  }

  // ── chrome ──────────────────────────────────────────────────────────────
  let errTimer = null;
  function showError(msg) {
    clearTimeout(errTimer);
    $("err").textContent = msg;
    $("err").hidden = false;
    errTimer = setTimeout(() => { $("err").hidden = true; }, 7000);
  }

  function localize() {
    const t = T();
    document.documentElement.lang = lang() === "zh" ? "zh-CN" : "en";
    document.title = t.appName;
    $("app").setAttribute("aria-label", t.appName);
    for (const el of document.querySelectorAll("[data-t]")) el.textContent = t[el.dataset.t];
    $("ask").setAttribute("aria-label", t.askAria);
    $("fMerchant").placeholder = t.merchantPh;
    $("fMerchant").setAttribute("aria-label", t.merchantAria);
    $("fAmount").setAttribute("aria-label", t.amountAria);
    $("fCat").placeholder = t.catPh;
    $("fCat").setAttribute("aria-label", t.catAria);
    $("fNote").placeholder = t.notePh;
    $("moreBtn").setAttribute("aria-label", t.more);
    $("prev").setAttribute("aria-label", t.prev);
    $("next").setAttribute("aria-label", t.next);
  }

  $("moreBtn").onclick = () => {
    const open = $("qaMore").hidden;
    $("qaMore").hidden = !open;
    $("moreBtn").setAttribute("aria-expanded", String(open));
  };
  $("fPay").onchange = () => { $("fPay").dataset.touched = "1"; };
  $("fCur").onchange = () => { $("fCur").dataset.touched = "1"; };
  $("prev").onclick = () => { viewMonth = shiftMonth(viewMonth || monthKeyOf(today()), -1); catFilter = null; render(); };
  $("next").onclick = () => {
    const next = shiftMonth(viewMonth || monthKeyOf(today()), 1);
    viewMonth = next === monthKeyOf(today()) ? null : next;
    catFilter = null;
    render();
  };
  $("clearCat").onclick = () => { catFilter = null; render(); };

  // The hand-off: a proposal with the month's facts, never converting currencies.
  $("ask").onclick = async () => {
    const m = model();
    const cats = m.categories.map((c) => `${c.name}: ${money(c.total, m.currency)} (${c.count})`).join(", ") || "none yet";
    const list = m.counted.slice(0, 40).map((e) => `${e.date} ${e.merchant} ${money(e.amount, e.currency)} [${e.cat}]`).join("; ");
    const pace = m.prevHas
      ? `${monthName(m.prevKey, true)}${m.isNow ? ` up to day ${m.day}` : ""}: ${money(m.prevTotal, m.currency)}. `
      : "";
    $("ask").disabled = true;
    try {
      const r = await oma.sendMessage(
        `Look at my spending journal for ${monthName(m.month, true)}${m.isNow ? " so far" : ""}. ` +
        `In ${m.currency}: ${money(m.total, m.currency)} across ${m.counted.length} purchases. ` +
        `By category: ${cats}. ${pace}Purchases: ${list || "none"}. ` +
        (m.otherCount ? `${m.otherCount} more purchases are in other currencies — keep them separate, don't convert. ` : "") +
        `Where did the money go, what stands out, and what are two or three practical things I could change?`
      );
      if (r && r.isError === true && !r.degraded) showError(T().askFailed);
    } catch {
      showError(T().askFailed);
    } finally {
      $("ask").disabled = false;
    }
  };

  if (oma.standalone) document.body.classList.add("standalone");
  $("fDate").value = isoOf(today());
  oma.ready((s) => { localize(); render(s); });
  oma.onChange((s) => render(s));
  oma.onPrefChange(() => { localize(); render(); });
</script>
</body>
</html>
