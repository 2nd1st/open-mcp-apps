<!--
Hard contract checklist:
[x] 1. Self-contained single HTML file; one module script; runtime uses window.oma only; no external resources or network calls.
[x] 2. #oma-manifest declares object-form collections, settings, uses_shared, strict fields, including image_data.
[x] 3. No install-time seeding; invitation-led empty states; all 15 English sample rows live only in #oma-fixtures with collection keys.
[x] 4. Stored dates are ISO facts; presence, bond, days-until, and annual recurrence are computed at render time with the GUIDE date helpers.
[x] 5. Scroll regions use fixed max-height values and no vh units; the portrait, relationship summary, and conversation actions lead the first view.
[x] 6. Host k-* classes and design tokens are preferred; scene styling uses token-derived color-mix values with no external design dependency.
[x] 7. English is the default UI and fixture language; STR.en / STR.zh are complete and selected from oma.pref("locale").
[x] 8. Every write uses oma.callTool; every conversation CTA uses oma.sendMessage only after a click; visible errors are never swallowed.
[x] 9. No srcdoc and no literal script-closing sequence inside JSON or JavaScript strings.

Acceptance notes: three tabs remain usable at 500px; all three collections self-fetch with data_list(limit:500), onChange refresh, and a 30-second fallback poll. Character follows the centered portrait/pill/key-value profile grammar. Memories are a vertical list with stationery-style inline expansion. About You preserves all seven kinds and edits inline. Light pearl mist is primary; dark is a charcoal pearl variant without a purple-black starfield.
45-day check from 2026-07-27: 2026-09-10 is 46 days after the latest 2026-07-26 memory, so the live status becomes the longing state. The 2026-08-18 birthday rolls forward to 2027-08-18 and shows 342 days remaining, rather than staying overdue.
-->

    "companion-profile": {

        "name": {"type": "string", "required": true},
        "persona": {"type": "string", "required": true},
        "portrait": {"type": "string"},
        "image_data": {"type": "string"},
        "topics": {"type": "array"},
        "status_line": {"type": "string"}
      },
      "strict": true
    },
    "companion-memories": {
      "label_field": "what_we_talked",
      "fields": {
        "date": {"type": "string", "required": true},
        "what_we_talked": {"type": "string", "required": true},
        "my_thought": {"type": "string", "required": true},
        "mood": {"type": "string"}
      },
      "strict": true
    },
    "companion-knows": {
      "label_field": "text",
      "fields": {
        "kind": {
          "type": "string",
          "required": true,
          "enum": ["like", "dislike", "observation", "date", "busy", "must_remember", "goal"]
        },
        "text": {"type": "string", "required": true},
        "date_value": {"type": "string"},
        "starred": {"type": "boolean"}
      },
      "strict": true
    }
  },
  "kind": "app",
  "scene": {"category_id": "ambient-viral"}
}
</script>

    const dateOnly = (iso) => { const [y, m, d] = String(iso).slice(0, 10).split("-").map(Number); return new Date(y, m - 1, d); };
    const today    = () => { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); };
    const daysUntil = (iso) => Math.round((dateOnly(iso) - today()) / 86400000);   // negative = overdue
    // Next occurrence of an anchor repeating every N days — derived, nothing stored, DST-safe:
    const nextOccurrence = (anchorIso, everyDays) => {
      const a = dateOnly(anchorIso);
      const k = Math.max(0, Math.ceil((today() - a) / (everyDays * 86400000)));
      return new Date(a.getFullYear(), a.getMonth(), a.getDate() + k * everyDays);
    };

    function resolveLanguage() {
      const pref = String(oma.pref("locale", "auto") || "auto").toLowerCase();
      const locale = pref === "auto" ? String(navigator.language || "en").toLowerCase() : pref;
      return locale.startsWith("zh") ? "zh" : "en";
    }

    function t(key, vars = {}) {
      const table = STR[language] || STR.en;
      const template = table[key] ?? STR.en[key] ?? key;
      return String(template).replace(/\{(\w+)\}/g, (_, name) => String(vars[name] ?? ""));
    }

    function localeCode() {
      const pref = String(oma.pref("locale", "auto") || "auto");
      if (pref === "auto") return navigator.language || (language === "zh" ? "zh-CN" : "en-US");
      return pref;
    }

    function formatNumber(value) {
      return new Intl.NumberFormat(localeCode()).format(Number(value) || 0);
    }

    function toISO(date) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, "0");
      const d = String(date.getDate()).padStart(2, "0");
      return `${y}-${m}-${d}`;
    }

    function isValidDate(date) {
      return date instanceof Date && Number.isFinite(date.getTime());
    }

    function formatDate(iso, options = { year: "numeric", month: "short", day: "numeric" }) {
      const date = dateOnly(iso);
      if (!isValidDate(date)) return t("date.invalid");
      const format = String(oma.pref("date_format", "auto") || "auto");
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, "0");
      const d = String(date.getDate()).padStart(2, "0");
      if (format === "yyyy-mm-dd") return `${y}-${m}-${d}`;
      if (format === "dd/mm/yyyy") return `${d}/${m}/${y}`;
      if (format === "mm/dd/yyyy") return `${m}/${d}/${y}`;
      return new Intl.DateTimeFormat(localeCode(), options).format(date);
    }

    function nextAnnualIso(iso) {
      const source = dateOnly(iso);
      if (!isValidDate(source)) return "";
      const now = today();
      let next = new Date(now.getFullYear(), source.getMonth(), source.getDate());
      if (next < now) next = new Date(now.getFullYear() + 1, source.getMonth(), source.getDate());
      return toISO(next);
    }

    function applyTranslations() {
      language = resolveLanguage();
      document.documentElement.lang = language === "zh" ? "zh-CN" : "en";
      for (const node of document.querySelectorAll("[data-i18n]")) node.textContent = t(node.dataset.i18n);
      for (const node of document.querySelectorAll("[data-i18n-aria]")) node.setAttribute("aria-label", t(node.dataset.i18nAria));
    }

    function el(tag, className = "", text = "") {

    function showError(message) {

      document.getElementById("retryButton").hidden = true;

    }

    function resultError(result, fallback) {
      const structured = result?.structuredContent;
      if (result && !result.isError && result.ok !== false && structured?.ok !== false) return "";
      const textPart = Array.isArray(result?.content) ? result.content.find((part) => part.type === "text") : null;
      return structured?.note || structured?.reason || result?.note || result?.reason || textPart?.text || fallback;
    }

    async function readCollection(collection) {
      const result = await oma.callTool("data_list", { collection, limit: 500 });
      const error = resultError(result, `${t("error.read")} (${collection})`);
      if (error) throw new Error(error);
      const items = result?.structuredContent?.items;
      if (!Array.isArray(items)) throw new Error(`${t("error.read")} (${collection})`);
      return items;

    function fixtureFallback(state) {
      const data = { profiles: [], memories: [], knows: [] };
      for (const item of state?.items || []) {
        if (item.collection === PROFILE_COLLECTION) data.profiles.push(item);
        if (item.collection === MEMORY_COLLECTION) data.memories.push(item);
        if (item.collection === KNOWS_COLLECTION) data.knows.push(item);
      }
      return data;
    }

    async function refreshCollections(state = latestState) {
      latestState = state || latestState;
      refreshQueued = true;
      if (refreshTask) return refreshTask;
      refreshTask = (async () => {
        while (refreshQueued) {
          refreshQueued = false;
          const [profiles, memories, knows] = await Promise.all(COLLECTIONS.map(readCollection));
          const liveCount = profiles.length + memories.length + knows.length;
          const fixture = liveCount === 0 ? fixtureFallback(latestState) : null;
          latestData = fixture && fixture.profiles.length + fixture.memories.length + fixture.knows.length > 0
            ? fixture
            : { profiles, memories, knows };
          render();
        }
      })().finally(() => { refreshTask = null; });
      return refreshTask;
    }

      if (state) latestState = state;
      void refreshCollections(latestState).catch((error) => {
        document.getElementById("characterLoading").hidden = true;
        showError(String(error?.message || error || t("error.read")));

    function sortByDate(items, direction = "latest") {
      return [...items].sort((a, b) => {
        const delta = String(a.fields.date || "").localeCompare(String(b.fields.date || ""));
        if (delta !== 0) return direction === "oldest" ? delta : -delta;
        return Number(a.position || 0) - Number(b.position || 0);
      });
    }

    function profileOf() {
      return [...latestData.profiles].sort((a, b) => Number(a.position || 0) - Number(b.position || 0))[0] || null;
    }

    function topicsOf(profile) {
      const raw = profile?.fields?.topics;
      if (Array.isArray(raw)) return raw.map((value) => String(value).trim()).filter(Boolean).slice(0, 8);
      if (typeof raw === "string") {
        try {
          const parsed = JSON.parse(raw);
          if (Array.isArray(parsed)) return parsed.map((value) => String(value).trim()).filter(Boolean).slice(0, 8);
        } catch {
          return raw.split("\n").map((value) => value.trim()).filter(Boolean).slice(0, 8);
        }
      }
      return [];

    function relationshipState(memories, knows) {
      const chronological = sortByDate(memories, "oldest").filter((item) => isValidDate(dateOnly(item.fields.date)));

      const recent30 = chronological.filter((item) => {
        const age = -daysUntil(item.fields.date);
        return age >= 0 && age <= 30;

      const score = Math.min(99, 10 + chronological.length * 7 + recent30 * 4 + Math.min(knows.length, 18));

        moodKey = "glowing";
        statusKey = "status.today";
      } else if (daysSince !== null && daysSince <= 6) {
        moodKey = "soft";
        statusKey = "status.near";
      } else if (daysSince !== null && daysSince <= 20) {
        moodKey = "quiet";
        statusKey = "status.quiet";
      } else if (daysSince !== null) {
        moodKey = "longing";
        statusKey = "status.longing";
      }
      const level = score < 28 ? 1 : score < 46 ? 2 : score < 64 ? 3 : score < 82 ? 4 : 5;
      return { daysSince, score, level, moodKey, statusKey };
    }

    function seenLabel(daysSince) {
      if (daysSince === null) return t("seen.never");
      if (daysSince === 0) return t("seen.today");
      if (daysSince === 1) return t("seen.yesterday");
      return t("seen.days", { count: formatNumber(daysSince) });
    }

    async function loadPortrait(profile) {
      const epoch = ++portraitEpoch;
      const image = document.getElementById("portraitImage");
      const fallback = document.getElementById("portraitFallback");
      const inline = String(profile?.fields?.image_data || "").trim();
      const path = String(profile?.fields?.portrait || "").trim();
      image.hidden = false;
      fallback.hidden = true;
      image.onload = () => {
        if (epoch !== portraitEpoch) return;
        image.hidden = false;
        fallback.hidden = true;
      };
      image.onerror = () => {
        if (epoch !== portraitEpoch) return;
        if (image.src !== DEFAULT_PORTRAIT) {
          image.src = DEFAULT_PORTRAIT;
          return;
        }
        image.hidden = true;
        fallback.hidden = false;
      };
      if (inline) {
        image.src = inline;
        return;
      }
      if (path) {
        try {
          const url = path.startsWith("data:image/")
            ? path
            : oma.files && typeof oma.files.url === "function"
              ? await oma.files.url(path)
              : "";
          if (epoch === portraitEpoch && url) {
            image.src = url;
            return;
          }
        } catch {}
      }
      if (epoch === portraitEpoch) image.src = DEFAULT_PORTRAIT;
    }

    function renderSceneActions(name, hasProfile) {
      const root = document.getElementById("sceneGrid");
      root.innerHTML = "";
      for (const scene of SCENES) {
        const button = el("button", "scene-action");
        button.type = "button";
        const mark = el("span", "scene-icon");
        mark.innerHTML = ICONS[scene];
        const copy = el("span", "scene-copy");
        copy.append(el("strong", "", t(`scene.${scene}.title`)), el("span", "", t(`scene.${scene}.desc`)));
        const arrow = el("span", "scene-arrow");
        arrow.innerHTML = ICONS.arrow;
        button.append(mark, copy, arrow);
        button.onclick = () => hasProfile
          ? sendAsUser(t(`prompt.scene.${scene}`, { name }), button)
          : sendAsUser(seedPrompt(), button);
        root.append(button);
      }
    }

    function renderCharacter(profile, memories, knows) {
      document.getElementById("characterLoading").hidden = true;
      document.getElementById("characterContent").hidden = false;
      const relation = relationshipState(memories, knows);
      const name = String(profile?.fields?.name || "").trim() || t("character.unknown");
      const persona = String(profile?.fields?.persona || "").trim() || t("character.emptyPersona");
      const timeless = String(profile?.fields?.status_line || "").trim();
      const status = language === "en" && relation.daysSince !== null && relation.daysSince <= 1 && timeless
        ? timeless
        : t(relation.statusKey);
      document.getElementById("characterName").textContent = name;
      document.getElementById("portraitImage").alt = name;
      document.getElementById("statusLine").textContent = status;
      document.getElementById("moodPill").textContent = t(`mood.${relation.moodKey}`);
      document.getElementById("bondPill").textContent = t(`bond.level${relation.level}`);
      document.getElementById("lastSeenPill").textContent = seenLabel(relation.daysSince);
      document.getElementById("bondValue").textContent = formatNumber(relation.score);
      document.getElementById("memoryMetric").textContent = formatNumber(memories.length);
      document.getElementById("knownMetric").textContent = formatNumber(knows.length);
      document.getElementById("personaText").textContent = persona;
      document.getElementById("portraitWrap").classList.toggle("breathe", Boolean(oma.pref("portrait_motion", true)));
      void loadPortrait(profile);

      const topicList = document.getElementById("topicList");
      topicList.innerHTML = "";
      const topics = topicsOf(profile);
      if (topics.length) {
        for (const topic of topics) {
          const button = el("button", "k-chip", topic);
          button.type = "button";
          button.onclick = () => sendAsUser(t("prompt.topic", { name, topic }), button);
          topicList.append(button);
        }
      } else {
        topicList.append(el("span", "k-mut", t("character.noTopics")));
      }
      document.getElementById("reflectLabel").textContent = profile
        ? t("character.reflect", { name })
        : t("character.begin");
      renderSceneActions(name, Boolean(profile));
    }

    function memoryTitle(item) {
      const text = String(item.fields.what_we_talked || "").trim();
      if (!text) return t("memory.untitled");
      const sentence = text.split(/(?<=[.!?。！？])\s+/)[0] || text;
      return sentence.length > 100 ? `${sentence.slice(0, 97)}…` : sentence;
    }

    function moodLabel(value) {
      const mood = String(value || "").trim().toLowerCase();
      return t(`memory.mood.${mood}`) === `memory.mood.${mood}` ? (mood || t("memory.noMood")) : t(`memory.mood.${mood}`);
    }

    function renderLetter(item, index, name) {
      const letter = el("section", "memory-letter");
      const head = el("header", "letter-head");
      const title = el("strong", "", t("memories.entry", { index: formatNumber(index) }));
      const meta = el("span", "", `${moodLabel(item.fields.mood)} · ${formatDate(item.fields.date)}`);
      const close = el("button", "k-btn ghost letter-close");
      close.type = "button";
      close.setAttribute("aria-label", t("memories.close"));
      close.innerHTML = ICONS.close;
      close.onclick = () => {
        expandedMemoryId = "";
        renderMemories(latestData.memories, profileOf());
      };
      head.append(title, meta, close);
      const talked = el("section", "letter-block");
      talked.append(el("h3", "", t("memory.talked")), el("p", "", String(item.fields.what_we_talked || "")));
      const thought = el("section", "letter-block");
      thought.append(el("h3", "", t("memory.thought")), el("p", "", String(item.fields.my_thought || "")));
      letter.append(head, talked, thought, el("p", "letter-signature", t("memory.signature", { name })));
      return letter;
    }

    function renderMemories(memories, profile) {
      const order = String(oma.pref("memory_order", "latest") || "latest");
      const rows = sortByDate(memories, order === "oldest" ? "oldest" : "latest");
      const root = document.getElementById("memoryList");
      root.innerHTML = "";
      document.getElementById("memoryCollectionCount").textContent = rows.length === 1
        ? t("memories.countOne")
        : t("memories.count", { count: formatNumber(rows.length) });
      if (!rows.length) {
        const empty = el("div", "k-empty");
        empty.innerHTML = '<svg viewBox="0 0 64 64" fill="none" aria-hidden="true"><path stroke="currentColor" stroke-width="1.5" d="M14 13h28a6 6 0 0 1 6 6v34H20a6 6 0 0 1-6-6V13zM14 43c1-3 3-5 7-5h27M25 23h13M25 29h9"/></svg><b></b><span></span><div class="empty-actions"><button class="k-btn" type="button"></button></div>';
        empty.querySelector("b").textContent = t("memories.emptyTitle");
        empty.querySelector("span").textContent = t("memories.emptyText");
        const button = empty.querySelector("button");
        button.textContent = t("memories.emptyAction");
        button.onclick = () => sendReflect(button);
        root.append(empty);
        return;
      }
      const list = el("div", "memory-list");
      const chronological = sortByDate(memories, "oldest");
      const latestId = chronological.at(-1)?.id;
      const name = String(profile?.fields?.name || "").trim() || t("character.unknown");
      for (const item of rows) {
        const index = chronological.findIndex((row) => row.id === item.id) + 1;
        const article = el("article", `memory-item${expandedMemoryId === item.id ? " open" : ""}`);
        const button = el("button", "memory-row");
        button.type = "button";
        button.setAttribute("aria-expanded", String(expandedMemoryId === item.id));
        button.setAttribute("aria-label", `${t("memories.open")}: ${memoryTitle(item)}`);
        const date = dateOnly(item.fields.date);
        const stamp = el("span", "memory-date");
        stamp.append(
          el("strong", "", isValidDate(date) ? formatNumber(date.getDate()) : "—"),
          el("span", "", isValidDate(date) ? new Intl.DateTimeFormat(localeCode(), { month: "short" }).format(date) : "")
        );
        const copy = el("span", "memory-copy");
        copy.append(el("strong", "", memoryTitle(item)), el("span", "", String(item.fields.my_thought || "")));
        const meta = el("span", "memory-meta");
        if (item.id === latestId) meta.append(el("span", "memory-pill new-label", t("memories.new")));
        const mood = String(item.fields.mood || "").trim().toLowerCase().replace(/[^a-z0-9_-]/g, "");
        meta.append(el("span", `memory-pill mood-pill${mood ? ` mood-${mood}` : ""}`, moodLabel(item.fields.mood)));
        const arrow = el("span", "");
        arrow.innerHTML = ICONS.chevron;
        button.append(stamp, copy, meta, arrow);
        button.onclick = () => {
          expandedMemoryId = expandedMemoryId === item.id ? "" : item.id;
          renderMemories(latestData.memories, profileOf());
        };
        article.append(button);
        if (expandedMemoryId === item.id) article.append(renderLetter(item, index, name));
        list.append(article);
      }
      root.append(list);
    }

    function sectionInvite(kind, name) {
      const wrap = el("div", "section-invite");
      const text = el("span", "", t("about.empty"));
      const button = el("button", "k-btn ghost", t("about.invite"));
      button.type = "button";
      button.onclick = () => sendAsUser(t("prompt.know", { name, section: t(`about.kind.${kind}`) }), button);
      wrap.append(text, button);
      return wrap;
    }

    function itemActions(item) {
      const actions = el("div", "know-actions");
      const edit = el("button", "k-btn ghost");
      edit.type = "button";
      edit.title = t("about.edit");
      edit.setAttribute("aria-label", t("about.edit"));
      edit.innerHTML = ICONS.edit;
      edit.onclick = () => {
        editingItemId = editingItemId === item.id ? "" : item.id;
        renderAbout(latestData.knows, profileOf());
        if (editingItemId) requestAnimationFrame(() => document.querySelector(`[data-edit-id="${item.id}"] textarea`)?.focus());
      };
      const remove = el("button", "k-btn ghost");
      remove.type = "button";
      remove.title = t("about.delete");
      remove.setAttribute("aria-label", t("about.delete"));
      remove.innerHTML = ICONS.trash;
      remove.onclick = () => armDelete(remove, item);
      actions.append(edit, remove);
      return actions;
    }

    function knowledgeNode(item) {
      const kind = String(item.fields.kind || "");
      const compact = kind === "like" || kind === "dislike" || kind === "observation";
      const node = el("div", compact ? "know-pill" : `know-row${item.fields.starred ? " starred" : ""}`);
      if (compact) {
        node.append(el("span", "", String(item.fields.text || "")), itemActions(item));
        return node;
      }
      const copy = el("div", "know-copy");
      copy.append(el("p", "", String(item.fields.text || "")));
      if (kind === "date") {
        const nextIso = nextAnnualIso(item.fields.date_value);
        const left = nextIso ? daysUntil(nextIso) : null;
        const line = el("div", `know-date${left !== null && left <= 14 ? " soon" : ""}`);
        line.innerHTML = ICONS.calendar;
        const label = el("span");
        if (!nextIso) label.textContent = t("date.invalid");
        else {
          const relative = left === 0 ? t("date.today") : left === 1 ? t("date.tomorrow") : t("date.days", { count: formatNumber(left) });
          label.textContent = `${formatDate(nextIso, { month: "short", day: "numeric" })} · ${relative}`;
        }
        line.append(label);
        copy.append(line);
      }
      node.append(copy, itemActions(item));
      return node;
    }

    function inlineEdit(item) {
      const form = el("form", "inline-edit");
      form.dataset.editId = item.id;
      const textLabel = el("label", "field-label");
      textLabel.append(el("span", "", t("edit.memory")));
      const textarea = el("textarea", "k-field");
      textarea.name = "text";
      textarea.required = true;
      textarea.maxLength = 600;
      textarea.value = String(item.fields.text || "");
      textLabel.append(textarea);
      form.append(textLabel);
      if (item.fields.kind === "date") {
        const dateLabel = el("label", "field-label");
        dateLabel.append(el("span", "", t("edit.date")));
        const input = el("input", "k-field");
        input.name = "date";
        input.type = "date";
        input.required = true;
        input.value = String(item.fields.date_value || "").slice(0, 10);
        dateLabel.append(input);
        form.append(dateLabel);
      }
      const starLabel = el("label", "k-row");
      const star = el("input", "k-switch");
      star.name = "starred";
      star.type = "checkbox";
      star.checked = Boolean(item.fields.starred);
      starLabel.append(star, el("span", "k-grow", t("edit.starred")));
      const footer = el("footer", "edit-footer");
      const cancel = el("button", "k-btn ghost", t("action.cancel"));
      cancel.type = "button";
      cancel.onclick = () => {
        editingItemId = "";
        renderAbout(latestData.knows, profileOf());
      };
      const save = el("button", "k-btn", t("action.save"));
      save.type = "submit";
      footer.append(cancel, save);
      form.append(starLabel, footer);
      form.onsubmit = async (event) => {
        event.preventDefault();
        if (!form.reportValidity()) return;
        save.disabled = true;
        clearError();
        try {
          await updateKnowledge(item, {
            text: textarea.value.trim(),
            date_value: item.fields.kind === "date" ? form.elements.date.value : "",
            starred: star.checked
          });
          editingItemId = "";
          await refreshCollections();
          showStatus(t("action.saved"));
        } catch (error) {
          showError(String(error?.message || t("error.write")));
        } finally {
          save.disabled = false;
        }
      };
      return form;
    }

    function renderAbout(knows, profile) {
      const stack = document.getElementById("aboutStack");
      stack.innerHTML = "";
      document.getElementById("knowsCollectionCount").textContent = t("about.count", { count: formatNumber(knows.length) });
      const name = String(profile?.fields?.name || "").trim() || t("character.unknown");
      for (const kind of KIND_ORDER) {
        const section = el("section", `about-section${kind === "must_remember" ? " must" : ""}`);
        const head = el("header", "about-head");
        const mark = el("span", "about-icon");
        mark.innerHTML = kindIcon(kind);
        const title = el("span", "about-title");
        title.append(el("strong", "", t(`about.kind.${kind}`)), el("span", "", t(`about.desc.${kind}`)));
        const rows = knows.filter((item) => item.fields.kind === kind).sort((a, b) => {
          const starDelta = Number(Boolean(b.fields.starred)) - Number(Boolean(a.fields.starred));
          return starDelta || Number(a.position || 0) - Number(b.position || 0);
        });
        head.append(mark, title, el("span", "k-badge k-num about-count", formatNumber(rows.length)));
        const body = el("div", "about-body");
        if (!rows.length) body.append(sectionInvite(kind, name));
        for (const item of rows) {
          body.append(knowledgeNode(item));
          if (editingItemId === item.id) body.append(inlineEdit(item));
        }
        section.append(head, body);
        stack.append(section);
      }
    }

    function renderTabs() {
      for (const tab of document.querySelectorAll("#tabs .k-tab")) {
        const on = tab.dataset.tab === activeTab;
        tab.classList.toggle("on", on);
        tab.setAttribute("aria-selected", String(on));
      }
      for (const panel of document.querySelectorAll(".panel")) panel.classList.toggle("on", panel.id === `panel-${activeTab}`);
    }

    function render() {
      applyTranslations();
      document.getElementById("app").classList.toggle("compact", oma.pref("density", "comfortable") === "compact");
      const profile = profileOf();
      const memories = latestData.memories;
      const knows = latestData.knows;
      const memoryBadge = document.getElementById("memoryCountBadge");
      const memoryBadgeLabel = memories.length === 1
        ? t("memories.countOne")
        : t("memories.count", { count: formatNumber(memories.length) });
      memoryBadge.dataset.label = memoryBadgeLabel;
      memoryBadge.setAttribute("aria-label", memoryBadgeLabel);
      renderCharacter(profile, memories, knows);
      renderMemories(memories, profile);
      renderAbout(knows, profile);
      renderTabs();
    }

    async function sendAsUser(message, button) {
      if (!message || !button) return;
      clearError();
      const oldDisabled = button.disabled;
      button.disabled = true;
      try {
        await Promise.resolve(oma.sendMessage(message));
      } catch (error) {
        showError(String(error?.message || t("error.write")));
      } finally {
        button.disabled = oldDisabled;
      }
    }

    function seedPrompt() {
      const date = toISO(today());
      const userName = String(oma.pref("user_name", "") || "").trim();
      const prompt = t("prompt.seed", { date });
      if (!userName) return prompt;
      return language === "zh" ? `我的称呼是 ${userName}。${prompt}` : `My name is ${userName}. ${prompt}`;
    }

    function sendReflect(button) {
      const profile = profileOf();
      if (!profile) return sendAsUser(seedPrompt(), button);
      const name = String(profile.fields.name || t("character.unknown"));
      return sendAsUser(t("prompt.reflect", { name, date: toISO(today()) }), button);
    }

    async function updateKnowledge(item, fields) {
      const result = await oma.callTool("data_update_item", {
        command_id: crypto.randomUUID(),
        id: item.id,
        expected_version: item.version,
        fields,
        actor: "human"
      });
      const error = resultError(result, t("error.write"));
      if (error) throw new Error(error);
    }

    async function deleteKnowledge(item) {
      const result = await oma.callTool("data_delete_item", {
        command_id: crypto.randomUUID(),
        id: item.id,
        expected_version: item.version,
        actor: "human"
      });
      const error = resultError(result, t("error.write"));
      if (error) throw new Error(error);
    }

    async function armDelete(button, item) {
      if (oma.pref("confirm_delete", true) && button.dataset.armed !== "1") {
        button.dataset.armed = "1";
        button.classList.add("danger-armed");
        button.textContent = t("about.deleteSure");
        setTimeout(() => {
          if (button.dataset.armed !== "1") return;
          button.dataset.armed = "";
          button.classList.remove("danger-armed");
          button.innerHTML = ICONS.trash;
        }, 3000);
        return;
      }
      button.disabled = true;
      clearError();
      try {
        await deleteKnowledge(item);
        if (editingItemId === item.id) editingItemId = "";
        await refreshCollections();
        showStatus(t("action.deleted"));
      } catch (error) {
        showError(String(error?.message || t("error.write")));
      } finally {
        button.disabled = false;
      }
    }

    document.getElementById("tabs").onclick = (event) => {
      const tab = event.target.closest(".k-tab");
      if (!tab) return;
      activeTab = tab.dataset.tab;
      renderTabs();
    };

    document.getElementById("reflectButton").onclick = (event) => sendReflect(event.currentTarget);
    document.getElementById("retryButton").onclick = () => requestRefresh(latestState);

    void nextOccurrence;
    oma.ready(requestRefresh);
    oma.onChange(requestRefresh);
    oma.onPrefChange(render);
    setInterval(requestRefresh, 30000);
  </script>
</body>
</html>
